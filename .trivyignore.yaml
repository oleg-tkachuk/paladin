vulnerabilities:
  - id: GO-2026-5932
    statement: >-
      An advisory that golang.org/x/crypto/openpgp is unmaintained, with no
      fixed version to move to. Nothing here imports it: govulncheck, which
      resolves reachability rather than presence, reports "0 vulnerabilities in
      packages you import". Revisit if that ever stops being true.

misconfigurations:
  - id: KSV-0110
    statement: >-
      The charts install into the release namespace, which the operator picks
      with `helm install -n`; every namespaced template sets it. Trivy renders
      the charts without one, so it sees `default`.
  - id: KSV-0125
    statement: >-
      The images come from the project's own GHCR packages by default, and the
      registry is the operator's choice through image.repository. Trivy's
      built-in list of trusted registries does not include ghcr.io.
  - id: KSV-0041
    statement: >-
      The secret-reader ClusterRole (rbac.secretReader.clusterWide) grants
      `get` on an explicit resourceNames list of the Secrets the chart reads,
      never list or watch. Trivy flags any Secret rule without reading
      resourceNames.
  - id: KSV-0113
    statement: >-
      The namespaced form of the same secret-reader rule: `get` on an explicit
      resourceNames list.
  - id: KSV-01010
    statement: >-
      Matches key names in the config ConfigMap: `key` inside the
      `*_secret: {name, key}` references, and access_key, secret_key and dsn,
      which the chart leaves empty or renders without a password; the values
      come from Secrets at boot.
  - id: KSV-0109
    statement: >-
      Matches shared_secret, which the chart renders empty and resolves
      through shared_secret_ref, and health_snapshot_token, which has no Secret
      reference yet — tracked in BACKLOG.md under "health_snapshot_token is
      read from the ConfigMap"; drop this entry with that one.
