# Repo-root pre-commit config covering both backend/ and frontend/.
# Hooks that need a Go module cwd run via local entries that cd into
# backend/ first. Frontend formatting is handled by lefthook (eslint /
# prettier on staged TS); pre-commit handles cross-cutting hygiene
# (trailing whitespace, end-of-file, yaml/json validity).

# Excludes target generated / vendored trees we don't author by hand.
# Pattern is anchored so a stray "vendor" inside source paths still
# gets linted.
exclude: |
  (?x)^(
    sdk/go/gen/.*|
    backend/internal/store/postgres/sqlc/.*|
    frontend/src/gen/.*|
    frontend/\.next/.*|
    frontend/node_modules/.*
  )$

repos:
  - repo: local
    hooks:
      - id: jq-check
        name: check json files with jq
        description: parse every staged JSON file with jq
        entry: ./.pre-commit/scripts/jq_check.sh
        language: script
        types: [json]
        stages: [pre-commit, pre-push, manual]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates contain Go-template `{{ ... }}` that breaks
        # PyYAML; skip them — `helm lint` covers chart validity.
        exclude: 'deploy/chart/.*templates/.*\.yaml$'
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/google/yamlfmt
    rev: v0.20.0
    hooks:
      - id: yamlfmt
        # yamlfmt also chokes on Helm templates and proto-generated
        # buf.lock files; same exclusion as check-yaml.
        exclude: 'deploy/chart/.*templates/.*\.yaml$|.*buf\.lock$'

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-mod-tidy
        # go-mod-tidy must run inside the Go module dir.
        files: ^backend/
        args: [-C, backend]
