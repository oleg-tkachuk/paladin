app:
  name: paladin
  env: local # local|staging|prod

logger:
  level: debug
  format: json
  development: false
  disable_caller: false
  disable_stacktrace: false
  sampling:
    enabled: true
    initial: 100
    thereafter: 100
  fields:
    service: paladin
    env: local

server:
  mode: release
  name: paladin
  http:
    addr: "0.0.0.0:8080"
    read_header_timeout: 5s
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 90s

    max_header_bytes: 1048576 # 1 MiB
    max_body_bytes: 10485760 # 10 MiB

    request_id_header: "X-Request-Id"
    real_ip_header: "X-Forwarded-For"
    trusted_proxies: []

    cors_allowed_origins: ["*"]

    tls:
      enabled: false
      cert_path: ""
      key_path: ""
      ca_path: ""
      server_name: ""
      insecure_skip_verify: false

  grpc:
    addr: "0.0.0.0:9090"
    reflection_enabled: true
    max_recv_msg_size: 4194304
    max_send_msg_size: 4194304

  shutdown_timeout: 20s
  log_probes: false

datastores:
  postgres:
    dsn: "postgres://paladin:paladin@paladin-postgres:5432/paladin?sslmode=disable"
    pool:
      max_conns: 50
      min_conns: 5
      max_conn_lifetime: 30m
      max_conn_idle_time: 2m
    timeouts:
      connect: 5s
      statement: 0s
    healthcheck_period: 30s

  s3:
    bucket: paladin
    region: us-east-1
    endpoint: "http://paladin-seaweedfs:8333"
    public_endpoint: "http://localhost:8333"
    force_path_style: true
    access_key: "dummy"
    secret_key: "dummy"
    presign_ttl: 15m
    part_size: "8MB"
    sse_type: ""
    sse_key_id: ""

policy:
  max_object_size: "100MB"
  max_multipart_size: "1TB"
  min_part_size: "0B"
  max_part_size: "5GB"
  max_parts: 10000
  presign_put_ttl: 15m
  presign_get_ttl: 15m
  presign_part_ttl: 15m
  allowed_content_types:
    - "image/jpeg"
    - "image/png"
    - "application/pdf"
    - "text/plain"
    - "application/json"
    - "application/octet-stream"
  labels_max_bytes: 4096
  labels_max_keys: 10
  external_ref_max_len: 256
  object_key_max_len: 1024

auth:
  enabled: false
  admin_key: ""

security:
  trust_tenant_id_from_request: true
  reject_tenant_mismatch: true
  enable_rls: false
  log_sensitive: false

housekeeping:
  enable_reaper: true
  pending_ttl: "24h"
  multipart_ttl: "72h"
  gc_interval: "1h"
  delete_orphaned_parts: false

rate_limit:
  requests_per_second: 300
  burst: 500
  max_tenants: 10000
  cleanup_ttl: 10m
  cleanup_interval: 5m

cache:
  enabled: true
  max_size: 1000
  ttl: 5m

timeouts:
  fast_operation: 5s
  default_operation: 30s
  s3_operation: 60s
  long_operation: 2m

idempotency:
  enabled: true
  ttl: 24h

otel:
  enabled: false
  endpoint: "otel-collector:4317"
  protocol: grpc
  insecure: true
  resource:
    service.name: paladin
    deployment.environment: local
