logger:
  level: debug # debug, info, warn, error, dpanic, panic, fatal
  format: json # json, console
  development: false
  disable_caller: false
  disable_stacktrace: false

server:
  mode: release
  name: paladin
  http:
    addr: "0.0.0.0:8080"
  grpc:
    addr: "0.0.0.0:9090"
  shutdown_timeout: 20s
  log_probes: false

postgres:
  dsn: "postgres://acme:change-me@postgresql.databases.svc.cluster.local:5432/acme?sslmode=disable"

s3:
  bucket: paladin
  region: us-east-1
  endpoint: "http://seaweedfs-s3.storage.svc.cluster.local:8333"
  force_path_style: true
  access_key: dummy
  secret_key: dummy
  presign_ttl: 15m
  part_size: "8MB"

policy:
  max_object_size: "100MB"
  allowed_content_types:
    - "image/jpeg"
    - "image/png"
    - "application/pdf"

otel:
  enabled: false
  service_name: paladin
  environment: local
  otlp_endpoint: "otel-collector:4317"
  insecure: true
