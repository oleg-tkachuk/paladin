app:
  name: paladin
  env: local # local|staging|prod

logger:
  level: debug # debug, info, warn, error, dpanic, panic, fatal
  format: json # json, console
  development: false
  disable_caller: false
  disable_stacktrace: false
  sampling:
    enabled: true
    initial: 100
    thereafter: 100
  fields:
    service: paladin
    env: local

server:
  mode: release
  name: paladin
  http:
    addr: "0.0.0.0:8080"
    read_header_timeout: 5s
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 90s

    # Standard hard limits
    max_header_bytes: 1048576 # 1 MiB
    max_body_bytes: 10485760 # 10 MiB

    # Standard proxy/correlation headers
    request_id_header: "X-Request-Id"
    real_ip_header: "X-Forwarded-For"
    trusted_proxies: []

    cors_allowed_origins: ["*"]

    tls:
      enabled: false
      cert_path: ""
      key_path: ""
      ca_path: ""
      server_name: ""
      insecure_skip_verify: false

  grpc:
    addr: "0.0.0.0:9090"
    reflection_enabled: false
    max_recv_msg_size: 4194304
    max_send_msg_size: 4194304

  shutdown_timeout: 20s
  log_probes: false

datastores:
  postgres:
    dsn: "postgres://app_user:change-me@paladin-postgresql-rw.database.svc.cluster.local:5432/acme?sslmode=disable"
    pool:
      max_conns: 20
      min_conns: 2
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
    timeouts:
      connect: 5s
      statement: 0s # 0s = disabled unless enforced in code
    healthcheck_period: 30s

  s3:
    bucket: paladin
    region: us-east-1
    endpoint: "http://seaweedfs-s3.storage.svc.cluster.local:8333"
    public_endpoint: "http://s3.paladin.local"
    force_path_style: true
    access_key: dummy_access_key
    secret_key: dummy_secret_key
    presign_ttl: 15m
    part_size: "8MB"
    sse_type: "AES256" # or "aws:kms"
    sse_key_id: "" # Optional KMS Key ID

policy:
  max_object_size: "100MB"
  max_multipart_size: "1TB"
  min_part_size: "0B"
  max_part_size: "5GB"
  max_parts: 10000
  presign_put_ttl: 15m
  presign_get_ttl: 15m
  presign_part_ttl: 15m
  allowed_content_types:
    - "image/jpeg"
    - "image/png"
    - "application/pdf"
    - "text/plain"
    - "application/json"
    - "application/octet-stream"
  labels_max_bytes: 4096
  labels_max_keys: 10
  external_ref_max_len: 256
  object_key_max_len: 1024

security:
  trust_tenant_id_from_request: true # Enabled for local testing/gateway usage
  reject_tenant_mismatch: true # If requested tenant != derived tenant, reject request.
  enable_rls: false # Enable Row Level Security in DB (requires migration 003)
  log_sensitive: false

housekeeping:
  enable_reaper: true
  pending_ttl: "24h"
  multipart_ttl: "72h"
  gc_interval: "1h"
  delete_orphaned_parts: false

rate_limit:
  requests_per_second: 300
  burst: 500
  max_tenants: 10000
  cleanup_ttl: 10m
  cleanup_interval: 5m

cache:
  enabled: true
  max_size: 1000
  ttl: 5m

timeouts:
  fast_operation: 5s # Get, GetMeta, Delete, PatchMeta, GetMultipart
  default_operation: 30s # CreateSingle, List
  s3_operation: 60s # S3 operations (SignUpload, SignDownload, InitiateMultipart, SignPart, SignPartsBatch, AbortMultipart)
  long_operation: 2m # CompleteMultipart

idempotency:
  enabled: true
  ttl: 24h

otel:
  enabled: false
  endpoint: "otel-collector:4317"
  protocol: grpc
  insecure: true
  resource:
    service.name: paladin
    deployment.environment: local
