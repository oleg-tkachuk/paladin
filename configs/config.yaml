app:
  name: paladin
  env: local # local|staging|prod

# ─── Observability ──────────────────────────────────────────────────────────

logger:
  level: debug # debug, info, warn, error, dpanic, panic, fatal
  format: json # json, console
  development: true
  disable_caller: false
  disable_stacktrace: true
  sampling:
    enabled: false
    initial: 100
    thereafter: 100
  # fields default to app.name / app.env — only override when they must differ
  fields:
    service: paladin
    env: local

otel:
  enabled: false
  endpoint: "otel-collector:4317"
  protocol: http
  insecure: true
  resource:
    service.name: paladin
    deployment.environment: local

# ─── Network ────────────────────────────────────────────────────────────────

server:
  mode: debug # debug | test | release
  name: paladin

  # ─── Three-plane HTTP listeners ───────────────────────────────────────────
  # v2 splits the API into three planes, each with its own audience and
  # network exposure profile. All three must be configured.
  #
  #   data_http   — public, end-user object operations (audience=paladin-data)
  #   admin_http  — internal/SRE control plane (audience=paladin-admin)
  #   iam_http    — public login + token exchange (audience=paladin-iam)

  data_http: &http_defaults
    addr: "0.0.0.0:8080"
    read_header_timeout: 5s
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 90s
    max_header_bytes: 1048576 # 1 MiB
    max_body_bytes: 10485760 # 10 MiB
    request_id_header: "X-Request-Id"
    real_ip_header: "X-Forwarded-For"
    trusted_proxies: []
    # WARNING: wildcard CORS is local-only. Restrict per environment in staging/prod.
    cors_allowed_origins: ["*"]
    tls:
      enabled: false
      cert_path: ""
      key_path: ""
      ca_path: ""
      server_name: ""
      insecure_skip_verify: false

  admin_http:
    <<: *http_defaults
    addr: "0.0.0.0:8090"

  iam_http:
    <<: *http_defaults
    addr: "0.0.0.0:8085"

  shutdown_timeout: 20s
  log_probes: false

# ─── Data Stores ────────────────────────────────────────────────────────────

datastores:
  postgres:
    dsn: "postgres://app_user@paladin-postgresql-rw.database.svc.cluster.local:5432/acme?sslmode=disable"
    password_secret:
      name: paladin-postgresql-app-user
      key: password
      namespace: database
    pool:
      max_conns: 20
      min_conns: 2
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
    timeouts:
      connect: 5s
      statement: 0s # 0s = disabled; code must check for zero before enforcing
    healthcheck_period: 30s

# ─── Request Policy ─────────────────────────────────────────────────────────

policy:
  # Object size limits
  max_object_size: "100MB"
  max_multipart_size: "1TB"

  # Multipart part constraints (AWS S3 minimum is 5 MiB; last part is exempt)
  min_part_size: "5MB"
  max_part_size: "5GB"
  max_parts: 10000

  # Pre-signed URL TTLs
  presign_put_ttl: 15m
  presign_get_ttl: 15m
  presign_part_ttl: 15m

  # Allowed MIME types for upload
  allowed_content_types:
    - "image/jpeg"
    - "image/png"
    - "image/heic"
    - "image/heif"
    - "image/tiff"
    - "text/plain"
    - "application/pdf"
    - "application/json"
    - "application/octet-stream"

  # Metadata limits
  labels_max_bytes: 4096
  labels_max_keys: 10
  external_ref_max_len: 256
  object_tag_max_len: 1024

# ─── Auth ───────────────────────────────────────────────────────────────────
# v2 issues + verifies JWTs itself via the IAM plane. The same `signing_key`
# is used for HS256 sign (Login/Refresh) and verify (interceptor on each
# plane). Three audiences are recognised: paladin-data, paladin-admin, paladin-iam.
#
# Production: prefer `signing_key_secret` (Kubernetes secret reference) over
# the inline `signing_key`. JWKS-based verification (federated IdP) is
# reserved for a follow-up release.
auth:
  issuer: "paladin-dev"
  signing_key: "dev-secret-change-me-32-bytes-min"
  signing_key_secret: # null in dev; set in staging/prod
  leeway: 30s
  access_token_ttl: 15m
  refresh_token_ttl: 168h # 7 days
  scoped_token_max_ttl: 24h

# ─── Security ───────────────────────────────────────────────────────────────

security:
  # Enabled for local testing / API-gateway header forwarding
  trust_tenant_id_from_request: true
  reject_tenant_mismatch: true

  # WARNING: enable_rls requires migration 003 to be applied first.
  # Enabling without the migration will cause silent runtime errors.
  enable_rls: false

  log_sensitive: false

# ─── Runtime Constraints ────────────────────────────────────────────────────

timeouts:
  fast_operation: 5s # Get, GetMeta, Delete, PatchMeta, GetMultipart
  default_operation: 30s # CreateSingle, List
  s3_operation: 60s # SignUpload, SignDownload, InitiateMultipart, SignPart, SignPartsBatch, AbortMultipart
  long_operation: 2m # CompleteMultipart

rate_limit:
  requests_per_second: 300
  burst: 500
  max_tenants: 10000
  cleanup_ttl: 10m
  cleanup_interval: 5m

cache:
  enabled: true
  max_size: 1000
  ttl: 5m

idempotency:
  enabled: true
  ttl: 24h

# ─── Background Jobs ────────────────────────────────────────────────────────

housekeeping:
  enable_reaper: true
  pending_ttl: "24h"
  multipart_ttl: "72h"
  gc_interval: "1h"
  # WARNING: set to true in production to reclaim S3 storage from aborted multipart uploads.
  delete_orphaned_parts: false

# ─── Storage Backends ───────────────────────────────────────────────────────
# Registry of physical object-storage backends. Each logical object_key picks one
# by name via `object_keys.storage_backend`; when that column is empty the service
# falls back to `storage.default_backend`. `events.enabled=true` flips
# CompletionMode to IMPLICIT (promotion via S3 event stream).
storage:
  default_backend: primary
  backends:
    primary:
      kind: s3-compatible # aws-s3 | s3-compatible | gcs
      # Physical S3 bucket. PALADIN "ObjectKey" entries are tenant-scoped prefixes
      # inside this bucket; full S3 key = "<tenant_id>/<object_key>/<key>".
      bucket: paladin-primary
      region: us-east-1
      endpoint: "http://seaweedfs-filer.storage.svc.cluster.local:8333"
      public_endpoint: "https://s3.paladin.local"
      force_path_style: true
      # ── Authentication ────────────────────────────────────────────────
      # `auth.mode` selects how PALADIN signs requests to this backend. The
      # field is mandatory.
      #
      #   static_keys   — IAM user access key + secret. Long-lived; the
      #                   only mode that works against non-AWS endpoints
      #                   like SeaweedFS / MinIO. Required: access_key,
      #                   secret_key (or *_secret refs). Optional:
      #                   session_token / session_token_secret for
      #                   externally-rotated short-lived creds.
      #   default_chain — Defer to the AWS SDK default credential chain
      #                   (env vars, ECS task role, EC2 IMDSv2 instance
      #                   role, AWS_PROFILE). The right pick for EC2 /
      #                   ECS / Fargate where AWS injects creds.
      #   assume_role   — Bootstrap creds via the default chain, then
      #                   STS AssumeRole into auth.role_arn. Optional:
      #                   session_name, external_id, duration_seconds.
      #   web_identity  — STS AssumeRoleWithWebIdentity. Canonical EKS
      #                   IRSA path: token file is read from
      #                   web_identity_token_file or, if empty,
      #                   AWS_WEB_IDENTITY_TOKEN_FILE (which the EKS
      #                   pod-identity webhook injects automatically).
      auth:
        mode: static_keys # static_keys | default_chain | assume_role | web_identity
        access_key: dummy_access_key # override via access_key_secret in non-local
        secret_key: dummy_secret_key # override via secret_key_secret in non-local
        # session_token: ""           # static_keys: optional STS session token
        # session_token_secret: { name: paladin-aws, key: session_token }
        # role_arn: ""                # required for assume_role / web_identity
        # session_name: paladin-control-plane
        # external_id: ""             # assume_role only — confused-deputy guard
        # duration_seconds: 3600
        # web_identity_token_file: "" # web_identity: defaults to $AWS_WEB_IDENTITY_TOKEN_FILE
      presign_ttl: 15m
      part_size: "8MB"
      sse:
        type: "" # "" | AES256 | aws:kms
        key_id: "" # required when sse.type=aws:kms
      events:
        enabled: false # SeaweedFS has no S3 event notifications → EXPLICIT mode
        target: "none" # sqs | redis | none
        queue_url: ""
        poll_interval: 20s

# ─── Presign Policy ─────────────────────────────────────────────────────────
# Applies to UploadObject, PresignPut, PresignGet, PresignPart.
presign:
  default_ttl: 15m
  max_ttl: 168h # 7d — Go time.Duration has no "d" unit
  default_max_size: 5368709120 # 5 GiB; upper bound for POST policy content-length-range

# ─── Reconciler ─────────────────────────────────────────────────────────────
# Covers gaps when S3 events are unavailable or lost.
reconciler:
  poll_interval: 30s
  pending_grace_ttl: 2h # only PENDING rows older than this are reconciled
  batch_size: 100

# ─── Cedar ──────────────────────────────────────────────────────────────────
# Short TTL so a missed LISTEN/NOTIFY self-corrects.
cedar:
  policy_cache_ttl: 30s

# ─── MCP (Model Context Protocol) ───────────────────────────────────────────
# LLM-facing bridges into PALADIN. Each transport can be turned off independently;
# `allow_write` flips the catalog from read-only inspection tools to also
# include mutating tools (create_user, set_quota, set_lifecycle_rules, …).
#
# Env-var overrides (always win over YAML for the local-binary use case):
#   PALADIN_MCP_STDIO_ENABLED, PALADIN_MCP_STDIO_ALLOW_WRITE
#   PALADIN_MCP_HTTP_ENABLED, PALADIN_MCP_HTTP_ALLOW_WRITE, PALADIN_MCP_HTTP_ADDR,
#   PALADIN_MCP_HTTP_SESSION_TIMEOUT
#   PALADIN_ADMIN_URL, PALADIN_DATA_URL, PALADIN_IAM_URL
mcp:
  upstreams:
    admin_url: "http://localhost:8090"
    data_url: "http://localhost:8080"
    iam_url: "http://localhost:8085"
  stdio:
    enabled: true # set false to ship a build with no local LLM bridge
    allow_write: false # read-only by default
  http:
    enabled: true # set false in production if no remote LLM platforms connect
    addr: ":8095"
    allow_write: false
    session_timeout: 10m # idle sessions auto-close after this
