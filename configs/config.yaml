# paladin — full configuration reference.
#
# Every field the service reads is enumerated below with its default value
# inline, so an operator can scan this file once and know every knob that
# exists. Defaults match those declared in internal/config/schema.cue;
# omitting a field from the YAML is equivalent to setting it to the value
# shown here.
#
# Secrets: any field with a sibling `<field>_secret` resolves the secret
# in-cluster (k8s service-account token must mount; see resolver.go) and
# overrides the inline value. Never check a real secret into git.

# ─── Application identity ───────────────────────────────────────────────────
app:
  name: paladin
  env: local                            # local | staging | prod

# ─── Logger (zap) ───────────────────────────────────────────────────────────
logger:
  level: debug                          # debug | info | warn | error | dpanic | panic | fatal
  format: json                          # json | console
  development: true                     # human-readable timestamps + colour in dev
  disable_caller: false                 # drop file:line in log lines
  disable_stacktrace: true              # drop stack traces (recommended for prod)
  sampling:
    enabled: false                      # production: enable to cap log volume
    initial: 100                        # log first N entries per second verbatim
    thereafter: 100                     # then 1 in N until the second rolls
  # logger.fields.{service,env} default from app.name / app.env via CUE.
  # Only declare here when the structured-log dimensions must diverge from
  # the service identity (rarely true).

# ─── OpenTelemetry ──────────────────────────────────────────────────────────
otel:
  enabled: false                        # turn on once a collector is reachable
  endpoint: "otel-collector:4317"       # otlp host:port (grpc) or url (http)
  protocol: http                        # grpc | http
  insecure: true                        # tls=off — dev only
  # otel.resource.{service.name,deployment.environment} default from
  # app.name / app.env via CUE.

# ─── HTTP servers (three-plane) ─────────────────────────────────────────────
# Data, admin and iam each get their own listener with its own audience and
# network exposure profile. Common defaults are anchored in `&http_defaults`
# and overridden per plane below.
server:
  mode: debug                           # debug | test | release
  shutdown_timeout: 20s
  log_probes: false                     # spam reduction for k8s livenessProbe

  data_http: &http_defaults
    addr: "0.0.0.0:8080"
    read_header_timeout: 5s
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 90s
    max_header_bytes: 1048576           # 1 MiB
    max_body_bytes: 10485760            # 10 MiB
    request_id_header: "X-Request-Id"
    real_ip_header: "X-Forwarded-For"
    trusted_proxies: []                 # CIDRs trusted for X-Forwarded-For
    cors_allowed_origins: []            # Closed: UI proxies via its own BFF
    tls:
      enabled: false
      cert_path: ""
      key_path: ""
      ca_path: ""
      server_name: ""
      insecure_skip_verify: false

  admin_http:
    <<: *http_defaults
    addr: "0.0.0.0:8090"

  iam_http:
    <<: *http_defaults
    addr: "0.0.0.0:8085"

# ─── Datastores ─────────────────────────────────────────────────────────────
datastores:
  postgres:
    # Runtime DSN — must point at the minimum-privilege role (`paladin_app`).
    # See migrations/011_app_role.sql + docs/db-roles.md for what that role
    # is allowed to do (DML only, no DDL, no role management).
    dsn: "postgres://paladin_app@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=disable"
    password: ""                        # prefer password_secret in non-local
    password_secret:
      name: paladin-postgresql-app-user
      key: password
      namespace: database
    # Separate DDL-capable DSN for schema migrations. In production this
    # MUST differ from `dsn` so the runtime pool can be locked down.
    # Empty falls back to the runtime DSN — fine for dev only.
    migrate_dsn: "postgres://paladin_migrate@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=disable"
    migrate_password: ""
    migrate_password_secret:
      name: paladin-postgresql-migrate-user
      key: password
      namespace: database
    reaper_dsn: ""                      # optional separate role for housekeeping; "" → reuse `dsn`
    pool:
      max_conns: 20
      min_conns: 2
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
    timeouts:
      connect: 5s
      statement: 30s                    # server-side statement_timeout; 0 = disabled (do not ship)
    healthcheck_period: 30s

# ─── Request limits (single source of truth for refusals) ───────────────────
limits:
  max_object_size: "100MB"              # rejected at presign time
  max_multipart_size: "1TB"             # CompleteMultipart cap
  min_part_size: "5MB"                  # AWS S3 minimum (last part exempt)
  max_part_size: "5GB"
  max_parts: 10000
  allowed_content_types:                # empty list = accept any
    - "image/jpeg"
    - "image/png"
    - "image/heic"
    - "image/heif"
    - "image/tiff"
    - "text/plain"
    - "application/pdf"
    - "application/json"
    - "application/octet-stream"
  presign:
    put_ttl: 15m                        # per-method ttl for PresignPut / UploadObject
    get_ttl: 15m                        # PresignGet / DownloadObject
    part_ttl: 15m                       # PresignPart (multipart)
    default_ttl: 15m                    # fallback when caller passes no ttl
    max_ttl: 168h                       # 7d — upper bound for caller-supplied ttls
    default_max_size: 5368709120        # 5 GiB; POST policy content-length-range cap

# ─── Auth (JWT issuance + verification) ─────────────────────────────────────
# PALADIN IAM mints HS256 tokens via Login / RefreshToken and verifies them on
# each plane interceptor. The same `signing_key` is used for both. Three
# audiences are recognised at verify time: paladin-data, paladin-admin, paladin-iam.
auth:
  issuer: "paladin-dev"
  signing_key: "dev-secret-change-me-32-bytes-min"  # must be ≥ 32 bytes
  # signing_key_secret: { name: paladin-iam, key: signing_key }   # set in staging/prod; mutually exclusive with signing_key
  jwks_url: ""                                      # reserved for federated IdP; unused today
  leeway: 30s
  access_token_ttl: 15m
  refresh_token_ttl: 168h               # 7 days
  scoped_token_max_ttl: 24h

# ─── Security ───────────────────────────────────────────────────────────────
security:
  trust_tenant_id_from_request: true    # accept tenant from header (api-gateway forwarding)
  reject_tenant_mismatch: true          # 403 when JWT tenant != header tenant
  log_sensitive: false                  # log secret values (debugging only)

# ─── Bootstrap (one-shot startup steps; opt-in) ────────────────────────────
# ArgoCD-style platform-admin provisioning. The password is resolved at
# boot from a Kubernetes Secret (created by the Helm chart, not by the
# operator) — same SecretRef pattern as datastores.postgres.password_secret.
# See docs/security.md for the full runbook.
bootstrap:
  admin:
    enabled: false                      # opt-in; flip to true in chart values
    subject: "admin"                    # login identifier
    tenant_slug: "platform"             # auto-created on first run if missing
    tenant_display_name: "Platform"
    display_name: ""                    # falls back to subject when empty
    roles: ["platform.admin"]           # cross-tenant via Cedar role
    # Inline password — debug-only. Production deploys leave this empty
    # and rely on `password_secret` below.
    password: ""
    password_secret:
      name: "paladin-bootstrap-admin"       # Secret managed by the chart
      key: "password"
      namespace: ""                     # empty → pod namespace
    min_password_length: 0              # 0 → 16 in release, 8 in debug/test
    force_reset: false                  # one-shot rotation; flip back to false after deploy

# ─── Cross-cutting middleware (timeouts, RPS caps, caches, idempotency) ────
middleware:
  timeouts:
    fast_operation: 5s                  # Get/GetMeta/Delete/PatchMeta/GetMultipart
    default_operation: 30s              # CreateSingle, List
    s3_operation: 60s                   # presign + multipart S3 calls
    long_operation: 2m                  # CompleteMultipart
  rate_limit:                           # sliding window per-tenant
    enabled: true
    requests_per_second: 300
    burst: 500
    max_tenants: 10000                  # LRU eviction beyond this
    cleanup_ttl: 10m
    cleanup_interval: 5m
  cache:                                # in-memory resource cache (Cedar, bucket meta)
    enabled: true
    max_size: 1000
    ttl: 5m
  idempotency:                          # de-dup via Idempotency-Key header
    enabled: true
    ttl: 24h

# ─── Background workers ────────────────────────────────────────────────────
# Long-running goroutines that close gaps the request path can't handle:
# reconciler reverifies stuck-PENDING objects against S3; housekeeping
# reaps orphaned rows on a schedule.
workers:
  reconciler:                           # closes gaps when S3 events are unavailable / lost
    interval: 30s                       # how often to run a reconcile pass
    min_object_age: 2h                  # only objects older than this are eligible
    batch_size: 100
  housekeeping:                         # audit-log reaper
    interval: 1h                        # how often the reaper loop runs
    pending_ttl: 24h                    # PENDING objects older than this are GC'd
    multipart_ttl: 72h                  # abandoned multipart sessions
    audit_log_ttl: 8760h                # 365 days
    delete_orphaned_parts: false        # WARNING: enable in prod to reclaim S3 storage
    # Lifecycle hard-delete cascade: after this cooling-off window
    # the LifecycleHardDeleter calls storage.DeleteObject AND drops
    # the PALADIN row. 0 disables (audit-only, dev default). 7d-30d in
    # prod is the typical setting — gives support a restore window
    # before the bytes go away. Worker race-with-PUT mitigation is
    # OCC-gated; see internal/worker/lifecycle_hard_delete.go.
    hard_delete_after: "0s"
    hard_delete_batch_size: 100
  refresh_token_reap:                   # drops expired refresh tokens
    interval: 1h
  api_key_reap:                         # auto-revokes api-keys past expires_at
    interval: 1h
  lifecycle:                            # CEL-based per-bucket expiration
    enabled: true
    interval: 30m
  replication:                          # cross-backend copy (dry-run until wired)
    enabled: false
    interval: 5m
    lookback_window: 1h

# ─── Storage backends ───────────────────────────────────────────────────────
# Registry of physical object-storage backends. Each logical ObjectKey picks
# one by name (or falls back to `default_backend`). `events.enabled=true`
# flips CompletionMode to IMPLICIT (object promoted via S3 event stream).
storage:
  default_backend: primary
  backends:
    primary:
      kind: s3-compatible               # aws-s3 | s3-compatible | gcs
      bucket: paladin-primary               # full S3 key = "<tenant_id>/<object_key>/<key>"
      region: us-east-1
      endpoint: "http://seaweedfs-filer.storage.svc.cluster.local:8333"
      public_endpoint: "https://s3.paladin.local"   # browser-reachable; "" → reuse endpoint
      force_path_style: true            # required for SeaweedFS / MinIO

      # ── Authentication ────────────────────────────────────────────────
      # `auth.mode` is mandatory:
      #   static_keys   — IAM access key + secret. Only mode that works
      #                   against non-AWS endpoints (SeaweedFS / MinIO).
      #   default_chain — defer to AWS SDK chain (env / ECS / IMDS / profile).
      #   assume_role   — STS AssumeRole layered on default_chain.
      #   web_identity  — STS AssumeRoleWithWebIdentity (EKS IRSA).
      auth:
        mode: static_keys
        access_key: dummy_access_key    # override via access_key_secret in non-local
        # access_key_secret: { name: paladin-aws, key: access_key, namespace: storage }
        secret_key: dummy_secret_key
        # secret_key_secret: { name: paladin-aws, key: secret_key, namespace: storage }
        session_token: ""               # static_keys only — externally-rotated short-lived creds
        # session_token_secret: { name: paladin-aws, key: session_token }
        role_arn: ""                    # required for assume_role | web_identity
        session_name: "paladin-control-plane"
        external_id: ""                 # assume_role only — confused-deputy guard
        duration_seconds: 0             # 0 → AWS default (1h)
        web_identity_token_file: ""     # web_identity only; "" → $AWS_WEB_IDENTITY_TOKEN_FILE

      part_size: "8MB"
      sse:
        type: ""                        # "" | AES256 | aws:kms
        key_id: ""                      # required when sse.type=aws:kms
      events:
        enabled: false                  # SeaweedFS has no S3 events → EXPLICIT mode
        target: "none"                  # sqs | redis | none
        queue_url: ""
        poll_interval: 20s

# ─── Cedar policy engine ────────────────────────────────────────────────────
cedar:
  policy_cache_ttl: 30s                 # short TTL — missed LISTEN/NOTIFY self-corrects

# ─── MCP (Model Context Protocol) bridges ───────────────────────────────────
# LLM-facing entry points. Each transport flips off independently. The
# tool catalog exposed to the LLM is gated by a named `profile`:
#
#   read_only   — list/get/query + audit + simulate_authz; no mutations
#   agent_safe  — read_only + presign get/put + complete_object + tag mutations
#   admin       — every registered tool, except items in mcp.always_deny
#
# Built-in profiles live in internal/mcp/profile.go. Custom profiles
# can be defined under mcp.profiles below; tool-name patterns support
# trailing-* wildcard. The mcp.always_deny list applies regardless of
# profile (it encodes the capability-model antithesis: agent issuing
# its own caps, role escalation, login, tenant lifecycle).
#
# Env-var overrides (always win over YAML so a Claude Desktop config
# can pin behaviour without editing cluster YAML):
#   PALADIN_MCP_STDIO_ENABLED, PALADIN_MCP_STDIO_PROFILE
#   PALADIN_MCP_HTTP_ENABLED, PALADIN_MCP_HTTP_PROFILE,
#   PALADIN_MCP_HTTP_ADDR, PALADIN_MCP_HTTP_SESSION_TIMEOUT
#   PALADIN_ADMIN_URL, PALADIN_DATA_URL, PALADIN_IAM_URL
mcp:
  upstreams:
    admin_url: "http://localhost:8090"
    data_url: "http://localhost:8080"
    iam_url: "http://localhost:8085"
  stdio:
    enabled: true                       # set false to ship a build with no local LLM bridge
    profile: read_only                  # read-only inspection by default
  http:
    enabled: true                       # set false in prod if no remote LLM platforms connect
    addr: ":8095"
    profile: read_only
    session_timeout: 10m                # idle sessions auto-close after this
  # Custom / overridden profiles (optional). When empty the built-in
  # set from internal/mcp/profile.go is used. Tool-name patterns
  # support trailing-* wildcard. `deny` wins over `tools` within a
  # profile.
  profiles: {}
  # Global deny list — applied AFTER profile expansion. Empty list
  # explicitly = no global denial (override for built-in defaults).
  # Leave commented to keep the built-in DefaultAlwaysDeny.
  # always_deny: []
