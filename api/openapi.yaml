openapi: 3.0.3
info:
  title: Paladin API
  version: 1.1.0
  description: |
    S3-compatible control plane for managing object metadata and issuing pre-signed URLs
    for single PUT and multipart uploads. Includes explicit commit (complete) step.

    ## Features
    - **Metadata Management**: Track objects with labels and external references
    - **Pre-signed URLs**: Secure, time-limited upload/download URLs
    - **Multipart Uploads**: Support for large files (>5GB)
    - **Idempotency**: Safe retries with idempotency keys
    - **Multi-tenancy**: Tenant isolation via X-Tenant-ID header

    ## Versioning
    - **URL Versioning**: Major version in path (`/v1`, `/v2`)
    - **Backward Compatibility**: Minor/patch versions are backward compatible
    - **Deprecation Policy**: 6 months notice before removing deprecated features
    - **Version Header**: All responses include `X-API-Version` header

    ## CORS
    API supports CORS for browser-based clients:
    - Allowed origins configured per environment
    - Credentials supported via `Access-Control-Allow-Credentials`
    - Preflight cache: 86400 seconds (24 hours)

    ## Rate Limiting
    - Default: 1000 requests per minute per tenant
    - Headers: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`
    - Exceeded: HTTP 429 with `Retry-After` header

servers:
  - url: /v1

security:
  - BearerAuth: []

tags:
  - name: Objects
  - name: Multipart
  - name: Ops

paths:
  /objects:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
    get:
      tags: [Objects]
      summary: List objects
      operationId: listObjects
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ObjectStatus"
        - name: external_ref
          in: query
          required: false
          schema:
            type: string
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter objects by category slug
        - name: prefix
          in: query
          required: false
          schema:
            type: string
          description: Filter objects by key prefix (simulates folder structure)
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [created_at]
            default: created_at
          description: Field to sort by
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort order
      responses:
        "200":
          description: Objects list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListObjectsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Objects]
      summary: Create a single object and return signed upload action (PUT)
      operationId: createObject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateObjectRequest"
      responses:
        "201":
          description: Object created
          headers:
            Location:
              description: Canonical object resource URL
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateObjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/{id}:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/ObjectID"

    get:
      tags: [Objects]
      summary: Get object details (without signing download URL)
      operationId: getObject
      responses:
        "200":
          description: Object details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetObjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    head:
      tags: [Objects]
      summary: Check object existence
      operationId: headObject
      responses:
        "200":
          description: Object exists
          headers:
            X-Object-Status:
              schema:
                $ref: "#/components/schemas/ObjectStatus"
            X-Object-Size-Bytes:
              schema:
                type: integer
                format: int64
            X-Object-Content-Type:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Objects]
      summary: Update object lifecycle status (non-delete transitions)
      description: |
        Updates the lifecycle state of an object for non-delete transitions.
        Soft deletion MUST be performed via `DELETE /objects/{id}`.
        Hard purge MUST be performed via `DELETE /objects/{id}:purge`.

        Notes:
        - This endpoint is for lifecycle/state transitions only (e.g. aborting an upload, marking error).
        - `soft_deleted` is intentionally not allowed here to avoid ambiguous delete semantics.
      operationId: updateObject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchObjectRequest"
      responses:
        "200":
          description: Object updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectCommon"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Objects]
      summary: Soft delete an object
      description: |
        Performs a soft delete by marking the object status as `soft_deleted`
        and setting `deleted_at`. The object content is NOT removed from storage.

        This operation is idempotent:
        - If the object is already soft-deleted, the response is still `204`.
      operationId: deleteObject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Object soft-deleted (or already soft-deleted)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/ObjectID"

    post:
      tags: [Objects]
      summary: Restore a soft-deleted object
      description: |
        Restores a soft-deleted object by transitioning its status back to `complete`.
        If the object is already in a non-deleted state, the response is `200 OK`.
      operationId: restoreObject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Object restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectCommon"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/{id}/purge:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/ObjectID"

    delete:
      tags: [Objects]
      summary: Permanently purge an object (hard delete)
      description: |
        Permanently removes object content from storage and deletes its metadata.
        Intended for privileged/internal use (e.g. reaper/GC).

        This operation is idempotent:
        - If the object is already absent (previously purged), the response is `204`.
      operationId: purgeObject
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Object purged (or already absent)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/bulk/delete:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
    post:
      tags: [Objects]
      summary: Bulk soft delete objects
      operationId: bulkDeleteObjects
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "200":
          description: Bulk delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/bulk/restore:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
    post:
      tags: [Objects]
      summary: Bulk restore soft-deleted objects
      operationId: bulkRestoreObjects
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "200":
          description: Bulk restore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/bulk/purge:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
    delete:
      tags: [Objects]
      summary: Bulk permanently purge objects (hard delete)
      operationId: bulkPurgeObjects
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "200":
          description: Bulk purge result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /ops/stats:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
    get:
      tags: [Ops]
      summary: Get object statistics for analytics
      operationId: getObjectStats
      responses:
        "200":
          description: Object statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectStats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /ops/s3/ping:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
    get:
      tags: [Ops]
      summary: S3 Ping
      description: |
        Perform an official HEAD Bucket S3 API call to verify connectivity and bucket status.

        Returns:
        - `healthy` (200): Bucket exists and is accessible.
        - `degraded` (404): Bucket does not exist.
        - `unavailable` (403): Access denied.
      operationId: pingS3
      security: []
      responses:
        "200":
          description: S3 Ping result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3PingResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/{id}/meta:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/ObjectID"

    get:
      tags: [Objects]
      summary: Get object metadata
      operationId: getObjectMeta
      responses:
        "200":
          description: Object metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetObjectMetaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    patch:
      tags: [Objects]
      summary: Update object metadata (labels/external_ref)
      operationId: patchObjectMeta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchObjectMetaRequest"
      responses:
        "200":
          description: Updated metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetObjectMetaResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/{id}/sign-upload:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/ObjectID"

    post:
      tags: [Objects]
      summary: Re-issue signed upload action for single PUT (if upload not completed)
      operationId: signObjectUpload
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignObjectUploadRequest"
      responses:
        "200":
          description: Signed upload action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignObjectUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/{id}/sign-download:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/ObjectID"

    post:
      tags: [Objects]
      summary: Issue signed download action (GET)
      operationId: signObjectDownload
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignObjectDownloadRequest"
      responses:
        "200":
          description: Signed download action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignObjectDownloadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /objects/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/ObjectID"

    post:
      tags: [Objects]
      summary: Commit single object upload (server validates via S3 HEAD)
      operationId: completeObject
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteObjectRequest"
      responses:
        "200":
          description: Object committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteObjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /multipart:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
    post:
      tags: [Multipart]
      summary: Initiate multipart upload
      operationId: initiateMultipart
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiateMultipartRequest"
      responses:
        "200":
          description: Multipart upload initiated
          headers:
            Location:
              description: Canonical multipart resource URL
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiateMultipartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /multipart/{upload_id}:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/UploadID"

    get:
      tags: [Multipart]
      summary: Get multipart upload details
      operationId: getMultipart
      responses:
        "200":
          description: Multipart details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetMultipartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /multipart/{upload_id}/parts/{part_number}/sign:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/UploadID"
      - $ref: "#/components/parameters/PartNumber"

    post:
      tags: [Multipart]
      summary: Sign a single part for upload
      operationId: signPart
      responses:
        "200":
          description: Signed URL for part upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignPartResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /multipart/{upload_id}/parts/sign:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/UploadID"

    post:
      tags: [Multipart]
      summary: Sign multiple parts (batch)
      operationId: signPartsBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignPartsBatchRequest"
      responses:
        "200":
          description: Signed URLs for requested parts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignPartsBatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"

  /multipart/{upload_id}/complete:
    parameters:
      - $ref: "#/components/parameters/XRequestID"
      - $ref: "#/components/parameters/Traceparent"
      - $ref: "#/components/parameters/UploadID"

    post:
      tags: [Multipart]
      summary: Complete multipart upload
      operationId: completeMultipart
      requestBody:
        required: true
