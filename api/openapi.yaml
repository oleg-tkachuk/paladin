          $ref: "#/components/schemas/ErrorDetails"

    BatchCreateResponse:
      type: object
      description: |
        FUTURE FEATURE: Batch creation response.
        Not currently implemented.
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/BatchOperationResult"

    ListTenantsResponse:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            type: string
            description: Tenant ID
        pagination:
          $ref: "#/components/schemas/Pagination"

  responses:
    TooManyRequests:
      description: Rate limit exceeded (Too Many Requests)
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
