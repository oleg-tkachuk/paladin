# Paladin alerting rules for the outbox, rate limiting and capability charges.
#
# Plain Prometheus rule group, same format as worker-alerts.yaml: drop it into
# `rule_files:` or use it as the `spec.groups` body of a PrometheusRule CR.
# Worker stalls are in worker-alerts.yaml and are not repeated here.
#
# Several of these counters exist only after the path they count has run once.
# A rule on an absent series does not fire, so the counter rules use
# `or vector(0)` where an absent series means "zero", and none of them alert
# on absence.
groups:
  - name: paladin
    rules:
      # The outbox floor over 15 minutes stayed above 500 rows: delivery is not
      # keeping up with writes. Depth alone spikes on every write burst; the
      # minimum over the window does not. Subscribers fall behind while RPCs
      # keep succeeding (ADR-0003).
      - alert: PaladinOutboxNotDraining
        expr: |
          min_over_time(max(paladin_outbox_pending)[15m:1m]) > 500
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Paladin outbox has not drained below 500 rows in 15m"
          description: >-
            The dispatcher is not clearing pending outbox rows. Check the
            dispatcher logs, and the deepest-tenant line on the Operations
            dashboard to tell a dispatcher problem from one tenant's sink.

      # The per-tenant or per-API-token limiter admitted requests because its
      # own storage failed. Admitting is the intended behaviour, but the
      # ceiling is not enforced while it lasts, and nothing else reports it.
      - alert: PaladinRateLimitFailingOpen
        expr: |
          (sum(increase(paladin_tenant_ratelimit_fail_open_total[10m])) or vector(0))
            + (sum(increase(paladin_api_token_ratelimit_fail_open_total[10m])) or vector(0))
            > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Paladin rate limiting is failing open"
          description: >-
            Requests are admitted without a rate-limit decision; the per-tenant
            or per-token ceiling is not in force. Check the limiter's Postgres
            tables and the api logs.

      # More than 90% of a tenant's capability charges were refused for 15m.
      # Occasional refusals are a cap working; a tenant refused nearly every
      # time cannot work, and from outside looks like an idle tenant.
      - alert: PaladinCapabilityChargesRefused
        expr: |
          sum by (tenant_id) (rate(paladin_capability_charges_total{outcome=~"capability_exhausted|tenant_exhausted"}[15m]))
            /
          clamp_min(sum by (tenant_id) (rate(paladin_capability_charges_total[15m])), 0.001)
            > 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} has nearly every capability charge refused"
          description: >-
            Over 90% of charge attempts were refused for 15m. Check the
            tenant's quota and the issuing capability's budget.

      # The per-tenant limiter refused more than 1 request/s for 10m: a client
      # in a loop, or a limit below the tenant's real workload. The tenant
      # receives ResourceExhausted either way.
      - alert: PaladinTenantThrottled
        expr: |
          sum by (tenant_id) (rate(paladin_tenant_ratelimit_decisions_total{allowed="false"}[10m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} is rate-limited steadily"
          description: >-
            The per-tenant limiter has refused more than 1 request/s for 10m.
            Either a client is looping or middleware.rate_limit is too low for
            this tenant.
