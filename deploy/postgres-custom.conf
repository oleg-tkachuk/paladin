# Custom Optimized PostgreSQL Configuration
# Optimized for high concurrency, throughput, and vacuum frequency

# Memory Settings
listen_addresses = '*'
max_connections = 200
shared_buffers = 256MB        # Recommended ~25% of RAM for dedicated instances, scaling conservatively for local/docker
work_mem = 8MB                # Improves sorting for queries like ListObjects / ListAuditLogs
maintenance_work_mem = 64MB   # Speeds up index creation / vacuum

# IO & Throughput Settings
effective_io_concurrency = 200
random_page_cost = 1.1        # Assumes SSD storage

# Write Ahead Log (WAL)
wal_level = logical
max_wal_size = 1GB            # Keeps writes fast with less frequent checkpoints
min_wal_size = 512MB
checkpoint_timeout = 15min

# Vacuum Tuning (Crucial for high update workloads like soft-deletes and audit tables)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 15s      # Check for bloat standardly
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05   # Vacuum when 5% rows update/delete
autovacuum_analyze_scale_factor = 0.02

# Query Planner Settings
effective_cache_size = 768MB  # Help planner correctly estimate OS cache sizing
