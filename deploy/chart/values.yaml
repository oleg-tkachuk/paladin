replicaCount: 1

config:
  app:
    name: paladin
    env: local # local|staging|prod

  # ─── Observability ──────────────────────────────────────────────────────────

  logger:
    level: debug # debug, info, warn, error, dpanic, panic, fatal
    format: json # json, console
    development: true
    disable_caller: false
    disable_stacktrace: true
    sampling:
      enabled: false
      initial: 100
      thereafter: 100
    # fields default to app.name / app.env — only override when they must differ
    fields:
      service: paladin
      env: local

  otel:
    enabled: false
    endpoint: "otel-collector:4317"
    protocol: http
    insecure: true
    resource:
      service.name: paladin
      deployment.environment: local

  # ─── Network ────────────────────────────────────────────────────────────────

  server:
    mode: debug # debug | test | release
    name: paladin

    http:
      addr: "0.0.0.0:8080"

      # Connection timeouts
      read_header_timeout: 5s
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 90s

      # Hard limits
      max_header_bytes: 1048576 # 1 MiB
      max_body_bytes: 10485760 # 10 MiB

      # Proxy / correlation headers
      request_id_header: "X-Request-Id"
      real_ip_header: "X-Forwarded-For"
      trusted_proxies: []

      # WARNING: wildcard CORS is local-only. Restrict per environment in staging/prod.
      cors_allowed_origins: ["*"]

      tls:
        enabled: false
        cert_path: ""
        key_path: ""
        ca_path: ""
        server_name: ""
        insecure_skip_verify: false

    shutdown_timeout: 20s
    log_probes: false

  # ─── Data Stores ────────────────────────────────────────────────────────────

  datastores:
    postgres:
      dsn: "postgres://app_user@paladin-postgresql-rw.database.svc.cluster.local:5432/acme?sslmode=disable"
      password_secret:
        name: paladin-postgresql-app-user
        key: password
        namespace: database
      pool:
        max_conns: 20
        min_conns: 2
        max_conn_lifetime: 30m
        max_conn_idle_time: 5m
      timeouts:
        connect: 5s
        statement: 0s # 0s = disabled; code must check for zero before enforcing
      healthcheck_period: 30s

  # ─── Request Policy ─────────────────────────────────────────────────────────

  policy:
    # Object size limits
    max_object_size: "100MB"
    max_multipart_size: "1TB"

    # Multipart part constraints (AWS S3 minimum is 5 MiB; last part is exempt)
    min_part_size: "5MB"
    max_part_size: "5GB"
    max_parts: 10000

    # Pre-signed URL TTLs
    presign_put_ttl: 15m
    presign_get_ttl: 15m
    presign_part_ttl: 15m

    # Allowed MIME types for upload
    allowed_content_types:
      - "image/jpeg"
      - "image/png"
      - "image/heic"
      - "image/heif"
      - "image/tiff"
      - "text/plain"
      - "application/pdf"
      - "application/json"
      - "application/octet-stream"

    # Metadata limits
    labels_max_bytes: 4096
    labels_max_keys: 10
    external_ref_max_len: 256
    object_key_max_len: 1024

  # ─── Auth ───────────────────────────────────────────────────────────────────
  # JWT verification for Connect RPCs. Exactly one of jwks_url / hmac_secret
  # must be set; `leeway` tolerates small clock skew.
  #
  # dev-mode (HS256, shared secret):
  #   - set hmac_secret; leave jwks_url empty.
  #   - client signs JWT with the same secret; required claims:
  #       iss=<issuer>, aud=<audience>, exp=<future>, sub=<user>,
  #       tenant=<uuid>, roles=["admin"] (for TenantService cross-tenant RPCs).
  #   - empty issuer/audience disables that claim's verification.
  # staging/prod: replace with `jwks_url` + a real IdP; drop `hmac_secret`.
  auth:
    issuer: "paladin-dev"
    audience: "paladin-api"
    jwks_url: ""
    hmac_secret: "dev-secret-change-me-32-bytes-min"
    leeway: 30s

  # ─── Security ───────────────────────────────────────────────────────────────

  security:
    # Enabled for local testing / API-gateway header forwarding
    trust_tenant_id_from_request: true
    reject_tenant_mismatch: true

    # WARNING: enable_rls requires migration 003 to be applied first.
    # Enabling without the migration will cause silent runtime errors.
    enable_rls: false

    log_sensitive: false

  # ─── Runtime Constraints ────────────────────────────────────────────────────

  timeouts:
    fast_operation: 5s # Get, GetMeta, Delete, PatchMeta, GetMultipart
    default_operation: 30s # CreateSingle, List
    s3_operation: 60s # SignUpload, SignDownload, InitiateMultipart, SignPart, SignPartsBatch, AbortMultipart
    long_operation: 2m # CompleteMultipart

  rate_limit:
    requests_per_second: 300
    burst: 500
    max_tenants: 10000
    cleanup_ttl: 10m
    cleanup_interval: 5m

  cache:
    enabled: true
    max_size: 1000
    ttl: 5m

  idempotency:
    enabled: true
    ttl: 24h

  # ─── Background Jobs ────────────────────────────────────────────────────────

  housekeeping:
    enable_reaper: true
    pending_ttl: "24h"
    multipart_ttl: "72h"
    gc_interval: "1h"
    # WARNING: set to true in production to reclaim S3 storage from aborted multipart uploads.
    delete_orphaned_parts: false

  # ─── Storage Backends ───────────────────────────────────────────────────────
  # Registry of physical object-storage backends. Each logical bucket picks one
  # by name via `buckets.storage_backend`; when that column is empty the service
  # falls back to `storage.default_backend`. `events.enabled=true` flips
  # CompletionMode to IMPLICIT (promotion via S3 event stream).
  storage:
    default_backend: primary
    backends:
      primary:
        kind: s3-compatible # aws-s3 | s3-compatible | gcs
        region: us-east-1
        endpoint: "http://seaweedfs-filer.storage.svc.cluster.local:8333"
        public_endpoint: "https://s3.paladin.local"
        force_path_style: true
        access_key: dummy_access_key # override via access_key_secret in non-local
        secret_key: dummy_secret_key # override via secret_key_secret in non-local
        presign_ttl: 15m
        part_size: "8MB"
        sse:
          type: "" # "" | AES256 | aws:kms
          key_id: "" # required when sse.type=aws:kms
        events:
          enabled: false # SeaweedFS has no S3 event notifications → EXPLICIT mode
          target: "none" # sqs | redis | none
          queue_url: ""
          poll_interval: 20s

  # ─── Presign Policy ─────────────────────────────────────────────────────────
  # Applies to UploadObject, PresignPut, PresignGet, PresignPart.
  presign:
    default_ttl: 15m
    max_ttl: 168h # 7d — Go time.Duration has no "d" unit
    default_max_size: 5368709120 # 5 GiB; upper bound for POST policy content-length-range

  # ─── Reconciler ─────────────────────────────────────────────────────────────
  # Covers gaps when S3 events are unavailable or lost.
  reconciler:
    poll_interval: 30s
    pending_grace_ttl: 2h # only PENDING rows older than this are reconciled
    batch_size: 100

  # ─── Cedar ──────────────────────────────────────────────────────────────────
  # Short TTL so a missed LISTEN/NOTIFY self-corrects.
  cedar:
    policy_cache_ttl: 30s

image:
  repository: registry.local/paladin
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.paladin.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - api.paladin.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /startupz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes:
  - name: config
    configMap:
      name: paladin-config
  - name: migrations
    emptyDir: {}

volumeMounts:
  - name: config
    mountPath: /app/configs
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

rbac:
  secretReader:
    enabled: true
    clusterWide: true
    secretNames:
      - paladin-postgresql-app-user
      - paladin-postgresql-superuser
      - paladin-admin-key
