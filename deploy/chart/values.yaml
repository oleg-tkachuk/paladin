replicaCount: 1
metadata:
  version: ""
  commit: "unknown"
  buildTime: "unknown"

config:
  app:
    name: paladin
    env: local                            # local | staging | prod

  logger:
    level: debug                          # debug | info | warn | error | dpanic | panic | fatal
    format: json                          # json | console
    development: true
    disable_caller: false
    disable_stacktrace: true
    sampling:
      enabled: false
      initial: 100
      thereafter: 100
    # logger.fields.{service,env} default from app.name / app.env via CUE.

  otel:
    enabled: false
    endpoint: "otel-collector:4317"
    protocol: http
    insecure: true
    # otel.resource.{service.name,deployment.environment} default from
    # app.name / app.env via CUE.

  # Three-plane HTTP listeners: data (end-user object operations),
  # admin (internal/SRE), iam (login + token exchange).
  server:
    mode: debug
    shutdown_timeout: 20s
    log_probes: false
    data_http: &http_defaults
      addr: "0.0.0.0:8080"
      read_header_timeout: 5s
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 90s
      max_header_bytes: 1048576
      max_body_bytes: 10485760
      request_id_header: "X-Request-Id"
      real_ip_header: "X-Forwarded-For"
      trusted_proxies: []
      cors_allowed_origins: ["*"]
      tls: { enabled: false }
    admin_http:
      <<: *http_defaults
      addr: "0.0.0.0:8090"
    iam_http:
      <<: *http_defaults
      addr: "0.0.0.0:8085"

  datastores:
    postgres:
      dsn: "postgres://app_user@paladin-postgresql-rw.database.svc.cluster.local:5432/acme?sslmode=disable"
      password_secret:
        name: paladin-postgresql-app-user
        key: password
        namespace: database
      reaper_dsn: ""
      pool:
        max_conns: 20
        min_conns: 2
        max_conn_lifetime: 30m
        max_conn_idle_time: 5m
      timeouts:
        connect: 5s
        statement: 0s
      healthcheck_period: 30s

  limits:
    max_object_size: "100MB"
    max_multipart_size: "1TB"
    min_part_size: "5MB"
    max_part_size: "5GB"
    max_parts: 10000
    allowed_content_types:
      - "image/jpeg"
      - "image/png"
      - "image/heic"
      - "image/heif"
      - "image/tiff"
      - "text/plain"
      - "application/pdf"
      - "application/json"
      - "application/octet-stream"
    presign:
      put_ttl: 15m
      get_ttl: 15m
      part_ttl: 15m
      default_ttl: 15m
      max_ttl: 168h
      default_max_size: 5368709120

  # PALADIN IAM mints HS256 JWTs and verifies them per plane. signing_key
  # is the same on both sides. In production, prefer signing_key_secret.
  auth:
    issuer: "paladin-dev"
    signing_key: "dev-secret-change-me-32-bytes-min"
    # signing_key_secret: { name: paladin-iam, key: signing_key }
    jwks_url: ""
    leeway: 30s
    access_token_ttl: 15m
    refresh_token_ttl: 168h
    scoped_token_max_ttl: 24h

  security:
    trust_tenant_id_from_request: true
    reject_tenant_mismatch: true
    log_sensitive: false

  middleware:
    timeouts:
      fast_operation: 5s
      default_operation: 30s
      s3_operation: 60s
      long_operation: 2m
    rate_limit:
      enabled: true
      requests_per_second: 300
      burst: 500
      max_tenants: 10000
      cleanup_ttl: 10m
      cleanup_interval: 5m
    cache:
      enabled: true
      max_size: 1000
      ttl: 5m
    idempotency:
      enabled: true
      ttl: 24h

  workers:
    reconciler:
      interval: 30s
      min_object_age: 2h
      batch_size: 100
    housekeeping:
      interval: 1h
      pending_ttl: 24h
      multipart_ttl: 72h
      audit_log_ttl: 8760h
      delete_orphaned_parts: false
    refresh_token_reap:
      interval: 1h
    api_key_reap:
      interval: 1h
    lifecycle:
      enabled: true
      interval: 30m
    replication:
      enabled: false
      interval: 5m
      lookback_window: 1h

  # SeaweedFS-backed storage. The static keys here must match the
  # accessKey / secretKey configured in the SeaweedFS s3-secret manifest
  # (deploy/manifests/storage/seaweedfs/s3-secret.yaml). For non-local
  # environments swap the inline values for *_secret refs.
  storage:
    default_backend: primary
    backends:
      primary:
        kind: s3-compatible
        bucket: paladin-primary
        region: us-east-1
        endpoint: "http://seaweedfs-filer.storage.svc.cluster.local:8333"
        public_endpoint: "https://s3.paladin.local"
        force_path_style: true
        auth:
          mode: static_keys
          access_key: dummy_access_key
          # access_key_secret: { name: paladin-s3, key: access_key, namespace: storage }
          secret_key: dummy_secret_key
          # secret_key_secret: { name: paladin-s3, key: secret_key, namespace: storage }
        part_size: "8MB"
        sse:
          type: ""
          key_id: ""
        events:
          enabled: false
          target: "none"
          queue_url: ""
          poll_interval: 20s

  cedar:
    policy_cache_ttl: 30s

  mcp:
    upstreams:
      admin_url: "http://localhost:8090"
      data_url: "http://localhost:8080"
      iam_url: "http://localhost:8085"
    stdio:
      enabled: true
      allow_write: false
    http:
      enabled: true
      addr: ":8095"
      allow_write: false
      session_timeout: 10m

image:
  repository: registry.local/paladin
  pullPolicy: Always
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.paladin.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - api.paladin.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /startupz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 12

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes:
  - name: config
    configMap:
      name: paladin-config
  - name: migrations
    emptyDir: {}

volumeMounts:
  - name: config
    mountPath: /app/configs
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

rbac:
  secretReader:
    enabled: true
    clusterWide: true
    secretNames:
      - paladin-postgresql-app-user
      - paladin-postgresql-superuser
      - paladin-admin-key
