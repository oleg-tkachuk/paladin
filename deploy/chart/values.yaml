replicaCount: 1
metadata:
  version: ""
  commit: "unknown"
  buildTime: "unknown"

# Time the kubelet waits for a graceful shutdown before SIGKILL. Should
# match `config.server.shutdown_timeout` plus a small buffer so in-flight
# requests have time to drain before the pod is killed.
terminationGracePeriodSeconds: 30

config:
  app:
    name: paladin
    env: local                            # local | staging | prod

  logger:
    level: debug                          # debug | info | warn | error | dpanic | panic | fatal
    format: json                          # json | console
    development: true
    disable_caller: false
    disable_stacktrace: true
    sampling:
      enabled: false
      initial: 100
      thereafter: 100
    # logger.fields.{service,env} default from app.name / app.env via CUE.

  otel:
    enabled: false
    endpoint: "otel-collector:4317"
    protocol: http
    insecure: true
    # otel.resource.{service.name,deployment.environment} default from
    # app.name / app.env via CUE.

  # Three-plane HTTP listeners: data (end-user object operations),
  # admin (internal/SRE), iam (login + token exchange).
  server:
    mode: debug
    shutdown_timeout: 20s
    log_probes: false
    data_http: &http_defaults
      addr: "0.0.0.0:8080"
      read_header_timeout: 5s
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 90s
      max_header_bytes: 1048576
      max_body_bytes: 10485760
      request_id_header: "X-Request-Id"
      real_ip_header: "X-Forwarded-For"
      trusted_proxies: []
      # No browsers ever talk to the backend directly — the UI hits its own
      # Next.js BFF (/api/rpc/{plane}) which proxies in-cluster. Closed by
      # default; opening to a specific origin would only be needed if a
      # third-party browser-side client is introduced.
      cors_allowed_origins: []
      tls: { enabled: false }
    admin_http:
      <<: *http_defaults
      addr: "0.0.0.0:8090"
    iam_http:
      <<: *http_defaults
      addr: "0.0.0.0:8085"

  datastores:
    postgres:
      # Runtime DSN — must point at the minimum-privilege role
      # (`paladin_app`). See migrations/011_app_role.sql + docs/db-roles.md.
      dsn: "postgres://paladin_app@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=disable"
      password_secret:
        name: paladin-postgresql-app-user
        key: password
        namespace: database
      # DDL-capable DSN used only by goose at startup. Distinct from the
      # runtime role so the runtime pool can be locked down.
      migrate_dsn: "postgres://paladin_migrate@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=disable"
      migrate_password_secret:
        name: paladin-postgresql-migrate-user
        key: password
        namespace: database
      reaper_dsn: ""
      pool:
        max_conns: 20
        min_conns: 2
        max_conn_lifetime: 30m
        max_conn_idle_time: 5m
      timeouts:
        connect: 5s
        statement: 30s
      healthcheck_period: 30s

  limits:
    max_object_size: "100MB"
    max_multipart_size: "1TB"
    min_part_size: "5MB"
    max_part_size: "5GB"
    max_parts: 10000
    allowed_content_types:
      - "image/jpeg"
      - "image/png"
      - "image/heic"
      - "image/heif"
      - "image/tiff"
      - "text/plain"
      - "application/pdf"
      - "application/json"
      - "application/octet-stream"
    presign:
      put_ttl: 15m
      get_ttl: 15m
      part_ttl: 15m
      default_ttl: 15m
      max_ttl: 168h
      default_max_size: 5368709120

  # PALADIN IAM mints HS256 JWTs and verifies them per plane. signing_key
  # is the same on both sides. In production, prefer signing_key_secret.
  auth:
    issuer: "paladin-dev"
    signing_key: "dev-secret-change-me-32-bytes-min"
    # signing_key_secret: { name: paladin-iam, key: signing_key }
    jwks_url: ""
    leeway: 30s
    access_token_ttl: 15m
    refresh_token_ttl: 168h
    scoped_token_max_ttl: 24h

  security:
    trust_tenant_id_from_request: true
    reject_tenant_mismatch: true
    log_sensitive: false

  # ArgoCD-style platform-admin bootstrap. When enabled, the chart creates
  # the Secret itself (templates/secret-bootstrap-admin.yaml) and the
  # server resolves the password through K8sSecretResolver — no env vars,
  # no operator pre-creating the Secret. The `password_secret.name` /
  # `.key` MUST match the chart-root `bootstrap.admin.passwordSecret` so
  # the resolver sees the Secret the chart created.
  bootstrap:
    admin:
      enabled: true
      subject: "admin"
      tenant_slug: "platform"
      tenant_display_name: "Platform"
      display_name: ""
      roles: ["platform.admin"]
      password_secret:
        name: "paladin-bootstrap-admin"
        key: "password"
        # Empty namespace → resolver falls back to the pod's own namespace.
        namespace: ""
      min_password_length: 0
      force_reset: false

  middleware:
    timeouts:
      fast_operation: 5s
      default_operation: 30s
      s3_operation: 60s
      long_operation: 2m
    rate_limit:
      enabled: true
      requests_per_second: 300
      burst: 500
      max_tenants: 10000
      cleanup_ttl: 10m
      cleanup_interval: 5m
    cache:
      enabled: true
      max_size: 1000
      ttl: 5m
    idempotency:
      enabled: true
      ttl: 24h

  workers:
    reconciler:
      interval: 30s
      min_object_age: 2h
      batch_size: 100
    housekeeping:
      interval: 1h
      pending_ttl: 24h
      multipart_ttl: 72h
      audit_log_ttl: 8760h
      delete_orphaned_parts: false
    refresh_token_reap:
      interval: 1h
    api_key_reap:
      interval: 1h
    lifecycle:
      enabled: true
      interval: 30m
    replication:
      enabled: false
      interval: 5m
      lookback_window: 1h

  # SeaweedFS-backed storage. The static keys here must match the
  # accessKey / secretKey configured in the SeaweedFS s3-secret manifest
  # (deploy/manifests/storage/seaweedfs/s3-secret.yaml). For non-local
  # environments swap the inline values for *_secret refs.
  storage:
    default_backend: primary
    backends:
      primary:
        kind: s3-compatible
        bucket: paladin-primary
        region: us-east-1
        endpoint: "http://seaweedfs-filer.storage.svc.cluster.local:8333"
        public_endpoint: "https://s3.paladin.local"
        force_path_style: true
        auth:
          mode: static_keys
          access_key: dummy_access_key
          # access_key_secret: { name: paladin-s3, key: access_key, namespace: storage }
          secret_key: dummy_secret_key
          # secret_key_secret: { name: paladin-s3, key: secret_key, namespace: storage }
        part_size: "8MB"
        sse:
          type: ""
          key_id: ""
        events:
          enabled: false
          target: "none"
          queue_url: ""
          poll_interval: 20s

  cedar:
    policy_cache_ttl: 30s

  mcp:
    upstreams:
      admin_url: "http://localhost:8090"
      data_url: "http://localhost:8080"
      iam_url: "http://localhost:8085"
    stdio:
      enabled: true
      allow_write: false
    http:
      enabled: true
      addr: ":8095"
      allow_write: false
      session_timeout: 10m

image:
  repository: registry.local/paladin
  pullPolicy: Always
  tag: ""

# Bootstrap (chart-level) — password / Secret-name override surface for
# the platform-admin Secret the chart creates. The Go bootstrap step
# reads the Secret via K8sSecretResolver, so there is no env var or
# secretKeyRef on the deployment. The same `name` / `key` MUST appear
# in `config.bootstrap.admin.password_secret` so the resolver finds
# the Secret the chart provisioned.
#
# WHETHER the Secret is created is governed by the SAME flag the binary
# checks: `config.bootstrap.admin.enabled`. Don't add a duplicate
# `bootstrap.admin.enabled` here — the parallel knob silently drifted
# in the past and produced "access denied reading secret
# paladin-bootstrap-admin" because the resolver expected a Secret the
# template never rendered. Single source of truth lives under `config`.
#
# Password resolution at install time:
#   1. Pre-existing Secret in the namespace → preserved (no rotation).
#   2. `--set bootstrap.admin.password=<value>` (or --set-file) → that value.
#   3. Otherwise → chart auto-generates a 24-char random password.
#
# After install, retrieve the auto-generated password with:
#   kubectl get secret <name> -n <ns> -o jsonpath='{.data.password}' | base64 -d
bootstrap:
  admin:
    # Inline password override. Empty + no existing Secret → chart auto-
    # generates a random one. Pass via --set-file to keep it out of shell
    # history. Never commit a real value to git.
    password: ""
    passwordSecret:
      name: "paladin-bootstrap-admin"
      key: "password"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# Pod-level security context. Defaults intentionally non-empty —
# locked-down runtime is the right default; operators who need to relax
# it for sidecar tooling override per-release.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532             # distroless 'nonroot' UID
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level. readOnlyRootFilesystem is safe because the binary
# writes only to stdout/stderr; configs are mounted RO from the
# ConfigMap; migrations are embedded into the binary.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  # Three-plane HTTP service. Order matters for the Service object — the
  # first port stays at .spec.ports[0] so out-of-the-box `kubectl
  # port-forward svc/<name>` lands on data:8080, which is what most
  # operators expect.
  ports:
    data: 8080
    iam: 8085
    admin: 8090
  # Backwards-compat shim. Charts that imported old values are likely
  # using `.Values.service.port` for templating; we keep it pointed at
  # the data plane so existing references keep working.
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.paladin.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - api.paladin.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}

# Probes target the data-plane port. The internal/health package mounts
# /livez, /readyz, /startupz on every plane's mux, so any of the three
# would work — data is the natural default.
#
# Probe semantics (see internal/health/health.go):
#   /livez    — process alive, dependency-free; flips to 503 only after
#               graceful-shutdown signalling.
#   /readyz   — pod ready to serve; checks DB ping with a 2s budget.
#   /startupz — bootstrap done; same checks as readyz, used until
#               kubelet sees the first 200.
#
# `timeoutSeconds: 3` exceeds the in-handler 2s check budget so kubelet's
# own deadline doesn't kill probes that are already correctly bounded
# server-side. Without this, a 1s kubelet default would race the in-pod
# check and kubelet would mark the pod NotReady before the handler even
# returned its real status.
livenessProbe:
  httpGet:
    path: /livez
    port: data
  initialDelaySeconds: 15
  periodSeconds: 20
  timeoutSeconds: 1            # /livez never blocks, 1s is plenty
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: data
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3            # exceeds the 2s in-handler check budget
  # 3 consecutive failures (≈30s) before kube-proxy removes us — gives
  # the dependency room to recover from blips without bouncing traffic.
  failureThreshold: 3
  successThreshold: 1

startupProbe:
  httpGet:
    path: /startupz
    port: data
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  # 24 × 5s = 120s startup window — long enough for first-time goose
  # migrations against a fresh cluster (which can run hundreds of DDL
  # statements) plus connection-pool warm-up. Once startupz returns 200
  # once, kubelet stops calling it and switches to live+ready probes.
  failureThreshold: 24

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Default volumes. The configmap name is templated in deployment.yaml so
# this list intentionally references the chart-fullname-suffixed
# configmap; do not hardcode 'paladin-config' here.
#
# Migrations are NOT a volume — they're embedded into the binary via
# go:embed. The previous emptyDir mount was dead weight and has been
# removed.
volumes: []

volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}

# RBAC for the K8sSecretResolver. The resolver issues exactly one verb
# (GET) per referenced secret — list/watch are NOT used. We narrow the
# verbs to match.
#
# `secretNames` lists every secret referenced from `config.*.password_secret`
# / `config.*.access_key_secret` / `config.*.secret_key_secret`. Operators
# who add new secret references must extend this list, otherwise the
# resolver will 403 at startup.
rbac:
  secretReader:
    enabled: true
    clusterWide: true
    secretNames:
      - paladin-postgresql-app-user
      - paladin-postgresql-migrate-user
      - paladin-admin-key
      # Bootstrap admin password — read once at startup when
      # config.bootstrap.admin.enabled=true. Resolver looks in the
      # pod's own namespace (config.bootstrap.admin.password_secret.namespace
      # is empty → falls back to the SA namespace). Drop this entry
      # when bootstrap is permanently disabled.
      - paladin-bootstrap-admin
