apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "chart.fullname" . }}-test-connection"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.37
      # /livez returns 200 once the binary is up — root path returns 404
      # because no top-level handler is registered. Probing the actual
      # health endpoint catches misconfigurations the previous root-path
      # GET would silently report as "connected".
      command: ["wget"]
      args:
        - "--quiet"
        - "--server-response"
        - "--tries=1"
        - "--timeout=5"
        - "{{ include "chart.fullname" . }}:{{ .Values.service.ports.data }}/livez"
