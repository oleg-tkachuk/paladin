{{- /*
  Cross-namespace Secret copier — pre-install / pre-upgrade hook.

  Some external services (Qdrant, LiteLLM, etc.) maintain their bearer
  keys in their own namespace. The K8sSecretResolver inside PALADIN can
  read them cross-namespace via the secret-reader ClusterRole, but
  some operators prefer a copy into the PALADIN namespace so the runtime
  RBAC stays single-namespace and audit is simpler.

  This Job iterates over `secretCopy.entries` in values.yaml and
  copies each (sourceName, sourceNamespace) -> (destName, paladin-namespace).
  Idempotent: existing destination secrets are overwritten.

  ServiceAccount: a one-shot SA scoped to GET on the source namespace's
  secret + CREATE/UPDATE on the destination's secret. Cleaned up by
  the helm.sh/hook-delete-policy alongside the Job pod.

  Image: alpine/k8s — small alpine-based, ships kubectl + jq + bash.
  Pinned to a specific tag rather than `latest` for reproducibility.
*/}}
{{- if and .Values.secretCopy .Values.secretCopy.enabled .Values.secretCopy.entries }}
{{- $fullname := printf "%s-secret-copy" (include "chart.fullname" .) -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # Read source secrets from arbitrary namespaces. resourceNames
  # narrows to exactly the names listed in secretCopy.entries.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- range .Values.secretCopy.entries }}
      - {{ .source.name | quote }}
      {{- end }}
  # Create / update destination secrets in the PALADIN namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    # weight=-3 places this between the RBAC objects (-5) and the
    # migrate Job (0) so the SA exists before the Job runs and the
    # destination Secrets exist before any Deployment starts mounting them.
    "helm.sh/hook-weight": "-3"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "chart.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $fullname }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: copy
          image: "alpine/k8s:1.31.0"
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              {{- range .Values.secretCopy.entries }}
              echo "[copy] {{ .source.namespace }}/{{ .source.name }} -> {{ $.Release.Namespace }}/{{ if and .dest .dest.name }}{{ .dest.name }}{{ else }}{{ .source.name }}{{ end }}"
              kubectl get secret {{ .source.name | quote }} \
                  --namespace {{ .source.namespace | quote }} \
                  -o json \
                | jq 'del(.metadata.namespace, .metadata.uid, .metadata.resourceVersion, .metadata.creationTimestamp, .metadata.ownerReferences) | .metadata.name = "{{ if and .dest .dest.name }}{{ .dest.name }}{{ else }}{{ .source.name }}{{ end }}"' \
                | kubectl apply --namespace {{ $.Release.Namespace | quote }} -f -
              {{- end }}
{{- end }}
