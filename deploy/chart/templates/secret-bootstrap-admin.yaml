{{- if .Values.bootstrap.admin.enabled -}}
{{- /*
Bootstrap-admin Secret. Created by the chart so operators don't have to
pre-create it; preserved across `helm upgrade` via `lookup` so a fresh
random password isn't regenerated and the existing admin keeps working.

Resolution order for the password:

  1. Existing Secret in the cluster (preserved as-is) — keeps the admin
     password stable across upgrades.
  2. Operator-supplied via `--set bootstrap.admin.password=<value>`. Use
     `--set-file` to read it from disk and avoid having the literal in
     shell history.
  3. Auto-generated 24-char random string. Operator retrieves it after
     install with:
        kubectl get secret <name> -n <ns> -o jsonpath='{.data.password}' | base64 -d
     This is the ArgoCD initial-admin-secret pattern.

The Go bootstrap step then resolves the Secret via K8sSecretResolver and
provisions the user — see internal/bootstrap/admin.go and docs/security.md.
*/ -}}
{{- $secretName := .Values.bootstrap.admin.passwordSecret.name -}}
{{- $namespace := .Release.Namespace -}}
{{- $existing := lookup "v1" "Secret" $namespace $secretName -}}
{{- $key := .Values.bootstrap.admin.passwordSecret.key | default "password" -}}
{{- $password := "" -}}
{{- if $existing -}}
  {{- /* Preserve the existing value — never overwrite a deployed Secret. */ -}}
  {{- $password = index $existing.data $key | b64dec -}}
{{- else if .Values.bootstrap.admin.password -}}
  {{- $password = .Values.bootstrap.admin.password -}}
{{- else -}}
  {{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    # Tell Helm that updates to this Secret are a no-op — the chart
    # template only writes on the very first install. Helm hook annotations
    # would also work, but `helm.sh/resource-policy: keep` prevents
    # accidental deletion on `helm uninstall` so the admin survives a
    # chart re-install.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
