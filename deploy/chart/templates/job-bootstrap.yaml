{{- /*
  Bootstrap Job — pre-install / pre-upgrade hook, weight=10 so it runs
  after migrate. Idempotent: EnsureAdmin / EnsureBackends are no-ops once
  the rows exist with the desired values.

  Skip when chart-level `bootstrap.admin.enabled=false` AND the server
  side `config.bootstrap.admin.enabled=false` — neither the chart-managed
  Secret path nor the server-side EnsureAdmin runs, so the Job is dead
  weight. The operator must explicitly opt out of both.

  See deploy/chart/values.yaml `bootstrap:` for the four-combination
  matrix that controls who provisions the admin Secret.
*/}}
{{- if .Values.jobs.bootstrap.enabled }}
{{- $fullname := printf "%s-bootstrap" (include "chart.fullname" .) -}}
{{- $sa := include "chart.roleServiceAccountName" (dict "ctx" . "role" "bootstrap" "spec" dict) -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "bootstrap") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.jobs.bootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.jobs.bootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "chart.roleLabels" (dict "ctx" . "role" "bootstrap") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $sa }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: bootstrap
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "bootstrap"
          {{- with .Values.jobs.bootstrap.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "chart.fullname" . }}-config
{{- end }}
