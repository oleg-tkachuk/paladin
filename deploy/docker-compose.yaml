services:
  postgres:
    image: postgres:16
    container_name: paladin-postgres
    environment:
      POSTGRES_DB: paladin
      POSTGRES_USER: paladin
      POSTGRES_PASSWORD: paladin
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paladin -d paladin"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - paladin_pg_data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: paladin-seaweedfs
    command: server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9333:9333"
      - "8081:8080" # Volume/Master UI (Internal 8080 -> Host 8081)
      - "8888:8888" # Filer
      - "8333:8333" # S3
    volumes:
      - paladin_seaweed_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  paladin:
    image: paladin
    container_name: paladin
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile
      network: host
      args:
        APP_VERSION: ${APP_VERSION:-v0.0.1-dev}
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-local-dev}
        BUILD_TIME: ${BUILD_TIME:-now}
        HTTP_PORT: 8080
        GRPC_PORT: 9090
    command: ["--config", "/app/configs/paladin.local.yaml"]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./../configs:/app/configs:ro
      - ./../migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  paladin_pg_data:
  paladin_seaweed_data:
