services:
  postgres:
    image: postgres:16
    container_name: paladin-postgres
    environment:
      POSTGRES_DB: paladin
      POSTGRES_USER: paladin
      POSTGRES_PASSWORD: paladin
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paladin -d paladin"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - paladin_pg_data:/var/lib/postgresql/data

  seaweed-master:
    image: chrislusf/seaweedfs:latest
    container_name: paladin-seaweed-master
    command: master -ip=seaweed-master -ip.bind=0.0.0.0
    ports:
      - "9333:9333"

  seaweed-volume:
    image: chrislusf/seaweedfs:latest
    container_name: paladin-seaweed-volume
    command: volume -mserver=seaweed-master:9333 -ip=seaweed-volume -ip.bind=0.0.0.0 -dir=/data
    depends_on:
      - seaweed-master
    ports:
      - "8081:8080"
    volumes:
      - paladin_seaweed_volume:/data

  seaweed-filer:
    image: chrislusf/seaweedfs:latest
    container_name: paladin-seaweed-filer
    command: filer -master=seaweed-master:9333 -ip=seaweed-filer -ip.bind=0.0.0.0
    depends_on:
      - seaweed-master
      - seaweed-volume
    ports:
      - "8888:8888"

  seaweed-s3:
    image: chrislusf/seaweedfs:latest
    container_name: paladin-seaweed-s3
    command: s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0
    depends_on:
      - seaweed-filer
    ports:
      - "8333:8333"

  paladin:
    image: paladin
    container_name: paladin
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile
      args:
        APP_VERSION: 0.1.0
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH}
        BUILD_TIME: ${BUILD_TIME}
        HTTP_PORT: 8080
        GRPC_PORT: 9090
    environment:
      ENV: local
      SERVICE_NAME: paladin
      POD_NAME: paladin

      HTTP_ADDR: 0.0.0.0:8080
      GRPC_ADDR: 0.0.0.0:9090

      DB_DSN: postgres://paladin:paladin@postgres:5432/paladin?sslmode=disable

      # S3-compatible (SeaweedFS)
      S3_BUCKET: paladin
      S3_REGION: us-east-1
      S3_ENDPOINT: http://seaweed-s3:8333
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY: dummy
      S3_SECRET_KEY: dummy
      S3_PRESIGN_TTL: 15m
      S3_PART_SIZE: 8MB

      POLICY_MAX_OBJECT_SIZE: 100MB
      POLICY_ALLOWED_CONTENT_TYPES: image/jpeg,image/png,application/pdf,text/plain

      # OTel (optional)
      OTEL_ENABLED: "false"
      OTEL_SERVICE_NAME: paladin
      OTEL_ENVIRONMENT: local
      OTEL_OTLP_ENDPOINT: otel-collector:4317
      OTEL_INSECURE: "true"

    depends_on:
      postgres:
        condition: service_healthy
      seaweed-s3:
        condition: service_started
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./../configs:/app/configs:ro
      - ./../migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  paladin_pg_data:
  paladin_seaweed_volume:
