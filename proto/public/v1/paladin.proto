syntax = "proto3";

package paladin.public.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/grpc/public;publicapi";

service Paladin {
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
  rpc GetObjectMeta(GetObjectRequest) returns (GetObjectMetaResponse);
  rpc CompleteObject(CompleteObjectRequest) returns (CompleteObjectResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  rpc InitiateMultipart(InitiateMultipartRequest) returns (InitiateMultipartResponse);
  rpc SignPart(SignPartRequest) returns (SignPartResponse);
  rpc CompleteMultipart(CompleteMultipartRequest) returns (CompleteMultipartResponse);
  rpc AbortMultipart(AbortMultipartRequest) returns (AbortMultipartResponse);

  // Categories
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (GetCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc GetCategoryStats(GetCategoryStatsRequest) returns (GetCategoryStatsResponse);

  rpc GetObjectStats(GetObjectStatsRequest) returns (GetObjectStatsResponse);
}

message GetObjectStatsRequest {}

message GetObjectStatsResponse {
  int64 total_count = 1;
  int64 total_size = 2;
  int64 pending_count = 3;
  int64 uploading_count = 4;
  int64 uploaded_count = 5;
  int64 complete_count = 6;
  int64 soft_deleted_count = 7;
}

message ListCategoriesRequest {
  int32 limit = 1;
  string cursor = 2;
}

message ListCategoriesResponse {
  repeated Category items = 1;
  string next_cursor = 2;
  int64 total_count = 3;
}

message GetCategoryRequest {
  string slug = 1;
}

message GetCategoryResponse {
  Category category = 1;
}

message CreateCategoryRequest {
  string slug = 1;
  string name = 2;
  optional string description = 3;
}

message DeleteCategoryRequest {
  string slug = 1;
}

message DeleteCategoryResponse {
  string status = 1;
}

message GetCategoryStatsRequest {
  string slug = 1;
}

message GetCategoryStatsResponse {
  int64 total_count = 1;
  int64 total_size = 2;
}

message Category {
  string id = 1;
  string slug = 2;
  string name = 3;
  optional string description = 4;
}

message CreateObjectRequest {
  string content_type = 1;
  int64 size_bytes = 2;
  map<string, string> labels = 3;
  string external_ref = 4;
  string category = 5;
}

message CreateObjectResponse {
  string object_id = 1;
  string object_key = 2;
  string upload_url = 3;
  string method = 4;
  map<string, string> headers = 5;
  int64 expires_at_unix = 6;
}

message GetObjectRequest {
  string object_id = 1;
}

message GetObjectResponse {
  string object_id = 1;
  string object_key = 2;
  string bucket = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  string status = 6;
  string download_url = 7;
  int64 expires_at_unix = 8;
  map<string, string> labels = 9;
  string external_ref = 10;
}

message GetObjectMetaResponse {
  string object_id = 1;
  string object_key = 2;
  string bucket = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  string status = 6;
  int64 expires_at_unix = 7;
  map<string, string> labels = 8;
  string external_ref = 9;
}

message CompleteObjectRequest {
  string object_id = 1;
}

message CompleteObjectResponse {
  string status = 1;
}

message DeleteObjectRequest {
  string object_id = 1;
}

message DeleteObjectResponse {
  string status = 1;
}

message InitiateMultipartRequest {
  string content_type = 1;
  int64 size_bytes = 2;
  map<string, string> labels = 3;
  string external_ref = 4;
  string category = 5;
}

message InitiateMultipartResponse {
  string object_id = 1;
  string object_key = 2;
  string upload_id = 3;
  int64 part_size = 4;
  int64 expires_at_unix = 5;
}

message SignPartRequest {
  string upload_id = 1;
  int32 part_number = 2;
}

message SignPartResponse {
  string upload_url = 1;
  string method = 2;
  int64 expires_at_unix = 3;
}

message CompleteMultipartRequest {
  string upload_id = 1;
  repeated CompleteMultipartPart parts = 2;
}

message CompleteMultipartPart {
  int32 part_number = 1;
  string etag = 2;
}

message CompleteMultipartResponse {
  string object_id = 1;
  string status = 2;
}

message AbortMultipartRequest {
  string upload_id = 1;
}

message AbortMultipartResponse {
  string status = 1;
}
