syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/grpc;grpcapi";

service Paladin {
  rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
  rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
  rpc GetObjectMeta(GetObjectRequest) returns (GetObjectMetaResponse);
  rpc PatchObjectMeta(PatchObjectMetaRequest) returns (PatchObjectMetaResponse);
  rpc CompleteObject(CompleteObjectRequest) returns (CompleteObjectResponse);
  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  // RestoreObject brings back a soft-deleted object to its original state.
  rpc RestoreObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  // PurgeObject permanently deletes an object and its data from storage.
  // This action cannot be undone.
  rpc PurgeObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  rpc InitiateMultipart(InitiateMultipartRequest) returns (InitiateMultipartResponse);
  rpc SignPart(SignPartRequest) returns (SignPartResponse);
  rpc CompleteMultipart(CompleteMultipartRequest) returns (CompleteMultipartResponse);
  rpc AbortMultipart(AbortMultipartRequest) returns (AbortMultipartResponse);

  // Categories
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (GetCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
  rpc GetCategoryStats(GetCategoryStatsRequest) returns (GetCategoryStatsResponse);

  rpc GetObjectStats(GetObjectStatsRequest) returns (GetObjectStatsResponse);
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

  // Tenant lifecycle management (admin-only)
  rpc CreateTenant(CreateTenantRequest) returns (TenantResponse);
  rpc GetTenant(GetTenantRequest) returns (TenantResponse);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
  rpc PatchTenantMetadata(PatchTenantMetadataRequest) returns (TenantResponse);

  // Bulk operations
  rpc BulkCreateObjects(BulkCreateObjectsRequest) returns (BulkCreateObjectsResponse);
  rpc BulkDeleteObjects(BulkDeleteObjectsRequest) returns (BulkDeleteObjectsResponse);
  rpc BulkRestoreObjects(BulkRestoreObjectsRequest) returns (BulkRestoreObjectsResponse);
  rpc BulkPurgeObjects(BulkPurgeObjectsRequest) returns (BulkPurgeObjectsResponse);
  rpc BulkSignUploads(BulkSignUploadsRequest) returns (BulkSignUploadsResponse);
  rpc BulkCompleteObjects(BulkCompleteObjectsRequest) returns (BulkCompleteObjectsResponse);
  rpc BulkPatchObjects(BulkPatchObjectsRequest) returns (BulkPatchObjectsResponse);
}

message BulkCreateObjectsRequest {
  string tenant_id = 1;
  repeated CreateObjectRequest items = 2;
  optional string idempotency_key = 3;
}

message BulkCreateObjectsResponse {
  repeated CreateObjectResponse items = 1;
}

message BulkDeleteObjectsRequest {
  string tenant_id = 1;
  repeated string object_ids = 2;
}

message BulkDeleteObjectsResponse {
  int64 count = 1;
}

message BulkRestoreObjectsRequest {
  string tenant_id = 1;
  repeated string object_ids = 2;
}

message BulkRestoreObjectsResponse {
  int64 count = 1;
}

message BulkPurgeObjectsRequest {
  string tenant_id = 1;
  repeated string object_ids = 2;
  optional string idempotency_key = 3;
}

message BulkPurgeObjectsResponse {
  int64 count = 1;
}

message BulkSignUploadsRequest {
  string tenant_id = 1;
  repeated SignUploadItem items = 2;
}

message SignUploadItem {
  string object_id = 1;
  int32 upload_ttl = 2;
}

message BulkSignUploadsResponse {
  repeated CreateObjectResponse items = 1;
}

message BulkCompleteObjectsRequest {
  string tenant_id = 1;
  repeated string object_ids = 2;
}

message BulkCompleteObjectsResponse {
  repeated CompleteObjectResponse items = 1;
}

message BulkPatchObjectsRequest {
  string tenant_id = 1;
  repeated BulkPatchItem items = 2;
  optional string idempotency_key = 3;
}

message BulkPatchItem {
  string object_id = 1;
  map<string, string> labels = 2;
  optional string external_ref = 3;
}

message BulkPatchObjectsResponse {
  int64 count = 1;
}


message GetObjectStatsRequest {
  string tenant_id = 1;
}

message GetObjectStatsResponse {
  int64 total_count = 1;
  int64 total_size = 2;
  int64 pending_count = 3;
  int64 uploading_count = 4;
  int64 uploaded_count = 5;
  int64 complete_count = 6;
  int64 soft_deleted_count = 7;
}

message ListCategoriesRequest {
  string tenant_id = 1;
  int32 limit = 2;
  string cursor = 3;
}

message ListCategoriesResponse {
  repeated Category items = 1;
  string next_cursor = 2;
  int64 total_count = 3;
}

message GetCategoryRequest {
  string tenant_id = 1;
  string slug = 2;
}

message GetCategoryResponse {
  Category category = 1;
}

message CreateCategoryRequest {
  string tenant_id = 1;
  string slug = 2;
  string name = 3;
  optional string description = 4;
}

message DeleteCategoryRequest {
  string tenant_id = 1;
  string slug = 2;
}

message DeleteCategoryResponse {
  string status = 1;
}

message GetCategoryStatsRequest {
  string tenant_id = 1;
  string slug = 2;
}

message GetCategoryStatsResponse {
  int64 total_count = 1;
  int64 total_size = 2;
}

message Category {
  string id = 1;
  string slug = 2;
  string name = 3;
  optional string description = 4;
}

message CreateObjectRequest {
  string tenant_id = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  map<string, string> labels = 4;
  string external_ref = 5;
  string category = 6;
}

message CreateObjectResponse {
  string object_id = 1;
  string object_key = 2;
  string upload_url = 3;
  string method = 4;
  map<string, string> headers = 5;
  int64 expires_at_unix = 6;
}

message GetObjectRequest {
  string tenant_id = 1;
  string object_id = 2;
}

message GetObjectResponse {
  string object_id = 1;
  string object_key = 2;
  string bucket = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  string status = 6;
  string download_url = 7;
  int64 expires_at_unix = 8;
  map<string, string> labels = 9;
  string external_ref = 10;
}

message GetObjectMetaResponse {
  string object_id = 1;
  string object_key = 2;
  string bucket = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  string status = 6;
  int64 expires_at_unix = 7;
  map<string, string> labels = 8;
  string external_ref = 9;
}

message CompleteObjectRequest {
  string tenant_id = 1;
  string object_id = 2;
}

message CompleteObjectResponse {
  string status = 1;
}

message DeleteObjectRequest {
  string tenant_id = 1;
  string object_id = 2;
}

message DeleteObjectResponse {
  string status = 1;
}

message InitiateMultipartRequest {
  string tenant_id = 1;
  string content_type = 2;
  int64 size_bytes = 3;
  map<string, string> labels = 4;
  string external_ref = 5;
  string category = 6;
}

message InitiateMultipartResponse {
  string object_id = 1;
  string object_key = 2;
  string upload_id = 3;
  int64 part_size = 4;
  int64 expires_at_unix = 5;
}

message SignPartRequest {
  string tenant_id = 1;
  string upload_id = 2;
  int32 part_number = 3;
}

message SignPartResponse {
  string upload_url = 1;
  string method = 2;
  int64 expires_at_unix = 3;
}

message CompleteMultipartRequest {
  string tenant_id = 1;
  string upload_id = 2;
  repeated CompleteMultipartPart parts = 3;
}

message CompleteMultipartPart {
  int32 part_number = 1;
  string etag = 2;
}

message CompleteMultipartResponse {
  string object_id = 1;
  string status = 2;
}

message AbortMultipartRequest {
  string tenant_id = 1;
  string upload_id = 2;
}

message AbortMultipartResponse {
  string status = 1;
}

message ListObjectsRequest {
  string tenant_id = 1;
  int32 limit = 2;
  string cursor = 3;
  optional string category = 4;
  optional string status = 5;
  optional string search = 6;
  bool recursive = 7;
}

message ListObjectsResponse {
  repeated ListObjectItem items = 1;
  string next_cursor = 2;
  int64 total_count = 3;
}

message ListObjectItem {
  string object_id = 1;
  string object_key = 2;
  string content_type = 3;
  int64 size_bytes = 4;
  string status = 5;
  int64 created_at_unix = 6;
  string category = 7;
  map<string, string> labels = 8;
  string external_ref = 9;
}

message PatchObjectMetaRequest {
  string tenant_id = 1;
  string object_id = 2;
  map<string, string> labels = 3;
  optional string external_ref = 4;
}

message PatchObjectMetaResponse {
  string object_id = 1;
  map<string, string> labels = 2;
  string external_ref = 3;
}

message CreateTenantRequest {
  string tenant_id = 1;
  string display_name = 2;
  map<string, string> labels = 3;
  repeated string tags = 4;
}

message TenantResponse {
  string tenant_id = 1;
  string display_name = 2;
  map<string, string> labels = 3;
  repeated string tags = 4;
  int64 created_at_unix = 5;
  int64 updated_at_unix = 6;
}

message GetTenantRequest {
  string tenant_id = 1;
}

message DeleteTenantRequest {
  string tenant_id = 1;
}

message DeleteTenantResponse {
  string status = 1;
}

message ListTenantsRequest {
  int32 limit = 1;
  string cursor = 2;
  map<string, string> label_selector = 3;
  repeated string tag_selector = 4;
}

message ListTenantsResponse {
  repeated TenantResponse items = 1;
  string next_cursor = 2;
  int64 total_count = 3;
}

message PatchTenantMetadataRequest {
  string tenant_id = 1;
  string labels_patch_json = 2;
  repeated string tags = 3;
}
