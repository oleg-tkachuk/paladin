syntax = "proto3";

package paladin.iam.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/iam/v1;paladiniamv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/common/v1/pagination.proto";
import "paladin/common/v1/scope.proto";
import "paladin/iam/v1/types.proto";

// UserService is the admin-only side of IAM. CRUD users, grant scopes/roles,
// reset passwords. Requires role `iam.admin` or `platform.admin`.
service UserService {
  // CreateUser adds a user to a tenant. The initial password is returned once
  // and never again — it is not recoverable from any later read.
  rpc CreateUser(CreateUserRequest) returns (User);
  // GetUser returns the user. The password hash is never included.
  rpc GetUser(GetUserRequest) returns (User) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateUser applies update_mask to display_name, roles, scopes and disabled.
  // tenant_id is immutable; the password has its own RPC.
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteUser removes the user's membership in one tenant. A subject that
  // belongs to several tenants keeps the others.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ListUsers pages the users in a tenant.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GrantScopes / RevokeScopes are single-purpose RPCs (cleaner audit trail
  // than UpdateUser with a scopes field).
  rpc GrantScopes(GrantScopesRequest) returns (User) {
    option idempotency_level = IDEMPOTENT;
  }
  // RevokeScopes removes the named scopes from the user. Tokens already issued
  // keep their scopes until they expire — this changes what the next token
  // will carry.
  rpc RevokeScopes(RevokeScopesRequest) returns (User) {
    option idempotency_level = IDEMPOTENT;
  }

  // ResetPassword forces a password change on next login. Local IdP only.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message CreateUserRequest {
  // Parent: "tenants/{tenant_id_or_slug}". Empty means the caller's own
  // tenant — every user belongs to exactly one, including the bootstrap
  // admin, so there is no tenant-less user to address.
  string parent = 1;
  string subject = 2 [(buf.validate.field).string.min_len = 1];
  string display_name = 3;
  string initial_password = 4 [(buf.validate.field).string.min_len = 12, debug_redact = true];
  repeated string roles = 5;
  repeated paladin.common.v1.Scope scopes = 6;
}

message GetUserRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateUserRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  // Mutable fields:
  string display_name = 4;
  bool disabled = 5;
  repeated string roles = 6;
}

message DeleteUserRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteUserResponse {}

message ListUsersRequest {
  string parent = 1; // "tenants/{tenant_id_or_slug}" or empty for cross-tenant (platform admin only)
  paladin.common.v1.PageRequest page = 2;
  // CEL filter against User schema.
  string filter = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  paladin.common.v1.PageResponse page = 2;
}

message GrantScopesRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated paladin.common.v1.Scope scopes = 2 [(buf.validate.field).repeated.min_items = 1];
}

message RevokeScopesRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated paladin.common.v1.Scope scopes = 2 [(buf.validate.field).repeated.min_items = 1];
}

message ResetPasswordRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // If empty, server generates a random one and returns it once.
  string new_password = 2 [debug_redact = true];
}

message ResetPasswordResponse {
  // Set only when caller didn't provide a password — return-once.
  string generated_password = 1 [debug_redact = true];
}
