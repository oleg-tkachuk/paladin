syntax = "proto3";

package paladin.iam.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/iam/v1;paladiniamv1";

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/field_mask.proto";
import "paladin/common/v1/pagination.proto";
import "paladin/common/v1/scope.proto";
import "paladin/iam/v1/types.proto";

// UserService is the admin-only side of IAM. CRUD users, grant scopes/roles,
// reset passwords. Requires role `iam.admin` or `platform.admin`.
service UserService {
  // CreateUser adds a user to a tenant. The initial password is returned once
  // and never again — it is not recoverable from any later read.
  rpc CreateUser(CreateUserRequest) returns (User);
  // GetUser returns the user. The password hash is never included.
  rpc GetUser(GetUserRequest) returns (User) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateUser applies update_mask to display_name, roles, scopes and disabled.
  // tenant_id is immutable; the password has its own RPC.
  rpc UpdateUser(UpdateUserRequest) returns (User) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteUser removes the user's membership in one tenant. A subject that
  // belongs to several tenants keeps the others.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ListUsers pages the users in a tenant.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GrantScopes / RevokeScopes are single-purpose RPCs (cleaner audit trail
  // than UpdateUser with a scopes field).
  rpc GrantScopes(GrantScopesRequest) returns (User) {
    option idempotency_level = IDEMPOTENT;
  }
  // RevokeScopes removes the named scopes from the user. Tokens already issued
  // keep their scopes until they expire — this changes what the next token
  // will carry.
  rpc RevokeScopes(RevokeScopesRequest) returns (User) {
    option idempotency_level = IDEMPOTENT;
  }

  // ResetPassword forces a password change on next login. Local IdP only.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListOAuthGrants returns the live OAuth grants the user gave clients at
  // /oauth/authorize (ADR-0035). Any user may list their own; a tenant admin
  // those of the tenant's users.
  rpc ListOAuthGrants(ListOAuthGrantsRequest) returns (ListOAuthGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RevokeOAuthGrant ends one grant: the client's refresh tokens stop working
  // at once, and an access token it already holds within its short lifetime.
  rpc RevokeOAuthGrant(RevokeOAuthGrantRequest) returns (RevokeOAuthGrantResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListUserCapabilities returns the capabilities that act on the user's
  // behalf: those an agent exchanged under one of the user's OAuth grants,
  // and those delegated from them. Any user may list their own; a tenant
  // admin those of the tenant's users.
  rpc ListUserCapabilities(ListUserCapabilitiesRequest) returns (ListUserCapabilitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message CreateUserRequest {
  // Parent: "tenants/{tenant_id_or_slug}". Empty means the caller's own
  // tenant — every user belongs to exactly one, including the bootstrap
  // admin, so there is no tenant-less user to address.
  string parent = 1;
  string subject = 2 [(buf.validate.field).string.min_len = 1];
  string display_name = 3;
  string initial_password = 4 [(buf.validate.field).string.min_len = 12, debug_redact = true];
  repeated string roles = 5;
  repeated paladin.common.v1.Scope scopes = 6;
}

message GetUserRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateUserRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  // Mutable fields:
  string display_name = 4;
  bool disabled = 5;
  repeated string roles = 6;
}

message DeleteUserRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteUserResponse {}

message ListUsersRequest {
  string parent = 1; // "tenants/{tenant_id_or_slug}" or empty for cross-tenant (platform admin only)
  paladin.common.v1.PageRequest page = 2;
  // CEL filter against User schema.
  string filter = 3;
}

message ListUsersResponse {
  repeated User users = 1;
  paladin.common.v1.PageResponse page = 2;
}

message GrantScopesRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated paladin.common.v1.Scope scopes = 2 [(buf.validate.field).repeated.min_items = 1];
}

message RevokeScopesRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated paladin.common.v1.Scope scopes = 2 [(buf.validate.field).repeated.min_items = 1];
}

message ResetPasswordRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // If empty, server generates a random one and returns it once.
  string new_password = 2 [debug_redact = true];
}

message ResetPasswordResponse {
  // Set only when caller didn't provide a password — return-once.
  string generated_password = 1 [debug_redact = true];
}

message ListOAuthGrantsRequest {
  // The user whose grants to list.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // include_inactive lists grants that were revoked or have expired beside
  // the live ones. They are kept only until their tokens' rows are purged: a
  // revoked grant until its expiry, an expired one for up to the refresh-token
  // reaper's interval.
  bool include_inactive = 2;
}

message ListOAuthGrantsResponse {
  repeated OAuthGrant grants = 1;
}

// OAuthGrant is what a user consented to for one client, while the client
// keeps it alive by rotating its refresh token.
message OAuthGrant {
  // id names the grant for RevokeOAuthGrant.
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string client_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // audience is the plane, or paladin-mcp, the grant's tokens are for.
  string audience = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string scopes = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // granted_at is when the user consented.
  google.protobuf.Timestamp granted_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // refreshed_at is when the client last rotated its refresh token.
  google.protobuf.Timestamp refreshed_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // expires_at is when the grant lapses unless the client rotates again.
  google.protobuf.Timestamp expires_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  // state is whether the grant still lets its client in.
  State state = 8 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State is a grant's standing: decided by its newest refresh token, as a
  // rotation revokes the token it replaces.
  enum State {
    STATE_UNSPECIFIED = 0;
    // The client may refresh its access.
    STATE_ACTIVE = 1;
    // The user, an admin or reuse detection ended it.
    STATE_REVOKED = 2;
    // Its client stopped rotating, and it lapsed.
    STATE_EXPIRED = 3;
  }
}

message RevokeOAuthGrantRequest {
  // The user whose grant to end.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string grant_id = 2 [(buf.validate.field).string.uuid = true];
}

message RevokeOAuthGrantResponse {}

message ListUserCapabilitiesRequest {
  // The user whose capabilities to list.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // states lists the capabilities in any of these; empty, the active ones.
  repeated UserCapability.State states = 2 [(buf.validate.field).repeated.items.enum = {
    defined_only: true,
    not_in: [0]
  }];
  int32 page_size = 3 [(buf.validate.field).int32.gte = 0];
  string page_token = 4;
  // grant_id lists only those exchanged under that OAuth grant: what
  // revoking it revokes. Empty, every grant's.
  string grant_id = 5 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message ListUserCapabilitiesResponse {
  // capabilities are newest first.
  repeated UserCapability capabilities = 1;
  string next_page_token = 2;
}

// UserCapability is a capability acting on a user's behalf, as the user sees
// it: which client holds it, under which grant, and what it allows.
message UserCapability {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // client_id is the OAuth client the capability was granted to.
  string client_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // grant_id is the OAuth grant it was exchanged under, whose revocation
  // revokes it. Empty for one issued outside a grant.
  string grant_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // parent_id is the capability it was delegated from; empty for one
  // exchanged directly.
  string parent_id = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // audience is the planes it may be presented to.
  repeated string audience = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // operations is what it allows.
  repeated string operations = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp issued_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp expires_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  State state = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // revoked_at and revocation_reason are those of the entry that revoked
  // it: its own, or an ancestor's. Unset unless state is REVOKED.
  google.protobuf.Timestamp revoked_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  string revocation_reason = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  // State is what the capability is now: revoked — itself or an ancestor —
  // over expired over active.
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_ACTIVE = 1;
    STATE_EXPIRED = 2;
    STATE_REVOKED = 3;
  }
}
