syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";

// BucketService manages physical S3 buckets. Bucket admins create buckets
// and bind them to backends; tenant admins consume them via Collection.
service BucketService {
  // CreateBucket registers a bucket on a backend. It does not create the
  // physical bucket — see StorageBootstrapService for that.
  rpc CreateBucket(CreateBucketRequest) returns (Bucket);
  // GetBucket returns the bucket, including its versioning, replication and
  // object-lock configuration.
  rpc GetBucket(GetBucketRequest) returns (Bucket) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateBucket applies update_mask; resource_version is required. Versioning,
  // replication and object lock have their own RPCs — they are not settable
  // through this one.
  rpc UpdateBucket(UpdateBucketRequest) returns (Bucket) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteBucket removes the registration. delete_on_backend=true also erases
  // the physical bucket and its contents, which is irreversible.
  // skip_version_check waives the OCC guard and nothing else — the two flags
  // are independent, and only one of them destroys anything.
  rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ListBuckets returns buckets across every backend, optionally filtered to
  // one.
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetBucketPolicy sets/replaces the Cedar policy text. Validated synchronously.
  rpc SetBucketPolicy(SetBucketPolicyRequest) returns (Bucket) {
    option idempotency_level = IDEMPOTENT;
  }

  // SetLifecycleRules / SetObjectLock / SetVersioning / SetReplication are
  // single-purpose RPCs to keep audit log entries focused.
  rpc SetLifecycleRules(SetLifecycleRulesRequest) returns (Bucket) {
    option idempotency_level = IDEMPOTENT;
  }
  // SetObjectLock configures WORM retention for the bucket (ADR-0013). Enabling
  // it is one-way: a bucket with object lock on cannot have it turned off,
  // because objects already written under it rely on the guarantee.
  rpc SetObjectLock(SetObjectLockRequest) returns (Bucket) {
    option idempotency_level = IDEMPOTENT;
  }
  // SetVersioning turns object versioning on or off. Turning it off keeps the
  // versions already recorded — it stops new ones being written.
  rpc SetVersioning(SetVersioningRequest) returns (Bucket) {
    option idempotency_level = IDEMPOTENT;
  }
  // SetReplication configures asynchronous copy to a second backend. Existing
  // objects are not backfilled; replication applies from the moment it is
  // enabled.
  rpc SetReplication(SetReplicationRequest) returns (Bucket) {
    option idempotency_level = IDEMPOTENT;
  }

  // GrantBucket lets a tenant other than the owner bind Collections to the
  // bucket (ADR-0032). Idempotent: a tenant that holds a grant keeps it, with
  // its first granter and time.
  rpc GrantBucket(GrantBucketRequest) returns (BucketGrant) {
    option idempotency_level = IDEMPOTENT;
  }
  // RevokeBucketGrant takes a grant back. Refused with BUCKET_GRANT_IN_USE
  // while the tenant still has Collections in the bucket.
  rpc RevokeBucketGrant(RevokeBucketGrantRequest) returns (RevokeBucketGrantResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ListBucketGrants returns the tenants a bucket is granted to, oldest first.
  rpc ListBucketGrants(ListBucketGrantsRequest) returns (ListBucketGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListAccessibleBuckets is callable by tenant admins. Returns the buckets
  // a tenant may bind Collections to: the ones it owns and the ones granted
  // to it.
  rpc ListAccessibleBuckets(ListAccessibleBucketsRequest) returns (ListBucketsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message CreateBucketRequest {
  // Parent: "storageBackends/{backend_id}".
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  // The S3 bucket name: lowercase letters, digits, dots and hyphens, starting
  // and ending with a letter or digit. Checked here rather than by the
  // backend, which refuses it only after the bucket row exists.
  string bucket_id = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 63
    pattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
  }];
  Bucket bucket = 3 [(buf.validate.field).required = true];
  // True: Paladin creates the bucket on the backend, and refuses a name the
  // backend already holds (ALREADY_EXISTS, BUCKET_EXISTS_ON_BACKEND). False:
  // Paladin takes an existing bucket under its management, and refuses one the
  // backend does not hold (BUCKET_NOT_ON_BACKEND); such a bucket is never
  // public and never deleted on the backend. Either way a feature probe's
  // scratch bucket cannot be registered (BUCKET_RESERVED).
  bool provision_on_backend = 4;
}

message GetBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  Bucket bucket = 4;
}

message DeleteBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC guard. Required unless skip_version_check is set — see the note
  // on that field.
  string resource_version = 2;
  // When true, also removes the physical bucket (and is a destructive op).
  bool delete_on_backend = 3;
  // Explicit opt-out of the OCC guard, and nothing else. Renamed from `force`:
  // the same word meant "skip the trash" on tenants and "ignore the child
  // count" on backends, so an integrator who learned it on one entity turned
  // off the concurrency check on this one while believing they were merely
  // insisting.
  //
  // Destructiveness lives in delete_on_backend, which names what it destroys.
  bool skip_version_check = 4;
}

message DeleteBucketResponse {}

message ListBucketsRequest {
  // Parent: "storageBackends/{backend_id}" or empty for cross-backend.
  string parent = 1;
  paladin.common.v1.PageRequest page = 2;
  // CEL filter, evaluated against the Bucket schema (see internal/filter/cel).
  // Applied to each fetched page; the page cursor is unaffected, so a page
  // whose rows all fail the predicate still returns next_page_token.
  string filter = 3; // CEL over Bucket (reserved — not yet evaluated)
  // owner_tenant_id narrows the listing to buckets owned by exactly
  // this tenant (matches buckets.owner_tenant_id). Tenant UUID only —
  // a slug is INVALID_ARGUMENT; empty = no tenant filter (cross-tenant listing for platform-
  // admin). Backed by the index on buckets(owner_tenant_id)
  // (`001_initial_schema.sql`), so per-tenant lookups are cheap.
  string owner_tenant_id = 4;
  // used_by_tenant_id narrows the listing to the buckets this tenant
  // stores in: the ones it owns, the one it is bound to by default, and
  // every one holding a collection of it. A shared-layout tenant owns no
  // bucket, so owner_tenant_id alone lists nothing for it. UUID only;
  // empty = no such filter. Combines with owner_tenant_id by AND.
  string used_by_tenant_id = 5;
}

message ListBucketsResponse {
  repeated Bucket buckets = 1;
  paladin.common.v1.PageResponse page = 2;
}

message SetBucketPolicyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  string cedar_policy = 3;
}

message SetLifecycleRulesRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  repeated LifecycleRule rules = 3;
}

message SetObjectLockRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  ObjectLockConfig config = 3 [(buf.validate.field).required = true];
}

message SetVersioningRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  BucketVersioning versioning = 3 [(buf.validate.field).required = true];
}

message SetReplicationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  BucketReplication replication = 3 [(buf.validate.field).required = true];
}

message ListAccessibleBucketsRequest {
  // Tenant: "tenants/{tenant_id_or_slug}". Required.
  string tenant = 1 [(buf.validate.field).string.min_len = 1];
  paladin.common.v1.PageRequest page = 2;
}

// A tenant other than its owner that may bind Collections to a bucket.
message BucketGrant {
  // The bucket's resource name: "storageBackends/{backend_id}/buckets/{bucket_id}".
  string bucket = 1;
  // The tenant granted, by UUID.
  string tenant_id = 2;
  // Who granted it: the subject of the call, or the migration that did.
  string granted_by = 3;
  google.protobuf.Timestamp granted_at = 4;
}

message GrantBucketRequest {
  // The bucket: "storageBackends/{backend_id}/buckets/{bucket_id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // The tenant to grant, by UUID.
  string tenant_id = 2 [(buf.validate.field).string.uuid = true];
}

message RevokeBucketGrantRequest {
  // The bucket: "storageBackends/{backend_id}/buckets/{bucket_id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // The tenant whose grant is revoked, by UUID.
  string tenant_id = 2 [(buf.validate.field).string.uuid = true];
}

message RevokeBucketGrantResponse {}

message ListBucketGrantsRequest {
  // The bucket: "storageBackends/{backend_id}/buckets/{bucket_id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ListBucketGrantsResponse {
  repeated BucketGrant grants = 1;
}
