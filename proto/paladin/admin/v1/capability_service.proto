syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto";
import "google/type/money.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";

// CapabilityService manages capability tokens — short-lived, signed,
// delegable, individually revocable authorisation primitives for agent
// runtimes. See internal/capability for the in-process types and
// migrations/001_initial_schema.sql for the schema.
//
// Audience semantics: capabilities are issued by the admin plane and
// presented by callers to data / admin / mcp planes. The interceptor
// verifies signature + audience + expiry + revocation locally — no
// per-request RPC to this service.
//
// Naming: request / response types use the `CapabilityService<Method>`
// prefix because the bare RPC verbs (Issue / Revoke / List) collide
// with other admin services in the same proto package. The verbose
// prefix is what buf STANDARD lint requires when method names alone
// aren't unique.
service CapabilityService {
  // Issue mints a top-level capability for a principal. Caller is
  // platform-admin or a delegating service. Returns the typed
  // capability metadata plus the compact JWT in `token`.
  //
  // Errors: INVALID_ARGUMENT for a malformed request; NOT_FOUND with reason
  // TENANT_NOT_FOUND when the subject's tenant does not exist (yet);
  // FAILED_PRECONDITION with reason TENANT_ALREADY_DELETED when it is in the
  // trash; INTERNAL when the store or the signer fails — a request worth
  // retrying, not a bad one.
  rpc Issue(CapabilityServiceIssueRequest) returns (CapabilityServiceIssueResponse);

  // Delegate issues a strictly-narrower child capability under a
  // parent the caller already holds. Narrowing is enforced at issuance:
  // widening attempts fail before any token is emitted.
  //
  // Errors as Issue's, plus PERMISSION_DENIED for a child wider than its
  // parent and FAILED_PRECONDITION for a parent revoked or expired.
  rpc Delegate(CapabilityServiceDelegateRequest) returns (CapabilityServiceIssueResponse);

  // Revoke adds the supplied capability ID to the revocation list.
  // CascadeChildren=true revokes every descendant in the delegation
  // tree. Idempotent — re-revoking a revoked capability is a no-op, and the
  // response says so, with the entry that stands.
  rpc Revoke(CapabilityServiceRevokeRequest) returns (CapabilityServiceRevokeResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RevokeBiscuit revokes one copy of a capability's Biscuit: the copy
  // `token` is, and every copy attenuated from it. The capability, the copy
  // it was attenuated from and its other copies keep working; revoke the
  // capability to stop them all. Idempotent.
  rpc RevokeBiscuit(CapabilityServiceRevokeBiscuitRequest) returns (CapabilityServiceRevokeBiscuitResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // GetBiscuitUsage returns the limits in force on one copy of a
  // capability's Biscuit — its own and those of the copies it was attenuated
  // from — with what has been counted against each. A copy gets limits only
  // by attenuation; one under none returns no copies.
  rpc GetBiscuitUsage(CapabilityServiceGetBiscuitUsageRequest) returns (CapabilityServiceGetBiscuitUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Get returns one capability as it is on record: the capability with its
  // disposition, who asked for it, and its own revocation if it has one.
  // NOT_FOUND when no capability has the id, or the caller cannot see it.
  rpc Get(CapabilityServiceGetRequest) returns (CapabilityServiceGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // List pages through a tenant's capabilities, each with its disposition:
  // every one of them, or those of a principal kind, a subject and the
  // dispositions asked for. Cursor-paginated.
  rpc List(CapabilityServiceListRequest) returns (CapabilityServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetUsage returns the runtime counters for a capability:
  // request_count (vs Caveats.max_requests) and spent
  // (vs Caveats.max_budget). Returns NOT_FOUND when the
  // capability has never been used (no requests, no charges).
  rpc GetUsage(CapabilityServiceGetUsageRequest) returns (CapabilityServiceGetUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListOperationGrants returns, for each capability operation, what it
  // unlocks in the capability's own tenant with no tenant policy (ADR-0038),
  // and on what basis: the built-in policy's actions, a tenant policy, the
  // operation it is asserted beside, or the caveats alone. The same for every
  // caller; it reads no tenant.
  rpc ListOperationGrants(CapabilityServiceListOperationGrantsRequest) returns (CapabilityServiceListOperationGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// PrincipalKind discriminates the principal-shape oneof. Mirrors the
// in-process capability.PrincipalType.
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_USER = 1;
  PRINCIPAL_KIND_AGENT = 2;
  PRINCIPAL_KIND_SERVICE = 3;
}

// CapabilityPrincipal is the subject the capability is issued to.
// Agent fields are populated only when kind=PRINCIPAL_KIND_AGENT.
message CapabilityPrincipal {
  PrincipalKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string tenant_id = 2 [(buf.validate.field).string.uuid = true];
  string subject = 3 [(buf.validate.field).string.min_len = 1];

  // Optional agent context — populated for kind=PRINCIPAL_KIND_AGENT.
  string agent_type = 10;
  string agent_version = 11;
  string run_id = 12;
  // parent_run_id is the run_id of the agent a delegated agent capability
  // was delegated from. The server sets it on Delegate; a request naming
  // another run is refused.
  string parent_run_id = 13;
  string model = 14;
  string mcp_client = 15;
}

// CapabilityCaveats mirrors the in-process capability.Caveats struct.
// Empty repeated fields = "no restriction on that axis". The request and
// budget ceilings are explicit: each is a limit, where 0 allows nothing, or
// unlimited. Issue refuses caveats that set neither; Delegate reads an unset
// ceiling as the parent's own.
message CapabilityCaveats {
  // ops is the set of authorised operations: get / put / list / delete /
  // share / manage, and the data plane's own object:presign and object:tag.
  // Required.
  repeated string ops = 1 [(buf.validate.field).repeated.min_items = 1];

  repeated string resource_prefixes = 2;
  repeated string resource_uris = 3;
  // The int32 max_requests, where 0 set no limit; replaced by the
  // request_ceiling oneof.
  reserved 4;
  // The double max_budget_amount, replaced by max_budget_micros. The server
  // refuses a request that still sends it rather than issue the capability
  // without its budget.
  reserved 5;
  reserved "max_budget_amount";
  bool allow_tainted_read = 6;
  bool idempotency_key_required = 7;
  repeated string source_ip_cidr = 8;
  // unit_code and max_budget_micros, replaced by max_budget.
  reserved 9, 10;
  reserved "unit_code", "max_budget_micros";
  // request_ceiling is how many requests the capability may make.
  oneof request_ceiling {
    // max_requests is the limit, at least 1: a capability no request can
    // use is refused rather than issued.
    int64 max_requests = 12 [(buf.validate.field).int64.gte = 1];
    // unlimited_requests sets no limit. Only true is meaningful.
    bool unlimited_requests = 13 [(buf.validate.field).bool.const = true];
  }
  // budget_ceiling is what the capability may spend. Either arm's currency
  // is the unit every charge against the capability is in: an ISO 4217 code
  // the server accepts — USD, EUR, UAH, GBP — or XXX, ISO 4217's code for "no
  // currency", for metering that is not money.
  oneof budget_ceiling {
    // max_budget is the limit, exact to the nano; a zero amount allows no
    // spend.
    google.type.Money max_budget = 11 [(buf.validate.field).cel = {
      id: "money.non_negative"
      message: "an amount is not negative, and its nanos are 0 to 999999999"
      expression: "this.units >= 0 && this.nanos >= 0 && this.nanos <= 999999999"
    }];
    // unlimited_budget sets no limit; an empty currency_code is the
    // parent's unit on Delegate and the platform's currency on Issue.
    UnlimitedBudget unlimited_budget = 14;
  }
  // copy_ceiling is how many Biscuit copies of the capability, and of every
  // capability delegated from it, set limits of their own and are counted.
  // Unset is unlimited_copies on Issue and the parent's ceiling on Delegate;
  // the server counts at most its own bound per capability either way.
  oneof copy_ceiling {
    // max_copies is the limit; 0 allows no copy with limits of its own.
    int64 max_copies = 15 [(buf.validate.field).int64.gte = 0];
    // unlimited_copies lifts the limit to the server's bound. Only true is
    // meaningful.
    bool unlimited_copies = 16 [(buf.validate.field).bool.const = true];
  }
}

// Capability is the typed metadata view of an issued or stored
// capability. Returned by every RPC; the compact JWT is delivered
// separately as `token` so handlers can choose whether to surface it.
message Capability {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string issuer = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  CapabilityPrincipal subject = 3;
  repeated string audience = 4;
  CapabilityCaveats caveats = 5;
  google.protobuf.Timestamp issued_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp not_before = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp expires_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string parent_id = 9;
  // generation, which nothing read.
  reserved 10;
  reserved "generation";
  // confirmation_jkt binds the capability to a key (RFC 9449 DPoP): the
  // base64url SHA-256 JWK thumbprint (RFC 7638) of the public key whose
  // holder alone may present it. Every request must then carry a DPoP
  // proof signed by that key. Empty = an unbound bearer capability.
  string confirmation_jkt = 11;
  // disposition is what the capability is now. List and Get set it; the
  // other RPCs leave it unspecified.
  CapabilityDisposition disposition = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CapabilityDisposition is what a capability is now, as the platform's
// capability counts count it: revoked — itself or an ancestor — over
// expired over active. Each capability is exactly one.
enum CapabilityDisposition {
  CAPABILITY_DISPOSITION_UNSPECIFIED = 0;
  CAPABILITY_DISPOSITION_ACTIVE = 1;
  CAPABILITY_DISPOSITION_EXPIRED = 2;
  CAPABILITY_DISPOSITION_REVOKED = 3;
}

message CapabilityServiceIssueRequest {
  CapabilityPrincipal subject = 1 [(buf.validate.field).required = true];
  repeated string audience = 2 [(buf.validate.field).repeated.min_items = 1];
  CapabilityCaveats caveats = 3 [(buf.validate.field).required = true];
  // ttl_seconds caps the capability lifetime. 0 → server default.
  int64 ttl_seconds = 4 [(buf.validate.field).int64.gte = 0];
  google.protobuf.Timestamp not_before = 5;
  // confirmation_jkt binds the capability to a key (RFC 9449 DPoP): the
  // base64url SHA-256 JWK thumbprint (RFC 7638) of the public key whose
  // holder alone may present it. Every request must then carry a DPoP
  // proof signed by that key. Empty = an unbound bearer capability.
  string confirmation_jkt = 6 [
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // require_biscuit refuses, with FailedPrecondition naming why, a request
  // whose capability could not be sealed as a Biscuit, rather than issue it
  // with its token alone. Nothing is issued when it is refused.
  bool require_biscuit = 7;
}

// BiscuitStatus is whether an Issue or Delegate answer carries the
// capability's Biscuit, and why it does not when it does not. The server
// always names one; UNSPECIFIED is a server too old to say.
enum BiscuitStatus {
  BISCUIT_STATUS_UNSPECIFIED = 0;
  // ISSUED: biscuit holds the capability's Biscuit.
  BISCUIT_STATUS_ISSUED = 1;
  // NOT_SHAREABLE is never sent: a capability is sealed as a Biscuit whether
  // or not its ops include share, since a copy narrowed from the Biscuit
  // allows no more than the token, which its bearer could hand on as it is.
  BISCUIT_STATUS_NOT_SHAREABLE = 2 [deprecated = true];
  // KEY_BOUND: the capability is bound to a key (confirmation_jkt), which
  // only its holder can prove; the holder presents the token.
  BISCUIT_STATUS_KEY_BOUND = 3;
  // NOT_YET_VALID: the capability is valid only from a later not_before.
  BISCUIT_STATUS_NOT_YET_VALID = 4;
}

message CapabilityServiceIssueResponse {
  Capability capability = 1;
  // Compact JWT — return to the caller exactly once; never persisted.
  string token = 2 [debug_redact = true];
  // biscuit is the same capability as a Biscuit v3 token, which its holder
  // can narrow offline — fewer operations, resources or planes, an earlier
  // expiry, a key binding — with no call to the issuer. Present it like
  // token. Empty unless biscuit_status is ISSUED. Returned once, never
  // persisted.
  string biscuit = 3 [debug_redact = true];
  // biscuit_status says whether biscuit is set, and why not.
  BiscuitStatus biscuit_status = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CapabilityServiceDelegateRequest {
  // parent_id is the capability the caller is narrowing under. The
  // server fetches it from the store; the caller need not keep the
  // full token around to delegate.
  string parent_id = 1 [(buf.validate.field).string.uuid = true];
  CapabilityPrincipal subject = 2;
  repeated string audience = 3;
  CapabilityCaveats caveats = 4;
  int64 ttl_seconds = 5 [(buf.validate.field).int64.gte = 0];
  google.protobuf.Timestamp not_before = 6;
  // confirmation_jkt binds the child to a key of its own — the sub-agent's.
  // Empty inherits the parent's binding; an unbound parent may gain one,
  // a bound parent's child can never shed it.
  string confirmation_jkt = 7 [
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // require_biscuit refuses a child that could not be sealed as a Biscuit,
  // as CapabilityServiceIssueRequest.require_biscuit does.
  bool require_biscuit = 8;
}

message CapabilityServiceRevokeRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2;
  bool cascade_children = 3;
}

message CapabilityServiceRevokeResponse {
  // already_revoked is a capability that had a revocation entry of its own
  // before the call, so the call wrote none: the first entry stands. One
  // stopped only through an ancestor had none, and its first revoke writes it.
  bool already_revoked = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // revocation is the capability's entry as it stands after the call: the one
  // this call wrote, or the earlier one it kept.
  CapabilityRevocation revocation = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // before is the capability's disposition just before the call, by the
  // rules disposition is read by: only the revoke of an active capability
  // stopped something new. One already revoked — by its own entry or
  // through an ancestor — or expired still gets its entry, so the audit
  // names who revoked it and why.
  CapabilityDisposition before = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CapabilityServiceRevokeBiscuitRequest {
  // token is the Biscuit copy to revoke, exactly as its holder presents it.
  string token = 1 [
    (buf.validate.field).string.min_len = 1,
    debug_redact = true
  ];
  string reason = 2;
}

message CapabilityServiceRevokeBiscuitResponse {
  // capability_id is the capability the revoked copy belongs to.
  string capability_id = 1;
  // already_revoked is a copy that had a revocation entry before the call,
  // so the call wrote none: the first entry stands.
  bool already_revoked = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // revocation is the copy's entry as it stands after the call: the one this
  // call wrote, or the earlier one it kept. A copy's entry is never a
  // cascade's, so cascade is false.
  CapabilityRevocation revocation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message CapabilityServiceGetBiscuitUsageRequest {
  // token is the Biscuit copy, exactly as its holder presents it.
  string token = 1 [
    (buf.validate.field).string.min_len = 1,
    debug_redact = true
  ];
}

// CapabilityBiscuitCopyUsage is one set of limits an attenuation block put on
// a copy, and what that copy and every copy attenuated from it have used.
message CapabilityBiscuitCopyUsage {
  // revocation_id is the id of the block that set the limits.
  bytes revocation_id = 1;
  // max_budget_micros, spent_micros and reserved_micros, replaced by
  // max_budget, spent and reserved.
  reserved 3, 5, 6;
  reserved "max_budget_micros", "spent_micros", "reserved_micros";
  // max_requests and max_budget are the limits the block set, each absent
  // when it set none on that axis; 0 allows nothing. A copy can only narrow,
  // so it never sets a limit of "unlimited".
  optional int64 max_requests = 2;
  google.type.Money max_budget = 7;
  int64 request_count = 4;
  // spent and reserved are in the capability's currency.
  google.type.Money spent = 8;
  google.type.Money reserved = 9;
}

message CapabilityServiceGetBiscuitUsageResponse {
  string capability_id = 1;
  // unit_code, replaced by the currency of each copy's amounts.
  reserved 2;
  reserved "unit_code";
  // copies are innermost first: the copy itself when it set limits, then the
  // copies it was attenuated from.
  repeated CapabilityBiscuitCopyUsage copies = 3;
}

message CapabilityServiceListRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  // principal_kind lists the capabilities of principals of that kind;
  // unspecified, of every kind.
  PrincipalKind principal_kind = 2 [(buf.validate.field).enum.defined_only = true];
  // subject lists the capabilities issued to that subject exactly; empty,
  // to every subject.
  string subject = 3;
  // include_expired and include_revoked widen a listing that names no
  // dispositions from the active capabilities. Use dispositions.
  bool include_expired = 4 [deprecated = true];
  bool include_revoked = 5 [deprecated = true];
  int32 page_size = 6 [(buf.validate.field).int32.gte = 0];
  string page_token = 7;
  // dispositions lists the capabilities of any of these. Empty, the active
  // ones, and those include_expired and include_revoked add.
  repeated CapabilityDisposition dispositions = 8 [(buf.validate.field).repeated.items.enum = {defined_only: true, not_in: [0]}];
  // sort_order is by id, which is by issue time: ascending, oldest first,
  // when unspecified; descending, newest first. A page token holds the
  // order it was handed out for.
  paladin.common.v1.SortOrder sort_order = 9;
}

message CapabilityServiceListResponse {
  repeated Capability capabilities = 1;
  string next_page_token = 2;
}

message CapabilityServiceGetRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// CapabilityRevocation is a capability's own entry on the revocation list.
message CapabilityRevocation {
  google.protobuf.Timestamp revoked_at = 1;
  string reason = 2;
  string actor = 3;
  // cascade reports that the entry was written by a cascading revoke, of
  // this capability or of an ancestor.
  bool cascade = 4;
}

message CapabilityServiceGetResponse {
  Capability capability = 1;
  // issued_by is the principal that asked for the capability. A capability
  // recorded before it was kept carries the subject alone.
  CapabilityPrincipal issued_by = 2;
  // revocation is the capability's own entry; absent when it has none. A
  // capability stopped only through an ancestor has none.
  CapabilityRevocation revocation = 3;
  // stopped_by is the entry that makes a revoked capability revoked: its own,
  // or that of its nearest revoked ancestor still on record. Absent unless
  // the capability's disposition is revoked.
  CapabilityStoppedBy stopped_by = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// CapabilityStoppedBy is a revocation entry and the capability it is of.
message CapabilityStoppedBy {
  // capability_id is the capability the entry is of: the one read, or an
  // ancestor of it.
  string capability_id = 1;
  CapabilityRevocation revocation = 2;
}

message CapabilityServiceGetUsageRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message CapabilityServiceGetUsageResponse {
  string capability_id = 1;
  int64 request_count = 2;
  // The double spent_amount, replaced by spent_micros.
  reserved 3;
  reserved "spent_amount";
  google.protobuf.Timestamp updated_at = 4;
  // unit_code and spent_micros, replaced by spent.
  reserved 5, 6;
  reserved "unit_code", "spent_micros";
  // spent is the accumulated spend, in the capability's currency.
  google.type.Money spent = 7;
}

message CapabilityServiceListOperationGrantsRequest {}

message CapabilityServiceListOperationGrantsResponse {
  // One per operation a capability's caveats can name, in the order the
  // console lists them.
  repeated CapabilityOperationGrant grants = 1;
}

// Where what an operation unlocks comes from.
enum CapabilityGrantBasis {
  CAPABILITY_GRANT_BASIS_UNSPECIFIED = 0;
  // The built-in policy grants the actions, in the capability's own tenant.
  CAPABILITY_GRANT_BASIS_BUILTIN = 1;
  // Nothing without a tenant policy that names the operation's actions.
  CAPABILITY_GRANT_BASIS_TENANT_POLICY = 2;
  // Asserted only beside another operation, in paired_ops, whose own row
  // grants the action: it adds a requirement, never an action.
  CAPABILITY_GRANT_BASIS_PAIRED = 3;
  // The caveats alone decide; no policy is asked (share: Delegate).
  CAPABILITY_GRANT_BASIS_CAVEATS_ONLY = 4;
}

// What one capability operation unlocks without a tenant policy.
message CapabilityOperationGrant {
  // The operation as caveats.ops names it.
  string op = 1;
  // The Cedar actions the built-in policy grants under the operation, in the
  // capability's own tenant. Set only for CAPABILITY_GRANT_BASIS_BUILTIN.
  repeated string actions = 2;
  CapabilityGrantBasis basis = 3;
  // The operations this one is asserted beside, for
  // CAPABILITY_GRANT_BASIS_PAIRED.
  repeated string paired_ops = 4;
  // The RPCs the caveats alone open, for CAPABILITY_GRANT_BASIS_CAVEATS_ONLY,
  // as service.Method.
  repeated string procedures = 5;
}
