syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto";

// CapabilityService manages capability tokens — short-lived, signed,
// delegable, individually revocable authorisation primitives for agent
// runtimes. See internal/capability for the in-process types and
// migrations/016_capabilities.sql for the schema.
//
// Audience semantics: capabilities are issued by the admin plane and
// presented by callers to data / admin / mcp planes. The interceptor
// verifies signature + audience + expiry + revocation locally — no
// per-request RPC to this service.
//
// Naming: request / response types use the `CapabilityService<Method>`
// prefix because the bare RPC verbs (Issue / Revoke / List) collide
// with other admin services in the same proto package. The verbose
// prefix is what buf STANDARD lint requires when method names alone
// aren't unique.
service CapabilityService {
  // Issue mints a top-level capability for a principal. Caller is
  // platform-admin or a delegating service. Returns the typed
  // capability metadata plus the compact JWT in `token`.
  rpc Issue(CapabilityServiceIssueRequest) returns (CapabilityServiceIssueResponse);

  // Delegate issues a strictly-narrower child capability under a
  // parent the caller already holds. Narrowing is enforced at issuance:
  // widening attempts fail before any token is emitted.
  rpc Delegate(CapabilityServiceDelegateRequest) returns (CapabilityServiceIssueResponse);

  // Revoke adds the supplied capability ID to the revocation list.
  // CascadeChildren=true revokes every descendant in the delegation
  // tree. Idempotent — re-revoking a revoked capability is a no-op.
  rpc Revoke(CapabilityServiceRevokeRequest) returns (CapabilityServiceRevokeResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RevokeBiscuit revokes one copy of a capability's Biscuit: the copy
  // `token` is, and every copy attenuated from it. The capability, the copy
  // it was attenuated from and its other copies keep working; revoke the
  // capability to stop them all. Idempotent.
  rpc RevokeBiscuit(CapabilityServiceRevokeBiscuitRequest) returns (CapabilityServiceRevokeBiscuitResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // List enumerates capabilities issued to a principal. Cursor-paginated.
  rpc List(CapabilityServiceListRequest) returns (CapabilityServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetUsage returns the runtime counters for a capability:
  // request_count (vs Caveats.max_requests) and spent_micros
  // (vs Caveats.max_budget_micros). Returns NOT_FOUND when the
  // capability has never been used (no requests, no charges).
  rpc GetUsage(CapabilityServiceGetUsageRequest) returns (CapabilityServiceGetUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// PrincipalKind discriminates the principal-shape oneof. Mirrors the
// in-process capability.PrincipalType.
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_USER = 1;
  PRINCIPAL_KIND_AGENT = 2;
  PRINCIPAL_KIND_SERVICE = 3;
}

// CapabilityPrincipal is the subject the capability is issued to.
// Agent fields are populated only when kind=PRINCIPAL_KIND_AGENT.
message CapabilityPrincipal {
  PrincipalKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string tenant_id = 2 [(buf.validate.field).string.uuid = true];
  string subject = 3 [(buf.validate.field).string.min_len = 1];

  // Optional agent context — populated for kind=PRINCIPAL_KIND_AGENT.
  string agent_type = 10;
  string agent_version = 11;
  string run_id = 12;
  string parent_agent_id = 13;
  string model = 14;
  string mcp_client = 15;
}

// CapabilityCaveats mirrors the in-process capability.Caveats struct.
// Empty fields = "no restriction on that axis".
message CapabilityCaveats {
  // ops is the set of authorised operations (get / put / list / delete /
  // presign / tag / search / embed / share / manage). Required.
  repeated string ops = 1 [(buf.validate.field).repeated.min_items = 1];

  repeated string resource_prefixes = 2;
  repeated string resource_uris = 3;
  int32 max_requests = 4;
  // The double max_budget_amount, replaced by max_budget_micros. The server
  // refuses a request that still sends it rather than issue the capability
  // without its budget.
  reserved 5;
  reserved "max_budget_amount";
  bool allow_tainted_read = 6;
  bool idempotency_key_required = 7;
  repeated string source_ip_cidr = 8;
  // unit_code is the currency code (USD/EUR/UAH/GBP) or the
  // abstract sentinel UNIT for non-currency metering. Empty in
  // the request defaults to "USD" server-side; the validator
  // rejects any other unrecognised value.
  string unit_code = 9;
  // max_budget_micros is the cost budget in millionths of unit_code (25
  // USD = 25000000); 0 or absent = no budget. Currency is given by
  // unit_code; default "USD" when empty.
  optional int64 max_budget_micros = 10 [(buf.validate.field).int64.gte = 0];
}

// Capability is the typed metadata view of an issued or stored
// capability. Returned by every RPC; the compact JWT is delivered
// separately as `token` so handlers can choose whether to surface it.
message Capability {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string issuer = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  CapabilityPrincipal subject = 3;
  repeated string audience = 4;
  CapabilityCaveats caveats = 5;
  google.protobuf.Timestamp issued_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp not_before = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp expires_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string parent_id = 9;
  int64 generation = 10;
  // confirmation_jkt binds the capability to a key (RFC 9449 DPoP): the
  // base64url SHA-256 JWK thumbprint (RFC 7638) of the public key whose
  // holder alone may present it. Every request must then carry a DPoP
  // proof signed by that key. Empty = an unbound bearer capability.
  string confirmation_jkt = 11;
}

message CapabilityServiceIssueRequest {
  CapabilityPrincipal subject = 1 [(buf.validate.field).required = true];
  repeated string audience = 2 [(buf.validate.field).repeated.min_items = 1];
  CapabilityCaveats caveats = 3 [(buf.validate.field).required = true];
  // ttl_seconds caps the capability lifetime. 0 → server default.
  int64 ttl_seconds = 4 [(buf.validate.field).int64.gte = 0];
  google.protobuf.Timestamp not_before = 5;
  // confirmation_jkt binds the capability to a key (RFC 9449 DPoP): the
  // base64url SHA-256 JWK thumbprint (RFC 7638) of the public key whose
  // holder alone may present it. Every request must then carry a DPoP
  // proof signed by that key. Empty = an unbound bearer capability.
  string confirmation_jkt = 6 [
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message CapabilityServiceIssueResponse {
  Capability capability = 1;
  // Compact JWT — return to the caller exactly once; never persisted.
  string token = 2 [debug_redact = true];
  // biscuit is the same capability as a Biscuit v3 token, which its holder
  // can narrow offline — fewer operations, resources or planes, an earlier
  // expiry, a key binding — with no call to the issuer. Present it like
  // token. Empty when the server does not issue Biscuits. Returned once,
  // never persisted.
  string biscuit = 3 [debug_redact = true];
}

message CapabilityServiceDelegateRequest {
  // parent_id is the capability the caller is narrowing under. The
  // server fetches it from the store; the caller need not keep the
  // full token around to delegate.
  string parent_id = 1 [(buf.validate.field).string.uuid = true];
  CapabilityPrincipal subject = 2;
  repeated string audience = 3;
  CapabilityCaveats caveats = 4;
  int64 ttl_seconds = 5 [(buf.validate.field).int64.gte = 0];
  google.protobuf.Timestamp not_before = 6;
  // confirmation_jkt binds the child to a key of its own — the sub-agent's.
  // Empty inherits the parent's binding; an unbound parent may gain one,
  // a bound parent's child can never shed it.
  string confirmation_jkt = 7 [
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-]{43}$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message CapabilityServiceRevokeRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2;
  bool cascade_children = 3;
}

message CapabilityServiceRevokeResponse {
  // Empty on success; protobuf forward-compat slot for fields like
  // descendants_revoked when cascade is on.
}

message CapabilityServiceRevokeBiscuitRequest {
  // token is the Biscuit copy to revoke, exactly as its holder presents it.
  string token = 1 [
    (buf.validate.field).string.min_len = 1,
    debug_redact = true
  ];
  string reason = 2;
}

message CapabilityServiceRevokeBiscuitResponse {
  // capability_id is the capability the revoked copy belongs to.
  string capability_id = 1;
}

message CapabilityServiceListRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  PrincipalKind principal_kind = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string subject = 3 [(buf.validate.field).string.min_len = 1];
  bool include_expired = 4;
  bool include_revoked = 5;
  int32 page_size = 6 [(buf.validate.field).int32.gte = 0];
  string page_token = 7;
}

message CapabilityServiceListResponse {
  repeated Capability capabilities = 1;
  string next_page_token = 2;
}

message CapabilityServiceGetUsageRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message CapabilityServiceGetUsageResponse {
  string capability_id = 1;
  int64 request_count = 2;
  // The double spent_amount, replaced by spent_micros.
  reserved 3;
  reserved "spent_amount";
  google.protobuf.Timestamp updated_at = 4;
  // unit_code is the ISO 4217 code (USD/EUR/UAH/GBP) or UNIT.
  string unit_code = 5;
  // spent_micros is the accumulated spend in millionths of unit_code.
  int64 spent_micros = 6;
}
