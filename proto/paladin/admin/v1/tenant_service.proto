syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";
import "google/api/field_behavior.proto";

// TenantService manages tenants. Platform-admin only.
service TenantService {
  // CreateTenant provisions a tenant and, unless the request opts out, its
  // default storage binding. storage_layout="dedicated" also provisions a
  // physical bucket owned by the tenant (ADR-0015). AlreadyExists, reason
  // SLUG_TAKEN, when the slug is taken: by a live tenant always, and, while
  // admin.tenants.reserve_slugs is on, by a trashed tenant or a purged one
  // (see ListRetiredTenantSlugs).
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  // GetTenant accepts either the UUID or the slug in the resource name.
  // Soft-deleted tenants are returned — check deleted_at — so the trash view
  // can show them.
  rpc GetTenant(GetTenantRequest) returns (Tenant) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateTenant applies update_mask to display_name, labels and
  // inherited_cedar_policy. tenant_id and slug are immutable;
  // resource_version is required and a stale one is Aborted.
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteTenant is a SOFT delete (sets `deleted_at`), always: the row
  // remains recoverable via RestoreTenant within the retention window.
  // There is no flag that skips the trash — removing the row physically
  // is PurgeTenant, a second call that names what it does. Automated
  // cleanups and emergency-purge flows therefore make both calls.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ListTenants excludes soft-deleted tenants unless include_trashed or
  // only_trashed is set.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetInheritedPolicy replaces the Cedar policy every collection and bucket
  // under the tenant inherits. Validated before it is stored — an unparseable
  // policy is InvalidArgument, not a tenant that denies everything.
  rpc SetInheritedPolicy(SetInheritedPolicyRequest) returns (Tenant) {
    option idempotency_level = IDEMPOTENT;
  }

  // RestoreTenant clears `deleted_at` on a soft-deleted row, returning
  // it to the active set. Slug + display_name are unique among live
  // tenants (`001_initial_schema.sql`). While admin.tenants.reserve_slugs is
  // on, no new tenant can take a trashed tenant's slug; with it off, one
  // can, and restore then fails with ALREADY_EXISTS: a slug never changes,
  // so the other tenant has to be purged before this one comes back.
  rpc RestoreTenant(RestoreTenantRequest) returns (Tenant);

  // PurgeTenant hard-deletes a soft-deleted row. Refuses to operate on
  // an active tenant (operators have to soft-delete first) so the
  // two-step recovery window is preserved by default. Idempotent on
  // a missing row.
  rpc PurgeTenant(PurgeTenantRequest) returns (PurgeTenantResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // PreviewPurgeTenant answers, changing nothing, what PurgeTenant would
  // remove with the tenant and what would refuse it: for the confirmation
  // an operator reads before a delete nothing undoes. The tenant may be
  // active or trashed; the answer is the same either way.
  rpc PreviewPurgeTenant(PreviewPurgeTenantRequest) returns (PreviewPurgeTenantResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // MigrateTenantStorageLayout switches a `shared` tenant to `dedicated`
  // (ADR-0015, ADR-0051). It provisions the tenant's own bucket and starts an
  // async migration that points new uploads at it, flips the layout, and
  // moves the tenant's objects into it one by one. Returns the initial
  // migration status; poll GetTenantStorageMigration for progress.
  // FAILED_PRECONDITION if the tenant is not currently `shared` or a migration
  // is already in flight; a `failed` one is retried.
  rpc MigrateTenantStorageLayout(MigrateTenantStorageLayoutRequest) returns (StorageMigrationStatus);

  // GetTenantStorageMigration returns the current migration status for a
  // tenant, or NOT_FOUND if none was ever started.
  rpc GetTenantStorageMigration(GetTenantStorageMigrationRequest) returns (StorageMigrationStatus) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CancelTenantStorageMigration cancels a tenant's storage migration
  // (ADR-0051) at the resource_version read. A `provisioning` migration fails
  // at once; a `moving` or `completed` one rolls back: the worker moves every
  // object back into the source and points the tenant's uploads there, and
  // the migration ends `failed`, retryable with MigrateTenantStorageLayout.
  // The error records who cancelled it. FAILED_PRECONDITION for a migration
  // `rolling_back`, `failed` or `cleaned`; ABORTED for a stale
  // resource_version; NOT_FOUND when none was ever started.
  rpc CancelTenantStorageMigration(CancelTenantStorageMigrationRequest) returns (StorageMigrationStatus);

  // GetTenantDefaultBinding returns the tenant's default (backend, bucket)
  // route used to complete the bare collection name shape (ADR-0014 Phase 3).
  // NOT_FOUND when the tenant has no binding set.
  rpc GetTenantDefaultBinding(GetTenantDefaultBindingRequest) returns (TenantDefaultBinding) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetTenantDefaultBinding upserts the tenant's default route. The
  // (backend, bucket) MUST reference an existing bucket.
  rpc SetTenantDefaultBinding(SetTenantDefaultBindingRequest) returns (TenantDefaultBinding) {
    option idempotency_level = IDEMPOTENT;
  }

  // ListRetiredTenantSlugs lists the slugs of purged tenants, by slug. Each
  // is recorded by the purge, whatever admin.tenants.reserve_slugs says;
  // while it is on, CreateTenant refuses them.
  rpc ListRetiredTenantSlugs(ListRetiredTenantSlugsRequest) returns (ListRetiredTenantSlugsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ReleaseTenantSlug forgets a retired slug, so a new tenant can take it.
  // Whatever still names it — a Cedar policy, a token claim, an audit row,
  // a client's tenants/<slug> path — then names that new tenant. Idempotent
  // on a slug not retired.
  rpc ReleaseTenantSlug(ReleaseTenantSlugRequest) returns (ReleaseTenantSlugResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // ClearTenantDefaultBinding removes the tenant's default route; bare
  // collection names for that tenant then fail with FAILED_PRECONDITION.
  rpc ClearTenantDefaultBinding(ClearTenantDefaultBindingRequest) returns (ClearTenantDefaultBindingResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message CreateTenantRequest {
  // tenant_id — optional. When empty the server generates a fresh
  // UUIDv7. When non-empty it must be a valid RFC 4122 UUID and not
  // the zero UUID. Immutable post-create (enforced by the
  // tenants_block_immutable_columns trigger in `003_triggers.sql`).
  string tenant_id = 1;
  // tenant.slug is required and validated against ValidateTenantSlug.
  // tenant.display_name is optional; defaults to slug at create time.
  // Both are unique across tenants. tenant_id, slug — immutable;
  // display_name — editable via UpdateTenant.
  Tenant tenant = 2 [(buf.validate.field).required = true];
  // default_bucket — resource name of the (backend, bucket) where this
  // tenant's objects will live by default. Format:
  // "storageBackends/{backend_id}/buckets/{bucket_id}". Optional —
  // when empty the tenant has no default binding (legacy shape); when
  // set, the server inserts a matching tenant_default_bindings row in
  // the same tx as the tenant insert.
  string default_bucket = 3;
}

message GetTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  Tenant tenant = 4;
}

message DeleteTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Required, and required by the schema rather than by a handler branch:
  // with the bypass flag gone there is nothing left to make it optional for.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];

  // Field 3 was `force`, which meant "skip the trash and hard-delete". It is
  // gone: a flag that changes which state the tenant lands in is a different
  // transition, not a modifier, and the transition already exists. Delete
  // moves the tenant to the trash; PurgeTenant removes it from there. Two
  // calls, each doing one thing, and the destructive one names itself.
  //
  // `force` survives nowhere in this API with that meaning. Where the word
  // remains it is spelled `skip_version_check` and does exactly one thing:
  // waive the OCC guard.
  reserved 3;
  reserved "force";
}

message DeleteTenantResponse {}

message ListTenantsRequest {
  paladin.common.v1.PageRequest page = 1;
  // CEL filter, evaluated against the TenantSchema (see internal/filter/cel).
  // Applied to each fetched page; the page cursor is unaffected, so a page
  // whose rows all fail the predicate still returns next_page_token.
  // `purge_eligible`, with only_trashed, lists the trashed tenants past
  // admin.tenants.trash_retention — those with purge_eligible_at passed.
  string filter = 2;
  // include_trashed — when true, return both active and soft-deleted
  // rows; default (false) hides trashed tenants from the active list.
  // The /trash UI sets this to true; everywhere else defaults to the
  // active set so deleted rows can't accidentally accept new bindings.
  bool include_trashed = 3;
  // only_trashed — when true, return ONLY soft-deleted rows. Overrides
  // `include_trashed`. Used by the /trash page to render the recovery
  // view.
  bool only_trashed = 4;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  paladin.common.v1.PageResponse page = 2;
}

message SetInheritedPolicyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  string cedar_policy = 3;
}

message RestoreTenantRequest {
  // name — "tenants/{tenant_id_or_slug}"; the tenant MUST currently be
  // soft-deleted, otherwise the server returns FAILED_PRECONDITION.
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message PurgeTenantRequest {
  // name — "tenants/{tenant_id_or_slug}"; the tenant MUST currently be
  // soft-deleted, otherwise FAILED_PRECONDITION. There is no one-call
  // path past the trash: DeleteTenant first, then this.
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message PurgeTenantResponse {}

message PreviewPurgeTenantRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// What a purge of the tenant would take and what would stop it, read in one
// snapshot. Each list names at most the first 50, by name; its count is all
// of them.
message PreviewPurgeTenantResponse {
  // The tenant's API tokens, revoked or not: integrations using them stop at
  // once.
  repeated PurgedResource api_tokens = 1;
  int64 api_token_count = 2;
  // The tenant's event subscriptions: their deliveries stop, silently.
  repeated PurgedResource event_subscriptions = 3;
  int64 event_subscription_count = 4;
  // The tenant's capabilities on record, revoked and expired included; each
  // is revoked and its counters, holds and charges are deleted.
  int64 capability_count = 5;
  // What the tenant still owns that refuses the purge, one entry for each
  // kind it holds any of; none when nothing does. An object under a legal
  // hold or an unexpired retention refuses it too, and is not counted here.
  repeated PurgeBlocker blockers = 6;
}

// One resource a purge removes.
message PurgedResource {
  // name — the resource's name, "tenants/{id}/apiTokens/{id}" and the like.
  string name = 1;
  // display_name — what the console shows for it; may be empty.
  string display_name = 2;
}

// One kind of row that refuses the purge while the tenant owns any.
message PurgeBlocker {
  PurgeBlockerKind kind = 1;
  // count — how many the tenant owns.
  int64 count = 2;
}

// The rows that keep a tenant alive: ON DELETE RESTRICT children of tenants
// (docs/deletion-semantics.md). Remove them first, in this order.
enum PurgeBlockerKind {
  PURGE_BLOCKER_KIND_UNSPECIFIED = 0;
  // Collections, and with them the objects they hold.
  PURGE_BLOCKER_KIND_COLLECTIONS = 1;
  // Buckets the tenant owns, other than those being deleted.
  PURGE_BLOCKER_KIND_BUCKETS = 2;
  // The tenant's users.
  PURGE_BLOCKER_KIND_USERS = 3;
  // Buckets whose deletion on the backend is still running
  // (DeleteBucket with delete_on_backend). They need nothing from the
  // operator: each row goes once the backend bucket is gone, and the purge
  // can be retried then.
  PURGE_BLOCKER_KIND_BUCKETS_DELETING = 4;
}

message MigrateTenantStorageLayoutRequest {
  // name — "tenants/{tenant_id_or_slug}". The tenant MUST currently be shared.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // target_backend_id — backend the dedicated bucket is provisioned on.
  // Optional; empty reuses the tenant's current (shared) backend. Slice 1
  // supports same-backend only, so a different backend is rejected by the copy
  // job until the cross-backend stream-through path lands.
  string target_backend_id = 2;
  // cleanup_retention_seconds — how long the old (shared) copies are kept after
  // the migration completes before they are deleted. Optional; 0 uses the
  // server default (24h). Never less than
  // worker.jobs.storage_migration.source_copy_retention (by default
  // limits.presign.max_ttl), so a GET URL signed before an object moved
  // keeps working until it expires.
  int64 cleanup_retention_seconds = 3;
}

message GetTenantStorageMigrationRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message CancelTenantStorageMigrationRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: the StorageMigrationStatus.resource_version the cancel was
  // decided on. A migration the worker moved to another state since is
  // ABORTED; one that only made progress is not.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
}

// StorageMigrationStatus mirrors a tenant_storage_migrations row (ADR-0015
// Phase 3): the copy job's state machine + progress.
message StorageMigrationStatus {
  // tenant — "tenants/{tenant_id}".
  string tenant = 1;
  // state — provisioning | moving | completed | cleaned | rolling_back | failed.
  string state = 2;
  // objects_total — the objects moved plus those still to move, as of the
  // last pass.
  int64 objects_total = 3;
  // objects_copied — the objects moved in the current direction (back to the
  // source while rolling_back).
  int64 objects_copied = 4;
  // Bucket references as resource names, consistent with
  // TenantDefaultBinding: "storageBackends/{backend}/buckets/{bucket}".
  string source_bucket = 5;
  string target_bucket = 6;
  reserved 7, 8;
  // error — why the migration is rolling back or failed; empty otherwise.
  string error = 9;
  // resource_version — changes with every change of state and with a retry,
  // never with a pass's progress. CancelTenantStorageMigration takes it.
  string resource_version = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// TenantDefaultBinding is a tenant's default (backend, bucket) route for the
// bare collection name shape (ADR-0014 Phase 3 / `001_initial_schema.sql`).
message TenantDefaultBinding {
  // name — "tenants/{tenant_id}/defaultBinding".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Reference to the bucket, as a resource name:
  // "storageBackends/{backend_id}/buckets/{bucket_id}". One field, because a
  // reference to another resource is its name (AIP-122), not its parts.
  string bucket = 2;
  // set_at / set_by — audit of the last change.
  google.protobuf.Timestamp set_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string set_by = 5;
}

message GetTenantDefaultBindingRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message SetTenantDefaultBindingRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // "storageBackends/{backend_id}/buckets/{bucket_id}".
  string bucket = 2 [(buf.validate.field).string.min_len = 1];
}

message ClearTenantDefaultBindingRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ClearTenantDefaultBindingResponse {}

// The slug of a purged tenant, kept so that it cannot come to name another.
message RetiredTenantSlug {
  // Resource name: "retiredTenantSlugs/{slug}".
  string name = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string slug = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The tenant that held it, now purged.
  string former_tenant_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp retire_time = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the worker releases it: retire_time + the server's
  // admin.tenants.slug_reservation_period. Unset while that period is
  // unset, which keeps the slug until ReleaseTenantSlug. Computed on read,
  // so changing the period moves it for every slug already retired; the
  // release happens on the worker's next pass after this moment.
  google.protobuf.Timestamp release_time = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListRetiredTenantSlugsRequest {
  // Ordered by slug; page_token is the last slug of the previous page.
  paladin.common.v1.PageRequest page = 1;
}

message ListRetiredTenantSlugsResponse {
  repeated RetiredTenantSlug retired_slugs = 1;
  paladin.common.v1.PageResponse page = 2;
  // Whether CreateTenant refuses these slugs: admin.tenants.reserve_slugs.
  // When false they are recorded and nothing else.
  bool reservation_enforced = 3;
}

message ReleaseTenantSlugRequest {
  // name — "retiredTenantSlugs/{slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ReleaseTenantSlugResponse {}
