syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "paladin/common/v1/pagination.proto";

// PolicyService offers Cedar policy authoring helpers — validation,
// dry-run evaluation, and inspection of effective (merged) policies.
// Used heavily by the MCP server and the admin UI.
service PolicyService {
  // Validate parses + type-checks Cedar text against the Paladin schema.
  rpc Validate(ValidateRequest) returns (ValidateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SimulateAuthz answers "would this principal be allowed to take this
  // action against this resource right now?" without performing the action.
  // Useful for UI access-pre-flight and for LLM tools.
  rpc SimulateAuthz(SimulateAuthzRequest) returns (SimulateAuthzResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetEffectivePolicy returns the merged policy stack for a target
  // (tenant + bucket + collection inheritance), useful for debugging.
  rpc GetEffectivePolicy(GetEffectivePolicyRequest) returns (GetEffectivePolicyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListPolicyVersions pages through the texts one policy layer has held,
  // newest first, with who wrote each and when (ADR-0040). resource_name
  // names the layer: storageBackends/{id}, storageBackends/{id}/buckets/{name},
  // tenants/{id} or tenants/{id}/collections/{name}. Gated as
  // GetEffectivePolicy is. NOT_FOUND for a bucket or collection that does
  // not exist, or one the caller's tenant cannot see.
  rpc ListPolicyVersions(ListPolicyVersionsRequest) returns (ListPolicyVersionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ValidateRequest {
  string cedar_policy = 1 [(buf.validate.field).string.min_len = 1];
}

message ValidateResponse {
  bool ok = 1;
  repeated PolicyDiagnostic diagnostics = 2;
}

message PolicyDiagnostic {
  string severity = 1; // "error" | "warning"
  string message = 2;
  int32 line = 3;
  int32 column = 4;
}

message SimulateAuthzRequest {
  // Subject of the simulated principal (does not need to match a real user).
  string principal_subject = 1 [(buf.validate.field).string.min_len = 1];
  string principal_tenant_id = 2;
  repeated string principal_roles = 3;
  string action = 4 [(buf.validate.field).string.min_len = 1];
  // Resource name to authorize against.
  string resource_name = 5 [(buf.validate.field).string.min_len = 1];
  // Credential type behind the simulated principal: "user" | "api_key" |
  // "service_account" | "capability" (auth.PrincipalKind). Without it a
  // simulation cannot reproduce a decision from a policy that reads
  // `principal.kind` — the built-in permit letting a machine delete its own
  // objects is one — and would answer "denied" for a call that succeeds.
  // Empty simulates a principal whose kind is unknown, which matches no kind.
  string principal_kind = 6;
}

message SimulateAuthzResponse {
  bool allowed = 1;
  // Decision diagnostics — which permit/forbid rules fired.
  repeated string matched_policies = 2;
  string explanation = 3;
}

message GetEffectivePolicyRequest {
  string resource_name = 1 [(buf.validate.field).string.min_len = 1];
}

message GetEffectivePolicyResponse {
  // The exact text the authorizer compiles for the resource: the built-in
  // layer, then tenant → bucket → collection, a frozen layer as evaluated.
  string merged_cedar_policy = 1;
  // The layers in that order, the built-in one first.
  repeated PolicyLayer layers = 2;
}

message PolicyLayer {
  // Resource name owning the layer, or "built-in" for the platform's own.
  string source = 1;
  // The layer as stored.
  string cedar_policy = 2;
  // The stored text does not compile, so the authorizer evaluates a freeze
  // over the layer's scope in its place: everything is denied there except
  // replacing the layer.
  bool frozen = 3;
  // What the authorizer evaluates for this layer: the freeze when frozen,
  // otherwise the same as cedar_policy.
  string evaluated_cedar_policy = 4;
}

message ListPolicyVersionsRequest {
  string resource_name = 1 [(buf.validate.field).string.min_len = 1];
  // page_size 0 is the server's default; above its cap, the cap. page_token
  // is page.next_page_token from the previous response.
  paladin.common.v1.PageRequest page = 2;
}

message ListPolicyVersionsResponse {
  repeated PolicyVersion versions = 1;
  paladin.common.v1.PageResponse page = 2;
}

// PolicyVersion is one text a policy layer has held.
message PolicyVersion {
  // version counts the layer's texts from 1; each change takes the next.
  int32 version = 1;
  // The text, "" for a version that cleared the policy.
  string cedar_policy = 2;
  // The subject of the principal whose request wrote it — a user's id, an
  // agent's agent:… — and absent when no request did (a migration, psql).
  optional string written_by = 3;
  google.protobuf.Timestamp written_at = 4;
}
