syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/admin/v1/types.proto";

// QuotaService manages per-tenant / per-bucket usage caps. Quota is set by
// platform/bucket admins; usage is read by tenant admins and end-users.
service QuotaService {
  // GetQuota returns the tenant's limits and its current usage counters.
  rpc GetQuota(GetQuotaRequest) returns (Quota) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // SetQuota replaces the tenant's limits. Lowering a limit below current usage
  // is allowed — it blocks further growth rather than deleting anything.
  rpc SetQuota(SetQuotaRequest) returns (Quota) {
    option idempotency_level = IDEMPOTENT;
  }
  // ResetUsage zeroes today's admission counters (bytes and objects today)
  // without touching the limits or the stored totals; the totals are
  // recomputed from live objects by the quota reconciler. Answers with the
  // quota as it is after the reset.
  rpc ResetUsage(ResetUsageRequest) returns (Quota) {
    option idempotency_level = IDEMPOTENT;
  }
}

message GetQuotaRequest {
  // Quota resource name (see Quota.name docstring for forms).
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message SetQuotaRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required. Checked in the upsert's DO UPDATE clause: a stored

  //   version that differs updates nothing and the call is Aborted. Pass the

  //   version from a prior GetQuota; "0" asserts no row exists yet, and is

  //   itself a conflict if one does.

  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  Quota quota = 4 [(buf.validate.field).required = true];
}

message ResetUsageRequest {
  // Quota resource name (see Quota.name docstring for forms). The daily
  // roll at the UTC day boundary does this on its own; the RPC is for an
  // operator who needs it sooner.
  string name = 1 [(buf.validate.field).string.min_len = 1];
}
