syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto";

// APITokenService manages hashed-bearer M2M tokens (`paladin_pat_…`). Distinct
// from capability tokens (CapabilityService) which serve agent-runtime
// federation in JWT format. API tokens are long-lived service-to-
// service credentials that follow the Hatchet / GitHub PATs / Stripe
// pattern: stored as argon2id PHC hash, plaintext returned exactly
// once at creation.
//
// Naming: request / response types use the `APITokenService<Method>`
// prefix because the bare verbs (Create / Revoke / List) collide with
// other admin services in the same proto package — buf STANDARD lint
// requires the prefix when method names alone aren't unique.
service APITokenService {
  // Create mints a new API token. Plaintext is returned exactly once
  // in `token`; afterwards only the hash is persisted. Caller MUST
  // treat the returned `token` as a write-once secret — the service
  // can't recover it.
  rpc Create(APITokenServiceCreateRequest) returns (APITokenServiceCreateResponse);

  // Revoke marks a token as revoked at NOW(). Idempotent — re-revoking
  // a revoked token is a no-op. Cannot be undone; caller mints a new
  // one to replace.
  rpc Revoke(APITokenServiceRevokeRequest) returns (APITokenServiceRevokeResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // List enumerates tokens for a tenant. Paginated cursor-style. The
  // `token_hash` is never returned; callers see metadata only.
  rpc List(APITokenServiceListRequest) returns (APITokenServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Get reads one token's metadata by its resource name, so a reader that
  // holds only a token's id — an audit entry's apikey:<id> actor — can name
  // it without listing its tenant's tokens. NOT_FOUND when it does not exist.
  rpc Get(APITokenServiceGetRequest) returns (APITokenServiceGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetSelf introspects the API token attached to the calling request,
  // if any. Returns NOT_FOUND when the request was authenticated via
  // JWT or capability instead of an API token. Used by clients that
  // want to display "you are authenticated as token X" without an
  // out-of-band lookup.
  rpc GetSelf(APITokenServiceGetSelfRequest) returns (APITokenServiceGetSelfResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetUsage returns a readonly snapshot of a token's current rate-
  // limit consumption — current/previous bucket counters, the
  // weighted sliding-window count, and when the window rolls. Does
  // NOT bump the bucket; safe to poll from a Web UI dashboard.
  // Returns NOT_FOUND when the token id doesn't exist.
  rpc GetUsage(APITokenServiceGetUsageRequest) returns (APITokenServiceGetUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// APIToken is the metadata view returned by every RPC. The plaintext
// is delivered separately as `token` on Create and never elsewhere.
message APIToken {
  // Resource name: "tenants/{tenant}/apiTokens/{id}".
  //
  // Field 3 used to be `name` meaning the operator's LABEL, which made this
  // service the only one in the API where `name` was not a resource name — and
  // left Revoke / GetUsage addressed by a bare uuid that carries no tenant. An
  // id without its parent cannot be scoped, and under the row-level security on
  // api_tokens that is not a nuisance but a deadlock: to set the acting tenant
  // you must know whose token it is, and to learn that you must first read the
  // row RLS is hiding. The label now lives in display_name.
  string name = 14 [(google.api.field_behavior) = IDENTIFIER];
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string tenant_id = 2 [(google.api.field_behavior) = IMMUTABLE];
  // display_name is the operator-facing label ("ci-uploader"). Shown in audit
  // logs. Was `name` until the resource-name conversion.
  string display_name = 3;
  // prefix is the 8-char display string (first chars of the body
  // after the `paladin_pat_` literal). Operators identify tokens by it.
  string prefix = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string scopes = 5;
  repeated string audience = 6;
  // roles the token's principal carries — see
  // APITokenServiceCreateRequest.roles. Returned so an operator listing tokens
  // can see which ones carry authority beyond their tenant.
  repeated string roles = 13;
  google.protobuf.Timestamp expires_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp revoked_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp last_used_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  string created_by = 11;
  // rate_limit is the bearer's request rate: a cap in requests per minute,
  // enforced by APITokenInterceptor with a sliding-window counter, where 0
  // admits no request; or no cap at all.
  oneof rate_limit {
    int32 rate_limit_rpm = 12;
    bool unlimited_rate = 15;
  }
}

message APITokenServiceCreateRequest {
  // Parent: "tenants/{tenant}". Was a bare tenant_id uuid.
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  // display_name is the operator's label for the token, not a resource name.
  string display_name = 2 [(buf.validate.field).string.min_len = 1];
  // ttl_seconds caps lifetime. 0 → server default (1 year).
  // Application clamps to MaxTTL configured on the issuer.
  int64 ttl_seconds = 3 [(buf.validate.field).int64.gte = 0];
  repeated string scopes = 4;
  // audience must include at least one plane the token is presented
  // to. Subset of {data, admin, iam, mcp}.
  repeated string audience = 5 [(buf.validate.field).repeated.min_items = 1];
  // rate_limit is the per-token request rate. Required: a request that sets
  // neither arm is refused. A cap is recommended for any token whose blast
  // radius matters: a leaked token capped at 60 rpm does far less harm
  // before discovery than an uncapped one.
  oneof rate_limit {
    // rate_limit_rpm caps requests per minute; 0 admits none.
    int32 rate_limit_rpm = 6 [(buf.validate.field).int32.gte = 0];
    // unlimited_rate sets no cap. Only true is meaningful.
    bool unlimited_rate = 8 [(buf.validate.field).bool.const = true];
  }
  // roles the token's principal carries, so a machine caller can satisfy a
  // role-gated policy without logging in as a human user and managing a
  // session.
  //
  // Granting ANY role requires platform.admin: a token that could promote
  // itself would make every other gate decorative. Prefer the narrowest role
  // that does the job — `platform.capability-issuer` mints capabilities for any
  // tenant and can neither create tenants nor mint further tokens — over
  // `platform.admin`, whose leak is unbounded.
  repeated string roles = 7;
}

message APITokenServiceCreateResponse {
  APIToken api_token = 1;
  // The full `paladin_pat_…` plaintext. Returned exactly once. Store it
  // securely on the consuming side; it cannot be recovered.
  string token = 2 [debug_redact = true];
}

message APITokenServiceRevokeRequest {
  // "tenants/{tenant}/apiTokens/{id}". The tenant segment is what lets the
  // handler authorise the crossing and then scope the query; a bare id could
  // do neither.
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message APITokenServiceRevokeResponse {
  // Empty on success. Forward-compat slot for future fields.
}

message APITokenServiceListRequest {
  // Parent: "tenants/{tenant}".
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  bool include_revoked = 2;
  bool include_expired = 3;
  int32 page_size = 4 [(buf.validate.field).int32.gte = 0];
  string page_token = 5;
}

message APITokenServiceListResponse {
  repeated APIToken api_tokens = 1;
  string next_page_token = 2;
}

message APITokenServiceGetSelfRequest {
  // Empty — the call's auth context identifies the token.
}

message APITokenServiceGetSelfResponse {
  APIToken api_token = 1;
}

message APITokenServiceGetRequest {
  // "tenants/{tenant}/apiTokens/{id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message APITokenServiceGetResponse {
  APIToken api_token = 1;
}

message APITokenServiceGetUsageRequest {
  // "tenants/{tenant}/apiTokens/{id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message APITokenServiceGetUsageResponse {
  // Echoes the resource name the usage was read for.
  string name = 1;
  // limit_rpm mirrors the token's cap; absent when it has none, and the
  // remaining counters are still returned so UIs can render
  // "uncapped, current rate: N rpm". 0 admits no request.
  optional int32 limit_rpm = 2;
  // current_bucket_count is the raw counter for the in-progress
  // minute. previous_bucket_count is the previous full minute.
  // weighted_count = current + previous * (1 - elapsed / 60). Mirrors
  // the math the Limiter uses on the verify path.
  int64 current_bucket_count = 3;
  int64 previous_bucket_count = 4;
  double weighted_count = 5;
  // window_resets_at is when the current minute bucket rolls — UI
  // renders "resets in Ns" by computing window_resets_at - now.
  google.protobuf.Timestamp window_resets_at = 6;
  // last_used_at is the most recent successful Verify on this token.
  // NULL when the token has never been verified.
  google.protobuf.Timestamp last_used_at = 7;
}
