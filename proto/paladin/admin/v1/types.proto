syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "paladin/common/v1/resource.proto";
import "google/api/field_behavior.proto";

// ─── Storage backend ────────────────────────────────────────────────────────
// StorageBackend is the physical S3-compatible target. Provisioned by
// platform admins. Credentials are NEVER returned in responses — only
// `credentials_secret_ref` (an opaque reference to the secret manager).
message StorageBackend {
  // Resource name: "storageBackends/{backend_id}".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string backend_id = 2;
  string display_name = 3;
  StorageKind kind = 4;
  string endpoint = 5;          // internal endpoint Paladin uses
  string public_endpoint = 6;   // endpoint embedded into presigned URLs
  string region = 7;
  bool force_path_style = 8;
  // Reference to credentials in the secret store (e.g. "vault://kv/paladin/primary").
  string credentials_secret_ref = 9;
  // SSE configuration applied at presign time when objects do not specify one.
  ServerSideEncryption sse = 10;
  EventSourceConfig events = 11;
  // Cedar policy attached to the backend itself — typically a forbid-rule
  // that pins which tenants may bind buckets here.
  string cedar_policy = 12;
  string resource_version = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Durable enable/disable state. true → backend serves Paladin requests.
  // false → every Paladin-mediated operation resolving to this backend is
  // refused (FailedPrecondition) before any object-store call. Operator
  // managed via SetBackendEnabled; NOT mirrored from static config.
  bool enabled = 16;
  // Grace-window state after a RotateCredentials with grace > 0: the prior
  // credentials reference (redacted for non-platform-admin readers, same as
  // credentials_secret_ref) and the instant until which it should be kept
  // valid at the storage backend before it's safe to purge. Both empty/unset
  // once the window elapses or after a grace=0 (instant) rotation. Lets the UI
  // render "rotated — old key valid for another N".
  string previous_credentials_secret_ref = 17;
  google.protobuf.Timestamp previous_credentials_valid_until = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Read-only "drain" state (`001_initial_schema.sql`). Only meaningful when enabled=true:
  // reads / presign-GET / HEAD / list still resolve, but mutations
  // (PUT / POST / multipart-init / copy-dest / update / delete / version
  // writes) are refused (FailedPrecondition) so an operator can migrate data
  // off before disabling. Operator-managed via SetBackendReadOnly; NOT
  // mirrored from static config.
  bool read_only = 19;
  // Derived, advisory health from the last TestBackend probe (`001_initial_schema.sql`).
  // "unknown" | "ok" | "error". Surfaced in the UI; NOT a gate. health_message
  // carries the probe error when status is "error"; health_checked_at is the
  // instant of the last probe (unset until first probed).
  string health_status = 20;
  string health_message = 21;
  google.protobuf.Timestamp health_checked_at = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Operator-set, advisory maintenance flag (`001_initial_schema.sql`): "under
  // maintenance". Surfaced in the UI; NOT a gate (unlike enabled/read_only)
  // and operator-set (unlike the derived health_*). Managed via
  // SetBackendMaintenance; NOT mirrored from static config.
  bool maintenance = 23;
  // Vendor/implementation behind `kind` — a free-form slug ("garage" |
  // "seaweedfs" | "minio" | "aws" | "gcp" | "digitalocean" | …). `kind` is
  // too coarse (every self-hosted S3 is S3_COMPATIBLE); `provider` records
  // which one, for UI display. Mirrored from static config (`001_initial_schema.sql`);
  // empty when unset (the UI falls back to an endpoint heuristic).
  string provider = 24;
}

enum StorageKind {
  STORAGE_KIND_UNSPECIFIED = 0;
  STORAGE_KIND_AWS_S3 = 1;
  STORAGE_KIND_S3_COMPATIBLE = 2; // SeaweedFS, MinIO, Ceph RGW, etc.
  STORAGE_KIND_GCS = 3;
}

message ServerSideEncryption {
  SseType type = 1;
  string key_id = 2; // required when type=KMS
}

enum SseType {
  SSE_TYPE_UNSPECIFIED = 0;
  SSE_TYPE_NONE = 1;
  SSE_TYPE_AES256 = 2;
  SSE_TYPE_KMS = 3;
}

message EventSourceConfig {
  bool enabled = 1;
  EventTarget target = 2;
  string queue_url = 3;
  google.protobuf.Duration poll_interval = 4;
}

enum EventTarget {
  EVENT_TARGET_UNSPECIFIED = 0;
  EVENT_TARGET_NONE = 1;
  EVENT_TARGET_SQS = 2;
  EVENT_TARGET_REDIS = 3;
}

// ─── Bucket ─────────────────────────────────────────────────────────────────
message Bucket {
  // Resource name: "storageBackends/{backend_id}/buckets/{bucket_id}".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string backend_id = 2 [(google.api.field_behavior) = IMMUTABLE];
  string bucket_id = 3 [(google.api.field_behavior) = IMMUTABLE];
  string display_name = 4;
  string region = 5;
  // Optional binding to a single tenant. Empty → shared bucket; tenants
  // bind Collections to it via prefixes.
  string owner_tenant_id = 6;
  // Per-bucket Cedar policy layered on top of tenant policy.
  string cedar_policy = 7;
  // Per-bucket constraints — overrides config.policy globals when set.
  BucketConstraints constraints = 8;
  // Lifecycle rules (transition / expire) executed by the lifecycle worker.
  repeated LifecycleRule lifecycle_rules = 9;
  // Object lock configuration (WORM). Optional.
  ObjectLockConfig object_lock = 10;
  // Versioning configuration. Optional.
  BucketVersioning versioning = 11;
  // Replication policy (cross-backend). Optional.
  BucketReplication replication = 12;
  map<string, string> labels = 13;
  string resource_version = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Outbox status of the underlying physical bucket. One of:
  //   "ready"           — DB row + backend bucket are in sync.
  //   "pending"         — handler accepted CreateBucket; backend
  //                       provisioning still in flight.
  //   "failed"          — provisioning hit a non-retryable error;
  //                       provision_error carries the message.
  //   "deleting"        — handler accepted DeleteBucket; backend
  //                       teardown still in flight.
  //   "deletion_failed" — deletion hit a non-retryable error;
  //                       provision_error carries the message.
  // Clients should treat anything other than "ready" as "do not bind /
  // upload to this bucket yet"; the row stays visible so admin tooling
  // can render progress or surface a stuck operation.
  string provision_state = 17;
}

message BucketConstraints {
  // Max bytes per single object. 0 → inherit global default.
  int64 max_object_size_bytes = 1;
  // Multipart constraints. 0 fields → inherit globals.
  int64 min_part_size_bytes = 2;
  int64 max_part_size_bytes = 3;
  int32 max_parts = 4;
  // Allowed Content-Type values. Empty → allow all.
  repeated string allowed_content_types = 5;
  // Presign TTL ceilings. 0 → inherit globals.
  google.protobuf.Duration max_presign_put_ttl = 6;
  google.protobuf.Duration max_presign_get_ttl = 7;
  // Required checksum algorithm for uploads. UNSPECIFIED → no requirement.
  paladin.common.v1.ChecksumAlgorithm required_checksum_algorithm = 8;
}

message LifecycleRule {
  string id = 1;
  bool enabled = 2;
  // CEL expression evaluated against Object fields.
  string match = 3;
  oneof action {
    LifecycleTransition transition = 4;
    LifecycleExpiration expiration = 5;
  }
}

message LifecycleTransition {
  google.protobuf.Duration after = 1;
  string storage_class = 2;
}

message LifecycleExpiration {
  google.protobuf.Duration after = 1;
}

message ObjectLockConfig {
  bool enabled = 1;
  ObjectLockMode default_mode = 2;
  google.protobuf.Duration default_retention = 3;
}

enum ObjectLockMode {
  OBJECT_LOCK_MODE_UNSPECIFIED = 0;
  OBJECT_LOCK_MODE_GOVERNANCE = 1; // bypassable by privileged role
  OBJECT_LOCK_MODE_COMPLIANCE = 2; // not bypassable until expiry
}

message BucketVersioning {
  bool enabled = 1;
  // When versioning is on, soft-deletes never reclaim storage; opt-in.
  bool keep_deletes_forever = 2;
}

message BucketReplication {
  bool enabled = 1;
  // Replication target: another Bucket resource name.
  string destination_bucket = 2;
  // CEL filter — only objects matching are replicated. Empty → all.
  string filter = 3;
}

// ─── Tenant ─────────────────────────────────────────────────────────────────
message Tenant {
  // Resource name: "tenants/{tenant_id_or_slug}".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string tenant_id = 2 [(google.api.field_behavior) = IMMUTABLE];
  string display_name = 3;
  map<string, string> labels = 4;
  // Cedar policy inherited by all collections/buckets bound to this tenant.
  string inherited_cedar_policy = 5;
  string resource_version = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Human-readable kebab-case handle (e.g. "platform", "acme-prod").
  // Stable across the tenant's lifetime unless rotated via
  // RenameTenantSlug. Persisted as `tenants.slug` (UNIQUE), populated
  // by every read RPC. Front-end uses this to render slug-first URLs
  // (`/tenants/<slug>/...`) and canonicalises UUID URLs to it.
  string slug = 9 [(google.api.field_behavior) = IMMUTABLE];
  // deleted_at — soft-delete marker. Zero (unset) for active tenants;
  // non-zero for trashed rows recoverable via RestoreTenant. Filtered
  // out of ListTenants by default (set include_trashed or only_trashed
  // to see them). PurgeTenant removes the row physically, and is the
  // only thing that does.
  google.protobuf.Timestamp deleted_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // default_bucket — resource name of the (backend, bucket) this tenant is
  // bound to by default: "storageBackends/{backend_id}/buckets/{bucket_id}".
  // Sourced from the tenant_default_bindings row written at CreateTenant time;
  // empty when the tenant has no default binding (legacy / never set).
  // Read-only here — set the binding via CreateTenant.default_bucket.
  string default_bucket = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // storage_layout — "shared" (default) or "dedicated" (ADR-0015). A dedicated
  // tenant gets its own physical bucket (owner_tenant_id = the tenant),
  // provisioned at CreateTenant time. Settable only at create; read-only after.
  string storage_layout = 12 [(google.api.field_behavior) = IMMUTABLE];
}

// ─── Collection ──────────────────────────────────────────────────────────────
message Collection {
  // Resource name: "tenants/{tenant_id}/collections/{collection}". Under a
  // tenant the name takes the tenant's id, not its slug; the collection may
  // contain '/'.
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string tenant_id = 2 [(google.api.field_behavior) = IMMUTABLE];
  string collection = 3 [(google.api.field_behavior) = IMMUTABLE];
  string display_name = 4;
  // Bucket the collection is bound to (resource name).
  string bucket = 5; // "storageBackends/{backend_id}/buckets/{bucket_id}"
  // Effective completion mode (derived from bucket → backend events).
  paladin.common.v1.CompletionMode completion_mode = 6;
  // Cedar policy at the collection layer.
  string cedar_policy = 7;
  // Per-collection constraints overlay on top of bucket constraints.
  BucketConstraints constraints = 8;
  string resource_version = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ─── Quota ──────────────────────────────────────────────────────────────────
// Quota caps usage at tenant or bucket scope. Enforced at presign time.
message Quota {
  // Resource name: "tenants/{tenant_id_or_slug}/quota" or
  // "storageBackends/{backend_id}/buckets/{bucket_id}/quota".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Hard caps. 0 → no cap.
  int64 max_total_bytes = 2;
  int64 max_object_count = 3;
  int64 max_bytes_per_day = 4;
  int64 max_objects_per_day = 5;
  // Current usage (read-only; updated by accounting worker).
  QuotaUsage usage = 6;
  string resource_version = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message QuotaUsage {
  int64 total_bytes = 1;
  int64 object_count = 2;
  int64 bytes_today = 3;
  int64 objects_today = 4;
  google.protobuf.Timestamp last_reset_at = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ─── Audit ──────────────────────────────────────────────────────────────────
// AuditLogEntry is append-only. Every admin/iam mutation emits one row.
message AuditLogEntry {
  string entry_id = 1;
  google.protobuf.Timestamp at = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string actor_subject = 3;
  string actor_tenant_id = 4;
  string actor_audience = 5;
  string action = 6;        // "admin.BucketService.CreateBucket"
  string resource_name = 7; // canonical resource name acted upon
  string request_id = 8;
  string source_ip = 9;
  // Encoded as JSON; before/after diffs are stripped of secret fields by the
  // serializer (whitelisted field projection).
  bytes before_json = 10;
  bytes after_json = 11;
  // Set when the action failed; empty on success.
  string error_message = 12;
  // capability_id is the UUID of the capability token that
  // authorised this action, when one was presented. Empty when the
  // call was JWT- or API-token-authenticated. UI clients render
  // this as a link to the capability detail surface.
  string capability_id = 13;
}

// ─── Event subscription ─────────────────────────────────────────────────────
// EventSubscription describes a webhook / queue sink for Paladin events.
// Replaces the need for clients to consume S3 events directly.
message EventSubscription {
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string tenant_id = 2;
  // CEL filter against EventEnvelope; empty → all events for the tenant.
  string filter = 3;
  EventSink sink = 4;
  bool disabled = 5;
  string resource_version = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// EventSink is a tagged union of the supported delivery targets. Sink
// pick conventions, in order of preference for new operator subs:
//
//   - HttpSink  — universal "send a signed POST somewhere"; the right
//                 default for SaaS endpoints (Slack, PagerDuty) and
//                 customer-owned webhook receivers.
//   - NatsSink  — cloud-native pub/sub. Fire-and-forget core publish
//                 keeps the dispatcher hot loop fast; the natural
//                 sink for in-cluster agent-platform consumers and
//                 anything that wants subject-based fan-out without
//                 owning an HTTP listener.
//   - KafkaSink — durable, ordered, partitioned. Pick when the
//                 consumer needs replay or strict per-key ordering.
//                 Heavier dependency footprint (still BACKLOG).
//   - SqsSink   — AWS-native at-least-once queue. Pick when the
//                 receiver lives inside the AWS managed-services
//                 boundary already (still BACKLOG).
message EventSink {
  oneof target {
    HttpSink http = 1;
    KafkaSink kafka = 2;
    SqsSink sqs = 3;
    NatsSink nats = 4;
    RabbitMqSink rabbitmq = 5;
  }
}

message HttpSink {
  string url = 1;
  // HMAC-SHA256 signing secret reference; Paladin signs each delivery with this.
  string signing_secret_ref = 2;
  // Server applies exponential backoff up to max_attempts.
  int32 max_attempts = 3;
  // Wire format for the POST body:
  //   "" / "cloudevents" → a CloudEvents 1.0 envelope (Content-Type
  //                        application/cloudevents+json), identical to what
  //                        the NATS / SQS / RabbitMQ / Kafka sinks emit. This
  //                        is the DEFAULT — HTTP is symmetric with the brokers.
  //   "raw"              → the legacy bare Event JSON (Content-Type
  //                        application/json), for a webhook subscriber that
  //                        predates the default flip and still parses the old
  //                        shape.
  string format = 4;
}

message KafkaSink {
  string brokers = 1;
  string topic = 2;
  // SASL mechanism: "" (none) | "plain" | "scram-sha-256" | "scram-sha-512".
  // With any non-empty value the dispatcher authenticates the broker
  // connection with sasl_username / sasl_password.
  string sasl_mechanism = 3;
  string sasl_username = 4;
  // sasl_password is inline today (lab-grade, matching NatsSink.credentials_ref);
  // a secret-store-resolved ref is a follow-up (see BACKLOG).
  string sasl_password = 5 [debug_redact = true];
  // tls_enabled wraps the broker connection in TLS (server verified via the
  // system root CAs) — SASL_SSL is sasl_mechanism + tls_enabled.
  bool tls_enabled = 6;
  // Optional mTLS client cert + key (PEM). When both are set the dispatcher
  // presents them on the TLS handshake (implies TLS). Inline PEM is
  // lab-grade; every credential field also accepts a "k8s:<name>/<key>"
  // Secret ref resolved at delivery time.
  string tls_client_cert = 7;
  string tls_client_key = 8 [debug_redact = true];
  // Optional CA bundle (PEM) the broker's server certificate is verified
  // against — for brokers behind a private CA. Empty = system roots.
  // Setting it implies TLS.
  string tls_ca_cert = 9;
}

message SqsSink {
  string queue_url = 1;
  string region = 2;
  // Optional IAM role to assume for cross-account delivery: the dispatcher's
  // ambient credentials (IRSA / env / shared config) sts:AssumeRole into this
  // role before sending, so a queue in another AWS account is reachable.
  // Empty = deliver with the ambient credentials directly (same-account).
  string role_arn = 3;
}

// RabbitMqSink dispatches CloudEvents-formatted JSON payloads to a RabbitMQ
// exchange. The dispatcher publishes with publisher-confirms (acked) and
// persistent delivery mode, so a row only flips to delivered once the broker
// has durably accepted the message. Connection-pooled by URL.
message RabbitMqSink {
  // AMQP URL, e.g. "amqp://user:pass@rabbit.svc:5672/vhost". Credentials
  // ride in the URL userinfo.
  string url = 1 [debug_redact = true];
  // Target exchange. Empty string = the default (nameless) exchange, in
  // which case routing_key is the destination queue name.
  string exchange = 2;
  // Routing key (or queue name when exchange is empty).
  string routing_key = 3;
  // AMQPS client-certificate auth (PEM; each field also accepts a
  // "k8s:<name>/<key>" Secret ref). cert+key present a client certificate
  // on the TLS handshake; tls_ca_cert verifies a broker behind a private
  // CA. amqps:// URLs without these use system roots.
  string tls_client_cert = 4;
  string tls_client_key = 5 [debug_redact = true];
  string tls_ca_cert = 6;
}

// NatsSink dispatches CloudEvents-formatted JSON payloads to a NATS
// subject via core publish (fire-and-forget). JetStream durable
// streams are BACKLOG — opt-in once the agentic platform needs the
// at-least-once guarantees beyond what core NATS gives us.
message NatsSink {
  // NATS server URL. Comma-separated for cluster (e.g.
  // "nats://nats-0.nats.svc:4222,nats://nats-1.nats.svc:4222").
  // The dispatcher reuses one connection per server pool across all
  // subscriptions targeting the same servers — connection-pooled by
  // URL string equality.
  string url = 1;

  // Subject pattern. Static or interpolated; for v1 only static.
  // Convention: `paladin.events.<tenant_id>.<event_type>` so consumers
  // can wildcard-subscribe per tenant or per event class. Operator
  // picks the convention that matches their downstream routing.
  string subject = 2;

  // Optional credentials. SecretRef so plaintext never lives in YAML.
  // Auth modes:
  //   - empty / no auth: anonymous publish (lab clusters only)
  //   - `token:<plaintext>`: bare token auth
  //   - `nkey:<plaintext>`: NKey-based auth (BACKLOG — needs file
  //     materialisation; v1 ships token only)
  //   - `jwt:<plaintext>`: JWT + nkey credential file (BACKLOG —
  //     same materialisation gap)
  // Format is `<scheme>:<value>` to keep one string field, parsed
  // server-side. Validation rejects unknown schemes.
  string credentials_ref = 3;

  // jetstream publishes to a JetStream stream instead of core NATS
  // (at-most-once fire-and-forget). In JetStream mode the dispatcher
  // publishes synchronously with `Nats-Msg-Id` = the CloudEvents `id`, so the
  // server persists the message durably and DEDUPS a redelivery within the
  // stream's duplicate window — turning the at-least-once outbox into an
  // effectively-once publish onto the bus. `subject` must fall under a
  // provisioned stream's subject filter (e.g. `paladin.events.>`); downstream
  // consumers (analytics, search index) then read the stream with their own
  // durable consumers and replay from any sequence.
  bool jetstream = 4;
}
