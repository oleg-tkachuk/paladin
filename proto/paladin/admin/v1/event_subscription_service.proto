syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";

// EventSubscriptionService manages outbound event sinks. Subscriptions are
// owned by a tenant and require tenant.admin (or above).
service EventSubscriptionService {
  // CreateSubscription registers a delivery target for the tenant's events.
  // Exactly one sink (http / kafka / sqs) must be configured. Delivery is
  // at-least-once via the transactional outbox (ADR-0003).
  rpc CreateSubscription(CreateSubscriptionRequest) returns (EventSubscription);
  // GetSubscription returns the subscription including its sink configuration;
  // secret references are returned as references, never resolved.
  rpc GetSubscription(GetSubscriptionRequest) returns (EventSubscription) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateSubscription replaces the filter and sink. resource_version is
  // required. In-flight deliveries already queued are not re-targeted.
  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (EventSubscription) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteSubscription stops future deliveries. Events already in the outbox
  // are dropped rather than delivered to a subscription that no longer
  // exists.
  rpc DeleteSubscription(DeleteSubscriptionRequest) returns (DeleteSubscriptionResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ListSubscriptions returns the tenant's subscriptions, disabled ones
  // included.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // TestSubscription delivers a synthetic event to the configured sink.
  rpc TestSubscription(TestSubscriptionRequest) returns (TestSubscriptionResponse);

  // RedriveFailedDeliveries queues the subscription's failed deliveries —
  // those that exhausted their attempts — to be sent again, with a fresh
  // attempt budget. Failed rows are kept until the event-delivery retention
  // removes them. A disabled subscription is refused: its deliveries would
  // fail again at once.
  rpc RedriveFailedDeliveries(RedriveFailedDeliveriesRequest) returns (RedriveFailedDeliveriesResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message CreateSubscriptionRequest {
  string parent = 1 [(buf.validate.field).string.min_len = 1]; // "tenants/{tenant_id_or_slug}"
  EventSubscription subscription = 2 [(buf.validate.field).required = true];
}

message GetSubscriptionRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateSubscriptionRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  EventSubscription subscription = 4;
}

message DeleteSubscriptionRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteSubscriptionResponse {}

message ListSubscriptionsRequest {
  string parent = 1;
  paladin.common.v1.PageRequest page = 2;
}

message ListSubscriptionsResponse {
  repeated EventSubscription subscriptions = 1;
  paladin.common.v1.PageResponse page = 2;
}

message TestSubscriptionRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message TestSubscriptionResponse {
  bool delivered = 1;
  int32 status_code = 2;
  string error_message = 3;
}

message RedriveFailedDeliveriesRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message RedriveFailedDeliveriesResponse {
  // How many failed deliveries were queued again. 0 when none were failed.
  int64 requeued = 1;
}
