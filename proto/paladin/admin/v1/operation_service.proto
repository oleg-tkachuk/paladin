syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "paladin/common/v1/operation.proto";
import "paladin/common/v1/pagination.proto";
import "google/api/field_behavior.proto";

// OperationService exposes long-running operations on the admin plane.
// Mirrors the data-plane OperationService. Both list the caller tenant's
// operations; ListOperationsRequest.mine narrows that to the caller's own.
service PlatformOperationService {
  // GetOperation returns the current state of a long-running operation. done
  // distinguishes finished from in-flight; result carries either the response
  // or the error.
  rpc GetOperation(GetOperationRequest) returns (Operation) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListOperations pages the caller's operations, most recent first.
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CancelOperation requests cancellation. It is best-effort: work already
  // committed is not rolled back, and an operation that finished first stays
  // finished.
  rpc CancelOperation(CancelOperationRequest) returns (Operation) {
    option idempotency_level = IDEMPOTENT;
  }
  // DismissOperations clears finished operations from the caller's own list
  // (ListOperationsRequest.mine): those named, or with none named every one
  // that has finished. Only the caller's own and only finished ones are
  // cleared; others named are left as they are. The operations stay, and
  // stay listed to everyone else.
  rpc DismissOperations(DismissOperationsRequest) returns (DismissOperationsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message Operation {
  // Resource name: "operations/{operation_id}".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string type = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Progress of the operation: a google.protobuf.Struct of the latest
  // {processed, total} the worker reported, absent until its first report.
  // processed is a lower bound — reports are throttled to about one a second.
  google.protobuf.Any metadata = 3;
  bool done = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  oneof result {
    google.rpc.Status error = 5;
    google.protobuf.Any response = 6;
  }
  // The subject of the token that started it — for a person, their user id;
  // empty for an operation from before initiators were recorded.
  string initiator_subject = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  string initiator_tenant_id = 8;
  google.protobuf.Timestamp created_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When it finished; unset while it runs.
  google.protobuf.Timestamp done_at = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  paladin.common.v1.OperationState state = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // What it acts on; unset for an operation of a type that names no objects.
  paladin.common.v1.OperationTarget target = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When its initiator cleared it from their own list; unset while not.
  google.protobuf.Timestamp dismissed_at = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the housekeeping reaper removes it: done_at plus the configured
  // retention of finished operations. Unset while it runs, and when finished
  // operations are kept indefinitely.
  google.protobuf.Timestamp expire_time = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  // failed_count is how many objects a batch could not act on, each with its
  // reason in the response's failures. A batch that runs to its end is
  // SUCCEEDED whatever it could not do, so this is what tells one that left
  // objects behind from a clean one; 0 for any other operation.
  int64 failed_count = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetOperationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ListOperationsRequest {
  paladin.common.v1.PageRequest page = 1;
  // CEL filter over the Operation schema (see internal/filter/cel). The
  // SQL-expressible conjuncts are pushed into the query; the full expression
  // is then evaluated over the fetched page, so a page whose rows all fail the
  // predicate still returns next_page_token and the caller keeps paging.
  string filter = 2;
  // Order on the operation id, which is a UUIDv7 and therefore ordered by
  // creation time. Unspecified means ASC, the original behaviour.
  //
  // DESC exists because every caller that shows "current activity" wants the
  // newest rows and there was no way to ask for them: a page of 50 off an
  // ascending cursor is the 50 OLDEST operations, so the console's
  // background-ops drawer showed a three-day-old failure and none of the
  // operations that had run since.
  paladin.common.v1.SortOrder sort_order = 3;
  // mine lists only the operations the caller started, matched in the query
  // on the subject of the caller's token. Operations from before initiators
  // were recorded are no one's. Those the caller cleared with
  // DismissOperations are left out unless include_dismissed.
  bool mine = 4;
  // include_dismissed lists, with mine, the operations the caller cleared too.
  bool include_dismissed = 5;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
  paladin.common.v1.PageResponse page = 2;
}

message CancelOperationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message DismissOperationsRequest {
  // Operation resource names; empty clears every finished one of the caller's.
  repeated string names = 1 [(buf.validate.field).repeated = {
    max_items: 1000
    items: {string: {min_len: 1}}
  }];
}

message DismissOperationsResponse {
  // How many were cleared by this call.
  int32 dismissed_count = 1;
}
