syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto";
import "google/type/money.proto";
import "paladin/admin/v1/types.proto";

// BillingService surfaces per-tenant capability spend over the
// charges ledger (`001_initial_schema.sql`). Distinct from TenantBudgetService —
// that one manages the cap; this one renders the spend.
//
// Authorization: platform-admin / tenant-admin only. Cedar action
// `ReadBilling` on the tenant resource gates every RPC; ListTenantSpend,
// which reads every tenant, also needs the platform.admin role.
service BillingService {
  // GetTenantSummary returns aggregate spend + top-N breakdowns for
  // the supplied period. Defaults to last 30 days when period_start
  // / period_end are unset.
  rpc GetTenantSummary(GetTenantSummaryRequest) returns (GetTenantSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetTenantTimeSeries returns time-bucketed spend for a chart.
  // granularity ∈ {hour, day, week} — server validates.
  rpc GetTenantTimeSeries(GetTenantTimeSeriesRequest) returns (GetTenantTimeSeriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetPlatformTimeSeries returns time-bucketed spend across every tenant,
  // as GetTenantTimeSeries does for one: what the platform was charged, in
  // the unit most of the period's charges are in. It reads every tenant's
  // rows, so it is gated as ListTenantSpend is.
  rpc GetPlatformTimeSeries(GetPlatformTimeSeriesRequest) returns (GetPlatformTimeSeriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListTenantTimeSeries returns each named tenant's spend a bucket at a
  // time, as GetTenantTimeSeries does for one, from one sum of the ledger
  // across them: a trend beside each tenant a list shows. It reads every
  // named tenant's rows, so it is gated as ListTenantSpend is.
  rpc ListTenantTimeSeries(ListTenantTimeSeriesRequest) returns (ListTenantTimeSeriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListTenantSpend lists the tenants that spent anything over the period,
  // the most first, from one sum of the charges ledger across tenants.
  // Defaults to the last 30 days, as GetTenantSummary does. Gated by
  // ReadBilling on the caller's own tenant and the platform.admin role.
  rpc ListTenantSpend(ListTenantSpendRequest) returns (ListTenantSpendResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetBillingSettings returns the platform's billing settings, so a client
  // can show and default to them: the currency an amount is in when it names
  // none. Gated by ReadBilling on the caller's own tenant.
  rpc GetBillingSettings(GetBillingSettingsRequest) returns (GetBillingSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListTenantSpendRequest {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  // limit is how many tenants to return, the most spent first; 0 is the
  // server's default, and more than its maximum is refused.
  int32 limit = 3 [(buf.validate.field).int32.gte = 0];
}

message ListTenantSpendResponse {
  // tenants that spent anything over the period: a tenant with no charge in
  // it is not listed. Ordered by unit — the platform's currency first, then
  // the others by code, since amounts in different units do not compare —
  // then by spend, the most first.
  repeated TenantSpend tenants = 1;
  // truncated is true when more tenants spent than limit let through.
  bool truncated = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// TenantSpend is what one tenant's charges came to over a period, net of
// refunds, in the unit most of them are in.
message TenantSpend {
  string tenant_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string slug = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string display_name = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // deleted is true for a tenant in the trash, which still spent in the
  // period.
  bool deleted = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.type.Money spent = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 charge_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetBillingSettingsRequest {}

message GetBillingSettingsResponse {
  // The platform's ISO 4217 currency (capability.currency): what a budget or
  // capability that names no currency is in. "XXX" is no currency — amounts
  // are credits, written without a symbol.
  string currency_code = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetTenantSummaryRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
}

message GetTenantSummaryResponse {
  // The double total_amount, replaced by total_micros.
  reserved 1;
  reserved "total_amount";
  // total_micros and unit_code, replaced by total.
  reserved 2, 8;
  reserved "total_micros", "unit_code";
  // total is the sum of the period's charges, exact to the nano. Its
  // currency is the tenant's unit (or USD); mixed-unit periods collapse to
  // whichever unit dominates the row count — non-issue today (no FX).
  // currency_code is ISO 4217, XXX for metering that is not money.
  google.type.Money total = 10;
  // The double max_budget_amount, replaced by max_budget_micros.
  reserved 3;
  reserved "max_budget_amount";
  // max_budget_micros, replaced by max_budget.
  reserved 9;
  reserved "max_budget_micros";
  // budget_ceiling is the tenant's budget cap, copied for UI convenience so
  // the frontend doesn't need a second RPC. Neither arm is set for a tenant
  // with no budget row.
  oneof budget_ceiling {
    // max_budget is the cap; a zero amount allows no spend.
    google.type.Money max_budget = 11;
    // unlimited_budget is no cap.
    UnlimitedBudget unlimited_budget = 12;
  }
  repeated TopEntry top_capabilities = 4;
  repeated TopEntry top_actors = 5;
  repeated TopEntry top_ops = 6;
  int64 charge_count = 7;
}

message TopEntry {
  // label is the capability_id / actor_subject / op string,
  // depending on which list this entry belongs to.
  string label = 1;
  // The double amount, replaced by amount_micros.
  reserved 2;
  reserved "amount";
  int64 charge_count = 3;
  // amount_micros, replaced by spent.
  reserved 4;
  reserved "amount_micros";
  // spent is what the entry's charges came to, exact to the nano.
  google.type.Money spent = 5;
}

message GetTenantTimeSeriesRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
  // granularity ∈ {hour, day, week}. Server rejects others with
  // InvalidArgument.
  string granularity = 4;
}

message GetTenantTimeSeriesResponse {
  repeated TimeBucket buckets = 1;
  // unit_code, replaced by the currency of each bucket's amount.
  reserved 2;
  reserved "unit_code";
}

message GetPlatformTimeSeriesRequest {
  google.protobuf.Timestamp period_start = 1;
  google.protobuf.Timestamp period_end = 2;
  // granularity ∈ {hour, day, week}, as GetTenantTimeSeries takes it.
  string granularity = 3;
}

message GetPlatformTimeSeriesResponse {
  repeated TimeBucket buckets = 1;
}

message ListTenantTimeSeriesRequest {
  // tenant_ids are the tenants whose series to return, each once.
  repeated string tenant_ids = 1 [(buf.validate.field).repeated = {
    min_items: 1,
    max_items: 50,
    unique: true,
    items: {
      string: {uuid: true}
    }
  }];
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
  // granularity ∈ {hour, day, week}, as GetTenantTimeSeries takes it.
  string granularity = 4;
}

message ListTenantTimeSeriesResponse {
  // series holds one entry per tenant asked for, in the order asked: a
  // tenant that spent nothing in the period has no buckets.
  repeated TenantTimeSeries series = 1;
}

// TenantTimeSeries is one tenant's spend a bucket at a time, in the unit
// most of its charges are in.
message TenantTimeSeries {
  string tenant_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated TimeBucket buckets = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message TimeBucket {
  google.protobuf.Timestamp start = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The double amount, replaced by amount_micros.
  reserved 2;
  reserved "amount";
  int64 charge_count = 3;
  // amount_micros, replaced by spent.
  reserved 4;
  reserved "amount_micros";
  // spent is what the entry's charges came to, exact to the nano.
  google.type.Money spent = 5;
}
