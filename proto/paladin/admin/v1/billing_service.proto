syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto";

// BillingService surfaces per-tenant capability spend over the
// charges ledger (migration 027). Distinct from TenantBudgetService —
// that one manages the cap; this one renders the spend.
//
// Authorization: platform-admin / tenant-admin only. Cedar action
// `ReadBilling` on the tenant resource gates every RPC.
service BillingService {
  // GetTenantSummary returns aggregate spend + top-N breakdowns for
  // the supplied period. Defaults to last 30 days when period_start
  // / period_end are unset.
  rpc GetTenantSummary(GetTenantSummaryRequest) returns (GetTenantSummaryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetTenantTimeSeries returns time-bucketed spend for a chart.
  // granularity ∈ {hour, day, week} — server validates.
  rpc GetTenantTimeSeries(GetTenantTimeSeriesRequest) returns (GetTenantTimeSeriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetTenantSummaryRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
}

message GetTenantSummaryResponse {
  // total_amount is the sum of charges.amount over the period.
  // Deprecated: use total_micros, an exact integer count of millionths. Kept
  // for one release; the server fills both.
  double total_amount = 1 [deprecated = true];
  // total_micros is total_amount in millionths of unit_code (1.5 USD =
  // 1500000). Integer, so sums never drift.
  int64 total_micros = 8;
  // unit_code mirrors the tenant's pinned unit_code (or USD default).
  // Mixed-unit periods collapse to whichever unit dominates the row
  // count — non-issue today (no FX), audit-exposed for the future.
  string unit_code = 2;
  // max_budget_amount is the tenant_budgets cap, copied for UI
  // convenience so the frontend doesn't need a second RPC.
  // Deprecated: use max_budget_micros, an exact integer count of millionths. Kept
  // for one release; the server fills both.
  double max_budget_amount = 3 [deprecated = true];
  // max_budget_micros is max_budget_amount in millionths of unit_code.
  int64 max_budget_micros = 9;
  repeated TopEntry top_capabilities = 4;
  repeated TopEntry top_actors = 5;
  repeated TopEntry top_ops = 6;
  int64 charge_count = 7;
}

message TopEntry {
  // label is the capability_id / actor_subject / op string,
  // depending on which list this entry belongs to.
  string label = 1;
  // Deprecated: use amount_micros, an exact integer count of millionths. Kept
  // for one release; the server fills both.
  double amount = 2 [deprecated = true];
  int64 charge_count = 3;
  // amount_micros is amount in millionths of the response's unit_code.
  int64 amount_micros = 4;
}

message GetTenantTimeSeriesRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp period_start = 2;
  google.protobuf.Timestamp period_end = 3;
  // granularity ∈ {hour, day, week}. Server rejects others with
  // InvalidArgument.
  string granularity = 4;
}

message GetTenantTimeSeriesResponse {
  repeated TimeBucket buckets = 1;
  string unit_code = 2;
}

message TimeBucket {
  google.protobuf.Timestamp start = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Deprecated: use amount_micros, an exact integer count of millionths. Kept
  // for one release; the server fills both.
  double amount = 2 [deprecated = true];
  int64 charge_count = 3;
  // amount_micros is amount in millionths of the response's unit_code.
  int64 amount_micros = 4;
}
