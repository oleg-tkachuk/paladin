syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto";

// TenantBudgetService manages the per-tenant aggregate USD spend cap
// for the capability subsystem (cfg.Capability.* + `tenant_budgets` in
// `001_initial_schema.sql`). Distinct from QuotaService — quotas are bytes /
// object counts; budgets are capability-spend dollars.
//
// Naming: methods carry the `TenantBudgetService` prefix on their
// request types to satisfy buf STANDARD lint when bare verbs (Get /
// Set / Reset) collide with other admin services.
//
// Authorization: platform-admin / tenant-admin only. The capability
// path that emits charges goes through the regular Cedar gate; this
// service is the operator surface for setting / inspecting the cap.
service TenantBudgetService {
  // Get returns the current snapshot for a tenant. Returns NOT_FOUND
  // when the tenant has never had a budget configured AND has never
  // been charged — distinct from "configured but unlimited" (cap=0).
  rpc Get(TenantBudgetServiceGetRequest) returns (TenantBudgetServiceGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // Set upserts the cap. ResetSpend=true rolls the accounting period
  // and zeros spent_usd (typical: monthly billing close). false
  // adjusts the cap mid-cycle without affecting accumulated spend.
  rpc Set(TenantBudgetServiceSetRequest) returns (TenantBudgetServiceSetResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // Summarize returns every tenant's budget snapshot joined with
  // tenant identity (slug, display_name) + a derived utilisation
  // percent. Drives the cross-tenant dashboard widget that surfaces
  // tenants approaching caps. Platform-admin only.
  //
  // Filters keep the wire payload small on platforms with many
  // tenants — typical operator query is "show me anyone over 80 %".
  rpc Summarize(TenantBudgetServiceSummarizeRequest) returns (TenantBudgetServiceSummarizeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// TenantBudget is the typed metadata view of a per-tenant aggregate
// cap row. Returned by every RPC.
message TenantBudget {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];

  // OCC token for Set. Empty means the row has never been written.
  string resource_version = 8;

  // The doubles max_budget_amount and spent_amount, replaced by
  // max_budget_micros and spent_micros.
  reserved 2, 3;
  reserved "max_budget_amount", "spent_amount";

  google.protobuf.Timestamp period_start = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // period_end is optional — NULL means open-ended.
  google.protobuf.Timestamp period_end = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  // unit_code is the ISO 4217 code (USD/EUR/UAH/GBP) or UNIT
  // (non-currency metering). One per TenantBudget message.
  string unit_code = 7;

  // max_budget_micros is the cap in millionths of unit_code; 0 = unlimited
  // (the counter still accumulates so admin tooling can show "current
  // spend"). Currency given by unit_code.
  int64 max_budget_micros = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // spent_micros is the spend in the current period, in millionths.
  int64 spent_micros = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message TenantBudgetServiceGetRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
}

message TenantBudgetServiceGetResponse {
  TenantBudget budget = 1;
}

message TenantBudgetServiceSetRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];

  // OCC, required. Two operators editing the same cap used to race with
  //   last-write-wins and neither was told; the loser's change vanished while
  //   its UI reported success. Pass the version from a prior Get; "0" asserts
  //   no budget row exists yet, and is itself a conflict if one does.
  string resource_version = 6 [(buf.validate.field).string.min_len = 1];

  // The double max_budget_amount, replaced by max_budget_micros. The server
  // refuses a request that still sends it rather than lift the cap.
  reserved 2;
  reserved "max_budget_amount";

  // reset_spend rolls the period: zeros spent_micros, moves
  // period_start to now. false leaves the counter alone — the cap
  // changes mid-window.
  bool reset_spend = 3;

  // period_end pins a closing time for the new accounting window.
  // Optional; nil = open-ended.
  google.protobuf.Timestamp period_end = 4;

  // unit_code optionally pins the currency (ISO 4217 USD/EUR/UAH/
  // GBP or UNIT). Empty = keep existing or default to "USD".
  string unit_code = 5;

  // max_budget_micros is the new cap in millionths of unit_code (1000 USD
  // = 1000000000); 0 or absent = unlimited.
  optional int64 max_budget_micros = 7 [(buf.validate.field).int64.gte = 0];
}

message TenantBudgetServiceSetResponse {
  TenantBudget budget = 1;
}

// TenantBudgetSummary joins a TenantBudget row with the tenant's
// human handle and a derived utilisation percent so the dashboard
// can render "acme-prod · 87 % of $1,000" without a second lookup.
message TenantBudgetSummary {
  string tenant_id     = 1;
  string slug          = 2;
  string display_name  = 3;
  TenantBudget budget  = 4;
  // utilisation_pct = spent / max × 100, capped at 100 for display.
  // 0 when max_budget_micros == 0 (unlimited / metering-only).
  double utilisation_pct = 5;
}

message TenantBudgetServiceSummarizeRequest {
  // threshold_pct — include rows whose utilisation_pct >= threshold.
  // 0 = no threshold (return everything matching the other filters).
  double threshold_pct = 1 [(buf.validate.field).double = {gte: 0, lte: 100}];

  // unlimited_only — when true, return only rows where
  // max_budget_micros == 0 (cap-less metering). Mutually exclusive
  // with a non-zero threshold_pct; the server enforces this.
  bool unlimited_only = 2;

  // exclude_inactive — when true (default), skip soft-deleted
  // tenants (deleted_at IS NOT NULL). The dashboard widget passes
  // true; an admin auditing a recovery scenario sets false.
  bool exclude_inactive = 3;

  // limit — the page size. 0 = server default (50). The widget
  // typically asks for 10.
  int32 limit = 4 [(buf.validate.field).int32 = {gte: 0, lte: 500}];

  // page_token — the next_page_token of the previous page; empty for the
  // first. Rows come most at risk first, then by tenant id. Spend moves
  // between pages, so a tenant may show on two of them or on none.
  string page_token = 5;
}

message TenantBudgetServiceSummarizeResponse {
  repeated TenantBudgetSummary summaries = 1;
  // next_page_token fetches the next page; empty on the last one.
  string next_page_token = 2;
}
