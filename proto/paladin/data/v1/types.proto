syntax = "proto3";

package paladin.data.v1;

option go_package = "github.com/oleg-tkachuk/paladin/sdk/go/gen/paladin/data/v1;paladindatav1";

import "google/protobuf/timestamp.proto";
import "google/api/field_behavior.proto";

// Object is the data-plane representation. Hides backend internals;
// `bucket` and `backend_id` surface only when the caller has the
// `view.physical_storage` role (set in JWT claims).
message Object {
  // Resource name: "tenants/{tenant_id}/collections/{collection}/objects/{object_id}".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string object_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string tenant_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string collection = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Storage path inside the collection.
  string key = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  ObjectState state = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string content_type = 7;
  int64 size_bytes = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  ChecksumDigest checksum = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  string sequencer = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> metadata = 12;
  map<string, string> tags = 13;
  string external_ref = 14;
  // Resource version for optimistic concurrency control.
  string resource_version = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp committed_at = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp terminated_at = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp presign_expires_at = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Object-lock retention; populated when the parent bucket has lock enabled.
  // Object-lock state of the current version (ADR-0013). Populated by
  // GetObject and LookupObject. Left empty by ListObjects, where reading a
  // lock per row would add a join to the pagination hot path for a field most
  // deployments never set — use GetObjectLock for a specific object.
  ObjectLockState lock = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Optional — physical placement; populated only for privileged callers.
  PhysicalPlacement placement = 22;
  // Signals the content has been flagged with. Empty for a clean object. A
  // capability without allow_tainted_read cannot read a tainted object.
  // Populated by GetObject and LookupObject; set with SetObjectTaint.
  repeated TaintSignal taint = 23 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// TaintSignal is a reason an object's content must not reach an agent that
// has not been allowed to read flagged content.
enum TaintSignal {
  TAINT_SIGNAL_UNSPECIFIED = 0;
  // Text that tries to instruct the model reading it.
  TAINT_SIGNAL_PROMPT_INJECTION = 1;
  // Personal data.
  TAINT_SIGNAL_PII = 2;
  // A credential, key or token.
  TAINT_SIGNAL_SECRETS = 3;
}

enum ObjectState {
  OBJECT_STATE_UNSPECIFIED = 0;
  OBJECT_STATE_PENDING = 1;
  OBJECT_STATE_AVAILABLE = 2;
  OBJECT_STATE_FAILED = 3;
  OBJECT_STATE_DELETED = 4;
}

message ChecksumDigest {
  string algorithm = 1; // CRC32C | SHA256 | MD5
  string value = 2;     // base64-encoded
}

message ObjectLockState {
  string mode = 1; // GOVERNANCE | COMPLIANCE
  google.protobuf.Timestamp retain_until = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  bool legal_hold = 3;
}

message PhysicalPlacement {
  string backend_id = 1;
  string bucket_id = 2;
  string storage_path = 3; // composed: "<tenant>/<collection>/<key>"
}

// CompletedPart / PartInfo for multipart.
message CompletedPart {
  int32 part_number = 1;
  string etag = 2;
  string checksum_value = 3; // optional
}

message PartInfo {
  int32 part_number = 1;
  int64 size_bytes = 2;
  string etag = 3;
  google.protobuf.Timestamp uploaded_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}
