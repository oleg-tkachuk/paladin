syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/v1/types.proto";

// TenantService is the only service where tenant_id appears in the request
// body — because these RPCs are by definition cross-tenant (called by
// control-plane admins, not tenant clients). Authorization is checked via
// the "admin" role in the JWT, not via the standard tenant claim.
service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
}

message CreateTenantRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  string display_name = 2;
  map<string, string> labels = 3;
  // Inherited Cedar policy applied to all buckets under this tenant.
  string inherited_cedar_policy = 4;
}

message GetTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  string display_name = 4;
  map<string, string> labels = 5;
  string inherited_cedar_policy = 6;
}

message DeleteTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Async deletion; returns an operation name for tracking.
  bool force = 2;
}

message DeleteTenantResponse {
  string operation_name = 1;
}

message ListTenantsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // CEL filter over Tenant fields.
  string filter = 3;
  string order_by = 4;
  SortOrder sort_order = 5;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  string next_page_token = 2;
}
