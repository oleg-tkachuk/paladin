syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/grpc;grpcapi";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/rpc/status.proto";
import "paladin/v1/types.proto";

// BulkService provides batch operations for managing multiple objects in a single request.
//
// Each operation processes items independently — individual failures do not
// cause the entire batch to fail. Per-item results are returned with success
// or error status for each entry.
service BulkService {
  // BatchDeleteObjects deletes multiple objects in a single request.
  // Returns per-item results indicating success or failure for each object.
  rpc BatchDeleteObjects(BatchDeleteObjectsRequest) returns (BatchDeleteObjectsResponse) {
    option (google.api.http) = {
      post: "/v1/tenants/{tenant_id}/buckets/{bucket}/objects:batchDelete"
      body: "*"
    };
  }

  // BatchCopyObjects copies multiple objects in a single request.
  // Returns per-item results indicating success or failure for each copy operation.
  rpc BatchCopyObjects(BatchCopyObjectsRequest) returns (BatchCopyObjectsResponse) {
    option (google.api.http) = {
      post: "/v1/tenants/{tenant_id}/buckets/{bucket}/objects:batchCopy"
      body: "*"
    };
  }
}

// ─── Batch delete ────────────────────────────────────────────────────────────

// BatchDeleteObjectsRequest deletes multiple objects by their storage keys.
message BatchDeleteObjectsRequest {
  // Tenant identifier for logical isolation (opaque UUID, used as S3 key prefix).
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];

  // Bucket containing the objects to delete.
  string bucket = 2 [(buf.validate.field).string.min_len = 1];

  // Storage keys of the objects to delete.
  repeated string keys = 3 [(buf.validate.field).repeated = {
    min_items: 1,
    max_items: 1000
  }];

  // If true, permanently deletes objects and their content from the storage backend.
  // If false (default), performs a soft-delete that can be reversed.
  bool permanent = 4;

  // Client-provided idempotency key to prevent duplicate batch operations.
  string idempotency_key = 5;
}

// BatchDeleteObjectsResponse contains per-item results for each deletion.
message BatchDeleteObjectsResponse {
  // Per-item results in the same order as the request keys.
  repeated BatchDeleteResult results = 1;

  // Total number of objects successfully deleted.
  int64 success_count = 2;

  // Total number of objects that failed to delete.
  int64 failure_count = 3;
}

// BatchDeleteResult contains the outcome of deleting a single object in a batch.
message BatchDeleteResult {
  // Storage key of the object this result refers to.
  string key = 1;

  // True if the deletion succeeded.
  bool success = 2;

  // Error details if the deletion failed. Absent on success.
  // Uses google.rpc.Status for rich error information.
  google.rpc.Status error = 3;
}

// ─── Batch copy ──────────────────────────────────────────────────────────────

// BatchCopyObjectsRequest copies multiple objects in a single request.
message BatchCopyObjectsRequest {
  // Tenant identifier for logical isolation (opaque UUID, used as S3 key prefix).
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];

  // Source bucket containing the objects to copy.
  string bucket = 2 [(buf.validate.field).string.min_len = 1];

  // List of copy operations to perform.
  repeated CopyEntry entries = 3 [(buf.validate.field).repeated = {
    min_items: 1,
    max_items: 1000
  }];

  // Client-provided idempotency key to prevent duplicate batch operations.
  string idempotency_key = 4;
}

// CopyEntry defines a single object copy operation within a batch.
message CopyEntry {
  // Source key of the object to copy.
  string source_key = 1 [(buf.validate.field).string.min_len = 1];

  // Destination bucket. If omitted, defaults to the source bucket.
  string destination_bucket = 2;

  // Destination key for the copied object.
  string destination_key = 3 [(buf.validate.field).string.min_len = 1];
}

// BatchCopyObjectsResponse contains per-item results for each copy operation.
message BatchCopyObjectsResponse {
  // Per-item results in the same order as the request entries.
  repeated BatchCopyResult results = 1;

  // Total number of objects successfully copied.
  int64 success_count = 2;

  // Total number of objects that failed to copy.
  int64 failure_count = 3;
}

// BatchCopyResult contains the outcome of copying a single object in a batch.
message BatchCopyResult {
  // Source key this result refers to.
  string source_key = 1;

  // Destination key this result refers to.
  string destination_key = 2;

  // True if the copy succeeded.
  bool success = 3;

  // The newly created object resource (the copy). Present only on success.
  Object object = 4;

  // Error details if the copy failed. Absent on success.
  // Uses google.rpc.Status for rich error information.
  google.rpc.Status error = 5;
}
