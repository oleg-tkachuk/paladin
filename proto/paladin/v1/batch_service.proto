syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "buf/validate/validate.proto";
import "paladin/v1/types.proto";

// BatchService replaces the v1 BulkService with an async long-running-operation
// model (AIP-151). Synchronous batches of >100 items are rejected — use a
// CEL filter + BatchByFilter operation instead.
service BatchService {
  // BatchDeleteObjects enqueues a delete operation. Returns an Operation.
  rpc BatchDeleteObjects(BatchDeleteObjectsRequest) returns (Operation);

  // BatchCopyObjects enqueues a copy operation. Returns an Operation.
  rpc BatchCopyObjects(BatchCopyObjectsRequest) returns (Operation);

  // BatchRestoreObjects enqueues a restore operation.
  rpc BatchRestoreObjects(BatchRestoreObjectsRequest) returns (Operation);
}

// Either `names` (explicit set, <=100) or `filter` (CEL expression over Object).
// Both may be combined; `filter` is evaluated within `names` when both set.
message ObjectSelector {
  // Explicit resource names. Upper bound 100 to keep request payloads bounded.
  repeated string names = 1 [(buf.validate.field).repeated.max_items = 100];
  // CEL expression. When present, selector expands asynchronously inside the
  // operation worker. No item cap on the server side — backpressure via
  // paginated scanning.
  string filter = 2;
}

message BatchDeleteObjectsRequest {
  // Required for scoping the filter scan even when filter is empty.
  string bucket = 1 [(buf.validate.field).string.min_len = 1];
  ObjectSelector selector = 2 [(buf.validate.field).required = true];
  bool permanent = 3;
}

message BatchCopyObjectsRequest {
  string source_bucket = 1 [(buf.validate.field).string.min_len = 1];
  ObjectSelector selector = 2 [(buf.validate.field).required = true];
  string destination_bucket = 3 [(buf.validate.field).string.min_len = 1];
  // Template for destination key. CEL expression evaluated against the
  // source Object: `"archive/" + bucket + "/" + key`.
  string destination_key_template = 4 [(buf.validate.field).string.min_len = 1];
}

message BatchRestoreObjectsRequest {
  string bucket = 1 [(buf.validate.field).string.min_len = 1];
  ObjectSelector selector = 2 [(buf.validate.field).required = true];
}

// ─── Typed metadata/result messages for Operation.Any ────────────────────────

message BatchOperationMetadata {
  int64 total = 1;
  int64 succeeded = 2;
  int64 failed = 3;
  // Sample of recent failures (up to 10) for diagnostics.
  repeated BatchFailure recent_failures = 4;
}

message BatchFailure {
  string object_name = 1;
  string error_code = 2;
  string error_message = 3;
}

message BatchOperationResult {
  int64 total = 1;
  int64 succeeded = 2;
  int64 failed = 3;
  // Pointer to a paginated failure report (stored as an object in PALADIN itself).
  string failure_report_object_name = 4;
}
