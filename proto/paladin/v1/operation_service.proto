syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "buf/validate/validate.proto";
import "paladin/v1/types.proto";

// OperationService exposes the long-running-operation (AIP-151) pattern.
// Every non-trivial async RPC in PALADIN returns an Operation; the client
// polls or streams updates here.
service OperationService {
  rpc GetOperation(GetOperationRequest) returns (Operation);
  rpc CancelOperation(CancelOperationRequest) returns (Operation);
  rpc ListOperations(ListOperationsRequest) returns (ListOperationsResponse);

  // WatchOperation streams Operation snapshots until done=true. Uses Connect
  // server-streaming for push-based updates (no polling).
  rpc WatchOperation(WatchOperationRequest) returns (stream Operation);
}

message GetOperationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message CancelOperationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ListOperationsRequest {
  int32 page_size = 1;
  string page_token = 2;
  // CEL filter over Operation fields. Example: `type == "BatchDelete" && !done`.
  string filter = 3;
}

message ListOperationsResponse {
  repeated Operation operations = 1;
  string next_page_token = 2;
}

message WatchOperationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}
