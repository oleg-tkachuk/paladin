syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "buf/validate/validate.proto";

// PolicyService provides thin helpers around Cedar policy text so the UI
// editor can pre-validate before writing via TenantService / ObjectKeyService
// (which own the actual persistence).
service PolicyService {
  // ValidatePolicy parses a Cedar policy text and reports syntax errors
  // without persisting anything. Empty text is valid.
  rpc ValidatePolicy(ValidatePolicyRequest) returns (ValidatePolicyResponse);
}

message ValidatePolicyRequest {
  string policy = 1 [(buf.validate.field).string.max_len = 65536];
}

message ValidatePolicyResponse {
  // True when the policy parses cleanly.
  bool valid = 1;
  // Human-readable parser error (empty when valid).
  string error = 2;
}
