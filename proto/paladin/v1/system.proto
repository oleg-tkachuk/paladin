syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/grpc;grpcapi";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// SystemService provides health checks, readiness probes, and service
// information for infrastructure monitoring and orchestration.
service SystemService {
  // Ping is a minimal connectivity check that returns immediately.
  // Use for basic reachability testing only — it does not verify dependencies.
  rpc Ping(PingRequest) returns (PingResponse) {
    option (google.api.http) = {
      get: "/v1/system/ping"
    };
  }

  // GetLivez returns the liveness status of the service process.
  // A non-live service should be restarted by the orchestrator.
  rpc GetLivez(GetLivezRequest) returns (GetLivezResponse) {
    option (google.api.http) = {
      get: "/v1/system/livez"
    };
  }

  // GetReadyz returns the readiness status of the service and all its
  // dependencies (database, object storage, etc.).
  // A non-ready service should be removed from the load balancer.
  rpc GetReadyz(GetReadyzRequest) returns (GetReadyzResponse) {
    option (google.api.http) = {
      get: "/v1/system/readyz"
    };
  }

  // GetStartupz returns the startup status of the service.
  // Indicates whether initial bootstrap (migrations, cache warming, etc.) is complete.
  rpc GetStartupz(GetStartupzRequest) returns (GetStartupzResponse) {
    option (google.api.http) = {
      get: "/v1/system/startupz"
    };
  }

  // GetInfo returns detailed information about the service build, runtime,
  // and environment for debugging and operational visibility.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option (google.api.http) = {
      get: "/v1/system/info"
    };
  }
  // GetConfig returns the sanitized system configuration for administrative display.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse) {
    option (google.api.http) = {
      get: "/v1/system/config"
    };
  }

  // ListAuditLogs returns a paginated list of system activity logs for a tenant.
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse) {
    option (google.api.http) = {
      get: "/v1/system/audit"
    };
  }
}

// HealthStatus represents the health of the service or a dependency.
enum HealthStatus {
  // Default value. Status has not been determined.
  HEALTH_STATUS_UNSPECIFIED = 0;

  // The component is functioning normally.
  HEALTH_STATUS_HEALTHY = 1;

  // The component is not functioning and should be restarted or investigated.
  HEALTH_STATUS_UNHEALTHY = 2;

  // The component is partially functional — some operations may fail.
  HEALTH_STATUS_DEGRADED = 3;

  // The component has been intentionally disabled.
  HEALTH_STATUS_DISABLED = 4;
}

// ─── Ping ────────────────────────────────────────────────────────────────────

// PingRequest is an empty request for the connectivity check.
message PingRequest {}

// PingResponse contains a simple acknowledgment message.
message PingResponse {
  // Human-readable acknowledgment (e.g. "pong").
  string message = 1;
}

// ─── Liveness ────────────────────────────────────────────────────────────────

// GetLivezRequest is an empty request for the liveness probe.
message GetLivezRequest {}

// GetLivezResponse indicates whether the service process is alive.
message GetLivezResponse {
  // Human-readable status description.
  string status = 1;

  // Structured health indicator.
  HealthStatus health = 2;
}

// ─── Readiness ───────────────────────────────────────────────────────────────

// GetReadyzRequest is an empty request for the readiness probe.
message GetReadyzRequest {}

// GetReadyzResponse indicates whether the service is ready to accept traffic.
message GetReadyzResponse {
  // Human-readable status description.
  string status = 1;

  // Structured health indicator for the overall service.
  HealthStatus health = 2;

  // Status of each dependency checked during the readiness evaluation.
  repeated DependencyStatus dependencies = 3;
}

// DependencyStatus reports the health of a single service dependency.
message DependencyStatus {
  // Name of the dependency (e.g. "postgres", "s3", "redis").
  string name = 1;

  // Health status of the dependency.
  HealthStatus health = 2;

  // Human-readable message with additional detail (e.g. error description).
  string message = 3;

  // Latency of the health check in milliseconds.
  int64 latency_ms = 4;
}

// ─── Startup ─────────────────────────────────────────────────────────────────

// GetStartupzRequest is an empty request for the startup probe.
message GetStartupzRequest {}

// GetStartupzResponse indicates whether the service has completed startup.
message GetStartupzResponse {
  // Human-readable status description.
  string status = 1;

  // Structured health indicator.
  HealthStatus health = 2;
}

// ─── Info ────────────────────────────────────────────────────────────────────

// GetInfoRequest is an empty request for service information.
message GetInfoRequest {}

// GetInfoResponse contains detailed service, build, and runtime information.
message GetInfoResponse {
  // Service identification.
  ServiceInfo service = 1;

  // Build-time information.
  BuildInfo build = 2;

  // Runtime environment information.
  RuntimeInfo runtime = 3;

  // Deployment environment name (e.g. "production", "staging", "development").
  string environment = 4;
}

// ServiceInfo identifies the service.
message ServiceInfo {
  // Name of the service (e.g. "paladin").
  string name = 1;

  // Semantic version of the service (e.g. "1.2.3").
  string version = 2;
}

// BuildInfo contains build-time metadata.
message BuildInfo {
  // Git commit SHA at build time.
  string commit = 1;

  // Timestamp when the binary was built.
  google.protobuf.Timestamp build_time = 2;
}

// RuntimeInfo contains runtime environment details.
message RuntimeInfo {
  // Go runtime version (e.g. "go1.25.5").
  string go_version = 1;

  // Operating system (e.g. "linux").
  string os = 2;

  // CPU architecture (e.g. "amd64", "arm64").
  string arch = 3;

  // Timestamp when the service process started.
  google.protobuf.Timestamp start_time = 4;

  // Human-readable uptime string (e.g. "2h15m30s").
  string uptime = 5;

  // CPU usage percentage (0-100).
  double cpu_usage_percent = 6;

  // RSS memory usage in bytes.
  uint64 memory_rss_bytes = 7;

  // Heap memory usage in bytes.
  uint64 memory_heap_bytes = 8;

  // Number of active goroutines.
  int32 active_goroutines = 9;
}

// ─── Config ──────────────────────────────────────────────────────────────────

// GetConfigRequest is an empty request for system configuration.
message GetConfigRequest {}

// GetConfigResponse contains the sanitized system configuration.
message GetConfigResponse {
  // Merged and sanitized configuration settings.
  SystemConfig config = 1;
}

// ─── Audit ───────────────────────────────────────────────────────────────────

// ListAuditLogsRequest defines the filter and pagination for system activity.
message ListAuditLogsRequest {
  // Canonical unique identifier for the tenant.
  string tenant_id = 1;

  // Maximum number of logs to return.
  int32 limit = 2;

  // Pagination cursor from a previous response.
  string cursor = 3;

  // Optional filter by log type (e.g. "audit").
  optional string log_type = 4;
}

// ListAuditLogsResponse contains the requested activity logs.
message ListAuditLogsResponse {
  // Paginated list of system activity records.
  repeated AuditLog logs = 1;

  // Cursor for fetching the next page of results.
  string next_cursor = 2;

  // Total count of logs matching the query (if known).
  int64 total_count = 3;
}

// AuditLog represents a single system activity record.
message AuditLog {
  // System-generated unique identifier for the log entry.
  string audit_id = 1;

  // Tenant identifier.
  string tenant_id = 2;

  // Optional request identifier for tracing.
  optional string request_id = 3;

  // Optional trace identifier from distributed tracing.
  optional string trace_id = 13;

  // Optional actor subject (e.g. user email or service name).
  optional string actor_subject = 4;

  // Type of actor (e.g. "user", "service", "system").
  string actor_type = 5;

  // Optional client IP address.
  optional string client_ip = 6;

  // HTTP method or operation name.
  string method = 7;

  // Resource path or target.
  string path = 8;

  // HTTP status code of the response.
  int32 http_status = 9;

  // Optional human-readable response status.
  optional string response_status = 10;

  // Timestamp when the operation occurred.
  google.protobuf.Timestamp created_at = 11;

  // Distinguishes the type of log (e.g. "audit", "app").
  string log_type = 12;
}

// SystemConfig represents the internal operational parameters of the service.
message SystemConfig {
  AppConfig app = 1;
  ServerConfig server = 2;
  DatastoreConfig datastores = 3;
  PolicyConfig policy = 4;
  SecurityConfig security = 5;
  HousekeepingConfig housekeeping = 6;
  RateLimitConfig rate_limit = 7;
  CacheConfig cache = 8;
  TimeoutConfig timeouts = 9;
  IdempotencyConfig idempotency = 10;
  OTelConfig otel = 11;
  bool auth_enabled = 12;
}

message AppConfig {
  string name = 1;
  string env = 2;
}

message ServerConfig {
  string name = 1;
  string mode = 2;
  HttpConfig http = 3;
}

message HttpConfig {
  string addr = 1;
  repeated string cors_allowed_origins = 2;
  string read_timeout = 3;
  string write_timeout = 4;
  string request_id_header = 5;
}

message DatastoreConfig {
  PostgresConfig postgres = 1;
  S3Config s3 = 2;
}

message PostgresConfig {
  string host = 1;
  string port = 2;
  string user = 3;
  string dbname = 4;
  string ssl_mode = 5;
}

message S3Config {
  string bucket = 1;
  string endpoint = 2;
  string public_endpoint = 3;
  bool force_path_style = 4;
  string presign_ttl = 5;
  string part_size = 6;
  string sse_type = 7;
}

message PolicyConfig {
  string max_object_size = 1;
  string max_multipart_size = 2;
  string min_part_size = 3;
  string max_part_size = 4;
  string presign_put_ttl = 5;
  string presign_get_ttl = 6;
  repeated string allowed_content_types = 7;
}

message SecurityConfig {
  bool trust_tenant_id_from_request = 1;
  bool reject_tenant_mismatch = 2;
  bool enable_rls = 3;
}

message HousekeepingConfig {
  bool enable_reaper = 1;
  string pending_ttl = 2;
  string multipart_ttl = 3;
  string gc_interval = 4;
}

message RateLimitConfig {
  float requests_per_second = 1;
  int32 burst = 2;
  int32 max_tenants = 3;
}

message CacheConfig {
  bool enabled = 1;
  int32 max_size = 2;
  string ttl = 3;
}

message TimeoutConfig {
  string fast_operation = 1;
  string default_operation = 2;
  string s3_operation = 3;
  string long_operation = 4;
}

message IdempotencyConfig {
  bool enabled = 1;
  string ttl = 2;
}

message OTelConfig {
  bool enabled = 1;
  string endpoint = 2;
  string protocol = 3;
  bool insecure = 4;
}
