syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/any.proto";

// ─── Object ──────────────────────────────────────────────────────────────────

// Object is the canonical representation of a stored object.
//
// Resource name: object_keys/{object_key}/objects/{object_id}
//   - {object_key} is a tenant-scoped logical namespace, not a physical S3 object_key.
//   - {object_id} is a stable UUIDv7 assigned on upload initiation.
//
// Tenancy: implied by auth context (JWT claim `tenant`). Never accept
// tenant_id in request bodies for object-scoped RPCs.
message Object {
  // Fully-qualified resource name: "object_keys/{object_key}/objects/{object_id}".
  string name = 1;

  // Stable object identifier (UUIDv7). Sortable by creation time.
  string object_id = 2;

  // Logical object_key (namespace) name.
  string object_key = 3;

  // Storage key (path) within the object_key.
  string key = 4;

  // Storage backend ID (FK to storage_backends.id). Surfaced on responses
  // when the server JOINs object_keys; may be empty on bulk list endpoints
  // that prioritise pagination cost over reflection completeness.
  string backend_id = 21;

  // Physical S3 bucket name (FK to buckets.bucket_name). Same caveat as
  // backend_id — populated when the server JOINs object_keys.
  string bucket_name = 22;

  // Lifecycle state.
  ObjectState state = 5;

  // Declared content type. Enforced via Cedar policy at presign time.
  string content_type = 6;

  // Size in bytes as reported by the storage backend on completion.
  // Unset while state is PENDING.
  int64 size_bytes = 7;

  // ETag assigned by the storage backend after upload.
  string etag = 8;

  // Checksum algorithm used.
  ChecksumAlgorithm checksum_algorithm = 9;

  // Base64-encoded checksum digest. Computed by the storage backend.
  string checksum = 10;

  // Opaque monotonic ordering token from the storage backend's event stream.
  // Used to resolve out-of-order event arrival and prevent stale-update races.
  string sequencer = 11;

  // User-defined metadata (x-amz-meta-* equivalents).
  map<string, string> metadata = 12;

  // User-defined tags (S3 Object Tagging equivalents).
  map<string, string> tags = 13;

  // Caller-provided correlation reference for cross-system joins.
  string external_ref = 14;

  // Version for optimistic concurrency control. Returned as HTTP ETag
  // on metadata responses; clients pass back as If-Match for updates.
  string resource_version = 15;

  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;

  // Set only when state == AVAILABLE.
  google.protobuf.Timestamp committed_at = 18;

  // Set only when state == FAILED or DELETED.
  google.protobuf.Timestamp terminated_at = 19;

  // TTL for the presign issued in PENDING state. After this instant the
  // record is reconciled to either AVAILABLE (via HEAD) or FAILED.
  google.protobuf.Timestamp presign_expires_at = 20;
}

// ObjectState is the simplified lifecycle.
//
// UPLOADING is intentionally removed — single-part uploads provide no reliable
// mid-upload signal. Multipart uploads track part-level state separately.
enum ObjectState {
  OBJECT_STATE_UNSPECIFIED = 0;
  // Record created; presign issued; awaiting upload confirmation.
  OBJECT_STATE_PENDING = 1;
  // Upload confirmed via event, CompleteObject RPC, or reconciler.
  OBJECT_STATE_AVAILABLE = 2;
  // Presign expired without upload; marked for GC.
  OBJECT_STATE_FAILED = 3;
  // Soft-deleted; recoverable within retention window.
  OBJECT_STATE_DELETED = 4;
}

// ChecksumAlgorithm specifies the content-integrity algorithm negotiated
// with the storage backend. CRC32C is the preferred default (hardware-accel).
enum ChecksumAlgorithm {
  CHECKSUM_ALGORITHM_UNSPECIFIED = 0;
  CHECKSUM_ALGORITHM_CRC32C = 1;
  CHECKSUM_ALGORITHM_SHA256 = 2;
  CHECKSUM_ALGORITHM_MD5 = 3;
}

// CompletionMode communicates to the client how the object will be
// transitioned from PENDING to AVAILABLE.
//
// Derived server-side from object_key.storage_backend.events configuration.
enum CompletionMode {
  COMPLETION_MODE_UNSPECIFIED = 0;
  // Server derives completion from storage events (S3 notifications).
  // Client MAY call CompleteObject; it's a no-op if the event beat the RPC.
  COMPLETION_MODE_IMPLICIT = 1;
  // Client MUST call CompleteObject. Used for backends without reliable events
  // (on-prem MinIO without notify-target, SeaweedFS, etc.).
  COMPLETION_MODE_EXPLICIT = 2;
}

// ─── Presigned URL ───────────────────────────────────────────────────────────

// PresignedUrl is a time-limited pre-authenticated URL for direct
// client-to-storage operations. Headers are policy-enforced server-side
// (content-length-range, checksum, content-type).
message PresignedUrl {
  string url = 1;
  // HTTP method: PUT for upload, GET for download, POST for presigned POST.
  string method = 2;
  // Headers the client MUST include verbatim.
  map<string, string> required_headers = 3;
  // Policy-enforced constraints (only populated for presigned POST uploads).
  PresignedPostPolicy post_policy = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// PresignedPostPolicy carries the S3 presigned-POST fields the client must
// submit verbatim. Encoded as opaque blobs; clients should treat as bytes.
message PresignedPostPolicy {
  // Form fields to include in the multipart/form-data upload.
  map<string, string> fields = 1;
  // Action URL (object_key endpoint) to POST to.
  string action = 2;
}

// ─── Sorting / pagination ────────────────────────────────────────────────────

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

// ─── ObjectKey ──────────────────────────────────────────────────────────────────

// ObjectKey is a tenant-scoped logical namespace.
//
// Buckets map to prefixes inside a physical storage backend; they are
// NOT provisioned as real S3 object_keys. Creating a object_key is a Postgres
// INSERT, not an IAM/S3 operation.
message ObjectKey {
  // Fully-qualified resource name: "object_keys/{object_key}".
  string name = 1;
  // Human-friendly display label.
  string display_name = 2;
  // Logical name; tenant-unique; matches the S3 key-prefix component.
  // Constraints: [a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?
  string object_key = 3;
  // Storage backend identifier (from server-side config); FK to
  // storage_backends.id.
  string backend_id = 4;
  // Effective completion mode (derived from backend.events config).
  CompletionMode completion_mode = 5;
  ObjectKeyPolicy policy = 6;
  string resource_version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // Physical S3 bucket holding objects for this ObjectKey. References
  // a row in the `buckets` table created via BucketService.CreateBucket.
  string bucket_name = 10;
}

// ObjectKeyPolicy carries object_key-level authorization and lifecycle rules.
//
// Path authorization is expressed as Cedar policies (text blob), compiled
// and cached at load time. Lifecycle rules map to native S3 lifecycle
// configuration on the underlying backend.
message ObjectKeyPolicy {
  // Cedar policy text. Compiled server-side; validated on write.
  string cedar_policy = 1;
  // Object lifecycle rules.
  repeated LifecycleRule lifecycle_rules = 2;
}

message LifecycleRule {
  string id = 1;
  bool enabled = 2;
  // CEL expression evaluated against Object fields; matching objects are
  // subject to this rule's actions. Example: `has(tags.archive) && age(created_at) > duration('720h')`.
  string match = 3;
  oneof action {
    LifecycleTransition transition = 4;
    LifecycleExpiration expiration = 5;
  }
}

message LifecycleTransition {
  google.protobuf.Duration after = 1;
  string storage_class = 2;
}

message LifecycleExpiration {
  google.protobuf.Duration after = 1;
}

// ─── Tenant ──────────────────────────────────────────────────────────────────

message Tenant {
  // Fully-qualified resource name: "tenants/{tenant_id}".
  string name = 1;
  string tenant_id = 2;
  string display_name = 3;
  map<string, string> labels = 4;
  // Cedar policy text inherited by all object_keys in this tenant.
  string inherited_cedar_policy = 5;
  string resource_version = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// ─── Multipart part ──────────────────────────────────────────────────────────

message CompletedPart {
  int32 part_number = 1;
  string etag = 2;
  // Optional part-level checksum, when the object_key uses composite checksums.
  string checksum = 3;
}

message PartInfo {
  int32 part_number = 1;
  int64 size_bytes = 2;
  string etag = 3;
  google.protobuf.Timestamp uploaded_at = 4;
}

// ─── Long-running operation ──────────────────────────────────────────────────

// Operation follows AIP-151. Used for batch and provisioning RPCs that
// cannot complete synchronously.
message Operation {
  // Fully-qualified resource name: "operations/{operation_id}".
  string name = 1;
  // Discriminator for `metadata` and `response` types.
  string type = 2;
  // Machine-readable progress and parameters.
  google.protobuf.Any metadata = 3;
  bool done = 4;
  oneof result {
    // google.rpc.Status on failure; typed response on success.
    google.protobuf.Any response = 5;
  }
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
