syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "paladin/v1/types.proto";

// ObjectService manages the full lifecycle of objects.
//
// Tenancy is implicit from auth context — never provided in requests.
// Objects are addressed by their stable resource name
// "buckets/{bucket}/objects/{object_id}". Path-based lookup is a separate RPC
// (LookupObject) to avoid dual-addressing ambiguity.
//
// Uploads use a capability-driven protocol: the server advertises the
// completion_mode in UploadObjectResponse; the client branches on that field.
service ObjectService {
  // UploadObject initiates an upload. Returns a presigned PUT URL (single)
  // or presigned POST policy (browser-friendly) plus the server-advertised
  // CompletionMode.
  rpc UploadObject(UploadObjectRequest) returns (UploadObjectResponse);

  // UploadSmall streams bytes directly through the control plane to storage.
  // Only valid when total payload < bucket.small_upload_limit_bytes
  // (default 1 MiB). Useful for synchronous write-then-read-immediate use-cases.
  rpc UploadSmall(stream UploadSmallRequest) returns (UploadSmallResponse);

  // DownloadObject returns object metadata plus a presigned GET URL.
  rpc DownloadObject(DownloadObjectRequest) returns (DownloadObjectResponse);

  // GetObject retrieves object metadata only (no presign).
  rpc GetObject(GetObjectRequest) returns (Object);

  // LookupObject resolves a (bucket, key) pair to an Object by name.
  // Separate RPC to keep all other operations single-addressing.
  rpc LookupObject(LookupObjectRequest) returns (Object);

  // UpdateObject partially updates metadata/tags. Supports optimistic
  // concurrency control via resource_version (If-Match).
  rpc UpdateObject(UpdateObjectRequest) returns (Object);

  // CompleteObject is a no-op when bucket uses IMPLICIT completion and the
  // storage event has already arrived. Otherwise, promotes PENDING to AVAILABLE
  // (after HEAD verification). Required for buckets with EXPLICIT completion.
  rpc CompleteObject(CompleteObjectRequest) returns (Object);

  // DeleteObject soft-deletes by default; permanent=true hard-deletes after
  // verifying ACL via Cedar.
  rpc DeleteObject(DeleteObjectRequest) returns (Object);

  // RestoreObject recovers a soft-deleted object within retention.
  rpc RestoreObject(RestoreObjectRequest) returns (Object);

  // CopyObject performs a server-side copy. Returns the new Object.
  rpc CopyObject(CopyObjectRequest) returns (Object);

  // ListObjects returns a paginated, CEL-filtered list. No total_count —
  // count is computed via CountObjects if needed (explicitly expensive).
  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

  // CountObjects returns an approximate count matching a filter.
  // Implementation uses HLL or pg_stat; exact counts require scanning.
  rpc CountObjects(CountObjectsRequest) returns (CountObjectsResponse);
}

// ─── UploadObject ────────────────────────────────────────────────────────────

message UploadObjectRequest {
  // Target bucket.
  string bucket = 1 [(buf.validate.field).string.min_len = 1];

  // Desired storage key. If empty, server generates `<object_id>` under the
  // tenant's default prefix.
  string key = 2;

  // Declared content type. Enforced via Cedar (allow/deny patterns).
  string content_type = 3 [(buf.validate.field).string.min_len = 1];

  // Optional size hint for quota preflight. When provided, Cedar may reject
  // the presign before issuance. Presigned POST policy also enforces
  // content-length-range server-side via S3, so lying about size does not
  // bypass quota — but it may exceed response latency budget.
  int64 size_hint_bytes = 4;

  // Required. Storage backend verifies; clients MUST send the chosen
  // x-amz-checksum-* header with the PUT body.
  ChecksumAlgorithm checksum_algorithm = 5
      [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];

  map<string, string> metadata = 6;
  map<string, string> tags = 7;

  // Caller-provided correlation reference (persisted on Object.external_ref).
  string external_ref = 8;

  // Preferred presign transport. POST enables content-length-range enforcement
  // on the storage backend and is preferred for browser uploads.
  PresignTransport transport = 9;
}

enum PresignTransport {
  PRESIGN_TRANSPORT_UNSPECIFIED = 0;
  PRESIGN_TRANSPORT_PUT = 1;
  PRESIGN_TRANSPORT_POST = 2;
}

message UploadObjectResponse {
  Object object = 1;
  PresignedUrl upload_url = 2;
  // Tells the client whether to call CompleteObject.
  CompletionMode completion_mode = 3;
}

// ─── UploadSmall (streaming) ─────────────────────────────────────────────────

message UploadSmallRequest {
  oneof msg {
    // Must be the first message on the stream.
    UploadSmallInit init = 1;
    // Subsequent messages carry body chunks.
    bytes chunk = 2;
  }
}

message UploadSmallInit {
  string bucket = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2;
  string content_type = 3 [(buf.validate.field).string.min_len = 1];
  ChecksumAlgorithm checksum_algorithm = 4;
  map<string, string> metadata = 5;
  map<string, string> tags = 6;
  string external_ref = 7;
}

message UploadSmallResponse {
  Object object = 1;
}

// ─── DownloadObject ──────────────────────────────────────────────────────────

message DownloadObjectRequest {
  // Resource name: "buckets/{bucket}/objects/{object_id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Duration ttl = 2;
  // Override for Content-Disposition on the download response.
  string content_disposition = 3;
}

message DownloadObjectResponse {
  Object object = 1;
  PresignedUrl download_url = 2;
}

// ─── GetObject / LookupObject ───────────────────────────────────────────────

message GetObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message LookupObjectRequest {
  string bucket = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
}

// ─── UpdateObject ────────────────────────────────────────────────────────────

message UpdateObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // Optimistic concurrency control. Required; server rejects with
  // FailedPrecondition if version mismatches.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];

  // Paths: "metadata", "tags", "content_type", "external_ref".
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];

  map<string, string> metadata = 4;
  map<string, string> tags = 5;
  string content_type = 6;
  string external_ref = 7;
}

// ─── CompleteObject ──────────────────────────────────────────────────────────

message CompleteObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Optional — server HEADs the backend if absent. Present enables fast-path
  // promotion without the round-trip.
  string etag = 2;
  string checksum = 3;
}

// ─── DeleteObject / RestoreObject ────────────────────────────────────────────

message DeleteObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Required for hard-delete only (soft-delete is idempotent by design).
  string resource_version = 2;
  bool permanent = 3;
}

message RestoreObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// ─── CopyObject ──────────────────────────────────────────────────────────────

message CopyObjectRequest {
  string source_name = 1 [(buf.validate.field).string.min_len = 1];
  string destination_bucket = 2 [(buf.validate.field).string.min_len = 1];
  string destination_key = 3 [(buf.validate.field).string.min_len = 1];

  // If set, overrides source metadata. If unset, metadata is carried over.
  optional MetadataOverride metadata_override = 4;
  optional TagsOverride tags_override = 5;
}

message MetadataOverride {
  map<string, string> metadata = 1;
}

message TagsOverride {
  map<string, string> tags = 1;
}

// ─── ListObjects ─────────────────────────────────────────────────────────────

message ListObjectsRequest {
  string bucket = 1 [(buf.validate.field).string.min_len = 1];

  int32 page_size = 2 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];

  // Opaque cursor. Encodes sort state + last-seen keyset.
  string page_token = 3;

  // CEL expression evaluated against the Object schema.
  // Example: `tags["type"] == "invoice" && size_bytes > 1048576 && state == 'AVAILABLE'`.
  // Empty string matches all objects.
  string filter = 4;

  // Sortable fields: "key", "object_id", "size_bytes", "created_at", "updated_at", "committed_at".
  string order_by = 5;
  SortOrder sort_order = 6;
}

message ListObjectsResponse {
  repeated Object objects = 1;
  string next_page_token = 2;
}

message CountObjectsRequest {
  string bucket = 1 [(buf.validate.field).string.min_len = 1];
  string filter = 2;
}

message CountObjectsResponse {
  int64 approximate_count = 1;
  // True if `approximate_count` is an exact value (small result sets).
  bool exact = 2;
}
