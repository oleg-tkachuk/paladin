syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "paladin/v1/types.proto";

// MultipartUploadService manages multipart uploads for large objects.
//
// Multipart flow is inherently explicit — the client orchestrates parts —
// so there is no IMPLICIT mode. CompleteMultipartUpload is always required.
service MultipartUploadService {
  rpc InitiateMultipartUpload(InitiateMultipartUploadRequest) returns (InitiateMultipartUploadResponse);
  rpc PresignPart(PresignPartRequest) returns (PresignPartResponse);
  rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (Object);
  rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (AbortMultipartUploadResponse);
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

message InitiateMultipartUploadRequest {
  string object_key = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2;
  string content_type = 3 [(buf.validate.field).string.min_len = 1];
  // Required for multipart — used to compute part size.
  int64 size_bytes = 4 [(buf.validate.field).int64.gt = 0];
  ChecksumAlgorithm checksum_algorithm = 5
      [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  map<string, string> metadata = 6;
  map<string, string> tags = 7;
  string external_ref = 8;
}

message InitiateMultipartUploadResponse {
  Object object = 1;
  // Multipart session identifier. Opaque to the client.
  string upload_id = 2;
  int64 recommended_part_size = 3;
  int32 total_parts = 4;
}

message PresignPartRequest {
  // Resource name: "object_keys/{object_key}/objects/{object_id}".
  string object_name = 1 [(buf.validate.field).string.min_len = 1];
  string upload_id = 2 [(buf.validate.field).string.min_len = 1];
  int32 part_number = 3 [(buf.validate.field).int32 = {gte: 1, lte: 10000}];
  google.protobuf.Duration ttl = 4;
}

message PresignPartResponse {
  PresignedUrl upload_url = 1;
}

message CompleteMultipartUploadRequest {
  string object_name = 1 [(buf.validate.field).string.min_len = 1];
  string upload_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated CompletedPart parts = 3 [(buf.validate.field).repeated.min_items = 1];
}

message AbortMultipartUploadRequest {
  string object_name = 1 [(buf.validate.field).string.min_len = 1];
  string upload_id = 2 [(buf.validate.field).string.min_len = 1];
}

message AbortMultipartUploadResponse {}

message ListPartsRequest {
  string object_name = 1 [(buf.validate.field).string.min_len = 1];
  string upload_id = 2 [(buf.validate.field).string.min_len = 1];
  int32 page_size = 3;
  string page_token = 4;
}

message ListPartsResponse {
  repeated PartInfo parts = 1;
  string next_page_token = 2;
}
