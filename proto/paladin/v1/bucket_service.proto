syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/v1/types.proto";

// BucketService manages tenant-scoped logical buckets.
//
// Buckets are NOT provisioned as physical S3 buckets — they're Postgres rows
// that map to prefixes inside the tenant's allocation in a shared storage
// backend. Creation is fast (no IAM, no S3 create-bucket) and cheap.
service BucketService {
  rpc CreateBucket(CreateBucketRequest) returns (Bucket);
  rpc GetBucket(GetBucketRequest) returns (Bucket);
  rpc UpdateBucket(UpdateBucketRequest) returns (Bucket);
  rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse);
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse);

  // GetBucketStats returns approximate usage stats (counts, bytes).
  rpc GetBucketStats(GetBucketStatsRequest) returns (BucketStats);
}

message CreateBucketRequest {
  // Tenant-unique logical name.
  string bucket_id = 1 [(buf.validate.field).string = {
    min_len: 3,
    max_len: 63,
    pattern: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?$"
  }];

  string display_name = 2;

  // Storage backend (references server config). If empty, server picks the
  // tenant's default backend.
  string storage_backend = 3;

  BucketPolicy policy = 4;
}

message GetBucketRequest {
  // Resource name: "buckets/{bucket}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  string display_name = 4;
  BucketPolicy policy = 5;
}

message DeleteBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  // If true, deletes even when the bucket contains objects (starts an
  // asynchronous purge Operation). Default is to reject non-empty buckets.
  bool force = 3;
}

message DeleteBucketResponse {
  // Present if force=true and deletion is asynchronous.
  string operation_name = 1;
}

message ListBucketsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 500}];
  string page_token = 2;
  // CEL filter over Bucket fields.
  string filter = 3;
  string order_by = 4;
  SortOrder sort_order = 5;
}

message ListBucketsResponse {
  repeated Bucket buckets = 1;
  string next_page_token = 2;
}

message GetBucketStatsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message BucketStats {
  int64 approximate_object_count = 1;
  int64 approximate_total_bytes = 2;
  // Breakdown by state.
  map<string, int64> object_count_by_state = 3;
}
