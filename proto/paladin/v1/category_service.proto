syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/grpc;grpcapi";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "paladin/v1/types.proto";

// CategoryService manages tenant-scoped object categories for organization and lifecycle rules.
service CategoryService {
  // CreateCategory registers a new category for a tenant.
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse) {
    option (google.api.http) = {
      post: "/v1/tenants/{tenant_id}/categories"
      body: "*"
    };
  }

  // GetCategory retrieves a category by its slug.
  rpc GetCategory(GetCategoryRequest) returns (GetCategoryResponse) {
    option (google.api.http) = {
      get: "/v1/tenants/{tenant_id}/categories/{slug}"
    };
  }

  // UpdateCategory modifies an existing category's name or description.
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse) {
    option (google.api.http) = {
      patch: "/v1/tenants/{tenant_id}/categories/{slug}"
      body: "*"
    };
  }

  // DeleteCategory removes a category. Fails if the category still contains objects.
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse) {
    option (google.api.http) = {
      delete: "/v1/tenants/{tenant_id}/categories/{slug}"
    };
  }

  // ListCategories returns a paginated list of categories for a tenant.
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {
    option (google.api.http) = {
      get: "/v1/tenants/{tenant_id}/categories"
    };
  }

  // GetCategoryStats retrieves usage statistics for a specific category.
  rpc GetCategoryStats(GetCategoryStatsRequest) returns (GetCategoryStatsResponse) {
    option (google.api.http) = {
      get: "/v1/tenants/{tenant_id}/categories/{slug}/stats"
    };
  }
}

// ─── Create ──────────────────────────────────────────────────────────────────

message CreateCategoryRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  
  // Unique slug for the category (e.g. "documents/invoices").
  string slug = 2 [(buf.validate.field).string.min_len = 1];
  
  // Human-readable name.
  string name = 3 [(buf.validate.field).string.min_len = 1];
  
  // Optional detailed description.
  optional string description = 4;
}

message CreateCategoryResponse {
  Category category = 1;
}

// ─── Get ─────────────────────────────────────────────────────────────────────

message GetCategoryRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  string slug = 2 [(buf.validate.field).string.min_len = 1];
}

message GetCategoryResponse {
  Category category = 1;
}

// ─── Update ──────────────────────────────────────────────────────────────────

message UpdateCategoryRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  string slug = 2 [(buf.validate.field).string.min_len = 1];
  
  // Updated human-readable name.
  optional string name = 3;
  
  // Updated detailed description.
  optional string description = 4;
}

message UpdateCategoryResponse {
  Category category = 1;
}

// ─── Delete ──────────────────────────────────────────────────────────────────

message DeleteCategoryRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  string slug = 2 [(buf.validate.field).string.min_len = 1];
}

message DeleteCategoryResponse {}

// ─── List ────────────────────────────────────────────────────────────────────

message ListCategoriesRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  
  int32 page_size = 2;
  string page_token = 3;
  
  CategoryFilter filter = 4;
  
  string order_by = 5;
  SortOrder sort_order = 6;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
  string next_page_token = 2;
  int64 total_count = 3;
}

// ─── Stats ───────────────────────────────────────────────────────────────────

message GetCategoryStatsRequest {
  string tenant_id = 1 [(buf.validate.field).string.uuid = true];
  string slug = 2 [(buf.validate.field).string.min_len = 1];
}

message GetCategoryStatsResponse {
  CategoryStats stats = 1;
}
