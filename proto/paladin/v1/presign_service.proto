syntax = "proto3";

package paladin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/v1;paladinv1";

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "paladin/v1/types.proto";

// PresignService regenerates presigned URLs for existing objects.
//
// Use ObjectService.UploadObject for the initial presign bundled with
// record creation. This service is for regeneration (URL expired, client
// lost original response, resume scenarios).
service PresignService {
  // RegenerateUploadUrl is only valid for objects in PENDING state.
  rpc RegenerateUploadUrl(RegenerateUploadUrlRequest) returns (RegenerateUploadUrlResponse);

  // PresignDownload is a thinner alternative to ObjectService.DownloadObject
  // that returns only the URL (no metadata). Useful for high-throughput
  // read scenarios where the caller already has metadata cached.
  rpc PresignDownload(PresignDownloadRequest) returns (PresignDownloadResponse);
}

message RegenerateUploadUrlRequest {
  // Resource name: "object_keys/{object_key}/objects/{object_id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Duration ttl = 2;
}

message RegenerateUploadUrlResponse {
  PresignedUrl upload_url = 1;
  CompletionMode completion_mode = 2;
}

message PresignDownloadRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Duration ttl = 2;
  string content_disposition = 3;
}

message PresignDownloadResponse {
  PresignedUrl download_url = 1;
}
