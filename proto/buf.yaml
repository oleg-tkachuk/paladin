version: v2
modules:
  - path: .
    name: buf.build/oleg-tkachuk/paladin
deps:
  - buf.build/bufbuild/protovalidate
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
    # v1 follows AIP-131/133: Get/Update/Delete RPCs return the resource
    # directly (e.g. GetObject returns Object, not GetObjectResponse).
    # This is the pattern used by GCP's own published APIs. We accept the
    # tradeoff: no wrapper types means no dedicated spot to add sibling
    # fields on a response — add them to the resource message if needed.
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    # Same tradeoff on the request side: custom-verb RPCs keep descriptive
    # request names (ValidateCELRequest, MCPInspectRequest) rather than the
    # buf-STANDARD ValidateRequest/InspectRequest. Consistent with the two
    # exceptions above; avoids a breaking rename of established messages.
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - FILE
  except:
    # go_package names where this repository's Go stubs are generated, not
    # anything on the wire. Moving the stubs must not read as a contract break.
    - FILE_SAME_GO_PACKAGE
