version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# k8s — the cluster-side half: rolling a deployment, tailing it, looking at what
# is running, installing the chart from disk.
#
#   includes:
#     k8s:
#       taskfile: '{{printf .TASKLIB "k8s"}}'
#       dir: .
#
# Independent of the `release` module and usable without it — a repository that
# only operates a cluster it does not build for needs this one alone. Include
# both when a component does both; they share the same input names.
#
# Every task addresses the Deployment by name directly — `deploy/<name>` — not
# by discovering it through a selector. That name must be exactly
# K8S_DEPLOYMENT_NAME (PROJECT_NAME by default): `helm create`'s own scaffold
# names it `<release>-<chart>` instead (its "fullname" helper), which this
# module will not find. Name the Deployment's `metadata.name` literally
# `{{ .Release.Name }}` — one component, one release, one name — the way this
# library's own demo/ chart does, and skip the fullname helper.
#
# ── Inputs ───────────────────────────────────────────────────────────────────
#   PROJECT_NAME         the label in every log line
#   K8S_NAMESPACE        default "default"
#   K8S_DEPLOYMENT_NAME  default PROJECT_NAME
#   K8S_CONTEXT          pin a cluster                    (default: current)
#   CHART_DIR            for k8s:upgrade  (default ./deploy/chart)
#   VALUES               a values file for k8s:upgrade
#   ROLLOUT_TIMEOUT      how long to wait for a roll      (default 2m)
#   HELM_UPGRADE_FLAGS   extra flags for k8s:upgrade
#
# Nothing here is declared under a bare knob name: a var declared in an included
# file shadows the including file's value of the same name, so every input is
# read as `{{.NAME | default ...}}` and every derived value is prefixed `_`.
# ─────────────────────────────────────────────────────────────────────────────

silent: true

vars:
  _K8S_SVC: '{{.PROJECT_NAME | default "service"}}'
  _K8S_NS: '{{.K8S_NAMESPACE | default "default"}}'
  _K8S_DEPLOY: '{{.K8S_DEPLOYMENT_NAME | default .PROJECT_NAME | default "service"}}'
  _K8S_CHART_DIR: '{{.CHART_DIR | default "./deploy/chart"}}'
  # Empty = whatever kubectl's current-context is. Set it to pin a cluster.
  _K8S_KUBECTL: 'kubectl{{if .K8S_CONTEXT}} --context {{.K8S_CONTEXT}}{{end}}'
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _K8S_RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _K8S_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _K8S_SKIP: '{{if .NO_COLOR}}○{{else}}{{"\x1b[90m○\x1b[0m"}}{{end}}'

tasks:

  restart:
    desc: "Roll the deployment (no-op when the namespace or deployment is absent)"
    # Skipped rather than failed when there is nothing to roll: this task sits
    # in chains that must stay green on a laptop with no cluster running — and
    # it says which of the two happened.
    cmds:
      - task: restart:_skipped
      - task: restart:_do

  restart:_skipped:
    internal: true
    status:
      - "{{._K8S_KUBECTL}} -n {{._K8S_NS}} get deploy/{{._K8S_DEPLOY}} >/dev/null 2>&1"
    cmds:
      - printf '%s\n' "{{._K8S_SKIP}} {{._K8S_SVC}} · k8s · deploy/{{._K8S_DEPLOY}} not found in {{._K8S_NS}} — skipping restart"

  restart:_do:
    internal: true
    status:
      - "! {{._K8S_KUBECTL}} -n {{._K8S_NS}} get deploy/{{._K8S_DEPLOY}} >/dev/null 2>&1"
    cmds:
      - printf '%s\n' "{{._K8S_RUN}} {{._K8S_SVC}} · k8s · roll deploy/{{._K8S_DEPLOY}} in {{._K8S_NS}}"
      - "{{._K8S_KUBECTL}} -n {{._K8S_NS}} rollout restart deploy/{{._K8S_DEPLOY}}"
      - "{{._K8S_KUBECTL}} -n {{._K8S_NS}} rollout status deploy/{{._K8S_DEPLOY}} --timeout={{.ROLLOUT_TIMEOUT | default \"2m\"}}"
      - printf '%s\n' "{{._K8S_OK}} {{._K8S_SVC}} · k8s · rolled {{._K8S_DEPLOY}}"

  upgrade:
    desc: "helm upgrade --install the release from the local chart directory"
    preconditions:
      - sh: command -v helm >/dev/null
        msg: "helm is not installed — https://helm.sh/docs/intro/install/"
    cmds:
      - printf '%s\n' "{{._K8S_RUN}} {{._K8S_SVC}} · k8s · helm upgrade --install {{._K8S_DEPLOY}} ({{._K8S_NS}})"
      - >-
        helm upgrade --install {{._K8S_DEPLOY}} {{._K8S_CHART_DIR}}
        --namespace {{._K8S_NS}} --create-namespace
        {{if .K8S_CONTEXT}}--kube-context {{.K8S_CONTEXT}}{{end}}
        {{if .VALUES}}--values {{.VALUES}}{{end}}
        {{.HELM_UPGRADE_FLAGS | default ""}}
      - printf '%s\n' "{{._K8S_OK}} {{._K8S_SVC}} · k8s · release {{._K8S_DEPLOY}} upgraded"

  uninstall:
    desc: "helm uninstall this component's release — asks first"
    prompt: "Uninstall {{._K8S_DEPLOY}} from {{._K8S_NS}}{{if .K8S_CONTEXT}} on {{.K8S_CONTEXT}}{{end}}? This cannot be undone."
    preconditions:
      - sh: command -v helm >/dev/null
        msg: "helm is not installed — https://helm.sh/docs/intro/install/"
    cmds:
      - printf '%s\n' "{{._K8S_RUN}} {{._K8S_SVC}} · k8s · helm uninstall {{._K8S_DEPLOY}} ({{._K8S_NS}})"
      - >-
        helm uninstall {{._K8S_DEPLOY}}
        --namespace {{._K8S_NS}}
        {{if .K8S_CONTEXT}}--kube-context {{.K8S_CONTEXT}}{{end}}
      - printf '%s\n' "{{._K8S_OK}} {{._K8S_SVC}} · k8s · {{._K8S_DEPLOY}} uninstalled"

  logs:
    desc: "Tail the deployment's logs (Ctrl-C to stop)"
    interactive: true
    cmds:
      - "{{._K8S_KUBECTL}} -n {{._K8S_NS}} logs deploy/{{._K8S_DEPLOY}} -f --tail={{.TAIL | default \"100\"}}"

  status:
    desc: "Show the deployment and its pods"
    # The pod list reads its selector from the Deployment itself rather than
    # guessing a label convention (app.kubernetes.io/instance, /name, or
    # something a chart invented) — whatever spec.selector.matchLabels says,
    # because that is what actually decides which pods belong to it. Immune
    # to what a consumer's chart happens to label things, by construction
    # rather than by convention.
    cmds:
      - "{{._K8S_KUBECTL}} -n {{._K8S_NS}} get deploy/{{._K8S_DEPLOY}} -o wide"
      - cmd: |-
          set -eu
          sel=$({{._K8S_KUBECTL}} -n {{._K8S_NS}} get deploy/{{._K8S_DEPLOY}} -o go-template='{{"{{"}}range $k,$v := .spec.selector.matchLabels{{"}}"}}{{"{{"}}$k{{"}}"}}={{"{{"}}$v{{"}}"}},{{"{{"}}end{{"}}"}}' | sed 's/,$//')
          {{._K8S_KUBECTL}} -n {{._K8S_NS}} get pods -l "$sel" -o wide

  port-forward:
    desc: "Port-forward the deployment (PORT local, TARGET_PORT in the pod)"
    interactive: true
    vars:
      PORT: '{{.PORT | default "8080"}}'
      # Defaults to PORT (already resolved above, never empty by the time
      # this reads it), so a service listening on the same number needs no
      # second knob; TEI-style containers on :80 set TARGET_PORT.
      TARGET: '{{.TARGET_PORT | default .PORT}}'
    cmds:
      - printf '%s\n' "{{._K8S_RUN}} {{._K8S_SVC}} · k8s · localhost:{{.PORT}} → deploy/{{._K8S_DEPLOY}}:{{.TARGET}}"
      - "{{._K8S_KUBECTL}} -n {{._K8S_NS}} port-forward deploy/{{._K8S_DEPLOY}} {{.PORT}}:{{.TARGET}}"
