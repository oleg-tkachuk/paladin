version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# release — everything between a commit and an artifact in a registry: the
# version this tree publishes as, the container image, the Helm chart, and the
# one task that does all three in the right order.
#
# Nothing here talks to a cluster. A repository that only publishes — CI with
# no kubeconfig anywhere near it — needs this module and not the k8s one.
#
# The cluster-side half is a separate module, `k8s`, included separately by the
# consumer. It has to be the consumer that includes it: a module that includes
# its own parts hands them the LIBRARY's working directory rather than the
# consumer's, and every relative path in them resolves in the wrong tree.
#
#   includes:
#     release:
#       taskfile: '{{printf .TASKLIB "release"}}'
#       dir: .
#
# `dir: .` is required — it pins every command to the INCLUDING component's
# directory, so CHART_DIR / DOCKERFILE / INFO_ENV_FILE stay relative to it.
#
# ── Inputs ───────────────────────────────────────────────────────────────────
# Pass these at the include's own `vars:`, not the consumer's top-level
# `vars:`. In a repository with more than one component the top level is
# shared with every other component — see README.md#variable-scoping.
# Only PROJECT_NAME is required.
#
#   PROJECT_NAME         image + chart name, and the label in every log line
#   CHART_NAME           chart name when it differs from PROJECT_NAME
#   IMAGE_NAME           image name when it differs from PROJECT_NAME
#   REGISTRY             OCI host                     (default localhost:5000)
#   GLOBAL_REGISTRY      monorepo-wide override, wins over REGISTRY
#   IMAGE_NAMESPACE      path between host and name     (default none)
#   DOCKERFILE           default ./Dockerfile
#   DOCKER_CONTEXT       default .
#   DOCKER_BUILD_FLAGS   verbatim extra buildx flags    (default none)
#
# `image:build` writes to whatever Docker daemon the host talks to. Getting
# that image into a local cluster is the `runtime/*` modules' job — they differ
# per runtime, and only some of them have anything to do.
#   CHART_DIR            default ./deploy/chart
#   CHART_APP_VERSION    appVersion when the image is upstream's, not ours
#   CHART_MIN_RESOURCES  render-gate floor              (default 1)
#   K8S_VERSION          schema version chart:validate checks against
#   KUBECONFORM_FLAGS    extra kubeconform flags
#   HELM_FLAGS           extra flags for every helm registry call
#   HELM_LINT_FLAGS      extra flags for `helm lint`
#   HELM_TEMPLATE_FLAGS  extra flags for `helm template`
#   HELM_PACKAGE_FLAGS   extra flags for `helm package`
#   K8S_NAMESPACE        namespace the chart renders against (default "default")
#   INFO_ENV_FILE        default ./deploy/info.env
#   VERSION_BASE         base for untagged builds  (default: latest version
#                        tag one patch up, or 0.1.0 when there is none)
#   IMAGE_LATEST     set to 1 to also push a floating :latest beside the
#                    version tag. Off by default — see the note below.
#   VERSION_TAG_EXCLUDE  tag glob to keep out of the version (e.g. "api/*")
#   APP_VERSION          pin the version outright, skipping git derivation
#
# Nothing here is defined as a bare knob name: a var declared in an included
# file SHADOWS the including file's value of the same name, so every input is
# read through `{{.NAME | default ...}}` and every derived value is prefixed `_`.
#
# The *_FLAGS inputs are shell by contract: spliced in verbatim and word-split.
# Every other value goes through `q` where it reaches a shell.
#
# Exported: the derived values another module reads, because it acts on what
# this one published — cosign signs it, runtime/* loads and installs it. A
# rename of one of these breaks those modules, so check:vars refuses a read of
# any other.
# ─────────────────────────────────────────────────────────────────────────────
# exports: _REL_VERSION _REL_IMAGE _REL_DIGEST_FILE
# shell-verbatim: _REL_BUILD_FLAGS DOCKER_BUILD_FLAGS _REL_HELM_FLAGS HELM_FLAGS _REL_HELM_LINT_FLAGS HELM_LINT_FLAGS _REL_HELM_TPL_FLAGS HELM_TEMPLATE_FLAGS _REL_HELM_PKG_FLAGS HELM_PACKAGE_FLAGS _REL_KUBECONFORM_FLAGS KUBECONFORM_FLAGS _REL_TAG_MATCH

silent: true

vars:
  _REL_SVC: '{{.PROJECT_NAME | default "service"}}'
  _REL_CHART: '{{.CHART_NAME | default .PROJECT_NAME | default "service"}}'

  # One knob re-points everything. GLOBAL_REGISTRY (set by a monorepo root)
  # wins over a component's own REGISTRY.
  _REL_REG: '{{.GLOBAL_REGISTRY | default .REGISTRY | default "localhost:5000"}}'
  _REL_NS: '{{if .IMAGE_NAMESPACE}}/{{.IMAGE_NAMESPACE}}{{end}}'
  _REL_IMAGE: '{{._REL_REG}}{{._REL_NS}}/{{.IMAGE_NAME | default .PROJECT_NAME | default "service"}}'
  _REL_CHART_REPO: 'oci://{{._REL_REG}}{{._REL_NS}}/charts'
  # A registry serving a certificate strict oras clients reject — a wildcard
  # that does not cover the apex, say — needs --insecure-skip-tls-verify here.
  _REL_HELM_FLAGS: '{{.HELM_FLAGS | default ""}}'

  _REL_DOCKERFILE: '{{.DOCKERFILE | default "./Dockerfile"}}'
  _REL_CONTEXT: '{{.DOCKER_CONTEXT | default "."}}'
  _REL_BUILD_FLAGS: '{{.DOCKER_BUILD_FLAGS | default ""}}'
  # A named builder keeps a cache `docker builder prune` does not touch. Unset
  # means the active builder, which is right for anyone who has not named one.
  _REL_BUILDER: '{{.BUILDX_BUILDER | default ""}}'
  _REL_KEEP: '{{.BUILDX_KEEP_STORAGE | default "8GB"}}'

  _REL_CHART_DIR: '{{.CHART_DIR | default "./deploy/chart"}}'
  _REL_MIN_RES: '{{.CHART_MIN_RESOURCES | default "1"}}'
  _REL_RENDER: '{{.RENDER_OUT | default ".task/render.yaml"}}'
  # A `---` glued onto the end of the line above it — see chart:render. A dash
  # before it is not that bug: a PEM block's `-----BEGIN CERTIFICATE-----`
  # ends in five of them, and any chart that renders a certificate has one.
  _REL_GLUED_SEP: '[^[:space:]-]---[[:space:]]*$'

  _REL_K8S_NS: '{{.K8S_NAMESPACE | default "default"}}'

  _REL_INFO_ENV: '{{.INFO_ENV_FILE | default "./deploy/info.env"}}'

  # ─── version derivation ────────────────────────────────────────────────────
  # One scheme for every repo, always SemVer-2 (Helm OCI rejects anything else):
  #
  #   exact tag, clean tree  →  X.Y.Z
  #   otherwise, clean tree  →  <base>-dev.<committer-ts>.g<sha>
  #   dirty tree             →  <base>-dev.<committer-ts>.dirty.<now>.g<sha>
  #
  # where <base> is the last version tag one patch up. After a pre-release tag
  # X.Y.Z-rc.N the base is that tag itself and the dev fields extend its
  # pre-release — X.Y.Z-rc.N.dev.<committer-ts>[.dirty.<now>].g<sha> — so a
  # build sorts between rc.N and rc.N+1, below X.Y.Z; see _REL_AFTER_PRE.
  #
  # The committer timestamp, not `date +%s`: a clean tree then produces the
  # SAME version on every run, which is what lets image:build and chart:push
  # skip work that is already published. A dirty tree is not reproducible by
  # definition, so it takes a wall-clock suffix and always rebuilds.
  #
  # Timestamp first, sha second: SemVer compares pre-release identifiers left
  # to right, so a leading numeric timestamp orders builds chronologically and
  # ArgoCD's `>=0.0.0-0` resolver always lands on the newest push. A sha-first
  # form lets an alphabetically larger sha from an OLDER commit shadow a newer
  # build — that bug has been shipped twice; do not reintroduce it.
  #
  # The dirty marker goes BEFORE the sha, and that position is the whole of it.
  # SemVer says a larger set of pre-release fields outranks a smaller one when
  # the shared prefix is equal (§11.4.4) — so appending `.dirty.<now>` made a
  # dirty build outrank the clean build of the SAME commit, permanently: the
  # clean version is pinned by the committer timestamp and can never grow the
  # extra fields to catch up. Once a dirty image was pushed, committing and
  # rebuilding could not displace it and ArgoCD kept serving the dirty one
  # until the next commit.
  #
  # With the marker in front, field 3 compares `dirty` against `g<sha>` — both
  # alphanumeric, ASCII order, 'd' < 'g' — so the clean build of a commit always
  # wins, while a dirty build still outranks every build of an OLDER commit
  # (field 2, the timestamp, decides first) and two dirty builds still order by
  # their wall clock. Iteration is unchanged; only "I committed and rebuilt" is
  # fixed.
  #
  # The `g` prefix on the sha follows git-describe. Without it an all-digit
  # short sha with a leading zero is an invalid SemVer numeric identifier
  # ("MUST NOT include leading zeroes") and Helm rejects the chart version.
  #
  # Empty when HEAD names no commit — no git history — and that emptiness is
  # what doctor checks. _REL_SHA fills the gap with _REL_NO_SHA so the version
  # stays well-formed; it was the sentinel itself once, and a real commit
  # whose short sha is 00000000 then read as "no git history".
  _REL_SHA_RAW:
    sh: git rev-parse --short=8 HEAD 2>/dev/null || true
  _REL_NO_SHA: '00000000'
  _REL_SHA: '{{._REL_SHA_RAW | default ._REL_NO_SHA}}'
  _REL_CTS:
    sh: git show -s --format=%ct HEAD 2>/dev/null || printf '%s' 0
  # VERSION_TAG_EXCLUDE keeps a tag namespace out of the version: a repo that
  # tags its proto contract `api/vN` must not let those restamp an image, and
  # the `/` in them is invalid in a Docker tag anyway.
  # The `v` comes off in the template, not through `sed`: one process instead
  # of two, and the rule is legible as data rather than buried in a regex
  # inside a folded scalar.
  # Only a tag that starts with a version is one: `stable` or `latest` on HEAD
  # would otherwise become the version itself, and git picks between two tags
  # on one commit by name, not by which is the release.
  _REL_TAG_MATCH: "--match 'v[0-9]*' --match '[0-9]*'"
  _REL_TAG_RAW:
    sh: >-
      git describe --tags --exact-match {{._REL_TAG_MATCH}}
      {{if .VERSION_TAG_EXCLUDE}}--exclude {{.VERSION_TAG_EXCLUDE | q}}{{end}}
      HEAD 2>/dev/null || true
  _REL_TAG: '{{._REL_TAG_RAW | trimPrefix "v"}}'
  # The base an untagged build counts up from: the newest version tag this
  # commit descends from, one patch up. It was VERSION_BASE alone, 0.1.0 unless
  # someone kept it current, so once 1.2.0 was tagged every later build was
  # 0.1.0-dev… — below the release it followed, and never chosen by a
  # `>=0.0.0-0` resolver. One patch up puts every build after a tag above it,
  # a pre-release tag's included. Tags that do not start with a version are
  # passed over; VERSION_BASE still sets the base outright.
  _REL_LAST_TAG:
    sh: >-
      git describe --tags --abbrev=0 {{._REL_TAG_MATCH}}
      {{if .VERSION_TAG_EXCLUDE}}--exclude {{.VERSION_TAG_EXCLUDE | q}}{{end}}
      HEAD 2>/dev/null || true
  # The last tag's version, pre-release included and build metadata dropped.
  _REL_LAST_VER: '{{regexFind "^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?" (._REL_LAST_TAG | trimPrefix "v")}}'
  _REL_LAST_CORE: '{{regexFind "^[0-9]+\\.[0-9]+\\.[0-9]+" ._REL_LAST_VER}}'
  # Set when the last tag is a pre-release and nothing else names the base.
  #
  # Then the base is that pre-release itself, extended — X.Y.Z-rc.N.dev.… —
  # not one patch up. X.Y.(Z+1)-dev.… sorted above X.Y.Z, the release the
  # candidate was for, so a `>=0.0.0-0` resolver kept serving the dev build
  # after the release shipped. And X.Y.Z-dev.… cannot fix it: `dev` < `rc`, so
  # it sorts below the candidate it follows. Extending the candidate's own
  # pre-release puts a build above rc.N (an equal prefix, more fields —
  # §11.4.4), below rc.N+1 (the numeric field decides first), and below X.Y.Z
  # (any pre-release is). VERSION_TAG_EXCLUDE could not leave a candidate out
  # instead: the same exclusion drops it from the exact match that publishes
  # the candidate itself.
  _REL_AFTER_PRE: '{{if and (not .VERSION_BASE) (ne ._REL_LAST_VER ._REL_LAST_CORE)}}1{{end}}'
  # The base when nothing names one and no version tag precedes this commit.
  _REL_FIRST_BASE: '0.1.0'
  _REL_BASE: >-
    {{- if .VERSION_BASE -}}{{.VERSION_BASE}}
    {{- else if ._REL_AFTER_PRE -}}{{._REL_LAST_VER}}
    {{- else if ._REL_LAST_CORE -}}
    {{- $v := splitList "." ._REL_LAST_CORE -}}
    {{- index $v 0}}.{{index $v 1}}.{{add1 (index $v 2)}}
    {{- else -}}{{._REL_FIRST_BASE}}
    {{- end -}}
  # How the dev fields join the base: a new pre-release after a core, one
  # more field of the existing pre-release after a candidate.
  _REL_DEV: '{{if ._REL_AFTER_PRE}}.dev{{else}}-dev{{end}}'
  _REL_HELM_LINT_FLAGS: '{{.HELM_LINT_FLAGS | default ""}}'
  _REL_HELM_TPL_FLAGS: '{{.HELM_TEMPLATE_FLAGS | default ""}}'
  _REL_HELM_PKG_FLAGS: '{{.HELM_PACKAGE_FLAGS | default ""}}'
  _REL_K8S_VERSION: '{{.K8S_VERSION | default ""}}'
  _REL_KUBECONFORM_FLAGS: '{{.KUBECONFORM_FLAGS | default ""}}'
  _REL_LATEST: '{{.IMAGE_LATEST | default "0"}}'
  _REL_DIRTY:
    sh: git status --porcelain 2>/dev/null | head -c1
  _REL_NOW:
    sh: date +%s
  # Set when this tree is exactly a version tag: the one case git vouches for.
  # _REL_VERSION and _REL_KIND both branch on it, so they cannot disagree.
  _REL_ON_TAG: '{{if and ._REL_TAG (not ._REL_DIRTY)}}1{{end}}'
  _REL_VERSION: >-
    {{- if .APP_VERSION -}}{{.APP_VERSION}}
    {{- else if ._REL_ON_TAG -}}{{._REL_TAG}}
    {{- else -}}
    {{- ._REL_BASE}}{{._REL_DEV}}.{{._REL_CTS}}
    {{- if ._REL_DIRTY}}.dirty.{{._REL_NOW}}{{end}}.g{{._REL_SHA}}
    {{- end -}}
  # What kind of build _REL_VERSION is, one value per branch above, written to
  # the info file as BUILD_KIND. A consumer that tells a dev build by the
  # version's shape breaks whenever the shape changes — `-dev.` became `.dev.`
  # after a pre-release in v13 — so the kind is said outright instead.
  # Pinned is its own kind, not a release: APP_VERSION is the consumer's claim,
  # and a gate that deploys only releases must not take it for git's.
  _REL_KIND_RELEASE: release
  _REL_KIND_DEV: dev
  _REL_KIND_PINNED: pinned
  _REL_KIND: >-
    {{- if .APP_VERSION -}}{{._REL_KIND_PINNED}}
    {{- else if ._REL_ON_TAG -}}{{._REL_KIND_RELEASE}}
    {{- else -}}{{._REL_KIND_DEV}}
    {{- end -}}
  # Where image:push records the digest it pushed, one file per version so a
  # file left by an earlier push is never read for this one. Under .task/,
  # which Task owns and repositories ignore. Exported: cosign signs it.
  _REL_DIGEST_DIR: .task/release
  _REL_DIGEST_FILE: '{{._REL_DIGEST_DIR}}/{{._REL_VERSION}}.digest'
  _REL_BUILD_TIME:
    sh: TZ={{.TIMEZONE | default "UTC" | q}} date +%Y-%m-%dT%H:%M:%S%z
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _REL_RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _REL_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _REL_SKIP: '{{if .NO_COLOR}}○{{else}}{{"\x1b[90m○\x1b[0m"}}{{end}}'
  _REL_WARN: '{{if .NO_COLOR}}▲{{else}}{{"\x1b[33m▲\x1b[0m"}}{{end}}'
  _REL_ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

tasks:

  version:
    desc: "Print the version this working tree publishes as"
    cmds:
      - printf '%s\n' {{._REL_VERSION | q}}

  metadata:
    desc: "Write APP_VERSION / BUILD_KIND / GIT_COMMIT_HASH / BUILD_TIME into the deploy info file"
    aliases: [info]
    cmds:
      - mkdir -p {{dir ._REL_INFO_ENV | q}}
      - >-
        printf 'APP_VERSION=%s\nBUILD_KIND=%s\nGIT_COMMIT_HASH=%s\nBUILD_TIME=%s\n'
        {{._REL_VERSION | q}} {{._REL_KIND | q}} {{._REL_SHA | q}} {{._REL_BUILD_TIME | q}} > {{._REL_INFO_ENV | q}}
      - printf '%s %s · version · %s → %s\n' "{{._REL_RUN}}" {{._REL_SVC | q}} {{._REL_VERSION | q}} {{._REL_INFO_ENV | q}}

  doctor:
    desc: "Check that everything this component declares actually resolves"
    # A report rather than a gate chain: `preconditions` stop at the first
    # failure, and the point here is to see every problem at once, before a
    # deploy spends minutes proving them one at a time.
    #
    # The checks are the mistakes that have actually happened: a Dockerfile
    # named relative to the build context instead of the component, a chart
    # whose Chart.yaml#name does not match what the push looks for, a version
    # that cannot be derived because there is no git history.
    cmds:
      - cmd: |-
          set -u
          fail=0

          svc={{._REL_SVC | q}}
          version={{._REL_VERSION | q}}
          sha_raw={{._REL_SHA_RAW | q}}
          dirty={{._REL_DIRTY | q}}
          chart_dir={{._REL_CHART_DIR | q}}
          chart={{._REL_CHART | q}}
          chart_repo={{._REL_CHART_REPO | q}}
          dockerfile={{._REL_DOCKERFILE | q}}
          dockerfile_set={{.DOCKERFILE | default "" | q}}
          context={{._REL_CONTEXT | q}}
          image={{._REL_IMAGE | q}}
          reg={{._REL_REG | q}}
          build_flags={{._REL_BUILD_FLAGS | q}}

          say() { printf '%s %s · doctor · %s\n' "$1" "$svc" "$2"; }
          bad() { say '{{._REL_ERR}}' "$1" >&2; fail=1; }

          # ─── tools ────────────────────────────────────────────────────────
          # curl answers the registry probe below; without it that probe reads
          # as "registry did not answer", naming the wrong cause.
          for t in git helm curl; do
            command -v "$t" >/dev/null 2>&1 || bad "$t is not installed"
          done

          # ─── version ──────────────────────────────────────────────────────
          if [ -z "$version" ]; then
            bad "no version could be derived — is this a git repository?"
          elif [ -z "$sha_raw" ]; then
            bad "no git history — every build would publish the same version"
          else
            say '{{._REL_OK}}' "version $version"
            # `cond && say ...` would end the script here under Task's errexit
            # shell whenever cond is false, silently truncating the report.
            if [ -n "$dirty" ]; then
              say '{{._REL_WARN}}' "tree is dirty — this version is not reproducible"
            fi
          fi

          # ─── chart ────────────────────────────────────────────────────────
          if [ ! -f "$chart_dir/Chart.yaml" ]; then
            bad "CHART_DIR $chart_dir has no Chart.yaml"
          else
            # `helm package` names the .tgz after Chart.yaml#name, and the push
            # looks for <CHART_NAME>-<version>.tgz. A mismatch is a push that
            # 404s on a file that was never written.
            declared=$(sed -n 's/^name:[[:space:]]*//p' "$chart_dir/Chart.yaml" | head -1 | tr -d '"'"'"'"')
            if [ "$declared" != "$chart" ]; then
              bad "chart name mismatch: Chart.yaml says '$declared', this publishes as '$chart' — set CHART_NAME"
            else
              # The full OCI path, not just the name: two components can carry
              # the same chart name safely, and only the path says whether they
              # actually land on top of each other.
              say '{{._REL_OK}}' "chart $chart_dir → $chart_repo/$chart"
            fi
          fi

          # ─── image ────────────────────────────────────────────────────────
          # A declared DOCKERFILE that is missing is an error; an absent default
          # one only means this component publishes a chart around an upstream
          # image, which is a supported shape.
          if [ -f "$dockerfile" ]; then
            command -v docker >/dev/null 2>&1 || bad "docker is not installed — https://docs.docker.com/get-started/get-docker/"
            [ -d "$context" ] || bad "DOCKER_CONTEXT $context is not a directory"
            say '{{._REL_OK}}' "image $image from $dockerfile (context $context)"

            # `COPY --from=NAME` resolves to a build stage, an earlier stage
            # index, or an external tree passed as `--build-context NAME=path`.
            # When it is none of the three BuildKit reads NAME as an image and
            # pulls docker.io/library/NAME:latest — the failure reads as a
            # registry permission error, which points nowhere near the cause.
            external=$(awk '
              { sub(/^[[:space:]]*#.*/, "") }
              toupper($1) == "FROM" {
                for (i = 2; i < NF; i++)
                  if (toupper($i) == "AS") stage[tolower($(i + 1))] = 1
              }
              match($0, /--from=[A-Za-z0-9_.-]+/) {
                used[tolower(substr($0, RSTART + 7, RLENGTH - 7))] = 1
              }
              END {
                for (n in used)
                  if (!(n in stage) && n !~ /^[0-9]+$/) print n
              }
            ' "$dockerfile")
            for name in $external; do
              case " $build_flags " in
                *" --build-context $name="*|*" --build-context=$name="*)
                  say '{{._REL_OK}}' "build context $name is passed" ;;
                *)
                  bad "COPY --from=$name names no build stage and no build context — BuildKit would pull docker.io/library/$name:latest; add --build-context $name=<path> to DOCKER_BUILD_FLAGS" ;;
              esac
            done
          elif [ -n "$dockerfile_set" ]; then
            bad "DOCKERFILE $dockerfile not found — it is resolved from this directory, not from DOCKER_CONTEXT"
          else
            say '{{._REL_SKIP}}' "no $dockerfile — chart-only, publish with deploy:chart-only"
          fi

          # ─── registry ─────────────────────────────────────────────────────
          # --max-time bounds the check: doctor is a report someone runs while
          # waiting, and an unreachable registry must cost seconds, not a hang.
          # https first, then plain http: a local registry such as the default
          # localhost:5000 speaks only http, and docker pushes to it that way.
          answered=0
          for scheme in https http; do
            code=$(curl -sk --max-time 10 -o /dev/null -w '%{http_code}' "$scheme://$reg/v2/" 2>/dev/null || printf '%s' 000)
            case "$code" in 200|401|403) answered=1; break ;; esac
          done
          if [ "$answered" = 1 ]; then
            say '{{._REL_OK}}' "registry $reg answers"
          else
            say '{{._REL_WARN}}' "registry $reg did not answer over https or http (got $code) — a push would fail"
          fi

          # ─── remote lock ──────────────────────────────────────────────────
          # Task's checksum of each module fetched over git, beside the root
          # Taskfile: the only thing between a moved tag and this build. It
          # protects another checkout only once it is committed, and the usual
          # `.task/` ignore rule throws it away — as does `.task/` followed by
          # `!.task/remote/`, since git re-includes nothing under an excluded
          # directory. No lock is a library included from a checkout: silent.
          lockdir={{.TASK_TEMP_DIR | default ".task" | q}}/remote
          root={{.ROOT_DIR | q}}
          case "$lockdir" in /*) at=$lockdir ;; *) at=$root/$lockdir ;; esac
          lock=$(ls "$at"/*.checksum 2>/dev/null | head -1 || true)
          if [ -n "$lock" ] && git -C "$root" rev-parse --git-dir >/dev/null 2>&1; then
            if git -C "$root" check-ignore -q "$lock"; then
              say '{{._REL_WARN}}' "remote lock $lockdir is ignored by git — ignore .task/* rather than .task/, then add !$lockdir/ and commit it"
            elif ! git -C "$root" ls-files --error-unmatch "$lock" >/dev/null 2>&1; then
              say '{{._REL_WARN}}' "remote lock $lockdir is not committed — commit it, or a moved tag goes unnoticed in every other checkout"
            else
              say '{{._REL_OK}}' "remote lock $lockdir is committed"
            fi
          fi

          if [ "$fail" = 0 ]; then
            say '{{._REL_OK}}' "ready to publish"
          fi
          exit "$fail"

  # ═══ container image ════════════════════════════════════════════════════════

  image:build:
    desc: "Build the component image (skipped when the tree is clean and it is already built)"
    # Resolved once here rather than on each half of the pair: as a dep of both
    # it would run twice and print the version banner twice.
    deps: [metadata]
    # Two complementary status guards: exactly one of the pair runs, so a skip
    # says so out loud instead of leaving a silent gap in the deploy log.
    # The skip notice runs FIRST, on the pristine state: `_do` changes the very
    # condition the pair tests, so asking afterwards reports the work `_do` just
    # did as a reason to skip it.
    cmds:
      - task: image:build:_skipped
      - task: image:build:_do

  image:build:_skipped:
    internal: true
    # One guard, not two: Task ANDs the entries in a `status:` list, and the
    # condition for staying quiet is a disjunction — there is nothing to skip
    # when the tree is dirty OR the image is missing.
    status:
      - test -n {{._REL_DIRTY | q}} || ! docker image inspect {{._REL_IMAGE | q}}:{{._REL_VERSION | q}} >/dev/null 2>&1
    cmds:
      - printf '%s %s · image · %s already built — skipping\n' "{{._REL_SKIP}}" {{._REL_SVC | q}} {{._REL_VERSION | q}}

  image:build:_do:
    internal: true
    # Idempotency: a clean tree yields a deterministic version, so an image
    # already in the local store IS the image this commit builds. A dirty tree
    # never matches — its version carries a fresh timestamp — so local
    # iteration always rebuilds.
    status:
      - test -z {{._REL_DIRTY | q}}
      - docker image inspect {{._REL_IMAGE | q}}:{{._REL_VERSION | q}} >/dev/null 2>&1
    preconditions:
      - sh: command -v docker >/dev/null
        msg: "docker is not installed — https://docs.docker.com/get-started/get-docker/"
      - sh: test -f {{._REL_DOCKERFILE | q}}
        msg: |-
          {{._REL_DOCKERFILE}} not found.
          DOCKERFILE is resolved from the component directory, not from
          DOCKER_CONTEXT — `docker build --file` reads it relative to the
          working directory. A component that builds from the repo root still
          names its own Dockerfile: DOCKER_CONTEXT ../.., DOCKERFILE ./Dockerfile.
    cmds:
      - printf '%s %s · image · build %s:%s\n' "{{._REL_RUN}}" {{._REL_SVC | q}} {{._REL_IMAGE | q}} {{._REL_VERSION | q}}
      # --load is required under the docker-container buildx driver: without it
      # the result stays in the build cache and the next push fails with "tag
      # does not exist". Harmless no-op under the plain docker driver.
      - >-
        docker buildx build --load
        --file {{._REL_DOCKERFILE | q}}
        --tag {{._REL_IMAGE | q}}:{{._REL_VERSION | q}}
        --build-arg APP_VERSION={{._REL_VERSION | q}}
        --build-arg GIT_COMMIT_HASH={{._REL_SHA | q}}
        --build-arg BUILD_TIME={{._REL_BUILD_TIME | q}}
        {{._REL_BUILD_FLAGS}} {{._REL_CONTEXT | q}}
      - printf '%s %s · image · built %s\n' "{{._REL_OK}}" {{._REL_SVC | q}} {{._REL_VERSION | q}}

  image:push:
    desc: "Push the component image to the registry"
    deps: [image:build]
    preconditions:
      # 0 or 1 and nothing else: anything but 0 used to push :latest, so
      # IMAGE_LATEST=false published the floating tag it meant to keep back.
      - sh: '{{if or (eq ._REL_LATEST "0") (eq ._REL_LATEST "1")}}true{{else}}false{{end}}'
        msg: "IMAGE_LATEST is {{._REL_LATEST}} — set it to 1 to push :latest, or 0 (the default) not to"
      - sh: docker image inspect {{._REL_IMAGE | q}}:{{._REL_VERSION | q}} >/dev/null 2>&1
        msg: "{{._REL_IMAGE}}:{{._REL_VERSION}} is not in the local image store — run image:build first"
    cmds:
      - printf '%s %s · image · push %s:%s\n' "{{._REL_RUN}}" {{._REL_SVC | q}} {{._REL_IMAGE | q}} {{._REL_VERSION | q}}
      - docker push {{._REL_IMAGE | q}}:{{._REL_VERSION | q}}
      # The digest that push sent, for cosign to sign and verify instead of the
      # tag, which can be moved between the push and the signature. Read from
      # docker's own record of the push, not the registry: asking the registry
      # what the tag points at now is the same race. A module var cannot carry
      # it — vars are fixed when the include loads, before this push — so it
      # goes to a file per version, whose path is exported.
      #
      # One repo digest per repository the image was pushed to; this one's is
      # the line naming it. Docker Hub names are recorded without docker.io/
      # and library/, so those are matched too.
      - cmd: |-
          set -eu
          image={{._REL_IMAGE | q}}
          short=${image#docker.io/}; short=${short#index.docker.io/}; short=${short#library/}
          digest=$(docker image inspect "$image:"{{._REL_VERSION | q}} --format '{{"{{"}}range .RepoDigests{{"}}"}}{{"{{"}}println .{{"}}"}}{{"{{"}}end{{"}}"}}' \
            | awk -v a="$image@" -v b="$short@" 'index($0, a) == 1 || index($0, b) == 1 { print; exit }')
          if [ -z "$digest" ]; then
            printf '%s %s · image · pushed, but docker recorded no digest for %s\n' "{{._REL_ERR}}" {{._REL_SVC | q}} "$image" >&2
            exit 1
          fi
          out={{._REL_DIGEST_FILE | q}}
          mkdir -p "$(dirname "$out")"
          tmp=$(mktemp "$out.XXXXXX")
          printf '%s\n' "$digest" > "$tmp"
          mv "$tmp" "$out"
      - printf '%s %s · image · pushed %s\n' "{{._REL_OK}}" {{._REL_SVC | q}} {{._REL_VERSION | q}}
      # A floating tag, only when a repository asks for one. It is off by
      # default because :latest makes a deployment unreproducible — what it
      # resolved to yesterday is gone — and because the charts here read their
      # tag from appVersion, so nothing in this library needs it. Repositories
      # whose consumers pull by name still do.
      - if: '{{eq ._REL_LATEST "1"}}'
        cmd: |-
          set -eu
          docker tag {{._REL_IMAGE | q}}:{{._REL_VERSION | q}} {{._REL_IMAGE | q}}:latest
          docker push {{._REL_IMAGE | q}}:latest
          printf '%s %s · image · pushed latest → %s\n' "{{._REL_OK}}" {{._REL_SVC | q}} {{._REL_VERSION | q}}

  image:gc:
    desc: "Trim the BuildKit cache to the keep floor and drop dangling images"
    cmds:
      # --keep-storage only reclaims ABOVE the floor, so the working set
      # survives; this just stops per-session growth from filling the disk.
      # Falls back to the active builder when the named one is not there. When
      # neither prune runs — no daemon, a flag buildx no longer takes — that is
      # said and fails: an unconditional success line hid it while the disk
      # kept filling.
      - cmd: |-
          if ! docker buildx prune {{if ._REL_BUILDER}}--builder {{._REL_BUILDER | q}} {{end}}--keep-storage={{._REL_KEEP | q}} -f >/dev/null 2>&1 \
             && ! docker buildx prune --keep-storage={{._REL_KEEP | q}} -f >/dev/null 2>&1; then
            printf '%s %s · image · could not prune the build cache — run `docker buildx prune --keep-storage=%s` to see why\n' "{{._REL_ERR}}" {{._REL_SVC | q}} {{._REL_KEEP | q}} >&2
            exit 1
          fi
      - docker image prune -f >/dev/null 2>&1
      - printf '%s %s · image · build cache trimmed to %s\n' "{{._REL_OK}}" {{._REL_SVC | q}} {{._REL_KEEP | q}}

  # ═══ helm chart ═════════════════════════════════════════════════════════════

  chart:verify:
    desc: "Lint the chart and render it through the multi-doc separator gate"
    cmds:
      - task: chart:lint
      - task: chart:render

  chart:lint:
    desc: "helm lint the chart"
    preconditions:
      - sh: command -v helm >/dev/null
        msg: "helm is not installed — https://helm.sh/docs/intro/install/"
      - sh: test -f {{._REL_CHART_DIR | q}}/Chart.yaml
        msg: "{{._REL_CHART_DIR}}/Chart.yaml not found — set CHART_DIR"
    cmds:
      - helm lint {{._REL_HELM_LINT_FLAGS}} {{._REL_CHART_DIR | q}}

  chart:render:
    desc: "Render the chart and fail on glued separators, unparseable YAML, or a resource drop"
    # Why this gate exists: a range block that strips the newline before a
    # `---` glues the separator onto the previous line
    # (`automountServiceAccountToken: true---`). Every YAML parser then reads
    # the stream as one garbage document and silently drops every resource
    # after the first — a chart shipped 1 of N Deployments and the cluster ran
    # wedged for hours before anyone found it. Seconds to check, hours to find.
    deps: [chart:render:_write]
    preconditions:
      - sh: '! grep -qE -- {{._REL_GLUED_SEP | q}} {{._REL_RENDER | q}}'
        msg: |-
          broken multi-doc YAML separator in the rendered chart.
          A `---` is glued to the end of the previous line, so kubectl and ArgoCD
          drop every resource after the first one.
          Fix: leave a literal blank line before `---` in the offending template
          and drop the trailing whitespace-strip on the line above it.
          Offenders: grep -nE {{._REL_GLUED_SEP | q}} {{._REL_RENDER}}
      - sh: test "$(grep -c '^kind:' {{._REL_RENDER | q}})" -ge {{._REL_MIN_RES | q}}
        msg: |-
          the chart rendered fewer than {{._REL_MIN_RES}} resources.
          That is the signature of documents being dropped by a separator bug
          the pattern check did not catch. Inspect {{._REL_RENDER}}.
    cmds:
      # yq is optional: the separator gate above already catches the bug this
      # file was written for, and a missing tool should not turn a checkout red.
      # `&&/||` would let a yq PARSE FAILURE fall through to the `||` branch
      # exactly like a missing binary does — the shell's exit status is the
      # echo's, not yq's — so presence and success are checked separately.
      - cmd: |-
          if command -v yq >/dev/null 2>&1; then
            yq ea '.' {{._REL_RENDER | q}} >/dev/null
          else
            printf '%s %s · chart · yq absent, YAML parse gate skipped\n' "{{._REL_WARN}}" {{._REL_SVC | q}}
          fi
      - printf '%s %s · chart · renders %s resources cleanly\n' "{{._REL_OK}}" {{._REL_SVC | q}} "$(grep -c '^kind:' {{._REL_RENDER | q}})"
      - rm -f {{._REL_RENDER | q}}

  chart:render:_write:
    internal: true
    preconditions:
      - sh: command -v helm >/dev/null
        msg: "helm is not installed — https://helm.sh/docs/intro/install/"
    cmds:
      - mkdir -p {{dir ._REL_RENDER | q}}
      - helm template {{._REL_HELM_TPL_FLAGS}} {{._REL_SVC | q}} {{._REL_CHART_DIR | q}} --namespace {{._REL_K8S_NS | q}} > {{._REL_RENDER | q}}

  chart:validate:
    desc: "Check the rendered manifests against the Kubernetes schemas"
    # helm lint reads the chart, chart:render reads the YAML — neither knows
    # whether the apiVersions exist. A resource on an apiVersion the target
    # cluster dropped renders, parses, lints clean and fails at apply.
    #
    # Missing schemas are NOT ignored by default. `-ignore-missing-schemas`
    # turns an apiVersion the cluster no longer serves into a *skip*, which is
    # the exact case this gate exists for — a chart on apps/v1beta1 renders,
    # lints, and passes while validating nothing. A chart that ships custom
    # resources adds `-ignore-missing-schemas` or `-skip <Kind>` through
    # KUBECONFORM_FLAGS, deliberately and where a reader can see it.
    preconditions:
      - sh: command -v helm >/dev/null
        msg: "helm is not installed — https://helm.sh/docs/intro/install/"
      - sh: command -v kubeconform >/dev/null
        msg: "kubeconform is not installed — https://github.com/yannh/kubeconform#installation"
    cmds:
      # Renders into its own file rather than reusing chart:render's: that one
      # deletes its output when it finishes, and two tasks sharing a path race
      # whenever both are asked for in the same run.
      - cmd: |-
          set -eu
          # A directory, not `mktemp -t ...​.yaml`: BSD mktemp appends its
          # randomness AFTER the template, so the file ends up without a .yaml
          # extension and kubeconform skips it — reporting 0 resources checked
          # and exiting 0. A gate that passes by validating nothing.
          d="$(mktemp -d)"
          trap 'rm -rf "$d"' EXIT
          out="$d/render.yaml"
          svc={{._REL_SVC | q}}
          k8s_version={{._REL_K8S_VERSION | q}}
          helm template {{._REL_HELM_TPL_FLAGS}} "$svc" {{._REL_CHART_DIR | q}} \
            --namespace {{._REL_K8S_NS | q}} > "$out"
          printf '%s %s · chart · kubeconform%s\n' "{{._REL_RUN}}" "$svc" "${k8s_version:+ against k8s $k8s_version}"
          kubeconform -summary \
            {{if ._REL_K8S_VERSION}}-kubernetes-version "$k8s_version" {{end}}{{._REL_KUBECONFORM_FLAGS}} \
            "$out"
          printf '%s %s · chart · manifests match the Kubernetes schemas\n' "{{._REL_OK}}" "$svc"

  chart:package:
    desc: "helm package the chart at the derived version"
    preconditions:
      - sh: test -f {{._REL_CHART_DIR | q}}/Chart.yaml
        msg: "{{._REL_CHART_DIR}}/Chart.yaml not found — set CHART_DIR"
    cmds:
      - >-
        helm package {{._REL_HELM_PKG_FLAGS}} {{._REL_CHART_DIR | q}} --version {{._REL_VERSION | q}}
        --app-version {{.CHART_APP_VERSION | default ._REL_VERSION | q}} >/dev/null
      - printf '%s %s · chart · packaged %s-%s.tgz\n' "{{._REL_RUN}}" {{._REL_SVC | q}} {{._REL_CHART | q}} {{._REL_VERSION | q}}

  chart:push:
    desc: "Package and push the chart (skipped when that version is already published)"
    # The skip notice runs FIRST, on the pristine state: `_do` changes the very
    # condition the pair tests, so asking afterwards reports the work `_do` just
    # did as a reason to skip it.
    cmds:
      - task: chart:push:_skipped
      - task: chart:push:_do

  chart:push:_skipped:
    internal: true
    status:
      - "! helm show chart {{._REL_CHART_REPO | q}}/{{._REL_CHART | q}} --version {{._REL_VERSION | q}} {{._REL_HELM_FLAGS}} >/dev/null 2>&1"
    cmds:
      - printf '%s %s · chart · %s already in the registry — skipping\n' "{{._REL_SKIP}}" {{._REL_SVC | q}} {{._REL_VERSION | q}}

  chart:push:_do:
    internal: true
    # Idempotency: the registry is the source of truth. A version already there
    # is the desired end state, so repeating `task deploy` on an unchanged
    # commit costs one lookup and changes nothing.
    status:
      - helm show chart {{._REL_CHART_REPO | q}}/{{._REL_CHART | q}} --version {{._REL_VERSION | q}} {{._REL_HELM_FLAGS}} >/dev/null 2>&1
    cmds:
      - task: chart:package
      # Runs whether the push succeeds or fails — a stray .tgz in the component
      # directory is how the next `helm package` picks up the wrong file.
      - defer: rm -f {{._REL_CHART | q}}-{{._REL_VERSION | q}}.tgz
      - printf '%s %s · chart · push %s:%s → %s\n' "{{._REL_RUN}}" {{._REL_SVC | q}} {{._REL_CHART | q}} {{._REL_VERSION | q}} {{._REL_CHART_REPO | q}}
      - helm push {{._REL_CHART | q}}-{{._REL_VERSION | q}}.tgz {{._REL_CHART_REPO | q}} {{._REL_HELM_FLAGS}} >/dev/null
      - printf '%s %s · chart · pushed %s\n' "{{._REL_OK}}" {{._REL_SVC | q}} {{._REL_VERSION | q}}

  chart:clean:
    desc: "Remove packaged chart tarballs from the component directory"
    cmds:
      - rm -f {{._REL_CHART | q}}-*.tgz

  # ═══ release ════════════════════════════════════════════════════════════════

  deploy:
    desc: "Verify the chart, then publish image + chart to the registry"
    # Gate first: a chart regression must never reach the registry, and the
    # verify costs seconds against a push that costs minutes.
    cmds:
      - task: chart:verify
      - task: image:push
      - task: chart:push
      - printf '%s %s · deploy · %s → %s\n' "{{._REL_OK}}" {{._REL_SVC | q}} {{._REL_VERSION | q}} {{._REL_REG | q}}

  deploy:chart-only:
    desc: "Publish the chart alone — for components running an upstream image"
    cmds:
      - task: chart:verify
      - task: chart:push
      - printf '%s %s · deploy · chart %s → %s\n' "{{._REL_OK}}" {{._REL_SVC | q}} {{._REL_VERSION | q}} {{._REL_CHART_REPO | q}}
