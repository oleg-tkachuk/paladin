version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# codegen — regenerate what a Go service ships generated, and refuse a tree
# where the committed output no longer matches its source.
#
#   includes:
#     codegen: { taskfile: '{{printf .TASKLIB "codegen"}}', dir: . }
#
# ── Inputs ───────────────────────────────────────────────────────────────────
# Pass these at the include's own `vars:`, not the consumer's top-level
# `vars:`. In a repository with more than one component the top level is
# shared with every other component — see README.md#variable-scoping.
#
#   PROJECT_NAME      label in log lines
#   MOCKERY_CONFIG    default .mockery.yaml
#   MOCKERY_MODULE    default github.com/vektra/mockery/v3
#   BUF_TEMPLATE      list of buf templates, as a YAML list
#                     (default ["buf.gen.yaml"]); a string is refused
#   BUF_INPUT         buf's input, when it is not the working directory
#   PROTO_FORBID      paths that must not exist when the stubs are generated
#   PROTO_PLUGINS     protoc plugins to install from THIS module before buf
#   PROTO_PATH        directories prepended to PATH before buf runs, for a
#                     plugin that arrives from somewhere other than a Go
#                     module — a JS one out of a pnpm tree, say. Evaluated by
#                     the shell, so `$(pnpm -C ../web bin)` works.
#   GENERATE_CMD      what `generate` runs (default `go generate ./...`)
#   BUF_FLAGS         verbatim extra flags for every buf generate
#   BUF_LINT_FLAGS    verbatim extra flags for buf lint
#   BUF_FORMAT_FLAGS  verbatim extra flags for buf format
#   BUF_DEP_FLAGS     verbatim extra flags for buf dep update
#   SQLC_FLAGS        verbatim extra sqlc flags
#   GOIMPORTS_FLAGS   verbatim extra goimports flags
#   CODEGEN_BIN_DIR   where those plugins land            (default ./bin)
#   GENERATED_DIRS    directories to normalise with goimports after generating
#   SQLC_MODULE       run sqlc through `go run <module>` instead of from PATH
#   GO_TOOL_MODFILE   a go.mod whose `tool` directives pin buf, sqlc and
#                     goimports, when they are not in this module's own
#                                                           (default none)
#   MOCKS_PATHSPEC    git pathspec the mock gate watches   (default internal)
#   PROTO_PATHSPEC    git pathspec the proto gate watches, when the `out:`
#                     paths in the templates are not the right answer
#   SQLC_DIR          git pathspec the sqlc gate watches, when the `out:`
#                     paths in sqlc.yaml are not the right answer; one that
#                     names no tracked file is refused
#
# Order is fixed, not configurable: mocks first, so they are written against
# the interfaces the tree already has; buf before the generate step, so the
# protobuf types exist when generate's tools walk the tree; sqlc last, so its
# bindings see any updated proto types.
#
# Three things here are not obvious and each one cost a real debugging session
# somewhere before it was written down.
#
# GOWORK=off, for the whole file. `wire` and other generators run `go` with
# -mod=mod, which the toolchain refuses in workspace mode, and a go.work is the
# normal state of a dev checkout — so generation failed *after* mockery and buf
# had already written their output, which is the confusing part. The drift
# gates need the same setting or they disagree with the generator that produced
# the tree they are checking.
#
# Protoc plugins are installed from this module rather than taken from PATH.
# buf resolves protoc-gen-* through PATH, so whatever a developer last
# installed globally decided the output: committed stubs generated by one
# protoc-gen-go patch release show up as import churn the next time anyone
# regenerates with another. `go install` with no @version pins them to the
# module, so a local run and an image build produce the same bytes.
#
# goimports runs over the generated directories, because a pre-commit hook
# usually runs it too and the two disagree: generators emit one import grouping
# and goimports rewrites it. Left alone, the generator writes one form and the
# hook commits the other, so the drift gate reports files stale on a tree that
# was just generated — the gate failing against its own generator. Normalising
# here is what makes generation idempotent.
#
# buf, sqlc and goimports are each found the same way: the one a `tool`
# directive pins — in this module's go.mod, or in GO_TOOL_MODFILE — and only
# then the one on PATH. A generator a version apart rewrites every file it
# owns, and a goimports a version apart fails the drift gate on a tree that
# was just generated. The go and security modules follow the same rule.
# ─────────────────────────────────────────────────────────────────────────────
# shell-verbatim: _CG_GEN_CMD GENERATE_CMD _CG_BUF_PATH PROTO_PATH _CG_BUF_FLAGS BUF_FLAGS _CG_SQLC_FLAGS SQLC_FLAGS _CG_GOIMPORTS_FLAGS GOIMPORTS_FLAGS _CG_PATHS_Q _CG_TOOLS
# shell-verbatim: _CG_BUF_LINT_FLAGS BUF_LINT_FLAGS _CG_BUF_FMT_FLAGS BUF_FORMAT_FLAGS _CG_BUF_DEP_FLAGS BUF_DEP_FLAGS

silent: true

vars:
  _CG_NAME: '{{.PROJECT_NAME | default "codegen"}}'
  _CG_MOCK_CFG: '{{.MOCKERY_CONFIG | default ".mockery.yaml"}}'
  _CG_MOCK_MOD: '{{.MOCKERY_MODULE | default "github.com/vektra/mockery/v3"}}'
  # A YAML list only, and `ref:` keeps it one. It used to accept a string too
  # and join a slice down to one — which meant every consumer below had to
  # split it back apart, and a template path with a space in it could not be
  # expressed. A string now fails in Task's own `range`, before any
  # precondition here can speak.
  _CG_BUF_TPL:
    ref: 'default (list "buf.gen.yaml") .BUF_TEMPLATE'
  _CG_BUF_PATH: '{{.PROTO_PATH | default ""}}'
  _CG_BUF_IN: '{{.BUF_INPUT | default ""}}'
  _CG_FORBID: '{{.PROTO_FORBID | default ""}}'
  _CG_PLUGINS: '{{.PROTO_PLUGINS | default ""}}'
  _CG_BIN: '{{.CODEGEN_BIN_DIR | default "./bin"}}'
  _CG_DIRS:
    ref: 'default (list) .GENERATED_DIRS'
  _CG_SQLC_MOD: '{{.SQLC_MODULE | default ""}}'
  _CG_MOCK_SPEC: '{{.MOCKS_PATHSPEC | default "internal"}}'
  _CG_SQLC_DIR: '{{.SQLC_DIR | default ""}}'
  _CG_PROTO_SPEC: '{{.PROTO_PATHSPEC | default ""}}'
  _CG_GEN_CMD: '{{.GENERATE_CMD | default "go generate ./..."}}'
  _CG_BUF_FLAGS: '{{.BUF_FLAGS | default ""}}'
  _CG_BUF_LINT_FLAGS: '{{.BUF_LINT_FLAGS | default ""}}'
  _CG_BUF_FMT_FLAGS: '{{.BUF_FORMAT_FLAGS | default ""}}'
  _CG_BUF_DEP_FLAGS: '{{.BUF_DEP_FLAGS | default ""}}'
  # What to say when a tool is neither pinned nor on PATH.
  _CG_BUF_HINT: https://buf.build/docs/installation/
  _CG_SQLC_HINT: https://docs.sqlc.dev/en/latest/overview/install.html, or set SQLC_MODULE to run it through `go run`
  _CG_SQLC_FLAGS: '{{.SQLC_FLAGS | default ""}}'
  _CG_GOIMPORTS_FLAGS: '{{.GOIMPORTS_FLAGS | default ""}}'
  _CG_TOOL_MOD: '{{.GO_TOOL_MODFILE | default ""}}'
  # Where the checks keep the working tree's state from before they
  # regenerate. Under .task/, which Task itself owns and repositories ignore.
  _CG_SNAP_DIR: .task/codegen
  # Prints every `out:` value of the YAML files it reads, unquoted, one per
  # line: where buf's templates and sqlc's config say a generator writes.
  _CG_OUT_AWK: |-
    BEGIN { q = "\047" }
    /^[ \t]*out:[ \t]*/ {
      v = $0
      sub(/^[ \t]*out:[ \t]*/, "", v)
      sub(/[ \t]*#.*$/, "", v)
      sub(/[ \t]+$/, "", v)
      if (v == "") { next }
      if (index(v, "\"") == 1 || index(v, q) == 1) { v = substr(v, 2, length(v) - 2) }
      if (v != "") { print v }
    }
  # The shell every task that calls a tool starts with. have_tool says whether
  # a tool can be run at all; run_tool runs the pinned one, else PATH's;
  # need_tool stops the task, with the hint, when there is neither.
  # A GO_TOOL_MODFILE that is not there is refused here: `go tool -n` fails on
  # it the way it does on a tool nobody pinned, and the run would carry on
  # with whatever PATH holds — the pin gone, and nothing saying so.
  _CG_TOOLS: |-
    go_tool() { go tool{{if ._CG_TOOL_MOD}} -modfile={{._CG_TOOL_MOD | q}}{{end}} "$@"; }
    have_tool() { go_tool -n "$1" >/dev/null 2>&1 || command -v "$1" >/dev/null 2>&1; }
    run_tool() {
      if go_tool -n "$1" >/dev/null 2>&1; then go_tool "$@"; else "$@"; fi
    }
    need_tool() {
      have_tool "$1" && return 0
      printf '%s %s · gen · %s is not installed — %s\n' "{{._CG_ERR}}" {{._CG_NAME | q}} "$1" "$2" >&2
      exit 1
    }
    {{if ._CG_TOOL_MOD}}if [ ! -f {{._CG_TOOL_MOD | q}} ]; then
      printf '%s %s · gen · GO_TOOL_MODFILE names %s, which does not exist\n' "{{._CG_ERR}}" {{._CG_NAME | q}} {{._CG_TOOL_MOD | q}} >&2
      exit 1
    fi{{end}}
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _CG_RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _CG_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _CG_ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'
  _CG_SKIP: '{{if .NO_COLOR}}○{{else}}{{"\x1b[90m○\x1b[0m"}}{{end}}'

env:
  # "auto" hands go an empty GOWORK, which is go's own "find a go.work". An
  # empty input cannot mean that: `default` reads "" as unset and gives "off".
  GOWORK: '{{$w := .GOWORK | default "off"}}{{if ne $w "auto"}}{{$w}}{{end}}'

tasks:

  # A COMPOSITE, named for the work: a fixed, ordered pipeline over sibling
  # tasks that each exist and each run on their own.
  #
  # It was `all` until this module's composite took the verb. `all` is a
  # quantifier, and the naming convention in the README asks for the plain verb
  # for the work — so `all` described how much rather than what, in the one
  # place a consumer looks first.
  #
  # NOT a selector. `regenerate select=<sibling>` would need an enumerable set of
  # interchangeable items, and here the items ARE the tasks: each carries its
  # own description and its own precondition naming the tool it needs, and a
  # selector would hide both from `--list`.
  regenerate:
    desc: "Regenerate everything this component ships generated"
    cmds:
      - printf '%s %s · gen · mocks → proto → generate → sqlc\n' "{{._CG_RUN}}" {{._CG_NAME | q}}
      - task: mocks
      - task: proto
      - task: generate
      - task: sqlc
      - printf '%s %s · gen · regenerated\n' "{{._CG_OK}}" {{._CG_NAME | q}}

  mocks:
    desc: "Regenerate the interface mocks"
    preconditions:
      - sh: test -f {{._CG_MOCK_CFG | q}}
        msg: "{{._CG_MOCK_CFG}} not found — set MOCKERY_CONFIG"
    cmds:
      # `go run` resolves the version from go.mod, so the generator is the one
      # the module pins rather than whatever sits on PATH. A stale mockery
      # rewrites every file in an older template, and a diff that size invites
      # hand-editing one mock instead — which is how an interface method ships
      # with no mock at all.
      - go run {{._CG_MOCK_MOD | q}} --config {{._CG_MOCK_CFG | q}}
      - task: _normalise

  proto:
    desc: "Regenerate the protobuf and RPC stubs"
    preconditions:
      - sh: '{{range $f := ._CG_BUF_TPL}}test -f {{$f | q}} && {{end}}true'
        msg: 'one of {{._CG_BUF_TPL | join ", "}} is missing — check BUF_TEMPLATE'
      # A generator whose output path is relative to the working directory
      # writes a second, complete copy of the stubs when it is invoked from the
      # wrong one. That copy compiles, nothing imports it, and it rots in place.
      # Checked before generating, so it fires whether the stray copy arrived
      # just now or several commits ago — the point is to be loud, which is why
      # this is a tripwire and not a .gitignore entry. One test per path: a
      # single `ls -d` over all of them fails as soon as one is missing, so a
      # stray copy beside an absent path went unreported.
      - sh: '{{range (splitList " " ._CG_FORBID | compact)}}! test -e {{q .}} && {{end}}true'
        msg: |-
          {{._CG_FORBID}} exists — that is a stray second copy of the generated
          stubs, written by running the generator from the wrong directory.
          Nothing imports it and it drifts out of the real tree in silence.
          Remove it and re-run.
    cmds:
      # One buf run per template. A repository that generates a second slice
      # from a different template — a vendored contract, a TypeScript client —
      # lists both here rather than keeping its own copy of this task.
      - for: { var: _CG_BUF_TPL }
        cmd: |-
          set -eu
          {{if ._CG_PLUGINS}}
          export GOBIN="$PWD"/{{._CG_BIN | q}}
          export PATH="$GOBIN:$PATH"
          go install {{range (splitList " " ._CG_PLUGINS | compact)}}{{q .}} {{end}}
          {{end}}
          {{if ._CG_BUF_PATH}}export PATH="{{._CG_BUF_PATH}}:$PATH"{{end}}
          {{._CG_TOOLS}}
          need_tool buf {{._CG_BUF_HINT | q}}
          run_tool buf generate {{._CG_BUF_FLAGS}} {{if ._CG_BUF_IN}}{{._CG_BUF_IN | q}}{{end}} --template {{.ITEM | q}}
      - task: _normalise

  proto:lint:
    desc: "buf lint — the proto sources against the module's lint rules"
    cmds:
      - printf '%s %s · gen · buf lint\n' "{{._CG_RUN}}" {{._CG_NAME | q}}
      - cmd: |-
          {{._CG_TOOLS}}
          need_tool buf {{._CG_BUF_HINT | q}}
          run_tool buf lint {{._CG_BUF_LINT_FLAGS}} {{if ._CG_BUF_IN}}{{._CG_BUF_IN | q}}{{end}}
      - printf '%s %s · gen · proto lint clean\n' "{{._CG_OK}}" {{._CG_NAME | q}}

  proto:fmt:check:
    desc: "Fail if buf format would change any proto file — nothing is rewritten"
    cmds:
      - cmd: |-
          {{._CG_TOOLS}}
          need_tool buf {{._CG_BUF_HINT | q}}
          run_tool buf format --diff --exit-code {{._CG_BUF_FMT_FLAGS}} {{if ._CG_BUF_IN}}{{._CG_BUF_IN | q}}{{end}}
      - printf '%s %s · gen · proto files are buf format clean\n' "{{._CG_OK}}" {{._CG_NAME | q}}

  proto:deps:
    desc: "buf dep update — move buf.lock to the newest dependencies (network; rewrites buf.lock)"
    # Not part of `proto` or `regenerate`: it reaches the network and rewrites
    # a committed file, and generating must do neither.
    cmds:
      - printf '%s %s · gen · buf dep update\n' "{{._CG_RUN}}" {{._CG_NAME | q}}
      - cmd: |-
          {{._CG_TOOLS}}
          need_tool buf {{._CG_BUF_HINT | q}}
          run_tool buf dep update {{._CG_BUF_DEP_FLAGS}} {{if ._CG_BUF_IN}}{{._CG_BUF_IN | q}}{{end}}
      - printf '%s %s · gen · buf.lock updated — review git diff\n' "{{._CG_OK}}" {{._CG_NAME | q}}

  generate:
    desc: "Run this component's generate step (default: `go generate ./...`)"
    cmds:
      - '{{._CG_GEN_CMD}}'
      # Normalised here too, not only after mocks and proto: `wire` and its
      # kind write their output at this step, and a generator that emits one
      # import block where the commit hook writes two leaves the tree dirty on
      # a run that changed nothing.
      - task: _normalise

  sqlc:
    desc: "Regenerate the sqlc bindings"
    vars:
      # Where sqlc writes: the `out:` paths of its config, read as proto:check
      # reads buf's templates. A sqlc.json config is not read, and its output
      # is left as sqlc wrote it.
      _CG_SQLC_OUT:
        sh: awk {{._CG_OUT_AWK | q}} sqlc.yaml sqlc.yml 2>/dev/null | sort -u | tr '\n' ' '
    cmds:
      # SQLC_MODULE first: it names a version outright. Without it, the pinned
      # sqlc, then PATH's.
      - cmd: |-
          {{._CG_TOOLS}}
          {{if ._CG_SQLC_MOD}}go run {{._CG_SQLC_MOD | q}} generate {{._CG_SQLC_FLAGS}}{{else}}need_tool sqlc {{._CG_SQLC_HINT | q}}
          run_tool sqlc generate {{._CG_SQLC_FLAGS}}{{end}}
      # Normalised like every other generator's output (see _normalise): sqlc
      # writes one import block where goimports writes two, so a commit hook
      # running goimports made sqlc:check fail on a tree just generated.
      - cmd: |-
          {{if ._CG_SQLC_OUT}}
          {{._CG_TOOLS}}
          if have_tool goimports; then
            run_tool goimports {{._CG_GOIMPORTS_FLAGS}} -w {{range (splitList " " ._CG_SQLC_OUT | compact)}}{{q .}} {{end}}
          fi
          {{end}}

  check:
    desc: "Fail when any generated output is stale against the working tree"
    cmds:
      - task: mocks:check
      - task: proto:check
      - task: sqlc:check

  mocks:check:
    desc: "Fail when the mocks are stale against the working tree"
    # Against the working tree, not HEAD: regenerating must change nothing.
    # Comparing with HEAD failed every change until it was committed, which
    # left the gate unusable before a commit — the one time it is asked.
    cmds:
      - task: _cg_snapshot
        vars: { PATHS: '{{._CG_MOCK_SPEC}}', OUT: '{{._CG_SNAP_DIR}}/mocks' }
      - task: mocks
      - task: _cg_compare
        vars:
          PATHS: '{{._CG_MOCK_SPEC}}'
          OUT: '{{._CG_SNAP_DIR}}/mocks'
          STALE: "mocks are stale — run the generator"
          FRESH: "mocks match their interfaces"

  sqlc:check:
    desc: "Fail when the sqlc output is stale against the working tree"
    vars:
      # What to watch is what sqlc.yaml already declares as `out:`, as
      # proto:check reads buf's templates: derived, the gate moves with the
      # generator. SQLC_DIR overrides it for a layout the config does not
      # express, or a sqlc.json, which is not read.
      _CG_SQLC_WATCH:
        sh: |-
          spec={{._CG_SQLC_DIR | q}}
          if [ -n "$spec" ]; then printf '%s' "$spec"; exit 0; fi
          awk {{._CG_OUT_AWK | q}} sqlc.yaml sqlc.yml 2>/dev/null | sort -u | tr '\n' ' ' | sed 's/ $//'
    preconditions:
      - sh: test -n {{._CG_SQLC_WATCH | q}}
        msg: "no out: path in sqlc.yaml — set SQLC_DIR to the directory that holds the generated bindings"
    cmds:
      # A pathspec that names no tracked file compares two empty snapshots and
      # reports a clean tree it never looked at — `dir/**/gen` without a
      # trailing `/**` names directories, which hold no file of their own.
      - cmd: |-
          set -eu
          if [ -z "$(git ls-files -- {{range (splitList " " ._CG_SQLC_WATCH | compact)}}{{q .}} {{end}})" ]; then
            printf '%s %s · gen · %s matches no tracked file — this gate checks nothing; set SQLC_DIR\n' "{{._CG_ERR}}" {{._CG_NAME | q}} {{._CG_SQLC_WATCH | q}} >&2
            exit 1
          fi
      - task: _cg_snapshot
        vars: { PATHS: '{{._CG_SQLC_WATCH}}', OUT: '{{._CG_SNAP_DIR}}/sqlc' }
      - task: sqlc
      - task: _cg_compare
        vars:
          PATHS: '{{._CG_SQLC_WATCH}}'
          OUT: '{{._CG_SNAP_DIR}}/sqlc'
          STALE: "sqlc output is stale — run the generator"
          FRESH: "sqlc bindings match their queries"


  proto:check:
    desc: "Fail when the protobuf stubs are stale against the working tree"
    vars:
      # Which directories to watch is not an input: it is what the templates
      # already declare as `out:`. Derived, the gate moves with the generator —
      # a template that gains a plugin or relocates its output cannot leave this
      # watching the old path and calling the tree clean. PROTO_PATHSPEC
      # overrides it for a layout the templates do not express.
      _CG_PROTO_OUT:
        sh: |-
          spec={{._CG_PROTO_SPEC | q}}
          if [ -n "$spec" ]; then printf '%s' "$spec"; exit 0; fi
          awk {{._CG_OUT_AWK | q}} {{range $f := ._CG_BUF_TPL}}{{$f | q}} {{end}} 2>/dev/null | sort -u | tr '\n' ' '
    cmds:
      - task: _cg_snapshot
        vars: { PATHS: '{{._CG_PROTO_OUT}}', OUT: '{{._CG_SNAP_DIR}}/proto' }
      - task: proto
      - cmd: |-
          set -eu
          # Both come from files the gate reads, so they enter the shell once,
          # quoted, and are only ever expanded as variables after that.
          out={{._CG_PROTO_OUT | q}}
          templates={{._CG_BUF_TPL | join ", " | q}}
          # Nothing parsed means the templates are a shape this does not
          # understand. A gate that cannot name what it watches must refuse:
          # passing here would report a clean tree it never looked at.
          if [ -z "$out" ]; then
            printf '%s %s · gen · no out: path in %s — set PROTO_PATHSPEC\n' "{{._CG_ERR}}" {{._CG_NAME | q}} "$templates" >&2
            exit 1
          fi
          watched=''
          for d in {{range (splitList " " ._CG_PROTO_OUT | compact)}}{{q .}} {{end}}; do
            # `out: .` is a real template shape, not a mistake: a plugin that
            # carries the subdirectory in `module=` writes from the component
            # root. Watching the root would call every unrelated change a stale
            # stub, and a gate that cries wolf is one nobody reads — so it asks
            # to be told which directory holds the output.
            case "$d" in
              . | ./)
                printf '%s %s · gen · %s writes to the component root — set PROTO_PATHSPEC to the directory that holds the stubs\n' "{{._CG_ERR}}" {{._CG_NAME | q}} "$templates" >&2
                exit 1
                ;;
            esac
            # A target with nothing committed under it cannot show drift —
            # generated output that is gitignored, or a directory nobody has
            # committed yet. Said out loud rather than counted as clean.
            if [ -z "$(git ls-files -- "$d")" ]; then
              printf '%s %s · gen · %s holds no tracked file — not checked\n' "{{._CG_SKIP}}" {{._CG_NAME | q}} "$d"
            else
              watched="$watched $d"
            fi
          done
          if [ -z "$watched" ]; then
            printf '%s %s · gen · every stub directory is untracked — this gate checks nothing\n' "{{._CG_ERR}}" {{._CG_NAME | q}} >&2
            exit 1
          fi
      # Against the working tree, as mocks:check explains. Additions inside a
      # gitignored target stay invisible, which is what the skip line is for.
      - task: _cg_compare
        vars:
          PATHS: '{{._CG_PROTO_OUT}}'
          OUT: '{{._CG_SNAP_DIR}}/proto'
          STALE: "protobuf stubs are stale — run the generator"
          FRESH: "protobuf stubs match their sources"

  # The state of PATHS in the working tree: every tracked or new, unignored
  # file with its content hash, and the tracked ones that are gone. New files
  # count because a new message or interface generates a new file, and stale
  # output a check misses is the failure it exists to catch.
  _cg_snapshot:
    internal: true
    requires: { vars: [PATHS, OUT] }
    vars:
      # Each pathspec quoted on its own: PATHS can hold several, and one may
      # carry pathspec magic such as `:(glob)internal/**/mocks/**`, whose
      # parenthesis the shell would otherwise read as syntax.
      _CG_PATHS_Q: '{{range (splitList " " .PATHS | compact)}}{{q .}} {{end}}'
    cmds:
      - cmd: |-
          set -eu
          mkdir -p "$(dirname {{.OUT | q}})"
          files={{.OUT | q}}.files
          git ls-files -co --exclude-standard -- {{._CG_PATHS_Q}} | LC_ALL=C sort -u >"$files"
          : >{{.OUT | q}}
          while IFS= read -r f; do
            if [ -e "$f" ]; then
              printf '%s %s\n' "$(git hash-object -- "$f")" "$f"
            else
              printf 'deleted %s\n' "$f"
            fi
          done <"$files" >{{.OUT | q}}
          rm -f "$files"

  # Snapshots PATHS again and fails, naming the files, when regeneration
  # changed anything since _cg_snapshot.
  _cg_compare:
    internal: true
    requires: { vars: [PATHS, OUT, STALE, FRESH] }
    cmds:
      - task: _cg_snapshot
        vars: { PATHS: '{{.PATHS}}', OUT: '{{.OUT}}.after' }
      - cmd: |-
          set -eu
          if ! cmp -s {{.OUT | q}} {{.OUT | q}}.after; then
            printf '%s %s · gen · %s; regenerating changed:\n' "{{._CG_ERR}}" {{._CG_NAME | q}} {{.STALE | q}} >&2
            diff {{.OUT | q}} {{.OUT | q}}.after | sed -n 's/^[<>] [^ ]* //p' | LC_ALL=C sort -u | sed 's/^/    /' >&2
            rm -f {{.OUT | q}} {{.OUT | q}}.after
            exit 1
          fi
          rm -f {{.OUT | q}} {{.OUT | q}}.after
          printf '%s %s · gen · %s\n' "{{._CG_OK}}" {{._CG_NAME | q}} {{.FRESH | q}}

  _normalise:
    internal: true
    # Optional: a component that generates nothing needing import rewriting
    # leaves GENERATED_DIRS unset and this is a no-op. goimports is likewise
    # optional — a checkout without it still generates, it just does not
    # normalise, which the drift gate will then report honestly.
    status:
      - '{{if ._CG_DIRS}}false{{else}}true{{end}}'
    cmds:
      - cmd: |-
          {{._CG_TOOLS}}
          if have_tool goimports; then
            run_tool goimports {{._CG_GOIMPORTS_FLAGS}} -w {{range $d := ._CG_DIRS}}{{$d | q}} {{end}}
          fi
