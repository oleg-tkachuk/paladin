version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/store/postgres/queries"
    schema: "migrations"
    gen:
      go:
        package: "sqlc"
        out: "internal/store/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        query_parameter_limit: 20
