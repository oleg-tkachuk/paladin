version: "3"

# paladin-core — the backend (API, admin and IAM planes).
#
# The release chain and the Go gates come from the shared task library. What
# stays here is what only exists in this tree: the codegen chain, the suites
# that need Docker or a live stack, the seed fixture, and the OrbStack
# no-registry path.

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  # Working on the library itself: point this at a checkout beside the
  # repository instead, keeping the %s:
  #   TASKLIB: '../../taskfiles/%s'
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v15.0.1'
  PROJECT_NAME: paladin-core
  K8S_NAMESPACE: paladin
  # GLOBAL_REGISTRY, IMAGE_NAMESPACE and K8S_CONTEXT are deliberately NOT
  # declared: an entry point starts this Taskfile as a child process and hands
  # the three over in its environment, and a value declared here wins over the
  # environment. Undeclared, they arrive from the entry point (orbstack by
  # default), the command line or the environment; deploy requires the first
  # two, the cluster tasks the third (scripts/taskfile-forwarded-vars.test.sh).
  # Only the product's release/v* tags version this image (ADR-0045): the
  # library reads no other, so the old v* releases, api/*, sdk/* and the
  # retired capability/* never restamp it, and needs no exclude for them.
  VERSION_TAG_PREFIX: 'release/v'
  # The shared buildx builder this repo builds through; its cache is separate
  # from the default builder's and needs pruning by name.
  BUILDX_BUILDER: lean
  # The image needs the sibling Go SDK module, so the build context is the
  # repo root while the chart still packages from this directory. `--file` is
  # resolved from the working directory, not from the context, so the
  # Dockerfile path stays relative to this component.
  DOCKERFILE: ./deploy/Dockerfile
  DOCKER_CONTEXT: ..
  DOCKER_BUILD_FLAGS: --network=host
  # Floor for the chart render gate — it fails when the chart renders fewer
  # resources than this. The library default is 1, which against a chart that
  # renders 25 can only fire once every template has stopped rendering; the
  # gate exists for the case where one silently stops. A floor, not an
  # equality: adding a resource is free, removing one is a deliberate edit
  # here.
  CHART_MIN_RESOURCES: "25"
  # The inputs the chart cannot default (the database), so chart:verify lints
  # and renders the defaults instead of stopping at the missing-database
  # error the chart raises on purpose.
  HELM_LINT_FLAGS: '-f deploy/chart/ci/required-values.yaml'
  HELM_TEMPLATE_FLAGS: '-f deploy/chart/ci/required-values.yaml'
  # The chart runs one Deployment per role, named <PROJECT_NAME>-<role>; there
  # is no Deployment called PROJECT_NAME itself. restart and status act on
  # each of them — a role the chart leaves disabled is skipped as absent — and
  # scripts/backend-roles.test.sh fails when this list and the chart's
  # `deployments` come apart.
  ROLES: [api, iam, session, admin, worker, mcp, dispatcher, ingest]
  # The role `logs` follows when ROLE is not given.
  DEFAULT_LOG_ROLE: api

includes:
  release:   { taskfile: '{{printf .TASKLIB "release"}}', dir: . }
  # uninstall and upgrade are excluded: ArgoCD owns both releases in every
  # cluster this repository targets, so a helm write from here either gets
  # reverted on the next sync or deletes workloads out from under it.
  k8s:
    taskfile: '{{printf .TASKLIB "k8s"}}'
    dir: .
    excludes: [uninstall, upgrade]
  go:    { taskfile: '{{printf .TASKLIB "go"}}', dir: . }
  # OrbStack shares the host's image store, so a build is already visible to
  # the cluster; swap this line for runtime/minikube, runtime/kind, … elsewhere.
  local: { taskfile: '{{printf .TASKLIB "runtime/orbstack"}}', dir: . }
  codegen:
    taskfile: '{{printf .TASKLIB "codegen"}}'
    dir: .
    vars:
      # No proto here: the Go stubs are generated into sdk/go and imported
      # from there.
      # Run sqlc through `go run`, so the version that regenerates is the one
      # go.mod pins rather than whatever is on PATH. The bindings carry their
      # generating version in a banner comment, so a PATH sqlc one minor ahead
      # rewrites all 29 files with nothing but that line changed — and the
      # drift gate below then reports the output as stale when it was fine and
      # the gate itself had just dirtied it.
      SQLC_MODULE: github.com/sqlc-dev/sqlc/cmd/sqlc
      # No SQLC_DIR: the gate diffs the `out:` path it reads from sqlc.yaml, so
      # where sqlc writes and where the gate looks are spelled once.
  # The SeaweedFS filer messages ingest decodes, generated from the subset of
  # upstream's filer.proto kept beside them.
  filerpb:
    taskfile: '{{printf .TASKLIB "codegen"}}'
    dir: internal/eventingest/filerpb
    vars:
      PROJECT_NAME: filerpb
      # Installed from the backend's go.mod, so the generator is the version
      # the generated code is compiled against.
      PROTO_PLUGINS: google.golang.org/protobuf/cmd/protoc-gen-go
      PROTO_PATHSPEC: filer.pb.go
      # Normalised with goimports after generating, as the commit hook formats
      # it: otherwise the committed file and a fresh generate differ in their
      # import grouping and the stub gate fails.
      GENERATED_DIRS: ["."]
  auth:
    taskfile: '{{printf .TASKLIB "auth"}}'
    dir: .
    # Each a default, not a value: include vars take precedence over the
    # command line, so a literal here would ignore `JWT_AUD=… task …`.
    vars:
      JWT_ISS: '{{.JWT_ISS | default "paladin-dev"}}'
      # The admin plane: scripts/dev-bootstrap.sh, the token's one reader,
      # provisions through it. No plane accepts any audience but its own.
      JWT_AUD: '{{.JWT_AUD | default "paladin-admin"}}'
      JWT_TTL_SECONDS: '{{.JWT_TTL_SECONDS | default "6048000"}}'
      # platform.admin in dot form — the hyphen form is a different role
      # and gets no cross-tenant access. The tenant claim is what the
      # per-tenant RPCs read; drop it for a platform-only token.
      JWT_CLAIMS: '{{.JWT_CLAIMS | default `{"roles":["platform.admin"],"tenant":"3a823fd4-0b3d-4ce2-a280-93b8d75cc07b"}`}}'
  test:  { taskfile: tasks/test.task.yaml, dir: . }

tasks:
  default:
    desc: "List every available task"
    cmds:
      - task --list-all

  deploy:
    desc: "Verify the chart, then publish image + chart to the OCI registry"
    requires: { vars: [GLOBAL_REGISTRY, IMAGE_NAMESPACE] }
    cmds:
      - task: release:deploy

  deploy-local:
    desc: "Build and helm-install into the local cluster — no registry"
    requires: { vars: [GLOBAL_REGISTRY, IMAGE_NAMESPACE] }
    cmds:
      - task: release:image:build
      - task: local:install

  build:
    desc: "Compile the binaries into ./bin"
    cmds:
      - task: go:build

  test:
    desc: "Run unit tests"
    cmds:
      - task: go:test

  lint:
    desc: "Run golangci-lint"
    cmds:
      - task: go:lint

  # The library's k8s tasks act on one Deployment, by default PROJECT_NAME,
  # which this chart never renders; a call naming K8S_DEPLOYMENT_NAME points
  # each at a role's Deployment instead.
  restart:
    desc: "Roll every role's deployment in {{.K8S_NAMESPACE}}"
    cmds:
      - for: { var: ROLES }
        task: k8s:restart
        vars: { K8S_DEPLOYMENT_NAME: "{{.PROJECT_NAME}}-{{.ITEM}}" }

  status:
    desc: "Show every role's deployment and its pods"
    cmds:
      - for: { var: ROLES }
        task: k8s:status
        vars: { K8S_DEPLOYMENT_NAME: "{{.PROJECT_NAME}}-{{.ITEM}}" }

  logs:
    desc: "Tail one role's logs (ROLE={{.DEFAULT_LOG_ROLE}} by default)"
    interactive: true
    cmds:
      - task: k8s:logs
        vars: { K8S_DEPLOYMENT_NAME: "{{.PROJECT_NAME}}-{{.ROLE | default .DEFAULT_LOG_ROLE}}" }

  generate:
    desc: "Regenerate mocks, sqlc bindings and the SeaweedFS filer types"
    cmds:
      - task: codegen:mocks
      - task: codegen:sqlc
      - task: filerpb:proto

  # What `generate` writes, checked against the working tree. Not the
  # library's codegen:check: that always runs proto:check, and this
  # component's protobuf stubs live in sdk/go, so it fails on a missing
  # buf.gen.yaml whatever the tree holds.
  generated:check:
    desc: "Fail when the mocks, sqlc bindings or filer types are stale"
    cmds:
      - task: codegen:mocks:check
      - task: codegen:sqlc:check
      - task: filerpb:proto:check

  # ─── seed fixture ───────────────────────────────────────────────────────────
  # Applies (or removes) a fixture against a running cluster: demo (event
  # subscriptions), or load / stress (objects under COLLECTION, an existing
  # collection bound to a bucket, in TENANT, a slug or id). Both directions
  # port-forward the three planes themselves, so neither needs a terminal
  # already holding them open, and sign in as the bootstrap admin with the
  # password the cluster holds for it.
  seed:up:
    desc: "Apply a fixture: FLAVOUR=demo|load|stress (idempotent)"
    cmds:
      - task: _seed
        vars: { ACTION: up, FLAVOUR: '{{.FLAVOUR | default "demo"}}', COUNT: "{{.COUNT}}", TENANT: "{{.TENANT}}", COLLECTION: "{{.COLLECTION}}" }

  seed:down:
    desc: "Remove a fixture: FLAVOUR=demo|load|stress"
    cmds:
      - task: _seed
        vars: { ACTION: down, FLAVOUR: '{{.FLAVOUR | default "demo"}}', TENANT: "{{.TENANT}}", COLLECTION: "{{.COLLECTION}}" }

  _seed:
    internal: true
    requires: { vars: [K8S_CONTEXT] }
    vars:
      # The scheme the planes speak inside the cluster: http unless the
      # release turns internalTLS on, when it is https and the forwarded
      # plane's certificate names its Service, not localhost.
      SEED_SCHEME: '{{.SEED_SCHEME | default "http"}}'
      # The local ports the planes are forwarded to; seed-fixture's flags
      # default to the same, for a run outside this task. Set them when
      # another forward holds one.
      SEED_ADMIN_PORT: '{{.SEED_ADMIN_PORT | default "18090"}}'
      SEED_IAM_PORT: '{{.SEED_IAM_PORT | default "18085"}}'
      SEED_DATA_PORT: '{{.SEED_DATA_PORT | default "18080"}}'
      # The bootstrap admin's Secret, as the chart names it.
      SEED_ADMIN_SECRET: paladin-bootstrap-admin
    cmds:
      - cmd: |-
          set -eu
          ctx='{{.K8S_CONTEXT}}'; ns='{{.K8S_NAMESPACE}}'
          pids=""
          trap 'kill $pids 2>/dev/null || true' EXIT
          # A port another process holds makes port-forward exit at once, and
          # the readiness probe below would then reach that process instead.
          for p in {{.SEED_ADMIN_PORT}} {{.SEED_IAM_PORT}} {{.SEED_DATA_PORT}}; do
            if curl -sk -m 1 -o /dev/null "http://localhost:$p/" 2>/dev/null || curl -sk -m 1 -o /dev/null "https://localhost:$p/" 2>/dev/null; then
              echo "✖ seed · localhost:$p is taken by another process; set SEED_ADMIN_PORT / SEED_IAM_PORT / SEED_DATA_PORT" >&2
              exit 1
            fi
          done
          kubectl --context "$ctx" -n "$ns" port-forward svc/paladin-core-admin {{.SEED_ADMIN_PORT}}:8090 >/dev/null 2>&1 & pids="$pids $!"
          kubectl --context "$ctx" -n "$ns" port-forward svc/paladin-core-iam   {{.SEED_IAM_PORT}}:8085 >/dev/null 2>&1 & pids="$pids $!"
          kubectl --context "$ctx" -n "$ns" port-forward svc/paladin-core-api   {{.SEED_DATA_PORT}}:8080 >/dev/null 2>&1 & pids="$pids $!"
          for p in {{.SEED_ADMIN_PORT}} {{.SEED_IAM_PORT}} {{.SEED_DATA_PORT}}; do
            ok=0
            for _ in $(seq 1 40); do
              curl -sk -m 1 -o /dev/null "{{.SEED_SCHEME}}://localhost:$p/" 2>/dev/null && { ok=1; break; }
              sleep 0.5
            done
            [ "$ok" = 1 ] || { echo "✖ seed · port-forward :$p never answered {{.SEED_SCHEME}} (context=$ctx ns=$ns)" >&2; exit 1; }
          done
          password=$(kubectl --context "$ctx" -n "$ns" get secret {{.SEED_ADMIN_SECRET}} -o jsonpath='{.data.password}' | base64 -d)
          go run ./cmd/seed-fixture {{.ACTION}} \
            --flavour={{.FLAVOUR}} {{if .COUNT}}--count={{.COUNT}}{{end}} \
            {{if .TENANT}}--tenant={{.TENANT | q}}{{end}} {{if .COLLECTION}}--object-key={{.COLLECTION | q}}{{end}} \
            --admin-url={{.SEED_SCHEME}}://localhost:{{.SEED_ADMIN_PORT}} \
            --iam-url={{.SEED_SCHEME}}://localhost:{{.SEED_IAM_PORT}} \
            --data-url={{.SEED_SCHEME}}://localhost:{{.SEED_DATA_PORT}} \
            --password="$password" {{if eq .SEED_SCHEME "https"}}--insecure-tls{{end}}
      - echo "✔ paladin-core · fixture {{.ACTION}} ({{.FLAVOUR}})"
