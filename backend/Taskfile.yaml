version: "3"

# paladin-core — the backend (API, admin and IAM planes).
#
# The release chain and the Go gates come from the shared task library. What
# stays here is what only exists in this tree: the codegen chain, the suites
# that need Docker or a live stack, the seed fixture, and the OrbStack
# no-registry path.

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  # Working on the library itself: point this at a checkout beside the
  # repository instead, keeping the %s:
  #   TASKLIB: '../../taskfiles/%s'
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v11.0.2'
  PROJECT_NAME: paladin-core
  K8S_NAMESPACE: paladin
  # The local OrbStack cluster by default; override to target another.
  K8S_CONTEXT: '{{.K8S_CONTEXT | default "orbstack"}}'
  # GLOBAL_REGISTRY and IMAGE_NAMESPACE are deliberately NOT declared: Task
  # 3.53.1 evaluates an included file's own vars before the include's `vars:`,
  # so a declaration here — even one wrapped in `default` — always wins over
  # what the entry point forwards. Undeclared, they arrive from the entry
  # point, the command line or the environment; deploy requires both.
  # Only v* tags version this image. The others — api/*, sdk/go/*,
  # capability/* — carry a `/` that is invalid in a Docker tag, and one of them
  # landing on a release commit must not restamp the release.
  VERSION_TAG_EXCLUDE: '*/*'
  # The shared buildx builder this repo builds through; its cache is separate
  # from the default builder's and needs pruning by name.
  BUILDX_BUILDER: lean
  # The image needs the sibling capability module, so the build context is the
  # repo root while the chart still packages from this directory. `--file` is
  # resolved from the working directory, not from the context, so the
  # Dockerfile path stays relative to this component.
  DOCKERFILE: ./deploy/Dockerfile
  DOCKER_CONTEXT: ..
  DOCKER_BUILD_FLAGS: --network=host
  # Floor for the chart render gate — it fails when the chart renders fewer
  # resources than this. The library default is 1, which against a chart that
  # renders 25 can only fire once every template has stopped rendering; the
  # gate exists for the case where one silently stops. A floor, not an
  # equality: adding a resource is free, removing one is a deliberate edit
  # here.
  CHART_MIN_RESOURCES: "25"
  # The inputs the chart cannot default (the database), so chart:verify lints
  # and renders the defaults instead of stopping at the missing-database
  # error the chart raises on purpose.
  HELM_LINT_FLAGS: '-f deploy/chart/ci/required-values.yaml'
  HELM_TEMPLATE_FLAGS: '-f deploy/chart/ci/required-values.yaml'

includes:
  release:   { taskfile: '{{printf .TASKLIB "release"}}', dir: . }
  # uninstall and upgrade are excluded: ArgoCD owns both releases in every
  # cluster this repository targets, so a helm write from here either gets
  # reverted on the next sync or deletes workloads out from under it.
  k8s:
    taskfile: '{{printf .TASKLIB "k8s"}}'
    dir: .
    excludes: [uninstall, upgrade]
  go:    { taskfile: '{{printf .TASKLIB "go"}}', dir: . }
  # OrbStack shares the host's image store, so a build is already visible to
  # the cluster; swap this line for runtime/minikube, runtime/kind, … elsewhere.
  local: { taskfile: '{{printf .TASKLIB "runtime/orbstack"}}', dir: . }
  codegen:
    taskfile: '{{printf .TASKLIB "codegen"}}'
    dir: .
    vars:
      # No proto here: the Go stubs are generated into sdk/go and imported
      # from there.
      # Run sqlc through `go run`, so the version that regenerates is the one
      # go.mod pins rather than whatever is on PATH. The bindings carry their
      # generating version in a banner comment, so a PATH sqlc one minor ahead
      # rewrites all 29 files with nothing but that line changed — and the
      # drift gate below then reports the output as stale when it was fine and
      # the gate itself had just dirtied it.
      SQLC_MODULE: github.com/sqlc-dev/sqlc/cmd/sqlc
      # Must match `out:` in sqlc.yaml. sqlc writes there and the gate diffs
      # there; nothing reconciles the two spellings, and a gate pointed at the
      # wrong directory passes by finding nothing.
      SQLC_DIR: internal/store/postgres/sqlc
  auth:
    taskfile: '{{printf .TASKLIB "auth"}}'
    dir: .
    vars:
      JWT_ISS: paladin-dev
      JWT_AUD: paladin-api
      JWT_TTL_SECONDS: "6048000"
      # platform.admin in dot form — the hyphen form is a different role
      # and gets no cross-tenant access. The tenant claim is what the
      # per-tenant RPCs read; drop it for a platform-only token.
      JWT_CLAIMS: '{"roles":["platform.admin"],"tenant":"3a823fd4-0b3d-4ce2-a280-93b8d75cc07b"}'
  test:  { taskfile: tasks/test.task.yaml, dir: . }

tasks:
  default:
    desc: "List every available task"
    cmds:
      - task --list-all

  deploy:
    desc: "Verify the chart, then publish image + chart to the OCI registry"
    requires: { vars: [GLOBAL_REGISTRY, IMAGE_NAMESPACE] }
    cmds:
      - task: release:deploy

  deploy-local:
    desc: "Build and helm-install into the local cluster — no registry"
    requires: { vars: [GLOBAL_REGISTRY, IMAGE_NAMESPACE] }
    cmds:
      - task: release:image:build
      - task: local:install

  build:
    desc: "Compile the binaries into ./bin"
    cmds:
      - task: go:build

  test:
    desc: "Run unit tests"
    cmds:
      - task: go:test

  lint:
    desc: "Run golangci-lint"
    cmds:
      - task: go:lint

  restart:
    desc: "Roll the deployment in {{.K8S_NAMESPACE}}"
    cmds:
      - task: k8s:restart

  generate:
    desc: "Regenerate mocks and sqlc bindings"
    cmds:
      - task: codegen:mocks
      - task: codegen:sqlc

  # ─── seed fixture ───────────────────────────────────────────────────────────
  # Applies (or removes) the demo fixture against a running cluster. Both
  # directions port-forward the three planes themselves, so neither needs a
  # terminal already holding them open.
  seed:up:
    desc: "Apply the demo fixture (idempotent)"
    cmds:
      - task: _seed
        vars: { ACTION: up, FLAVOUR: '{{.FLAVOUR | default "demo"}}', COUNT: "{{.COUNT}}" }

  seed:down:
    desc: "Remove the demo fixture"
    cmds:
      - task: _seed
        vars: { ACTION: down, FLAVOUR: '{{.FLAVOUR | default "demo"}}' }

  _seed:
    internal: true
    cmds:
      - cmd: |-
          set -eu
          ctx='{{.K8S_CONTEXT}}'; ns='{{.K8S_NAMESPACE}}'
          pids=""
          trap 'kill $pids 2>/dev/null || true' EXIT
          kubectl --context "$ctx" -n "$ns" port-forward svc/paladin-core-admin 18090:8090 >/dev/null 2>&1 & pids="$pids $!"
          kubectl --context "$ctx" -n "$ns" port-forward svc/paladin-core-api   18085:8085 >/dev/null 2>&1 & pids="$pids $!"
          kubectl --context "$ctx" -n "$ns" port-forward svc/paladin-core-api   18080:8080 >/dev/null 2>&1 & pids="$pids $!"
          for p in 18090 18085 18080; do
            ok=0
            for _ in $(seq 1 40); do
              curl -sk -m 1 -o /dev/null "https://localhost:$p/" 2>/dev/null && { ok=1; break; }
              sleep 0.5
            done
            [ "$ok" = 1 ] || { echo "✖ seed · port-forward :$p never became ready (context=$ctx ns=$ns)" >&2; exit 1; }
          done
          go run ./cmd/seed-fixture {{.ACTION}} \
            --flavour={{.FLAVOUR}} {{if .COUNT}}--count={{.COUNT}}{{end}} \
            --admin-url=https://localhost:18090 \
            --iam-url=https://localhost:18085 \
            --data-url=https://localhost:18080 \
            --insecure-tls
      - echo "✔ paladin-core · fixture {{.ACTION}} ({{.FLAVOUR}})"
