version: v2
# Go stubs for this module, from the contract at the repository root. Run from
# backend/ (`task codegen:proto` does): `out: .` is relative to the working
# directory, and `module=` strips the module prefix from the path buf appends.
plugins:
  # Local binaries — no BSR remote plugin calls, no rate limits.
  # Requires: protoc-gen-go, protoc-gen-connect-go on PATH.
  - local: protoc-gen-go
    out: .
    opt: module=github.com/oleg-tkachuk/paladin/backend
  - local: protoc-gen-connect-go
    out: .
    opt: module=github.com/oleg-tkachuk/paladin/backend
