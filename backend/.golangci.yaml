version: "2"
run:
  timeout: 5m
  #modules-download-mode: readonly

linters:
  # `standard` = errcheck, govet, ineffassign, staticcheck, unused — the
  # high-value correctness core. We layer on the additions below.
  default: standard
  # Curated additions. This list is intentionally NOT the full golangci set:
  # the pure-style / high-noise linters (nlreturn ~1.5k hits, goconst,
  # predeclared, nestif, dupl, …) are dropped so the gate enforces what
  # catches real bugs / resource leaks rather than reformatting churn.
  #
  # Bug-catcher review (settled — no longer tracked in BACKLOG):
  #   ADOPTED:  errorlint, noctx, gosec (G115 excluded — see settings.gosec),
  #             plus the `standard` core (errcheck/govet/ineffassign/
  #             staticcheck/unused).
  #   REJECTED: nilerr (14 hits, all deliberate fail-open/skip patterns),
  #             contextcheck (9 hits, all the graceful-shutdown detached-ctx
  #             idiom / ctx-less boot I/O), errchkjson (15 hits, app-controlled
  #             marshals that can't fail). Each would mean a pile of //nolint
  #             for zero real bugs — left OFF on purpose; don't re-add without
  #             a new reason.
  enable:
    - asasalint # []any passed to append-like variadics
    - bodyclose # http.Response.Body not closed (leak)
    - dupword # duplicated words in comments/strings
    - durationcheck # time.Duration multiplication mistakes
    - errorlint # == / type-assert on errors + %w wrapping correctness
    - gomoddirectives # go.mod replace/retract hygiene
    - goprintffuncname # printf-like funcs end in "f"
    - gosec # security issues (overflow, taint, hardcoded creds, file inclusion)
    - importas # consistent import aliases
    - makezero # make([]T, len) then append surprises
    - misspell # common misspellings
    - nakedret # naked returns in longer funcs
    - noctx # HTTP requests built without a context
    - nolintlint # well-formed //nolint directives
    - promlinter # prometheus metric naming
    - reassign # reassigning pkg-level vars from other pkgs
    - rowserrcheck # sql.Rows.Err() not checked
    - sqlclosecheck # sql.Rows/Stmt not closed (leak)
    - testifylint # testify usage correctness
    - thelper # test helpers call t.Helper()
    - whitespace # leading/trailing newlines in blocks

  # Explicitly off — high-churn complexity/style metrics we don't gate on.
  # NB: `unused` (a standard linter) is now ON — the dead-code pass it gated
  # on (the non-Tx dispatchEvent twins superseded by the ADR-0003 tx-seam, a
  # retired deliverHTTP wrapper, an unused STS interface, dead test scaffold)
  # landed 2026-06-26.
  disable:
    - cyclop
    - depguard
    - exhaustruct
    - funlen
    - gocognit
    - gocyclo
    - godox
    - ireturn
    - varnamelen
    - wsl
    - wrapcheck

  # v2 nests linter settings under linters.settings (the old top-level
  # `linters-settings` key is silently ignored on v2).
  settings:
    errcheck:
      # Non-actionable errors: writes to buffers/stderr, and Close() on the
      # cleanup path (a Close error is rarely recoverable; resource *leaks* are
      # caught by bodyclose / sqlclosecheck instead).
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        - (io.Closer).Close
    gomoddirectives:
      # The capability module is a NESTED module in THIS repository (repo-root
      # capability/), consumed via a relative replace until it is tagged.
      #
      # The rule exists to stop a developer's machine-local replace reaching
      # main — a path outside the repo that breaks every other checkout. This
      # one always resolves, for everyone, because it ships in the same commit
      # as the directory it points at, and the image build was moved to a
      # repo-root context so the container resolves it too.
      #
      # replace-local (not replace-allow-list) is the knob that governs
      # relative paths; the allow-list only covers non-local replacements.
      # This does widen the rule to any local replace, which is a real cost —
      # accepted because the alternative is disabling gomoddirectives outright.
      # It goes away with the directive itself once the module is tagged
      # (BACKLOG: "Capability module: publish + version policy").
      replace-local: true
    gosec:
      excludes:
        # G115 (int->int32/uint32 narrowing) has no range analysis, so it
        # flags every narrowing conversion. All 26 current hits are pagination
        # totals / counts / lengths bounded by query results or config — zero
        # real overflow risk, and per-site //nolint would be pure noise. The
        # rest of gosec (command injection, file inclusion, weak crypto, …)
        # stays on.
        - G115

  exclusions:
    rules:
      # gosec on test code is noise — tests read fixture paths (G304) and
      # embed throwaway credentials (G101); they're not a runtime attack
      # surface.
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
