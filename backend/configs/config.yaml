# paladin-core — full configuration reference.
#
# Every field the service reads is enumerated below with its default value
# inline, so an operator can scan this file once and know every knob that
# exists. Defaults match those declared in internal/config/schema.cue;
# omitting a field from the YAML is equivalent to setting it to the value
# shown here.
#
# Secrets: any field with a sibling `<field>_secret` resolves the secret
# in-cluster (k8s service-account token must mount; see resolver.go) and
# overrides the inline value. Never check a real secret into git.

# ─── Application identity ───────────────────────────────────────────────────
app:
  name: paladin-core
  env: local                            # local | staging | prod

# ─── Logger (zap) ───────────────────────────────────────────────────────────
logger:
  level: debug                          # debug | info | warn | error | dpanic | panic | fatal
  format: json                          # json | console
  development: true                     # human-readable timestamps + colour in dev
  disable_caller: false                 # drop file:line in log lines
  disable_stacktrace: true              # drop stack traces (recommended for prod)
  sampling:
    enabled: false                      # production: enable to cap log volume
    initial: 100                        # log first N entries per second verbatim
    thereafter: 100                     # then 1 in N until the second rolls
  # logger.fields.{service,env} default from app.name / app.env via CUE.
  # Only declare here when the structured-log dimensions must diverge from
  # the service identity (rarely true).

# ─── OpenTelemetry ──────────────────────────────────────────────────────────
otel:
  enabled: false                        # turn on once a collector is reachable
  endpoint: "otel-collector:4317"       # otlp host:port (grpc) or url (http)
  protocol: http                        # grpc | http
  insecure: true                        # tls=off — dev only
  # otel.resource.{service.name,deployment.environment} default from
  # app.name / app.env via CUE.

# ─── HTTP runtime (shared) ──────────────────────────────────────────────────
# Settings every role inherits regardless of which listener it opens.
# Per-listener addresses + timeouts + TLS live under api / admin /
# worker blocks below.
runtime:
  mode: debug                           # debug | test | release
  shutdown_timeout: 20s
  log_probes: false                     # spam reduction for k8s livenessProbe

# ─── api role: data + iam listeners ─────────────────────────────────────────
# `serve api` opens both audiences in the same process. The defaults
# anchor lives on api.server.data so admin / worker can reuse it via
# YAML merge — every listener shares the same timeout / TLS / proxy
# defaults unless explicitly overridden.
api:
  server:
    data: &http_defaults
      # 8083 on the host: another local service owns 8080. In-cluster the chart
      # pins 8080 (deploy/chart/values.yaml), and compose.yaml does in-container.
      addr: "0.0.0.0:8083"
      read_header_timeout: 5s
      read_timeout: 30s
      write_timeout: 30s
      idle_timeout: 90s
      max_header_bytes: 1048576         # 1 MiB
      max_body_bytes: 10485760          # 10 MiB
      request_id_header: "X-Request-Id"
      real_ip_header: "X-Forwarded-For"
      trusted_proxies: []               # CIDRs whose real_ip_header is believed; [] = the TCP peer is the client
      cors_allowed_origins: []          # Closed: UI proxies via its own BFF
      tls:
        enabled: false
        cert_path: ""
        key_path: ""
        ca_path: ""
        server_name: ""
        insecure_skip_verify: false
    iam:
      <<: *http_defaults
      addr: "0.0.0.0:8085"

# ─── admin role: admin listener ─────────────────────────────────────────────
admin:
  server:
    <<: *http_defaults
    addr: "0.0.0.0:8090"

# ─── Datastores ─────────────────────────────────────────────────────────────
datastores:
  postgres:
    # Runtime DSN — must point at the minimum-privilege role (`paladin_app`).
    # See migrations/011_app_role.sql + docs/db-roles.md for what that role
    # is allowed to do (DML only, no DDL, no role management).
    dsn: "postgres://paladin_app@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=disable"
    password: ""                        # prefer password_secret in non-local
    password_secret:
      name: paladin-postgresql-app-user
      key: password
      namespace: database
    # Separate DDL-capable DSN for schema migrations. In production this
    # MUST differ from `dsn` so the runtime pool can be locked down.
    # Empty falls back to the runtime DSN — fine for dev only.
    migrate_dsn: "postgres://paladin_migrate@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=disable"
    migrate_password: ""
    migrate_password_secret:
      name: paladin-postgresql-migrate-user
      key: password
      namespace: database
    reaper_dsn: ""                      # optional separate role for housekeeping; "" → reuse `dsn`
    # Opt-in read replica (listing / counting / searching objects). Empty
    # dsn derives the CNPG `-ro` service from `dsn`'s `-rw` host.
    replica:
      enabled: false
      dsn: ""
      max_lag: 2s
      lag_check_period: 5s
    pool:
      max_conns: 20
      min_conns: 2
      max_conn_lifetime: 30m
      max_conn_idle_time: 5m
    timeouts:
      connect: 5s
      statement: 30s                    # server-side statement_timeout; 0 = disabled (do not ship)
    healthcheck_period: 30s

# ─── Request limits (single source of truth for refusals) ───────────────────
limits:
  max_object_size: "100MB"              # rejected at presign time
  max_multipart_size: "1TB"             # CompleteMultipart cap
  min_part_size: "5MB"                  # AWS S3 minimum (last part exempt)
  max_part_size: "5GB"
  max_parts: 10000
  allowed_content_types:                # empty list = accept any
    - "image/jpeg"
    - "image/png"
    - "image/heic"
    - "image/heif"
    - "image/tiff"
    - "text/plain"
    - "application/pdf"
    - "application/json"
    - "application/octet-stream"
  presign:
    put_ttl: 15m                        # per-method ttl for PresignPut / UploadObject
    get_ttl: 15m                        # PresignGet / DownloadObject
    part_ttl: 15m                       # PresignPart (multipart)
    default_ttl: 15m                    # fallback when caller passes no ttl
    max_ttl: 168h                       # 7d — upper bound for caller-supplied ttls
    default_max_size: 5368709120        # 5 GiB; POST policy content-length-range cap

# ─── Auth (JWT issuance + verification) ─────────────────────────────────────
# Paladin IAM mints HS256 tokens via Login / RefreshToken and verifies them on
# each plane interceptor. The same `signing_key` is used for both. Three
# audiences are recognised at verify time: paladin-data, paladin-admin, paladin-iam.
auth:
  issuer: "paladin-dev"
  signing_key: "dev-secret-change-me-32-bytes-min"  # must be ≥ 32 bytes
  # signing_key_secret: { name: paladin-iam, key: signing_key }   # set in staging/prod; mutually exclusive with signing_key
  jwks_url: ""                                      # reserved for federated IdP; unused today
  leeway: 30s
  access_token_ttl: 15m
  refresh_token_ttl: 168h               # 7 days
  scoped_token_max_ttl: 24h

# ─── Security ───────────────────────────────────────────────────────────────
security:
  reject_tenant_mismatch: true          # 403 when JWT tenant != header tenant
  # RLS isn't a knob — runtime always installs the BeforeAcquire
  # hook. Migration 023 enables per-table policies unconditionally
  # and paladin_app is NOBYPASSRLS, so disabling the hook would break
  # every write. See internal/config/types.go for the rationale.

# ─── Bootstrap (one-shot startup steps; opt-in) ────────────────────────────
# ArgoCD-style platform-admin provisioning. The password is resolved at
# boot from a Kubernetes Secret (created by the Helm chart, not by the
# operator) — same SecretRef pattern as datastores.postgres.password_secret.
# See docs/security.md for the full runbook.
bootstrap:
  admin:
    enabled: false                      # opt-in; flip to true in chart values
    subject: "admin"                    # login identifier
    tenant_slug: "platform"             # auto-created on first run if missing
    tenant_display_name: "Platform"
    display_name: ""                    # falls back to subject when empty
    roles: ["platform.admin"]           # cross-tenant via Cedar role
    # Inline password — debug-only. Production deploys leave this empty
    # and rely on `password_secret` below.
    password: ""
    password_secret:
      name: "paladin-bootstrap-admin"       # Secret managed by the chart
      key: "password"
      namespace: ""                     # empty → pod namespace
    min_password_length: 0              # 0 → 16 in release, 8 in debug/test
    force_reset: false                  # one-shot rotation; flip back to false after deploy

# ─── Cross-cutting middleware (timeouts, RPS caps, caches, idempotency) ────
middleware:
  timeouts:
    fast_operation: 5s                  # Get/GetMeta/Delete/PatchMeta/GetMultipart
    default_operation: 30s              # CreateSingle, List
    s3_operation: 60s                   # presign + multipart S3 calls
    long_operation: 2m                  # CompleteMultipart
  rate_limit:                           # sliding window per-tenant
    enabled: true
    requests_per_second: 300
    burst: 500
    max_tenants: 10000                  # LRU eviction beyond this
    cleanup_ttl: 10m
    cleanup_interval: 5m
  cache:                                # in-memory resource cache (Cedar, bucket meta)
    enabled: true
    max_size: 1000
    ttl: 5m
  idempotency:                          # de-dup via Idempotency-Key header
    enabled: true
    ttl: 24h

# ─── worker role: ops listener + background jobs ───────────────────────────
# `serve worker` opens a single ops listener for kube-proxy probes
# (/healthz + /readyz) and runs the background-job fan defined under
# `jobs:`. The ops listener defaults to :8090 — same number the chart's
# admin and worker Deployments expose — so a single containerPort
# definition matches both roles.
worker:
  ops:
    <<: *http_defaults
    addr: "0.0.0.0:8090"
  # Where the ADMIN pod reaches this ops listener. The console's /stats
  # page needs a cross-tenant census of every RLS'd table (objects,
  # quotas, capability records, API tokens, event subscriptions —
  # migration 023) and only the worker holds a BYPASSRLS pool, so it
  # computes the census and admin's SystemService.GetPlatformStats
  # proxies <ops_url>/system/rls-census.json. Empty (the default here;
  # the chart sets the in-cluster Service URL) disables the proxy and the
  # RPC reports rls.available=false instead of erroring.
  ops_url: ""
  jobs:
    reconciler:                         # closes gaps when S3 events are unavailable / lost
      interval: 30s                     # how often to run a reconcile pass
      min_object_age: 2h                # only objects older than this are eligible
      batch_size: 100
    housekeeping:                       # audit-log reaper
      interval: 1h                      # how often the reaper loop runs
      pending_ttl: 24h                  # PENDING objects older than this are GC'd
      multipart_ttl: 72h                # abandoned multipart sessions
      audit_log_ttl: 8760h              # 365 days
      delete_orphaned_parts: false      # WARNING: enable in prod to reclaim S3 storage
      # Lifecycle hard-delete cascade: after this cooling-off window
      # the LifecycleHardDeleter calls storage.DeleteObject AND drops
      # the Paladin row. 0 disables (audit-only, dev default). 7d-30d in
      # prod is the typical setting — gives support a restore window
      # before the bytes go away. Worker race-with-PUT mitigation is
      # OCC-gated; see internal/worker/lifecycle_hard_delete.go.
      hard_delete_after: "0s"
      hard_delete_batch_size: 100
    refresh_token_reap:                 # drops expired refresh tokens
      interval: 1h
    lifecycle:                          # CEL-based per-bucket expiration
      enabled: true
      interval: 30m
    replication:                        # cross-backend copy (dry-run until wired)
      enabled: false
      interval: 5m
      lookback_window: 1h
    purge_drain:                        # reclaims bytes owed by permanent deletes
      # The permanent-delete API removes the DB row first and the S3
      # bytes second (safe ordering: the reverse could strand a live row
      # pointing at nothing). When the byte-delete fails, a row in
      # pending_purges is the ONLY remaining record of where those bytes
      # are — the object row is gone. This loop drains that debt and
      # emits paladin.object.purged once the bytes are confirmed gone.
      # 0 disables and reinstates the leak.
      interval: 1m
      max_backoff: 1h                   # per-row retry cap; debt is never dropped
      batch_size: 100
    quota_reconcile:                    # keeps quotas.usage_* honest
      # Recomputes usage_total_bytes / usage_object_count from live
      # objects and zeroes the per-day counters at the UTC day boundary.
      # The upload path only ever INCREMENTS those columns (best-effort,
      # never decremented on delete) and the upload interceptor rejects
      # with ResourceExhausted against them — so without this loop a
      # tenant that deletes what it uploaded stays counted and eventually
      # cannot write at all. 0 disables; only appropriate for a
      # deployment that configures no quotas.
      interval: 15m

# ─── dispatcher role: durable webhook fan-out ──────────────────────────────
# `serve dispatcher` polls the event_deliveries outbox (migration 028) and
# POSTs to customer sinks. Producer (admin pod) writes rows on each event;
# this loop drains them via FOR UPDATE SKIP LOCKED so multiple replicas can
# run concurrently. Per-row retry curve is BaseBackoff * 2^attempts capped
# at MaxBackoff. Cross-tenant scans require the pod to connect as a
# BYPASSRLS role — set datastores.postgres.migrate_dsn for production.
dispatcher:
  ops:
    <<: *http_defaults
    addr: "0.0.0.0:8099"
  poll_interval: 1s                     # idle-loop sleep when no rows are ready
  batch_size: 50                        # rows per FOR UPDATE SKIP LOCKED scan
  base_backoff: 5s                      # first retry delay; doubles per attempt
  max_backoff: 1h                       # cap for the exponential curve
  default_max_attempts: 5               # used when sub HttpSink.MaxAttempts==0

# ─── Storage backends ───────────────────────────────────────────────────────
# Registry of physical object-storage backends. Each logical ObjectKey picks
# one by name; every write path names a backend explicitly (there is no
# default). `events.enabled=true` flips CompletionMode to IMPLICIT (object
# promoted via S3 event stream).
storage:
  backends:
    primary:
      kind: s3-compatible               # aws-s3 | s3-compatible | gcs
      provider: ""                      # garage | seaweedfs | minio | aws | gcp | ...
      bucket: paladin-primary               # full S3 key = "<tenant_id>/<object_key>/<key>"
      region: us-east-1
      endpoint: "http://seaweedfs-filer.storage.svc.cluster.local:8333"
      public_endpoint: "https://s3.paladin.local"   # browser-reachable; "" → reuse endpoint
      force_path_style: true            # required for SeaweedFS / MinIO

      # ── Authentication ────────────────────────────────────────────────
      # `auth.mode` is mandatory:
      #   static_keys   — IAM access key + secret. Only mode that works
      #                   against non-AWS endpoints (SeaweedFS / MinIO).
      #   default_chain — defer to AWS SDK chain (env / ECS / IMDS / profile).
      #   assume_role   — STS AssumeRole layered on default_chain.
      #   web_identity  — STS AssumeRoleWithWebIdentity (EKS IRSA).
      auth:
        mode: static_keys
        access_key: dummy_access_key    # override via access_key_secret in non-local
        # access_key_secret: { name: paladin-aws, key: access_key, namespace: storage }
        secret_key: dummy_secret_key
        # secret_key_secret: { name: paladin-aws, key: secret_key, namespace: storage }
        session_token: ""               # static_keys only — externally-rotated short-lived creds
        # session_token_secret: { name: paladin-aws, key: session_token }
        role_arn: ""                    # required for assume_role | web_identity
        session_name: "paladin-control-plane"
        external_id: ""                 # assume_role only — confused-deputy guard
        duration_seconds: 0             # 0 → AWS default (1h)
        web_identity_token_file: ""     # web_identity only; "" → $AWS_WEB_IDENTITY_TOKEN_FILE

      part_size: "8MB"
      sse:
        type: ""                        # "" | AES256 | aws:kms
        key_id: ""                      # required when sse.type=aws:kms
      events:
        enabled: false                  # SeaweedFS has no S3 events → EXPLICIT mode
        target: "none"                  # sqs | redis | none
        queue_url: ""
        poll_interval: 20s

# ─── Cedar policy engine ────────────────────────────────────────────────────
cedar:
  policy_cache_ttl: 30s                 # short TTL — missed LISTEN/NOTIFY self-corrects
  # ADR-0014 Phase 1: emit the canonical A-shape ObjectKey entity UID
  # (storageBackends/{b}/buckets/{bk}/tenants/{t}/objectKeys/{ok}) where the
  # (backend, bucket) binding is in scope on the authz request. Safe to leave
  # on: Paladin ships no policy that pins a `resource == ObjectKey::"…"` literal
  # (verified — the default template is attribute/parent-based), so the UID
  # string is never matched and the switch is behaviourally inert. Turn OFF
  # only if an operator authors a policy that hardcodes an ObjectKey EUID.
  canonical_collection_euid: true

# ─── MCP (Model Context Protocol) bridges ───────────────────────────────────
# LLM-facing entry points. Each transport flips off independently. The
# tool catalog exposed to the LLM is gated by a named `profile`:
#
#   read_only   — list/get/query + audit + simulate_authz; no mutations
#   agent_safe  — read_only + presign get/put + complete_object + tag mutations
#   admin       — every registered tool, except items in mcp.always_deny
#
# Built-in profiles live in internal/mcp/profile.go. Custom profiles
# can be defined under mcp.profiles below; tool-name patterns support
# trailing-* wildcard. The mcp.always_deny list applies regardless of
# profile (it encodes the capability-model antithesis: agent issuing
# its own caps, role escalation, login, tenant lifecycle).
#
# There are NO env-var overrides for this section. A LoadMCP path that
# read PALADIN_MCP_* and PALADIN_{ADMIN,DATA,IAM}_URL was documented here
# and shipped, but nothing ever called it: `serve mcp` reads this YAML
# through the CUE-validated loader like every other role. Setting those
# variables changed nothing, which is worse than not offering them.
# PALADIN_{ADMIN,DATA,IAM}_URL do still mean something — to the console
# BFF, a different process reading its own environment.
# ─── ingest ────────────────────────────────────────────────────────────────
#
# The storage-event receiver role (`serve ingest`). Deliberately NOT spelled
# out here: it is opt-in and its shape depends entirely on the driver, so the
# values belong in the per-overlay values file that also carries the broker
# URL and the shared secret.
#
# Every knob still has a default — internal/config/schema.cue declares the
# block, so an overlay that sets only `enabled` and `driver` gets a working
# receiver. That was not true before: with no schema block, dedup_ttl and
# reaper_interval fell to zero, and a zero reaper_interval means the reaper
# never runs and `ingested_events` grows without bound.

mcp:
  upstreams:
    admin_url: "http://localhost:8090"
    data_url: "http://localhost:8083"
    iam_url: "http://localhost:8085"
    # Trust material for whichever URLs above are https://. There is no
    # "enabled" flag: the scheme decides whether a dial is encrypted, so the
    # two cannot drift apart. Local defaults are plaintext, so this is empty;
    # in-cluster the planes serve TLS from the internal mTLS CA and the chart
    # sets ca_path to the mounted bundle. An https:// upstream with no
    # ca_path is rejected at load time — the system roots do not contain
    # that CA, so it would fail on first use instead.
    tls:
      cert_path: ""
      key_path: ""
      ca_path: ""
      server_name: ""
      insecure_skip_verify: false
  stdio:
    enabled: true                       # set false to ship a build with no local LLM bridge
    profile: read_only                  # read-only inspection by default
  http:
    enabled: true                       # set false in prod if no remote LLM platforms connect
    addr: ":8095"
    profile: read_only
    session_timeout: 10m                # idle sessions auto-close after this
  # Custom / overridden profiles (optional). When empty the built-in
  # set from internal/mcp/profile.go is used. Tool-name patterns
  # support trailing-* wildcard. `deny` wins over `tools` within a
  # profile.
  profiles: {}
  # Global deny list — applied AFTER profile expansion. Empty list
  # explicitly = no global denial (override for built-in defaults).
  # Leave commented to keep the built-in DefaultAlwaysDeny.
  # always_deny: []

# ── Capability tokens (Ed25519 JWT, agent-runtime) ─────────────────────────
# Short-lived, caveat-bearing JWTs minted by the admin plane and verified
# on data/admin/mcp. Disabled by default — enable per-deploy once a
# signing key is mounted. See internal/capability/.
capability:
  enabled: false                     # gate the whole subsystem
  issuer_name: ""                    # `iss` claim; conventional: external URL or "paladin-prod-eu"
  trusted_issuers: []                # `iss` values the verifier accepts; include issuer_name
  signing_key_path: ""               # PEM PKCS#8 Ed25519 private key; empty → ephemeral keypair (dev only)
  signing_key_kid: ""                # JWT header kid; empty → derived from public key bytes
  default_ttl: 15m                   # cap when Issue.TTL omitted
  verifier_leeway: 30s               # clock-skew window for nbf / exp
  charge_per_request_amount: 0       # amount auto-charged on billable handler calls; 0 = no auto-charge
  charge_per_request_unit: ""        # unit code (USD/EUR/UAH/GBP/UNIT); empty = use capability's own unit
  revocation_cache_ttl: 2s           # IsRevoked cache TTL; <0 disables (every check hits DB)

# ── API tokens (hashed-bearer M2M, long-lived) ─────────────────────────────
# Service-to-service credentials following the GitHub-PAT / Stripe /
# Hatchet pattern. Distinct from capability (agent JWT) and auth (user
# OIDC). Disabled by default. See internal/auth/api_token/.
api_token:
  enabled: false                     # gate the subsystem
  max_ttl: 8760h                     # cap on Issue lifetime; 1y default
  verifier_leeway: 30s               # clock-skew on expires_at
  touch_last_used: true              # bump last_used_at on verify (off for high-QPS deploys)
