# Configuration tuned for the docker-compose smoke stack
# (deploy/docker-compose.yaml). Differs from configs/local.yaml in that
# every connection string uses container-network DNS, not 127.0.0.1 —
# a service running INSIDE the compose network can't reach localhost
# of the host.
#
# Bring the stack up:
#   docker compose -f deploy/docker-compose.yaml up --build
#
# Then verify all four planes are ready:
#   curl http://localhost:8080/readyz   # data
#   curl http://localhost:8085/readyz   # iam
#   curl http://localhost:8090/readyz   # admin
#   curl http://localhost:8095/healthz  # mcp

app:
  name: paladin
  env: local

logger:
  level: info
  format: console
  development: true
  disable_caller: true
  disable_stacktrace: true

otel:
  enabled: false

runtime:
  mode: debug
  shutdown_timeout: 5s

api:
  server:
    data: &http_defaults
      addr: "0.0.0.0:8080"
      read_header_timeout: 5s
      read_timeout: 30s
      write_timeout: 60s
      idle_timeout: 90s
      max_header_bytes: 1048576
      max_body_bytes: 10485760
      request_id_header: "X-Request-Id"
      real_ip_header: "X-Forwarded-For"
      cors_allowed_origins: ["*"]
      tls: { enabled: false }
    iam:
      <<: *http_defaults
      addr: "0.0.0.0:8085"

admin:
  server:
    <<: *http_defaults
    addr: "0.0.0.0:8090"

datastores:
  postgres:
    dsn: "postgres://paladin:paladin@postgres:5432/paladin?sslmode=disable"
    migrate_dsn: ""    # dev path: same role for runtime + migrate
    pool: { max_conns: 10, min_conns: 1, max_conn_lifetime: 30m, max_conn_idle_time: 5m }
    timeouts: { connect: 5s, statement: 30s }
    healthcheck_period: 30s

limits:
  max_object_size: "100MB"
  max_multipart_size: "1TB"
  min_part_size: "5MB"
  max_part_size: "5GB"
  max_parts: 10000
  allowed_content_types:
    - "image/jpeg"
    - "image/png"
    - "text/plain"
    - "application/pdf"
    - "application/json"
    - "application/octet-stream"
  presign:
    put_ttl: 15m
    get_ttl: 15m
    part_ttl: 15m
    default_ttl: 15m
    max_ttl: 168h
    default_max_size: 5368709120

auth:
  issuer: "paladin-dev"
  signing_key: "dev-secret-change-me-32-bytes-min"
  leeway: 30s
  access_token_ttl: 15m
  refresh_token_ttl: 168h
  scoped_token_max_ttl: 24h
  # The Playwright e2e suite logs in through the real /login form as the
  # single bootstrap admin, and across parallel workers that bursts past the
  # production default (10/min per subject) → CodeResourceExhausted → tests
  # bounce to /login. The limiter is a credential-stuffing defence, not a
  # surface these UI tests exercise, so raise both caps out of the way here.
  login_rate_limit_per_subject_per_minute: 100000
  login_rate_limit_per_ip_per_minute: 100000

security:
  reject_tenant_mismatch: false
  log_sensitive: false

# Bootstrap on first boot. Running `paladin bootstrap` once with this
# config provisions a `platform/admin` user + the primary storage
# backend row. Smoke tests authenticate with these credentials.
bootstrap:
  admin:
    enabled: true
    subject: "admin"
    tenant_slug: "platform"
    tenant_display_name: "Platform"
    roles: ["platform.admin"]
    # Inline dev-only password (NEVER true in prod). Do NOT also set
    # password_secret — config validation rejects specifying both.
    password: "smoke-admin-password-change-me"
    min_password_length: 8
    force_reset: false

middleware:
  timeouts:
    fast_operation: 5s
    default_operation: 30s
    s3_operation: 60s
    long_operation: 2m
  rate_limit:
    requests_per_second: 1000
    burst: 2000
    max_tenants: 1000
    cleanup_ttl: 10m
    cleanup_interval: 5m
  cache:
    enabled: true
    max_size: 1000
    ttl: 5m
  idempotency:
    enabled: true
    ttl: 1h

worker:
  ops:
    <<: *http_defaults
    addr: "0.0.0.0:8090"
  jobs:
    reconciler:
      interval: 30s
      min_object_age: 2h
      batch_size: 100
    housekeeping:
      pending_ttl: "24h"
      multipart_ttl: "72h"
      interval: "1h"
      delete_orphaned_parts: false
    refresh_token_reap:
      interval: 1h
    api_key_reap:
      interval: 1h
    lifecycle:
      enabled: false
      interval: 30m
    replication:
      enabled: false
      interval: 5m
      lookback_window: 1h
    capability:
      interval: 1h
      expired_for: 24h
    api_token:
      interval: 1h
      expired_for: 168h
    operations:
      # 1s tick during smoke so a BatchDelete enqueued at t=0 is
      # actually processed before the test polls at t=2s.
      interval: 1s

storage:
  default_backend: primary
  backends:
    primary:
      kind: s3-compatible
      bucket: paladin-primary
      region: us-east-1
      endpoint: "http://seaweedfs:8333"
      public_endpoint: "http://localhost:8333"
      force_path_style: true
      auth:
        mode: static_keys
        access_key: dummy
        secret_key: dummy
      part_size: "8MB"
      sse: { type: "", key_id: "" }
      events: { enabled: false, target: "none", queue_url: "", poll_interval: 20s }

cedar:
  policy_cache_ttl: 30s

mcp:
  upstreams:
    admin_url: "http://paladin-admin:8090"
    data_url:  "http://paladin-api:8080"
    iam_url:   "http://paladin-api:8085"
  stdio:
    enabled: false
    profile: read_only
  http:
    enabled: true
    addr: "0.0.0.0:8095"
    profile: agent_safe
    session_timeout: 10m

# Subsystems disabled by default in the smoke stack — they're config-
# driven and orthogonal to the "stack composes" claim. Enable per
# scenario when adding agentic-flow tests.
capability:
  enabled: false
api_token:
  enabled: false

# Ingest plane is ON by default in compose so SeaweedFS-uploaded files
# auto-promote PENDING → AVAILABLE without an explicit Complete RPC.
# Webhook driver is the smallest setup — no MQ infra required.
ingest:
  enabled: true
  driver: webhook
  webhook:
    addr: "0.0.0.0:8100"
    # Empty shared_secret in compose. Production deploys MUST set this;
    # SeaweedFS notification.toml's bearer_token uses the same value.
    shared_secret: ""
    signature_header: "X-PALADIN-Signature"
    max_body_bytes: 1048576
  dedup_ttl: 24h
  reaper_interval: 1h
