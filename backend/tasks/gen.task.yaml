version: "3"

# Code generation. Order matters: mockery first so it can run against
# whatever interfaces the generator emits in subsequent steps; buf
# before go generate so the protoc-generated files exist when go
# generate's tools (e.g. goimports) walk the tree.

tasks:
  all:
    desc: "Regenerate every kind of code we ship (mocks, proto, sqlc)"
    deps: [":core:tools:basic"]
    cmds:
      - task: ":core:banner"
        vars: { MESSAGE: "regenerating code (mocks → proto → go generate → sqlc)" }
      - go run github.com/vektra/mockery/v3 --config=.mockery.yaml
      - task: proto
      - go generate ./...
      - sqlc generate

  proto:
    desc: "Regenerate protobuf + Connect-Go stubs (reproducible: buf generate → goimports)"
    cmds:
      # buf emits one alphabetically-sorted import block. The repo's de-facto
      # canonical for generated Go is whatever the lefthook pre-commit hook
      # applies — a plain `goimports -w` (stdlib group, blank line, then the
      # rest) — NOT raw buf output. Commits that bypassed the hook (--no-verify)
      # left some pb files in raw single-block form, so a no-op `buf generate`
      # used to churn ~40 files. Applying the same goimports pass here makes
      # `task gen:proto` byte-reproducible and matches the hook. Requires
      # goimports on PATH (same assumption as the lefthook backend-goimports
      # step); install with `go install golang.org/x/tools/cmd/goimports@latest`.
      # buf.yaml/buf.gen.yaml now live in proto/ (the self-contained contract
      # module, tagged api/vX for external consumers). Run from backend/ with
      # explicit input + template so out (.) still lands in ./internal/api/pb.
      #
      # Tripwire, deliberately BEFORE the generate step so it fires whether the
      # stray copy arrived just now or three commits ago. `out: .` in
      # buf.gen.yaml is relative to the working directory, so a bare
      # `buf generate` run from inside proto/ writes a complete second copy of
      # every stub to proto/internal — 60 files that compile, that nothing can
      # import (the `internal/` in that path scopes them to proto/, which holds
      # no Go code), and that then rot silently. That copy lived in the tree,
      # committed, until 2026-08-27, three field removals behind the real one.
      # Untracked it would still compile into the module while staying out of
      # `git status`, so .gitignore is the wrong instrument here: the point is
      # to make it loud, not to hide it.
      - cmd: |-
          if [ -e proto/internal ]; then
            echo "gen:proto: proto/internal exists — that is a stray second copy of the"
            echo "  generated stubs, produced by running 'buf generate' from inside proto/."
            echo "  Nothing imports it and it drifts out of the real tree in silence."
            echo "  Remove it and re-run:  rm -rf backend/proto/internal"
            exit 1
          fi
      - buf generate proto --template proto/buf.gen.yaml
      - goimports -w internal/api/pb
