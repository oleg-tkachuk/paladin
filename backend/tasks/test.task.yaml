version: "3"

# Test task surface. The previous file wrapped `go test` in
# `eval "$(minikube docker-env)"` which had no effect on go test —
# Minikube's docker env affects `docker` invocations, not the Go
# toolchain. Removing the cargo-cult shim makes the tasks portable
# (CI runners typically don't have minikube) and the failure modes
# obvious.

tasks:
  # ─── Go ──────────────────────────────────────────────────────────────────

  unit:
    desc: "Run unit tests"
    cmds:
      - go test ./...

  tagged:compile:
    desc: "Compile-check the build-tagged suites (no Docker, no cluster, seconds)"
    cmds:
      # The `integration` and `e2e` suites are invisible to `go build ./...`,
      # `go vet ./...` and `go test ./...` — a build tag excludes them from all
      # three. So they rot in complete silence, and they have, twice:
      #
      #   - tests/e2e/ stopped compiling when DeleteTenantRequest.Force and
      #     Bucket.bucket_name were removed (found 2026-08-27, five errors).
      #   - internal/integration/ stopped compiling when the operations widget
      #     fix (c14798c3) added newestFirst to OperationRepo.List (found the
      #     same day, in the same sweep, one error).
      #
      # Neither needed a database, a stack or a browser to catch — only a
      # compiler that was allowed to look. This is that, and it is why it runs
      # in verify-all while the suites themselves (Docker, ~11 min) do not.
      # `go vet` rather than `go build`: same compile, plus the vet checks.
      - go vet -tags=integration ./...
      - go vet -tags=e2e ./...
      # tests/conformance needs a live S3 endpoint and skips without one, so
      # it never runs in the gate — which is exactly the condition under which
      # the other two rotted. Same treatment.
      - go vet -tags=conformance ./...

  rpc-surface:
    desc: "Run the whole-contract RPC gate against a live stack (brings one up)"
    cmds:
      # One phase of the stack gate, not a second boot sequence. The version
      # that used to live here inlined its own `compose up` and had neither of
      # the two things that make the result mean anything: it never rebuilt the
      # image, so it reported on whatever `:latest` happened to be, and it had
      # no collision preflight, so a developer's own stack made it fail on a
      # container name after the whole boot. See scripts/verify-stack.sh.
      - task: :docker:build-local
      - scripts/verify-stack.sh rpc-surface

  integration:
    desc: "Run Postgres-backed integration tests (needs Docker; testcontainers)"
    vars:
      # Read OUT of the CI workflow rather than written down again, the same
      # way scripts/proto-breaking.sh takes its baseline tag from test.yml.
      #
      # This task said "the CI job runs the same set" and ran it with a
      # DIFFERENT timeout: CI passes -timeout=20m, this passed none, so Go's
      # 10m default applied. internal/integration takes ~622s on this machine,
      # so `task verify-deep` failed on a suite that passes — the local gate
      # stricter than CI by accident. A gate that goes red without a fault
      # teaches people to ignore it, which costs the same as one that goes
      # green without checking.
      #
      # An empty match makes `-timeout=` invalid and go test refuses loudly,
      # which is the right failure: better than silently inheriting 10m again.
      TIMEOUT:
        sh: >
          f="$(git rev-parse --show-toplevel)/.github/workflows/integration.yml";
          t=$(awk '/-timeout=/{x=$0} index($0,"./internal/integration/..."){print x; exit}' "$f" | grep -oE 'timeout=[0-9]+m' | cut -d= -f2);
          [ -n "$t" ] || { echo "cannot read -timeout from $f — the CI step moved or was renamed" >&2; exit 1; };
          echo "$t"
    cmds:
      # BOTH suites. tests/integration/ (pgharness-backed) was previously
      # unreferenced by any task — 62 tests that ran nowhere, local or CI.
      # The CI job (.github/workflows/integration.yml) runs the same set, and
      # now with the same timeout, taken from that file.
      - go test -tags=integration -count=1 -timeout={{.TIMEOUT}} ./internal/integration/... ./tests/integration/...

  mutate:
    desc: "Mutation testing over one package: how much of it do the tests hold?"
    summary: |-
      Applies one behaviour-changing edit at a time and runs the tests. A
      mutation the tests do NOT notice is code the suite does not hold.

        task backend:test:mutate -- ./internal/auth 'internal/auth/*.go' 25

      For a DB-backed package the default denominator is wrong — its own tests
      cannot reach the branches, and reporting them as gaps sends someone to
      write tests for behaviour internal/integration already covers. Pass the
      suite that does cover it:

        task backend:test:mutate -- ./internal/capability/... \
          'internal/capability/postgres/*.go' 15 \
          --test-cmd 'go test -tags=integration -count=1 -run Capability ./internal/integration/'

      Not part of any gate. It rewrites source in place, takes minutes per
      package, and its output is a list of questions rather than a pass or a
      fail — see scripts/mutate.py for how to read it.
    cmds:
      - ./scripts/mutate.py {{.CLI_ARGS}}

  bench:
    desc: "Run Postgres-backed benchmarks (needs Docker; seeds ~1M rows)"
    cmds:
      - go test -tags=integration -run='^$' -bench=. -benchtime=20x -timeout=600s ./internal/integration/... ./tests/integration/...

  coverage:
    desc: "Run unit tests with coverage; HTML report → coverage/cover.html"
    cmds:
      - cmd: |-
          mkdir -p coverage
          go test -coverprofile=coverage/cover.out ./...
          go tool cover -html=coverage/cover.out -o coverage/cover.html
      - task: ":core:banner"
        vars: { MESSAGE: "coverage report → coverage/cover.html" }

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  # ─── E2E + functional ────────────────────────────────────────────────────
  #
  # Everything below needs a live stack, and that is exactly why none of it
  # ran. Three suites — the Go admin e2e tests, the RPC-surface gate and
  # `dev-bootstrap.sh` — were reachable only by typing a recipe out of a
  # header comment, so nobody typed it, and all three rotted in silence:
  # the e2e suite stopped compiling, the surface gate spent its life
  # t.Skip-ing, and the bootstrap script had been calling a proto package
  # that no longer existed. `tagged:compile` above catches the first failure
  # mode in seconds. It cannot catch the other two, because a suite that
  # builds and then skips — or a script that runs and fails on its first
  # call — passes a compiler cleanly.
  #
  # The remaining half is a run gate, and the backlog parked it on
  # `.github/workflows/e2e.yml`, which has not executed a step since Actions
  # started refusing jobs on billing grounds. A gate that exists only in a
  # pipeline nobody can run is not a gate. So it lives here instead, and the
  # workflow calls the same task when it comes back.

  stack:
    desc: "Boot the compose stack once and run every gate that needs it (RPC surface + Go e2e + dev-bootstrap)"
    cmds:
      # The image, not the working tree, is what the stack runs. `pnpm run
      # test:e2e` does not rebuild anything and neither does compose, so a
      # gate that skips this step reports on whatever was built last — which
      # has already happened once here: a console image built four minutes
      # before the commit it was read as verifying. Building is the only
      # thing that makes the result mean anything, so it is not optional and
      # not a staleness heuristic.
      - task: :docker:build-local
      # The body is a script rather than an inline `cmd:` because go-task
      # renders every command as a Go template first, and the collision
      # preflight needs `docker ps --format` — whose Go templates go-task
      # eats before Docker ever sees them. Same reason the security tasks
      # below are thin wrappers.
      - scripts/verify-stack.sh

  # ─── Security ────────────────────────────────────────────────────────────
  # Each of these shells out to a script in tests/api/security/. Keeping
  # the wrappers thin so the actual security tooling (gosec / nuclei /
  # zap / trivy) lives next to the test fixtures it needs.

  security:
    desc: "Run all security tests (SAST + DAST + SCA)"
    dir: tests/api/security
    cmds:
      - ./run-all-security.sh

  security:sast:
    desc: "Run SAST (gosec)"
    dir: tests/api/security
    cmds:
      - ./run-gosec.sh

  security:dast:
    desc: "Run DAST (nuclei + zap)"
    dir: tests/api/security
    cmds:
      - ./run-nuclei.sh
      - ./run-zap.sh

  security:sca:
    desc: "Run SCA (trivy)"
    dir: tests/api/security
    cmds:
      - ./run-trivy.sh

  # ─── Aggregate ───────────────────────────────────────────────────────────

  all:
    desc: "Run lint + unit + integration + security"
    cmds:
      - task: lint
      - task: unit
      - task: integration
      - task: security
