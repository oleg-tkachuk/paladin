version: "3"

# Test task surface. The previous file wrapped `go test` in
# `eval "$(minikube docker-env)"` which had no effect on go test —
# Minikube's docker env affects `docker` invocations, not the Go
# toolchain. Removing the cargo-cult shim makes the tasks portable
# (CI runners typically don't have minikube) and the failure modes
# obvious.

tasks:
  # ─── Go ──────────────────────────────────────────────────────────────────

  unit:
    desc: "Run unit tests"
    cmds:
      - go test ./...

  integration:
    desc: "Run Postgres-backed integration tests (needs Docker; testcontainers)"
    cmds:
      - go test -tags=integration -count=1 ./internal/integration/...

  coverage:
    desc: "Run unit tests with coverage; HTML report → coverage/cover.html"
    cmds:
      - cmd: |-
          mkdir -p coverage
          go test -coverprofile=coverage/cover.out ./...
          go tool cover -html=coverage/cover.out -o coverage/cover.html
      - task: ":core:banner"
        vars: { MESSAGE: "coverage report → coverage/cover.html" }

  lint:
    desc: "Run golangci-lint"
    cmds:
      - golangci-lint run ./...

  # ─── E2E + functional ────────────────────────────────────────────────────

  e2e:
    desc: "Run Hurl E2E suite (override HOST=...)"
    vars:
      HOST: '{{.HOST | default "http://localhost:8080"}}'
    cmds:
      - hurl --variable host={{.HOST}} --test tests/api/e2e/*.hurl

  functional:
    desc: "Run API functional tests"
    dir: tests/api/functional
    cmds:
      - ./run-functional.sh

  mutations:
    desc: "Run API mutation tests"
    dir: tests/api/mutations
    cmds:
      - ./run-mutations.sh

  # ─── Security ────────────────────────────────────────────────────────────
  # Each of these shells out to a script in tests/api/security/. Keeping
  # the wrappers thin so the actual security tooling (gosec / nuclei /
  # zap / trivy) lives next to the test fixtures it needs.

  security:
    desc: "Run all security tests (SAST + DAST + SCA)"
    dir: tests/api/security
    cmds:
      - ./run-all-security.sh

  security:sast:
    desc: "Run SAST (gosec)"
    dir: tests/api/security
    cmds:
      - ./run-gosec.sh

  security:dast:
    desc: "Run DAST (nuclei + zap)"
    dir: tests/api/security
    cmds:
      - ./run-nuclei.sh
      - ./run-zap.sh

  security:sca:
    desc: "Run SCA (trivy)"
    dir: tests/api/security
    cmds:
      - ./run-trivy.sh

  # ─── Aggregate ───────────────────────────────────────────────────────────

  all:
    desc: "Run lint + unit + functional + e2e + security"
    cmds:
      - task: lint
      - task: unit
      - task: functional
      - task: e2e
      - task: security
