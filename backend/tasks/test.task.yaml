version: "3"

# The suites the shared library does not cover: everything that needs Docker, a
# live stack, or a run long enough that it cannot sit in the commit gate.
# Plain unit tests, lint, coverage and the tagged-compile check come from the
# library's go module (`task go:test`, `task go:lint`, …).

silent: true

vars:
  # The repository :release:image:build tags into — the release library's
  # _REL_IMAGE without the name, by the same expression. The stack gates get it
  # as PALADIN_IMAGE_PREFIX, so they run what that build produced whichever
  # Taskfile set the registry.
  STACK_IMAGE_PREFIX: '{{.GLOBAL_REGISTRY | default .REGISTRY | default "localhost:5000"}}{{if .IMAGE_NAMESPACE}}/{{.IMAGE_NAMESPACE}}{{end}}'

# Test task surface. The previous file wrapped `go test` in
# `eval "$(minikube docker-env)"` which had no effect on go test —
# Minikube's docker env affects `docker` invocations, not the Go
# toolchain. Removing the cargo-cult shim makes the tasks portable
# (CI runners typically don't have minikube) and the failure modes
# obvious.

tasks:
  # ─── Go ──────────────────────────────────────────────────────────────────

  rpc-surface:
    desc: "Run the whole-contract RPC gate against a live stack (brings one up)"
    env: { PALADIN_IMAGE_PREFIX: "{{.STACK_IMAGE_PREFIX}}" }
    cmds:
      # One phase of the stack gate, not a second boot sequence. The version
      # that used to live here inlined its own `compose up` and had neither of
      # the two things that make the result mean anything: it never rebuilt the
      # image, so it reported on whatever `:latest` happened to be, and it had
      # no collision preflight, so a developer's own stack made it fail on a
      # container name after the whole boot. See scripts/verify-stack.sh.
      - task: :release:image:build
      - scripts/verify-stack.sh rpc-surface

  integration:
    desc: "Run Postgres-backed integration tests (needs Docker; testcontainers)"
    vars:
      # Named rather than left to Go's 10m default: tests/integration/components takes
      # ~622s on a developer machine, so the default failed `verify-deep`
      # on a suite that passes. This used to be read out of the integration
      # workflow; that workflow is gone and this task is the only place the
      # suites run, so the number lives here.
      INTEGRATION_TIMEOUT: 20m
    cmds:
      # Both levels: the assembled application and components/.
      - go test -tags=integration -count=1 -timeout={{.INTEGRATION_TIMEOUT}} ./tests/integration/...

  mutate:
    desc: "Mutation testing over one package: how much of it do the tests hold?"
    summary: |-
      Applies one behaviour-changing edit at a time and runs the tests. A
      mutation the tests do NOT notice is code the suite does not hold.

        task backend:test:mutate -- ./internal/auth 'internal/auth/*.go' 25

      For a DB-backed package the default denominator is wrong — its own tests
      cannot reach the branches, and reporting them as gaps sends someone to
      write tests for behaviour tests/integration/components already covers. Pass the
      suite that does cover it:

        task backend:test:mutate -- ./internal/capability/... \
          'internal/capability/postgres/*.go' 15 \
          --test-cmd 'go test -tags=integration -count=1 -run Capability ./tests/integration/components/'

      Not part of any gate. It rewrites source in place, takes minutes per
      package, and its output is a list of questions rather than a pass or a
      fail — see scripts/mutate.py for how to read it.
    cmds:
      - ./scripts/mutate.py {{.CLI_ARGS}}

  bench:
    desc: "Run Postgres-backed benchmarks (needs Docker; seeds ~1M rows)"
    cmds:
      - task: ":go:bench"
        vars:
          GO_BENCH_PKG: "./tests/integration/..."
          GO_BENCH_FLAGS: "-benchtime=20x -timeout=600s"

  stack:
    desc: "Boot the compose stack once and run every gate that needs it (RPC surface + Go e2e + dev-bootstrap)"
    env: { PALADIN_IMAGE_PREFIX: "{{.STACK_IMAGE_PREFIX}}" }
    cmds:
      # The image, not the working tree, is what the stack runs. `pnpm run
      # test:e2e` does not rebuild anything and neither does compose, so a
      # gate that skips this step reports on whatever was built last — which
      # has already happened once here: a console image built four minutes
      # before the commit it was read as verifying. Building is the only
      # thing that makes the result mean anything, so it is not optional and
      # not a staleness heuristic.
      - task: :release:image:build
      # The body is a script rather than an inline `cmd:` because go-task
      # renders every command as a Go template first, and the collision
      # preflight needs `docker ps --format` — whose Go templates go-task
      # eats before Docker ever sees them. Same reason the security tasks
      # below are thin wrappers.
      - scripts/verify-stack.sh

  # ─── Security ────────────────────────────────────────────────────────────
  # Each of these shells out to a script in tests/api/security/. Keeping
  # the wrappers thin so the actual security tooling (gosec / nuclei /
  # zap / trivy) lives next to the test fixtures it needs.

  security:
    desc: "Run all security tests (SAST + DAST + SCA)"
    dir: tests/api/security
    cmds:
      - ./run-all-security.sh

  security:sast:
    desc: "Run SAST (gosec)"
    dir: tests/api/security
    cmds:
      - ./run-gosec.sh

  security:dast:
    desc: "Run DAST (nuclei + zap)"
    dir: tests/api/security
    cmds:
      - ./run-nuclei.sh
      - ./run-zap.sh

  security:sca:
    desc: "Run SCA (trivy)"
    dir: tests/api/security
    cmds:
      - ./run-trivy.sh

  # ─── Aggregate ───────────────────────────────────────────────────────────

  all:
    desc: "Run lint + unit + integration + security"
    cmds:
      - task: :go:lint
      - task: :go:test
      - task: integration
      - task: security
