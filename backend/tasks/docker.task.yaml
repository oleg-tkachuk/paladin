version: "3"

# Image + Helm chart deploy flow. The `deploy` entry point builds,
# pushes to the OCI registry, and packages + pushes the Helm chart —
# the path every registry-backed cluster (minikube, cloud) uses.
#
# `build-local` is the exception for OrbStack: its Kubernetes shares the
# host Docker image store, so a local `docker build` (no push) is enough
# for Pods to see the tag (imagePullPolicy: IfNotPresent). It builds the
# image only; the chart is installed straight from the chart dir by the
# gitops `task orbstack:paladin` orchestrator (which owns the env values).

vars:
  TAG: latest

tasks:
  # ─── Public entry points ─────────────────────────────────────────────────

  # NOTE: the registry image+chart push moved to the shared, version.sh-
  # stamped chain in tasks/_service.task.yaml (`svc:deploy`, invoked by
  # the top-level `task deploy`). This file keeps only the no-registry
  # OrbStack path (build-local + deploy-orbstack) and the compose stack,
  # which legitimately read deploy/info.env.

  build-local:
    desc: "Build the image into the local Docker store (no push) — for OrbStack's shared image store"
    deps: [":core:tools:build"]
    vars:
      IMAGE: "{{.OCI_REGISTRY}}/{{.IMAGE_NAMESPACE}}/{{.PROJECT_NAME}}"
      _VER:    { sh: "awk -F= '$1==\"APP_VERSION\"{print $2; exit}' {{.DEPLOY_INFO_ENV_FILE}}" }
      _COMMIT: { sh: "git rev-parse --short HEAD" }
      _TIME:   { sh: "TZ={{.TIMEZONE}} date +%Y-%m-%dT%H:%M:%S%z" }
    cmds:
      - task: ":core:banner"
        vars: { MESSAGE: "[local] building {{.PROJECT_NAME}} {{._VER}} into the Docker image store (no push)" }
      - task: _docker:build
        vars: { IMAGE: "{{.IMAGE}}", TAG: "{{._VER}}", COMMIT: "{{._COMMIT}}", TIME: "{{._TIME}}" }
      # Alias the numeric tag as :latest. No registry push: OrbStack k8s
      # shares the host Docker image store, so both tags are visible to
      # Pods directly. The local/orbstack values overlay pins
      # image.tag=latest, so :latest must exist for the install to resolve.
      - docker tag {{.IMAGE}}:{{._VER}} {{.IMAGE}}:latest
      - task: ":core:banner"
        vars: { MESSAGE: "[local] built {{.IMAGE}}:{{._VER}} (+ :latest)" }

  deploy-orbstack:
    desc: "Build into the local Docker store + helm upgrade --install to OrbStack (no registry)"
    deps: [":core:tools:build"]
    vars:
      K8S_CONTEXT: '{{.K8S_CONTEXT | default "orbstack"}}'
      # Explicit Helm values file override. Empty ⇒ use OVERLAY if present,
      # else chart defaults.
      VALUES: '{{.VALUES | default ""}}'
      # Env config lives in the sibling gitops repo's local overlay:
      # single-node resource/replica tuning, and the ArgoCD-owned secrets
      # (paladin-bootstrap-admin, paladin-s3-credentials) turned OFF so the chart
      # doesn't fight ArgoCD for them. Used automatically when present.
      #
      # That default path is maintainer-specific — gitops is a private
      # sibling checkout, so for anyone else it simply does not exist. What
      # the caller asked for is kept separate from what we guessed at
      # (OVERLAY_EXPLICIT): a path the caller named and we cannot find is an
      # error, while an absent default is a note. Both are said out loud,
      # because the silent version of this deploys chart defaults — which
      # re-enable the secrets ArgoCD owns — and looks identical in the log.
      OVERLAY_EXPLICIT: '{{.OVERLAY | default ""}}'
      OVERLAY: '{{.OVERLAY | default (print "../../gitops/deploy/argocd-apps/applications/overlays/local/values/paladin/" .PROJECT_NAME ".yaml")}}'
    preconditions:
      - sh: command -v helm >/dev/null
        msg: "helm is not installed"
      - sh: kubectl config get-contexts -o name | grep -qx "{{.K8S_CONTEXT | default `orbstack`}}"
        msg: "no '{{.K8S_CONTEXT | default `orbstack`}}' kube context — enable Kubernetes in OrbStack"
    cmds:
      - task: build-local
      - task: ":core:banner"
        vars: { MESSAGE: "[ctx={{.K8S_CONTEXT}}] helm upgrade --install {{.PROJECT_NAME}} -> ns {{.K8S_NAMESPACE}}" }
      - cmd: |-
          set -euo pipefail
          # Values: explicit VALUES wins; else the sibling gitops overlay
          # if present; else chart defaults. Every branch announces itself.
          vfile="{{.VALUES}}"
          if [ -n "$vfile" ]; then
            [ -f "$vfile" ] || { echo "VALUES=$vfile: no such file" >&2; exit 1; }
            echo "[orbstack] using values: $vfile"
          elif [ -f "{{.OVERLAY}}" ]; then
            vfile="{{.OVERLAY}}"; echo "[orbstack] using overlay: $vfile"
          elif [ -n "{{.OVERLAY_EXPLICIT}}" ]; then
            echo "OVERLAY={{.OVERLAY_EXPLICIT}}: no such file" >&2; exit 1
          else
            echo "[orbstack] no overlay at {{.OVERLAY}} — installing with chart" \
                 "defaults. That path is the maintainer's private gitops" \
                 "checkout; pass OVERLAY=<file> or VALUES=<file> for your own." >&2
          fi
          vflag=""; [ -n "$vfile" ] && vflag="--values $vfile"
          # helm v4's default 'watcher' wait engine hangs on this chart's
          # before-hook-creation hook deletions ("waiting for resources to be
          # deleted" never returns). Use the legacy (v3) wait strategy. On
          # helm v3 --wait is a plain bool, so only append =legacy for v4.
          waitflag="--wait"
          case "$(helm version --short 2>/dev/null)" in v4.*) waitflag="--wait=legacy" ;; esac
          # OrbStack has no in-cluster registry → install from the chart dir.
          # image.tag=latest matches build-local; pullPolicy=IfNotPresent
          # uses the shared Docker store (nothing serves registry.local).
          helm upgrade --install {{.PROJECT_NAME}} {{.CHART_DIR}} \
            --kube-context {{.K8S_CONTEXT}} \
            --namespace {{.K8S_NAMESPACE}} --create-namespace \
            --set image.tag=latest \
            --set image.pullPolicy=IfNotPresent \
            $vflag \
            $waitflag --timeout 5m

  # ─── Local stack (Docker Compose) ────────────────────────────────────────

  up:
    desc: "Bring up the local stack (postgres + seaweedfs + service)"
    cmds:
      - task: ":core:banner"
        vars: { MESSAGE: "starting local stack" }
      - cmd: |-
          docker compose \
            --progress={{.PROGRESS | default "auto"}} \
            -f {{.COMPOSE_FILE}} \
            -p {{.PROJECT_NAME}} \
            --env-file {{.DEPLOY_INFO_ENV_FILE}} \
            up -d --build

  # ─── Internal helpers ────────────────────────────────────────────────────

  _docker:build:
    desc: "Internal: invoke `docker build` with the standard ldflags args"
    internal: true
    cmds:
      - cmd: |-
          # --load: required when the active buildx builder uses the
          # docker-container driver (e.g. the project's `lean` builder).
          # Without it the build result stays in BuildKit's cache and the
          # downstream `docker push` fails with "tag does not exist".
          # No-op when the legacy docker driver is active.
          cd {{.DOCKER_CONTEXT | default "."}} && docker buildx build --load \
            --network=host \
            --tag {{.IMAGE}}:{{.TAG}} \
            --file {{.DOCKERFILE}} \
            --build-arg APP_VERSION={{.TAG}} \
            --build-arg GIT_COMMIT_HASH={{.COMMIT}} \
            --build-arg BUILD_TIME="{{.TIME}}" \
            .
