syntax = "proto3";

package paladin.iam.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/iam/v1;paladiniamv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "paladin/common/v1/pagination.proto";
import "google/api/field_behavior.proto";

// UserSettingsService persists per-user web-UI preferences plus the
// timezone/locale/theme triple the platform reasons about server-side.
//
// Self-service (GetMine / UpdateMine) operates on the calling principal's
// row — no Cedar round-trip, owning your settings is a baseline capability.
//
// Admin paths (GetForUser / ListByTenant / DeleteForUser) are gated by the
// ReadUserSettings / ManageUserSettings Cedar actions.
service UserSettingsService {
  // GetMine returns the calling user's settings, creating nothing: a user who
  // has never saved settings gets the zero value with an empty
  // resource_version.
  rpc GetMine(GetMineRequest) returns (UserSettings) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateMine writes the calling user's settings. An empty resource_version
  // means "create"; a non-empty one must match, or the write is Aborted.
  rpc UpdateMine(UpdateMineRequest) returns (UserSettings) {
    option idempotency_level = IDEMPOTENT;
  }
  // GetForUser reads another user's settings. Tenant-admin only — the
  // self-service path is GetMine.
  rpc GetForUser(GetForUserRequest) returns (UserSettings) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // ListByTenant returns every settings row in the tenant, for an operator
  // auditing what users have configured.
  rpc ListByTenant(ListByTenantRequest) returns (ListByTenantResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // DeleteForUser removes another user's settings row, resetting them to
  // defaults on next read.
  rpc DeleteForUser(DeleteForUserRequest) returns (DeleteForUserResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message UserSettings {
  // Resource name: "users/{user_id}/settings".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string user_id = 2;
  string tenant_id = 3;
  string timezone = 4;  // IANA tz database name, e.g. "Europe/Kyiv".
  string locale = 5;    // BCP-47, e.g. "uk-UA".
  string theme = 6;     // "light" | "dark" | "system".
  // Free-form UI state. Server treats as opaque; bounded at 16 KiB on write.
  google.protobuf.Struct preferences = 7;
  string resource_version = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetMineRequest {}

message UpdateMineRequest {
  // Caller-controlled patch. update_mask names the fields to apply; if empty,
  // every explicit field below is treated as authoritative (preferences left
  // unchanged when nil).
  google.protobuf.FieldMask update_mask = 1;
  string timezone = 2;
  string locale = 3;
  string theme = 4;
  google.protobuf.Struct preferences = 5;
}

message GetForUserRequest {
  // Resource name: "users/{user_id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ListByTenantRequest {
  // Parent: "tenants/{tenant_id_or_slug}".
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  paladin.common.v1.PageRequest page = 2;
}

message ListByTenantResponse {
  repeated UserSettings settings = 1;
  paladin.common.v1.PageResponse page = 2;
}

message DeleteForUserRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteForUserResponse {}
