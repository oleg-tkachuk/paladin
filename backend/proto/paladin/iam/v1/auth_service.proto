syntax = "proto3";

package paladin.iam.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/iam/v1;paladiniamv1";

import "buf/validate/validate.proto";
import "paladin/common/v1/pagination.proto";
import "paladin/iam/v1/types.proto";

// AuthService handles login + token lifecycle. Public-facing endpoints
// (Login, RefreshToken) accept unauthenticated callers; everything else
// requires a valid access token.
service AuthService {
  // Login exchanges username+password (or upstream IdP code) for a TokenPair.
  // Rate-limited per (subject, source IP).
  rpc Login(LoginRequest) returns (LoginResponse);

  // RefreshToken exchanges a still-valid refresh token for a fresh access+
  // refresh pair. The old refresh token is invalidated (rotation).
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);

  // Revoke invalidates a token (access or refresh). Idempotent.
  rpc Revoke(RevokeRequest) returns (RevokeResponse);

  // WhoAmI returns the caller's current Principal — used by SPAs to render
  // identity / role-gated UI without re-decoding the JWT client-side.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // ChangePassword updates the caller's password. Local-IdP only.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // ExchangeAudience derives a short-lived access token for a different
  // audience from a still-valid refresh token, WITHOUT rotating the
  // refresh chain. Use it from a multi-plane SPA that needs simultaneous
  // tokens for paladin-data, paladin-admin, paladin-iam off a single login session.
  // The presented refresh token must still be in the store and unexpired;
  // server-side audience escalation rules apply (admin requires an
  // admin-tier role on the principal).
  rpc ExchangeAudience(ExchangeAudienceRequest) returns (ExchangeAudienceResponse);

  // ListMyMemberships returns every tenant the caller's subject belongs to.
  // Under the 1:1-per-tenant user model a "membership" is a users row, so a
  // subject registered in tenants A and B has two memberships with independent
  // roles. Used by the SPA to render the tenant switcher.
  rpc ListMyMemberships(ListMyMembershipsRequest) returns (ListMyMembershipsResponse);

  // SwitchTenant mints a fresh access+refresh pair scoped to a DIFFERENT
  // tenant the caller is already a member of — no password re-check (the
  // caller already proved identity, and could log in to the target directly,
  // so switching grants no new authority). A new refresh family is started.
  rpc SwitchTenant(SwitchTenantRequest) returns (SwitchTenantResponse);
}

message LoginRequest {
  // For local IdP: subject is username/email. For federated IdP this RPC
  // accepts an upstream authorization code instead (see auth_method).
  string subject = 1 [(buf.validate.field).string.min_len = 1];
  string password = 2;
  // Optional upstream IdP code (OIDC authorization-code flow).
  string upstream_code = 3;
  // Audience the caller wants the access token for. Server-side ACL still
  // applies — caller cannot escalate beyond their roles.
  string requested_audience = 4; // default: "paladin-data"
}

message LoginResponse {
  TokenPair tokens = 1;
  User user = 2;
}

message RefreshTokenRequest {
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
  // Audience the caller wants on the new access token. Empty defaults to
  // `paladin-data` server-side; SPAs that pin a refresh chain to a particular
  // plane (e.g. the iam-cookie BFF flow) MUST set this explicitly.
  string requested_audience = 2;
}

message RefreshTokenResponse {
  TokenPair tokens = 1;
}

message RevokeRequest {
  // Either an access or refresh token; server identifies which.
  string token = 1 [(buf.validate.field).string.min_len = 1];
}

message RevokeResponse {}

message WhoAmIRequest {
  // route_page_token pages the Collection route table (ADR-0010 Phase 4). Empty
  // = first page; pass back the previous response's `next_page_token` to fetch
  // the next page. Only the route table is paged — identity fields are always
  // returned in full.
  string route_page_token = 1;
}

message WhoAmIResponse {
  User user = 1;
  // Audience extracted from the presented token; useful for SPAs that
  // reuse one client to talk to multiple planes.
  string audience = 2;
  // Tenant slug for the caller's tenant — populated from the JWT's
  // `tenant_slug` claim minted by the issuer. SPAs use this to render
  // slug-form URLs (`/tenants/<slug>/...`) without a follow-up
  // GetTenant lookup.
  string tenant_slug = 3;
  // routes is ONE PAGE of the caller's Collection route table (ADR-0010 Phase
  // 4): the Collections the caller can read, in all three name shapes, so
  // clients and SDKs normalize to canonical (A) before sending rather than
  // constructing it themselves. Empty when the server has no route source wired
  // or the caller has no readable Collections. Page through with
  // `next_page_token`.
  repeated CollectionRoute routes = 4;
  // routes_truncated is true when more readable Collections remain beyond this
  // page (equivalent to next_page_token != ""). Kept for clients that don't
  // page: such a client must not treat the table as exhaustive — fall back to
  // resolving any name it can't find via ListCollections.
  bool routes_truncated = 5;
  // next_page_token pages the route table: pass it back as
  // WhoAmIRequest.route_page_token to fetch the next page. Empty on the last
  // page (or when routes is empty).
  string next_page_token = 6;
}

// CollectionRoute is one addressable Collection expressed in all three
// ADR-0010 name shapes plus its (backend, bucket) binding. A client that
// holds this table can accept any shape from the end user and normalize to
// canonical (A) on the wire.
message CollectionRoute {
  // canonical (A): storageBackends/{b}/buckets/{bk}/tenants/{tid}/collections/{ok}.
  string canonical = 1;
  // tenant_path (C): tenants/{tid}/collections/{ok}.
  string tenant_path = 2;
  // bare_alias (B): the bare collection. Populated ONLY when this Collection
  // sits in the tenant's default binding — a bare name resolves through that
  // binding, so it round-trips to canonical only for the default route.
  // Empty otherwise.
  string bare_alias = 3;
  string backend = 4;
  string bucket = 5;
}

message ChangePasswordRequest {
  string old_password = 1 [(buf.validate.field).string.min_len = 1];
  string new_password = 2 [(buf.validate.field).string.min_len = 12];
}

message ChangePasswordResponse {}

message ExchangeAudienceRequest {
  // Refresh token from the active session. Validated but NOT consumed.
  string refresh_token = 1 [(buf.validate.field).string.min_len = 1];
  // Target audience: "paladin-data" | "paladin-admin" | "paladin-iam".
  string target_audience = 2 [(buf.validate.field).string.min_len = 1];
}

message ExchangeAudienceResponse {
  // Short-lived access token bound to target_audience. No refresh token
  // is issued — the caller's existing refresh chain is unchanged.
  string access_token = 1;
  int32 access_expires_in_seconds = 2;
  // Always "Bearer" today; reserved for future scoped-token kinds.
  string token_type = 3;
}

message ListMyMembershipsRequest {
  // Pages over memberships, ordered by membership creation (stable across
  // calls). page_token is the previous page's last user id.
  //
  // The server default is deliberately large — 500, where other List RPCs
  // default to 50. This endpoint backs the tenant switcher, and a membership
  // the switcher does not show is a tenant the caller cannot reach, so
  // silently truncating it hides access rather than trimming a display. The
  // page exists to bound the pathological account, not the ordinary one.
  paladin.common.v1.PageRequest page = 1;
}

message Membership {
  string tenant_id = 1;
  string tenant_slug = 2;
  // Roles the caller holds in THIS tenant (per-membership, not global).
  repeated string roles = 3;
  // The user row for this tenant is disabled — the caller cannot switch into
  // it, but it's surfaced so the UI can show why.
  bool disabled = 4;
  // True for the tenant the caller's current session is scoped to.
  bool current = 5;
}

message ListMyMembershipsResponse {
  repeated Membership memberships = 1;
  // next_page_token is the last tenant_slug of this page; empty when
  // exhausted. total_size is not populated.
  paladin.common.v1.PageResponse page = 2;
}

message SwitchTenantRequest {
  // The tenant to switch into. The caller MUST have a (non-disabled) user row
  // there or the call is PermissionDenied.
  string target_tenant_id = 1 [(buf.validate.field).string.min_len = 1];
  // Audience for the new access token. Empty keeps the caller's current
  // audience (so a switch preserves the plane they were working in).
  string requested_audience = 2;
}

message SwitchTenantResponse {
  TokenPair tokens = 1;
  User user = 2;
}
