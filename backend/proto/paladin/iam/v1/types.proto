syntax = "proto3";

package paladin.iam.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/iam/v1;paladiniamv1";

import "google/protobuf/timestamp.proto";
import "paladin/common/v1/scope.proto";

// User is an authenticated identity inside a tenant. Local-IdP form; for
// federated IdPs the row is created on first successful upstream login.
message User {
  // Resource name: "tenants/{tenant_id_or_slug}/users/{user_id}".
  string name = 1;
  string user_id = 2;
  string tenant_id = 3;
  string subject = 4;          // stable login identifier (email / external sub)
  string display_name = 5;
  // Roles drive Cedar evaluation. Reserved values: "platform.admin",
  // "tenant.admin", "bucket.admin", "tenant.user", "mcp.operator".
  repeated string roles = 6;
  repeated paladin.common.v1.Scope scopes = 7;
  bool disabled = 8;
  string resource_version = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp last_login_at = 12;
}

// TokenPair is the OAuth-2-style result of Login / RefreshToken. Both tokens
// are JWT with audience=`paladin-data` (access) / `paladin-iam` (refresh).
message TokenPair {
  string access_token = 1;
  int32 access_expires_in_seconds = 2;
  string refresh_token = 3;
  int32 refresh_expires_in_seconds = 4;
  string token_type = 5; // "Bearer"
}
