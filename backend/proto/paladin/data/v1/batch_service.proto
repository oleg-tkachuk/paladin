syntax = "proto3";

package paladin.data.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/data/v1;paladindatav1";

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "google/api/field_behavior.proto";

// BatchService — async bulk operations. All RPCs return an Operation; clients
// poll OperationService.GetOperation for status.
service BatchService {
  // BatchDeleteObjects starts an asynchronous operation and returns it
  // immediately — poll OperationService.GetOperation for progress. Partial
  // failure is reported per object in the operation result, not as an RPC
  // error.
  rpc BatchDeleteObjects(BatchDeleteObjectsRequest) returns (Operation);
  // BatchCopyObjects starts an asynchronous copy. Compensating deletes run for
  // objects already copied if the operation is cancelled part-way.
  rpc BatchCopyObjects(BatchCopyObjectsRequest) returns (Operation);
  // BatchRestoreObjects starts an asynchronous restore of soft-deleted objects.
  // Objects that are not in the trash are reported as skipped, not failed.
  rpc BatchRestoreObjects(BatchRestoreObjectsRequest) returns (Operation);
  // BatchUpdateTags starts an asynchronous tag merge across the named objects.
  // Same merge semantics as PutObjectTags, applied per object.
  rpc BatchUpdateTags(BatchUpdateTagsRequest) returns (Operation);
}

// Operation mirrors the admin-plane definition; copied here so the data
// plane is self-contained for client codegen.
message Operation {
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string type = 2;
  google.protobuf.Any metadata = 3;
  bool done = 4;
  oneof result {
    google.rpc.Status error = 5;
    google.protobuf.Any response = 6;
  }
  google.protobuf.Timestamp created_at = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp updated_at = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ObjectSelector {
  // Explicit object resource names. Capped at 100 for synchronous validation;
  // larger sets must use `filter`.
  repeated string names = 1 [(buf.validate.field).repeated.max_items = 100];
  // CEL filter evaluated lazily inside the worker.
  string filter = 2;
}

message BatchDeleteObjectsRequest {
  // Parent Collection: "tenants/{tenant_id_or_slug}/collections/{ok}".
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  ObjectSelector selector = 2 [(buf.validate.field).required = true];
  // NOT SUPPORTED: the batch executor soft-deletes. Setting this returns

  // Unimplemented rather than quietly soft-deleting — a caller told its

  // erasure succeeded when the objects are still in the trash is worse off

  // than one told it cannot be done here. Use DeleteObject per object.

  bool permanent = 3;
}

message BatchCopyObjectsRequest {
  // Source parent Collection.
  string source_parent = 1 [(buf.validate.field).string.min_len = 1];
  ObjectSelector selector = 2 [(buf.validate.field).required = true];
  // Destination Collection resource name.
  string destination_collection = 3 [(buf.validate.field).string.min_len = 1];
  // CEL expression evaluated against each source Object to compute dest key.
  string destination_key_template = 4 [(buf.validate.field).string.min_len = 1];
}

message BatchRestoreObjectsRequest {
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  ObjectSelector selector = 2 [(buf.validate.field).required = true];
}

message BatchUpdateTagsRequest {
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  ObjectSelector selector = 2 [(buf.validate.field).required = true];
  map<string, string> tags = 3;
  // When true, replace the existing tag set; else merge.
  bool replace = 4;
}
