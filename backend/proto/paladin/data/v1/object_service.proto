syntax = "proto3";

package paladin.data.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/data/v1;paladindatav1";

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "paladin/common/v1/pagination.proto";
import "paladin/common/v1/resource.proto";
import "paladin/data/v1/types.proto";

// ObjectService is the canonical data-plane API. Paladin never proxies bytes —
// every upload/download happens directly between the client and the storage
// backend via presigned URLs returned by these RPCs.
service ObjectService {
  rpc UploadObject(UploadObjectRequest) returns (UploadObjectResponse);

  rpc DownloadObject(DownloadObjectRequest) returns (DownloadObjectResponse);

  rpc GetObject(GetObjectRequest) returns (Object);

  // LookupObject resolves an Object by (collection, key) instead of object_id.
  rpc LookupObject(LookupObjectRequest) returns (Object);

  rpc UpdateObject(UpdateObjectRequest) returns (Object);

  // CompleteObject is no-op for IMPLICIT completion mode and the event has
  // already arrived; otherwise promotes PENDING → AVAILABLE after HEAD verify.
  rpc CompleteObject(CompleteObjectRequest) returns (Object);

  rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);

  rpc RestoreObject(RestoreObjectRequest) returns (Object);

  rpc CopyObject(CopyObjectRequest) returns (Object);

  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

  rpc CountObjects(CountObjectsRequest) returns (CountObjectsResponse);

  // ─── Versioning (opt-in per bucket) ──────────────────────────────────────
  // ListObjectVersions returns the immutable history of an object. Empty
  // when the parent bucket has versioning disabled.
  rpc ListObjectVersions(ListObjectVersionsRequest) returns (ListObjectVersionsResponse);

  // GetObjectVersion fetches metadata for a specific version.
  rpc GetObjectVersion(GetObjectVersionRequest) returns (ObjectVersion);

  // RestoreObjectVersion makes the named version `current` again. The
  // current version becomes a non-current entry preserving lock state.
  rpc RestoreObjectVersion(RestoreObjectVersionRequest) returns (Object);

  // ─── Object Lock (ADR-0013) ──────────────────────────────────────────────
  //
  // Retention and legal hold are separate operations because their rules
  // differ, which is also how S3 splits them. A legal hold can be lifted by
  // anyone authorised to set it; a retention window can only ever be extended
  // unless the mode is GOVERNANCE and the caller holds the bypass role.
  //
  // Locks attach to a VERSION, not to an object. On an unversioned bucket the
  // object has exactly one version, so the distinction is invisible; on a
  // versioned one it is the difference between protecting a document and
  // protecting today's copy of it.

  // SetObjectRetention applies or extends a retention window on an object's
  // current version. Requires the parent bucket to have object lock enabled.
  rpc SetObjectRetention(SetObjectRetentionRequest) returns (ObjectLockState);

  // SetObjectLegalHold turns a legal hold on or off. A hold blocks deletion
  // for as long as it is on, independently of any retention window, and is
  // not subject to the GOVERNANCE bypass.
  rpc SetObjectLegalHold(SetObjectLegalHoldRequest) returns (ObjectLockState);

  // GetObjectLock reads the current lock state. Returns an empty state — not
  // NOT_FOUND — for an object with no lock, so callers can render "unlocked"
  // without special-casing an error.
  rpc GetObjectLock(GetObjectLockRequest) returns (ObjectLockState);
}

// ─── Versioning ─────────────────────────────────────────────────────────────

message ObjectVersion {
  // Resource name: "tenants/{tenant_id_or_slug}/collections/{ok}/objects/{id}/versions/{ver}".
  string name = 1;
  string version_id = 2;
  string object_id = 3;
  bool is_delete_marker = 4;
  string storage_path = 5;
  int64 size_bytes = 6;
  string etag = 7;
  ChecksumDigest checksum = 8;
  string content_type = 9;
  map<string, string> metadata = 10;
  map<string, string> tags = 11;
  ObjectLockState lock = 12;
  google.protobuf.Timestamp created_at = 13;
  bool is_current = 14;
}

message ListObjectVersionsRequest {
  // Object resource name (parent of the versions collection).
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  paladin.common.v1.PageRequest page = 2;
}

message ListObjectVersionsResponse {
  repeated ObjectVersion versions = 1;
  paladin.common.v1.PageResponse page = 2;
}

message GetObjectVersionRequest {
  // Resource name: "tenants/{tenant_id_or_slug}/collections/{ok}/objects/{id}/versions/{ver}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreObjectVersionRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: expected_version=0 disables the check in SQL, so an
  //   absent guard would restore over a concurrent change instead of
  //   failing. This is the CURRENT object's version, not the version being
  //   restored — the console takes it from the object the versions tab is
  //   showing.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
}

// ─── Upload ─────────────────────────────────────────────────────────────────

message UploadObjectRequest {
  // Parent Collection: "tenants/{tenant_id_or_slug}/collections/{ok}".
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2; // empty → server uses object_id as key
  string content_type = 3 [(buf.validate.field).string.min_len = 1];
  int64 size_hint_bytes = 4;
  // UNSPECIFIED is allowed and means "let the server pick" — handler
  // resolves the empty value to SHA256 (the data-plane default the
  // PresignedPUT verification path expects). The earlier
  // `not_in: [0]` rule was failing every JSON client that omits
  // enum-zero on the wire, including stale browser bundles.
  paladin.common.v1.ChecksumAlgorithm checksum_algorithm = 5
      [(buf.validate.field).enum = {defined_only: true}];
  map<string, string> metadata = 6;
  map<string, string> tags = 7;
  string external_ref = 8;
  PresignTransport transport = 9;
  // Idempotency key — if a request with the same key is replayed, the
  // server returns the cached response instead of creating a duplicate.
  string idempotency_key = 10;
}

enum PresignTransport {
  PRESIGN_TRANSPORT_UNSPECIFIED = 0;
  PRESIGN_TRANSPORT_PUT = 1;
  PRESIGN_TRANSPORT_POST = 2;
}

message UploadObjectResponse {
  Object object = 1;
  paladin.common.v1.PresignedUrl upload_url = 2;
  paladin.common.v1.CompletionMode completion_mode = 3;
}

// ─── Download ───────────────────────────────────────────────────────────────

message DownloadObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Duration ttl = 2;
  string content_disposition = 3;
}

message DownloadObjectResponse {
  Object object = 1;
  paladin.common.v1.PresignedUrl download_url = 2;
}

// ─── Get / Lookup ───────────────────────────────────────────────────────────

message GetObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message LookupObjectRequest {
  // Parent Collection — required to disambiguate `key` lookups.
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  string key = 2 [(buf.validate.field).string.min_len = 1];
}

// ─── Update ─────────────────────────────────────────────────────────────────

message UpdateObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  map<string, string> metadata = 4;
  map<string, string> tags = 5;
  string content_type = 6;
  string external_ref = 7;
}

// ─── Complete ───────────────────────────────────────────────────────────────

message CompleteObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string etag = 2;
  string checksum_value = 3;
}

// ─── Delete / Restore ───────────────────────────────────────────────────────

message DeleteObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind delete
  //   (expected_version=0 disables the check in SQL). permanent and
  //   bypass_governance_retention widen what is destroyed; neither is an
  //   opt-out of the concurrency check.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  bool permanent = 3;
  // Only honored when the caller has GOVERNANCE bypass (role
  // `lock.governance.bypass` or `platform.admin`), and only against a
  // GOVERNANCE window — legal hold and COMPLIANCE are absolute. The server
  // sets `paladin.bypass_governance_retention` for the deletion transaction;
  // the trigger on object_locks reads it before refusing to drop a locked
  // row.
  bool bypass_governance_retention = 4;
}

message DeleteObjectResponse {
  Object object = 1;
}

// ─── Object Lock ────────────────────────────────────────────────────────────

message SetObjectRetentionRequest {
  // Object resource name: "tenants/{tenant}/collections/{ok}/objects/{id}".
  string name = 1 [(buf.validate.field).string.min_len = 1];

  // GOVERNANCE | COMPLIANCE. Required.
  //
  // COMPLIANCE cannot be downgraded to GOVERNANCE and its window cannot be
  // shortened by anyone, including a platform admin — that is what makes it
  // usable as a regulatory control rather than a strong suggestion.
  string mode = 2 [(buf.validate.field).string = {
    in: [
      "GOVERNANCE",
      "COMPLIANCE"
    ]
  }];

  // When the retention expires. Must be in the future, and must not be
  // earlier than an existing window unless the current mode is GOVERNANCE
  // and bypass_governance_retention is set.
  google.protobuf.Timestamp retain_until = 3 [(buf.validate.field).required = true];

  // Permits shortening or clearing an active GOVERNANCE window. Requires role
  // `lock.governance.bypass` or `platform.admin`. Ignored when the existing
  // window is COMPLIANCE, which no role can shorten.
  bool bypass_governance_retention = 4;
}

message SetObjectLegalHoldRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  bool legal_hold = 2;
}

message GetObjectLockRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message RestoreObjectRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: expected_version=0 disables the check in SQL, so an
  //   absent guard would restore over a concurrent change instead of
  //   failing. The console reads the version from the trash listing,
  //   which shows it in a Version column.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
}

// ─── Copy ───────────────────────────────────────────────────────────────────

message CopyObjectRequest {
  string source_name = 1 [(buf.validate.field).string.min_len = 1];
  // Destination Collection resource name.
  string destination_collection = 2 [(buf.validate.field).string.min_len = 1];
  string destination_key = 3 [(buf.validate.field).string.min_len = 1];
  optional MetadataOverride metadata_override = 4;
  optional TagsOverride tags_override = 5;
}

message MetadataOverride { map<string, string> metadata = 1; }
message TagsOverride     { map<string, string> tags = 1; }

// ─── List / Count ───────────────────────────────────────────────────────────

message ListObjectsRequest {
  // Parent Collection: "tenants/{tenant_id_or_slug}/collections/{ok}".
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  paladin.common.v1.PageRequest page = 2;
  string filter = 3;
  string order_by = 4;
  paladin.common.v1.SortOrder sort_order = 5;
}

message ListObjectsResponse {
  repeated Object objects = 1;
  paladin.common.v1.PageResponse page = 2;
}

message CountObjectsRequest {
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  string filter = 2;
}

message CountObjectsResponse {
  int64 approximate_count = 1;
  bool exact = 2;
}
