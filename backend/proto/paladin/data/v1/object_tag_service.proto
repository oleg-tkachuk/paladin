syntax = "proto3";

package paladin.data.v1;

option go_package = "github.com/oleg-tkachuk/paladin/backend/internal/api/pb/data/v1;paladindatav1";

import "buf/validate/validate.proto";
import "paladin/common/v1/pagination.proto";

// ObjectTagService isolates the tag-only path so callers can be granted
// "TagObject" without "UpdateObject" — common pattern for downstream
// classification systems.
service ObjectTagService {
  // GetObjectTags returns the object's tag map.
  rpc GetObjectTags(GetObjectTagsRequest) returns (GetObjectTagsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // PutObjectTags merges the supplied keys into the object's tags; keys absent
  // from the request are left alone. resource_version is required.
  rpc PutObjectTags(PutObjectTagsRequest) returns (PutObjectTagsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteObjectTags removes the named keys. Deleting a key that is not set is
  // not an error. resource_version is required.
  rpc DeleteObjectTags(DeleteObjectTagsRequest) returns (DeleteObjectTagsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ListDistinctTags enumerates the distinct tag key→values present across an
  // Collection's live objects, so a UI can populate a tag-facet filter from the
  // whole tenant scope rather than only the objects on the current page.
  rpc ListDistinctTags(ListDistinctTagsRequest) returns (ListDistinctTagsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message ListDistinctTagsRequest {
  // Parent Collection scope: "tenants/{tenant_id}/collections/{collection}".
  // The tenant is enforced from the auth context; this narrows the distinct
  // scan to one Collection's objects.
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  // Pages over tag KEYS, ordered ascending; page_token is the last key of the
  // previous page. Values within a key are capped separately — see
  // TagValues.truncated — because a single key can hold far more values than
  // a page of keys.
  //
  // This RPC was unbounded before: it returned every key and every value in
  // one response, and nothing in the schema said the caller should expect
  // otherwise.
  paladin.common.v1.PageRequest page = 2;
}

message ListDistinctTagsResponse {
  // Tag key → the distinct values observed for that key across the scope,
  // each value list sorted ascending.
  map<string, TagValues> tags = 1;
  // next_page_token carries the last key of this page; empty means the keys
  // are exhausted. total_size is not populated — counting distinct keys costs
  // the same scan as returning them.
  paladin.common.v1.PageResponse page = 2;
}

message TagValues {
  repeated string values = 1;
  // The value list was capped by the server and more values exist for this
  // key. There is no cursor for values: a facet UI that hits this should
  // filter rather than page, and a caller that needs them all should query
  // the objects directly.
  bool truncated = 2;
}

message GetObjectTagsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message GetObjectTagsResponse {
  map<string, string> tags = 1;
}

message PutObjectTagsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  // Replaces the entire tag set.
  map<string, string> tags = 3;
}

message PutObjectTagsResponse {
  map<string, string> tags = 1;
}

message DeleteObjectTagsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  // If empty, all tags are removed; otherwise only the listed keys.
  repeated string keys = 3;
}

message DeleteObjectTagsResponse {
  map<string, string> tags = 1;
}
