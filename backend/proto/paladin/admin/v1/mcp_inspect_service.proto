syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/admin/v1;paladinadminv1";

import "google/protobuf/timestamp.proto";
import "paladin/common/v1/pagination.proto";
import "google/api/field_behavior.proto";

// MCPInspectService — read-only operator visibility into the MCP
// (Model Context Protocol) bridge. The MCP plane sits between agentic
// runtimes (Claude Desktop, Cursor, Hatchet workers) and the Paladin
// Connect API; what tools agents see, which are denied, and which
// upstreams the bridge dispatches to is config + built-in defaults
// merged at boot. This service flattens that resolution so an admin
// UI can render the *effective* surface without re-implementing the
// merge logic.
//
// Stateless: every Inspect call returns the same data unless the
// operator hot-reloads config (no hot-reload today, but the response
// shape allows for it).
//
// Authorisation: platform-admin only — same gate as the rest of
// admin/v1 services.
service MCPInspectService {
  // Inspect reports the MCP server's effective configuration: the active
  // profile, the tool catalog it exposes, and the upstream planes it dials.
  rpc Inspect(MCPInspectRequest) returns (MCPInspectResponse);

  // ListSessions returns the live MCP streamable-HTTP sessions tracked by the
  // bridge (id, agent, activity counts). Unlike Inspect (config-derived,
  // stateless) this reflects live process state that lives in the MCP server,
  // so the admin plane proxies the call to the MCP server's own /sessions
  // endpoint. Returns an empty list when the MCP server is unconfigured or
  // unreachable. Platform-admin only.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
}

message MCPInspectRequest {}

message ListSessionsRequest {
  // Pages over live MCP sessions, ordered by session start (ties broken by
  // session id). page_token is the previous page's last session id. The
  // registry is bounded only by the idle reaper — nothing the caller controls
  // — so the page is what keeps this response bounded.
  paladin.common.v1.PageRequest page = 1;
}

message ListSessionsResponse {
  repeated MCPSession sessions = 1;
  // next_page_token is the last session id of this page; empty when
  // exhausted. total_size is not populated.
  paladin.common.v1.PageResponse page = 2;
}

// MCPSession mirrors internal/mcp.SessionInfo — one live streamable-HTTP
// session. agent_subject is best-effort (blank until the MCP server verifies
// the per-request JWT subject); counts are cumulative over the session life.
message MCPSession {
  string id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string agent_subject = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp started_at = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp last_seen = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 tool_call_count = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  int64 request_count = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message MCPInspectResponse {
  // Profiles is the merged map: built-in DefaultProfiles overlaid by
  // operator overrides from cfg.MCP.Profiles. Keys are profile names
  // (read_only, agent_safe, admin, plus operator-defined).
  repeated MCPProfile profiles = 1;

  // AlwaysDeny is the global blacklist applied AFTER profile
  // expansion. cfg.MCP.AlwaysDeny when set; otherwise the built-in
  // DefaultAlwaysDeny.
  repeated string always_deny = 2;

  // ToolCatalog is the full list of MCP tools the bridge registers.
  // Mirrors internal/mcp.DefaultCatalog. Per-tool metadata lets the
  // UI explain what the tool does + which plane it dispatches to.
  repeated MCPTool tool_catalog = 3;

  // Upstreams reflects cfg.MCP.Upstreams. Not secrets; the per-
  // request bearer token is what gates access.
  MCPUpstreams upstreams = 4;

  // Transports describes which MCP transports are enabled and their
  // active profile.
  MCPTransports transports = 5;
}

message MCPProfile {
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Tools is the resolved allow-list with patterns expanded — every
  // tool name actually visible under this profile after the catalog
  // is filtered. Patterns themselves (with wildcards) are exposed
  // separately for operator audit.
  repeated string tools = 2;
  // RawPatterns is what the operator actually wrote in config (or
  // the built-in default), trailing-* wildcards intact.
  repeated string raw_patterns = 3;
  // Deny is the per-profile deny list (rare; usually empty).
  repeated string deny = 4;
  // Source: "built_in" | "user_override" | "user_only" — which layer
  // the profile came from. Operators can confirm their override
  // landed by looking for "user_override".
  string source = 5;
}

message MCPTool {
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Audience: "admin" | "data" | "iam" — which Paladin plane the
  // underlying Connect call lands on.
  string audience = 2;
  string description = 3;
  // CapabilityOp is the capability.Op the caller's capability must
  // include for the call to succeed. Empty when JWT-only.
  string capability_op = 4;
  // Mutates is true when the tool issues a state-changing RPC.
  // UI flags these for visual emphasis; deny-list candidates by
  // default.
  bool mutates = 5;
}

message MCPUpstreams {
  string admin_url = 1;
  string data_url = 2;
  string iam_url = 3;
}

message MCPTransports {
  MCPTransportStdio stdio = 1;
  MCPTransportHTTP http = 2;
}

message MCPTransportStdio {
  bool enabled = 1;
  string profile = 2;
}

message MCPTransportHTTP {
  bool enabled = 1;
  string addr = 2;
  string profile = 3;
  // Session timeout in seconds; 0 = no timeout.
  int64 session_timeout_seconds = 4;
}
