syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";

// BackendService manages physical storage backends. Exclusive to platform
// admins; bucket admins use ListBackends (read-only) to pick a target.
service BackendService {
  rpc CreateBackend(CreateBackendRequest) returns (StorageBackend);
  rpc GetBackend(GetBackendRequest) returns (StorageBackend);
  rpc UpdateBackend(UpdateBackendRequest) returns (StorageBackend);
  rpc DeleteBackend(DeleteBackendRequest) returns (DeleteBackendResponse);
  rpc ListBackends(ListBackendsRequest) returns (ListBackendsResponse);

  // RotateCredentials swaps the credentials_secret_ref. The previous secret
  // remains valid for `grace_period` so in-flight presigns don't break.
  rpc RotateCredentials(RotateCredentialsRequest) returns (StorageBackend);

  // TestBackend performs a connectivity probe (HEAD / list-buckets). Read-only.
  rpc TestBackend(TestBackendRequest) returns (TestBackendResponse);

  // SetBackendEnabled flips the backend's enabled state. Idempotent
  // (setting the current state is a no-op success). OCC-guarded via
  // resource_version. Disabling the configured default backend is
  // refused (FailedPrecondition).
  rpc SetBackendEnabled(SetBackendEnabledRequest) returns (StorageBackend);

  // SetBackendReadOnly flips the backend's read-only "drain" state
  // (migration 047). Idempotent, OCC-guarded via resource_version. Only
  // meaningful on an enabled backend: reads keep working, mutations are
  // refused so an operator can migrate data off before disabling.
  rpc SetBackendReadOnly(SetBackendReadOnlyRequest) returns (StorageBackend);

  // SetBackendMaintenance raises/clears the operator-set, advisory
  // maintenance flag (migration 049). Idempotent, OCC-guarded via
  // resource_version. Advisory — it does not gate operations.
  rpc SetBackendMaintenance(SetBackendMaintenanceRequest) returns (StorageBackend);
}

message CreateBackendRequest {
  string backend_id = 1 [(buf.validate.field).string.min_len = 1];
  StorageBackend backend = 2 [(buf.validate.field).required = true];
}

message GetBackendRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateBackendRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  StorageBackend backend = 4;
}

message DeleteBackendRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  // Refuse delete when buckets still reference the backend.
  bool force = 3;
}

message DeleteBackendResponse {}

message ListBackendsRequest {
  paladin.common.v1.PageRequest page = 1;
  string filter = 2; // CEL over StorageBackend
}

message ListBackendsResponse {
  repeated StorageBackend backends = 1;
  paladin.common.v1.PageResponse page = 2;
}

message RotateCredentialsRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string new_secret_ref = 2 [(buf.validate.field).string.min_len = 1];
  // After this period the old secret is removed from cache.
  string grace_period = 3; // duration as RFC3339-style or "30m"
}

message TestBackendRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message TestBackendResponse {
  bool reachable = 1;
  string error_message = 2;
  int32 latency_ms = 3;
}

message SetBackendEnabledRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1]; // "storageBackends/{backend_id}"
  bool enabled = 2;
  string resource_version = 3 [(buf.validate.field).string.min_len = 1]; // OCC, required
}

message SetBackendReadOnlyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1]; // "storageBackends/{backend_id}"
  bool read_only = 2;
  string resource_version = 3 [(buf.validate.field).string.min_len = 1]; // OCC, required
}

message SetBackendMaintenanceRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1]; // "storageBackends/{backend_id}"
  bool maintenance = 2;
  string resource_version = 3 [(buf.validate.field).string.min_len = 1]; // OCC, required
}
