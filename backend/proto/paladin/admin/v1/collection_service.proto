syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";

// CollectionService manages tenant-scoped logical namespaces and their
// binding to physical buckets. Tenant admins manage their own collections;
// platform admins can manage cross-tenant.
service CollectionService {
  rpc CreateCollection(CreateCollectionRequest) returns (Collection);
  rpc GetCollection(GetCollectionRequest) returns (Collection);
  rpc UpdateCollection(UpdateCollectionRequest) returns (Collection);
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);

  rpc SetCollectionPolicy(SetCollectionPolicyRequest) returns (Collection);

  // BindCollectionToBucket / RebindCollection is intentionally distinct from
  // UpdateCollection — re-binding has data-locality implications worth a
  // separate audit entry.
  rpc BindCollectionToBucket(BindCollectionToBucketRequest) returns (Collection);
}

message CreateCollectionRequest {
  // Parent: "tenants/{tenant_id_or_slug}".
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  string collection = 2 [(buf.validate.field).string = {min_len: 1, max_len: 63}];
  Collection collection_resource = 3 [(buf.validate.field).required = true];
}

message GetCollectionRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateCollectionRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  Collection collection_resource = 4;
}

message DeleteCollectionRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  bool force = 3; // refuse when non-DELETED objects exist unless force=true
}

message DeleteCollectionResponse {}

message ListCollectionsRequest {
  string parent = 1; // "tenants/{tenant_id_or_slug}" or empty for cross-tenant
  paladin.common.v1.PageRequest page = 2;
  string filter = 3;
  // bucket — optional server-side narrow to Collections bound to a
  // specific (backend, bucket) pair. Resource-name form
  // "storageBackends/{backend_id}/buckets/{bucket_id}". When set
  // with an empty parent, the request becomes a cross-tenant scan
  // over that bucket — gated to platform.admin server-side. Used by
  // the storage-first UI browser to avoid pulling every OK
  // platform-wide just to client-filter a handful per bucket.
  string bucket = 4;
}

message ListCollectionsResponse {
  repeated Collection collections = 1;
  paladin.common.v1.PageResponse page = 2;
}

message SetCollectionPolicyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  string cedar_policy = 3;
}

message BindCollectionToBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  // Target bucket resource name.
  string bucket = 3 [(buf.validate.field).string.min_len = 1];
}
