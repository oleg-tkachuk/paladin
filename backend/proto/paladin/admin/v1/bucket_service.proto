syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";

// BucketService manages physical S3 buckets. Bucket admins create buckets
// and bind them to backends; tenant admins consume them via Collection.
service BucketService {
  rpc CreateBucket(CreateBucketRequest) returns (Bucket);
  rpc GetBucket(GetBucketRequest) returns (Bucket);
  rpc UpdateBucket(UpdateBucketRequest) returns (Bucket);
  rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse);
  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse);

  // SetBucketPolicy sets/replaces the Cedar policy text. Validated synchronously.
  rpc SetBucketPolicy(SetBucketPolicyRequest) returns (Bucket);

  // SetLifecycleRules / SetObjectLock / SetVersioning / SetReplication are
  // single-purpose RPCs to keep audit log entries focused.
  rpc SetLifecycleRules(SetLifecycleRulesRequest) returns (Bucket);
  rpc SetObjectLock(SetObjectLockRequest) returns (Bucket);
  rpc SetVersioning(SetVersioningRequest) returns (Bucket);
  rpc SetReplication(SetReplicationRequest) returns (Bucket);

  // ListAccessibleBuckets is callable by tenant admins. Returns only buckets
  // the caller's principal/scopes are allowed to bind Collections to.
  rpc ListAccessibleBuckets(ListAccessibleBucketsRequest) returns (ListBucketsResponse);
}

message CreateBucketRequest {
  // Parent: "storageBackends/{backend_id}".
  string parent = 1 [(buf.validate.field).string.min_len = 1];
  string bucket_id = 2 [(buf.validate.field).string = {min_len: 3, max_len: 63}];
  Bucket bucket = 3 [(buf.validate.field).required = true];
  // When true, Paladin also calls the backend to physically create the bucket.
  // When false, the bucket is assumed to exist out-of-band.
  bool provision_on_backend = 4;
}

message GetBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  Bucket bucket = 4;
}

message DeleteBucketRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC guard. Required unless force=true — see the note on force.
  string resource_version = 2;
  // When true, also removes the physical bucket (and is a destructive op).
  bool delete_on_backend = 3;
  // Explicit opt-out of the OCC guard, matching DeleteTenant / DeleteBackend.
  //
  // This used to be spelled `delete_on_backend`, which inverted the intended
  // risk gradient: the single most destructive form of this call — the one
  // that also erases the physical bucket — was the only one that skipped the
  // concurrency check. The two decisions are unrelated and now have separate
  // flags.
  bool force = 4;
}

message DeleteBucketResponse {}

message ListBucketsRequest {
  // Parent: "storageBackends/{backend_id}" or empty for cross-backend.
  string parent = 1;
  paladin.common.v1.PageRequest page = 2;
  string filter = 3; // CEL over Bucket (reserved — not yet evaluated)
  // owner_tenant_id narrows the listing to buckets owned by exactly
  // this tenant (matches buckets.owner_tenant_id). UUID or slug;
  // empty = no tenant filter (cross-tenant listing for platform-
  // admin). Backed by the partial index on
  // buckets(owner_tenant_id) WHERE owner_tenant_id IS NOT NULL
  // (migration 006), so per-tenant lookups are cheap.
  string owner_tenant_id = 4;
}

message ListBucketsResponse {
  repeated Bucket buckets = 1;
  paladin.common.v1.PageResponse page = 2;
}

message SetBucketPolicyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  string cedar_policy = 3;
}

message SetLifecycleRulesRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  repeated LifecycleRule rules = 3;
}

message SetObjectLockRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  ObjectLockConfig config = 3 [(buf.validate.field).required = true];
}

message SetVersioningRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  BucketVersioning versioning = 3 [(buf.validate.field).required = true];
}

message SetReplicationRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  BucketReplication replication = 3 [(buf.validate.field).required = true];
}

message ListAccessibleBucketsRequest {
  // Tenant: "tenants/{tenant_id_or_slug}". Required.
  string tenant = 1 [(buf.validate.field).string.min_len = 1];
  paladin.common.v1.PageRequest page = 2;
}
