syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";

// TenantService manages tenants. Platform-admin only.
service TenantService {
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  rpc GetTenant(GetTenantRequest) returns (Tenant);
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant);
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);

  rpc SetInheritedPolicy(SetInheritedPolicyRequest) returns (Tenant);

  // RenameTenantSlug rewrites the tenant's `slug` and rewrites every
  // `Tenant::"<old_slug>"` reference in the tenant's
  // inherited_cedar_policy AND in every object_key's cedar_policy to
  // `Tenant::"<new_slug>"`. Single transaction, OCC-guarded against
  // the supplied resource_version. Returns the renamed Tenant.
  rpc RenameTenantSlug(RenameTenantSlugRequest) returns (Tenant);
}

message CreateTenantRequest {
  // tenant_id — optional. When empty the server generates a fresh
  // UUIDv7. When non-empty it must be a valid RFC 4122 UUID and not
  // the zero UUID. Immutable post-create (enforced by migration 033's
  // tenants_immutable_columns trigger).
  string tenant_id = 1;
  // tenant.slug is required and validated against ValidateTenantSlug.
  // tenant.display_name is optional; defaults to slug at create time.
  // Both are unique across tenants. tenant_id, slug — immutable;
  // display_name — editable via UpdateTenant.
  Tenant tenant = 2 [(buf.validate.field).required = true];
}

message GetTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  Tenant tenant = 4;
}

message DeleteTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  // Refuse delete when object_keys/users/api_keys still reference the tenant.
  bool force = 3;
}

message DeleteTenantResponse {}

message ListTenantsRequest {
  paladin.common.v1.PageRequest page = 1;
  string filter = 2;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  paladin.common.v1.PageResponse page = 2;
}

message SetInheritedPolicyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string resource_version = 2;
  string cedar_policy = 3;
}

message RenameTenantSlugRequest {
  // name — "tenants/{tenant_id_or_slug}". Phase 3 path: slug-aware.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // resource_version — current tenant version, OCC-guarded.
  string resource_version = 2;
  // new_slug — kebab-case, validated by the same rules as
  // CreateTenantRequest.slug. Uniqueness enforced by the database.
  string new_slug = 3 [(buf.validate.field).string.min_len = 1];
}
