syntax = "proto3";

package paladin.admin.v1;

option go_package = "github.com/oleg-tkachuk/paladin/internal/api/pb/admin/v1;paladinadminv1";

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "paladin/admin/v1/types.proto";
import "paladin/common/v1/pagination.proto";
import "google/api/field_behavior.proto";

// TenantService manages tenants. Platform-admin only.
service TenantService {
  // CreateTenant provisions a tenant and, unless the request opts out, its
  // default storage binding. storage_layout="dedicated" also provisions a
  // physical bucket owned by the tenant (ADR-0011). AlreadyExists when the
  // slug is taken.
  rpc CreateTenant(CreateTenantRequest) returns (Tenant);
  // GetTenant accepts either the UUID or the slug in the resource name.
  // Soft-deleted tenants are returned — check deleted_at — so the trash view
  // can show them.
  rpc GetTenant(GetTenantRequest) returns (Tenant) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // UpdateTenant applies update_mask to display_name, labels and
  // inherited_cedar_policy. tenant_id and slug are immutable (use
  // RenameTenantSlug for the latter); resource_version is required and a stale
  // one is Aborted.
  rpc UpdateTenant(UpdateTenantRequest) returns (Tenant) {
    option idempotency_level = IDEMPOTENT;
  }
  // DeleteTenant is a SOFT delete (sets `deleted_at`), always: the row
  // remains recoverable via RestoreTenant within the retention window.
  // There is no flag that skips the trash — removing the row physically
  // is PurgeTenant, a second call that names what it does. Automated
  // cleanups and emergency-purge flows therefore make both calls.
  rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  // ListTenants excludes soft-deleted tenants unless include_trashed or
  // only_trashed is set.
  rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // SetInheritedPolicy replaces the Cedar policy every collection and bucket
  // under the tenant inherits. Validated before it is stored — an unparseable
  // policy is InvalidArgument, not a tenant that denies everything.
  rpc SetInheritedPolicy(SetInheritedPolicyRequest) returns (Tenant) {
    option idempotency_level = IDEMPOTENT;
  }

  // RestoreTenant clears `deleted_at` on a soft-deleted row, returning
  // it to the active set. Slug + display_name UNIQUE constraints still
  // apply across both active and trashed rows (see migration 036
  // commentary) — if a new tenant claimed the slug while this one was
  // trashed, restore fails with ALREADY_EXISTS and the operator must
  // rename one side first.
  rpc RestoreTenant(RestoreTenantRequest) returns (Tenant);

  // PurgeTenant hard-deletes a soft-deleted row. Refuses to operate on
  // an active tenant (operators have to soft-delete first) so the
  // two-step recovery window is preserved by default. Idempotent on
  // a missing row.
  rpc PurgeTenant(PurgeTenantRequest) returns (PurgeTenantResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RenameTenantSlug rewrites the tenant's `slug` and rewrites every
  // `Tenant::"<old_slug>"` reference in the tenant's
  // inherited_cedar_policy AND in every collection's cedar_policy to
  // `Tenant::"<new_slug>"`. Single transaction, OCC-guarded against
  // the supplied resource_version. Returns the renamed Tenant.
  rpc RenameTenantSlug(RenameTenantSlugRequest) returns (Tenant);

  // MigrateTenantStorageLayout switches a `shared` tenant to `dedicated`
  // (ADR-0011 Phase 3). It provisions the tenant's own bucket and starts an
  // async copy job that server-side-copies every object into it, then rebinds
  // the collections and flips the layout. Returns the initial migration status;
  // poll GetTenantStorageMigration for progress. FAILED_PRECONDITION if the
  // tenant is not currently `shared` or a migration is already in flight.
  rpc MigrateTenantStorageLayout(MigrateTenantStorageLayoutRequest) returns (StorageMigrationStatus);

  // GetTenantStorageMigration returns the current migration status for a
  // tenant, or NOT_FOUND if none was ever started.
  rpc GetTenantStorageMigration(GetTenantStorageMigrationRequest) returns (StorageMigrationStatus) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ResolveRenamedSlug maps a no-longer-valid tenant slug to the slug it was
  // renamed to, so a 404 on an old `/tenants/<old-slug>/...` URL can offer a
  // "did you mean <new-slug>?" redirect. Unlike the rest of TenantService this
  // is NOT platform-admin gated — it authorizes by READ access to the resolved
  // target tenant, so an ordinary member of that tenant can follow a stale
  // link. Every failure (no rename history, outside the grace window, or
  // read-denied) collapses to NOT_FOUND so the endpoint cannot be used to
  // enumerate slug→tenant mappings.
  rpc ResolveRenamedSlug(ResolveRenamedSlugRequest) returns (ResolveRenamedSlugResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetTenantDefaultBinding returns the tenant's default (backend, bucket)
  // route used to complete the bare collection name shape (ADR-0010 Phase 3).
  // NOT_FOUND when the tenant has no binding set.
  rpc GetTenantDefaultBinding(GetTenantDefaultBindingRequest) returns (TenantDefaultBinding);

  // SetTenantDefaultBinding upserts the tenant's default route. The
  // (backend, bucket) MUST reference an existing bucket.
  rpc SetTenantDefaultBinding(SetTenantDefaultBindingRequest) returns (TenantDefaultBinding) {
    option idempotency_level = IDEMPOTENT;
  }

  // ClearTenantDefaultBinding removes the tenant's default route; bare
  // collection names for that tenant then fail with FAILED_PRECONDITION.
  rpc ClearTenantDefaultBinding(ClearTenantDefaultBindingRequest) returns (ClearTenantDefaultBindingResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

message CreateTenantRequest {
  // tenant_id — optional. When empty the server generates a fresh
  // UUIDv7. When non-empty it must be a valid RFC 4122 UUID and not
  // the zero UUID. Immutable post-create (enforced by migration 033's
  // tenants_immutable_columns trigger).
  string tenant_id = 1;
  // tenant.slug is required and validated against ValidateTenantSlug.
  // tenant.display_name is optional; defaults to slug at create time.
  // Both are unique across tenants. tenant_id, slug — immutable;
  // display_name — editable via UpdateTenant.
  Tenant tenant = 2 [(buf.validate.field).required = true];
  // default_bucket — resource name of the (backend, bucket) where this
  // tenant's objects will live by default. Format:
  // "storageBackends/{backend_id}/buckets/{bucket_id}". Optional —
  // when empty the tenant has no default binding (legacy shape); when
  // set, the server inserts a matching tenant_default_bindings row in
  // the same tx as the tenant insert.
  string default_bucket = 3;
}

message GetTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message UpdateTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.FieldMask update_mask = 3 [(buf.validate.field).required = true];
  Tenant tenant = 4;
}

message DeleteTenantRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // Required, and required by the schema rather than by a handler branch:
  // with the bypass flag gone there is nothing left to make it optional for.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];

  // Field 3 was `force`, which meant "skip the trash and hard-delete". It is
  // gone: a flag that changes which state the tenant lands in is a different
  // transition, not a modifier, and the transition already exists. Delete
  // moves the tenant to the trash; PurgeTenant removes it from there. Two
  // calls, each doing one thing, and the destructive one names itself.
  //
  // `force` survives nowhere in this API with that meaning. Where the word
  // remains it is spelled `skip_version_check` and does exactly one thing:
  // waive the OCC guard.
  reserved 3;
  reserved "force";
}

message DeleteTenantResponse {}

message ListTenantsRequest {
  paladin.common.v1.PageRequest page = 1;
  // CEL filter, evaluated against the TenantSchema (see internal/filter/cel).
  // Applied to each fetched page; the page cursor is unaffected, so a page
  // whose rows all fail the predicate still returns next_page_token.
  string filter = 2;
  // include_trashed — when true, return both active and soft-deleted
  // rows; default (false) hides trashed tenants from the active list.
  // The /trash UI sets this to true; everywhere else defaults to the
  // active set so deleted rows can't accidentally accept new bindings.
  bool include_trashed = 3;
  // only_trashed — when true, return ONLY soft-deleted rows. Overrides
  // `include_trashed`. Used by the /trash page to render the recovery
  // view.
  bool only_trashed = 4;
}

message ListTenantsResponse {
  repeated Tenant tenants = 1;
  paladin.common.v1.PageResponse page = 2;
}

message SetInheritedPolicyRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  string cedar_policy = 3;
}

message RestoreTenantRequest {
  // name — "tenants/{tenant_id_or_slug}"; the tenant MUST currently be
  // soft-deleted, otherwise the server returns FAILED_PRECONDITION.
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message PurgeTenantRequest {
  // name — "tenants/{tenant_id_or_slug}"; the tenant MUST currently be
  // soft-deleted, otherwise FAILED_PRECONDITION. There is no one-call
  // path past the trash: DeleteTenant first, then this.
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message PurgeTenantResponse {}

message RenameTenantSlugRequest {
  // name — "tenants/{tenant_id_or_slug}". Phase 3 path: slug-aware.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // resource_version — current tenant version, OCC-guarded.
  // OCC, required: an absent guard would silently become a blind overwrite
  //   (expected_version=0 disables the check in SQL). Read the current version
  //   first; there is no bypass on this RPC by design.
  string resource_version = 2 [(buf.validate.field).string.min_len = 1];
  // new_slug — kebab-case, validated by the same rules as
  // CreateTenantRequest.slug. Uniqueness enforced by the database.
  string new_slug = 3 [(buf.validate.field).string.min_len = 1];
}

message ResolveRenamedSlugRequest {
  // old_slug — the slug that 404'd (the one in the stale bookmark).
  string old_slug = 1 [(buf.validate.field).string.min_len = 1];
}

message ResolveRenamedSlugResponse {
  // new_slug — the slug the tenant uses now.
  string new_slug = 1;
  // renamed_at — when the rotation happened (for a "renamed N days ago" hint).
  google.protobuf.Timestamp renamed_at = 2;
}

message MigrateTenantStorageLayoutRequest {
  // name — "tenants/{tenant_id_or_slug}". The tenant MUST currently be shared.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // target_backend_id — backend the dedicated bucket is provisioned on.
  // Optional; empty reuses the tenant's current (shared) backend. Slice 1
  // supports same-backend only, so a different backend is rejected by the copy
  // job until the cross-backend stream-through path lands.
  string target_backend_id = 2;
  // cleanup_retention_seconds — how long the old (shared) copies are kept after
  // the migration completes before they are deleted. Optional; 0 uses the
  // server default (24h). A rollback is only possible within this window.
  int64 cleanup_retention_seconds = 3;
}

message GetTenantStorageMigrationRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

// StorageMigrationStatus mirrors a tenant_storage_migrations row (ADR-0011
// Phase 3): the copy job's state machine + progress.
message StorageMigrationStatus {
  // tenant — "tenants/{tenant_id}".
  string tenant = 1;
  // state — provisioning | copying | rebinding | verifying | completed | failed.
  string state = 2;
  int64 objects_total = 3;
  int64 objects_copied = 4;
  // Bucket references as resource names, consistent with
  // TenantDefaultBinding: "storageBackends/{backend}/buckets/{bucket}".
  string source_bucket = 5;
  string target_bucket = 6;
  reserved 7, 8;
  // error — non-empty only in the `failed` state.
  string error = 9;
}

// TenantDefaultBinding is a tenant's default (backend, bucket) route for the
// bare collection name shape (ADR-0010 Phase 3 / migration 034).
message TenantDefaultBinding {
  // name — "tenants/{tenant_id}/defaultBinding".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  // Reference to the bucket, as a resource name:
  // "storageBackends/{backend_id}/buckets/{bucket_id}". One field, because a
  // reference to another resource is its name (AIP-122), not its parts.
  string bucket = 2;
  // set_at / set_by — audit of the last change.
  google.protobuf.Timestamp set_at = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string set_by = 5;
}

message GetTenantDefaultBindingRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message SetTenantDefaultBindingRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
  // "storageBackends/{backend_id}/buckets/{bucket_id}".
  string bucket = 2 [(buf.validate.field).string.min_len = 1];
}

message ClearTenantDefaultBindingRequest {
  // name — "tenants/{tenant_id_or_slug}".
  string name = 1 [(buf.validate.field).string.min_len = 1];
}

message ClearTenantDefaultBindingResponse {}
