version: v2
# RUN THIS FROM backend/, never from backend/proto/:
#
#   buf generate proto --template proto/buf.gen.yaml   # then: goimports -w internal/api/pb
#
# `out: .` is relative to the working directory, and `module=` only strips the
# module prefix from the path buf appends to it. Run from backend/ the stubs
# land in backend/internal/api/pb, which is where every import expects them.
# Run from here and buf writes a COMPLETE SECOND COPY to backend/proto/internal
# — 60 files that compile, that nothing can import (the `internal/` in that path
# scopes them to backend/proto/, which holds no Go code), and that then rot in
# place. That copy existed, committed, until 2026-08-27; it had drifted three
# field removals behind the real one. `task codegen:proto` has the correct
# invocation baked in — prefer it over calling buf by hand.
plugins:
  # Local binaries — no BSR remote plugin calls, no rate limits.
  # Requires: protoc-gen-go, protoc-gen-connect-go on PATH.
  - local: protoc-gen-go
    out: .
    opt: module=github.com/oleg-tkachuk/paladin/backend
  - local: protoc-gen-connect-go
    out: .
    opt: module=github.com/oleg-tkachuk/paladin/backend
