# Paladin Helm chart — per-role Deployments.
#
# The chart renders one Deployment per entry in `deployments:` plus a
# matching Service / ServiceAccount / optional HPA. Each role boots the
# same `paladin` binary with a different `serve <role>` argv, so a release is
# always one image with N pods carrying disjoint responsibilities.
#
# Roles (default keys):
#   api      — data + iam Connect listeners (public-ish traffic)
#   admin    — admin Connect listener (privileged operations)
#   worker   — background jobs with Postgres-leased leadership
#   mcp      — Model Context Protocol bridge (LLM-facing)
#
# Migrate and bootstrap run as Helm hook Jobs (pre-install / pre-upgrade)
# rather than from inside an api pod, so DDL never races a serve loop.
#
# To disable a role: `deployments.<role>.enabled: false`.

metadata:
  version: ""
  commit: "unknown"
  buildTime: "unknown"

# Time the kubelet waits for graceful shutdown before SIGKILL. Should
# exceed `config.server.shutdown_timeout` plus a small drain buffer.
terminationGracePeriodSeconds: 30

image:
  # The published multi-arch image, so `helm install` works without building
  # anything. The dev loop overrides this back to the in-cluster registry in
  # values-local.yaml, and other envs flip it via values-{dev,staging,prod}.
  repository: ghcr.io/oleg-tkachuk/paladin-core
  # Prod-safe default. Local overlay flips to Always because the
  # local registry rebuilds the same tag in-place.
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Default service account spec. Per-role `serviceAccount.name` overrides
# this — leave create=true at this level and the chart will mint one SA
# per role automatically (chart-fullname-rolename) so RBAC is naturally
# role-scoped.
serviceAccount:
  create: true
  # K8sSecretResolver REQUIRES the projected SA token to call the K8s
  # API on boot — resolver.go reads /var/run/secrets/kubernetes.io/
  # serviceaccount/token and fatals if it's missing. The previous
  # `automount: false` default broke migrate/bootstrap/serve pods the
  # moment any SecretRef field landed in config (observed: migrate Job
  # erroring 3h+ in cluster).
  #
  # Override to false ONLY when ALL config is inline (no `*_secret`
  # fields anywhere). Otherwise leave true.
  automount: true
  annotations: {}
  name: ""

# Pod-level security context. Defaults intentionally non-empty — distroless
# nonroot UID, RuntimeDefault seccomp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level. readOnlyRootFilesystem is safe because the binary
# writes only to stdout/stderr; configs are mounted RO from the ConfigMap;
# migrations are embedded in the binary.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

# Defaults shared across every role. Each `deployments.<role>` block can
# override any of these via the same key name; the role-level value wins.
# Empty / unset role-level keys fall back to here.
defaults:
  replicas: 1
  # Conservative defaults sized for the dev cluster. Tune in
  # values-{dev,staging,prod}.yaml overlays per role via
  # `deployments.<role>.resources`. requests.cpu is REQUIRED for
  # HPA-on-CPU to work; do not drop without disabling autoscaling.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # readOnlyRootFilesystem (set in securityContext) requires a
  # writable /tmp for stdlib temp writes (TLS cert caching, tempfile,
  # etc.). emptyDir keeps it pod-local and erased on restart.
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  # Empty by default. Multi-zone prod overlays populate this per role
  # so a single-AZ failure doesn't take all replicas of a role at once.
  # See values-prod.yaml for the canonical zone-spread block.
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  # Extra container env, appended after the chart's built-in vars. Empty by
  # default (the pods run on the ambient credential chain). The canonical use
  # is handing static cloud credentials to a role off its native platform —
  # e.g. the dispatcher's SQS sink outside EKS, where there's no IRSA to
  # assume. Reference a Secret rather than inlining values:
  #   deployments.dispatcher.extraEnvFrom:
  #     - secretRef:
  #         name: paladin-dispatcher-aws
  # (Secret keys AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY [/ AWS_SESSION_TOKEN]
  #  feed the SDK's default chain — see docs/runbooks/sqs-sink-credentials.md.)
  # extraEnv takes the standard EnvVar shape for one-off valueFrom refs.
  extraEnv: []
  extraEnvFrom: []

# ─── Per-role Deployments ──────────────────────────────────────────────────
#
# Each role pins:
#   - args     — argv passed to `paladin` (always starts with "serve")
#   - ports    — named container ports the Service maps onto
#   - probes   — liveness / readiness / startup, targeted at a role-port
#   - replicas, resources, autoscaling — independent scaling per role
#
# Probe paths (`/livez`, `/readyz`, `/startupz` for api/admin; `/healthz`
# for worker/mcp) map to the in-handler check sets — see internal/health
# for api/admin and serve_worker.go / serve_mcp.go for the simpler ops
# endpoints on worker / mcp.

deployments:
  api:
    enabled: true
    replicas: 2
    args:
      - "serve"
      - "api"
    ports:
      - name: data
        containerPort: 8080
      - name: iam
        containerPort: 8085
    livenessProbe:
      httpGet:
        path: /livez
        port: data
        # scheme: HTTPS is added by the chart when internalTLS is on —
        # kubelet does not detect it. Its TLS client skips verification,
        # so the internal CA needs no trust setup here.
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: data
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        path: /startupz
        port: data
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    service:
      type: ClusterIP
      # First port lands at .spec.ports[0]; default port-forward hits
      # data:8080 which is what most operators expect.
      ports:
        - name: data
          port: 8080
          targetPort: data
        - name: iam
          port: 8085
          targetPort: iam
    # The internal TLS certificate is mounted by the chart when
    # internalTLS.enabled; see internalTLS below.
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
  admin:
    enabled: true
    # Admin pod sits behind a stricter ingress; single replica is fine.
    replicas: 1
    args:
      - "serve"
      - "admin"
    ports:
      - name: admin
        containerPort: 8090
    livenessProbe:
      httpGet:
        path: /livez
        port: admin
        # scheme follows internalTLS, as on the api role.
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: admin
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        path: /startupz
        port: admin
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    service:
      type: ClusterIP
      ports:
        - name: admin
          port: 8090
          targetPort: admin
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp
  worker:
    enabled: true
    # Two replicas with anti-affinity so leases distribute; the lease
    # package guarantees only one pod runs each job at a time.
    replicas: 2
    args:
      - "serve"
      - "worker"
    ports:
      # 8090 matches cmd/server/serve_worker.go which reuses
      # cfg.Server.AdminHTTP.Addr (config.yaml: 0.0.0.0:8090) for the
      # ops listener. Don't reuse 8099 — that's the default fallback
      # the binary picks ONLY when AdminHTTP.Addr is empty in config.
      - name: ops
        containerPort: 8090
    # Worker speaks no Connect; ops port serves the simple /healthz +
    # /readyz handlers from cmd/server/serve_worker.go.
    livenessProbe:
      httpGet:
        path: /healthz
        port: ops
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: ops
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        path: /readyz
        port: ops
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    service:
      type: ClusterIP
      # Ops port exposed as a Service so kube-proxy can probe; not
      # consumed by external clients.
      ports:
        - name: ops
          port: 8099
          targetPort: ops
    # Anti-affinity keeps the two worker pods on different nodes — a
    # node failure should never take both leaders out at once.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: worker
  mcp:
    enabled: true
    replicas: 1
    args:
      - "serve"
      - "mcp"
      - "--transport=http"
    ports:
      - name: mcp
        containerPort: 8095
    livenessProbe:
      httpGet:
        path: /healthz
        port: mcp
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: mcp
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    service:
      type: ClusterIP
      ports:
        - name: mcp
          port: 8095
          targetPort: mcp
    volumes:
      - name: tmp
        emptyDir: {}
    volumeMounts:
      - name: tmp
        mountPath: /tmp

  # Dispatcher plane — durable webhook fan-out. Consumes the
  # event_deliveries outbox (migration 028). Producer (admin pod)
  # writes rows; this Deployment polls them via FOR UPDATE SKIP LOCKED
  # and POSTs to customer sinks. Multiple replicas safe — SKIP LOCKED
  # hands each row to exactly one replica per cycle. HPA-friendly when
  # a queue-depth metric is wired (BACKLOG).
  dispatcher:
    enabled: true
    replicas: 1
    args:
      - "serve"
      - "dispatcher"
    ports:
      - name: ops
        containerPort: 8099
    livenessProbe:
      httpGet:
        path: /livez
        port: ops
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: ops
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        path: /readyz
        port: ops
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    service:
      type: ClusterIP
      ports:
        - name: ops
          port: 8099
          targetPort: ops

  # Ingest plane — storage-event consumer. Disabled by default in the
  # chart because it requires a publisher (SeaweedFS / MinIO / NATS /
  # RabbitMQ) to be in place; flip enabled=true when the source is
  # ready and `config.ingest` is filled in.
  ingest:
    enabled: false
    replicas: 1
    args:
      - "serve"
      - "ingest"
    ports:
      - name: ingest
        containerPort: 8100
    livenessProbe:
      httpGet:
        path: /healthz
        port: ingest
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: ingest
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    service:
      type: ClusterIP
      ports:
        - name: ingest
          port: 8100
          targetPort: ingest

# ─── PodDisruptionBudget ───────────────────────────────────────────────────
#
# Per-role PDBs gated on replicas>=2. A single-replica PDB is
# unsatisfiable and blocks node drains forever. Renders only when the
# effective replica count for a role is at least 2 (replicas>=2 or
# autoscaling.minReplicas>=2). minAvailable: 1 means at least one pod
# of THAT role stays serving through voluntary disruptions.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: ""  # set instead of minAvailable for percentage budgets

# ─── Observability (Prometheus Operator) ───────────────────────────────────
#
# Backend api / admin / worker / dispatcher / ingest expose Prometheus
# metrics. ServiceMonitor + PrometheusRule render only when the
# Prometheus Operator CRDs are installed AND `metrics.*.enabled` flipped
# in an env overlay — the chart stays installable in clusters without
# the operator.
metrics:
  serviceMonitor:
    enabled: false
    # Namespace where Prometheus Operator's Prometheus CR runs. Empty =
    # release namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    path: /v1/metrics
    # `release: <prometheus-release>` is the common label Prometheus
    # Operator uses to discover ServiceMonitors. Override per env.
    labels: {}
    relabelings: []
    metricRelabelings: []
  alerts:
    enabled: false
    labels: {}
    rules:
      crashLooping:
        enabled: true
        severity: critical
        for: 5m
      highErrorRate:
        enabled: true
        severity: warning
        threshold: 0.05
        for: 10m
      highLatency:
        enabled: true
        severity: warning
        thresholdSeconds: 1.5
        for: 10m
      notReady:
        enabled: true
        severity: warning
        for: 10m
      oomKilled:
        enabled: true
        severity: warning
        window: 15m

# ─── Lifecycle Jobs ────────────────────────────────────────────────────────
#
# Migrate + bootstrap run as Helm hook Jobs so DDL is gated outside the
# serve loop. Default schedule:
#
#   pre-install:  migrate (weight=0) → bootstrap (weight=10)
#   pre-upgrade:  migrate (weight=0) → bootstrap (weight=10)
#
# Either can be disabled (e.g. external migrator owns DDL).
jobs:
  # Both Jobs ran with no requests and no limits, which the templates already
  # had a slot for. That makes their pods BestEffort: first evicted under node
  # pressure, and refused outright by a namespace carrying a LimitRange that
  # requires requests. These are pre-install/pre-upgrade hooks, so losing one
  # does not degrade the release — it fails it, before a single Deployment is
  # applied.
  #
  # Sized as a serving role rather than measured: same image, same binary, and
  # both do strictly less than an api pod — Goose streams its SQL to Postgres
  # and bootstrap inserts a handful of rows, so the client-side footprint is
  # the smaller half of that pair. An upper bound is the honest number here;
  # tune per environment if a migration ever proves otherwise.
  migrate:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 600
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
  bootstrap:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 120
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi

# ─── Application config ────────────────────────────────────────────────────
#
# Single ConfigMap shared by every role. The Go binary reads only the
# subset relevant to its subcommand (e.g. `serve worker` ignores the
# server.* listener block).
# ─── App config (templated into the ConfigMap) ─────────────────────────────
#
# Defaults here are PROD-SAFE. The dev cluster opt-ins (debug logging,
# dummy access keys, hard-coded signing key, `*.paladin.local` endpoints)
# live in values-local.yaml and are applied via `helm -f values-local.yaml`.
# Never restore dev defaults here — a future operator who installs the
# chart with just `helm install paladin .` must get a deployment that's not
# silently insecure.
config:
  app:
    name: paladin-core
    # prod unless an overlay says otherwise: the strict setting, under which
    # weak secrets, ephemeral signing keys and an unauthenticated ingest
    # webhook are all refused at boot. Overlays set local / dev / staging.
    env: prod

  logger:
    # info-level + non-development zap config is the prod default. Local
    # overlay flips to debug + development:true for stack traces.
    level: info
    format: json
    development: false
    disable_caller: false
    disable_stacktrace: true
    sampling:
      enabled: false
      initial: 100
      thereafter: 100

  otel:
    enabled: false
    # 4318, not 4317: protocol http means the OTLP/HTTP exporter, which posts
    # to <endpoint>/v1/traces. The pair shipped as http + 4317 — the gRPC port
    # — so any deployment taking the defaults exported into a port that would
    # never answer it. The host is a placeholder either way; every overlay
    # names its own collector.
    endpoint: "otel-collector:4318"
    protocol: http
    # insecure off by default — prod OTel collector terminates TLS.
    # Local overlay flips this back on.
    insecure: false

  runtime:
    # Gin mode `release` — debug skipped in prod.
    mode: release
    shutdown_timeout: 20s
    log_probes: false

  api:
    server:
      data: &http_defaults
        addr: "0.0.0.0:8080"
        # Also the TLS handshake deadline: Go derives it from
        # ReadHeaderTimeout when that is set. 5s was too tight for a burst of
        # mTLS handshakes from one client — the console BFF fans a page out to
        # eight RPCs, and on a cold connection pool two of those handshakes
        # missed the deadline ("TLS handshake error ... read tcp: i/o
        # timeout"), which cascaded into 401s for the whole page because the
        # token exchange rides the same connection budget. The BFF now caps
        # its pool; this gives the handshake room on the other side too.
        # Still short enough to be a slowloris guard, which is its other job.
        read_header_timeout: 15s
        read_timeout: 30s
        write_timeout: 30s
        idle_timeout: 90s
        max_header_bytes: 1048576
        max_body_bytes: 10485760
        request_id_header: "X-Request-Id"
        real_ip_header: "X-Forwarded-For"
        trusted_proxies: []
        cors_allowed_origins: []
        # Turned on, with the certificate paths, by internalTLS.enabled.
        # permissive verifies a client certificate when one is presented;
        # "strict" requires one from every caller.
        tls:
          enabled: false
          cert_path: ""
          key_path: ""
          ca_path: ""
          client_auth: permissive
      iam:
        <<: *http_defaults
        addr: "0.0.0.0:8085"
        # Same posture as the data listener.
        tls:
          enabled: false
          cert_path: ""
          key_path: ""
          ca_path: ""
          client_auth: permissive

  admin:
    server:
      <<: *http_defaults
      addr: "0.0.0.0:8090"

  datastores:
    postgres:
      # The connection is normally built from the top-level `postgres` block.
      # Set dsn / migrate_dsn and the two password_secret refs here instead
      # when the DSN needs more than host, port, database and sslmode.
      # reaper_dsn / reaper_password_secret: the worker's cross-tenant
      # background DML jobs connect here, as a dedicated least-privilege
      # BYPASSRLS role (paladin_reaper, migration 058 — DML-only, no DDL). Empty
      # (dev default) → the worker reuses migrate_dsn. Prod overlays set both
      # and add reaper_password_secret.name to rbac.secretReader.secretNames.
      # Example (prod overlay):
      #   reaper_dsn: "postgres://paladin_reaper@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=verify-full&sslrootcert=/etc/paladin/pg-ca/ca.crt"
      #   reaper_password_secret: { name: paladin-postgresql-reaper-user, key: password, namespace: database }
      reaper_dsn: ""
      pool:
        max_conns: 20
        min_conns: 2
        max_conn_lifetime: 30m
        max_conn_idle_time: 5m
      timeouts:
        connect: 5s
        statement: 30s
      healthcheck_period: 30s

  limits:
    max_object_size: "100MB"
    max_multipart_size: "1TB"
    min_part_size: "5MB"
    max_part_size: "5GB"
    max_parts: 10000
    allowed_content_types:
      - "image/jpeg"
      - "image/png"
      - "image/heic"
      - "image/heif"
      - "image/tiff"
      - "text/plain"
      - "application/pdf"
      - "application/json"
      - "application/octet-stream"
    presign:
      put_ttl: 15m
      get_ttl: 15m
      part_ttl: 15m
      default_ttl: 15m
      max_ttl: 168h
      default_max_size: 5368709120

  auth:
    # No issuer / signing_key defaults — every env overlay MUST set
    # both. An empty signing_key surfaces as a startup error rather
    # than a quietly-broken JWT verification path.
    issuer: ""
    # signing_key is the HMAC key used to both sign and verify every JWT.
    # Provide it ONE of two ways (mutually exclusive — setting both is a
    # startup error):
    #   - signing_key: "<value>"     inline (dev / lab only)
    #   - signing_key_secret: {...}  resolved from a K8s Secret at boot (prod:
    #     keep the key in a SealedSecret / ExternalSecret, never in values).
    #     Add its `name` to rbac.secretReader.secretNames below.
    signing_key: ""
    # signing_key_secret:
    #   name: paladin-auth-signing-key
    #   key: signing_key
    #   namespace: ""              # "" → pod namespace
    jwks_url: ""
    leeway: 30s
    access_token_ttl: 15m
    refresh_token_ttl: 168h
    scoped_token_max_ttl: 24h

  security:
    # The X-Tenant-Id header is a Login-time disambiguator only —
    # password verification still gates the request. There is no
    # "trust header without JWT" mode; the trust_tenant_id_from_request
    # flag that used to live here was dead code and was removed in
    # the post-2026-05 security audit.
    reject_tenant_mismatch: true
    log_sensitive: false
    # RLS is not a knob — the runtime unconditionally installs the
    # BeforeAcquire hook that stamps paladin.tenant_id GUC. Migration
    # 023 makes RLS unavoidable at the DB layer (per-table policies
    # on objects/object_tags/quotas/etc), and paladin_app is
    # NOBYPASSRLS by design, so any "off" position would break
    # every write. See internal/config/types.go for rationale.

  bootstrap:
    admin:
      enabled: true
      subject: "admin"
      tenant_slug: "platform"
      tenant_display_name: "Platform"
      display_name: ""
      roles: ["platform.admin"]
      password_secret:
        name: "paladin-bootstrap-admin"
        key: "password"
        namespace: ""
      min_password_length: 0
      force_reset: true

  middleware:
    timeouts:
      fast_operation: 5s
      default_operation: 30s
      s3_operation: 60s
      long_operation: 2m
    rate_limit:
      enabled: true
      requests_per_second: 300
      burst: 500
      max_tenants: 10000
      cleanup_ttl: 10m
      cleanup_interval: 5m
    cache:
      enabled: true
      max_size: 1000
      ttl: 5m
    idempotency:
      enabled: true
      ttl: 24h

  worker:
    ops:
      <<: *http_defaults
      addr: "0.0.0.0:8090"
    # Where the ADMIN pod reaches the worker's ops listener —
    # SystemService.GetPlatformStats proxies
    # <ops_url>/system/rls-census.json (the worker computes the
    # cross-tenant census of every RLS'd table; its pool is the
    # BYPASSRLS one).
    # Port 8099 is the SERVICE port; it targets container port 8090.
    # Empty disables the proxy.
    ops_url: "http://paladin-core-worker:8099"
    jobs:
      reconciler:
        interval: 30s
        min_object_age: 2h
        batch_size: 100
      housekeeping:
        interval: 1h
        pending_ttl: 24h
        multipart_ttl: 72h
        audit_log_ttl: 8760h
        # Terminal operation rows older than this are reaped. 0 disables the
        # reaper, and this key was absent — so it shipped disabled, the
        # 14d: long enough for a post-mortem on a batch job, short enough that
        # "recent failures" on the console widget means recent. The audit log
        # keeps the record of the RPC that started the operation for a year
        # (above); this is the execution detail, which is only interesting
        # while it is fresh.
        #
        # This line was originally added while chasing a stale row on the
        # failed-ops widget, on the belief that an absent key left the reaper
        # switched off. It did not: CUE supplied 720h and the reaper always
        # ran, and the stale row was an ascending sort, fixed separately. The
        # number survived that wrong reason on its own merits and is now the
        # schema default too, so this line agrees with CUE rather than
        # overriding it.
        operations_ttl: 336h
        delete_orphaned_parts: false
      refresh_token_reap:
        interval: 1h
      lifecycle:
        enabled: true
        interval: 30m
      replication:
        enabled: false
        interval: 5m
        lookback_window: 1h
      # Recomputes quotas.usage_* from live objects and rolls the
      # per-day counters at midnight UTC. Required whenever quotas are
      # in use: the upload path only increments those columns and the
      # upload interceptor rejects against them, so an unreconciled
      # deployment wedges tenants that delete what they uploaded.
      # Drains pending_purges — the byte-reclaim debt a permanent delete
      # leaves when its synchronous storage delete fails. Required
      # wherever permanent delete is reachable: the object row is gone by
      # then, so nothing else can find those bytes.
      purge_drain:
        interval: 1m
        max_backoff: 1h
        batch_size: 100
      quota_reconcile:
        interval: 15m

  # Dispatcher role — durable webhook fan-out. The pod polls the
  # event_deliveries outbox (migration 028) and POSTs to customer
  # sinks. See backend/configs/config.yaml for full inline docs on
  # each knob. Cross-tenant note: production deploys MUST point
  # datastores.postgres.migrate_dsn at a BYPASSRLS role (paladin_migrate)
  # so the loop can scan across tenants. Without it the SELECT
  # returns zero rows under RLS.
  dispatcher:
    ops:
      addr: "0.0.0.0:8099"
    # Where the ADMIN pod reaches the dispatcher's ops listener —
    # SystemService.GetDispatcherStats proxies
    # <ops_url>/system/dispatcher-stats.json (the dispatcher computes the
    # cross-tenant queue view; its pool is the BYPASSRLS one). Matches the
    # chart's dispatcher Service name; empty disables the proxy.
    ops_url: "http://paladin-core-dispatcher:8099"
    poll_interval: 1s
    batch_size: 50
    base_backoff: 5s
    max_backoff: 1h
    default_max_attempts: 5

  storage:
    backends:
      primary:
        kind: s3-compatible
        bucket: paladin-primary
        region: us-east-1
        # No default endpoint / public_endpoint — env overlay MUST
        # set both. Empty surfaces as a startup error.
        endpoint: ""
        public_endpoint: ""
        force_path_style: true
        # Credentials. By default sourced from a sibling K8s Secret via
        # `storage.s3CredentialsSecret` (chart-managed or external) —
        # the configmap.yaml template injects the matching SecretRef
        # blocks (`access_key_secret` / `secret_key_secret`) at render
        # time when that feature is on. Leave both inline keys empty
        # here; the template + RBAC do the rest.
        #
        # Overlays that need inline plaintext (e.g. `values-local.yaml`)
        # SHOULD set `storage.s3CredentialsSecret.create: false` AND
        # provide `auth.access_key` / `auth.secret_key` here; the
        # template suppresses the SecretRef injection when neither
        # `create` nor `existingSecret` is set, so the inline/SecretRef
        # mutual-exclusion check stays happy.
        auth:
          mode: static_keys
          access_key: ""
          secret_key: ""
        part_size: "8MB"
        sse:
          type: ""
          key_id: ""
        events:
          enabled: false
          target: "none"
          queue_url: ""
          poll_interval: 20s

  cedar:
    policy_cache_ttl: 30s
    canonical_collection_euid: true     # ADR-0014 Phase 1 — canonical ObjectKey EUID (behaviourally inert; see configs/config.yaml)

  mcp:
    upstreams:
      # Inside the cluster the MCP pod talks to the api / admin Services
      # (not localhost — that was the standalone-binary era). Defaults
      # below are rendered via `tpl` in templates/configmap.yaml so the
      # Service names track chart.fullname automatically — override only
      # for cross-release setups (sidecar MCP pointing at a different
      # Paladin install) or when terminating TLS in front of those Services.
      admin_url: '{{ include "chart.internalScheme" . }}://{{ include "chart.fullname" . }}-admin:8090'
      data_url: '{{ include "chart.internalScheme" . }}://{{ include "chart.fullname" . }}-api:8080'
      iam_url: '{{ include "chart.internalScheme" . }}://{{ include "chart.fullname" . }}-api:8085'
      # The scheme follows internalTLS, and so do the paths below: with it on,
      # the chart points them at the mounted certificate, whose CA the system
      # roots do not contain. The certificate's SANs must cover the bare
      # Service names above.
      tls:
        ca_path: ""
        cert_path: ""
        key_path: ""
    stdio:
      enabled: false
      profile: read_only
    http:
      enabled: true
      addr: ":8095"
      profile: read_only
      session_timeout: 10m
      # The admin plane's view of this bridge's /sessions endpoint, which is
      # what MCPInspectService.ListSessions proxies to. Empty means the admin
      # plane has no bridge to ask — and answers with an empty session list,
      # which on the /mcp page is indistinguishable from "nobody is connected".
      # It shipped empty: the page has never shown a session in this chart.
      #
      # Plain http:// on purpose — the bridge's own listener is
      # ListenAndServe, not TLS (mcp.upstreams.tls below is the other
      # direction: bridge → planes). Rendered via tpl like the upstreams so
      # the Service name tracks chart.fullname.
      sessions_url: 'http://{{ include "chart.fullname" . }}-mcp:8095/sessions'
    # Tool catalog gating. Profiles + always_deny live in
    # internal/mcp/profile.go (built-in defaults); these blocks are the
    # operator override seam. Leave empty to use the defaults.
    profiles: {}
    # always_deny: []

  # ─── Capability tokens (Ed25519 JWT, agent-runtime) ──────────────────
  #
  # Short-lived caveat-bearing JWTs minted by admin and verified on
  # data/admin/mcp. Off by default — enable per-deploy once a signing
  # key is mounted (production) or accept the ephemeral keypair (dev).
  # See internal/capability/ for the package and proto/paladin/admin/v1
  # CapabilityService for the issuance RPC.
  capability:
    enabled: false 
    issuer_name: ""                     # `iss` claim; conventional: external URL or "paladin-prod-eu"
    trusted_issuers: []                 # accepted `iss` values; include issuer_name
    signing_key_path: ""                # PEM PKCS#8 Ed25519 private key; "" → ephemeral keypair (dev only)
    signing_key_kid: ""                 # JWT header kid; "" → derived from public key bytes
    default_ttl: 15m                    # cap when Issue.TTL omitted
    verifier_leeway: 30s                # clock-skew window for nbf / exp
    charge_per_request_amount: 0        # amount auto-charged on billable handler calls; 0 = no auto-charge
    charge_per_request_unit: ""         # unit code (USD/EUR/UAH/GBP/UNIT); empty = use capability's own unit
    revocation_cache_ttl: 2s            # IsRevoked cache TTL; <0 disables (every check hits DB)

  # ─── API tokens (hashed-bearer M2M, long-lived) ──────────────────────
  #
  # Service-to-service credentials following the GitHub-PAT / Stripe /
  # Hatchet pattern. Distinct from capability (agent JWT, short-lived)
  # and auth (user OIDC). Off by default — enable per-deploy once an
  # issuance path (CLI or admin UI) is rolled out.
  api_token:
    enabled: false
    max_ttl: 8760h                      # cap on Issue lifetime; 1y default
    verifier_leeway: 30s                # clock-skew on expires_at
    touch_last_used: true               # bump last_used_at on verify (off for high-QPS deploys)

  # ─── Ingest plane (storage-event consumer) ───────────────────────────
  #
  # Off by default; flip enabled=true when a publisher is wired up.
  # Driver picks the transport — webhook | nats | rabbitmq.
  #
  # Webhook is the simplest: SeaweedFS / MinIO POST events to
  # http://<ingest-svc>:8100/webhook/<source>. Pair shared_secret
  # here with the publisher's `bearer_token` (SeaweedFS) so HMAC
  # verification passes.
  ingest:
    enabled: false
    driver: webhook
    webhook:
      addr: ":8100"
      # HMAC key the publisher signs bodies with. Inline shared_secret for
      # dev; in prod set shared_secret_ref to resolve it from a (Sealed)Secret
      # at boot (add its `name` to rbac.secretReader.secretNames). Set only one.
      shared_secret: ""
      # shared_secret_ref:
      #   name: paladin-ingest-hmac
      #   key: secret
      #   namespace: ""
      signature_header: "X-Paladin-Signature"
      max_body_bytes: 1048576
    dedup_ttl: 24h
    reaper_interval: 1h
    # nats / rabbitmq blocks are populated when those drivers land.

# ─── Bootstrap admin Secret ────────────────────────────────────────────────
#
# When chart-level `bootstrap.admin.enabled=true` the chart provisions
# the platform-admin password Secret so K8sSecretResolver can read it on
# first boot. The two-flag split (`config.bootstrap.admin.enabled` =
# server runs the boot step; `bootstrap.admin.enabled` = chart provisions
# the Secret) is intentional — GitOps shapes use the SealedSecret path
# and need to set the chart flag to false. See secret-bootstrap-admin.yaml
# for the full matrix of combinations.

# ─── Credential rotation and pod restarts ───────────────────────────────────
#
# Every credential this chart references is resolved ONCE at boot by
# K8sSecretResolver. A rotation therefore only takes effect on a pod restart.
#
# Two cases, and only one of them is automatic:
#
#   * Values-driven changes — anything under `config.*`, and the Secrets THIS
#     chart renders (bootstrap.admin, storage.s3CredentialsSecret) — are
#     covered by the checksum/config and checksum/secrets pod annotations. A
#     change rolls the Deployments on the next sync; nothing to do by hand.
#
#   * Externally-managed Secrets — a SealedSecret, an ExternalSecret, the
#     CNPG-generated Postgres users, a signing key or api_token pepper written
#     out of band — cannot be hashed here. Their content is not part of this
#     render, and a `lookup` would return empty whenever Helm runs without
#     cluster access (ArgoCD renders client-side, as do `helm template` and
#     CI), so the annotation would flap and roll pods for no reason.
#
#     Rotating one of those means restarting the Deployments explicitly —
#     `rollout restart` on the release's Deployments. Skip it and the cluster
#     reports a completed rotation while every pod keeps using the old value.
#     If a Reloader-style controller is available in the target cluster,
#     annotating the Deployments for it removes this step — that is a
#     deployment choice, not a chart default.

bootstrap:
  admin:
    # On by default: a fresh install gets a platform admin whose password is
    # generated once and kept in the Secret below (NOTES.txt says how to read
    # it). GitOps installs set false and ship the Secret themselves.
    enabled: true
    password: ""
    passwordSecret:
      name: "paladin-bootstrap-admin"
      key: "password"

# ─── Internal TLS ────────────────────────────────────────────────────────────
#
# TLS between the chart's own pods: the data, iam and admin listeners terminate
# it, and the MCP bridge dials them over it. Off by default — the planes then
# speak plain HTTP inside the cluster, and an ingress or mesh in front provides
# transport security. On, it needs a Secret with tls.crt, tls.key and ca.crt
# whose certificate names the release's Services (cert-manager can issue one).
internalTLS:
  enabled: false
  existingSecret: ""
  mountPath: /etc/paladin-mtls
  # Roles that mount the certificate: the three listeners' hosts and the
  # bridge that dials them.
  roles: [api, admin, mcp]
  # Roles whose probes switch to HTTPS: the ones whose probe port is a TLS
  # listener.
  serverRoles: [api, admin]

# ─── PostgreSQL ──────────────────────────────────────────────────────────────
#
# The chart does not run Postgres. Point it at one and name the Secrets that
# hold the two roles' passwords; the chart builds both DSNs and the password
# refs from this block. The roles and the database are created beforehand —
# see docs/install.md. Leave host empty to write config.datastores.postgres
# yourself.
postgres:
  host: ""
  port: 5432
  database: paladin
  # require encrypts without verifying the server; verify-full needs the CA
  # (postgresCa below) and a DSN written under config.datastores.postgres.
  sslmode: require
  # The runtime role: DML only, no BYPASSRLS.
  app:
    user: paladin_app
    existingSecret: ""
    key: password
    # Empty: the release namespace.
    namespace: ""
  # The role migrations run as: owns the schema, BYPASSRLS.
  migrate:
    user: paladin_migrate
    existingSecret: ""
    key: password
    namespace: ""

# ─── Access-token signing key ────────────────────────────────────────────────
#
# Used only when config.auth sets neither `signing_key` nor
# `signing_key_secret`. Then the chart generates a Secret named
# <fullname>-auth-signing-key (kept across upgrades via lookup), or points the
# config at `existingSecret` when that is set. Under ArgoCD or any client-side
# render, set `existingSecret`: lookup cannot see the cluster there, and a
# generated key would change on every sync.
auth:
  signingKey:
    generate: true
    existingSecret: ""
    key: signing_key
    # Characters in a generated key.
    generatedLength: 64

# ─── Primary storage backend credentials ────────────────────────────────────
#
# Sibling K8s Secret holding the S3 / SeaweedFS access_key + secret_key for
# `config.storage.backends.primary`. The default config.yaml references this
# Secret via `*_secret` SecretRef fields — K8sSecretResolver fetches the
# values at boot using the pod's projected token (same path as PG / bootstrap
# creds). Chart renders the Secret with the SeaweedFS `dummy_*` values by
# default so a `helm install` against a fresh cluster produces a config
# that passes validation without an overlay.
#
# Three modes:
#
#   1. `create: true` (default) — chart provisions the Secret. Override
#      `accessKey` / `secretKey` in your env overlay for non-dummy values.
#   2. `create: true`, `existingSecret: <name>` — chart skips its own
#      Secret; config references the externally-managed one (SealedSecret,
#      ExternalSecret, manual `kubectl apply`). Operator is responsible
#      for the keys being named `access_key` / `secret_key`.
#   3. `create: false` — chart skips the Secret entirely AND the values
#      *_secret refs still resolve to `name`, so the caller MUST either
#      set `existingSecret` to a real one OR null out
#      `config.storage.backends.primary.auth.{access,secret}_key_secret`
#      in the overlay (e.g. `values-local.yaml` inlines plain keys).
#
# rbac.secretReader.secretNames below MUST contain `name` (or
# `existingSecret` when used) or the resolver gets a 403 at startup.
storage:
  # ─── S3 credentials, one Secret per backend ──────────────────────────────
  #
  # `s3CredentialsSecrets` is a map keyed by the backend id in
  # `config.storage.backends`. Each entry renders (or references) its own
  # Secret and makes the configmap template inject that backend's
  # `auth.access_key_secret` / `auth.secret_key_secret`, which the
  # K8sSecretResolver reads at startup. RBAC picks up every name
  # automatically.
  #
  #   s3CredentialsSecrets:
  #     primary:
  #       existingSecret: paladin-s3-primary   # provisioned by SOPS / ESO / SealedSecret
  #     secondary:
  #       create: true
  #       accessKey: "…"
  #       secretKey: "…"
  #
  # Per backend rather than one shared Secret, because credentials for
  # different backends are rotated, scoped and sourced independently — and
  # because the alternative is what this replaced: injection hardcoded to
  # `primary`, leaving every other backend's keys inline in the ConfigMap,
  # readable by anyone who can GET a configmap in the namespace.
  #
  # Fields per entry: `create` (render a chart-managed Secret),
  # `existingSecret` (reference one instead; wins over create/name), `name`
  # (override the default `<fullname>-s3-<backend>`), `accessKey`/`secretKey`
  # (only used when create is true).
  #
  # Inline `auth.access_key` and a SecretRef are mutually exclusive: leave the
  # inline keys empty for any backend listed here.
  s3CredentialsSecrets: {}

  # Legacy, still honoured: the singular form means the `primary` entry, and
  # keeps its historical Secret name so upgrades do not orphan one. An
  # explicit `primary` key in the map above wins over it. Overlays that opt
  # out with `create: false` and inline plaintext keep working unchanged.
  s3CredentialsSecret:
    create: true
    name: "paladin-s3-credentials"
    existingSecret: ""
    # SeaweedFS dev defaults — match the `identities` blob the storage
    # namespace ships with so a vanilla install talks to the local
    # SeaweedFS without an overlay edit. Production overlays MUST
    # override these (or set `existingSecret`).
    accessKey: "dummy_access_key"
    secretKey: "dummy_secret_key"

# ─── Traefik IngressRoute ──────────────────────────────────────────────────
#
# Targets the api Service (data + iam ports) per env. Admin gets no
# public ingress by default — operators bring their own behind mTLS /
# VPN / bastion. To expose admin externally, render a separate
# IngressRoute in the env overlay or fork this chart.
#
# Routing model: Traefik IngressRoute. The chart previously shipped both generic `Ingress` and
# Gateway API `HTTPRoute` templates gated off; both removed to commit
# to a single routing path.
traefik:
  enabled: true
  # entryPoints reference Traefik's static config. Defaults to
  # `websecure` (HTTPS); add `web` if HTTP-only is also needed.
  entryPoints:
    - websecure
  # No default hosts — each env overlay declares its own DNS. Empty
  # list means the chart emits no IngressRoute (operator hasn't picked
  # an env yet).
  hosts: []
  annotations: {}
  # Optional middlewares to chain on the route. Each entry is
  # `{name: "<middleware-name>", namespace: "<ns>"}` — namespace is
  # optional (defaults to release namespace).
  middlewares: []
  # Backend TLS — the planes terminate TLS at the pod, so Traefik must
  # dial them over HTTPS via a ServersTransport (see
  # serverstransport.yaml). insecureSkipVerify because the pod cert is
  # signed by the in-cluster mTLS CA; serverName defaults to the first
  # host when left empty.
  backendTLS:
    enabled: true
    insecureSkipVerify: true
    serverName: ""
  # Connect-RPC plane routing. iam + admin are dispatched by
  # procedure-prefix; everything else falls through to data. Each rule
  # is gated by its backing role (deployments.api / deployments.admin)
  # so a disabled role never leaves an orphaned route.
  planes:
    iam:
      pathPrefix: /paladin.iam.v1.
      port: 8085   # served by the api role
    admin:
      pathPrefix: /paladin.admin.v1.
      port: 8090   # served by the admin role
      # Dedicated hostnames for the admin plane. Empty (the default)
      # keeps admin on traefik.hosts, dispatched by pathPrefix above.
      #
      # When non-empty the admin plane is served ONLY from these hosts and
      # the path-prefix rule on traefik.hosts is NOT emitted. That is the
      # point: a middleware chain attached to a dedicated host is only a
      # control if the same RPCs cannot also be reached on the shared one.
      # Leaving both would make `middlewares` below decorative.
      #
      # The hosts must be covered by the serving certificate — the shared
      # traefik-tls secret carries *.paladin.local, so admin.paladin.local
      # needs no new cert — and must resolve (gitops dns task).
      hosts: []
      # Middlewares applied to the admin route only, in addition to
      # traefik.middlewares. This is where an IP allow-list, mTLS, or a
      # tighter rate-limit goes when admin should be reachable from less
      # than the data plane is. Same shape as traefik.middlewares.
      middlewares: []
    data:
      port: 8080   # api role bare-Host fallthrough

# ─── TLS via cert-manager ──────────────────────────────────────────────────
tls:
  enabled: true
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod
  # If certManager.enabled=false, point at an externally-managed Secret
  # (e.g. the cluster-wide `traefik-tls` provisioned by gitops on
  # the local cluster).
  existingSecret: ""

# ─── Postgres server-cert verification (sslmode=verify-full) ───────────────
#
# `secretName` names a Secret holding the CNPG cluster's CA under key
# `ca.crt`. When set, every role pod mounts it read-only at `mountPath`
# and the DSN must use `sslmode=verify-full&sslrootcert=<mountPath>/ca.crt`
# (see values-prod.yaml). Empty (the default) → no CA mount; the base
# DSN stays `sslmode=require` (encrypt without authenticating the server),
# which works dev/local where the CA isn't provisioned. CNPG publishes
# the CA as `<cluster>-ca` in the database namespace; replicate/sync it
# into the Paladin namespace (ExternalSecret / kubectl) so the pods can mount
# it cross-namespace mounts aren't allowed.
postgresCa:
  secretName: ""
  mountPath: /etc/paladin/pg-ca

# ─── Capability signing key ────────────────────────────────────────────────
#
# Ed25519 private key (PKCS#8 PEM) that signs capability tokens, mounted into
# EVERY role: the admin plane signs with it and the data plane verifies with it.
#
# Set `name` and point `config.capability.signing_key_path` at
# `<mountPath>/<key>`. Leave `name` empty to run without a mounted key — the
# server then generates an ephemeral keypair and every restart invalidates
# every issued capability, which is only acceptable where capabilities are
# disposable (see ADR-0010).
#
# Mounted by the chart rather than through `defaults.volumes` on purpose: a
# per-role `volumes` list OVERRIDES the defaults, and api/admin define their own
# for mTLS — so a key added to the defaults would miss precisely the roles that
# mint and verify.
capabilitySigningKeySecret:
  name: ""
  key: key.pem
  mountPath: /etc/paladin-capability

# ─── RBAC for K8sSecretResolver ────────────────────────────────────────────
#
# The resolver issues exactly one verb (GET) per referenced secret name.
# `secretNames` lists every secret referenced from `config.*.password_secret`
# / `config.*.access_key_secret` / `config.*.secret_key_secret`. New secret
# references must extend this list or the resolver 403s at startup.
#
# The single ClusterRole is bound to every role's ServiceAccount — keeps
# RBAC minimal. To split (e.g. mcp gets a wider key set), copy the
# ClusterRole and bind only mcp's SA.
rbac:
  secretReader:
    enabled: true
    # A Role in the release namespace. Set true when a referenced Secret lives
    # in another namespace (a Postgres operator's, say): a namespaced Role
    # cannot grant that.
    clusterWide: false
    # Secrets the chart does not wire itself. The ones it does — the Postgres
    # passwords, the S3 credentials, the bootstrap admin and the generated
    # signing key — are appended at render time (chart.secretReaderNames).
    #
    # Add the names behind any other SecretRef: config.auth.signing_key_secret,
    # config.ingest.webhook.shared_secret_ref, the reaper password, and the
    # "k8s:<name>/<key>" refs inside event-sink configs (HTTP
    # signing_secret_ref, Kafka sasl_password / mTLS PEM, NATS credentials_ref,
    # the AMQP URL). The resolver GETs through this allowlist, so a missing
    # name surfaces as a 403 at boot or at delivery time.
    secretNames: []

# ─── NetworkPolicies (per role) ───────────────────────────────────────────────
# Default-deny ingress+egress scoped to THIS chart's pods, with explicit
# per-role allows. Off by default: enforcement needs a CNI that implements
# NetworkPolicy (Calico / Cilium / kube-router); on clusters without one the
# objects apply but are inert, so enabling is always safe — just possibly
# meaningless. Note on probes: kubelet health checks originate from the node
# and bypass policy enforcement in mainstream CNIs, so liveness/readiness keep
# working under default-deny.
#
# The namespace selectors below match the standard `kubernetes.io/metadata.name`
# label; adjust per environment if your dependencies live elsewhere.
networkPolicies:
  enabled: false
  # Ingress controller pods allowed to reach api / admin / mcp.
  ingressController:
    namespace: networking
    podLabels:
      app.kubernetes.io/name: traefik
  # Prometheus (ServiceMonitor scraper) allowed to reach the ops/metrics ports.
  monitoring:
    namespace: monitoring
  # The UI (BFF) pods — same namespace, separate chart.
  ui:
    podLabels:
      app.kubernetes.io/name: paladin-console
  postgres:
    namespace: database
    port: 5432
  # Object storage (SeaweedFS / Garage / MinIO). No port pin — deployments
  # differ (8333, 3900, 9000…); the namespace scope is the boundary.
  storage:
    namespace: storage
  nats:
    namespace: nats
    port: 4222
  # Broker ports the ADMIN pod may dial for the synchronous TestSubscription
  # RPC (443 is always allowed for K8s API + https webhooks). The dispatcher
  # is NOT limited by this list — it gets open egress, since customer sinks
  # live on arbitrary endpoints.
  adminBrokerPorts: [4222, 5671, 5672, 9092, 9093]
