# PALADIN Helm chart — per-role Deployments.
#
# The chart renders one Deployment per entry in `deployments:` plus a
# matching Service / ServiceAccount / optional HPA. Each role boots the
# same `paladin` binary with a different `serve <role>` argv, so a release is
# always one image with N pods carrying disjoint responsibilities.
#
# Roles (default keys):
#   api      — data + iam Connect listeners (public-ish traffic)
#   admin    — admin Connect listener (privileged operations)
#   worker   — background jobs with Postgres-leased leadership
#   mcp      — Model Context Protocol bridge (LLM-facing)
#
# Migrate and bootstrap run as Helm hook Jobs (pre-install / pre-upgrade)
# rather than from inside an api pod, so DDL never races a serve loop.
#
# To disable a role: `deployments.<role>.enabled: false`.

metadata:
  version: ""
  commit: "unknown"
  buildTime: "unknown"

# Time the kubelet waits for graceful shutdown before SIGKILL. Should
# exceed `config.server.shutdown_timeout` plus a small drain buffer.
terminationGracePeriodSeconds: 30

image:
  # Registry host is overridden per env. Local default points at the
  # dev-cluster registry; envs other than local flip this via
  # values-{dev,staging,prod}.yaml.
  repository: registry.local/paladin/paladin
  # Prod-safe default. Local overlay flips to Always because the
  # local registry rebuilds the same tag in-place.
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Default service account spec. Per-role `serviceAccount.name` overrides
# this — leave create=true at this level and the chart will mint one SA
# per role automatically (chart-fullname-rolename) so RBAC is naturally
# role-scoped.
serviceAccount:
  create: true
  # K8sSecretResolver REQUIRES the projected SA token to call the K8s
  # API on boot — resolver.go reads /var/run/secrets/kubernetes.io/
  # serviceaccount/token and fatals if it's missing. The previous
  # `automount: false` default broke migrate/bootstrap/serve pods the
  # moment any SecretRef field landed in config (observed: migrate Job
  # erroring 3h+ in cluster).
  #
  # Override to false ONLY when ALL config is inline (no `*_secret`
  # fields anywhere). Otherwise leave true.
  automount: true
  annotations: {}
  name: ""

# Pod-level security context. Defaults intentionally non-empty — distroless
# nonroot UID, RuntimeDefault seccomp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container-level. readOnlyRootFilesystem is safe because the binary
# writes only to stdout/stderr; configs are mounted RO from the ConfigMap;
# migrations are embedded in the binary.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL

# Defaults shared across every role. Each `deployments.<role>` block can
# override any of these via the same key name; the role-level value wins.
# Empty / unset role-level keys fall back to here.
defaults:
  replicas: 1
  # Conservative defaults sized for the dev cluster. Tune in
  # values-{dev,staging,prod}.yaml overlays per role via
  # `deployments.<role>.resources`. requests.cpu is REQUIRED for
  # HPA-on-CPU to work; do not drop without disabling autoscaling.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # readOnlyRootFilesystem (set in securityContext) requires a
  # writable /tmp for stdlib temp writes (TLS cert caching, tempfile,
  # etc.). emptyDir keeps it pod-local and erased on restart.
  volumes:
    - name: tmp
      emptyDir: {}
  volumeMounts:
    - name: tmp
      mountPath: /tmp
  # Empty by default. Multi-zone prod overlays populate this per role
  # so a single-AZ failure doesn't take all replicas of a role at once.
  # See values-prod.yaml for the canonical zone-spread block.
  topologySpreadConstraints: []
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

# ─── Per-role Deployments ──────────────────────────────────────────────────
#
# Each role pins:
#   - args     — argv passed to `paladin` (always starts with "serve")
#   - ports    — named container ports the Service maps onto
#   - probes   — liveness / readiness / startup, targeted at a role-port
#   - replicas, resources, autoscaling — independent scaling per role
#
# Probe paths (`/livez`, `/readyz`, `/startupz` for api/admin; `/healthz`
# for worker/mcp) map to the in-handler check sets — see internal/health
# for api/admin and serve_worker.go / serve_mcp.go for the simpler ops
# endpoints on worker / mcp.

deployments:
  api:
    enabled: true
    replicas: 2
    args:
      - "serve"
      - "api"
    ports:
      - name: data
        containerPort: 8080
      - name: iam
        containerPort: 8085
    livenessProbe:
      httpGet:
        path: /livez
        port: data
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: data
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        path: /startupz
        port: data
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    service:
      type: ClusterIP
      # First port lands at .spec.ports[0]; default port-forward hits
      # data:8080 which is what most operators expect.
      ports:
        - name: data
          port: 8080
          targetPort: data
        - name: iam
          port: 8085
          targetPort: iam
  admin:
    enabled: true
    # Admin pod sits behind a stricter ingress; single replica is fine.
    replicas: 1
    args:
      - "serve"
      - "admin"
    ports:
      - name: admin
        containerPort: 8090
    livenessProbe:
      httpGet:
        path: /livez
        port: admin
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: admin
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        path: /startupz
        port: admin
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    service:
      type: ClusterIP
      ports:
        - name: admin
          port: 8090
          targetPort: admin
  worker:
    enabled: true
    # Two replicas with anti-affinity so leases distribute; the lease
    # package guarantees only one pod runs each job at a time.
    replicas: 2
    args:
      - "serve"
      - "worker"
    ports:
      # 8090 matches cmd/server/serve_worker.go which reuses
      # cfg.Server.AdminHTTP.Addr (config.yaml: 0.0.0.0:8090) for the
      # ops listener. Don't reuse 8099 — that's the default fallback
      # the binary picks ONLY when AdminHTTP.Addr is empty in config.
      - name: ops
        containerPort: 8090
    # Worker speaks no Connect; ops port serves the simple /healthz +
    # /readyz handlers from cmd/server/serve_worker.go.
    livenessProbe:
      httpGet:
        path: /healthz
        port: ops
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: ops
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        path: /readyz
        port: ops
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    service:
      type: ClusterIP
      # Ops port exposed as a Service so kube-proxy can probe; not
      # consumed by external clients.
      ports:
        - name: ops
          port: 8099
          targetPort: ops
    # Anti-affinity keeps the two worker pods on different nodes — a
    # node failure should never take both leaders out at once.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/component: worker
  mcp:
    enabled: true
    replicas: 1
    args:
      - "serve"
      - "mcp"
      - "--transport=http"
    ports:
      - name: mcp
        containerPort: 8095
    livenessProbe:
      httpGet:
        path: /healthz
        port: mcp
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /healthz
        port: mcp
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    service:
      type: ClusterIP
      ports:
        - name: mcp
          port: 8095
          targetPort: mcp

  # Dispatcher plane — durable webhook fan-out. Consumes the
  # event_deliveries outbox (migration 028). Producer (admin pod)
  # writes rows; this Deployment polls them via FOR UPDATE SKIP LOCKED
  # and POSTs to customer sinks. Multiple replicas safe — SKIP LOCKED
  # hands each row to exactly one replica per cycle. HPA-friendly when
  # a queue-depth metric is wired (BACKLOG).
  dispatcher:
    enabled: true
    replicas: 1
    args:
      - "serve"
      - "dispatcher"
    ports:
      - name: ops
        containerPort: 8099
    livenessProbe:
      httpGet:
        path: /livez
        port: ops
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: ops
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    startupProbe:
      httpGet:
        path: /readyz
        port: ops
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 24
    service:
      type: ClusterIP
      ports:
        - name: ops
          port: 8099
          targetPort: ops

  # Ingest plane — storage-event consumer. Disabled by default in the
  # chart because it requires a publisher (SeaweedFS / MinIO / NATS /
  # RabbitMQ) to be in place; flip enabled=true when the source is
  # ready and `config.ingest` is filled in.
  ingest:
    enabled: false
    replicas: 1
    args:
      - "serve"
      - "ingest"
    ports:
      - name: ingest
        containerPort: 8100
    livenessProbe:
      httpGet:
        path: /healthz
        port: ingest
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 1
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /readyz
        port: ingest
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
      successThreshold: 1
    service:
      type: ClusterIP
      ports:
        - name: ingest
          port: 8100
          targetPort: ingest

# ─── PodDisruptionBudget ───────────────────────────────────────────────────
#
# Per-role PDBs gated on replicas>=2. A single-replica PDB is
# unsatisfiable and blocks node drains forever. Renders only when the
# effective replica count for a role is at least 2 (replicas>=2 or
# autoscaling.minReplicas>=2). minAvailable: 1 means at least one pod
# of THAT role stays serving through voluntary disruptions.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: ""  # set instead of minAvailable for percentage budgets

# ─── Observability (Prometheus Operator) ───────────────────────────────────
#
# Backend api / admin / worker / dispatcher / ingest expose Prometheus
# metrics. ServiceMonitor + PrometheusRule render only when the
# Prometheus Operator CRDs are installed AND `metrics.*.enabled` flipped
# in an env overlay — the chart stays installable in clusters without
# the operator.
metrics:
  serviceMonitor:
    enabled: false
    # Namespace where Prometheus Operator's Prometheus CR runs. Empty =
    # release namespace.
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    path: /v1/metrics
    # `release: <prometheus-release>` is the common label Prometheus
    # Operator uses to discover ServiceMonitors. Override per env.
    labels: {}
    relabelings: []
    metricRelabelings: []
  alerts:
    enabled: false
    labels: {}
    rules:
      crashLooping:
        enabled: true
        severity: critical
        for: 5m
      highErrorRate:
        enabled: true
        severity: warning
        threshold: 0.05
        for: 10m
      highLatency:
        enabled: true
        severity: warning
        thresholdSeconds: 1.5
        for: 10m
      notReady:
        enabled: true
        severity: warning
        for: 10m
      oomKilled:
        enabled: true
        severity: warning
        window: 15m

# ─── Lifecycle Jobs ────────────────────────────────────────────────────────
#
# Migrate + bootstrap run as Helm hook Jobs so DDL is gated outside the
# serve loop. Default schedule:
#
#   pre-install:  migrate (weight=0) → bootstrap (weight=10)
#   pre-upgrade:  migrate (weight=0) → bootstrap (weight=10)
#
# Either can be disabled (e.g. external migrator owns DDL).
jobs:
  migrate:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 600
    resources: {}
  bootstrap:
    enabled: true
    backoffLimit: 1
    activeDeadlineSeconds: 120
    resources: {}

# ─── Application config ────────────────────────────────────────────────────
#
# Single ConfigMap shared by every role. The Go binary reads only the
# subset relevant to its subcommand (e.g. `serve worker` ignores the
# server.* listener block).
# ─── App config (templated into the ConfigMap) ─────────────────────────────
#
# Defaults here are PROD-SAFE. The dev cluster opt-ins (debug logging,
# dummy access keys, hard-coded signing key, `*.local` endpoints)
# live in values-local.yaml and are applied via `helm -f values-local.yaml`.
# Never restore dev defaults here — a future operator who installs the
# chart with just `helm install paladin .` must get a deployment that's not
# silently insecure.
config:
  app:
    name: paladin
    # Real environment is set per overlay (values-{local,dev,staging,prod}.yaml).
    # Empty means "operator forgot to pick an overlay"; surface that loudly
    # at startup if the binary cares about app.env (config validation).
    env: ""

  logger:
    # info-level + non-development zap config is the prod default. Local
    # overlay flips to debug + development:true for stack traces.
    level: info
    format: json
    development: false
    disable_caller: false
    disable_stacktrace: true
    sampling:
      enabled: false
      initial: 100
      thereafter: 100

  otel:
    enabled: false
    endpoint: "otel-collector:4317"
    protocol: http
    # insecure off by default — prod OTel collector terminates TLS.
    # Local overlay flips this back on.
    insecure: false

  runtime:
    # Gin mode `release` — debug skipped in prod.
    mode: release
    shutdown_timeout: 20s
    log_probes: false

  api:
    server:
      data: &http_defaults
        addr: "0.0.0.0:8080"
        read_header_timeout: 5s
        read_timeout: 30s
        write_timeout: 30s
        idle_timeout: 90s
        max_header_bytes: 1048576
        max_body_bytes: 10485760
        request_id_header: "X-Request-Id"
        real_ip_header: "X-Forwarded-For"
        trusted_proxies: []
        cors_allowed_origins: []
        tls: { enabled: false }
      iam:
        <<: *http_defaults
        addr: "0.0.0.0:8085"

  admin:
    server:
      <<: *http_defaults
      addr: "0.0.0.0:8090"

  datastores:
    postgres:
      dsn: "postgres://paladin_app@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=disable"
      password_secret:
        name: paladin-postgresql-app-user
        key: password
        namespace: database
      migrate_dsn: "postgres://paladin_migrate@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=disable"
      migrate_password_secret:
        name: paladin-postgresql-migrate-user
        key: password
        namespace: database
      reaper_dsn: ""
      pool:
        max_conns: 20
        min_conns: 2
        max_conn_lifetime: 30m
        max_conn_idle_time: 5m
      timeouts:
        connect: 5s
        statement: 30s
      healthcheck_period: 30s

  limits:
    max_object_size: "100MB"
    max_multipart_size: "1TB"
    min_part_size: "5MB"
    max_part_size: "5GB"
    max_parts: 10000
    allowed_content_types:
      - "image/jpeg"
      - "image/png"
      - "image/heic"
      - "image/heif"
      - "image/tiff"
      - "text/plain"
      - "application/pdf"
      - "application/json"
      - "application/octet-stream"
    presign:
      put_ttl: 15m
      get_ttl: 15m
      part_ttl: 15m
      default_ttl: 15m
      max_ttl: 168h
      default_max_size: 5368709120

  auth:
    # No issuer / signing_key defaults — every env overlay MUST set
    # both. An empty signing_key surfaces as a startup error rather
    # than a quietly-broken JWT verification path.
    issuer: ""
    signing_key: ""
    jwks_url: ""
    leeway: 30s
    access_token_ttl: 15m
    refresh_token_ttl: 168h
    scoped_token_max_ttl: 24h

  security:
    # Prod-safe: do NOT trust client-supplied tenant header. Local
    # overlay flips this true for dev convenience (admin tooling
    # sending X-Tenant-Id without a JWT).
    trust_tenant_id_from_request: false
    reject_tenant_mismatch: true
    log_sensitive: false
    # RLS is not a knob — the runtime unconditionally installs the
    # BeforeAcquire hook that stamps paladin.tenant_id GUC. Migration
    # 023 makes RLS unavoidable at the DB layer (per-table policies
    # on objects/object_tags/quotas/etc), and paladin_app is
    # NOBYPASSRLS by design, so any "off" position would break
    # every write. See internal/config/types.go for rationale.

  bootstrap:
    admin:
      enabled: true
      subject: "admin"
      tenant_slug: "platform"
      tenant_display_name: "Platform"
      display_name: ""
      roles: ["platform.admin"]
      password_secret:
        name: "paladin-bootstrap-admin"
        key: "password"
        namespace: ""
      min_password_length: 0
      force_reset: true

  middleware:
    timeouts:
      fast_operation: 5s
      default_operation: 30s
      s3_operation: 60s
      long_operation: 2m
    rate_limit:
      enabled: true
      requests_per_second: 300
      burst: 500
      max_tenants: 10000
      cleanup_ttl: 10m
      cleanup_interval: 5m
    cache:
      enabled: true
      max_size: 1000
      ttl: 5m
    idempotency:
      enabled: true
      ttl: 24h

  worker:
    ops:
      <<: *http_defaults
      addr: "0.0.0.0:8090"
    jobs:
      reconciler:
        interval: 30s
        min_object_age: 2h
        batch_size: 100
      housekeeping:
        interval: 1h
        pending_ttl: 24h
        multipart_ttl: 72h
        audit_log_ttl: 8760h
        delete_orphaned_parts: false
      refresh_token_reap:
        interval: 1h
      api_key_reap:
        interval: 1h
      lifecycle:
        enabled: true
        interval: 30m
      replication:
        enabled: false
        interval: 5m
        lookback_window: 1h

  # Dispatcher role — durable webhook fan-out. The pod polls the
  # event_deliveries outbox (migration 028) and POSTs to customer
  # sinks. See backend/configs/config.yaml for full inline docs on
  # each knob. Cross-tenant note: production deploys MUST point
  # datastores.postgres.migrate_dsn at a BYPASSRLS role (paladin_migrate)
  # so the loop can scan across tenants. Without it the SELECT
  # returns zero rows under RLS.
  dispatcher:
    ops:
      addr: "0.0.0.0:8099"
    poll_interval: 1s
    batch_size: 50
    base_backoff: 5s
    max_backoff: 1h
    default_max_attempts: 5

  storage:
    default_backend: primary
    backends:
      primary:
        kind: s3-compatible
        bucket: paladin-primary
        region: us-east-1
        # No default endpoint / public_endpoint — env overlay MUST
        # set both. Empty surfaces as a startup error.
        endpoint: ""
        public_endpoint: ""
        force_path_style: true
        # Credentials. By default sourced from a sibling K8s Secret via
        # `storage.s3CredentialsSecret` (chart-managed or external) —
        # the configmap.yaml template injects the matching SecretRef
        # blocks (`access_key_secret` / `secret_key_secret`) at render
        # time when that feature is on. Leave both inline keys empty
        # here; the template + RBAC do the rest.
        #
        # Overlays that need inline plaintext (e.g. `values-local.yaml`)
        # SHOULD set `storage.s3CredentialsSecret.create: false` AND
        # provide `auth.access_key` / `auth.secret_key` here; the
        # template suppresses the SecretRef injection when neither
        # `create` nor `existingSecret` is set, so the inline/SecretRef
        # mutual-exclusion check stays happy.
        auth:
          mode: static_keys
          access_key: ""
          secret_key: ""
        part_size: "8MB"
        sse:
          type: ""
          key_id: ""
        events:
          enabled: false
          target: "none"
          queue_url: ""
          poll_interval: 20s

  cedar:
    policy_cache_ttl: 30s

  mcp:
    upstreams:
      # Inside the cluster the MCP pod talks to the api / admin Services
      # (not localhost — that was the standalone-binary era). Defaults
      # below are rendered via `tpl` in templates/configmap.yaml so the
      # Service names track chart.fullname automatically — override only
      # for cross-release setups (sidecar MCP pointing at a different
      # PALADIN install) or when terminating TLS in front of those Services.
      admin_url: 'http://{{ include "chart.fullname" . }}-admin:8090'
      data_url: 'http://{{ include "chart.fullname" . }}-api:8080'
      iam_url: 'http://{{ include "chart.fullname" . }}-api:8085'
    stdio:
      enabled: false
      profile: read_only
    http:
      enabled: true
      addr: ":8095"
      profile: read_only
      session_timeout: 10m
    # Tool catalog gating. Profiles + always_deny live in
    # internal/mcp/profile.go (built-in defaults); these blocks are the
    # operator override seam. Leave empty to use the defaults.
    profiles: {}
    # always_deny: []

  # ─── Capability tokens (Ed25519 JWT, agent-runtime) ──────────────────
  #
  # Short-lived caveat-bearing JWTs minted by admin and verified on
  # data/admin/mcp. Off by default — enable per-deploy once a signing
  # key is mounted (production) or accept the ephemeral keypair (dev).
  # See internal/capability/ for the package and proto/paladin/admin/v1
  # CapabilityService for the issuance RPC.
  capability:
    enabled: false 
    issuer_name: ""                     # `iss` claim; conventional: external URL or "paladin-prod-eu"
    trusted_issuers: []                 # accepted `iss` values; include issuer_name
    signing_key_path: ""                # PEM PKCS#8 Ed25519 private key; "" → ephemeral keypair (dev only)
    signing_key_kid: ""                 # JWT header kid; "" → derived from public key bytes
    default_ttl: 15m                    # cap when Issue.TTL omitted
    verifier_leeway: 30s                # clock-skew window for nbf / exp
    charge_per_request_amount: 0        # amount auto-charged on billable handler calls; 0 = no auto-charge
    charge_per_request_unit: ""         # unit code (USD/EUR/UAH/GBP/UNIT); empty = use capability's own unit
    revocation_cache_ttl: 2s            # IsRevoked cache TTL; <0 disables (every check hits DB)

  # ─── API tokens (hashed-bearer M2M, long-lived) ──────────────────────
  #
  # Service-to-service credentials following the GitHub-PAT / Stripe /
  # Hatchet pattern. Distinct from capability (agent JWT, short-lived)
  # and auth (user OIDC). Off by default — enable per-deploy once an
  # issuance path (CLI or admin UI) is rolled out.
  api_token:
    enabled: false
    max_ttl: 8760h                      # cap on Issue lifetime; 1y default
    verifier_leeway: 30s                # clock-skew on expires_at
    touch_last_used: true               # bump last_used_at on verify (off for high-QPS deploys)

  # ─── Ingest plane (storage-event consumer) ───────────────────────────
  #
  # Off by default; flip enabled=true when a publisher is wired up.
  # Driver picks the transport — webhook | nats | rabbitmq.
  #
  # Webhook is the simplest: SeaweedFS / MinIO POST events to
  # http://<ingest-svc>:8100/webhook/<source>. Pair shared_secret
  # here with the publisher's `bearer_token` (SeaweedFS) so HMAC
  # verification passes.
  ingest:
    enabled: false
    driver: webhook
    webhook:
      addr: ":8100"
      shared_secret: ""
      signature_header: "X-PALADIN-Signature"
      max_body_bytes: 1048576
    dedup_ttl: 24h
    reaper_interval: 1h
    # nats / rabbitmq blocks are populated when those drivers land.

# ─── Bootstrap admin Secret ────────────────────────────────────────────────
#
# When chart-level `bootstrap.admin.enabled=true` the chart provisions
# the platform-admin password Secret so K8sSecretResolver can read it on
# first boot. The two-flag split (`config.bootstrap.admin.enabled` =
# server runs the boot step; `bootstrap.admin.enabled` = chart provisions
# the Secret) is intentional — GitOps shapes use the SealedSecret path
# and need to set the chart flag to false. See secret-bootstrap-admin.yaml
# for the full matrix of combinations.
bootstrap:
  admin:
    enabled: false
    password: ""
    passwordSecret:
      name: "paladin-bootstrap-admin"
      key: "password"

# ─── Primary storage backend credentials ────────────────────────────────────
#
# Sibling K8s Secret holding the S3 / SeaweedFS access_key + secret_key for
# `config.storage.backends.primary`. The default config.yaml references this
# Secret via `*_secret` SecretRef fields — K8sSecretResolver fetches the
# values at boot using the pod's projected token (same path as PG / bootstrap
# creds). Chart renders the Secret with the SeaweedFS `dummy_*` values by
# default so a `helm install` against a fresh cluster produces a config
# that passes validation without an overlay.
#
# Three modes:
#
#   1. `create: true` (default) — chart provisions the Secret. Override
#      `accessKey` / `secretKey` in your env overlay for non-dummy values.
#   2. `create: true`, `existingSecret: <name>` — chart skips its own
#      Secret; config references the externally-managed one (SealedSecret,
#      ExternalSecret, manual `kubectl apply`). Operator is responsible
#      for the keys being named `access_key` / `secret_key`.
#   3. `create: false` — chart skips the Secret entirely AND the values
#      *_secret refs still resolve to `name`, so the caller MUST either
#      set `existingSecret` to a real one OR null out
#      `config.storage.backends.primary.auth.{access,secret}_key_secret`
#      in the overlay (e.g. `values-local.yaml` inlines plain keys).
#
# rbac.secretReader.secretNames below MUST contain `name` (or
# `existingSecret` when used) or the resolver gets a 403 at startup.
storage:
  s3CredentialsSecret:
    create: true
    name: "paladin-s3-credentials"
    existingSecret: ""
    # SeaweedFS dev defaults — match the `identities` blob the storage
    # namespace ships with so a vanilla install talks to the local
    # SeaweedFS without an overlay edit. Production overlays MUST
    # override these (or set `existingSecret`).
    accessKey: "dummy_access_key"
    secretKey: "dummy_secret_key"

# ─── Traefik IngressRoute ──────────────────────────────────────────────────
#
# Targets the api Service (data + iam ports) per env. Admin gets no
# public ingress by default — operators bring their own behind mTLS /
# VPN / bastion. To expose admin externally, render a separate
# IngressRoute in the env overlay or fork this chart.
#
# Routing model: Traefik IngressRoute (consistent with acme's
# core-api). The chart previously shipped both generic `Ingress` and
# Gateway API `HTTPRoute` templates gated off; both removed to commit
# to a single routing path.
traefik:
  enabled: true
  # entryPoints reference Traefik's static config. Defaults to
  # `websecure` (HTTPS); add `web` if HTTP-only is also needed.
  entryPoints:
    - websecure
  # No default hosts — each env overlay declares its own DNS. Empty
  # list means the chart emits no IngressRoute (operator hasn't picked
  # an env yet).
  hosts: []
  annotations: {}
  # Optional middlewares to chain on the route. Each entry is
  # `{name: "<middleware-name>", namespace: "<ns>"}` — namespace is
  # optional (defaults to release namespace).
  middlewares: []

# ─── TLS via cert-manager ──────────────────────────────────────────────────
tls:
  enabled: true
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod
  # If certManager.enabled=false, point at an externally-managed Secret
  # (e.g. the cluster-wide `traefik-tls` provisioned by gitops on
  # the local cluster).
  existingSecret: ""

# ─── RBAC for K8sSecretResolver ────────────────────────────────────────────
#
# The resolver issues exactly one verb (GET) per referenced secret name.
# `secretNames` lists every secret referenced from `config.*.password_secret`
# / `config.*.access_key_secret` / `config.*.secret_key_secret`. New secret
# references must extend this list or the resolver 403s at startup.
#
# The single ClusterRole is bound to every role's ServiceAccount — keeps
# RBAC minimal. To split (e.g. mcp gets a wider key set), copy the
# ClusterRole and bind only mcp's SA.
rbac:
  secretReader:
    enabled: true
    clusterWide: true
    # NOTE: the chart automatically appends the primary-storage credential
    # Secret name (storage.s3CredentialsSecret.existingSecret or .name)
    # to this list at render time — no manual entry needed when the
    # storage block is enabled. See templates/rbac.yaml.
    secretNames:
      - paladin-postgresql-app-user
      - paladin-postgresql-migrate-user
      - paladin-admin-key
      - paladin-bootstrap-admin
