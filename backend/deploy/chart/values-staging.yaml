# Paladin Helm values overlay for STAGING. Mirrors prod's config as
# closely as feasible — same auth mode, same logger level (info),
# same TLS strategies — so a regression that surfaces here is a
# real prod risk.
#
# TODO before first apply: replace any `<...>` placeholder with real
# staging values.

config:
  app:
    env: staging

  logger:
    level: info

  otel:
    enabled: true
    insecure: false

  auth:
    issuer: "https://paladin.staging.example/"
    signing_key: "<staging-signing-key>"

  storage:
    backends:
      primary:
        endpoint: "<staging-seaweedfs-endpoint>"
        public_endpoint: "https://s3.paladin.staging.example"
        # auth.access_key / secret_key sourced from K8s Secret via
        # `storage.s3CredentialsSecret` below.

# Primary-backend credentials. Staging convention: point at an
# ExternalSecret-managed Secret named `paladin-s3-credentials` so SOPS /
# Vault owns the values; set `create: false` to skip chart-side rendering.
storage:
  s3CredentialsSecret:
    create: false
    existingSecret: "paladin-s3-credentials"

image:
  pullPolicy: IfNotPresent

traefik:
  hosts:
    - api.paladin.staging.example
tls:
  certManager:
    enabled: true
    issuerName: letsencrypt-prod
    issuerKind: ClusterIssuer

# Slightly higher resources than chart defaults — staging carries
# realistic synthetic load. Tune per role.
defaults:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 1Gi

deployments:
  api:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70

metrics:
  mode: scrape
  podMonitor:
    labels:
      release: kube-prometheus-stack
  alerts:
    enabled: true
    labels:
      release: kube-prometheus-stack
    # Tighter thresholds than prod — surface anomalies sooner.
    rules:
      highErrorRate:
        threshold: 0.02
      highLatency:
        thresholdSeconds: 1.0

# The in-cluster CNPG cluster; its operator publishes the role passwords in
# the `database` namespace.
postgres:
  host: paladin-postgresql-rw.database.svc.cluster.local
  app:
    existingSecret: paladin-postgresql-app-user
    namespace: database
  migrate:
    existingSecret: paladin-postgresql-migrate-user
    namespace: database

# The Postgres operator keeps its user Secrets in the `database` namespace,
# which a namespaced Role cannot reach.
rbac:
  secretReader:
    clusterWide: true
    secretNames:
      - paladin-postgresql-app-user
      - paladin-postgresql-migrate-user
      - paladin-postgresql-reaper-user
      - paladin-admin-key
      - paladin-bootstrap-admin
      - paladin-auth-signing-key
      - paladin-ingest-hmac

# TLS between the planes, from the certificate cert-manager issues into the
# release namespace.
internalTLS:
  enabled: true
  existingSecret: paladin-api-mtls
