# Paladin Helm values overlay for PRODUCTION.
#
# Treat this file as the canonical "this is what runs in production"
# document. Any change here merits a code review, a runbook update,
# and a deliberate ArgoCD sync.
#
# TODO before first apply: replace any `<...>` placeholder with the
# real prod value (from prod Pulumi outputs / secret store / SealedSecret).

# CNPG CA for sslmode=verify-full. Sync the `paladin-postgresql-ca` Secret
# (CNPG publishes `<cluster>-ca` in the database ns; key `ca.crt`) into
# the Paladin namespace via ExternalSecret. Pods mount it at /etc/paladin/pg-ca;
# the prod DSNs below reference sslrootcert=/etc/paladin/pg-ca/ca.crt.
postgresCa:
  secretName: paladin-postgresql-ca

config:
  app:
    env: prod

  # Postgres connection budget vs CNPG max_connections. Ownership of the
  # durable headroom fix (max_connections / PgBouncer) is gitops's, not
  # this chart — see docs/adr/0007-postgres-connection-headroom.md (and
  # ADR-0005 for the same CNPG-ownership boundary).
  #
  #   per-pod pool.max_conns = 6
  #   steady-state pods: api 3 + admin 2 + worker 3 + dispatcher 2 + mcp 2
  #     = 12 pods → 72 conns; + migrate/bootstrap hook Jobs (transient).
  #   non-api steady-state floor (admin+worker+dispatcher+mcp = 9 pods)
  #     = 54 conns; api scales on top via HPA.
  #
  # Budget contract: api.maxReplicas × 6 + 54 + job headroom must stay
  # under the cluster's max_connections. At the default 100, api.maxReplicas
  # must stay ≤ ~7. The recommended prod posture is gitops raising CNPG
  # max_connections to ≥300 (or fronting it with PgBouncer), which lifts the
  # HPA ceiling out of this budget entirely — see ADR-0007.
  datastores:
    postgres:
      pool:
        max_conns: 6
        min_conns: 1
      # verify-full authenticates the CNPG server cert (closes the
      # MITM-with-a-forged-cert gap that bare `require` leaves open). The
      # CNPG CA is mounted via postgresCa.secretName below; sslrootcert
      # must match postgresCa.mountPath + /ca.crt. CNPG server-cert SANs
      # cover the cluster service DNS, so the host below validates.
      dsn: "postgres://paladin_app@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=verify-full&sslrootcert=/etc/paladin/pg-ca/ca.crt"
      migrate_dsn: "postgres://paladin_migrate@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=verify-full&sslrootcert=/etc/paladin/pg-ca/ca.crt"

  runtime:
    # Gates /system/health.json (component tree + subsystem + Postgres
    # reachability). MUST come from a SealedSecret / ExternalSecret — same
    # posture as signing_key. The frontend BFF aggregator receives the same
    # value via PALADIN_HEALTH_SNAPSHOT_TOKEN (frontend chart). Empty would
    # leave the snapshot open; never do that in prod.
    health_snapshot_token: "<prod-health-token-from-sealed-secret>"

  logger:
    level: info

  otel:
    enabled: true
    insecure: false

  auth:
    # The OAuth issuer identifier (the `iss` claim). No trailing slash — it
    # must equal config.mcp.oauth.authorization_server.issuer exactly, and a
    # trailing slash breaks the /.well-known/ metadata fetch.
    issuer: "https://paladin.example.com"
    # signing_key MUST come from a SealedSecret / ExternalSecret — NEVER
    # commit a real signing key here. Leave signing_key empty and point
    # signing_key_secret at the Secret the SealedSecret controller unseals in
    # this namespace; the resolver reads it at boot. The name below must also
    # appear in rbac.secretReader.secretNames. See docs/security.md (kubeseal
    # runbook).
    signing_key: ""
    signing_key_secret:
      name: paladin-auth-signing-key
      key: signing_key

    # OAuth 2.1 Authorization Server (ADR-0009): the /oauth/authorize +
    # /oauth/token + /oauth/register endpoints that mint the bearers the MCP
    # Resource Server validates. For the end-to-end Claude Desktop / Cursor
    # flow you must ALSO enable the RS side under `config.mcp.oauth`
    # (ADR-0008) so the MCP server advertises this AS in its discovery
    # metadata. Tokens reuse the signing_key + access/refresh TTLs above.
    oauth:
      enabled: true
      # Browser-reachable consent page (the frontend route). Omit to fall
      # back to the built-in server-rendered consent form.
      consent_url: "https://paladin.example.com/oauth/consent"
      # Dynamic Client Registration OFF in prod: only the seed_clients below
      # may run the flow. Enable only behind a trusted ingress + rate limit.
      dynamic_registration: false
      authorization_code_ttl: "60s"
      # Schemes a registered redirect_uri may use (desktop clients use custom
      # schemes). redirect_uris are still matched EXACTLY, per client.
      allowed_redirect_schemes: ["https", "claude-desktop", "cursor"]
      # First-party clients seeded (idempotent upsert) at boot so the flow
      # works without DCR. Public = PKCE-only, no secret in config.
      # NOTE: confirm each redirect_uri against the client's published OAuth
      # docs before rollout — they are matched exactly.
      seed_clients:
        - client_id: "claude-desktop"
          redirect_uris:
            - "claude-desktop://callback"
            - "https://claude.ai/api/mcp/auth_callback"
          allowed_scopes: ["paladin.read", "paladin.write"]
          allowed_audiences: ["paladin-data"]
          public: true
        - client_id: "cursor"
          redirect_uris:
            - "cursor://anysphere.paladin/callback"
          allowed_scopes: ["paladin.read"]
          allowed_audiences: ["paladin-data"]
          public: true

  security:
    log_sensitive: false

  storage:
    backends:
      primary:
        endpoint: "https://s3.internal.example.com"
        public_endpoint: "https://s3.example.com"
        # auth.access_key / secret_key sourced from K8s Secret via
        # `storage.s3CredentialsSecret` below. Production NEVER inlines
        # plaintext keys here.

  # MCP server config. The oauth block here is the Resource-Server half
  # (ADR-0008) — the counterpart to config.auth.oauth (the AS, ADR-0009).
  # Enable BOTH for the end-to-end Claude Desktop / Cursor flow: the RS
  # advertises where to authenticate + challenges unauthenticated /mcp, the
  # AS mints the bearer the RS then validates. (upstreams/http/profiles are
  # inherited from values.yaml.)
  mcp:
    oauth:
      enabled: true
      # This MCP server's public resource identifier (RFC 8707). The access
      # token's `aud` is bound to it; clients pass it as ?resource=.
      resource_url: "https://mcp.paladin.example.com/mcp"
      # The Authorization Server(s) that mint tokens for this resource — the
      # IAM plane serving config.auth.oauth. MUST match config.auth.issuer so
      # clients fetch the right AS metadata.
      authorization_servers:
        - "https://paladin.example.com"
      scopes_supported: ["paladin.read", "paladin.write"]
      # RFC 8414 AS metadata served at /.well-known/oauth-authorization-server
      # (Paladin-IAM-is-the-AS, same origin). issuer MUST equal config.auth.issuer.
      authorization_server:
        issuer: "https://paladin.example.com"
        authorization_endpoint: "https://paladin.example.com/oauth/authorize"
        token_endpoint: "https://paladin.example.com/oauth/token"
        # registration_endpoint omitted — DCR is off in prod (auth.oauth).
        # jwks_uri omitted — IAM access tokens are HS256 (symmetric), verified
        # server-side, so there is no public key set for clients to fetch.

# Primary-backend credentials Secret. Prod convention: ExternalSecret
# (managed by SOPS / Vault / AWS Secrets Manager controller) provisions
# `paladin-s3-credentials` with `access_key` and `secret_key` keys.
storage:
  s3CredentialsSecret:
    create: false
    existingSecret: "paladin-s3-credentials"

image:
  pullPolicy: IfNotPresent

traefik:
  hosts:
    - api.paladin.example.com
tls:
  certManager:
    enabled: true
    issuerName: letsencrypt-prod
    issuerKind: ClusterIssuer

# Resources sized for prod load. Tune per role based on observed
# usage; api / dispatcher / worker scale independently via HPA.
defaults:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 2Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: paladin-core

deployments:
  api:
    replicas: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70
  admin:
    replicas: 2
  worker:
    replicas: 3
  dispatcher:
    replicas: 2
  # MCP must be ≥2 in prod: the base chart defaults it to 1, which
  # renders no PodDisruptionBudget, so a routine node drain takes the
  # whole MCP plane offline. Two replicas earn it a PDB and survive
  # single-node maintenance.
  mcp:
    replicas: 2

# PDB: minAvailable: 2 means a single-zone failure leaves at least
# two pods of each multi-replica role serving.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: kube-prometheus-stack
  alerts:
    enabled: true
    labels:
      release: kube-prometheus-stack
    # Prod thresholds. Tune narrower once a real SLO is published.
    rules:
      highErrorRate:
        threshold: 0.01
        for: 5m
      highLatency:
        thresholdSeconds: 0.8
        for: 5m

# Local-cluster bootstrap admin Secret literal is OFF; prod uses
# externally-managed SealedSecret / ExternalSecret.
bootstrap:
  admin:
    enabled: false
