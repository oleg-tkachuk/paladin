# PALADIN Helm values overlay for PRODUCTION.
#
# Treat this file as the canonical "this is what runs in production"
# document. Any change here merits a code review, a runbook update,
# and a deliberate ArgoCD sync.
#
# TODO before first apply: replace any `<...>` placeholder with the
# real prod value (from prod Pulumi outputs / secret store / SealedSecret).

# CNPG CA for sslmode=verify-full. Sync the `paladin-postgresql-ca` Secret
# (CNPG publishes `<cluster>-ca` in the database ns; key `ca.crt`) into
# the PALADIN namespace via ExternalSecret. Pods mount it at /etc/paladin/pg-ca;
# the prod DSNs below reference sslrootcert=/etc/paladin/pg-ca/ca.crt.
postgresCa:
  secretName: paladin-postgresql-ca

config:
  app:
    env: prod

  # Postgres connection budget vs CNPG max_connections. Ownership of the
  # durable headroom fix (max_connections / PgBouncer) is gitops's, not
  # this chart — see docs/adr/0007-postgres-connection-headroom.md (and
  # ADR-0005 for the same CNPG-ownership boundary).
  #
  #   per-pod pool.max_conns = 6
  #   steady-state pods: api 3 + admin 2 + worker 3 + dispatcher 2 + mcp 2
  #     = 12 pods → 72 conns; + migrate/bootstrap hook Jobs (transient).
  #   non-api steady-state floor (admin+worker+dispatcher+mcp = 9 pods)
  #     = 54 conns; api scales on top via HPA.
  #
  # Budget contract: api.maxReplicas × 6 + 54 + job headroom must stay
  # under the cluster's max_connections. At the default 100, api.maxReplicas
  # must stay ≤ ~7. The recommended prod posture is gitops raising CNPG
  # max_connections to ≥300 (or fronting it with PgBouncer), which lifts the
  # HPA ceiling out of this budget entirely — see ADR-0007.
  datastores:
    postgres:
      pool:
        max_conns: 6
        min_conns: 1
      # verify-full authenticates the CNPG server cert (closes the
      # MITM-with-a-forged-cert gap that bare `require` leaves open). The
      # CNPG CA is mounted via postgresCa.secretName below; sslrootcert
      # must match postgresCa.mountPath + /ca.crt. CNPG server-cert SANs
      # cover the cluster service DNS, so the host below validates.
      dsn: "postgres://paladin_app@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=verify-full&sslrootcert=/etc/paladin/pg-ca/ca.crt"
      migrate_dsn: "postgres://paladin_migrate@paladin-postgresql-rw.database.svc.cluster.local:5432/paladin?sslmode=verify-full&sslrootcert=/etc/paladin/pg-ca/ca.crt"

  runtime:
    # Gates /system/health.json (component tree + subsystem + Postgres
    # reachability). MUST come from a SealedSecret / ExternalSecret — same
    # posture as signing_key. The frontend BFF aggregator receives the same
    # value via PALADIN_HEALTH_SNAPSHOT_TOKEN (frontend chart). Empty would
    # leave the snapshot open; never do that in prod.
    health_snapshot_token: "<prod-health-token-from-sealed-secret>"

  logger:
    level: info

  otel:
    enabled: true
    insecure: false

  auth:
    issuer: "https://paladin.example.com/"
    # signing_key MUST come from a SealedSecret / ExternalSecret —
    # NEVER commit a real signing key here.
    signing_key: "<prod-signing-key-from-sealed-secret>"

  security:
    log_sensitive: false

  storage:
    backends:
      primary:
        endpoint: "https://s3.internal.example.com"
        public_endpoint: "https://s3.example.com"
        # auth.access_key / secret_key sourced from K8s Secret via
        # `storage.s3CredentialsSecret` below. Production NEVER inlines
        # plaintext keys here.

# Primary-backend credentials Secret. Prod convention: ExternalSecret
# (managed by SOPS / Vault / AWS Secrets Manager controller) provisions
# `paladin-s3-credentials` with `access_key` and `secret_key` keys.
storage:
  s3CredentialsSecret:
    create: false
    existingSecret: "paladin-s3-credentials"

image:
  pullPolicy: IfNotPresent

traefik:
  hosts:
    - api.paladin.example.com
tls:
  certManager:
    enabled: true
    issuerName: letsencrypt-prod
    issuerKind: ClusterIssuer

# Resources sized for prod load. Tune per role based on observed
# usage; api / dispatcher / worker scale independently via HPA.
defaults:
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 2Gi
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: paladin

deployments:
  api:
    replicas: 3
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 12
      targetCPUUtilizationPercentage: 70
  admin:
    replicas: 2
  worker:
    replicas: 3
  dispatcher:
    replicas: 2
  # MCP must be ≥2 in prod: the base chart defaults it to 1, which
  # renders no PodDisruptionBudget, so a routine node drain takes the
  # whole MCP plane offline. Two replicas earn it a PDB and survive
  # single-node maintenance.
  mcp:
    replicas: 2

# PDB: minAvailable: 2 means a single-zone failure leaves at least
# two pods of each multi-replica role serving.
podDisruptionBudget:
  enabled: true
  minAvailable: 2

metrics:
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: kube-prometheus-stack
  alerts:
    enabled: true
    labels:
      release: kube-prometheus-stack
    # Prod thresholds. Tune narrower once a real SLO is published.
    rules:
      highErrorRate:
        threshold: 0.01
        for: 5m
      highLatency:
        thresholdSeconds: 0.8
        for: 5m

# Local-cluster bootstrap admin Secret literal is OFF; prod uses
# externally-managed SealedSecret / ExternalSecret.
bootstrap:
  admin:
    enabled: false
