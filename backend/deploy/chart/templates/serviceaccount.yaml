{{- /*
  One ServiceAccount per enabled role AND per enabled Job. Per-role
  SAs let RBAC differ by role (e.g. mcp gets a wider secret-read set,
  worker gets nothing beyond Postgres creds; the migrate / bootstrap
  Jobs each get their own identity for audit). When
  `serviceAccount.create=false` or a role pins its own
  `serviceAccount.name`, no SA is rendered for that entry.

  De-dup: if two roles / jobs compute the same final SA name (e.g.
  both pin `serviceAccount.name: shared-sa`), only the first
  iteration emits the manifest. Helm itself would error on the
  duplicate; we filter via a visited-set carried as a dict.

  Jobs are iterated AFTER deployments because the migrate /
  bootstrap Jobs reference their SA from job-*.yaml via the same
  `chart.roleServiceAccountName` helper — leaving that SA
  un-rendered makes the kubelet refuse to schedule the pod with
  "serviceaccount … not found".
*/}}
{{- if .Values.serviceAccount.create -}}
{{- $seen := dict -}}
{{- range $role, $spec := .Values.deployments }}
{{- if $spec.enabled }}
{{- $sa := include "chart.roleServiceAccountName" (dict "ctx" $ "role" $role "spec" $spec) -}}
{{- if not (hasKey $seen $sa) -}}
{{- $_ := set $seen $sa true -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "chart.roleLabels" (dict "ctx" $ "role" $role) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $.Values.serviceAccount.automount }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Job-side SAs — same name resolution, same de-dup set. */ -}}
{{- range $jobName, $jobSpec := .Values.jobs }}
{{- if $jobSpec.enabled }}
{{- $sa := include "chart.roleServiceAccountName" (dict "ctx" $ "role" $jobName "spec" (default dict $jobSpec)) -}}
{{- if not (hasKey $seen $sa) -}}
{{- $_ := set $seen $sa true -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels:
    {{- include "chart.roleLabels" (dict "ctx" $ "role" $jobName) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $.Values.serviceAccount.automount }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
