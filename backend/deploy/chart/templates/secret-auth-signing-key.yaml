{{- /*
The key that signs the access tokens the IAM plane issues. Rendered only when
config.auth names no key and no Secret, and auth.signingKey.existingSecret is
empty — see chart.authSigningKey.

Generated once and then preserved: `lookup` reads the deployed Secret back, so
an upgrade does not rotate the key and log every session out. Under a
client-side render (ArgoCD, `helm template`) lookup returns nothing and the key
would change on every sync; set auth.signingKey.existingSecret there.
*/ -}}
{{- $sk := fromJson (include "chart.authSigningKey" .) -}}
{{- if $sk.create -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $sk.name -}}
{{- $value := "" -}}
{{- if and $existing (hasKey $existing.data $sk.key) -}}
{{- $value = index $existing.data $sk.key | b64dec -}}
{{- else -}}
{{- $value = randAlphaNum (int .Values.auth.signingKey.generatedLength) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sk.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: removing it would invalidate every token issued.
    helm.sh/resource-policy: keep
    # Before the Jobs and the Deployments that read it; pre-install only, for
    # the reason given on secret-bootstrap-admin.yaml.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "argocd.argoproj.io/sync-wave": "-20"
type: Opaque
data:
  {{ $sk.key }}: {{ $value | b64enc | quote }}
{{- end }}
