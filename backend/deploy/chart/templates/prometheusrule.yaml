{{/*
PrometheusRule — every Paladin alert, for the whole release (ADR-0023).
Four groups, each a named template in its own file:

  - lifecycle   (_alerts-lifecycle.tpl)   crash loops, NotReady, OOM kills,
                                          one rule each, fanned out per role
  - traffic     (_alerts-traffic.tpl)     Connect RPC error rate and latency
  - operations  (_alerts-operations.tpl)  outbox, rate limiting, capability
                                          charges, read replica, uploads
  - workers     (_alerts-workers.tpl)     background workers stalled or
                                          failing every tick

Every threshold, window and `for` is a value under metrics.alerts.rules; a
rule's runbook_url is rendered when it names a runbook.

Requires Prometheus Operator (monitoring.coreos.com/v1). Gated by
.Values.metrics.alerts.enabled.
*/}}
{{- if .Values.metrics.alerts.enabled -}}
{{- $fullname := include "chart.fullname" . -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    {{- with .Values.metrics.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- range $group := list "lifecycle" "traffic" "operations" "workers" }}
    {{- $rules := include (printf "chart.alerts.%s" $group) $ | trim }}
    - name: {{ $fullname }}.{{ $group }}
      {{- if $rules }}
      rules:
        {{- $rules | nindent 8 }}
      {{- else }}
      {{- /* Every rule in the group disabled: an empty list, not a null. */}}
      rules: []
      {{- end }}
    {{- end }}
{{- end }}
