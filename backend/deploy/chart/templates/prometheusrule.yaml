{{/*
PrometheusRule — baseline alerts for the api role (the public-facing
Connect listener). Five rules cover the SRE Golden-Signals + lifecycle:

  - CrashLooping: kube_pod_container_status_restarts_total spikes
  - HighErrorRate: fraction of Connect RPCs failing with a server-fault code
  - HighLatency: a quantile of Connect RPC latency over threshold
  - NotReady: pod sustained in NotReady state
  - OOMKilled: any OOMKill in the last `window`

The traffic rules read otelconnect's `rpc.server.call.duration` histogram,
rendered by Prometheus as rpc_server_call_duration_seconds_{bucket,count}:
`rpc_method` names the RPC and `error_type` carries the upper-case Connect
code of a failed call. It covers every Connect listener, so the api and admin
planes alike; `metrics.alerts.rpcSelector` narrows it where the metrics
pipeline adds labels that tell them apart.

Requires Prometheus Operator (monitoring.coreos.com/v1). Gated by
.Values.metrics.alerts.enabled.

Worker / dispatcher / ingest get separate alert rules in a future
expansion when their /metrics surface stabilizes. For now they're
covered by the lifecycle group (CrashLooping / NotReady / OOMKilled)
which scopes to the chart's selector — actual implementation reuses
the api selector here as starter; tune by adding per-role rules.
*/}}
{{- if .Values.metrics.alerts.enabled -}}
{{- $apiFullname := include "chart.roleFullname" (dict "ctx" . "role" "api") -}}
{{- $rules := .Values.metrics.alerts.rules -}}
{{- $runbookBase := trimSuffix "/" .Values.metrics.alerts.runbookBaseUrl -}}
{{- /* otelconnect's rpc.server.call.duration as Prometheus names it. */ -}}
{{- $rpcCalls := "rpc_server_call_duration_seconds_count" -}}
{{- $rpcBuckets := "rpc_server_call_duration_seconds_bucket" -}}
{{- $rpcErrorLabel := "error_type" -}}
{{- $rpcSelector := .Values.metrics.alerts.rpcSelector -}}
{{- $rpcMatchers := ternary (printf "%s," $rpcSelector) "" (ne $rpcSelector "") -}}
{{- $rpcBraced := ternary (printf "{%s}" $rpcSelector) "" (ne $rpcSelector "") -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $apiFullname }}
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "api") | nindent 4 }}
    {{- with .Values.metrics.alerts.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ $apiFullname }}.lifecycle
      rules:
        {{- if $rules.crashLooping.enabled }}
        - alert: PaladinApiCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}",container="{{ .Chart.Name }}"}[15m]) > 2
          for: {{ $rules.crashLooping.for }}
          labels:
            severity: {{ $rules.crashLooping.severity }}
            service: paladin-api
          annotations:
            summary: "Paladin api pod is crash-looping"
            description: |
              Pod {{ "{{ $labels.pod }}" }} in namespace {{ .Release.Namespace }}
              has restarted more than 2 times in 15m. Likely panic on startup,
              failed Postgres dial, or OOM. Inspect:
                kubectl -n {{ .Release.Namespace }} logs <pod> --previous
        {{- end }}
        {{- if $rules.notReady.enabled }}
        - alert: PaladinApiNotReady
          expr: |
            kube_pod_status_ready{namespace="{{ .Release.Namespace }}",condition="true"} == 0
            and on (pod, namespace) kube_pod_labels{label_app_kubernetes_io_component="api"}
          for: {{ $rules.notReady.for }}
          labels:
            severity: {{ $rules.notReady.severity }}
            service: paladin-api
          annotations:
            summary: "Paladin api pod stuck NotReady"
            description: |
              Pod {{ "{{ $labels.pod }}" }} has been NotReady for {{ $rules.notReady.for }}.
              Readiness probe failing — check /readyz on the api Service.
        {{- end }}
        {{- if $rules.oomKilled.enabled }}
        - alert: PaladinApiOOMKilled
          expr: |
            increase(kube_pod_container_status_last_terminated_reason{namespace="{{ .Release.Namespace }}",container="{{ .Chart.Name }}",reason="OOMKilled"}[{{ $rules.oomKilled.window }}]) > 0
          labels:
            severity: {{ $rules.oomKilled.severity }}
            service: paladin-api
          annotations:
            summary: "Paladin api was OOMKilled"
            description: |
              Container {{ .Chart.Name }} was OOMKilled in the last {{ $rules.oomKilled.window }}.
              Bump deployments.api.resources.limits.memory in the env overlay,
              or chase the leak.
        {{- end }}
    - name: {{ $apiFullname }}.traffic
      rules:
        {{- if $rules.highErrorRate.enabled }}
        {{- $errors := $rules.highErrorRate }}
        - alert: PaladinApiHighErrorRate
          expr: |
            (
              sum(rate({{ $rpcCalls }}{ {{- $rpcMatchers -}} {{ $rpcErrorLabel }}=~"{{ join "|" $errors.serverErrorCodes }}"}[{{ $errors.window }}]))
              /
              sum(rate({{ $rpcCalls }}{{ $rpcBraced }}[{{ $errors.window }}]))
            ) > {{ $errors.threshold }}
          for: {{ $errors.for }}
          labels:
            severity: {{ $errors.severity }}
            service: paladin-api
          annotations:
            summary: "Paladin api error rate above {{ $errors.threshold | mulf 100.0 }}%"
            description: |
              More than {{ $errors.threshold | mulf 100.0 }}% of Connect RPCs over {{ $errors.window }} failed
              with a server-fault code ({{ join ", " $errors.serverErrorCodes }}) for {{ $errors.for }}.
            runbook_url: "{{ $runbookBase }}/{{ $errors.runbook }}"
        {{- end }}
        {{- if $rules.highLatency.enabled }}
        {{- $latency := $rules.highLatency }}
        - alert: PaladinApiHighLatency
          expr: |
            histogram_quantile(
              {{ $latency.quantile }},
              sum by (le) (rate({{ $rpcBuckets }}{{ $rpcBraced }}[{{ $latency.window }}]))
            ) > {{ $latency.thresholdSeconds }}
          for: {{ $latency.for }}
          labels:
            severity: {{ $latency.severity }}
            service: paladin-api
          annotations:
            summary: "Paladin api p{{ $latency.quantile | mulf 100.0 }} latency > {{ $latency.thresholdSeconds }}s"
            description: |
              p{{ $latency.quantile | mulf 100.0 }} Connect RPC latency over {{ $latency.window }} exceeded
              {{ $latency.thresholdSeconds }}s for {{ $latency.for }}.
            runbook_url: "{{ $runbookBase }}/{{ $latency.runbook }}"
        {{- end }}
{{- end }}
