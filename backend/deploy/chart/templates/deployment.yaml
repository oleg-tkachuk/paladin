{{- /*
  One Deployment per role. The same image runs in every pod; only the
  argv (`serve <role>`), ports, probes and resource defaults differ.
  Iteration order is alphabetised by Helm's `range` over a map — stable
  across releases, no template-side sorting needed.

  Per-role override convention: any key absent from `deployments.<role>`
  falls back to `defaults.*`. Resources / autoscaling / podLabels / etc.
  are merged via `default`.
*/}}
{{- $defaults := .Values.defaults -}}
{{- range $role, $spec := .Values.deployments }}
{{- if $spec.enabled }}
{{- $fullname := include "chart.roleFullname" (dict "ctx" $ "role" $role) }}
{{- $sa := include "chart.roleServiceAccountName" (dict "ctx" $ "role" $role "spec" $spec) }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "chart.roleLabels" (dict "ctx" $ "role" $role) | nindent 4 }}
spec:
  {{- if not (default $defaults.autoscaling.enabled (and $spec.autoscaling $spec.autoscaling.enabled)) }}
  replicas: {{ default $defaults.replicas $spec.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" $ "role" $role) | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the configmap changes — checksum is the
        # rendered ConfigMap, so any tweak to `config.*` triggers a
        # fresh rollout instead of waiting for the next manual restart.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with default $defaults.podAnnotations $spec.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "chart.roleLabels" (dict "ctx" $ "role" $role) | nindent 8 }}
        {{- with default $defaults.podLabels $spec.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $.Chart.Name }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            {{- toYaml $spec.args | nindent 12 }}
          env:
            - name: APP_VERSION
              value: {{ $.Values.metadata.version | default $.Chart.AppVersion | quote }}
            - name: GIT_COMMIT_HASH
              value: {{ $.Values.metadata.commit | quote }}
            - name: BUILD_TIME
              value: {{ $.Values.metadata.buildTime | quote }}
            - name: PALADIN_ROLE
              value: {{ $role | quote }}
            {{- with default $defaults.extraEnv $spec.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with default $defaults.extraEnvFrom $spec.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            {{- toYaml $spec.ports | nindent 12 }}
          {{- with $spec.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $spec.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $spec.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with default $defaults.resources $spec.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
            {{- if $.Values.postgresCa.secretName }}
            - name: pg-ca
              mountPath: {{ $.Values.postgresCa.mountPath }}
              readOnly: true
            {{- end }}
            {{- with default $defaults.volumeMounts $spec.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "chart.fullname" $ }}-config
        {{- if $.Values.postgresCa.secretName }}
        - name: pg-ca
          secret:
            secretName: {{ $.Values.postgresCa.secretName }}
        {{- end }}
        {{- with default $defaults.volumes $spec.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with default $defaults.nodeSelector $spec.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default $defaults.affinity $spec.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default $defaults.tolerations $spec.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with default $defaults.topologySpreadConstraints $spec.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
