{{- /*
Two flags, two different concerns:

  config.bootstrap.admin.enabled  — does the SERVER run the boot step?
                                    (read by Go via cfg.Bootstrap.Admin.Enabled)
  bootstrap.admin.enabled         — does THIS chart render the Secret?

Keep them independent so operators can pick the topology that fits:

  • Chart-managed Secret + boot step on:
      config.bootstrap.admin.enabled: true
      bootstrap.admin.enabled:        true   ← this template renders
    Single-chart install where you trust Helm's `lookup` semantics.

  • Externally-managed Secret + boot step on (the GitOps shape):
      config.bootstrap.admin.enabled: true
      bootstrap.admin.enabled:        false  ← skip; another tool ships
                                                the Secret (SealedSecret /
                                                ExternalSecret / a sibling
                                                ArgoCD app).
    Avoids Helm's `lookup` drift under ArgoCD's `helm template` render
    mode, where lookup returns nil and randAlphaNum churns the password
    on every sync.

  • Off entirely:
      config.bootstrap.admin.enabled: false
      bootstrap.admin.enabled:        false
    Nothing renders, nothing boots. Default.

Mismatched combinations the chart could detect but doesn't (operator's
problem): boot-step on + neither chart-Secret nor external Secret →
server fails at startup with "access denied reading secret <name>".
*/ -}}
{{- if .Values.bootstrap.admin.enabled -}}
{{- /*
Bootstrap-admin Secret rendered by the chart. Password resolution order:

  1. Existing Secret in the cluster (preserved as-is via `lookup`) —
     keeps the admin password stable across upgrades. NOTE: lookup is
     a no-op under `helm template` (ArgoCD's render mode), so under
     ArgoCD this branch never matches and the chart instead falls
     through to step 2 or 3 — meaning the password churns on every
     sync. If you're on ArgoCD, prefer the externally-managed Secret
     topology and leave `bootstrap.admin.enabled: false`.
  2. Operator-supplied via `--set bootstrap.admin.password=<value>`.
     Use `--set-file` to read from disk and avoid the literal in shell
     history.
  3. Auto-generated 24-char random string. Operator retrieves it with:
        kubectl get secret <name> -n <ns> \
          -o jsonpath='{.data.password}' | base64 -d
     This is the ArgoCD initial-admin-secret pattern.

The Go bootstrap step then resolves the Secret via K8sSecretResolver
and provisions the user — see internal/bootstrap/admin.go and
docs/security.md.
*/ -}}
{{- $secretName := .Values.bootstrap.admin.passwordSecret.name -}}
{{- $namespace := .Release.Namespace -}}
{{- $existing := lookup "v1" "Secret" $namespace $secretName -}}
{{- $key := .Values.bootstrap.admin.passwordSecret.key | default "password" -}}
{{- $password := "" -}}
{{- if $existing -}}
  {{- /* Preserve the existing value — never overwrite a deployed Secret. */ -}}
  {{- $password = index $existing.data $key | b64dec -}}
{{- else if .Values.bootstrap.admin.password -}}
  {{- $password = .Values.bootstrap.admin.password -}}
{{- else -}}
  {{- $password = randAlphaNum 24 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: bootstrap
  annotations:
    # `helm.sh/resource-policy: keep` prevents accidental deletion on
    # `helm uninstall` so the admin survives a chart re-install.
    helm.sh/resource-policy: keep
    # Pre-install hook so the bootstrap Job (weight=10) can read the
    # admin password via K8sSecretResolver. Weight=-20 lands the
    # Secret before SAs (-10), Role (-5), and Jobs (0/10).
    #
    # Crucially NO pre-upgrade — the template above preserves an
    # existing password (lookup-then-reuse), but a hook re-creation
    # would still trip Helm into thinking the manifest changed. We
    # tag pre-install ONLY; on upgrade the Secret is left exactly as
    # it was minted, matching the resource-policy: keep contract.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
