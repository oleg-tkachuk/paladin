{{- /*
The pepper of the API-token digests (api_token.hmac_key). Rendered only when
API tokens are on, config.api_token names no key and no Secret, and
apiToken.hmacKey.existingSecret is empty — see chart.apiTokenHMACKey.

Generated once and then preserved, as the session signing key is: changing it
stops every issued API token from verifying. Under a client-side render
(ArgoCD, `helm template`) lookup returns nothing and the value would change on
every sync; set apiToken.hmacKey.existingSecret there.
*/ -}}
{{- $hk := fromJson (include "chart.apiTokenHMACKey" .) -}}
{{- if $hk.create -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $hk.name -}}
{{- $value := "" -}}
{{- if and $existing (hasKey $existing.data $hk.key) -}}
{{- $value = index $existing.data $hk.key | b64dec -}}
{{- else -}}
{{- $value = randAlphaNum (int .Values.apiToken.hmacKey.generatedLength) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $hk.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: removing it would invalidate every API token issued.
    helm.sh/resource-policy: keep
    # Before the Deployments that read it, as the signing key is.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "argocd.argoproj.io/sync-wave": "-20"
type: Opaque
data:
  {{ $hk.key }}: {{ $value | b64enc | quote }}
{{- end }}
