{{- /*
  Ingress targets the api role's Service. Admin gets no public ingress
  by default — operators stand one up at the manifest layer behind their
  own mTLS / VPN / bastion. Per-host `port` overrides land directly in
  the path block; otherwise we fall back to the api Service's first port.
*/}}
{{- if .Values.ingress.enabled -}}
{{- $apiSvc := include "chart.roleFullname" (dict "ctx" . "role" "api") -}}
{{- $apiSpec := index .Values.deployments "api" -}}
{{- $defaultPort := 8080 -}}
{{- if and $apiSpec $apiSpec.service $apiSpec.service.ports -}}
{{- $defaultPort = (index $apiSpec.service.ports 0).port -}}
{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ $apiSvc }}
                port:
                  number: {{ default $defaultPort .port }}
          {{- end }}
    {{- end }}
{{- end }}
