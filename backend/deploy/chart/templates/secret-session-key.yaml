{{- /*
The key that signs sessions (ADR-0047), ECDSA P-256. Rendered only when
auth.sessionKey.existingSecret is empty and auth.sessionKey.generate is on —
see chart.sessionKey.

Generated once and then preserved: `lookup` reads the deployed Secret back, so
an upgrade does not rotate the key and log every session out. Under a
client-side render (ArgoCD, `helm template`) lookup returns nothing and the key
would change on every sync; set auth.sessionKey.existingSecret there.
*/ -}}
{{- $session := fromJson (include "chart.sessionKey" .) -}}
{{- if $session.create -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $session.name -}}
{{- $value := "" -}}
{{- if and $existing (hasKey $existing.data $session.key) -}}
{{- $value = index $existing.data $session.key | b64dec -}}
{{- else -}}
{{- $value = genPrivateKey "ecdsa" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $session.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: removing it would end every session.
    helm.sh/resource-policy: keep
    # Before the Deployments that mount it, as the signing key is.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-20"
    "argocd.argoproj.io/sync-wave": "-20"
type: Opaque
data:
  {{ $session.key }}: {{ $value | b64enc | quote }}
{{- end }}
