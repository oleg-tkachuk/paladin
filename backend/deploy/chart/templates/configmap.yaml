apiVersion: v1
kind: ConfigMap
metadata:
  # `-config` suffix matches the deployment's volume reference. Templated
  # via chart.fullname so multiple releases of this chart in one namespace
  # don't collide on a hardcoded `paladin-core-config`.
  name: {{ include "chart.fullname" . }}-config
  annotations:
    # Pre-install hook with weight=-20 — must exist before the
    # migrate (0) / bootstrap (10) Jobs that mount it as a config
    # volume. The Deployments in the main sync phase also mount it,
    # which is fine: hook resources stay around once created.
    #
    # ArgoCD doesn't auto-translate helm.sh/hook-weight to its own
    # sync-wave model — we must mirror the ordering explicitly via
    # argocd.argoproj.io/sync-wave or every PreSync resource lands
    # at wave 0 in parallel and the Job races a missing SA / Config.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/sync-wave": "-20"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Rendered through `tpl` so values may reference chart helpers
    # (notably `chart.fullname`) — see `mcp.upstreams.*` defaults below
    # which need to resolve to the in-cluster Service names of the
    # admin / api roles spun up by this same release.
    #
    # `storage.s3CredentialsSecret` (top-level chart values) drives the
    # SecretRef injection for the primary backend's `auth.*_secret`
    # fields. Done as a template-time merge rather than baked into
    # values.yaml so that overlays which inline plaintext keys
    # (e.g. `values-local.yaml`) can simply flip create=false and
    # NOT carry a `null` literal that CUE rejects on optional refs.
    {{- $cfg := deepCopy .Values.config }}
    {{- range $backend, $sec := fromJson (include "chart.s3CredentialSecrets" .) }}
    {{- if and $sec.active (hasKey $cfg.storage.backends $backend) }}
    {{- $b := index $cfg.storage.backends $backend }}
    {{- $_ := set $b.auth "access_key_secret" (dict "name" $sec.name "key" "access_key") }}
    {{- $_ := set $b.auth "secret_key_secret" (dict "name" $sec.name "key" "secret_key") }}
    {{- end }}
    {{- end }}
    {{- range $name, $backend := $cfg.storage.backends }}
    {{- if and (eq $backend.kind "s3-compatible") (not $backend.endpoint) }}
    {{- fail (printf "config.storage.backends.%s.endpoint is required for an s3-compatible backend" $name) }}
    {{- end }}
    {{- end }}
    {{- $pg := fromJson (include "chart.postgres" .) }}
    {{- $pgCfg := $cfg.datastores.postgres }}
    {{- if $pg.active }}
    {{- $_ := set $pgCfg "dsn" $pg.dsn }}
    {{- $_ := set $pgCfg "migrate_dsn" $pg.migrateDsn }}
    {{- $_ := set $pgCfg "password_secret" $pg.app }}
    {{- $_ := set $pgCfg "migrate_password_secret" $pg.migrate }}
    {{- else if not $pgCfg.dsn }}
    {{- fail "no database configured: set postgres.host and postgres.{app,migrate}.existingSecret, or config.datastores.postgres.dsn" }}
    {{- end }}
    {{- if .Values.internalTLS.enabled }}
    {{- $_ := include "chart.internalTLSSecret" . }}
    {{- $mount := .Values.internalTLS.mountPath }}
    {{- $files := dict "cert_path" (printf "%s/tls.crt" $mount) "key_path" (printf "%s/tls.key" $mount) "ca_path" (printf "%s/ca.crt" $mount) }}
    {{- range $listener := list $cfg.api.server.data $cfg.api.server.iam $cfg.admin.server }}
    {{- $_ := set $listener "tls" (merge (dict "enabled" true) $files (deepCopy $listener.tls)) }}
    {{- end }}
    {{- $_ := set $cfg.mcp.upstreams "tls" (merge (deepCopy $files) (deepCopy $cfg.mcp.upstreams.tls)) }}
    {{- end }}
    {{- $sk := fromJson (include "chart.authSigningKey" .) }}
    {{- if $sk.active }}
    {{- $_ := set $cfg.auth "signing_key_secret" (dict "name" $sk.name "key" $sk.key) }}
    {{- end }}
    {{- if not $cfg.auth.issuer }}
    {{- $_ := set $cfg.auth "issuer" (include "chart.fullname" .) }}
    {{- end }}
    {{- tpl (toYaml $cfg) . | nindent 4 }}
