apiVersion: v1
kind: ConfigMap
metadata:
  # `-config` suffix matches the deployment's volume reference. Templated
  # via chart.fullname so multiple releases of this chart in one namespace
  # don't collide on a hardcoded `paladin-config`.
  name: {{ include "chart.fullname" . }}-config
  annotations:
    # Pre-install hook with weight=-20 — must exist before the
    # migrate (0) / bootstrap (10) Jobs that mount it as a config
    # volume. The Deployments in the main sync phase also mount it,
    # which is fine: hook resources stay around once created.
    #
    # ArgoCD doesn't auto-translate helm.sh/hook-weight to its own
    # sync-wave model — we must mirror the ordering explicitly via
    # argocd.argoproj.io/sync-wave or every PreSync resource lands
    # at wave 0 in parallel and the Job races a missing SA / Config.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/sync-wave": "-20"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Rendered through `tpl` so values may reference chart helpers
    # (notably `chart.fullname`) — see `mcp.upstreams.*` defaults below
    # which need to resolve to the in-cluster Service names of the
    # admin / api roles spun up by this same release.
    {{- tpl (toYaml .Values.config) . | nindent 4 }}
