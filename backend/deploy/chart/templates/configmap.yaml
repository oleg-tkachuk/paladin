apiVersion: v1
kind: ConfigMap
metadata:
  # `-config` suffix matches the deployment's volume reference. Templated
  # via chart.fullname so multiple releases of this chart in one namespace
  # don't collide on a hardcoded `paladin-core-config`.
  name: {{ include "chart.fullname" . }}-config
  annotations:
    # Pre-install hook with weight=-20 — must exist before the
    # migrate (0) / bootstrap (10) Jobs that mount it as a config
    # volume. The Deployments in the main sync phase also mount it,
    # which is fine: hook resources stay around once created.
    #
    # ArgoCD doesn't auto-translate helm.sh/hook-weight to its own
    # sync-wave model — we must mirror the ordering explicitly via
    # argocd.argoproj.io/sync-wave or every PreSync resource lands
    # at wave 0 in parallel and the Job races a missing SA / Config.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/sync-wave": "-20"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Rendered through `tpl` so values may reference chart helpers
    # (notably `chart.fullname`) — see `mcp.upstreams.*` defaults below
    # which need to resolve to the in-cluster Service names of the
    # admin / api roles spun up by this same release.
    #
    # `storage.s3CredentialsSecret` (top-level chart values) drives the
    # SecretRef injection for the primary backend's `auth.*_secret`
    # fields. Done as a template-time merge rather than baked into
    # values.yaml so that overlays which inline plaintext keys
    # (e.g. `values-local.yaml`) can simply flip create=false and
    # NOT carry a `null` literal that CUE rejects on optional refs.
    {{- $cfg := deepCopy .Values.config }}
    {{- with .Values.storage }}
    {{- if .s3CredentialsSecret }}
    {{- $secretName := .s3CredentialsSecret.existingSecret | default .s3CredentialsSecret.name -}}
    {{- if and $secretName (or .s3CredentialsSecret.create .s3CredentialsSecret.existingSecret) -}}
    {{- $primary := index $cfg.storage.backends "primary" }}
    {{- $_ := set $primary.auth "access_key_secret" (dict "name" $secretName "key" "access_key") }}
    {{- $_ := set $primary.auth "secret_key_secret" (dict "name" $secretName "key" "secret_key") }}
    {{- end -}}
    {{- end -}}
    {{- end }}
    {{- tpl (toYaml $cfg) . | nindent 4 }}
