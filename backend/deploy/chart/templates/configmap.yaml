apiVersion: v1
kind: ConfigMap
metadata:
  # `-config` suffix matches the deployment's volume reference. Templated
  # via chart.fullname so multiple releases of this chart in one namespace
  # don't collide on a hardcoded `paladin-config`.
  name: {{ include "chart.fullname" . }}-config
  annotations:
    # Pre-install hook with weight=-20 — must exist before the
    # migrate (0) / bootstrap (10) Jobs that mount it as a config
    # volume. The Deployments in the main sync phase also mount it,
    # which is fine: hook resources stay around once created.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "chart.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
