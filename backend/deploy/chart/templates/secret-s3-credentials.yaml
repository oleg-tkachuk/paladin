{{- /*
  One sibling Secret per storage backend, holding its access_key + secret_key.
  Mirrors the bootstrap-admin Secret pattern:
  chart-managed, in the release namespace, with simple flat keys that the
  K8sSecretResolver picks up via `config.storage.backends.primary.auth.{access,secret}_key_secret`.

  Rendered only when `storage.s3CredentialsSecret.create` is true and no
  `existingSecret` was supplied. Production deploys typically set
  `existingSecret: paladin-s3-credentials` and provision the values via SOPS /
  ExternalSecret / SealedSecret, leaving this template a no-op.

  Why a sibling Secret instead of `envFrom: seaweedfs-s3-secret` (in the
  `storage` namespace) directly: the SeaweedFS Secret holds a JSON
  `identities` blob, not flat keys, so the credentials cannot be projected
  into env vars without an init-container splitter. The K8sSecretResolver
  path is already wired (RBAC, in-cluster API call) and matches how PG /
  bootstrap creds are surfaced — one less mechanism in the chart.
*/}}
{{- range $backend, $sec := fromJson (include "chart.s3CredentialSecrets" .) }}
{{- if $sec.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sec.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Pre-install hook, weight -15: must exist before the migrate (0) /
    # bootstrap (10) Jobs that resolve config secrets at startup, but
    # after the ConfigMap (-20) so manifest ordering in the bundle stays
    # readable. ArgoCD honors the sync-wave mirror.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/sync-wave": "-15"
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
    paladin.io/storage-backend: {{ $backend | quote }}
type: Opaque
stringData:
  access_key: {{ $sec.accessKey | quote }}
  secret_key: {{ $sec.secretKey | quote }}
{{- end }}
{{- end }}
