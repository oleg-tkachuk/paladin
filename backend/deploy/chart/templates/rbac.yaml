{{- /*
  RBAC for the in-process K8sSecretResolver. The resolver issues exactly
  one verb (GET) per referenced secret name — list/watch are NOT used.

  ClusterRole vs Role: Postgres / S3 credentials commonly live in a
  separate namespace from the PALADIN deployment (e.g. `database/` for the
  PG operator's secrets). clusterWide=true binds at cluster scope so the
  resolver can reach them; clusterWide=false keeps everything in the
  release namespace.

  Bindings: one (Cluster)RoleBinding subjects all per-role SAs the chart
  generated. If a role pins its own SA name and that SA isn't created by
  this chart, the operator owns the binding too — we don't bind external
  identities.
*/}}
{{- if and .Values.rbac .Values.rbac.secretReader.enabled -}}
{{- $name := printf "%s-secret-reader" (include "chart.fullname" .) -}}
{{- $clusterWide := .Values.rbac.secretReader.clusterWide -}}
{{- $kind := ternary "ClusterRole" "Role" $clusterWide -}}
{{- $bindingKind := ternary "ClusterRoleBinding" "RoleBinding" $clusterWide -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $kind }}
metadata:
  name: {{ $name }}
  annotations:
    # Pre-install hook with weight -5 — must land after the Job-side
    # SAs (weight -10) but before the migrate (0) / bootstrap (10)
    # Jobs that use K8sSecretResolver to read DB / S3 credentials.
    # Without this, the Job's ServiceAccount has no GET right on the
    # referenced Secrets and the resolver returns a 403.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/sync-wave": "-5"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
{{- /*
  Build the allowlist. The static list from values comes first; if the
  primary-storage credential Secret is wired (create or existingSecret),
  append its name so the resolver can GET it without manual values upkeep.
*/}}
{{- $secretNames := .Values.rbac.secretReader.secretNames | default (list) -}}
{{- with .Values.storage }}
{{- if .s3CredentialsSecret }}
{{- $s3Name := .s3CredentialsSecret.existingSecret | default .s3CredentialsSecret.name -}}
{{- if and $s3Name (or .s3CredentialsSecret.create .s3CredentialsSecret.existingSecret) -}}
{{- if not (has $s3Name $secretNames) -}}
{{- $secretNames = append $secretNames $s3Name -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: {{ $secretNames | toJson }}
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $bindingKind }}
metadata:
  name: {{ $name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/sync-wave": "-5"
  labels:
    {{- include "chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $kind }}
  name: {{ $name }}
subjects:
  {{- /*
    Bind every distinct SA the chart created — deployments AND jobs.
    Job SAs MUST be in the subject list or the migrate / bootstrap
    Pods can't read the Postgres / S3 secrets they need.

    Same de-dup logic as serviceaccount.yaml so we never list the
    same subject twice.
  */}}
  {{- $seen := dict -}}
  {{- range $role, $spec := .Values.deployments }}
    {{- if $spec.enabled -}}
      {{- $sa := include "chart.roleServiceAccountName" (dict "ctx" $ "role" $role "spec" $spec) -}}
      {{- if not (hasKey $seen $sa) -}}
        {{- $_ := set $seen $sa true }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
      {{- end -}}
    {{- end -}}
  {{- end }}
  {{- range $jobName, $jobSpec := .Values.jobs }}
    {{- if $jobSpec.enabled -}}
      {{- $sa := include "chart.roleServiceAccountName" (dict "ctx" $ "role" $jobName "spec" (default dict $jobSpec)) -}}
      {{- if not (hasKey $seen $sa) -}}
        {{- $_ := set $seen $sa true }}
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $.Release.Namespace }}
      {{- end -}}
    {{- end -}}
  {{- end }}
{{- end -}}
