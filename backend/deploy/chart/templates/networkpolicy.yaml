{{/*
  Per-role NetworkPolicies — default-deny ingress+egress for every pod this
  chart owns, then explicit allows per role. Gated on
  networkPolicies.enabled (on by default; inert without an enforcing CNI). See the values block for the flow matrix
  rationale; the short version:

    api        ← ingress-controller / mcp / session → common + storage
                                                     + iam (session JWKS)
    iam        ← ingress-controller / mcp / session → common (no storage: it
                                                     serves no object)
               ← admin / api (session JWKS, 8085)
               ← UI (the OAuth consent relay)
    admin      ← ingress-controller / mcp / session → common + storage + NATS
                                                     + iam (session JWKS)
                                                     + adminBrokerPorts (Test)
                                                     + dispatcher/worker ops
    worker     ← monitoring / admin (ops)          → common + storage
    dispatcher ← monitoring / admin (ops)          → OPEN egress (customer
                                                     sinks live anywhere)
    ingest     ← storage ns (webhook) / monitoring → common + storage + NATS
                 / admin (health)                    (a delete event is checked
                                                     with a HEAD)
    mcp        ← ingress-controller / monitoring   → common + api/iam/admin pods
                 / admin (sessions, health)
    session    ← ingress-controller / admin        → DNS, 443, OTLP (no database)
                 (health)                          + api/iam/admin pods

  "common" egress = DNS (kube-system:53), 443 anywhere (https webhooks/JWKS),
  networkPolicies.kubeAPIPorts anywhere (K8s API for the secret resolver),
  Postgres, and the OTLP collector on the port config.otel.endpoint names.
  api, iam and admin, the roles that apply the rate limits, are also let out to
  Valkey on the port config.datastores.valkey.addr names when the limits count
  there.

  With metrics.mode: scrape, every role that serves /metrics also admits the
  monitoring namespace on metrics.port — the scrape listener is a port of its
  own, not one of the plane or ops ports.

  Kubelet liveness/readiness probes originate on the node and bypass policy
  enforcement in mainstream CNIs, so default-deny ingress does not break
  health checks.
*/}}
{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
{{- $common := list }}
{{/* DNS */}}
{{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")))) "ports" (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) }}
{{/*
  Any https (JWKS fetch, webhook sinks on 443), and the K8s API the secret
  resolver reads at boot. A policy is matched after a Service is translated to
  its endpoint, so the API ports are the API server's own, not the
  `kubernetes` Service's 443 — see networkPolicies.kubeAPIPorts.
*/}}
{{- $httpsPorts := list (dict "protocol" "TCP" "port" 443) }}
{{- range $p := $np.kubeAPIPorts }}
{{- if ne (int $p) 443 }}
{{- $httpsPorts = append $httpsPorts (dict "protocol" "TCP" "port" (int $p)) }}
{{- end }}
{{- end }}
{{- $https := dict "ports" $httpsPorts }}
{{/* Postgres */}}
{{- $pg := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.postgres.namespace)))) "ports" (list (dict "protocol" "TCP" "port" $np.postgres.port)) }}
{{/*
  OTLP collector — any namespace, on the port the exporter dials. Read from the
  endpoint rather than fixed: it was fixed at 4317, the gRPC port, while the
  chart's own default exporter speaks OTLP/HTTP to 4318, so every span was
  dropped the moment policies were on.
*/}}
{{- $otlpPort := splitList ":" .Values.config.otel.endpoint | last | int }}
{{- $otlp := dict "ports" (list (dict "protocol" "TCP" "port" $otlpPort)) }}
{{/* The scrape listener every metrics role opens, when metrics are scraped. */}}
{{- $metricsPulled := include "chart.metricsScraped" . }}
{{- $scrape := dict "from" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Values.networkPolicies.monitoring.namespace)))) "ports" (list (dict "protocol" "TCP" "port" (int .Values.metrics.port))) }}
{{- $common = list $dns $https $pg $otlp }}
{{/*
  Valkey, when the rate limits count there (ADR-0046): only api, iam and
  admin apply the limits and build the counter, so only they are let out to it. The
  port is read from the address the client dials, like the OTLP one. Refused,
  every limit decision falls back to the per-replica count and
  paladin_ratelimit_degraded_total climbs.
*/}}
{{- $rateLimitEgress := list }}
{{- if eq .Values.config.middleware.rate_limit.backend "valkey" }}
{{- $valkeyPort := splitList ":" .Values.config.datastores.valkey.addr | last | int }}
{{- $rateLimitEgress = list (dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.valkey.namespace)))) "ports" (list (dict "protocol" "TCP" "port" $valkeyPort))) }}
{{- end }}
{{- $storageEgress := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.storage.namespace)))) }}
{{- $natsEgress := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.nats.namespace)))) "ports" (list (dict "protocol" "TCP" "port" $np.nats.port)) }}
{{- $fromController := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.ingressController.namespace)) "podSelector" (dict "matchLabels" $np.ingressController.podLabels) }}
{{- $fromMonitoring := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.monitoring.namespace)) }}
{{- $fromUI := dict "podSelector" (dict "matchLabels" $np.ui.podLabels) }}
{{/* The MCP bridge's listener, read from its config like the OTLP port. */}}
{{- $mcpPort := splitList ":" .Values.config.mcp.http.addr | last | int }}
{{- $fromMCP := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "mcp" "app.kubernetes.io/instance" .Release.Name)) }}
{{- $fromAdmin := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "admin" "app.kubernetes.io/instance" .Release.Name)) }}
{{- $fromAPI := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "api" "app.kubernetes.io/instance" .Release.Name)) }}
{{/* The console's session role (ADR-0048) forwards the console's calls to the planes. */}}
{{- $sessionOn := .Values.deployments.session.enabled }}
{{- $sessionPort := splitList ":" .Values.config.session.server.addr | last | int }}
{{- $fromSession := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "session" "app.kubernetes.io/instance" .Release.Name)) }}
{{/*
  The iam role's listener, read from its config like the OTLP port, and the
  session JWKS on it (ADR-0047): every role that verifies sessions without the
  key is let out to it.
*/}}
{{- $iamPort := splitList ":" .Values.config.api.server.iam.addr | last | int }}
{{- $toIAMJWKS := dict "to" (list (dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "iam" "app.kubernetes.io/instance" .Release.Name)))) "ports" (list (dict "protocol" "TCP" "port" $iamPort)) }}
---
# Baseline: default-deny both directions for every pod of this release.
# Per-role policies below are purely additive allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-default-deny
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
{{- if .Values.deployments.api.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-api
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromController | toJson }}
        - {{ $fromMCP | toJson }}
        # SystemService.GetPlatformHealth reads its health snapshot.
        - {{ $fromAdmin | toJson }}
        {{- if $sessionOn }}
        - {{ $fromSession | toJson }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  egress:
    {{- range $r := concat $common $rateLimitEgress }}
    - {{ $r | toJson }}
    {{- end }}
    - {{ $storageEgress | toJson }}
    # Sessions are verified by the JWKS the iam role serves (ADR-0047).
    - {{ $toIAMJWKS | toJson }}
{{- end }}
{{- if .Values.deployments.iam.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-iam
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "iam") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "iam") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromController | toJson }}
        # The console relays its OAuth consent form here (app/oauth/authorize).
        - {{ $fromUI | toJson }}
        - {{ $fromMCP | toJson }}
        # The planes that verify sessions by the JWKS it serves (ADR-0047).
        - {{ $fromAdmin | toJson }}
        - {{ $fromAPI | toJson }}
        {{- if $sessionOn }}
        # The session role mints its tokens here and verifies by the JWKS.
        - {{ $fromSession | toJson }}
        {{- end }}
      ports:
        - { protocol: TCP, port: {{ $iamPort }} }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  egress:
    {{- range $r := concat $common $rateLimitEgress }}
    - {{ $r | toJson }}
    {{- end }}
{{- end }}
{{- if .Values.deployments.admin.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-admin
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "admin") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "admin") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromController | toJson }}
        - {{ $fromMCP | toJson }}
        # GetPlatformHealth reads this role's own snapshot through its Service.
        - {{ $fromAdmin | toJson }}
        {{- if $sessionOn }}
        - {{ $fromSession | toJson }}
        {{- end }}
      ports:
        - { protocol: TCP, port: 8090 }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  egress:
    {{- range $r := concat $common $rateLimitEgress }}
    - {{ $r | toJson }}
    {{- end }}
    - {{ $storageEgress | toJson }}
    - {{ $natsEgress | toJson }}
    {{- if $np.adminBrokerPorts }}
    # Synchronous TestSubscription from the admin pod may dial broker sinks
    # on these ports (any namespace / external). Trim per environment.
    - ports:
        {{- range $p := $np.adminBrokerPorts }}
        - { protocol: TCP, port: {{ $p }} }
        {{- end }}
    {{- end }}
    # Sessions are verified by the JWKS the iam role serves (ADR-0047).
    - {{ $toIAMJWKS | toJson }}
    # SystemService.GetDispatcherStats proxies the dispatcher's ops listener.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: dispatcher
      ports:
        - { protocol: TCP, port: 8099 }
    # SystemService.GetPlatformStats proxies the worker's ops listener for
    # the cross-tenant RLS census (container port 8090).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: worker
      ports:
        - { protocol: TCP, port: 8090 }
    # SystemService.GetPlatformHealth reads each role's health snapshot; the
    # rules above already reach iam, worker, dispatcher and mcp.
    {{- range $role, $port := dict "api" 8080 "admin" 8090 "ingest" 8100 "session" $sessionPort }}
    {{- if (index $.Values.deployments $role).enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $role }}
      ports:
        - { protocol: TCP, port: {{ $port }} }
    {{- end }}
    {{- end }}
    {{- if .Values.deployments.mcp.enabled }}
    # MCPInspectService (status, sessions) proxies the bridge's listener. The
    # mcp policy admitted admin, but without this egress the call was refused
    # at the admin pod and the console's /mcp page showed the server down.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: mcp
      ports:
        - { protocol: TCP, port: {{ $mcpPort }} }
    {{- end }}
{{- end }}
{{- if .Values.deployments.worker.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-worker
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Port here is the CONTAINER port (8090, config worker.ops.addr) —
    # the Service publishes it as 8099. The previous value matched the
    # Service port, which never selects anything on the pod.
    - from:
        - {{ $fromMonitoring | toJson }}
        # Admin proxies /system/rls-census.json for the console's /stats
        # page — the worker's pool is the BYPASSRLS one, so the
        # cross-tenant census of the RLS'd tables is computed there.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: admin
      ports:
        - { protocol: TCP, port: 8090 }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    - {{ $storageEgress | toJson }}
{{- end }}
{{- if .Values.deployments.dispatcher.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-dispatcher
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "dispatcher") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "dispatcher") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromMonitoring | toJson }}
        # Admin proxies /system/dispatcher-stats.json for the console.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: admin
      ports:
        - { protocol: TCP, port: 8099 }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  # Open egress by design: the dispatcher delivers to CUSTOMER sinks —
  # webhooks, brokers, queues — on arbitrary endpoints and ports. The
  # blast-radius win of the role split is that ONLY this pod needs it.
  egress:
    - {}
{{- end }}
{{- if .Values.deployments.ingest.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-ingest
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "ingest") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "ingest") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Webhook driver: the storage system POSTs bucket events to :8100.
    # NATS driver deploys need no ingress at all — this allow is harmless.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.storage.namespace }}
        - {{ $fromMonitoring | toJson }}
        # So does the admin role's SystemService.GetPlatformHealth.
        - {{ $fromAdmin | toJson }}
      ports:
        - { protocol: TCP, port: 8100 }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    - {{ $storageEgress | toJson }}
    - {{ $natsEgress | toJson }}
{{- end }}
{{- if .Values.deployments.mcp.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-mcp
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "mcp") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "mcp") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromController | toJson }}
        - {{ $fromMonitoring | toJson }}
        # MCPInspectService.ListSessions: the admin pod proxies the console's
        # sessions view to mcp.http.sessions_url, which the chart points here.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: admin
      ports:
        - { protocol: TCP, port: {{ $mcpPort }} }
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    # Bridge mode proxies MCP tool calls to the api / iam / admin planes,
    # and verifies sessions by the iam role's JWKS.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: iam
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: admin
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8085 }
        - { protocol: TCP, port: 8090 }
{{- end }}
{{/*
  The migrate / bootstrap Jobs.

  They are NOT optional here, and leaving them out is not a smaller policy set
  — it is a broken upgrade. The default-deny above selects on the chart's own
  name+instance labels, which the Job pods carry; the per-role policies select
  on `app.kubernetes.io/component`, which for them is `migrate` / `bootstrap`
  and matches none of the six above. So both Jobs land under default-deny with
  no allow of their own.

  The failure that produces is the worst-shaped kind. The Jobs are
  pre-install/pre-upgrade hooks and these policies are not, so on a FIRST
  install no policy exists yet and the Jobs run unrestricted. On every upgrade
  after it the previous release's default-deny is already in the cluster, the
  migrate hook runs under it, cannot reach Postgres, and the release fails —
  having worked exactly once.

  Hence the hook annotations: weight -10 puts these beside the ServiceAccounts
  and ahead of migrate (0) and bootstrap (10), so the allow exists before the
  pod that needs it. `before-hook-creation` matches what 0c511f8b set across
  the SAs, the RBAC and both Jobs.

  Egress only — nothing connects TO a Job. `$common` is the whole of it for
  migrate: DNS, the Kubernetes API the secret resolver reads at boot, Postgres,
  and the OTLP collector. Bootstrap also reaches the object stores, because it
  probes each configured backend that was never probed (ADR-0026); without the
  allow that probe times out and records a working backend as unreachable.
*/}}
{{- range $jobName, $jobSpec := .Values.jobs }}
{{- if $jobSpec.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" $ }}-{{ $jobName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/sync-wave": "-10"
  labels:
    {{- include "chart.roleLabels" (dict "ctx" $ "role" $jobName) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" $ "role" $jobName) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    {{- if eq $jobName "bootstrap" }}
    - {{ $storageEgress | toJson }}
    {{- end }}
{{- end }}
{{- end }}
{{- if $sessionOn }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-session
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "session") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "session") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # The console's ingress routes its /session/ paths here.
        - {{ $fromController | toJson }}
        # SystemService.GetPlatformHealth reads its health snapshot.
        - {{ $fromAdmin | toJson }}
      ports:
        - { protocol: TCP, port: {{ $sessionPort }} }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  egress:
    # No database: DNS, 443 and the Kubernetes API (its health token), OTLP.
    {{- range $r := list $dns $https $otlp }}
    - {{ $r | toJson }}
    {{- end }}
    # The planes it forwards to; iam also mints its tokens and serves the JWKS.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: api
      ports:
        - { protocol: TCP, port: 8080 }
    - {{ $toIAMJWKS | toJson }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: admin
      ports:
        - { protocol: TCP, port: 8090 }
{{- end }}

{{- end }}
