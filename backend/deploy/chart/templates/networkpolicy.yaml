{{/*
  Per-role NetworkPolicies — default-deny ingress+egress for every pod this
  chart owns, then explicit allows per role. Gated on
  networkPolicies.enabled (off by default: needs an enforcing CNI; inert
  but harmless otherwise). See the values block for the flow matrix
  rationale; the short version:

    api        ← ingress-controller / UI / mcp     → common + storage
    admin      ← ingress-controller / UI / mcp     → common + storage + NATS
                                                     + adminBrokerPorts (Test)
                                                     + dispatcher/worker ops
    worker     ← monitoring / admin (ops)          → common + storage
    dispatcher ← monitoring (ops)                  → OPEN egress (customer
                                                     sinks live anywhere)
    ingest     ← storage ns (webhook) / monitoring → common + NATS
    mcp        ← ingress-controller / monitoring   → common + api/admin pods

  "common" egress = DNS (kube-system:53), 443/6443 anywhere (K8s API for the
  secret resolver + https webhooks/JWKS), Postgres, and the OTLP collector on
  the port config.otel.endpoint names.

  With config.otel.metrics_exporter: prometheus, api and admin also admit the
  monitoring namespace on the port of config.otel.metrics_addr — their scrape
  listener is a port of its own, not one of the plane ports above.

  Kubelet liveness/readiness probes originate on the node and bypass policy
  enforcement in mainstream CNIs, so default-deny ingress does not break
  health checks.
*/}}
{{- if .Values.networkPolicies.enabled }}
{{- $np := .Values.networkPolicies }}
{{- $common := list }}
{{/* DNS */}}
{{- $dns := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" "kube-system")))) "ports" (list (dict "protocol" "UDP" "port" 53) (dict "protocol" "TCP" "port" 53)) }}
{{/* K8s API + any https (secret resolver, JWKS fetch, webhook sinks on 443) */}}
{{- $https := dict "ports" (list (dict "protocol" "TCP" "port" 443) (dict "protocol" "TCP" "port" 6443)) }}
{{/* Postgres */}}
{{- $pg := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.postgres.namespace)))) "ports" (list (dict "protocol" "TCP" "port" $np.postgres.port)) }}
{{/*
  OTLP collector — any namespace, on the port the exporter dials. Read from the
  endpoint rather than fixed: it was fixed at 4317, the gRPC port, while the
  chart's own default exporter speaks OTLP/HTTP to 4318, so every span was
  dropped the moment policies were on.
*/}}
{{- $otlpPort := splitList ":" .Values.config.otel.endpoint | last | int }}
{{- $otlp := dict "ports" (list (dict "protocol" "TCP" "port" $otlpPort)) }}
{{/* The api / admin scrape listener, when metrics are pulled. */}}
{{- $metricsPulled := and .Values.config.otel.enabled (eq .Values.config.otel.metrics_exporter "prometheus") }}
{{- $metricsPort := splitList ":" .Values.config.otel.metrics_addr | last | int }}
{{- $scrape := dict "from" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" .Values.networkPolicies.monitoring.namespace)))) "ports" (list (dict "protocol" "TCP" "port" $metricsPort)) }}
{{- $common = list $dns $https $pg $otlp }}
{{- $storageEgress := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.storage.namespace)))) }}
{{- $natsEgress := dict "to" (list (dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.nats.namespace)))) "ports" (list (dict "protocol" "TCP" "port" $np.nats.port)) }}
{{- $fromController := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.ingressController.namespace)) "podSelector" (dict "matchLabels" $np.ingressController.podLabels) }}
{{- $fromMonitoring := dict "namespaceSelector" (dict "matchLabels" (dict "kubernetes.io/metadata.name" $np.monitoring.namespace)) }}
{{- $fromUI := dict "podSelector" (dict "matchLabels" $np.ui.podLabels) }}
{{- $fromMCP := dict "podSelector" (dict "matchLabels" (dict "app.kubernetes.io/component" "mcp" "app.kubernetes.io/instance" .Release.Name)) }}
---
# Baseline: default-deny both directions for every pod of this release.
# Per-role policies below are purely additive allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-default-deny
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
{{- if .Values.deployments.api.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-api
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "api") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "api") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromController | toJson }}
        - {{ $fromUI | toJson }}
        - {{ $fromMCP | toJson }}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8085 }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    - {{ $storageEgress | toJson }}
{{- end }}
{{- if .Values.deployments.admin.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-admin
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "admin") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "admin") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromController | toJson }}
        - {{ $fromUI | toJson }}
        - {{ $fromMCP | toJson }}
      ports:
        - { protocol: TCP, port: 8090 }
    {{- if $metricsPulled }}
    - {{ $scrape | toJson }}
    {{- end }}
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    - {{ $storageEgress | toJson }}
    - {{ $natsEgress | toJson }}
    {{- if $np.adminBrokerPorts }}
    # Synchronous TestSubscription from the admin pod may dial broker sinks
    # on these ports (any namespace / external). Trim per environment.
    - ports:
        {{- range $p := $np.adminBrokerPorts }}
        - { protocol: TCP, port: {{ $p }} }
        {{- end }}
    {{- end }}
    # SystemService.GetDispatcherStats proxies the dispatcher's ops listener.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: dispatcher
      ports:
        - { protocol: TCP, port: 8099 }
    # SystemService.GetPlatformStats proxies the worker's ops listener for
    # the cross-tenant RLS census (container port 8090).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: worker
      ports:
        - { protocol: TCP, port: 8090 }
{{- end }}
{{- if .Values.deployments.worker.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-worker
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Port here is the CONTAINER port (8090, config worker.ops.addr) —
    # the Service publishes it as 8099. The previous value matched the
    # Service port, which never selects anything on the pod.
    - from:
        - {{ $fromMonitoring | toJson }}
        # Admin proxies /system/rls-census.json for the console's /stats
        # page — the worker's pool is the BYPASSRLS one, so the
        # cross-tenant census of the RLS'd tables is computed there.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: admin
      ports:
        - { protocol: TCP, port: 8090 }
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    - {{ $storageEgress | toJson }}
{{- end }}
{{- if .Values.deployments.dispatcher.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-dispatcher
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "dispatcher") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "dispatcher") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromMonitoring | toJson }}
        # Admin proxies /system/dispatcher-stats.json for the console.
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: admin
      ports:
        - { protocol: TCP, port: 8099 }
  # Open egress by design: the dispatcher delivers to CUSTOMER sinks —
  # webhooks, brokers, queues — on arbitrary endpoints and ports. The
  # blast-radius win of the role split is that ONLY this pod needs it.
  egress:
    - {}
{{- end }}
{{- if .Values.deployments.ingest.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-ingest
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "ingest") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "ingest") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Webhook driver: the storage system POSTs bucket events to :8100.
    # NATS driver deploys need no ingress at all — this allow is harmless.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $np.storage.namespace }}
        - {{ $fromMonitoring | toJson }}
      ports:
        - { protocol: TCP, port: 8100 }
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    - {{ $natsEgress | toJson }}
{{- end }}
{{- if .Values.deployments.mcp.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" . }}-mcp
  labels:
    {{- include "chart.roleLabels" (dict "ctx" . "role" "mcp") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" . "role" "mcp") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - {{ $fromController | toJson }}
        - {{ $fromMonitoring | toJson }}
      ports:
        - { protocol: TCP, port: 8095 }
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
    # Bridge mode proxies MCP tool calls to the api / admin planes.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: admin
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8085 }
        - { protocol: TCP, port: 8090 }
{{- end }}
{{/*
  The migrate / bootstrap Jobs.

  They are NOT optional here, and leaving them out is not a smaller policy set
  — it is a broken upgrade. The default-deny above selects on the chart's own
  name+instance labels, which the Job pods carry; the per-role policies select
  on `app.kubernetes.io/component`, which for them is `migrate` / `bootstrap`
  and matches none of the six above. So both Jobs land under default-deny with
  no allow of their own.

  The failure that produces is the worst-shaped kind. The Jobs are
  pre-install/pre-upgrade hooks and these policies are not, so on a FIRST
  install no policy exists yet and the Jobs run unrestricted. On every upgrade
  after it the previous release's default-deny is already in the cluster, the
  migrate hook runs under it, cannot reach Postgres, and the release fails —
  having worked exactly once.

  Hence the hook annotations: weight -10 puts these beside the ServiceAccounts
  and ahead of migrate (0) and bootstrap (10), so the allow exists before the
  pod that needs it. `before-hook-creation` matches what 0c511f8b set across
  the SAs, the RBAC and both Jobs.

  Egress only — nothing connects TO a Job — and `$common` is the whole of it:
  DNS, the Kubernetes API the secret resolver reads at boot, Postgres, and the
  OTLP collector.
*/}}
{{- range $jobName, $jobSpec := .Values.jobs }}
{{- if $jobSpec.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chart.fullname" $ }}-{{ $jobName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    "argocd.argoproj.io/sync-wave": "-10"
  labels:
    {{- include "chart.roleLabels" (dict "ctx" $ "role" $jobName) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chart.roleSelectorLabels" (dict "ctx" $ "role" $jobName) | nindent 6 }}
  policyTypes: [Egress]
  egress:
    {{- range $r := $common }}
    - {{ $r | toJson }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
