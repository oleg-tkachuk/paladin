# Paladin Helm values overlay for the SHARED DEV cluster (vc-dev).
#
#   helm upgrade --install paladin ./deploy/chart \
#     -n paladin \
#     -f ./deploy/chart/values.yaml \
#     -f ./deploy/chart/values-dev.yaml
#
# TODO before first apply: replace any `<...>` placeholder with the
# real value from the dev-cluster Pulumi outputs / Vault secret.

config:
  app:
    env: dev

  logger:
    level: debug
    development: false

  otel:
    enabled: true
    insecure: true

  auth:
    issuer: "https://paladin.dev.example/"
    # signing_key on dev — reference a Secret in a follow-up overlay;
    # plaintext placeholder is unsafe even for shared dev.
    signing_key: "<dev-cluster-signing-key>"

  storage:
    backends:
      primary:
        endpoint: "<dev-seaweedfs-endpoint>"
        public_endpoint: "<dev-s3-public-endpoint>"
        # auth.access_key / secret_key sourced from the chart-managed
        # `paladin-s3-credentials` Secret (see `storage.s3CredentialsSecret`
        # below) via K8sSecretResolver. Set `existingSecret` instead
        # when the dev cluster wires ExternalSecret / SealedSecret.

# Chart-managed primary-backend credentials Secret. Replace the dummy
# placeholders below with the real dev-cluster values, or point at an
# existing ExternalSecret-managed Secret via `existingSecret`.
storage:
  s3CredentialsSecret:
    create: true
    accessKey: "<dev-access-key>"
    secretKey: "<dev-secret-key>"

image:
  pullPolicy: IfNotPresent

traefik:
  hosts:
    - api.paladin.dev.example
tls:
  certManager:
    enabled: true
    issuerName: letsencrypt-staging
    issuerKind: ClusterIssuer

metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  alerts:
    enabled: true
    labels:
      release: kube-prometheus-stack

# The in-cluster CNPG cluster; its operator publishes the role passwords in
# the `database` namespace.
postgres:
  host: paladin-postgresql-rw.database.svc.cluster.local
  app:
    existingSecret: paladin-postgresql-app-user
    namespace: database
  migrate:
    existingSecret: paladin-postgresql-migrate-user
    namespace: database

# The Postgres operator keeps its user Secrets in the `database` namespace,
# which a namespaced Role cannot reach.
rbac:
  secretReader:
    clusterWide: true
    secretNames:
      - paladin-postgresql-app-user
      - paladin-postgresql-migrate-user
      - paladin-postgresql-reaper-user
      - paladin-admin-key
      - paladin-bootstrap-admin
      - paladin-auth-signing-key
      - paladin-ingest-hmac

# TLS between the planes, from the certificate cert-manager issues into the
# release namespace.
internalTLS:
  enabled: true
  existingSecret: paladin-api-mtls
