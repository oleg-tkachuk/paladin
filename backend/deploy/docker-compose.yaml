# Smoke / integration stack. One container per `paladin` subcommand —
# matches Helm's per-role Deployment topology so behaviour mirrors prod.
# The UI rides on the same network so its BFF reaches the planes via
# container DNS, no host.docker.internal hop.
#
#   docker compose -f deploy/docker-compose.yaml up --build
#
# UI build context resolves to the sibling `frontend/` directory of
# the integrated repo. To bring up backend only: `--scale paladin-console=0`.
#
# Boot order via `condition: service_completed_successfully`:
#   postgres healthy → paladin-migrate (one-shot) → paladin-promote-app-role
#                    (one-shot) → paladin-bootstrap (one-shot)
#                                              → paladin-api / paladin-admin /
#                                                paladin-worker / paladin-dispatcher /
#                                                paladin-mcp / paladin-ingest
#                                              → paladin-console (waits for api+admin)
#
# Verify the planes + UI:
#   curl http://localhost:8083/readyz   # data
#   curl http://localhost:8085/readyz   # iam
#   curl http://localhost:8090/readyz   # admin
#   curl http://localhost:8095/healthz  # mcp
#   curl http://localhost:8100/readyz   # ingest (webhook receiver)
#   open http://localhost:3002          # UI (login page)

x-build-meta: &build-meta
  APP_VERSION: ${APP_VERSION:-v0.0.1-dev}
  GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-local-dev}
  BUILD_TIME: ${BUILD_TIME:-now}

x-paladin-base: &paladin-base
  image: paladin-core
  build:
    # The repository root: the image also needs the sibling capability/
    # module, as the backend Taskfile's DOCKER_CONTEXT says.
    context: ../..
    dockerfile: backend/deploy/Dockerfile
    network: host
    args: *build-meta
  volumes:
    - ../configs:/app/configs:ro

services:
  postgres:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: paladin-postgres
    environment:
      POSTGRES_DB: paladin
      POSTGRES_USER: paladin
      # dev-only credentials — local compose only, NEVER reused outside it
      # (prod Postgres creds come from sealed secrets via the chart).
      POSTGRES_PASSWORD: paladin
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paladin -d paladin"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      # Postgres 18's image keeps its data under /var/lib/postgresql/18/docker
      # and refuses a volume at the old /var/lib/postgresql/data.
      - paladin_pg_data:/var/lib/postgresql
      - ./postgres-custom.conf:/etc/postgresql/postgresql.conf:ro

  seaweedfs:
    # Pinned, not `:latest`: a floating tag changes what the stack runs with
    # no commit of ours in between, and the e2e suite pins the same release.
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    container_name: paladin-seaweedfs
    # `-filer.notification` enables the webhook publisher that posts
    # filer events to paladin-ingest. The notification.toml mounted at
    # /etc/seaweedfs/notification.toml is the source of truth for
    # which backend (webhook / kafka / nats / …) is actually live.
    command: >-
      server -ip.bind=0.0.0.0 -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -filer.notification=/etc/seaweedfs/notification.toml
    ports:
      - "9333:9333"
      - "8081:8080"
      - "8888:8888"
      - "8333:8333"
    volumes:
      - paladin_seaweed_data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - ./seaweedfs-notification.toml:/etc/seaweedfs/notification.toml:ro

  # One-shot: applies SQL migrations and exits 0. The api/admin/worker/mcp
  # services gate on `service_completed_successfully` so they never see a
  # half-migrated schema.
  paladin-migrate:
    <<: *paladin-base
    container_name: paladin-migrate
    restart: "no"
    command: ["migrate", "--config", "/app/configs/compose.yaml"]
    environment:
      # The owner, for this service only: `paladin migrate` opens the runtime
      # pool before it touches migrate_dsn, and paladin_app cannot log in
      # until 002 has created it and paladin-promote-app-role has given it a
      # password.
      PALADIN_DATASTORES_POSTGRES_DSN: postgres://paladin:paladin@postgres:5432/paladin?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: gives paladin_app a way to log in. 002 creates the role NOLOGIN —
  # production provisions its credential out of band — and every service below
  # connects as it (configs/compose.yaml), so on a fresh volume nothing could
  # start without this. Same step as the e2e stack's promote-app-role.
  paladin-promote-app-role:
    image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    container_name: paladin-promote-app-role
    restart: "no"
    environment:
      PGPASSWORD: paladin
    # dev-only credential, same class as everything else in this file.
    command:
      - psql
      - -h
      - postgres
      - -U
      - paladin
      - -d
      - paladin
      - -v
      - ON_ERROR_STOP=1
      - -c
      - ALTER ROLE paladin_app WITH LOGIN PASSWORD 'paladin_app';
    depends_on:
      paladin-migrate:
        condition: service_completed_successfully

  # One-shot: provisions the platform admin user + storage backend rows.
  # Idempotent — safe to re-run on every `up`.
  paladin-bootstrap:
    <<: *paladin-base
    container_name: paladin-bootstrap
    restart: "no"
    command: ["bootstrap", "--config", "/app/configs/compose.yaml"]
    depends_on:
      paladin-promote-app-role:
        condition: service_completed_successfully

  paladin-api:
    <<: *paladin-base
    container_name: paladin-api
    init: true
    restart: on-failure
    command: ["serve", "api", "--config", "/app/configs/compose.yaml"]
    ports:
      - "8083:8080"   # data — host 8083, not 8080: another local service owns 8080
      - "8085:8085"   # iam
    depends_on:
      paladin-bootstrap:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started

  paladin-admin:
    <<: *paladin-base
    container_name: paladin-admin
    init: true
    restart: on-failure
    command: ["serve", "admin", "--config", "/app/configs/compose.yaml"]
    ports:
      - "8090:8090"
    depends_on:
      paladin-bootstrap:
        condition: service_completed_successfully

  paladin-worker:
    <<: *paladin-base
    container_name: paladin-worker
    init: true
    restart: on-failure
    command: ["serve", "worker", "--config", "/app/configs/compose.yaml"]
    depends_on:
      paladin-bootstrap:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_started

  # Drains the event_deliveries outbox to subscriptions' sinks. Without it the
  # stack wrote outbox rows that nothing ever delivered.
  paladin-dispatcher:
    <<: *paladin-base
    container_name: paladin-dispatcher
    init: true
    restart: on-failure
    command: ["serve", "dispatcher", "--config", "/app/configs/compose.yaml"]
    depends_on:
      paladin-bootstrap:
        condition: service_completed_successfully

  paladin-mcp:
    <<: *paladin-base
    container_name: paladin-mcp
    init: true
    restart: on-failure
    command: ["serve", "mcp", "--config", "/app/configs/compose.yaml"]
    ports:
      - "8095:8095"
    depends_on:
      paladin-api:
        condition: service_started
      paladin-admin:
        condition: service_started

  # Ingest plane: receives storage-backend events (SeaweedFS webhook
  # by default in compose; NATS / RabbitMQ in prod) and promotes
  # PENDING → AVAILABLE on matching object rows. Standalone process
  # so its HTTP receiver doesn't share lifecycle with Connect listeners.
  paladin-ingest:
    <<: *paladin-base
    container_name: paladin-ingest
    init: true
    restart: on-failure
    command: ["serve", "ingest", "--config", "/app/configs/compose.yaml"]
    ports:
      - "8100:8100"   # webhook receiver
    depends_on:
      paladin-bootstrap:
        condition: service_completed_successfully

  # UI BFF (Next.js). Browser hits localhost:3002 → /api/rpc/<plane>/...
  # is proxied by the UI process to paladin-api / paladin-admin via container
  # DNS. No host.docker.internal: same network as the planes.
  #
  # Build context is the sibling repo. If you don't have it checked out,
  # bring up the backend with `--scale paladin-console=0` to skip this service.
  paladin-console:
    image: paladin-console
    container_name: paladin-console
    build:
      context: ../../frontend
      dockerfile: ./deploy/Dockerfile
      network: host
      args:
        APP_VERSION: ${APP_VERSION:-v0.0.1-dev}
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH:-local-dev}
        BUILD_TIME: ${BUILD_TIME:-now}
    init: true
    restart: on-failure
    ports:
      # Host 3002 → container 3000. Matches the UI repo's standalone
      # compose so dev muscle memory carries over.
      - "3002:3000"
    environment:
      # Per-plane backend URLs read by the BFF (src/app/api/rpc/...
      # /route.ts and src/lib/auth/bff.ts). Browser never sees these —
      # it only ever hits /api/rpc on this container.
      PALADIN_DATA_URL: http://paladin-api:8080
      PALADIN_IAM_URL: http://paladin-api:8085
      PALADIN_ADMIN_URL: http://paladin-admin:8090
    depends_on:
      paladin-api:
        condition: service_started
      paladin-admin:
        condition: service_started

volumes:
  paladin_pg_data:
  paladin_seaweed_data:
