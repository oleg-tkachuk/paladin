# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Working ON Paladin: the gates, the codegen and the dependency bumps.
# Nothing here operates a cluster.
#
#   task -t Taskfile.dev.yaml --list
#   task -t Taskfile.dev.yaml verify-all     # before pushing
#
# Why a second entry point at all — see the header of Taskfile.yaml. The short
# version: `task` is the list an operator reads, and these are not their
# commands.
#
# Named dev rather than ci because CI is a caller, not the definition:
# .github/workflows/ci.yaml runs `verify-all` as-is so the pipeline and a
# developer's machine check the same thing. What the tasks below have in
# common is the repository, not the pipeline.

silent: true

vars:
  # The local image names, not a publish target: verify-e2e builds both images
  # as registry.local/paladin/<component> and passes that prefix to the stack
  # (PALADIN_IMAGE_PREFIX). Nothing here pushes.
  GLOBAL_REGISTRY: '{{.GLOBAL_REGISTRY | default "registry.local"}}'
  IMAGE_NAMESPACE: '{{.IMAGE_NAMESPACE | default "paladin"}}'
  # Kube context every kubectl/helm task targets. Defaults to the local
  # OrbStack cluster; both components redeclare the same default so a
  # standalone `cd backend && task …` behaves identically.
  K8S_CONTEXT: '{{.K8S_CONTEXT | default "orbstack"}}'
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  #
  # The second copy of this pin, and it has to be: `includes:` below resolves
  # before anything this entry point could read it from, and an included file
  # cannot hand a var upward. Held to the same version as Taskfile.yaml by
  # hand; a half-applied bump fails one entry point with a message about trust
  # rather than about the version.
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v11.1.2'
  # Pinned, and run through `pipx run` rather than installed: the rules a scan
  # asserts against change between releases, so an unpinned checkov makes a
  # local run and the pipeline's disagree — a red nobody else can reproduce, or
  # a green that means nothing. Read by `checkov:` and by verify:chart-scan.
  CHECKOV_VERSION: "3.3.20"
  # Status marker, the same vocabulary as Taskfile.yaml and as the shared
  # library. Redefined rather than inherited, and forgetting is silent: Task
  # renders an undefined variable as the empty string, so a missing glyph
  # prints a line with nothing in front of it rather than raising anything.
  _OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'

includes:
  # ─── components ────────────────────────────────────────────────────────────
  # DUPLICATED from Taskfile.yaml, deliberately, and guarded. Keep these
  # blocks byte-identical; `verify:taskfile-drift` below is what notices.
  backend:
    taskfile: backend/Taskfile.yaml
    dir: backend
    vars: { GLOBAL_REGISTRY: "{{.GLOBAL_REGISTRY}}", IMAGE_NAMESPACE: "{{.IMAGE_NAMESPACE}}", K8S_CONTEXT: "{{.K8S_CONTEXT}}" }
  frontend:
    taskfile: frontend/Taskfile.yaml
    dir: frontend
    vars: { GLOBAL_REGISTRY: "{{.GLOBAL_REGISTRY}}", IMAGE_NAMESPACE: "{{.IMAGE_NAMESPACE}}", K8S_CONTEXT: "{{.K8S_CONTEXT}}" }

  # ─── fan-out ───────────────────────────────────────────────────────────────
  # The other half of the split described in Taskfile.yaml: test, lint and
  # build are a developer's verbs, deploy is Taskfile.local.yaml's. Flattened for the same
  # reason there — `task test`, not `task all:test`.
  monorepo:
    taskfile: '{{printf .TASKLIB "monorepo"}}'
    dir: .
    flatten: true
    excludes: ["deploy", "registry:check"]
    vars: { COMPONENTS: ["backend", "frontend"], GLOBAL_REGISTRY: "{{.GLOBAL_REGISTRY}}" }

  # ─── repo-wide tooling ─────────────────────────────────────────────────────
  # Not wired into this repo's own aggregates on purpose: the tasks are here to
  # be run, not to change what an existing gate already does.
  pnpm:
    taskfile: '{{printf .TASKLIB "pnpm"}}'
    dir: .
    # The version is pinned twice and the two must agree: packageManager in
    # frontend/package.json, which is also what CI reads, and ARG PNPM_VERSION
    # in the image build, which runs before there is a package manager to read
    # the first one. Both sat a release behind for months because nothing
    # updated either.
    vars:
      PNPM_APPS: ["frontend"]
      PNPM_PIN_FILES: ["frontend/deploy/Dockerfile"]
  sec:
    taskfile: '{{printf .TASKLIB "security"}}'
    dir: .
    vars:
      # trivy 0.74 does not pick .trivyignore.yaml up on its own.
      # frontend/.next is build output, rewritten by every `frontend:build`:
      # a scan that overlaps one dies on a file deleted mid-walk.
      TRIVY_FLAGS: --ignorefile .trivyignore.yaml --skip-dirs frontend/.next
      # The charts are scanned rendered, per values file, by verify:chart-scan;
      # trivy's own helm renderer reads the defaults only and skips a chart
      # that refuses them.
      TRIVY_CONFIG_FLAGS: >-
        --ignorefile .trivyignore.yaml --skip-dirs frontend/.next
        --skip-dirs backend/deploy/chart --skip-dirs frontend/deploy/chart
      # sqlc, protobuf and mock output is not written by hand and not reviewed
      # as source; gosec reads its SQL string constants as hardcoded
      # credentials. Excluding it drops 141 of 188 findings, all of them noise,
      # and leaves the ones in code somebody wrote.
      GOSEC_FLAGS: -exclude-dir=sqlc -exclude-dir=mocks -exclude-generated
      GO_MODULES: ["capability", "backend", "sdk/go"]
  # Policy scanning over the YAML a cluster applies — the charts, the
  # Dockerfiles and these workflows. Separate from `sec:` because it asks a
  # different question of a different tree: `sec:` scans the Go modules and
  # what is built from them.
  checkov:
    taskfile: '{{printf .TASKLIB "checkov"}}'
    dir: .
    vars:
      # CHECKOV_TARGET and CHECKOV_FRAMEWORKS reach `checkov:triage` only;
      # `checkov:scan` reads `directory` and `framework` from .checkov.yaml,
      # and scripts/checkov-config.test.sh fails when the two disagree.
      # Whole-repo with exclusions; the excluded trees are vendored or
      # generated and no cluster ever sees them.
      CHECKOV_TARGET: ["."]
      CHECKOV_FLAGS: >-
        --skip-path node_modules --skip-path .task
        --skip-path frontend/.next --skip-path sdk/go/gen
        --skip-path frontend/src/gen
      # No `helm`: its renderer reads each chart's defaults only and skips a
      # chart that refuses them. verify:chart-scan scans the rendered charts.
      CHECKOV_FRAMEWORKS: ["kubernetes", "dockerfile", "github_actions"]
      CHECKOV_VERSION: '{{.CHECKOV_VERSION}}'
  # The third Go tree. It is a library with no image and no chart, so it is not
  # a monorepo component and carries no Taskfile of its own — the library's go
  # module aimed at its directory is the whole surface it needs.
  capability:
    taskfile: '{{printf .TASKLIB "go"}}'
    dir: capability
    vars: { PROJECT_NAME: capability }
  # The Go SDK: generated stubs plus a thin client, its own module so a
  # consumer does not inherit the backend's dependency graph. Two includes
  # because the library splits the Go verbs from codegen.
  go-sdk:
    taskfile: '{{printf .TASKLIB "go"}}'
    dir: sdk/go
    vars: { PROJECT_NAME: go-sdk }
  go-sdk-gen:
    taskfile: '{{printf .TASKLIB "codegen"}}'
    dir: sdk/go
    vars:
      PROJECT_NAME: go-sdk
      BUF_INPUT: ../../proto
      BUF_TEMPLATE: ["buf.gen.yaml"]
      # Installed from sdk/go's own go.mod, so the generator versions are the
      # ones the generated code is compiled against.
      PROTO_PLUGINS: google.golang.org/protobuf/cmd/protoc-gen-go connectrpc.com/connect/cmd/protoc-gen-connect-go
      PROTO_PATHSPEC: gen
      GENERATED_DIRS: ["gen"]
  # The Python SDK. Its stubs are generated by sdk/python/scripts/generate.sh
  # with the protoc grpcio-tools pins, not by buf's plugins.
  py-sdk:
    taskfile: '{{printf .TASKLIB "python/uv"}}'
    dir: sdk/python
    vars: { PROJECT_NAME: py-sdk, PY_SRC: src tests examples }

tasks:
  default:
    desc: "The gates, codegen and dependency bumps"
    # Written out for the same reason as Taskfile.yaml's: the flattened
    # components put 100-odd tasks in `--list`, and the dozen below are the
    # ones this entry point exists for.
    cmds:
      - cmd: |
          printf '%s\n' \
            "Paladin — working on the repository" \
            "" \
            "  task -t Taskfile.dev.yaml verify-all         the commit gate: seconds, no Docker" \
            "  task -t Taskfile.dev.yaml verify-deep        Postgres-backed suites; Docker, ~3 min" \
            "  task -t Taskfile.dev.yaml verify-e2e         Playwright on this branch; Docker, ~10 min" \
            "  task -t Taskfile.dev.yaml verify-capability  the capability module on its own" \
            "  task -t Taskfile.dev.yaml verify-go-sdk      the Go SDK on its own" \
            "  task -t Taskfile.dev.yaml verify-py-sdk      the Python SDK on its own" \
            "  task -t Taskfile.dev.yaml test               unit tests, both halves" \
            "  task -t Taskfile.dev.yaml lint               linters, both halves" \
            "  task -t Taskfile.dev.yaml gen                SDK stubs + sqlc + mocks + the console's codegen" \
            "  task -t Taskfile.dev.yaml deps:update        bump dependencies, no majors" \
            "  task -t Taskfile.dev.yaml sec:scan           the security scanners" \
            "" \
            "  task -t Taskfile.dev.yaml --list             the rest, component by component" \
            "  task                                         operating the stack" \
            "  task -t Taskfile.local.yaml                  publish to registry.local"

  # ═══ gates ══════════════════════════════════════════════════════════════════

  verify-all:
    desc: "Test + lint + build both halves. The commit gate: seconds, no Docker."
    # The local green bar. CI runs the same groups, each only when its paths
    # changed, so a group here and a CI job there check the same thing.
    cmds:
      - task: verify-backend
      # The third Go tree. Every lefthook Go job is `root: backend/` and this
      # aggregate reached backend + frontend only, so `capability/` was checked
      # by nothing a developer runs — its CI job caught an unformatted file that
      # had been committed and pushed.
      - task: verify-capability
      - task: verify-sdk
      - task: verify-frontend
      - task: verify-repo
      - echo "{{._OK}} paladin · the commit gate passed"

  verify-backend:
    desc: "The backend: tests, the tagged suites compiling, lint, sqlc, image metadata"
    cmds:
      - task: backend:test
      # The tagged suites are excluded from `go test ./...` by their build tag,
      # so this is the only thing in the local gate that notices when one has
      # stopped compiling. Both of them had.
      - task: backend:go:test:tagged:compile
      - task: backend:lint
      - task: verify:sqlc-pin
      - task: verify:image-build-meta

  verify-frontend:
    desc: "The console: tests, lint, generated stubs, build"
    cmds:
      # The frontend's unit tests. Their absence here is how a breaking API
      # change reached a green gate: three vitest specs had been failing for
      # days and nothing local ran them. Lint and build assert nothing.
      - task: frontend:test
      - task: frontend:lint
      - task: verify:frontend-gen
      - task: frontend:build

  verify-sdk:
    desc: "Both SDKs: lint, tests, and stubs that match the contract"
    cmds:
      - task: verify-go-sdk
      - task: verify-py-sdk

  verify-repo:
    desc: "What spans components: the contract, charts, images, Taskfiles, the repository itself"
    cmds:
      - task: verify:proto-breaking
      - task: verify:ci-groups
      - task: verify:stack-ports
      - task: verify:stack-disk
      - task: verify:portable-shell
      - task: verify:chart-values
      - task: verify:chart-reads
      - task: verify:chart-netpol
      - task: verify:chart-defaults
      - task: verify:taskfile-vars
      - task: verify:taskfile-drift
      - task: verify:publish-target
      - task: verify:new-release-tag
      - task: verify:stream-release-notes
      - task: verify:badge-versions
      - task: verify:warm-go-proxy
      - task: verify:release-head
      - task: verify:release-rules
      - task: verify:go-module-paths
      - task: verify:image-uid
      - task: verify:image-sources
      - task: verify:admin-audience-roles
      - task: verify:grafana-rules
      - task: verify:private-refs
      - task: verify:checkov
      # hadolint over both images; the checkov Dockerfile scan does not lint
      # the shell inside RUN.
      - task: sec:dockerfile
      - task: verify:chart-scan
      - task: verify:health-token-secret
      # Last on purpose: toolchain drift is the least urgent thing in this
      # list, and running it earlier would mask a real test failure behind it.
      - task: verify:brewfile

  verify-go-sdk:
    desc: "gofmt + lint + test the Go SDK, and fail when its stubs are stale"
    cmds:
      - task: go-sdk:fmt:check
      - task: go-sdk:lint
      - task: go-sdk:test
      - task: go-sdk-gen:proto:check

  verify-py-sdk:
    desc: "Lint + test the Python SDK, and fail when its stubs are stale"
    cmds:
      - task: py-sdk:lint
      - task: py-sdk:test
      - ./scripts/py-sdk-gen.test.sh
      - ./scripts/py-sdk-compat.test.sh

  verify-py-sdk-compat:
    desc: "Install the Python SDK's wheel beside each protobuf and Python it supports, and run its tests (CI's compatibility matrix)"
    # Not in verify-all: it builds a dozen environments, ~5 min. CI runs the
    # same cells (sdk/python/compat.json) as parallel jobs.
    cmds:
      - ./scripts/py-sdk-compat.sh --matrix

  verify-capability:
    desc: "gofmt + lint + test the capability module (the third Go tree)"
    # golangci-lint rather than the bare `go vet` this replaces: govet is one of
    # its default linters, so the check only widens, and the module is clean
    # under it today.
    cmds:
      - task: capability:fmt:check
      - task: capability:lint
      - task: capability:test

  verify-deep:
    desc: "The gates verify-all cannot run: Postgres-backed suites and everything needing a live stack"
    # verify-all is the pre-commit gate and has to stay in the tens of seconds,
    # so it runs no Docker and boots no stack. That trade is also how three
    # suites rotted unnoticed — they were left to CI workflows that stopped
    # executing. This is the other half: a Docker daemon and several minutes,
    # run before a merge rather than before a commit. CI runs the two halves
    # as parallel jobs; together they are this task.
    cmds:
      - task: verify-deep:integration
      - task: verify-deep:stack

  verify-deep:integration:
    desc: "verify-deep, first half: the Postgres-backed suites (testcontainers)"
    cmds:
      # Disk first, before anything consumes any. This check used to run after
      # the image build and after the integration suite, so it measured the
      # worst moment in the gate rather than a representative one — and refused
      # on a transient reading that had cleared minutes later.
      - ./scripts/require-disk.sh "task -t Taskfile.dev.yaml verify-deep:integration"
      # Testcontainers, not the compose stack: these bring their own Postgres.
      - task: backend:test:integration

  verify-deep:stack:
    desc: "verify-deep, second half: build the image and run the gates that need a live stack"
    cmds:
      - ./scripts/require-disk.sh "task -t Taskfile.dev.yaml verify-deep:stack"
      - task: backend:test:stack

  verify-e2e:
    desc: "Playwright against a stack built from this branch (needs Docker, ~10 min)"
    env: { PALADIN_IMAGE_PREFIX: "{{.GLOBAL_REGISTRY}}/{{.IMAGE_NAMESPACE}}" }
    # Separate from verify-deep on purpose: this one needs the console image and
    # a browser; verify-deep boots the API and admin planes and never opens one.
    # Both images, because the stack runs the versions this build stamps and
    # compose rebuilds nothing — a Playwright run against yesterday's console is
    # a failure this repo has already had twice.
    # CI runs the two halves in separate jobs: the images once, then each
    # Playwright shard against them (scripts/e2e-images.sh carries them over).
    cmds:
      - task: verify-e2e:images
      - task: verify-e2e:run

  verify-e2e:images:
    desc: "verify-e2e, first half: build both images the stack runs"
    env: { PALADIN_IMAGE_PREFIX: "{{.GLOBAL_REGISTRY}}/{{.IMAGE_NAMESPACE}}" }
    cmds:
      - ./scripts/require-disk.sh "task -t Taskfile.dev.yaml verify-e2e:images"
      - task: backend:release:image:build
      - task: frontend:release:image:build

  verify-e2e:run:
    desc: "verify-e2e, second half: Playwright against the images the first half built"
    env: { PALADIN_IMAGE_PREFIX: "{{.GLOBAL_REGISTRY}}/{{.IMAGE_NAMESPACE}}" }
    cmds:
      - frontend/scripts/verify-e2e.sh

  # ─── the individual checks verify-all fans out over ────────────────────────
  # Named rather than inlined as bare script lines: a check that only exists
  # inside an aggregate cannot be re-run on its own after it fails, which is
  # exactly the moment somebody wants to.

  verify:proto-breaking:
    desc: "Refuse a wire-incompatible proto change against the last contract tag"
    # Seconds, no Docker, and the only thing standing between a field rename
    # and every JSON client of this API. It sat in a CI workflow that has
    # never executed, which is how forty-five breaking changes accumulated in
    # four days once already.
    cmds:
      - ./backend/scripts/proto-breaking.sh

  verify:ci-groups:
    desc: "CI runs every Verify group a change can reach, and no fewer"
    cmds:
      - ./scripts/ci-groups.test.sh

  verify:workflows:
    desc: "actionlint and zizmor over the workflows, at the versions CI pins"
    # Not part of verify-all: it fetches both tools. CI runs the same two as
    # its Workflow syntax and Workflow audit jobs.
    cmds:
      - ./scripts/workflows-audit.sh

  verify:release-signing:
    desc: "Sign and verify an image (with per-platform SBOMs) and a chart the way release.yaml does, against a throwaway registry"
    # Not part of verify-all: it needs Docker, cosign, syft, crane, helm and network
    # to ghcr.io. Keyless signing needs a CI OIDC token, so release.yaml's own
    # verify step covers that path; this covers the rest of the same script.
    cmds:
      - ./scripts/release-sign.test.sh

  verify:live:
    desc: "Check the deployed release's contracts end to end against the cluster (KUBE_CONTEXT, NAMESPACE)"
    # Not part of verify-all: it needs a running cluster with the release
    # deployed. It cleans up after itself; the tenant ends in the trash,
    # kept there by the charges its capability calls recorded.
    cmds:
      - ./scripts/live-smoke.sh

  verify:go-build-cache:
    desc: "The backend image's go build cache round-trips through scripts/go-build-cache.sh"
    # Not part of verify-all: it needs Docker and a throwaway buildx builder.
    cmds:
      - ./scripts/go-build-cache.test.sh

  verify:portable-shell:
    desc: "The tracked shell scripts use no form only BSD or only GNU accepts"
    cmds:
      - ./scripts/portable-shell.test.sh

  verify:stack-disk:
    desc: "The disk check before a Docker gate reads free space on Linux and macOS"
    cmds:
      - ./scripts/stack-disk.test.sh

  verify:stack-ports:
    desc: "Fail when the port script and the compose file disagree"
    # Two files have to agree about six port numbers — the port script and
    # the compose file — and nothing else would notice them drifting apart
    # until a gate booted on top of whatever was already listening.
    cmds:
      - ./scripts/stack-ports.test.sh

  verify:chart-values:
    desc: "Render every values file and fail on a key the schema does not admit"
    # A mistyped chart value renders the default and exits 0, so the
    # operator reads their own YAML back as applied while the cluster
    # runs something else. The schemas close that; this checks the
    # schemas still refuse anything — and renders every values file, not
    # only the defaults the chart's own gate looks at.
    cmds:
      - ./scripts/chart-values.test.sh

  verify:chart-reads:
    desc: "Fail when a key the templates read is refused by the schema"
    # The other direction from verify:chart-values: the schemas were generated
    # from the values files we ship, so they encode what we set rather than
    # what the chart supports. Three keys the templates read were already
    # refused by them.
    cmds:
      - python3 ./scripts/chart-reads.py

  verify:chart-defaults:
    desc: "Fail when the backend chart stops wiring what a fresh install needs"
    cmds:
      - ./scripts/chart-defaults.test.sh

  verify:chart-netpol:
    desc: "Fail when a role has no NetworkPolicy and the baseline does not cover it"
    # The NetworkPolicies are off in every values file we ship, so nothing
    # above renders them. The baseline denies both directions for every pod,
    # which makes a role with no policy of its own cut off rather than
    # merely exposed — worth more than a syntax check.
    cmds:
      - python3 ./scripts/chart-netpol.py

  verify:taskfile-vars:
    desc: "Fail when one component's Taskfile var leaks into the other"
    # Task does not isolate an included file's vars from its siblings, so a
    # name declared on one component only is silently inherited by the other.
    # That shipped: the console image built with the repo root as its docker
    # context from anywhere but frontend/, and took verify-e2e down with it.
    cmds:
      - ./scripts/taskfile-vars.test.sh

  verify:taskfile-drift:
    desc: "Fail when the entry points list different components"
    # The component includes are duplicated across Taskfile.yaml,
    # Taskfile.local.yaml and this file because a single shared copy is not on
    # offer: included with
    # `flatten: true` — the only form that keeps the namespaces callable as
    # `backend:deploy` rather than `components:backend:deploy` — Task 3.53.1
    # resolves an included file's variables out of one pool shared with its
    # siblings, which is the same leak `verify:taskfile-vars` above exists for
    # and would be doubled by nesting the components a level deeper.
    #
    # So the list is in three places, and this fails when they stop agreeing.
    cmds:
      - ./scripts/taskfile-drift.test.sh

  verify:image-uid:
    desc: "Fail when an image's UID/GID differs from what its chart runs it as"
    cmds:
      - ./scripts/image-uid.test.sh

  verify:release-rules:
    desc: "Fail when a commit type cuts a different release than it should"
    cmds:
      - node scripts/release-rules.test.mjs

  verify:image-sources:
    desc: "Fail when the backend image does not copy a directory the server imports"
    cmds:
      - ./scripts/image-sources.test.sh

  verify:frontend-gen:
    desc: "Fail when the console's Connect-ES stubs are stale against proto/"
    cmds:
      - ./scripts/frontend-gen.test.sh

  verify:grafana-rules:
    desc: "Fail when an alert rule or dashboard query does not parse, or an alert does not fire"
    cmds:
      - ./scripts/grafana-rules.test.sh

  verify:admin-audience-roles:
    desc: "Fail when the console and IAM disagree on which roles reach the admin plane"
    cmds:
      - ./scripts/admin-audience-roles.test.sh

  verify:image-build-meta:
    desc: "Fail when the backend image would bake a placeholder version into the binary"
    cmds:
      - ./scripts/image-build-meta.test.sh

  verify:go-module-paths:
    desc: "Fail when a Go module's path does not match its directory"
    # A mismatch builds inside the tree and cannot be fetched outside it.
    cmds:
      - ./scripts/go-module-paths.test.sh

  verify:new-release-tag:
    desc: "Fail when release.yaml would take an earlier run's tag for its own"
    # Two dispatches to one commit made the second publish a release that
    # already existed, and fail.
    cmds:
      - ./scripts/new-release-tag.test.sh

  verify:warm-go-proxy:
    desc: "Fail when a module tag would ask the Go proxy for another module or version"
    cmds:
      - ./scripts/warm-go-proxy.test.sh

  verify:badge-versions:
    desc: "Fail when the README's stack badges would read a version from the wrong place"
    cmds:
      - ./scripts/badge-versions.test.sh

  verify:stream-release-notes:
    desc: "Fail when an SDK or capability release lists commits that are not its own"
    cmds:
      - ./scripts/stream-release-notes.test.sh

  verify:release-head:
    desc: "Fail when release.yaml would tag a main head newer than the commit CI passed"
    # v4.12.0 was tagged on a merge whose own CI was still running.
    cmds:
      - ./scripts/release-head-check.test.sh

  verify:publish-target:
    desc: "Fail when release.yaml, Taskfile.yaml and the charts name different image paths"
    # A chart default naming a path nothing publishes to installs cleanly and
    # then never pulls.
    cmds:
      - ./scripts/publish-target.test.sh

  verify:private-refs:
    desc: "Fail when the tree points at a private repository or a home directory"
    # This repository is public, and the two ways it stops being safe to publish
    # are a reference a reader cannot open and a path naming somebody's machine.
    # The check asserts both positively — see the script for why it holds no list
    # of forbidden names.
    cmds:
      - ./scripts/no-private-refs.test.sh

  verify:sqlc-pin:
    desc: "Fail when the sqlc drift gate would regenerate with an unpinned sqlc"
    # sqlc stamps its own version into every file it writes, so a generator
    # taken from PATH instead of the go.mod pin rewrites the whole output
    # with nothing but that banner changed — and the drift gate then blames
    # the developer for what it had just done itself.
    cmds:
      - ./scripts/sqlc-pin.test.sh

  verify:checkov:
    desc: "Policy-scan the charts, Dockerfiles and workflows"
    # Wired into the gate rather than left as a command somebody remembers to
    # run. This repository has the receipts for the alternative: the proto
    # compatibility check and three suites each sat in a workflow that never
    # executed. It found both hook Jobs running with no resource requests —
    # BestEffort pods on a pre-install hook, so a namespace with a LimitRange
    # would have failed the whole release rather than degraded it.
    #
    # Whatever it finds is either fixed or written down with a reason in
    # .checkov.yaml. Nothing is skipped for being noisy.
    cmds:
      - ./scripts/checkov-config.test.sh
      - task: checkov:scan

  verify:health-token-secret:
    desc: "In production both charts read the health snapshot token from one Secret, none of it inline"
    cmds:
      - ./scripts/health-token-secret.test.sh

  verify:chart-scan:
    desc: "Policy-scan the manifests both charts render, per values file, with checkov and trivy"
    cmds:
      - CHECKOV_VERSION={{.CHECKOV_VERSION}} ./scripts/chart-scan.test.sh

  verify:brewfile:
    desc: "Fail when the Brewfile and the tools the gates reach for have drifted"
    cmds:
      - ./scripts/brewfile.test.sh

  # ═══ codegen ════════════════════════════════════════════════════════════════

  gen:
    desc: "Run codegen for the SDK stubs and both halves"
    cmds:
      - task: go-sdk-gen:proto
      - ./sdk/python/scripts/generate.sh
      - task: backend:generate
      - task: frontend:generate

  # ═══ dependency bumps ═══════════════════════════════════════════════════════

  deps:update:
    desc: "Bump both halves to the latest minor/patch (no majors)"
    cmds:
      - task: backend:go:deps:update
      - task: frontend:node:deps:update
      # deps:update bumps what the package manager installs; pnpm:pin:update
      # bumps the package manager, in both places it is pinned.
      - task: pnpm:pin:update
