version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# auth — local-development credentials.
#
#   includes:
#     auth:
#       taskfile: '{{printf .TASKLIB "auth"}}'
#       dir: .
#       vars: { JWT_ISS: acme-dev, JWT_AUD: billing-api }
#
# ── Inputs ───────────────────────────────────────────────────────────────────
# Pass these at the include's own `vars:`, not the consumer's top-level
# `vars:`. In a repository with more than one component the top level is
# shared with every other component — see README.md#variable-scoping.
#
#   JWT_SECRET        signing key         (default: an obvious dev placeholder)
#   JWT_ALG           default HS256
#   JWT_ISS/AUD/SUB   claims
#   JWT_TTL_SECONDS   default 86400
#   JWT_CLAIMS        extra claims as a JSON object   (default {})
#   STEP_FLAGS        verbatim extra flags for `step crypto jwt sign`
#
# Dev only. The default secret is deliberately a self-describing placeholder:
# a token minted here must never be accepted by anything that matters.
# ─────────────────────────────────────────────────────────────────────────────
# shell-verbatim: STEP_FLAGS

silent: true

tasks:

  mint-token:
    desc: "Mint a JWT for local development (override any JWT_* var)"
    aliases: [mint]
    vars:
      _AUTH_ALG: '{{.JWT_ALG | default "HS256"}}'
      _AUTH_SECRET: '{{.JWT_SECRET | default "dev-secret-change-me-32-bytes-min"}}'
      _AUTH_ISS: '{{.JWT_ISS | default "local-dev"}}'
      _AUTH_AUD: '{{.JWT_AUD | default "local-api"}}'
      _AUTH_SUB: '{{.JWT_SUB | default "dev-user"}}'
      _AUTH_TTL: '{{.JWT_TTL_SECONDS | default "86400"}}'
      _AUTH_CLAIMS: '{{.JWT_CLAIMS | default "{}"}}'
      STEP_FLAGS: '{{.STEP_FLAGS | default ""}}'
    preconditions:
      - sh: command -v step >/dev/null
        msg: "the smallstep CLI is not installed — https://smallstep.com/docs/step-cli/installation/"
    cmds:
      # The key goes in through a process substitution rather than an argument,
      # so it never lands in the process table.
      - cmd: |-
          set -eu
          # Checked before arithmetic: $(( )) evaluates a variable's text as an
          # expression, so anything but digits could run a command.
          ttl={{._AUTH_TTL | q}}
          case "$ttl" in
            '' | *[!0-9]*) printf '%s\n' "auth · JWT_TTL_SECONDS must be a whole number of seconds, got: $ttl" >&2; exit 1 ;;
          esac
          printf '%s' {{._AUTH_CLAIMS | q}} |
          step crypto jwt sign {{.STEP_FLAGS}} --alg {{._AUTH_ALG | q}} \
            --key <(printf '%s' {{._AUTH_SECRET | q}}) \
            --iss {{._AUTH_ISS | q}} --aud {{._AUTH_AUD | q}} --sub {{._AUTH_SUB | q}} \
            --exp $(($(date +%s) + ttl)) \
            --subtle
