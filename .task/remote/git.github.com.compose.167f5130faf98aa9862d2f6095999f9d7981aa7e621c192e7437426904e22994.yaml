version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# compose — the local dependency stack (Postgres, Redis, queues, ...).
#
#   includes:
#     compose:
#       taskfile: '{{printf .TASKLIB "compose"}}'
#       dir: .
#       vars: { COMPOSE_FILE: docker-compose.dev.yaml }
#
# `up` waits for health checks, so a task chained after it does not race the
# seeding. Everything here is idempotent: `up` on a running healthy stack is a
# no-op, and `down` on an absent one is the desired end state, not an error.
#
# ── Inputs ───────────────────────────────────────────────────────────────────
# Pass these at the include's own `vars:`, not the consumer's top-level
# `vars:`. In a repository with more than one component the top level is
# shared with every other component — see README.md#variable-scoping.
#
#   COMPOSE_FILE   default docker-compose.yaml
#   PROJECT_NAME   the label in every log line
#   SERVICE        narrow `logs` to one service
#   LOG_TAIL       backlog for `logs`                     (default 200)
#   COMPOSE_ENGINE    default "docker compose"; e.g. "podman compose"
# ─────────────────────────────────────────────────────────────────────────────
# shell-verbatim: _CMP_CMD COMPOSE_ENGINE

silent: true

vars:
  _CMP_FILE: '{{.COMPOSE_FILE | default "docker-compose.yaml"}}'
  # The engine is an input: `docker compose` is the default because it is what
  # most machines have, but the module asks nothing of it that podman does not
  # also answer, and a consumer on podman had no way to say so.
  # A command, spliced into the tasks as shell: the engine is shell by
  # contract, the file is data and is quoted here.
  _CMP_CMD: '{{.COMPOSE_ENGINE | default "docker compose"}} -f {{.COMPOSE_FILE | default "docker-compose.yaml" | q}}'
  _CMP_NAME: '{{.PROJECT_NAME | default "stack"}}'
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _CMP_RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _CMP_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'

tasks:

  up:
    desc: "Start the stack and wait until every service is healthy"
    preconditions:
      - sh: test -f {{._CMP_FILE | q}}
        msg: "{{._CMP_FILE}} not found (set COMPOSE_FILE)"
    cmds:
      - printf '%s %s · compose · up (%s)\n' "{{._CMP_RUN}}" {{._CMP_NAME | q}} {{._CMP_FILE | q}}
      - "{{._CMP_CMD}} up -d --wait"
      - task: ps
      - printf '%s %s · compose · stack healthy\n' "{{._CMP_OK}}" {{._CMP_NAME | q}}

  build:
    desc: "Rebuild the images the stack is composed of, then start it"
    preconditions:
      - sh: test -f {{._CMP_FILE | q}}
        msg: "{{._CMP_FILE}} not found (set COMPOSE_FILE)"
    cmds:
      - "{{._CMP_CMD}} up -d --build --wait"
      - printf '%s %s · compose · rebuilt and healthy\n' "{{._CMP_OK}}" {{._CMP_NAME | q}}

  down:
    desc: "Stop the stack. Volumes are preserved."
    preconditions:
      - sh: test -f {{._CMP_FILE | q}}
        msg: "{{._CMP_FILE}} not found (set COMPOSE_FILE)"
    cmds:
      - "{{._CMP_CMD}} down"
      - printf '%s %s · compose · stopped (volumes kept)\n' "{{._CMP_OK}}" {{._CMP_NAME | q}}

  reset:
    desc: "Stop the stack and DELETE its volumes — local data is lost"
    preconditions:
      - sh: test -f {{._CMP_FILE | q}}
        msg: "{{._CMP_FILE}} not found (set COMPOSE_FILE)"
    prompt: "Delete every volume of {{._CMP_FILE}}? Local database contents are lost."
    cmds:
      - "{{._CMP_CMD}} down -v"
      - printf '%s %s · compose · torn down, volumes dropped\n' "{{._CMP_OK}}" {{._CMP_NAME | q}}

  ps:
    desc: "Show what is running"
    preconditions:
      - sh: test -f {{._CMP_FILE | q}}
        msg: "{{._CMP_FILE}} not found (set COMPOSE_FILE)"
    cmds:
      - "{{._CMP_CMD}} ps"

  logs:
    desc: "Tail the stack's logs (SERVICE=... for one of them)"
    interactive: true
    preconditions:
      # Renamed from TAIL to match argocd's server:logs; refused rather than
      # ignored, so an old call does not quietly get the default backlog.
      - sh: '{{if .TAIL}}false{{else}}true{{end}}'
        msg: "TAIL is now LOG_TAIL — task compose:logs LOG_TAIL={{.TAIL}}"
      - sh: test -f {{._CMP_FILE | q}}
        msg: "{{._CMP_FILE}} not found (set COMPOSE_FILE)"
    cmds:
      - "{{._CMP_CMD}} logs -f --tail={{.LOG_TAIL | default \"200\" | q}} {{if .SERVICE}}{{.SERVICE | q}}{{end}}"
