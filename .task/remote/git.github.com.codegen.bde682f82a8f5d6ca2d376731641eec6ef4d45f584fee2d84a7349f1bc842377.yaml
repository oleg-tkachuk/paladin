version: "3"

# ─────────────────────────────────────────────────────────────────────────────
# codegen — regenerate what a Go service ships generated, and refuse a tree
# where the committed output no longer matches its source.
#
#   includes:
#     codegen: { taskfile: '{{printf .TASKLIB "codegen"}}', dir: . }
#
# ── Inputs ───────────────────────────────────────────────────────────────────
#   PROJECT_NAME      label in log lines
#   MOCKERY_CONFIG    default .mockery.yaml
#   MOCKERY_MODULE    default github.com/vektra/mockery/v3
#   BUF_TEMPLATE      one or more buf templates — a YAML list, or a
#                     space-separated string (default buf.gen.yaml)
#   BUF_INPUT         buf's input, when it is not the working directory
#   PROTO_FORBID      paths that must not exist when the stubs are generated
#   PROTO_PLUGINS     protoc plugins to install from THIS module before buf
#   PROTO_PATH        directories prepended to PATH before buf runs, for a
#                     plugin that arrives from somewhere other than a Go
#                     module — a JS one out of a pnpm tree, say. Evaluated by
#                     the shell, so `$(pnpm -C ../web bin)` works.
#   GENERATE_CMD      what `generate` runs (default `go generate ./...`)
#   BUF_FLAGS         verbatim extra flags for every buf generate
#   SQLC_FLAGS        verbatim extra sqlc flags
#   GOIMPORTS_FLAGS   verbatim extra goimports flags
#   CODEGEN_BIN_DIR   where those plugins land            (default ./bin)
#   GENERATED_DIRS    directories to normalise with goimports after generating
#   SQLC_MODULE       run sqlc through `go run <module>` instead of from PATH
#   MOCKS_PATHSPEC    git pathspec the mock gate watches   (default internal)
#   SQLC_DIR          directory the sqlc gate watches
#
# Order is fixed, not configurable: mocks first, so they are written against
# the interfaces the tree already has; buf before the generate step, so the
# protobuf types exist when generate's tools walk the tree; sqlc last, so its
# bindings see any updated proto types.
#
# Three things here are not obvious and each one cost a real debugging session
# somewhere before it was written down.
#
# GOWORK=off, for the whole file. `wire` and other generators run `go` with
# -mod=mod, which the toolchain refuses in workspace mode, and a go.work is the
# normal state of a dev checkout — so generation failed *after* mockery and buf
# had already written their output, which is the confusing part. The drift
# gates need the same setting or they disagree with the generator that produced
# the tree they are checking.
#
# Protoc plugins are installed from this module rather than taken from PATH.
# buf resolves protoc-gen-* through PATH, so whatever a developer last
# installed globally decided the output: committed stubs generated by one
# protoc-gen-go patch release show up as import churn the next time anyone
# regenerates with another. `go install` with no @version pins them to the
# module, so a local run and an image build produce the same bytes.
#
# goimports runs over the generated directories, because a pre-commit hook
# usually runs it too and the two disagree: generators emit one import grouping
# and goimports rewrites it. Left alone, the generator writes one form and the
# hook commits the other, so the drift gate reports files stale on a tree that
# was just generated — the gate failing against its own generator. Normalising
# here is what makes generation idempotent.
# ─────────────────────────────────────────────────────────────────────────────

silent: true

vars:
  _CG_NAME: '{{.PROJECT_NAME | default "codegen"}}'
  _CG_MOCK_CFG: '{{.MOCKERY_CONFIG | default ".mockery.yaml"}}'
  _CG_MOCK_MOD: '{{.MOCKERY_MODULE | default "github.com/vektra/mockery/v3"}}'
  # Accepts a YAML list or a space-separated string, and normalises to the
  # latter because `for:` splits a string on whitespace either way. A list is
  # what a reader expects for several templates; the string form is what a
  # single one looks like, and what CLI and env overrides can carry.
  _CG_BUF_TPL: >-
    {{if kindIs "slice" .BUF_TEMPLATE}}{{join " " .BUF_TEMPLATE}}
    {{- else}}{{.BUF_TEMPLATE | default "buf.gen.yaml"}}{{end}}
  _CG_BUF_PATH: '{{.PROTO_PATH | default ""}}'
  _CG_BUF_IN: '{{.BUF_INPUT | default ""}}'
  _CG_FORBID: '{{.PROTO_FORBID | default ""}}'
  _CG_PLUGINS: '{{.PROTO_PLUGINS | default ""}}'
  _CG_BIN: '{{.CODEGEN_BIN_DIR | default "./bin"}}'
  _CG_DIRS: '{{.GENERATED_DIRS | default ""}}'
  _CG_SQLC_MOD: '{{.SQLC_MODULE | default ""}}'
  _CG_MOCK_SPEC: '{{.MOCKS_PATHSPEC | default "internal"}}'
  _CG_SQLC_DIR: '{{.SQLC_DIR | default ""}}'
  _CG_GEN_CMD: '{{.GENERATE_CMD | default "go generate ./..."}}'
  _CG_BUF_FLAGS: '{{.BUF_FLAGS | default ""}}'
  _CG_SQLC_FLAGS: '{{.SQLC_FLAGS | default ""}}'
  _CG_GOIMPORTS_FLAGS: '{{.GOIMPORTS_FLAGS | default ""}}'
  # Status markers. The shape carries the meaning, so a line still reads in
  # a monochrome log; the colour sits on top and drops out under NO_COLOR.
  _CG_RUN: '{{if .NO_COLOR}}◉{{else}}{{"\x1b[36m◉\x1b[0m"}}{{end}}'
  _CG_OK: '{{if .NO_COLOR}}✔{{else}}{{"\x1b[32m✔\x1b[0m"}}{{end}}'
  _CG_ERR: '{{if .NO_COLOR}}✖{{else}}{{"\x1b[31m✖\x1b[0m"}}{{end}}'

env:
  GOWORK: '{{.GOWORK | default "off"}}'

tasks:

  # A COMPOSITE, named for the work: a fixed, ordered pipeline over sibling
  # tasks that each exist and each run on their own.
  #
  # It was `all` until this module's composite took the verb. `all` is a
  # quantifier, and the naming convention in the README asks for the plain verb
  # for the work — so `all` described how much rather than what, in the one
  # place a consumer looks first.
  #
  # NOT a selector. `regenerate select=<sibling>` would need an enumerable set of
  # interchangeable items, and here the items ARE the tasks: each carries its
  # own description and its own precondition naming the tool it needs, and a
  # selector would hide both from `--list`.
  regenerate:
    desc: "Regenerate everything this component ships generated"
    cmds:
      - printf '%s\n' "{{._CG_RUN}} {{._CG_NAME}} · gen · mocks → proto → generate → sqlc"
      - task: mocks
      - task: proto
      - task: generate
      - task: sqlc
      - printf '%s\n' "{{._CG_OK}} {{._CG_NAME}} · gen · regenerated"

  mocks:
    desc: "Regenerate the interface mocks"
    preconditions:
      - sh: test -f {{._CG_MOCK_CFG}}
        msg: "{{._CG_MOCK_CFG}} not found — set MOCKERY_CONFIG"
    cmds:
      # `go run` resolves the version from go.mod, so the generator is the one
      # the module pins rather than whatever sits on PATH. A stale mockery
      # rewrites every file in an older template, and a diff that size invites
      # hand-editing one mock instead — which is how an interface method ships
      # with no mock at all.
      - go run {{._CG_MOCK_MOD}} --config {{._CG_MOCK_CFG}}
      - task: _normalise

  proto:
    desc: "Regenerate the protobuf and RPC stubs"
    preconditions:
      - sh: command -v buf >/dev/null
        msg: "buf is not installed — https://buf.build/docs/installation/"
      - sh: 'for f in {{._CG_BUF_TPL}}; do test -f "$f" || exit 1; done'
        msg: "one of {{._CG_BUF_TPL}} is missing — check BUF_TEMPLATE"
      # A generator whose output path is relative to the working directory
      # writes a second, complete copy of the stubs when it is invoked from the
      # wrong one. That copy compiles, nothing imports it, and it rots in place.
      # Checked before generating, so it fires whether the stray copy arrived
      # just now or several commits ago — the point is to be loud, which is why
      # this is a tripwire and not a .gitignore entry.
      - sh: '{{if ._CG_FORBID}}! ls -d {{._CG_FORBID}} >/dev/null 2>&1{{else}}true{{end}}'
        msg: |-
          {{._CG_FORBID}} exists — that is a stray second copy of the generated
          stubs, written by running the generator from the wrong directory.
          Nothing imports it and it drifts out of the real tree in silence.
          Remove it and re-run.
    cmds:
      # One buf run per template. A repository that generates a second slice
      # from a different template — a vendored contract, a TypeScript client —
      # lists both here rather than keeping its own copy of this task.
      - for: { var: _CG_BUF_TPL, split: " " }
        cmd: |-
          set -eu
          {{if ._CG_PLUGINS}}
          export GOBIN="$PWD/{{._CG_BIN}}"
          export PATH="$GOBIN:$PATH"
          go install {{._CG_PLUGINS}}
          {{end}}
          {{if ._CG_BUF_PATH}}export PATH="{{._CG_BUF_PATH}}:$PATH"{{end}}
          buf generate {{._CG_BUF_FLAGS}} {{._CG_BUF_IN}} --template {{.ITEM}}
      - task: _normalise

  generate:
    desc: "Run this component's generate step (default: `go generate ./...`)"
    cmds:
      - '{{._CG_GEN_CMD}}'
      # Normalised here too, not only after mocks and proto: `wire` and its
      # kind write their output at this step, and a generator that emits one
      # import block where the commit hook writes two leaves the tree dirty on
      # a run that changed nothing.
      - task: _normalise

  sqlc:
    desc: "Regenerate the sqlc bindings"
    preconditions:
      - sh: '{{if ._CG_SQLC_MOD}}true{{else}}command -v sqlc >/dev/null{{end}}'
        msg: "sqlc is not installed — https://docs.sqlc.dev/en/latest/overview/install.html, or set SQLC_MODULE to run it through `go run`"
    cmds:
      - '{{if ._CG_SQLC_MOD}}go run {{._CG_SQLC_MOD}} generate{{else}}sqlc generate{{end}} {{._CG_SQLC_FLAGS}}'

  check:
    desc: "Fail when any committed generated output is stale"
    cmds:
      - task: mocks:check
      - task: sqlc:check

  mocks:check:
    desc: "Fail when the committed mocks are stale"
    cmds:
      - task: mocks
      # `git status`, not `git diff`: a newly added interface produces a NEW
      # file, and an uncommitted new mock is drift that a diff-only check calls
      # clean.
      - cmd: |-
          if [ -n "$(git status --porcelain -- {{._CG_MOCK_SPEC | q}})" ]; then
            printf '%s\n' "{{._CG_ERR}} {{._CG_NAME}} · gen · mocks are stale — run the generator and commit:" >&2
            git status --porcelain -- {{._CG_MOCK_SPEC | q}} >&2
            exit 1
          fi
          printf '%s\n' "{{._CG_OK}} {{._CG_NAME}} · gen · mocks match their interfaces"

  sqlc:check:
    desc: "Fail when the committed sqlc output is stale"
    preconditions:
      - sh: test -n {{._CG_SQLC_DIR | q}}
        msg: "SQLC_DIR is not set — the gate needs to know which directory holds the generated bindings"
    cmds:
      - task: sqlc
      - cmd: |-
          if ! git diff --quiet -- {{._CG_SQLC_DIR | q}}; then
            printf '%s\n' "{{._CG_ERR}} {{._CG_NAME}} · gen · sqlc output is stale — run the generator and commit:" >&2
            git --no-pager diff --stat -- {{._CG_SQLC_DIR | q}} >&2
            exit 1
          fi
          printf '%s\n' "{{._CG_OK}} {{._CG_NAME}} · gen · sqlc bindings match their queries"

  _normalise:
    internal: true
    # Optional: a component that generates nothing needing import rewriting
    # leaves GENERATED_DIRS unset and this is a no-op. goimports is likewise
    # optional — a checkout without it still generates, it just does not
    # normalise, which the drift gate will then report honestly.
    status:
      - test -z '{{._CG_DIRS}}'
    cmds:
      - cmd: |-
          if command -v goimports >/dev/null 2>&1; then
            goimports {{._CG_GOIMPORTS_FLAGS}} -w {{._CG_DIRS}}
          fi
