# Shared deploy chain reusable by every Paladin component (backend, frontend).
# Each component's Taskfile `includes:` this as `svc:` and sets:
#
#   vars:
#     PROJECT_NAME:    paladin-core      # Helm Chart name + image name
#     IMAGE_NAMESPACE: paladin                        # registry path namespace
#     DOCKERFILE:      ./deploy/Dockerfile        # relative to BUILD_CONTEXT
#     BUILD_CONTEXT:   .                           # component root (Go replace dirs / Next standalone)
#     CHART_DIR:       ./deploy/chart
#
# Image + chart share one registry: images at
# OCI_REGISTRY/IMAGE_NAMESPACE/PROJECT_NAME:VERSION, charts at
# CHART_REPO/PROJECT_NAME:VERSION (separate /charts path, no collision).
version: "3"

# OCI_REGISTRY / CHART_REPO derive from GLOBAL_REGISTRY (threaded by the
# root Taskfile's deploy / deploy-all; defaults to registry.local for a
# standalone `cd <component> && task deploy`). Single source of truth
# lives in the root Taskfile — re-point the whole stack there or with
# `GLOBAL_REGISTRY=… task deploy`.
vars:
  OCI_REGISTRY: '{{.GLOBAL_REGISTRY | default "registry.local"}}'
  CHART_REPO: 'oci://{{.GLOBAL_REGISTRY | default "registry.local"}}/charts'
  TIMEZONE: Europe/Kyiv

tasks:
  deploy:
    desc: "Build + push image + package + push Helm chart to the OCI registry"
    # silent so each step's echo is hidden — docker/helm print enough.
    # The component wrapper runs its own test/lint gate BEFORE calling
    # this (Go vs Node differ), so the shared chain stays language-agnostic.
    silent: true
    vars:
      _COMMIT: { sh: "git rev-parse --short HEAD" }
      _TIME: { sh: "TZ={{.TIMEZONE}} date +%Y-%m-%dT%H:%M:%S%z" }
      # Single version source — tasks/version.sh (resolved via git
      # toplevel so it works from any depth). SemVer-2, TS-first dev
      # pre-release so the newest push always sorts highest for ArgoCD.
      _VERSION:
        sh: bash "$(git rev-parse --show-toplevel)/tasks/version.sh"
      _IMAGE: '{{.OCI_REGISTRY}}/{{.IMAGE_NAMESPACE}}/{{.PROJECT_NAME}}'
      _CTX: '{{.BUILD_CONTEXT | default "."}}'
      # Docker gets its own context because it can differ from the helm one:
      # a component whose image needs a sibling module (see paladin-core and the
      # capability module) builds from the repo root, while its chart still
      # packages from the component dir. Defaults to BUILD_CONTEXT, so callers
      # that do not set it are unaffected.
      _DCTX: '{{.DOCKER_CONTEXT | default .BUILD_CONTEXT | default "."}}'
    cmds:
      - echo "[deploy] {{.PROJECT_NAME}} version={{._VERSION}} image={{._IMAGE}}"
      # Build the numeric version as the primary (only) tag — the chart's
      # templates default image.tag to .Chart.AppVersion (= _VERSION), so
      # the image MUST exist under that tag or Pods ImagePullBackOff. No
      # floating :latest on the registry push (LATEST_STABLE.md forbids
      # it; the orbstack/local path keeps :latest for its shared store).
      #
      # --load: required when the active buildx builder uses the
      # docker-container driver — without it the result stays in BuildKit
      # cache and `docker push` fails "tag does not exist". No-op under
      # the legacy docker driver, so the task works on any host.
      #
      # cd BUILD_CONTEXT first so DOCKERFILE + context resolve from the
      # component root.
      - cmd: |-
          cd {{._DCTX}} && docker buildx build --load \
            --network=host \
            --tag {{._IMAGE}}:{{._VERSION}} \
            --file {{.DOCKERFILE}} \
            --build-arg APP_VERSION={{._VERSION}} \
            --build-arg GIT_COMMIT_HASH={{._COMMIT}} \
            --build-arg BUILD_TIME="{{._TIME}}" \
            .
      - docker push {{._IMAGE}}:{{._VERSION}}
      # Trim the shared `lean` BuildKit cache to the keep floor after each
      # build. --keep-storage only reclaims ABOVE 8GB, so the working set
      # is never evicted — this just stops per-session cache growth from
      # filling the disk. Fast no-op when already under the floor. Run
      # `task images:gc` for an explicit reclaim after heavy sessions.
      - cmd: |-
          docker buildx prune --builder lean --keep-storage=8GB -f >/dev/null 2>&1 \
            || docker buildx prune --keep-storage=8GB -f >/dev/null 2>&1 || true
      # Helm chart — package + push under the same numeric version, then
      # drop the tarball.
      - cmd: |-
          cd {{._CTX}} && helm package {{.CHART_DIR}} \
            --version {{._VERSION}} --app-version {{._VERSION}}
      - cmd: |-
          cd {{._CTX}} && helm push {{.PROJECT_NAME}}-{{._VERSION}}.tgz {{.CHART_REPO}}
      - cmd: cd {{._CTX}} && rm -f {{.PROJECT_NAME}}-{{._VERSION}}.tgz
      - echo "[deploy] OK {{.PROJECT_NAME}} {{._VERSION}}"

  # ─── k8s convenience ─────────────────────────────────────────────────────

  k8s:logs:
    desc: "Tail pod logs in the paladin namespace for this component"
    cmds:
      - echo "{{.PROJECT_NAME}} k8s-logs ctx={{.K8S_CONTEXT}} ns={{.K8S_NAMESPACE | default "paladin"}}"
      - kubectl --context {{.K8S_CONTEXT}} logs -n {{.K8S_NAMESPACE | default "paladin"}} -l app.kubernetes.io/name={{.PROJECT_NAME}} -f --tail=100

  k8s:restart:
    desc: "Roll the Deployment (force pod recycle without redeploy)"
    cmds:
      - echo "{{.PROJECT_NAME}} k8s-restart ctx={{.K8S_CONTEXT}} ns={{.K8S_NAMESPACE | default "paladin"}}"
      - kubectl --context {{.K8S_CONTEXT}} rollout restart deploy -n {{.K8S_NAMESPACE | default "paladin"}} -l app.kubernetes.io/name={{.PROJECT_NAME}}
      - kubectl --context {{.K8S_CONTEXT}} rollout status deploy -n {{.K8S_NAMESPACE | default "paladin"}} -l app.kubernetes.io/name={{.PROJECT_NAME}}
