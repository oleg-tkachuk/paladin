# lefthook.yml
# Git hooks for paladin — the backend planes and the operator console.
#
# The shape is the same in every repository here: cheap, staged-scoped checks
# on commit; anything slow, Docker-shaped or repo-wide on push; the commit
# message gate last. Bypass in an emergency with `git commit -n`, then fix
# what it would have caught.

# Fail loudly when the hooks are not actually installed, rather than passing
# every commit silently because nobody ran `lefthook install`.
assert_lefthook_installed: true

# lefthook 2.x styles output through charm's colorprofile, which probes the
# terminal (OSC 11 + DA) for color support; on capable terminals that probe's
# reply leaks into the console as garbage. Keep it on only where it behaves.
colors: true

output:
  # Drop lefthook's own meta and summary banners; keep command output so a
  # failure still arrives with its stderr intact.
  - execution
  - execution_info
  - execution_out
  - failure

pre-commit:
  parallel: true
  jobs:
    # ─── Repo-wide ──────────────────────────────────────────────────

    # Compiled artefacts do not belong in the history: they bloat every clone
    # forever and no review can read them.
    - name: forbid-binaries
      tags: [security, hygiene]
      run: |
        set -euo pipefail
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file -b "$f" | grep -qE '(^| )ELF( |$)|(^| )Mach-O( |$)'; then
            echo "ERROR: compiled binary detected: $f" >&2
            exit 1
          fi
        done

    # A secret reaches the remote once and is burned; catching it here is the
    # only cheap moment. A scan that skips itself when the tool is missing is
    # not a scan, so this says what to install instead of waving the commit on.
    - name: gitleaks
      tags: [security]
      run: |
        set -euo pipefail
        command -v gitleaks >/dev/null 2>&1 || {
          echo "ERROR: gitleaks is not installed — brew install gitleaks" >&2
          exit 1
        }
        gitleaks protect --staged --redact --verbose=true

    # ─── Backend (Go) ───────────────────────────────────────────────

    - name: backend-sqlc
      root: backend/
      tags: [go, sqlc]
      # Repo-relative, like every glob here that starts with literal text —
      # see the note on backend-chart-verify. A pattern is matched against
      # the path git reports, and only a leading wildcard can absorb the
      # `backend/` in front of it, which is why `*.go` above needs no prefix
      # and this needed one to match anything at all.
      glob: "backend/{sqlc.yaml,sqlc.yml,sqlc.json,internal/store/postgres/queries/*.sql}"
      run: |
        set -euo pipefail
        command -v sqlc >/dev/null 2>&1 || exit 0
        sqlc generate
        # Scoped to sqlc's own output (`out:` in sqlc.yaml). A bare
        # `git diff --quiet` answers "is the worktree clean", which is a
        # different question and a false alarm on any partially staged
        # commit — harmless only while this job was unreachable.
        if ! git diff --quiet -- internal/store/postgres/sqlc; then
          echo "ERROR: sqlc generated files are out of date. Run 'task gen:all' and commit."
          exit 1
        fi

    - name: backend-gofmt
      root: backend/
      tags: [go, fmt]
      glob: "*.go"
      run: gofmt -w {staged_files} && git add {staged_files}

    - name: backend-goimports
      root: backend/
      tags: [go, fmt]
      glob: "*.go"
      run: |
        if command -v goimports >/dev/null 2>&1; then
          goimports -w {staged_files} && git add {staged_files}
        fi

    - name: backend-govet
      root: backend/
      tags: [go, lint]
      glob: "*.go"
      run: go vet ./...

    - name: backend-buf-lint
      root: backend/
      tags: [proto, lint]
      glob: "backend/proto/**/*.proto"
      run: |
        if command -v buf >/dev/null 2>&1; then
          buf lint proto
        fi

    # ─── Frontend (Next.js / TS) ────────────────────────────────────

    - name: frontend-eslint
      root: frontend/
      tags: [ui, lint]
      glob: "*.{js,jsx,ts,tsx}"
      run: npx eslint {staged_files}

    - name: frontend-prettier
      root: frontend/
      tags: [ui, fmt]
      glob: "*.{js,jsx,ts,tsx,css,scss,json,md}"
      run: npx prettier --write {staged_files} && git add {staged_files}

pre-push:
  parallel: true
  jobs:
    - name: backend-test
      root: backend/
      tags: [go, test]
      run: go test ./... -count=1

    # Curated golangci set (see backend/.golangci.yaml). Skipped if the
    # binary isn't installed locally so a fresh clone can still push; CI
    # always runs it pinned.
    - name: backend-golangci
      root: backend/
      tags: [go, lint]
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run ./...
        else
          echo "golangci-lint not installed; skipping (CI enforces it)"
        fi

    # Gate against the multi-doc YAML separator bug — `{{- ... -}}`
    # whitespace strip can collapse the newline before `---`, gluing
    # the separator onto the previous line and silently dropping
    # every resource after the first one. Runs only when chart files
    # change so non-chart pushes don't pay the helm-template cost.
    #
    # The glob is repo-relative even though `root` is set: `root` only
    # picks the working directory, and a pattern containing a slash is
    # matched against the path git reports. A `deploy/chart/**/*` here
    # matches nothing, which is how this job sat dead — pointing at a
    # task name that does not exist — without anyone's push going red.
    # (Patterns with no slash, like the `*.go` jobs above, match on the
    # basename and are unaffected.)
    - name: backend-chart-verify
      root: backend/
      tags: [chart, lint]
      glob: "backend/deploy/chart/**/*"
      run: task release:chart:verify

    - name: frontend-chart-verify
      root: frontend/
      tags: [chart, lint]
      glob: "frontend/deploy/chart/**/*"
      run: task release:chart:verify

    - name: frontend-tsc
      root: frontend/
      tags: [ui, typecheck]
      run: npx tsc --noEmit

commit-msg:
  jobs:
    - name: conventional-commits
      # {1} is lefthook's template for the hook's first argument — the path to
      # the message file git is about to use. A bare `$1` is NOT set inside a
      # `run:` block, so the fallback would otherwise check the wrong file
      # whenever the hook is invoked with an explicit path.
      run: |
        set -euo pipefail
        file="{1}"
        [ -f "$file" ] || file="$(git rev-parse --git-path COMMIT_EDITMSG 2>/dev/null || true)"
        [ -f "$file" ] || exit 0

        first_line="$(head -n1 "$file" | tr -d '\r')"
        # Merges and reverts are generated by git, not written by a person.
        echo "$first_line" | grep -Eq '^(Merge|Revert)\b' && exit 0

        cc_re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
        if ! echo "$first_line" | grep -Eq "$cc_re"; then
          echo "ERROR: invalid commit message format (Conventional Commits required)." >&2
          echo "Format: <type>(<scope>)!: <subject>" >&2
          echo "See:    https://www.conventionalcommits.org/en/v1.0.0/" >&2
          exit 1
        fi
