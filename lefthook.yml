# lefthook.yml
# Standardized Go Git hooks runner configuration.

skip_output:
  meta: true
  summary: true

pre-commit:
  skip_save: true
  parallel: true
  commands:
    # 1) Block real compiled binaries
    forbid-binaries:
      tags: [security, hygiene]
      run: |
        set -euo pipefail
        # Only check staged files
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file -b "$f" | grep -qE '(^| )ELF( |$)|(^| )Mach-O( |$)'; then
            echo "ERROR: Compiled binary detected: $f"
            exit 1
          fi
        done

    # 2) Prevent committing secrets
    gitleaks:
      tags: [security]
      run: gitleaks protect --staged --redact --verbose=true

    # 3) SQLC generation (if changes in sqlc configs or sql files)
    sqlc:
      tags: [go, sqlc]
      glob: "{sqlc.yaml,sqlc.yml,sqlc.json,**/query/*.sql,**/schema/*.sql}"
      run: |
        set -euo pipefail
        command -v sqlc >/dev/null 2>&1 || exit 0
        sqlc generate
        if ! git diff --quiet; then
          echo "ERROR: sqlc generated files are out of date. Run 'sqlc generate' and commit."
          exit 1
        fi

    # 4) Formatting and Imports
    gofmt:
      tags: [go, fmt]
      glob: "*.go"
      run: gofmt -w {staged_files} && git add {staged_files}

    goimports:
      tags: [go, fmt]
      glob: "*.go"
      run: |
        if command -v goimports >/dev/null 2>&1; then
          goimports -w {staged_files} && git add {staged_files}
        fi

    # 5) Static Analysis
    govet:
      tags: [go, lint]
      run: go vet ./...

    # 6) Buf Lint (if proto changes)
    buf-lint:
      tags: [proto, lint]
      glob: "*.proto"
      run: |
        if [ -f "buf.yaml" ] && command -v buf >/dev/null 2>&1; then
          buf lint
        fi

pre-push:
  parallel: true
  commands:
    gotest:
      tags: [go, test]
      run: go test ./... -count=1

commit-msg:
  commands:
    conventional-commits:
      run: |
        set -euo pipefail
        file="${1:-}"
        [ -z "$file" ] && file="$(git rev-parse --git-path COMMIT_EDITMSG 2>/dev/null || true)"
        [ -f "$file" ] || exit 0

        first_line="$(head -n1 "$file" | tr -d '\r')"
        # Allow merge/revert
        echo "$first_line" | grep -Eq '^(Merge|Revert)\b' && exit 0
        
        # CC Regex
        cc_re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
        if ! echo "$first_line" | grep -Eq "$cc_re"; then
          echo "ERROR: Invalid commit message format (Conventional Commits required)."
          echo "Format: <type>(<scope>)!: <subject>"
          exit 1
        fi
