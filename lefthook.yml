# Repo-root lefthook config. Both backend/ and frontend/ hooks live here
# so a single `lefthook install` from the repo root wires them up.
#
# Per-command `root:` is the lefthook idiom for monorepos: lefthook
# chdir-s into that directory before running the command, and the
# `glob:` filter is matched relative to the command's root. So a
# pure-frontend change never triggers a Go hook and vice versa.
#
# Cross-cutting hygiene (trailing whitespace, JSON validity, secret
# scanning) lives in .pre-commit-config.yaml, not here, so the two
# tools stay focused: pre-commit = format / hygiene, lefthook = build
# / lint / type-check / commit-msg.

output:
  # Suppress lefthook's own meta + summary banners; keep command
  # output (so failures still surface their stderr in full).
  - execution
  - execution_info
  - execution_out
  - failure

pre-commit:
  parallel: true
  commands:
    # ─── Repo-wide ──────────────────────────────────────────────────

    # Block accidental commits of compiled binaries (ELF / Mach-O).
    # Cheap byte-test, runs on every staged file regardless of half.
    forbid-binaries:
      tags: [security, hygiene]
      run: |
        set -euo pipefail
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file -b "$f" | grep -qE '(^| )ELF( |$)|(^| )Mach-O( |$)'; then
            echo "ERROR: Compiled binary detected: $f"
            exit 1
          fi
        done

    # Secret scanning runs once at repo root so .gitleaks.toml lives
    # alongside it (allowlist paths are repo-relative).
    gitleaks:
      tags: [security]
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --redact --verbose=true
        fi

    # ─── Backend (Go) ───────────────────────────────────────────────

    backend-sqlc:
      root: backend/
      tags: [go, sqlc]
      glob: "{sqlc.yaml,sqlc.yml,sqlc.json,internal/store/postgres/queries/*.sql}"
      run: |
        set -euo pipefail
        command -v sqlc >/dev/null 2>&1 || exit 0
        sqlc generate
        if ! git diff --quiet; then
          echo "ERROR: sqlc generated files are out of date. Run 'task gen:all' and commit."
          exit 1
        fi

    backend-gofmt:
      root: backend/
      tags: [go, fmt]
      glob: "*.go"
      run: gofmt -w {staged_files} && git add {staged_files}

    backend-goimports:
      root: backend/
      tags: [go, fmt]
      glob: "*.go"
      run: |
        if command -v goimports >/dev/null 2>&1; then
          goimports -w {staged_files} && git add {staged_files}
        fi

    backend-govet:
      root: backend/
      tags: [go, lint]
      glob: "*.go"
      run: go vet ./...

    backend-buf-lint:
      root: backend/
      tags: [proto, lint]
      glob: "proto/**/*.proto"
      run: |
        if command -v buf >/dev/null 2>&1; then
          buf lint
        fi

    # ─── Frontend (Next.js / TS) ────────────────────────────────────

    frontend-eslint:
      root: frontend/
      tags: [ui, lint]
      glob: "*.{js,jsx,ts,tsx}"
      run: npx eslint {staged_files}

    frontend-prettier:
      root: frontend/
      tags: [ui, fmt]
      glob: "*.{js,jsx,ts,tsx,css,scss,json,md}"
      run: npx prettier --write {staged_files} && git add {staged_files}

pre-push:
  parallel: true
  commands:
    backend-test:
      root: backend/
      tags: [go, test]
      run: go test ./... -count=1

    # Curated golangci set (see backend/.golangci.yaml). Skipped if the
    # binary isn't installed locally so a fresh clone can still push; CI
    # always runs it pinned.
    backend-golangci:
      root: backend/
      tags: [go, lint]
      run: |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run ./...
        else
          echo "golangci-lint not installed; skipping (CI enforces it)"
        fi

    # Gate against the multi-doc YAML separator bug — `{{- ... -}}`
    # whitespace strip can collapse the newline before `---`, gluing
    # the separator onto the previous line and silently dropping
    # every resource after the first one. Runs only when chart files
    # change so non-chart pushes don't pay the helm-template cost.
    backend-chart-verify:
      root: backend/
      tags: [chart, lint]
      glob: "deploy/chart/**/*"
      run: task chart:verify

    frontend-tsc:
      root: frontend/
      tags: [ui, typecheck]
      run: npx tsc --noEmit

commit-msg:
  commands:
    conventional-commits:
      run: |
        set -euo pipefail
        file="${1:-}"
        [ -z "$file" ] && file="$(git rev-parse --git-path COMMIT_EDITMSG 2>/dev/null || true)"
        [ -f "$file" ] || exit 0

        first_line="$(head -n1 "$file" | tr -d '\r')"
        # Allow merge / revert auto-generated subjects.
        echo "$first_line" | grep -Eq '^(Merge|Revert)\b' && exit 0

        # Conventional Commits: <type>(<scope>)!: <subject>
        cc_re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
        if ! echo "$first_line" | grep -Eq "$cc_re"; then
          echo "ERROR: Invalid commit message format (Conventional Commits required)."
          echo "Format: <type>(<scope>)!: <subject>"
          exit 1
        fi
