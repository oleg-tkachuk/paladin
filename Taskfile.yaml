# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Paladin — operating the stack.
#
#   task                 the commands below
#   task stack:up        every plane + Postgres + SeaweedFS + console, in compose
#
# Three entry points, split by who runs the command:
#
#   Taskfile.yaml        operating the stack; targets the published registry
#   Taskfile.local.yaml  publishing to the host-only registry.local and syncing
#                        the local ArgoCD apps
#   Taskfile.dev.yaml    the gates, codegen and dependency bumps
#
# Publishing to GHCR is not a command here: .github/workflows/release.yaml does
# it for every release tag, multi-arch. The registry defaults below are the
# same target, so a component task run from this file reads what CI published.
#
# WHY SEPARATE FILES. `task` with no arguments is the list somebody reads to
# find a command, and this one used to run `--list-all`: 165 lines, nearly all
# of them a library verb on one of the two components. Hiding them is not an
# option — Task's `internal: true` removes a task from the list AND from the
# command line, so a hidden task cannot be called at all. Separate entry points
# are the mechanism Task offers.
#
# No entry point includes a component's Taskfile: `backend:*` and `frontend:*`
# start `task` in the component's directory, for the reason given above those
# tasks. They are duplicated into the other entry points, and
# `task -t Taskfile.dev.yaml verify:taskfile-drift` fails when the copies stop
# agreeing.

silent: true

vars:
  # Where release.yaml publishes: ghcr.io/<IMAGE_NAMESPACE>/<component> for the
  # image, oci://ghcr.io/<IMAGE_NAMESPACE>/charts/<component> for the chart.
  # Must match image.repository in both charts' values.yaml;
  # `verify:publish-target` fails when they part.
  GLOBAL_REGISTRY: '{{.GLOBAL_REGISTRY | default "ghcr.io"}}'
  IMAGE_NAMESPACE: '{{.IMAGE_NAMESPACE | default "oleg-tkachuk"}}'
  # Kube context every kubectl/helm task targets. Defaults to the local
  # OrbStack cluster; both components redeclare the same default so a
  # standalone `cd backend && task …` behaves identically.
  K8S_CONTEXT: '{{.K8S_CONTEXT | default "orbstack"}}'
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  # Working on the library itself: point this at a checkout beside the
  # repository instead, keeping the %s:
  #   TASKLIB: '../taskfiles/%s'
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v14.11.2'

includes:
  # ─── local stack ───────────────────────────────────────────────────────────
  # The integrated compose stack. backend's compose file is the single source
  # of truth — it builds the backend services and mounts the frontend as the
  # console container, with a build context resolving to ../../frontend.
  #
  # Here rather than in the dev file because `task stack:up` is the README's
  # first command: clone the repository and run the thing. That is the one
  # audience neither of the other files is about, and it reaches for `task`.
  stack:
    taskfile: '{{printf .TASKLIB "compose"}}'
    dir: .
    vars: { COMPOSE_FILE: ./backend/deploy/docker-compose.yaml, PROJECT_NAME: paladin }

tasks:
  # ─── components ────────────────────────────────────────────────────────────
  # `task backend:<task>` runs `task <task>` in backend/ as a child process,
  # and the same for frontend. A process of its own is what keeps a
  # component's variables its own: included by path, both components' top-level
  # `vars:` land in one pool, and a library module then read PROJECT_NAME,
  # DOCKER_CONTEXT or the helm flags of the other component in a share of its
  # runs.
  #
  # DUPLICATED into Taskfile.local.yaml and Taskfile.dev.yaml, deliberately,
  # and guarded. Keep these three tasks byte-identical; `verify:taskfile-drift`
  # is what notices.
  #
  # A variable set on the command line stops at this process. The four named
  # in _component are handed on; any other goes in front of the command
  # (`NAME=value task backend:…`) or after `cd` into the component.
  _component:
    internal: true
    dir: "{{.COMPONENT}}"
    requires: { vars: [COMPONENT, TARGET] }
    # Assigned on the command rather than through `env:`, which does not
    # replace a variable the calling shell already exports.
    cmd: >-
      GLOBAL_REGISTRY={{.GLOBAL_REGISTRY | q}}
      IMAGE_NAMESPACE={{.IMAGE_NAMESPACE | q}}
      K8S_CONTEXT={{.K8S_CONTEXT | q}}
      {{if .APP_VERSION}}APP_VERSION={{.APP_VERSION | q}}{{end}}
      task {{.TARGET | q}} -- {{.CLI_ARGS}}

  "backend:*":
    desc: "Run a task of backend/ (task backend:default lists them)"
    cmds: [{ task: _component, vars: { COMPONENT: backend, TARGET: "{{index .MATCH 0}}" } }]
  "frontend:*":
    desc: "Run a task of frontend/ (task frontend:default lists them)"
    cmds: [{ task: _component, vars: { COMPONENT: frontend, TARGET: "{{index .MATCH 0}}" } }]

  default:
    desc: "The commands for operating the stack"
    # Written out rather than `task --list`: that names `backend:*` and
    # `frontend:*` once each, not the tasks behind them, and a component's own
    # list is a reference, not a front door. Both are reachable below.
    cmds:
      - cmd: |
          printf '%s\n' \
            "Paladin — operating the stack" \
            "" \
            "  task stack:up                      the whole stack in compose, locally" \
            "  task stack:down                    stop it, keep the volumes" \
            "  task backend:k8s:status            what is running" \
            "  task frontend:k8s:status" \
            "  task backend:k8s:logs              follow its logs" \
            "  task frontend:k8s:logs" \
            "" \
            "  task --list                        every task of this entry point" \
            "  task backend:default               every task of the backend" \
            "  task frontend:default              every task of the console" \
            "  task -t Taskfile.local.yaml        publish to registry.local, sync the ArgoCD apps" \
            "  task -t Taskfile.dev.yaml          gates, codegen and dependency bumps"
