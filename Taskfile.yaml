version: "3"

silent: true

vars:
  PROJECT_NAME: paladin
  COMPOSE_FILE: ./deploy/docker-compose.yaml
  DEPLOY_INFO_ENV_FILE: ./deploy/info.env
  DOCKERFILE: ./deploy/Dockerfile
  CHART_DIR: ./deploy/chart
  TIMEZONE: Europe/Kyiv
  K8S_NAMESPACE: paladin
  K8S_DEPLOYMENT_NAME: paladin

  # OCI Registry
  OCI_REGISTRY: "registry.local"
  CHART_REPO: "oci://registry.local/charts"

includes:
  core:
    taskfile: tasks/_core.task.yaml
    vars: { ROOT: "{{.USER_WORKING_DIR}}" }
    dir: .
  docker:
    taskfile: tasks/docker.task.yaml
    vars: { ROOT: "{{.USER_WORKING_DIR}}" }
    dir: .
  test:
    taskfile: tasks/test.task.yaml
    vars: { ROOT: "{{.USER_WORKING_DIR}}" }
    dir: .
  gen:
    taskfile: tasks/gen.task.yaml
    vars: { ROOT: "{{.USER_WORKING_DIR}}" }
    dir: .
  k8s:
    taskfile: tasks/k8s.task.yaml
    vars: { ROOT: "{{.USER_WORKING_DIR}}" }
    dir: .

tasks:
  default:
    desc: "Lists tasks with or without a description"
    cmds:
      - task -a

  build:
    desc: "Build and push image + Helm chart to OCI registry"
    cmds:
      - task: build:version:bump
      - task: build:env:write
      - task: docker:build

  build-local:
    desc: "Build directly in Minikube Docker daemon (Zero-push flow)"
    cmds:
      - task: build:version:bump
      - task: build:env:write
      - task: docker:build-local

  build:version:bump:
    desc: "Auto-increment VERSION (patch)"
    internal: true
    silent: true
    cmds:
      - cmd: |-
          set -euo pipefail
          if [ ! -f {{.DEPLOY_INFO_ENV_FILE}} ]; then mkdir -p $(dirname {{.DEPLOY_INFO_ENV_FILE}}) && touch {{.DEPLOY_INFO_ENV_FILE}}; fi
          check_version=$(grep "APP_VERSION=" {{.DEPLOY_INFO_ENV_FILE}} | cut -d'=' -f2 || echo "0.1.0")
          if [ -z "$check_version" ]; then check_version="0.1.0"; fi
          next_version="$(printf "%s" "$check_version" | awk -F. -v OFS=. '{$NF += 1 ; print}')"
          if grep -q "APP_VERSION=" {{.DEPLOY_INFO_ENV_FILE}}; then
            sed -i '' "s/APP_VERSION=.*/APP_VERSION=$next_version/" {{.DEPLOY_INFO_ENV_FILE}}
          else
            echo "APP_VERSION=$next_version" >> {{.DEPLOY_INFO_ENV_FILE}}
          fi
          printf "INFO: %s: Bumped version from %s to %s\n" "{{.K8S_DEPLOYMENT_NAME}}" "$check_version" "$next_version"

  build:env:write:
    desc: "Write build metadata to env file"
    internal: true
    silent: true
    cmds:
      - cmd: |-
          set -euo pipefail
          printf "INFO: %s: Writing build metadata to env file...\n" "{{.K8S_DEPLOYMENT_NAME}}"
          next_version=$(grep "APP_VERSION=" {{.DEPLOY_INFO_ENV_FILE}} | cut -d'=' -f2)
          {
            printf "GIT_COMMIT_HASH=%s\n" "$(git rev-parse --short HEAD)"
            printf "BUILD_TIME=%s\n" "$(TZ={{.TIMEZONE}} date +%Y-%m-%dT%H:%M:%S%z)"
            printf "APP_VERSION=%s\n" "$next_version"
          } > {{.DEPLOY_INFO_ENV_FILE}}

  up:
    desc: "Start the local stack"
    cmds:
      - task: docker:up

  test:
    desc: "Run unit tests"
    cmds:
      - task: test:unit

  generate:
    desc: "Generate all code (Proto, Mocks, SQLC)"
    cmds:
      - task: gen:all

  auth:mint-token:
    desc: "Mint HS256 JWT for local dev (override JWT_SECRET/JWT_ISS/JWT_AUD/JWT_SUB/JWT_TTL_SECONDS)"
    vars:
      JWT_SECRET: "dev-secret-change-me-32-bytes-min"
      JWT_ISS: "paladin-dev"
      JWT_AUD: "paladin-api"
      JWT_SUB: "dev-user"
      JWT_TTL_SECONDS: "86400"
    cmds:
      - cmd: |-
          set -euo pipefail
          step crypto jwt sign \
            --alg HS256 \
            --key <(printf '%s' "{{.JWT_SECRET}}") \
            --iss "{{.JWT_ISS}}" \
            --aud "{{.JWT_AUD}}" \
            --sub "{{.JWT_SUB}}" \
            --exp $(($(date +%s) + {{.JWT_TTL_SECONDS}})) \
            --subtle

  # -------------------------
  # Legacy Aliases / Utility
  # -------------------------

  restart:
    desc: "Alias for k8s:restart"
    cmds:
      - task: k8s:restart
