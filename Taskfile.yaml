version: "3"

# Top-level orchestrator for the integrated repo. The two project-
# specific Taskfiles live at backend/Taskfile.yaml and
# frontend/Taskfile.yaml; this file delegates to them via the
# `backend:*` and `frontend:*` namespaces, plus exposes the repo-level
# deploy fan-out, compose orchestration, and dependency bumps.
#
# Naming convention:
#   backend:<task>       runs in backend/, forwards to its Taskfile
#   frontend:<task>      runs in frontend/, forwards to its Taskfile
#   deploy[:component]   build+push image+chart to GLOBAL_REGISTRY
#   <bare-name>          repo-level (verify-all, e2e-*, deps:update)
#
# Usage:
#   task                       # list every task across the namespace
#   task verify-all            # build + test both halves
#   task deploy                # push both components to the registry
#   task deploy:backend        # push one
#   task deploy-all ONLY=backend
#   task backend:test          # forwards to backend's task test

silent: true

vars:
  ROOT: "{{.USER_WORKING_DIR}}"
  # Single source of truth for the OCI registry hostname. Every deploy /
  # publish task derives its image prefix + chart repo from this and is
  # passed it explicitly, so re-pointing the whole stack at another
  # registry is a one-line override here (or `GLOBAL_REGISTRY=… task …`).
  # Both components' deploy chains read it via tasks/_service.task.yaml.
  GLOBAL_REGISTRY: '{{.GLOBAL_REGISTRY | default "registry.local"}}'
  # Kube context every kubectl / helm task targets. Defaults to the local
  # OrbStack cluster; override with `K8S_CONTEXT=<ctx> task …`. The
  # backend/frontend includes redeclare it so a standalone `cd backend &&
  # task …` resolves the same default.
  K8S_CONTEXT: '{{.K8S_CONTEXT | default "orbstack"}}'

includes:
  backend:
    taskfile: backend/Taskfile.yaml
    dir: backend
  frontend:
    taskfile: frontend/Taskfile.yaml
    dir: frontend
  meta:
    taskfile: tasks/meta.task.yaml
    dir: .

tasks:
  default:
    desc: List the cross-project task index.
    cmds:
      - task --list-all

  verify-all:
    desc: Test + lint + build both halves. CI's default green-bar gate.
    cmds:
      - task: backend:test
      # Seconds, no Docker: the tagged suites are excluded from `go test ./...`
      # by their build tag, so this is the only thing in the local gate that
      # can notice one has stopped compiling. Both of them had.
      - task: backend:test:tagged:compile
      - task: backend:test:lint
      # The frontend's own unit tests. Their absence here is how a breaking
      # API change reached a green gate: the token resource-name conversion
      # rewrote the m2m page's contract, `verify-all` passed, and three vitest
      # specs had been failing since — nothing in the local gate ran them.
      # Lint and build do not exercise assertions.
      - task: frontend:node:test
      - task: frontend:lint
      # Cheap, and it catches a divergence that would otherwise surface as an
      # image built with a different pnpm than CI and local dev used.
      - task: deps:check:pnpm
      # Seconds, no Docker, and the only thing standing between a field rename
      # and every JSON client of this API. It has lived in
      # .github/workflows/test.yml since it was written and has never executed
      # there, which is how forty-five breaking changes accumulated in four
      # days once already.
      - ./backend/scripts/proto-breaking.sh
      # Seconds, no Docker. Two files have to agree about six port numbers —
      # scripts/stack-ports.sh and the compose file — and nothing else would
      # notice them drifting apart until a gate booted on top of whatever was
      # already listening.
      - ./scripts/stack-ports.test.sh
      - task: frontend:node:build

  verify-deep:
    desc: The gates verify-all deliberately cannot run — Postgres-backed integration suites plus everything that needs a live stack.
    # verify-all is the pre-commit gate and has to stay in the tens of
    # seconds, so it runs no Docker and boots no stack. That is a defensible
    # trade and it is also how three suites rotted unnoticed: they were left
    # to `.github/workflows/{integration,e2e}.yml`, and Actions has not
    # executed a step here since it began refusing jobs on billing grounds.
    #
    # This is the other half — the slow gate, ~15 minutes and a Docker
    # daemon, run before a merge rather than before a commit. Nothing in it
    # is new work; it is the set of suites that already existed and had no
    # way to be run.
    cmds:
      # Disk FIRST, before anything consumes any.
      #
      # This check used to live inside verify-stack.sh, which runs after the
      # image build and after the integration suite — so it measured at the
      # worst moment in the gate rather than a representative one. On its
      # first real run it read 9GiB, refused, and the machine settled at 14GiB
      # a few minutes later once testcontainers finished cleaning up: a true
      # reading of a transient, which is a false alarm all the same.
      #
      # Here it reads a steady state and, more to the point, refusing here
      # actually prevents the consumption instead of reporting it afterwards.
      - ./scripts/require-disk.sh "task verify-deep"
      # Testcontainers, not the compose stack — these bring their own
      # Postgres and are independent of everything below.
      - task: backend:test:integration
      - task: backend:test:stack

  verify-e2e:
    desc: Playwright suite against a stack built from this branch (needs Docker, ~10 min).
    # Separate from verify-deep on purpose. This one needs the console image and
    # a browser; verify-deep boots `api admin` only and never opens one. Keeping
    # them apart is what lets the backend gate stay runnable without a frontend
    # build — and, since the compose stack is now isolatable, lets the two run
    # side by side on different port sets.
    #
    # Both images, because the stack runs `:latest` and compose rebuilds
    # nothing: a Playwright run against yesterday's console is the failure this
    # repository has already had, twice.
    cmds:
      # Same reasoning as verify-deep: before the image builds, not after.
      - ./scripts/require-disk.sh "task verify-e2e"
      - task: backend:docker:build-local
      - task: frontend:docker:build-local
      - frontend/scripts/verify-e2e.sh

  # another-service-style aggregate fan-outs over the real per-component tasks.
  test:
    desc: Run unit tests for both halves (Go + Vitest).
    cmds:
      - task: backend:test
      - task: frontend:node:test

  lint:
    desc: Lint both halves (golangci-lint + eslint).
    cmds:
      - task: backend:test:lint
      - task: frontend:lint

  gen:
    desc: Run codegen for both halves (proto/sqlc/mocks + Connect stubs).
    cmds:
      - task: backend:generate
      - task: frontend:generate

  # ─── disk reclaim ─────────────────────────────────────────────────────────
  images:gc:
    desc: "Reclaim BuildKit + docker disk (run after heavy build bursts)"
    vars:
      BUILDER: '{{.BUILDER | default "lean"}}'
      KEEP_STORAGE: '{{.KEEP_STORAGE | default "8GB"}}'
    cmds:
      # The shared `lean` buildx builder (docker-container driver) keeps a
      # SEPARATE cache that `docker builder prune` does NOT touch. A long
      # build session can outpace BuildKit's idle GC and balloon it to
      # tens of GB → host/OrbStack disk fills (we hit exactly this during
      # the deploy work). Prune it explicitly to the keep floor
      # (--keep-storage only trims ABOVE the floor, so the working set
      # survives), then drop dangling images. Falls back to the active
      # builder when `lean` is absent.
      - cmd: |-
          set -euo pipefail
          echo ">>> [images] pruning builder '{{.BUILDER}}' cache to {{.KEEP_STORAGE}}"
          docker buildx prune --builder "{{.BUILDER}}" --keep-storage="{{.KEEP_STORAGE}}" -f 2>/dev/null || \
            docker buildx prune --keep-storage="{{.KEEP_STORAGE}}" -f
          docker image prune -af >/dev/null 2>&1 || true
          docker system df 2>/dev/null | head -5 || true

  # ─── deploy — fan-out to per-component `task deploy` ──────────────────────
  # Each component's `task deploy` (backend/, frontend/) owns its own
  # test/lint gate, then runs the shared image+chart push chain
  # (tasks/_service.task.yaml) against GLOBAL_REGISTRY. The registry is
  # the only deploy target — stack-independent (minikube / OrbStack / k3d
  # all pull from it); the no-registry OrbStack path is `task
  # backend:deploy-orbstack`.

  deploy:
    desc: "Deploy BOTH components (image + chart) to GLOBAL_REGISTRY"
    deps:
      - deploy:backend
      - deploy:frontend

  deploy:backend:
    desc: "Deploy backend (image + chart) to GLOBAL_REGISTRY"
    cmds:
      - task: _component:deploy
        vars: { DIR: backend }

  deploy:frontend:
    desc: "Deploy frontend UI (image + chart) to GLOBAL_REGISTRY"
    cmds:
      - task: _component:deploy
        vars: { DIR: frontend }

  _component:deploy:
    internal: true
    cmds:
      - cmd: |-
          set -eu
          [ -n "{{.DIR}}" ] || { echo "_component:deploy: DIR is required" >&2; exit 1; }
          cd "{{.DIR}}" && task deploy GLOBAL_REGISTRY={{.GLOBAL_REGISTRY}}

  deploy-all:
    silent: true
    desc: |-
      Build + push every component's image + Helm chart to GLOBAL_REGISTRY
      (default registry.local), failing fast on the first failure so the
      operator can fix it and resume with SKIP=.

      Usage:
        task deploy-all                       # all components
        task deploy-all ONLY=backend          # just one
        task deploy-all SKIP=frontend
        task deploy-all GLOBAL_REGISTRY=registry.example.com   # re-point

      The registry must be reachable on :443 — checked up front so a
      misconfig fails in seconds, not after a half-finished push.
    vars:
      COMPONENTS: |-
        backend
        frontend
    cmds:
      - cmd: |-
          set -u
          # Registry preflight — fail fast with an actionable message
          # rather than a cascade of push errors. 200/401/403 all mean
          # "registry answered"; anything else (or curl failure) is down.
          code=$(curl -sk -o /dev/null -w '%{http_code}' "https://{{.GLOBAL_REGISTRY}}/v2/" 2>/dev/null || echo 000)
          case "$code" in
            200|401|403) ;;
            *)
              echo "[deploy-all] {{.GLOBAL_REGISTRY}} unreachable on :443 (got $code) — ensure the OCI registry is up + DNS/route resolves" >&2
              exit 1 ;;
          esac

          skip='{{default "" .SKIP}}'
          only='{{default "" .ONLY}}'
          skip_set=$(printf '%s' "$skip" | tr ',' '\n' | sed '/^$/d')
          only_set=$(printf '%s' "$only" | tr ',' '\n' | sed '/^$/d')

          succeeded=
          skipped=
          for name in $(printf '%s' '{{.COMPONENTS}}' | tr -s '[:space:]' '\n' | sed '/^$/d'); do
            if [ -n "$only_set" ] && ! printf '%s\n' "$only_set" | grep -Fxq "$name"; then
              continue
            fi
            if [ -n "$skip_set" ] && printf '%s\n' "$skip_set" | grep -Fxq "$name"; then
              skipped="$skipped $name"
              continue
            fi
            printf '\n\033[1;36m[deploy-all] === %s ===\033[0m\n' "$name"
            if ! (cd "$name" && task deploy GLOBAL_REGISTRY={{.GLOBAL_REGISTRY}}); then
              printf '\033[1;31m[deploy-all] %s: FAILED — aborting fan-out\033[0m\n' "$name" >&2
              [ -n "$succeeded" ] && echo "[deploy-all] resume:  task deploy-all SKIP=$(echo $succeeded | tr ' ' ',')" >&2
              exit 1
            fi
            succeeded="$succeeded $name"
          done

          echo
          printf '\033[1;32m[deploy-all] succeeded:\033[0m%s\n' "${succeeded:- (none)}"
          [ -n "$skipped" ] && printf '\033[1;33m[deploy-all] skipped:\033[0m%s\n' "$skipped" || true

  deploy-all:sync:
    silent: true
    desc: |-
      After deploy-all, force the ArgoCD apps deploy-all republishes
      (the `paladin-core` + `paladin-console` charts — backend + UI) to hard-refresh
      so they pick up the new chart digests immediately instead of waiting
      for the next poll. No-op when kubectl can't reach the cluster.
    cmds:
      - cmd: |-
          set -u
          echo "[deploy-all:sync] context={{.K8S_CONTEXT}}"
          if ! kubectl --context {{.K8S_CONTEXT}} version --request-timeout=3s >/dev/null 2>&1; then
            echo "[deploy-all:sync] kubectl can't reach context {{.K8S_CONTEXT}}; skip" >&2
            exit 0
          fi
          # Match the app names deploy-all republishes: the ArgoCD app
          # names equal the chart names (`paladin-core` backend, `paladin-console`
          # frontend). The `(core|console)` alternation is deliberately
          # narrow so a bare `^paladin(-|$)` doesn't also match the unrelated
          # `paladin-postgresql` infra app (which must not be hard-refreshed).
          apps=$(kubectl --context {{.K8S_CONTEXT}} -n argocd get app -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null \
                 | grep -E '^paladin-(core|console)(-|$)' || true)
          if [ -z "$apps" ]; then
            echo "[deploy-all:sync] no paladin-core / paladin-console apps in argocd ns"
            exit 0
          fi
          for app in $apps; do
            echo "[deploy-all:sync] refresh $app"
            kubectl --context {{.K8S_CONTEXT}} -n argocd patch app "$app" --type merge \
              -p '{"metadata":{"annotations":{"argocd.argoproj.io/refresh":"hard"}}}' >/dev/null
          done

  # ─── local compose stack ──────────────────────────────────────────────────
  e2e-up:
    desc: Bring the whole compose stack up (backend planes + UI).
    cmds:
      - task: meta:compose-up

  e2e-down:
    desc: Tear the compose stack down. Volumes preserved.
    cmds:
      - task: meta:compose-down

  e2e-clean:
    desc: Tear down + drop volumes (Postgres, SeaweedFS data lost).
    cmds:
      - task: meta:compose-clean

  # ─── dependency bumps (LATEST_STABLE.md: minor/patch, no majors) ──────────
  deps:update:
    desc: |-
      Bump deps across both halves to the latest minor/patch (no majors).
      Go: go get -u ./... && go mod tidy && go build. Node: pnpm update.
      Review `git diff` and cross majors deliberately per CHANGELOG.
    cmds:
      - task: deps:update:go
      - task: deps:update:node
      - task: deps:update:pnpm

  deps:update:go:
    desc: Bump backend Go module deps (minor/patch)
    dir: backend
    cmds:
      - go get -u ./...
      - go mod tidy
      - go build ./...

  deps:update:node:
    desc: Bump frontend Node deps (minor/patch) via pnpm
    dir: frontend
    cmds:
      - pnpm update

  deps:update:pnpm:
    desc: Pin pnpm itself to the latest stable (package.json + Dockerfile)
    summary: |-
      `deps:update:node` bumps what pnpm INSTALLS; this bumps pnpm. The
      version is pinned twice — packageManager in package.json (local dev, and
      what pnpm/action-setup reads in CI) and ARG PNPM_VERSION in the image
      build — and the two must agree. Both sat at 11.21.0 while 11.24.0 was
      current, because nothing updated either.
      Resolves the version from the npm registry, never from whatever is
      installed locally, and refuses anything that is not a GA triple.
    cmds:
      - ./frontend/scripts/pnpm-pin.sh update

  deps:check:pnpm:
    desc: Fail if the two pnpm pins disagree
    cmds:
      - ./frontend/scripts/pnpm-pin.sh check
