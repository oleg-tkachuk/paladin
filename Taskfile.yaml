version: "3"

vars:
  PROJECT_NAME: paladin
  COMPOSE_FILE: ./deploy/docker-compose.yaml
  DEPLOY_INFO_ENV_FILE: ./deploy/info.env
  TIMEZONE: Europe/Kyiv
  K8S_NAMESPACE: paladin
  K8S_DEPLOYMENT_NAME: paladin

tasks:
  default:
    desc: "Lists tasks with or without a description"
    cmds:
      - task -a

  ds:prune:
    desc: "Docker system prune"
    silent: true
    deps:
      - dd:start
    cmds:
      - cmd: |-
          printf "INFO: {{.K8S_DEPLOYMENT_NAME}}: Pruning Docker system...\n"
      - cmd: |-
          docker system prune --volumes --force
      - cmd: |-
          printf "INFO: {{.K8S_DEPLOYMENT_NAME}}: Pruning Minikube Docker system...\n"
      - cmd: |-
          minikube ssh "docker system prune -a --volumes --force" || true

  dd:start:
    desc: "Start Docker Desktop"
    silent: true
    cmds:
      - cmd: |-
          printf "INFO: {{.K8S_DEPLOYMENT_NAME}}: Starting Docker Desktop...\n"
      - cmd: |-
          docker desktop start

  # -------------------------
  # Build pipeline (subtasks)
  # -------------------------

  build:
    desc: "Build the image"
    cmds:
      - task: build:version:bump
      - task: build:env:write
      - task: build:compose
      - task: restart

  build:version:bump:
    desc: "Auto-increment VERSION (patch)"
    silent: true
    cmds:
      - cmd: |-
          set -euo pipefail

          if [ ! -f {{.DEPLOY_INFO_ENV_FILE}} ]; then touch {{.DEPLOY_INFO_ENV_FILE}}; fi

          check_version=$(grep "APP_VERSION=" {{.DEPLOY_INFO_ENV_FILE}} | cut -d'=' -f2 || echo "0.1.0")
          if [ -z "$check_version" ]; then check_version="0.1.0"; fi

          next_version="$(printf "%s" "$check_version" | awk -F. -v OFS=. '{$NF += 1 ; print}')"

          if grep -q "APP_VERSION=" {{.DEPLOY_INFO_ENV_FILE}}; then
            sed -i '' "s/APP_VERSION=.*/APP_VERSION=$next_version/" {{.DEPLOY_INFO_ENV_FILE}}
          else
            echo "APP_VERSION=$next_version" >> {{.DEPLOY_INFO_ENV_FILE}}
          fi

          printf "INFO: %s: Bumped version from %s to %s\n" "{{.K8S_DEPLOYMENT_NAME}}" "$check_version" "$next_version"

  build:env:write:
    desc: "Write build metadata to env file"
    silent: true
    cmds:
      - cmd: |-
          set -euo pipefail
          printf "INFO: %s: Writing build metadata to env file...\n" "{{.K8S_DEPLOYMENT_NAME}}"

          # Read the version that was just bumped (or exists)
          next_version=$(grep "APP_VERSION=" {{.DEPLOY_INFO_ENV_FILE}} | cut -d'=' -f2)

          {
            printf "GIT_COMMIT_HASH=%s\n" "$(git rev-parse --short HEAD)"
            printf "BUILD_TIME=%s\n" "$(TZ={{.TIMEZONE}} date +%Y-%m-%dT%H:%M:%S%z)"
            printf "APP_VERSION=%s\n" "$next_version"
          } > {{.DEPLOY_INFO_ENV_FILE}}

  build:compose:
    desc: "Run docker compose build in minikube docker-env"
    silent: true
    cmds:
      - cmd: |-
          set -euo pipefail

          printf "INFO: %s: Building Docker images...\n" "{{.K8S_DEPLOYMENT_NAME}}"

          eval "$(minikube docker-env)"

          time docker compose \
            --progress={{.PROGRESS | default "auto"}} \
            -f {{.COMPOSE_FILE}} \
            -p {{.PROJECT_NAME}} \
            --env-file {{.DEPLOY_INFO_ENV_FILE}} \
            build

  # -------------------------
  # Verification & Quality
  # -------------------------

  test:unit:
    desc: "Run unit tests"
    cmds:
      - cmd: |-
          eval "$(minikube docker-env)" && time go test ./...

  test:lint:
    desc: "Run linters"
    cmds:
      - cmd: |-
          time golangci-lint run ./...

  test:coverage:
    desc: "Run unit tests with coverage"
    cmds:
      - cmd: |-
          eval "$(minikube docker-env)" && \
          mkdir -p coverage && \
          time go test -coverprofile=coverage/cover.out ./... && \
          go tool cover -html=coverage/cover.out -o coverage/cover.html
      - cmd: |-
          printf "INFO: Coverage report saved to coverage/cover.html\n"

  test:e2e:
    desc: "Run E2E integration tests (Hurl)"
    vars:
      HOST: '{{.HOST | default "http://localhost:8080"}}'
    cmds:
      - cmd: |-
          time hurl --variable host={{.HOST}} --test tests/api/e2e/*.hurl

  test:functional:
    desc: "Run API functional tests"
    dir: tests/api/functional
    cmds:
      - cmd: |-
          ./run-functional.sh

  test:mutations:
    desc: "Run API mutation tests"
    dir: tests/api/mutations
    cmds:
      - cmd: |-
          ./run-mutations.sh

  test:security:sast:
    desc: "Run Security SAST tests (gosec)"
    dir: tests/api/security
    cmds:
      - cmd: |-
          ./run-gosec.sh

  test:security:dast:
    desc: "Run Security DAST tests (nuclei, zap)"
    dir: tests/api/security
    cmds:
      - cmd: |-
          ./run-nuclei.sh
      - cmd: |-
          ./run-zap.sh

  test:security:sca:
    desc: "Run Security SCA tests (trivy)"
    dir: tests/api/security
    cmds:
      - cmd: |-
          ./run-trivy.sh

  test:security:
    desc: "Run all security tests"
    dir: tests/api/security
    cmds:
      - cmd: |-
          ./run-all-security.sh

  test:all:
    desc: "Run all verification tasks (lint, unit, functional, e2e, security)"
    cmds:
      - task: test:lint
      - task: test:unit
      - task: test:functional
      - task: test:e2e
      - task: test:security

  # Alias for backward compatibility or convenience
  test:
    desc: "Alias for test:unit"
    cmds:
      - task: test:unit

  generate:
    desc: "Generate all code (Proto, Mocks)"
    silent: true
    cmds:
      - cmd: |-
          printf "INFO: {{.K8S_DEPLOYMENT_NAME}}: Generating code (mocks, proto)...\n"
      - cmd: |-
          time go run github.com/vektra/mockery/v3 --config .mockery.yaml
      - cmd: |-
          time buf generate
      - cmd: |-
          time go generate ./...


  restart:
    desc: "Restart the deployment"
    silent: true
    cmds:
      - |
        if ! kubectl get namespace {{.K8S_NAMESPACE}} >/dev/null 2>&1; then
          printf "INFO: %s: Skipping restart (namespace %s not found)\n" "{{.K8S_DEPLOYMENT_NAME}}" "{{.K8S_NAMESPACE}}"
          exit 0
        fi
        if kubectl get deployment/{{.K8S_DEPLOYMENT_NAME}} -n {{.K8S_NAMESPACE}} >/dev/null 2>&1; then
          printf "INFO: %s: Restarting deployment...\n" "{{.K8S_DEPLOYMENT_NAME}}"
          kubectl -n {{.K8S_NAMESPACE}} rollout restart deployment {{.K8S_DEPLOYMENT_NAME}}
        else
          printf "INFO: %s: Skipping restart (deployment not found in %s)\n" "{{.K8S_DEPLOYMENT_NAME}}" "{{.K8S_NAMESPACE}}"
        fi
