name: Docker Hub login (optional)
description: >
  Authenticate to Docker Hub when the DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
  secrets are set. Anonymous pulls on GitHub-hosted runners share a small
  per-IP rate limit across the whole runner fleet, so image pulls
  (testcontainers Postgres, MinIO, the golang/node alpine build bases)
  intermittently 429 and the job "fails, then passes on retry". An
  authenticated pull is counted per-account, not per-IP, which removes that
  class of flake. No-op when the secrets are absent, so forks and
  secret-less runs are unaffected.
inputs:
  username:
    description: Docker Hub username (pass secrets.DOCKERHUB_USERNAME).
    required: false
    default: ""
  token:
    description: Docker Hub access token (pass secrets.DOCKERHUB_TOKEN).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Log in to Docker Hub
      if: ${{ inputs.username != '' && inputs.token != '' }}
      uses: docker/login-action@v4.6.0
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.token }}
    - name: Note when Docker Hub auth is skipped
      if: ${{ inputs.username == '' || inputs.token == '' }}
      shell: bash
      run: |
        echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — pulling from Docker Hub anonymously." \
             "Set both repo secrets to remove image-pull rate-limit flakes."
