# zizmor configuration.
#
# Each relaxed audit states why. Everything else runs: actions are pinned to
# commit SHAs, no workflow input reaches a shell, and every job asks for the
# narrowest token it needs.
rules:
  artipacked:
    ignore:
      # release.yaml is the one checkout in this repository that genuinely
      # needs its credentials: semantic-release pushes the tag it creates.
      # Every other checkout sets persist-credentials: false, which is what
      # this audit asks for.
      - release.yaml
  self-repository:
    # It asks for `$/…` in place of `./…` for this repository's own action,
    # .github/actions/setup-ci, which actionlint (v1.7.12, the newest) refuses
    # as an action with no ref. `./…` runs the action from the checkout each
    # job makes, which is the commit the job runs anyway. Lift this when
    # actionlint reads the syntax.
    disable: true
