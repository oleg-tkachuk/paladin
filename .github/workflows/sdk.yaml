name: SDK

# Releases the Go SDK when an API contract baseline is cut: pushing
# api/vX.Y.Z tags sdk/go/vX.Y.Z on the same commit. The SDKs are versioned with
# the contract they are generated from; see docs/upgrading.md, "Changing the
# API contract". The Python SDK is not published anywhere yet.
#
# api/latest is a moving pointer, not a release, and does not match.
on:
  push:
    tags: ["api/v[0-9]*"]

permissions: {}

concurrency:
  group: sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  go:
    name: Tag the Go SDK
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write # create the sdk/go/ tag
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
          cache: false

      - name: Test
        working-directory: sdk/go
        run: go test ./...

      # Through the API rather than a checkout with credentials: the tag is the
      # only thing this job writes. The Go proxy resolves lightweight tags.
      - name: Tag sdk/go/ at the contract's commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${API_TAG#api/}"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/sdk/go/${version}" -f sha="${GITHUB_SHA}" >/dev/null
          printf 'tagged sdk/go/%s at %s\n' "$version" "$GITHUB_SHA"
