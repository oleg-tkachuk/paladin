name: Security

# Security gate for PRs and main/develop pushes:
# - gitleaks: full-history secret scan (same tool as the lefthook
#   pre-commit hook, which only sees staged files and only runs when
#   gitleaks is installed locally — CI is the backstop).
# - trivy: filesystem scan of lockfiles / manifests for known-vulnerable
#   dependencies, plus an image scan that builds both OCI images and scans
#   the assembled layers (distroless Go backend + node-alpine frontend).

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history scan

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    runs-on: ubuntu-latest
    # Trivy pulls its vulnerability DB from ghcr.io by default, which is
    # aggressively rate-limited for anonymous clients on shared runner IPs —
    # the classic "scan fails, passes on re-run" flake. Point both DBs at the
    # Aqua-maintained ECR Public mirrors, which are not GHCR-rate-limited.
    env:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-image:
    runs-on: ubuntu-latest
    env:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2
      TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      # Both images FROM golang/node alpine bases on Docker Hub; authenticate
      # when the secrets exist so the base-image pulls don't 429 (no-op
      # otherwise). See .github/actions/dockerhub-login.
      - name: Docker Hub login (optional)
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Mirrors `task backend:release:image:build`. Backend context is the
      # REPO ROOT (not backend/): the Dockerfile COPYs backend/ plus the nested
      # capability/ module, so a backend/-scoped context fails on `COPY
      # backend/... not found`. The frontend build below keeps its frontend/
      # context.
      - name: Build backend image
        run: |
          docker buildx build --load \
            --file backend/deploy/Dockerfile \
            --build-arg APP_VERSION=ci-scan \
            --build-arg GIT_COMMIT_HASH="${{ github.sha }}" \
            --build-arg BUILD_TIME=ci \
            -t paladin-backend:scan .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: paladin-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build frontend image
        run: |
          docker buildx build --load \
            --file frontend/deploy/Dockerfile \
            -t paladin-frontend:scan frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: paladin-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
