name: Security

# Security gate for PRs and main/develop pushes:
# - gitleaks: full-history secret scan (same tool as the lefthook
#   pre-commit hook, which only sees staged files and only runs when
#   gitleaks is installed locally — CI is the backstop).
# - trivy: filesystem scan of lockfiles / manifests for known-vulnerable
#   dependencies, plus an image scan that builds both OCI images and scans
#   the assembled layers (distroless Go backend + node-alpine frontend).

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history scan

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Mirrors `task docker:build` (buildx --load, service dir as context).
      - name: Build backend image
        run: |
          docker buildx build --load \
            --file backend/deploy/Dockerfile \
            --build-arg APP_VERSION=ci-scan \
            --build-arg GIT_COMMIT_HASH="${{ github.sha }}" \
            --build-arg BUILD_TIME=ci \
            -t paladin-backend:scan backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: paladin-backend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build frontend image
        run: |
          docker buildx build --load \
            --file frontend/deploy/Dockerfile \
            -t paladin-frontend:scan frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: image
          image-ref: paladin-frontend:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
