name: CI

# The whole pipeline: the repository's own fast gate, an audit of these
# workflows, and — on a green push to main — a dispatch to release.yaml.
#
# Deliberately minimal. CI pushes no image and no chart; release.yaml publishes
# both for each release tag. `verify-e2e` — Playwright against a stack built
# from the change — runs here for a change the console or the backend reaches:
# while it ran only locally, console bugs piled up behind a suite nobody ran.
# `verify-deep` — the Postgres-backed integration suites and the stack gate
# (RPC surface, Go admin e2e, S3 conformance, dev-bootstrap, smoke), as two
# parallel jobs — runs for a change the backend reaches; it too had been
# local-only, and rotted there.

on:
  push:
    branches: [main]
  pull_request:
  # A run by hand has no diff to classify, so it runs every check. It never
  # dispatches a release: that job requires a push event.
  workflow_dispatch:

# Nothing at the top level — each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Pinned tools, one place each. A floating tool changes what the gate checks
# with no commit of ours in between.
env:
  # renovate: datasource=github-releases depName=go-task/task
  TASK_VERSION: "3.53.1"
  # Must be BUILT with a Go no older than the `go` directive in backend/go.mod
  # and capability/go.mod, or it refuses to load the config. Bumping go.mod
  # means checking this.
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: "v2.14.0"
  # renovate: datasource=github-releases depName=bufbuild/buf
  BUF_VERSION: "1.73.0"
  # The codegen gates normalise generated imports with goimports when it is on
  # PATH, and the committed stubs are normalised. Without it the check
  # regenerates with the plugin's own grouping and reports every file stale.
  # renovate: datasource=go depName=golang.org/x/tools
  GOIMPORTS_VERSION: "v0.50.0"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v4.3.0"
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "v0.74.0"
  # renovate: datasource=github-releases depName=hadolint/hadolint
  HADOLINT_VERSION: "v2.15.1"
  # renovate: datasource=github-releases depName=prometheus/prometheus
  PROMETHEUS_VERSION: "v3.15.0"
  # renovate: datasource=github-releases depName=mikefarah/yq
  YQ_VERSION: "v4.53.6"
  # Matches NODE_VERSION in frontend/deploy/Dockerfile, so the suite runs on
  # the Node the console image ships. That Node has no corepack; pnpm comes
  # from pnpm/action-setup below instead.
  NODE_VERSION: "26"
  # renovate: datasource=go depName=github.com/rhysd/actionlint
  ACTIONLINT_VERSION: "v1.7.12"
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.12.21"
  # renovate: datasource=pypi depName=zizmor
  ZIZMOR_VERSION: "1.30.1"
  # The stack gate mints its dev token with `step` (task backend:auth:mint-token).
  # renovate: datasource=github-releases depName=smallstep/cli
  STEP_VERSION: "0.31.0"

jobs:
  # Whether anything the checks below read has changed.
  #
  # An EXCLUSION list, and the direction matters more than its contents: an
  # inclusion list has to be extended for each new kind of input, and
  # forgetting is silent and green. Excluding documentation cannot fail that
  # way — a file type nobody has thought about yet is relevant by default.
  changes:
    name: Changed paths
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      groups: ${{ steps.filter.outputs.groups }}
      e2e: ${{ steps.filter.outputs.e2e }}
      deep: ${{ steps.filter.outputs.deep }}
      py-compat: ${{ steps.py-compat.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff below needs both ends of it.
          fetch-depth: 0

      - name: Classify the diff
        id: filter
        env:
          # A pull request has both ends of its own diff; a push reports the
          # branch's previous head.
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -n "${BASE:-}" ]; then
            from="$BASE"
            to="$HEAD"
          else
            from="${BEFORE:-}"
            to="$AFTER"
          fi

          # A push that created the branch reports all zeros, a force-push can
          # name a commit this clone does not have, and a run by hand has no
          # diff at all. None of them is a diff, so all mean everything.
          zero=0000000000000000000000000000000000000000
          if [ -z "$from" ] || [ "$from" = "$zero" ] || ! git cat-file -e "${from}^{commit}" 2>/dev/null; then
            printf '%s\n' "no usable base (${from:-none}) — running everything"
            groups="$(./scripts/ci-groups.sh --all)"
          else
            changed="$(git diff --name-only "$from" "$to")"
            printf '%s\n' "$changed"
            groups="$(printf '%s\n' "$changed" | ./scripts/ci-groups.sh)"
          fi

          printf '%s\n' "groups: $groups"
          printf '%s\n' "groups=$groups" >>"$GITHUB_OUTPUT"
          e2e="$(printf '%s' "$groups" | ./scripts/ci-groups.sh --needs-e2e)"
          printf '%s\n' "end-to-end: $e2e"
          printf '%s\n' "e2e=$e2e" >>"$GITHUB_OUTPUT"
          deep="$(printf '%s' "$groups" | ./scripts/ci-groups.sh --needs-deep)"
          printf '%s\n' "deep: $deep"
          printf '%s\n' "deep=$deep" >>"$GITHUB_OUTPUT"
          if [ "$groups" = "[]" ]; then
            printf '%s\n' "relevant=false" >>"$GITHUB_OUTPUT"
            printf '%s\n' "documentation only — the checks below will report as skipped"
          else
            printf '%s\n' "relevant=true" >>"$GITHUB_OUTPUT"
          fi

      # The Python SDK's compatibility cells, read here so the matrix job and
      # `scripts/py-sdk-compat.sh --matrix` run the same list.
      - name: Read the Python SDK compatibility matrix
        id: py-compat
        run: printf 'matrix=%s\n' "$(jq -c . sdk/python/compat.json)" >>"$GITHUB_OUTPUT"

  # The repository's own commit gate, `task -t Taskfile.dev.yaml verify-all`,
  # run as its groups: one job per group the change can reach, each installing
  # only what that group runs. Together the groups are exactly verify-all, so
  # CI and a developer's machine check the same thing. No Docker.
  test:
    name: Verify (${{ matrix.group }})
    needs: [changes]
    if: needs.changes.outputs.groups != '[]'
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.changes.outputs.groups) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    # Packages build and test in parallel. Every suite that starts a container
    # is behind the `integration` tag, which this job only compiles, so nothing
    # here needs the runner to itself.
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # scripts/proto-breaking.sh compares against an api/vX.Y.Z tag, and a
          # shallow checkout fetches none.
          fetch-depth: 0

      - name: Set up Go
        if: matrix.group == 'backend' || matrix.group == 'capability' || matrix.group == 'sdk' || matrix.group == 'repo'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # The cache below replaces setup-go's own. That one is keyed on
          # go.sum alone and shared by every job, so whichever job finished
          # first after a go.sum change wrote it, and nothing ever updated it:
          # the backend compiled nearly from scratch on every run.
          cache: false

      # Per job, refreshed by every push to main (the key carries the commit),
      # and restored by a pull request from the newest main entry. Only main
      # writes, so a pull request cannot seed what main builds from.
      - name: Restore the Go caches
        id: go-cache
        if: matrix.group == 'backend' || matrix.group == 'capability' || matrix.group == 'sdk' || matrix.group == 'repo'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-verify-${{ matrix.group }}-${{ hashFiles('backend/go.sum', 'capability/go.sum', 'sdk/go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-verify-${{ matrix.group }}-${{ hashFiles('backend/go.sum', 'capability/go.sum', 'sdk/go/go.sum') }}-
            go-${{ runner.os }}-verify-${{ matrix.group }}-

      - name: Set up goimports
        if: matrix.group == 'backend' || matrix.group == 'sdk'
        run: |
          set -euo pipefail
          go install "golang.org/x/tools/cmd/goimports@${GOIMPORTS_VERSION}"
          printf '%s\n' "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - name: Set up golangci-lint
        if: matrix.group == 'backend' || matrix.group == 'capability' || matrix.group == 'sdk'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
          # Its cache lives in the Go caches above.
          skip-cache: true

      - name: Set up buf
        if: matrix.group == 'sdk' || matrix.group == 'frontend' || matrix.group == 'repo'
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
          github_token: ${{ github.token }}

      - name: Set up Helm
        if: matrix.group == 'repo'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The Python SDK's gate: its venv, and the protoc it generates with.
      - name: Set up uv
        if: matrix.group == 'sdk' || matrix.group == 'repo'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # The runner image ships a yq, but not a version this repository chose.
      # The chart and Taskfile checks read YAML through it.
      - name: Set up yq
        if: matrix.group == 'repo'
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Version comes from frontend/package.json "packageManager".
      - name: Set up pnpm
        if: matrix.group == 'frontend'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        if: matrix.group == 'frontend'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: matrix.group == 'frontend'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # verify:release-rules runs the pinned commit analyzer against
      # release.config.cjs. Node 24, as release.yaml runs it.
      - name: Set up Node for the release tooling
        if: matrix.group == 'repo'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install the release tooling
        if: matrix.group == 'repo'
        run: npm ci

      # --yes accepts the first-fetch trust prompt for the shared task library
      # include; unattended, that prompt is a hang rather than a question.
      - name: Set up hadolint
        if: matrix.group == 'repo'
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint
          hadolint --version
      - name: Set up trivy
        if: matrix.group == 'repo'
        run: |
          set -euo pipefail
          v="${TRIVY_VERSION#v}"
          base="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}"
          archive="trivy_${v}_Linux-64bit.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/trivy_${v}_checksums.txt" | grep " ${archive}\$" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin trivy
          trivy --version
      - name: Set up promtool
        if: matrix.group == 'repo'
        run: |
          set -euo pipefail
          v="${PROMETHEUS_VERSION#v}"
          base="https://github.com/prometheus/prometheus/releases/download/${PROMETHEUS_VERSION}"
          dir="prometheus-${v}.linux-amd64"
          archive="${dir}.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${archive}"
          curl -fsSL "${base}/sha256sums.txt" | grep " ${archive}\$" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin --strip-components=1 "${dir}/promtool"
          promtool --version
      - name: task verify-${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
        run: task --yes -t Taskfile.dev.yaml "verify-${GROUP}"

      - name: Save the Go caches
        if: >-
          success() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (matrix.group == 'backend' || matrix.group == 'capability' || matrix.group == 'sdk' || matrix.group == 'repo')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # The images the Playwright shards run, built once. Each shard used to build
  # both itself — about half of every shard's minutes, spent twice. The images
  # and the info.env files that name their versions travel as an artifact
  # (scripts/e2e-images.sh).
  e2e-images:
    name: End-to-end images
    needs: [changes]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The image version is derived from git describe.
          fetch-depth: 0

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # The backend image's go build cache (scripts/go-build-cache.sh): restored
      # here, imported into BuildKit, and saved from main like the Go caches.
      # A miss or a failed import only means a cold build.
      - name: Restore the image build cache
        id: image-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-docker
          key: go-docker-e2e-${{ hashFiles('backend/go.sum', 'backend/deploy/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            go-docker-e2e-${{ hashFiles('backend/go.sum', 'backend/deploy/Dockerfile') }}-
            go-docker-e2e-

      - name: Import the image build cache
        continue-on-error: true
        run: ./scripts/go-build-cache.sh import "${RUNNER_TEMP}/go-docker"

      - name: task verify-e2e:images
        run: task --yes -t Taskfile.dev.yaml verify-e2e:images

      - name: Export the image build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: ./scripts/go-build-cache.sh export "${RUNNER_TEMP}/go-docker"

      - name: Save the image build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-docker
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - name: Save the images
        run: ./scripts/e2e-images.sh save "${RUNNER_TEMP}/e2e-images"

      - name: Hand the images to the shards
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images/
          include-hidden-files: false
          if-no-files-found: error
          retention-days: 1

  # The Playwright suite against a stack built from this change, through the
  # same task a developer runs: `verify-e2e:run` boots the compose stack from
  # the images above and names any test that passed only on its retry. Only
  # for a change the console or the backend reaches (ci-groups.sh --needs-e2e).
  e2e:
    name: End-to-end (${{ matrix.shard }})
    needs: [changes, e2e-images]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    # The suite in two slices on two runners, each booting its own stack from
    # the same images.
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The image version is derived from git describe.
          fetch-depth: 0

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # scripts/stack-ports.sh derives the images to pre-pull from the compose
      # file through yq.
      - name: Set up yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # Version comes from frontend/package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Fetch the images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images

      - name: Load the images
        run: ./scripts/e2e-images.sh load "${RUNNER_TEMP}/e2e-images"

      - name: task verify-e2e:run
        env:
          PALADIN_E2E_SHARD: ${{ matrix.shard }}
        run: task --yes -t Taskfile.dev.yaml verify-e2e:run

      # The stack's logs are printed by verify-e2e itself before it tears the
      # stack down; these are the browser's side.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            frontend/tests/e2e/test-results/
            frontend/test-results/
          retention-days: 7

  # verify-deep, through the same tasks a developer runs, as its two halves on
  # two runners: the Postgres-backed integration suites (testcontainers), and
  # the stack gate — the RPC-surface gate, the Go admin e2e suite, S3
  # conformance, dev-bootstrap twice and the smoke test, against a compose
  # stack built from this change. Neither half needs the other, and run in one
  # job the image build waited on the suites for nothing. Only for a change
  # the backend reaches (ci-groups.sh --needs-deep).
  # The Python SDK's wheel installed beside each protobuf major and Python it
  # declares, and beside a protobuf-6 framework, with its tests run there. The
  # SDK's own lock resolves one protobuf; a consumer's environment resolves
  # another, and this is where a range that admits a runtime the stubs refuse
  # fails.
  py-sdk-compat:
    name: Python SDK (${{ matrix.python }}, ${{ matrix.with }})
    needs: [changes]
    if: contains(fromJSON(needs.changes.outputs.groups), 'sdk')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.py-compat) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install the wheel and run the tests
        env:
          PYTHON: ${{ matrix.python }}
          WITH: ${{ matrix.with }}
        run: ./scripts/py-sdk-compat.sh "$PYTHON" "$WITH"

  deep:
    name: Deep (${{ matrix.half }})
    needs: [changes]
    if: needs.changes.outputs.deep == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        half: [integration, stack]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The image version is derived from git describe.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false # per-job caches below, as in the Verify jobs

      - name: Restore the Go caches
        id: go-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-deep-${{ matrix.half }}-${{ hashFiles('backend/go.sum', 'capability/go.sum', 'sdk/go/go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-${{ runner.os }}-deep-${{ matrix.half }}-${{ hashFiles('backend/go.sum', 'capability/go.sum', 'sdk/go/go.sum') }}-
            go-${{ runner.os }}-deep-${{ matrix.half }}-

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Set up step
        run: |
          set -euo pipefail
          base="https://github.com/smallstep/cli/releases/download/v${STEP_VERSION}"
          deb="step-cli_${STEP_VERSION}-1_amd64.deb"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${deb}"
          curl -fsSL "${base}/checksums.txt" | grep " ${deb}\$" | sha256sum -c -
          sudo dpkg -i "$deb"
          step version

      # The backend image's go build cache (scripts/go-build-cache.sh): restored
      # here, imported into BuildKit, and saved from main like the Go caches.
      # A miss or a failed import only means a cold build.
      - name: Restore the image build cache
        id: image-cache
        if: matrix.half == 'stack'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-docker
          key: go-docker-deep-${{ hashFiles('backend/go.sum', 'backend/deploy/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            go-docker-deep-${{ hashFiles('backend/go.sum', 'backend/deploy/Dockerfile') }}-
            go-docker-deep-

      - name: Import the image build cache
        if: matrix.half == 'stack'
        continue-on-error: true
        run: ./scripts/go-build-cache.sh import "${RUNNER_TEMP}/go-docker"

      - name: task verify-deep:${{ matrix.half }}
        env:
          HALF: ${{ matrix.half }}
        run: task --yes -t Taskfile.dev.yaml "verify-deep:${HALF}"

      - name: Save the Go caches
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

      - name: Export the image build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.half == 'stack'
        continue-on-error: true
        run: ./scripts/go-build-cache.sh export "${RUNNER_TEMP}/go-docker"

      - name: Save the image build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.half == 'stack'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-docker
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

  # Two jobs over the same files, and the halves do not overlap. actionlint
  # covers whether a workflow is correct at all — schema, expression syntax,
  # `needs:` naming a job that exists, and shellcheck over every `run:` block.
  # zizmor covers security: unpinned actions, leaked credentials, injectable
  # expressions.
  #
  # Separate jobs rather than two steps in one: a job name is a required check,
  # so burying an audit inside another job's name leaves nothing on the pull
  # request saying it ran.
  syntax:
    name: Workflow syntax
    needs: [changes]
    if: needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: actionlint
        run: |
          set -euo pipefail
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          actionlint

  audit:
    name: Workflow audit
    needs: [changes]
    if: needs.changes.outputs.relevant != 'false'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # These workflows are the part of the repository that runs with a token,
      # so they are audited as code rather than trusted as config. Exceptions
      # live in .github/zizmor.yml, each with the reason it stands.
      #
      # pipx run rather than install, so the version in the command is the
      # version that executes.
      - name: zizmor
        env:
          # Without a token zizmor runs offline and skips the audits that need
          # the API — resolving an action's ref among them.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pipx run "zizmor==${ZIZMOR_VERSION}" \
            --config .github/zizmor.yml --persona=regular --format=plain .github/workflows/

  # The one check a ruleset can require. The Verify jobs are a matrix whose
  # members change with the paths a change touches, so no single job name is
  # always present; this one always is. A skipped job was not reached by the
  # change, which is a pass; a failure or a cancellation anywhere is not.
  checks:
    name: All checks passed
    needs: [changes, test, py-sdk-compat, e2e-images, e2e, deep, syntax, audit]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to have passed or been skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          printf 'results: %s\n' "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                printf '%s\n' "a required job ended as ${result}"
                exit 1
                ;;
            esac
          done

  dispatch-release:
    name: Dispatch release
    needs: [changes, test, py-sdk-compat, e2e-images, e2e, deep, syntax, audit]
    # Not for a documentation-only push: its code is byte-identical to the
    # commit before it, so a release would rebuild and republish the same
    # images under a new version. Its commits are not lost — semantic-release
    # counts them in the next release a code change dispatches.
    #
    # always(), because a skipped `test` (a change no group reaches) would
    # otherwise skip this with it. A failure or cancellation stops it.
    if: >-
      always() &&
      needs.changes.outputs.relevant == 'true' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # POST /repos/{owner}/{repo}/dispatches needs write
    steps:
      - name: Dispatch the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --input rather than -f: client_payload is nested and the form
          # syntax cannot express that. Both values come from Actions itself
          # and arrive through env, so nothing here is substituted into the
          # script before the shell runs.
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" --input - <<JSON
          {
            "event_type": "release",
            "client_payload": {
              "sha": "${GITHUB_SHA}",
              "ci_run_id": "${GITHUB_RUN_ID}"
            }
          }
          JSON
          printf '%s\n' "dispatched release for ${GITHUB_SHA}"
