name: Test

# PR verification gate. Mirrors the lefthook pre-commit / pre-push
# commands (go vet, go test, golangci-lint, buf lint, eslint, tsc) so the same
# checks that run locally are enforced for every PR and push to main/develop.
# golangci-lint runs the curated set in backend/.golangci.yaml (the high-value
# correctness/security linters; the noisy style + deferred bug-catchers are
# tracked in BACKLOG under "golangci-lint follow-ups").

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # buf breaking compares against a tag, and the default shallow
          # checkout fetches none — the step would fail to resolve
          # api/v0.3.0 rather than find nothing wrong.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt check
        run: |
          out="$(gofmt -l . | grep -v -E '^(internal/store/postgres/sqlc|internal/generated)/' || true)"
          if [ -n "$out" ]; then
            echo "ERROR: gofmt needed on:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        # The action caches the linter binary + analysis cache and retries the
        # download, instead of a bare `go install` that re-fetches every run and
        # fails the job on a transient network blip. Pinned to the same v2.12.2.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: backend

      - name: go test
        run: go test ./... -count=1

      - name: buf lint
        uses: bufbuild/buf-action@v1
        with:
          input: backend/proto
          lint: true
          format: false
          breaking: false
          push: false

      # Wire/JSON compatibility against the published API baseline.
      #
      # The check needs an explicit against-tag, not the default branch:
      # main and develop advance together here, so comparing against main
      # compares the tree with itself and passes vacuously. api/v0.3.0 marks
      # the contract as published; move it (and re-tag api/latest) when a
      # breaking change is deliberate and released.
      #
      # This BLOCKS. Pre-1.0 the project still breaks compatibility on
      # purpose, and that stays possible — it just has to be deliberate: move
      # api/v0.3.0 (and api/latest) to the new commit and say so in
      # docs/upgrading.md. What is no longer possible is breaking the wire by
      # accident. Forty-five breaking changes accumulated in the four days
      # after the paladin rename, most of them field renames that keep the
      # field number: gRPC survives those, JSON does not, and nothing said so.
      - name: buf breaking (against published API baseline)
        uses: bufbuild/buf-action@v1
        with:
          input: backend/proto
          lint: false
          format: false
          push: false
          breaking: true
          breaking_against: ".git#tag=api/v0.3.0,subdir=backend/proto"

      - name: Set up buf (for codegen)
        uses: bufbuild/buf-setup-action@v1
        with:
          version: 1.71.0
          github_token: ${{ github.token }}

      - name: Proto codegen drift
        # Regenerate with the go.mod-pinned plugins (so versions match the
        # committed output) and fail if anything changed — catches a hand-edited
        # or --no-verify-committed generated file. Mirrors `task gen:proto`.
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go
          go install connectrpc.com/connect/cmd/protoc-gen-connect-go
          go install golang.org/x/tools/cmd/goimports@v0.46.0
          GOPATH_BIN="$(go env GOPATH)/bin"
          export PATH="$GOPATH_BIN:$PATH"
          buf generate proto --template proto/buf.gen.yaml
          goimports -w internal/api/pb
          if ! git diff --exit-code -- internal/api/pb; then
            echo "ERROR: generated proto code is out of date. Run 'task gen:proto' and commit."
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from frontend/package.json "packageManager".
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches NODE_VERSION in frontend/deploy/Dockerfile.
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Proto codegen drift
        # Regenerate the TS Connect clients (buf generate + prettier, all
        # pnpm-pinned) and fail if anything changed. Mirrors `npm run generate`.
        run: |
          pnpm run generate
          if ! git diff --exit-code -- src/gen; then
            echo "ERROR: generated TS client is out of date. Run 'npm run generate' and commit."
            exit 1
          fi

      - name: ESLint
        run: pnpm run lint

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: Unit tests (Vitest)
        run: pnpm test
