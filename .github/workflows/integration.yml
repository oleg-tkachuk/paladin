name: Integration

# Postgres-backed integration tests, gated on every PR and push to
# main/develop.
#
# These existed and passed but ran NOWHERE: the default `go test ./...` in
# test.yml excludes them (they carry a `//go:build integration` tag), and only
# one of the two suites was even wired into a local Task. So a regression in
# the store/adapter layer — 4700+ LOC of hand-written SQL mapping — could reach
# develop with a green pipeline, which is exactly the class of bug the project
# constitution calls out ("Middleware and store layer MUST be covered — those
# are where three-valued-logic bugs hide", citing a NULL-cursor regression that
# lived for weeks).
#
# Two suites, both testcontainers-backed (a real Postgres per package, migrated
# from the embedded migrations):
#   internal/integration/  — 35 tests: partitioning, outbox crash-recovery,
#                            broker sinks, idempotency replay, RLS routing
#   tests/integration/     — 62 tests: charge/billing, batch, backend
#                            enable/disable, transactional outbox, via pgharness
#
# Separate from the unit gate in test.yml because it needs Docker and takes
# minutes, not seconds — a failing unit gate should not wait on container
# starts, and vice versa.

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-backed:
    runs-on: ubuntu-latest
    # Container starts dominate the wall clock; the suites themselves are
    # quick. Generous ceiling so a slow image pull is not read as a hang, tight
    # enough that a genuinely stuck test does not burn a runner for an hour.
    timeout-minutes: 25
    # Both suites start Postgres containers (postgres:16/17-alpine) via
    # testcontainers-go. Two flake sources are neutralised here:
    #   - The Reaper (ryuk) sidecar is one more Docker Hub pull per package and
    #     is pointless on an ephemeral runner that's discarded after the job —
    #     disable it so it's neither pulled nor raced.
    #   - Postgres pulls still go to Docker Hub. The Docker Hub login step below
    #     lifts the anonymous rate limit when the secrets are set. For a
    #     secret-free alternative, route Hub images through the ECR Public mirror
    #     by adding: TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: public.ecr.aws/docker/library/
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # ubuntu-latest ships Docker preinstalled and running, which is what
      # testcontainers-go drives. Surface it explicitly so a runner-image
      # change that removes it fails here with a clear message rather than
      # deep inside a container-start timeout.
      - name: Verify Docker is available
        run: docker info >/dev/null

      - name: Docker Hub login (optional)
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      # -count=1 defeats the test cache: a cached pass from a prior run must
      # not stand in for actually exercising the database this time. Both
      # suites in one invocation so Go schedules their packages in parallel.
      - name: Integration tests (Postgres via testcontainers)
        run: |
          go test -tags=integration -count=1 -timeout=20m \
            ./internal/integration/... ./tests/integration/...

      # ─── RPC surface ────────────────────────────────────────────────────
      #
      # rpc_surface_test.go is the only thing that covers all 142 RPC
      # declarations at once — it walks the protobuf descriptors, so a service
      # added tomorrow is included the day it is registered. It reaches the
      # planes over HTTP and t.Skips when none answer, which is what it had
      # been doing here every single run: this job starts a testcontainers
      # Postgres and nothing else, so there were no planes to reach, and a
      # skipped gate reads exactly like a passing one.
      #
      # The stack the Playwright suite uses publishes all three planes on the
      # ports the test defaults to, so bringing it up is the whole fix. Its
      # images are the two the repo builds; a registry is not involved.
      - name: Build the images the stack references
        working-directory: .
        run: |
          docker buildx build --load \
            --tag registry.local/paladin/paladin-core:latest \
            --file backend/deploy/Dockerfile .
          docker buildx build --load \
            --tag registry.local/paladin/paladin-console:latest \
            --file frontend/deploy/Dockerfile frontend

      - name: Bring up the stack
        working-directory: .
        run: |
          docker compose -p paladin-rpc-surface \
            -f frontend/tests/e2e/docker-compose.test.yaml up --wait

      # PALADIN_RPC_SURFACE=1 turns the skip into a failure. Without it an
      # unreachable stack would still be excused, which is the state this step
      # exists to end.
      - name: RPC surface gate
        env:
          PALADIN_RPC_SURFACE: "1"
        run: |
          go test -tags=integration -count=1 -timeout=10m \
            -run 'Surface|RPC' ./tests/integration/...

      - name: Stack logs on failure
        if: failure()
        working-directory: .
        run: |
          docker compose -p paladin-rpc-surface \
            -f frontend/tests/e2e/docker-compose.test.yaml logs --tail 200

      - name: Tear the stack down
        if: always()
        working-directory: .
        run: |
          docker compose -p paladin-rpc-surface \
            -f frontend/tests/e2e/docker-compose.test.yaml down -v
