# Playwright end-to-end suite against the full docker-compose stack (BACKLOG:
# "Playwright e2e suite wired into CI"). Runtime sign-off was completed
# 2026-06-30 (17/17 green, 170/170 under --repeat-each=10, <10s single run),
# and the suite has since grown the tenant-switch scenario (18 tests).
#
# The suite's Playwright webServer boots tests/e2e/docker-compose.test.yaml
# itself; this job only prepares what the compose stack can't provide:
#   - the two images the compose file references by :latest tag
#   - an S3-compatible endpoint (MinIO here; the lab uses Garage) exported
#     via PALADIN_E2E_S3_* — compose containers reach it via the docker0
#     gateway (172.17.0.1 on GitHub's Linux runners), the presigned-PUT
#     path from the Playwright host via localhost.
#
# NOT a required check yet: enabling required status checks is blocked on
# the account's Actions billing (see BACKLOG "Branch protection"). Flip it
# together with the other contexts once runs go green.

name: E2E

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        working-directory: backend
        run: |
          docker buildx build --load \
            --tag registry.local/paladin/paladin-core:latest \
            --file deploy/Dockerfile \
            --build-arg APP_VERSION=e2e-${{ github.sha }} \
            --build-arg GIT_COMMIT_HASH=${{ github.sha }} \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Build UI image
        working-directory: frontend
        run: |
          docker buildx build --load \
            --tag registry.local/paladin/paladin-ui:latest \
            --file deploy/Dockerfile \
            --build-arg APP_VERSION=e2e-${{ github.sha }} \
            --build-arg GIT_COMMIT_HASH=${{ github.sha }} \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Start MinIO (S3 endpoint for the stack)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=paladin-e2e-access \
            -e MINIO_ROOT_PASSWORD=paladin-e2e-secret-key \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 1
          done
          docker run --rm --network host --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c "
            mc alias set local http://localhost:9000 paladin-e2e-access paladin-e2e-secret-key &&
            mc mb local/paladin-e2e"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches frontend/deploy/Dockerfile's NODE_VERSION.
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright suite
        working-directory: frontend
        env:
          CI: "true"
          # Compose containers reach the runner's MinIO through the docker0
          # gateway; the Playwright host (presigned PUTs) via localhost.
          PALADIN_E2E_S3_ENDPOINT: http://172.17.0.1:9000
          PALADIN_E2E_S3_PUBLIC_ENDPOINT: http://localhost:9000
          PALADIN_E2E_S3_BUCKET: paladin-e2e
          PALADIN_E2E_S3_ACCESS_KEY: paladin-e2e-access
          PALADIN_E2E_S3_SECRET_KEY: paladin-e2e-secret-key
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/tests/e2e/test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p paladin-e2e -f frontend/tests/e2e/docker-compose.test.yaml logs --tail 200
