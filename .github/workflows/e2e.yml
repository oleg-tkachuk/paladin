# Playwright end-to-end suite against the full docker-compose stack (BACKLOG:
# "Playwright e2e suite wired into CI"). Runtime sign-off was completed
# 2026-06-30 (17/17 green, 170/170 under --repeat-each=10, <10s single run),
# and the suite has since grown the tenant-switch scenario (18 tests).
#
# The suite's Playwright webServer boots tests/e2e/docker-compose.test.yaml
# itself; this job only prepares what the compose stack can't provide:
#   - the two images the compose file references by :latest tag
#
# Storage is NOT prepared here: the compose file brings up its own MinIO,
# so this job and a contributor's laptop run byte-identical stacks.
#
# NOT a required check yet: enabling required status checks is blocked on
# the account's Actions billing (see BACKLOG "Branch protection"). Flip it
# together with the other contexts once runs go green.

name: E2E

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image builds FROM golang/node alpine bases and the stack pulls
      # minio/minio + minio/mc — all Docker Hub. Authenticate when the secrets
      # exist to avoid anonymous-pull 429s (no-op otherwise).
      - name: Docker Hub login (optional)
        uses: ./.github/actions/dockerhub-login
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        # Repo-root context (not backend/): the Dockerfile COPYs backend/ AND
        # the nested capability/ module (consumed via a `replace` directive),
        # which a backend/-scoped context cannot reach. Mirrors the Taskfile's
        # DOCKER_CONTEXT=repo-root. The root .dockerignore keeps the context lean.
        run: |
          docker buildx build --load \
            --tag registry.local/paladin/paladin-core:latest \
            --file backend/deploy/Dockerfile \
            --build-arg APP_VERSION=e2e-${{ github.sha }} \
            --build-arg GIT_COMMIT_HASH=${{ github.sha }} \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Build UI image
        working-directory: frontend
        run: |
          docker buildx build --load \
            --tag registry.local/paladin/paladin-console:latest \
            --file deploy/Dockerfile \
            --build-arg APP_VERSION=e2e-${{ github.sha }} \
            --build-arg GIT_COMMIT_HASH=${{ github.sha }} \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches frontend/deploy/Dockerfile's NODE_VERSION.
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      # Pull the stack's third-party images BEFORE Playwright starts timing.
      # The webServer step allows 120s for `compose up --wait`, which was
      # sized when postgres was the only image to fetch; a cold MinIO pull
      # inside that window would surface as a webServer timeout rather than
      # as what it is.
      #
      # Services named explicitly rather than a bare `pull`: the paladin-core /
      # paladin-console images were built into the local daemon by the steps
      # above and exist in no registry, so pulling them fails.
      - name: Pre-pull compose images
        run: |
          docker compose -p paladin-e2e \
            -f frontend/tests/e2e/docker-compose.test.yaml \
            pull --quiet postgres minio minio-setup

      - name: Run Playwright suite
        working-directory: frontend
        env:
          CI: "true"
          # No PALADIN_E2E_S3_* here on purpose. Storage is a service inside
          # docker-compose.test.yaml, so CI runs the same stack a
          # contributor runs — the runner-host MinIO this job used to
          # start, and the docker0-gateway address needed to reach it,
          # were a CI-only third configuration and are gone.
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/tests/e2e/test-results/
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: docker compose -p paladin-e2e -f frontend/tests/e2e/docker-compose.test.yaml logs --tail 200
