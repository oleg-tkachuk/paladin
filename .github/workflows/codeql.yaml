name: CodeQL

# Static analysis for the four languages in the tree, reported as code
# scanning alerts. Separate from ci.yaml: it is slower than the gate, and an
# alert is triaged on the Security tab rather than blocking a merge.

# A change that touches only documentation analyses nothing new, and the Go
# leg builds three modules to find that out; paths-ignore skips the run. The
# weekly schedule still covers everything.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      # Documentation only. Mirrors INERT in scripts/ci-groups.sh;
      # scripts/ci-groups.test.sh fails when the two disagree.
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - NOTICE
      - .gitignore
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.svg"
      - "**/*.gif"
  pull_request:
    paths-ignore: *docs
  schedule:
    # Weekly, so new queries reach code that has not changed.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # A plain name: GitHub appends the matrix value, "(go)". An interpolated one
    # is shown raw whenever the job is skipped.
    name: Analyze
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Only the language, so it alone is appended to the name. Go is built
        # by hand (see build-mode below); the rest need no build.
        language: [go, javascript-typescript, python, actions]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # The modules live in subdirectories, so setup-go finds no go.sum at
          # the root to key its cache on unless told where they are.
          cache-dependency-path: |
            backend/go.sum
            capability/go.sum
            sdk/go/go.sum

      - name: Initialise CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          # Go is built by hand: the tree holds three modules (backend,
          # capability, sdk/go), and autobuild finds none of them at the root.
          build-mode: ${{ matrix.language == 'go' && 'manual' || 'none' }}

      - name: Build the Go modules
        if: matrix.language == 'go'
        run: |
          for module in backend capability sdk/go; do
            (cd "$module" && go build ./...)
          done

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
