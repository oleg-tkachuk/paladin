name: Badges

# Publishes the stack versions the README's badges show — Go, PostgreSQL,
# Connect RPC, Cedar, MCP, Next.js — to the `badges` branch, read from the
# files that pin them (.github/ci/badges.ts). shields.io reads JSON, YAML
# and TOML, but not go.mod, so the versions are published as one JSON file
# there. The branch holds only that file; main is never written.
on:
  push:
    branches: [main]
    paths:
      - backend/go.mod
      - frontend/package.json
      - backend/deploy/docker-compose.yaml
      - .github/ci/badges.ts
      - .github/workflows/badges.yaml
  # A first publish, or a re-publish, without a change to those files.
  workflow_dispatch:

permissions: {}

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  publish:
    name: Publish the badge versions
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # push the badges branch
    steps:
      # Credentials kept: the last step pushes the badges branch. The only
      # third-party code this job runs is the CI scripts' dependencies, from
      # their lockfile with no install script.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      # An orphan branch with one file; a commit only when a version moved.
      - name: Publish the versions to the badges branch
        run: node .github/ci/badges.ts publish
