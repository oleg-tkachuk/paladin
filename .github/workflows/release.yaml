name: Release

# Dispatched by ci.yaml once the checks on a push to main have passed.
#
# A release is a tag and its notes — nothing else. No image is built, no chart
# is packaged, nothing is pushed to a registry: those are local tasks
# (`task deploy`), run against the tag this creates.
#
# workflow_run is the obvious trigger and is refused by zizmor's
# dangerous-triggers audit. A plain `push` trigger would not help: GitHub
# starts no workflow run from an event GITHUB_TOKEN caused.
# repository_dispatch is one of the documented exceptions that always create a
# run, so CI dispatches this with its own GITHUB_TOKEN — no extra credential,
# no dangerous trigger.
#
# Deliberately no workflow_dispatch: it would let a release be cut from an
# untested main with one click, which is what the gate in ci.yaml prevents.
on:
  repository_dispatch:
    types: [release]

permissions: {}

concurrency:
  # Two dispatches close together would both compute "next version" from the
  # same last tag and could push conflicting ones. Never cancel-in-progress: a
  # run killed mid-push can leave a tag with no release behind it.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Compute the tag and publish the release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release pushes the tag; gh creates the release
    steps:
      # No persist-credentials: false — semantic-release pushes the tag it
      # creates, so this is the one checkout here that needs its credentials.
      #
      # Deliberately no `ref:`. A repository_dispatch run checks out the head
      # of the default branch, which is a BRANCH — and semantic-release has to
      # be on one of its configured release branches to release at all. The
      # dispatched sha is printed below instead.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      # A dispatched run is not linked to its trigger in the UI the way a
      # workflow_run is, so without this the run says nothing about where it
      # came from.
      - name: Say what dispatched this
        env:
          SHA: ${{ github.event.client_payload.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: printf 'dispatched by CI run %s for commit %s\n' "${CI_RUN:-unknown}" "${SHA:-unknown}"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache: this job holds a write token, and a cache
          # another run wrote is not something to restore into it.
          package-manager-cache: false

      # The root lockfile pins semantic-release and its preset, so this
      # installs the versions committed here rather than a marketplace
      # action's own.
      - name: Install semantic-release
        run: npm ci

      - name: Compute and push the tag
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Read from git rather than parsing semantic-release's prose: it tags the
      # commit that was checked out, so no new tag here means no release was
      # due and there is nothing to publish. Only v* tags: the api/vX.Y.Z
      # proto baselines can point at the same commit and are not releases.
      - name: Publish the release for the tag it just pushed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$(git tag --points-at HEAD | grep -E '^v[0-9]' | head -1 || true)"

          if [ -z "$tag" ]; then
            printf '%s\n' "no new tag on this commit — no release was due"
            exit 0
          fi

          # Notes for people, built from merged pull requests and shaped by
          # .github/release.yml.
          gh release create "$tag" --generate-notes --verify-tag
