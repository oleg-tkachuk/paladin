name: Release

on:
  push:
    branches:
      - main
    # Trigger on either half of the monorepo plus root release
    # machinery. semantic-release walks commit history across the
    # whole tree — this filter just avoids unnecessary workflow runs
    # for pure docs / tooling changes.
    paths:
      - "backend/**"
      - "frontend/**"
      - "tasks/**"
      - "Taskfile.yaml"
      - "release.config.cjs"
      - "package.json"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for semantic-release to analyze commits

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          semantic_version: 19
          extra_plugins: |
            conventional-changelog-conventionalcommits
