name: Release

# Dispatched by ci.yaml once the checks on a push to main have passed.
#
# A product release is a tag, both components published to GHCR at that tag
# (a multi-arch image and a Helm chart each), and the GitHub release that
# announces them. A commit that passed CI and cut no tag is published too, as a
# dev build at the version the library derives for it, <next patch>-dev.<…>,
# or <x.y.z>-rc.<n>.dev.<…> after a release candidate: the dev cluster follows those, so it runs every change as it lands. A dev
# build is not announced and moves no floating tag. Each SDK releases too, as a
# tag of its own (sdk/go/v*, sdk/python/v*), when a commit touched it. The announcement comes last and only when every component
# published: a release whose charts are missing is not announced. Nothing is
# published when no tag was due.
#
# If a component fails to publish, the tag exists with no release beside it.
# Re-run the failed jobs: both pushes are idempotent, and the announcement
# follows once they succeed.
#
# workflow_run is the obvious trigger and is refused by zizmor's
# dangerous-triggers audit. A plain `push` trigger would not help: GitHub
# starts no workflow run from an event GITHUB_TOKEN caused.
# repository_dispatch is one of the documented exceptions that always create a
# run, so CI dispatches this with its own GITHUB_TOKEN — no extra credential,
# no dangerous trigger.
#
# Two triggers, two jobs to do (ADR-0034):
#
#   repository_dispatch  CI, after every green push to main: each SDK's tag when
#                        one is due, and a dev build of the product for the
#                        dev cluster. No product tag.
#   workflow_dispatch    an operator, when the product is to be released: the
#                        product's tag from every change since the last one, so
#                        however many breaking changes it carries make one major.
#                        The prerelease channel tags a release candidate of that
#                        version instead, vX.Y.Z-rc.N, published like a release
#                        and announced as a prerelease (.github/ci/prerelease.ts).
#
# A manual run releases main's head only once CI passed on it
# (.github/ci/release-head.ts): a click cannot release an untested commit, which is
# what dispatching from CI guarantees the other trigger.
# Each run is named for what it releases: a dev build, with its version when CI
# derived one (dispatch-release.ts), or the commit otherwise; a release
# candidate; a release. A run's name is fixed when it starts, and a release's
# version is derived inside it by semantic-release, so a release and a
# candidate are named without one; their tag names the GitHub release.
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('DevRelease {0}', github.event.client_payload.label || github.event.client_payload.sha)
      || (inputs.channel == 'prerelease' && 'PreRelease' || 'Release') }}

on:
  repository_dispatch:
    types: [release]
  workflow_dispatch:
    # The one input picks the tag cut, vX.Y.Z or vX.Y.Z-rc.N, not what is
    # built: the build is the commit CI passed on main, from its own tree.
    # checkov:skip=CKV_GHA_7: the channel names a release, it does not change the build
    inputs:
      channel:
        description: A release, or a release candidate (vX.Y.Z-rc.N)
        type: choice
        options: [release, prerelease]
        default: release

permissions: {}

# Pinned tools, the same versions ci.yaml pins.
env:
  # renovate: datasource=github-releases depName=go-task/task
  TASK_VERSION: "3.54.0"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v4.3.0"
  # renovate: datasource=github-releases depName=mikefarah/yq
  YQ_VERSION: "v4.54.1"
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: "v3.1.3"
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: "v1.54.1"
  # renovate: datasource=github-releases depName=google/go-containerregistry
  CRANE_VERSION: "v0.22.1"
  # Who issues the OIDC token keyless signing is bound to; verification pins it.
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
  # Where both components publish. Must match image.repository in the charts'
  # values.yaml and the defaults in Taskfile.yaml; verify:publish-target
  # checks all three.
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  PLATFORMS: linux/amd64,linux/arm64
  # The path segment the task library pushes charts under
  # (oci://<registry>/<namespace>/charts); publish-target.test.sh checks the two agree.
  CHART_PATH: charts

concurrency:
  # Two dispatches close together would both compute "next version" from the
  # same last tag and could push conflicting ones. Never cancel-in-progress: a
  # run killed mid-push can leave a tag with no release behind it.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Compute and push the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release pushes the tag
    outputs:
      # Empty when no release was due; announce keys off it.
      tag: ${{ steps.tag.outputs.tag }}
      # What publish builds: the release at its tag, or a dev build of the
      # commit CI passed (.github/ci/publish-plan.ts). Empty when it builds nothing.
      publish_kind: ${{ steps.plan.outputs.kind }}
      publish_ref: ${{ steps.plan.outputs.ref }}
    steps:
      # No persist-credentials: false — semantic-release pushes the tag it
      # creates, so this is the one checkout here that needs its credentials.
      #
      # Deliberately no `ref:`. A repository_dispatch run checks out the head
      # of the default branch, which is a BRANCH — and semantic-release has to
      # be on one of its configured release branches to release at all. The
      # dispatched sha is printed below instead.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      # A dispatched run is not linked to its trigger in the UI the way a
      # workflow_run is, so without this the run says nothing about where it
      # came from.
      - name: Say what dispatched this
        env:
          SHA: ${{ github.event.client_payload.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: printf 'dispatched by CI run %s for commit %s\n' "${CI_RUN:-unknown}" "${SHA:-unknown}"

      # Node, the CI scripts and semantic-release, from their lockfiles.
      # setup-ci restores no dependency cache: this job holds a write token,
      # and a cache another run wrote is not something to restore into it.
      - name: Set up the CI scripts and the release tooling
        uses: ./.github/actions/setup-ci
        with:
          release-tooling: "true"

      # The checkout above is main's head. Dispatched by CI, that can be newer
      # than the commit whose CI dispatched this run: only that commit is
      # released, and a newer head by its own CI run. Run by hand, it is the
      # head itself, released only once CI passed on it. See
      # .github/ci/release-head.ts.
      - name: Release only a commit CI passed
        id: head
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.client_payload.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ci/release-head.ts

      # What HEAD carried before this run, so the step after it can tell a tag
      # it pushed from one an earlier dispatch to the same commit pushed.
      - name: Note the tags already on HEAD
        if: steps.head.outputs.release == 'true'
        run: node .github/ci/release-tags.ts before "$RUNNER_TEMP/tags-before"

      # The product releases by hand only: a train of every change since the
      # last release, rather than a release per merge.
      - name: Compute and push the tag
        if: steps.head.outputs.release == 'true' && github.event_name == 'workflow_dispatch' && inputs.channel == 'release'
        working-directory: .github/release
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STREAM: product

      # A release candidate of the version the release would be: the same
      # pipeline below publishes and announces it. See .github/ci/prerelease.ts.
      - name: Tag a release candidate
        if: steps.head.outputs.release == 'true' && github.event_name == 'workflow_dispatch' && inputs.channel == 'prerelease'
        run: node .github/ci/prerelease.ts

      # Each SDK versions on its own, from the commits that touch it
      # (.github/release/release.config.cjs). Its tag is the release: the Go
      # proxy and pip read the tag, so nothing is published here, and the
      # product's publish below keys on its own tag alone.
      - name: Compute and push the Go SDK tag
        if: steps.head.outputs.release == 'true' && github.event_name == 'repository_dispatch'
        working-directory: .github/release
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STREAM: go-sdk

      # A stream with no tag would start at 1.0.0, a tag the ruleset then
      # keeps for good; its first is cut by hand. See .github/ci/stream-seeded.ts.
      - name: Check the Python SDK stream has a tag
        id: python-seeded
        if: steps.head.outputs.release == 'true' && github.event_name == 'repository_dispatch'
        run: node .github/ci/stream-seeded.ts
        env:
          RELEASE_STREAM: python-sdk

      - name: Compute and push the Python SDK tag
        if: steps.head.outputs.release == 'true' && github.event_name == 'repository_dispatch' && steps.python-seeded.outputs.seeded == 'true'
        working-directory: .github/release
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STREAM: python-sdk

      # The upgrade guide's Unreleased sections this run shipped, named with
      # its tags (.github/ci/upgrade-sections.ts). Before the SDK's notes,
      # which link a section by its tag; the rename reaches main as a pull
      # request at the end of the job.
      - name: Name the upgrade sections this release shipped
        id: sections
        if: steps.head.outputs.release == 'true'
        env:
          # Which tags on HEAD are published is GitHub's to say.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ci/upgrade-sections.ts name "$RUNNER_TEMP/tags-before"

      # A GitHub release beside each SDK tag this run cut, if any, with notes of
      # the stream's own commits, and the Go proxy told of a Go SDK tag. The
      # run's summary lists each SDK's release, or that it had none. Never the
      # latest release: that stays the product's. See .github/ci/sdk-release.ts.
      - name: Publish the SDK releases
        if: steps.head.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ci/sdk-release.ts "$RUNNER_TEMP/tags-before"

      # Read from git rather than parsing semantic-release's prose: it tags the
      # commit that was checked out, so no new tag here means no release was
      # due and there is nothing to publish — unless HEAD carries a tag with no
      # release, left by a run that failed after pushing it, which a re-run
      # publishes. "New" is against the list taken above; see
      # .github/ci/release-tags.ts for why a tag on HEAD is not enough.
      - name: Read the tag it just pushed
        id: tag
        if: steps.head.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ci/release-tags.ts product "$RUNNER_TEMP/tags-before"

      # Every commit that passed CI is published: as the release when this run
      # cut its tag, and otherwise as a dev build the dev cluster follows.
      - name: Decide what to publish
        id: plan
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          # A CI dispatch publishes its commit even when main has moved past
          # it: the dev build is of that sha, not of the head. A manual run
          # that cut no tag publishes nothing; its head's dev build came with
          # its own CI run.
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.client_payload.sha }}
        run: node .github/ci/publish-plan.ts

      # main is protected, so the named sections go in as a pull request,
      # opened with AUTOMERGE_TOKEN: one GITHUB_TOKEN opens starts no CI and
      # would never merge. See .github/ci/upgrade-sections.ts.
      - name: Propose the named upgrade sections
        if: steps.sections.outputs.tags != ''
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          TAGS: ${{ steps.sections.outputs.tags }}
        run: node .github/ci/upgrade-sections.ts propose

  # One job per component. The chart is gated and pushed through the same task
  # library `task -t Taskfile.local.yaml deploy` uses; the image is built here
  # instead, because the library builds for the host's architecture only and
  # the published image is multi-arch.
  publish:
    # A plain name: GitHub appends the matrix value, "(backend)". An
    # interpolated one is shown raw whenever the job is skipped.
    name: Publish
    needs: [release]
    if: needs.release.outputs.publish_ref != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image and the chart to GHCR
      id-token: write # keyless signing: Sigstore binds the signature to this workflow
    strategy:
      # A failure in one component must not cancel the other halfway through a
      # push; each is re-runnable on its own, and both pushes are idempotent.
      fail-fast: false
      matrix:
        # The component directories, as in the monorepo fan-out.
        component: [backend, frontend]
    env:
      COMPONENT: ${{ matrix.component }}
      TAG: ${{ needs.release.outputs.tag }}
      KIND: ${{ needs.release.outputs.publish_kind }}
    steps:
      # The tag, or the tested commit for a dev build — not the branch head:
      # main may have moved on since the release job ran. fetch-depth: 0
      # because the library derives the version with `git describe`, which
      # needs the tags.
      - name: Check out what is published
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.publish_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      # The tree is not dirtied: the scripts' node_modules is ignored, so the
      # version derived below is the commit's.
      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      - name: Set up yq
        run: node .github/ci/install-tool.ts yq

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Everything the image build needs, read from the component's Taskfile
      # and the task library rather than restated here, and refused when the
      # version is not one this kind of publish may push. See
      # .github/ci/publish-target.ts.
      - name: Resolve the version and the image
        id: resolve
        run: node .github/ci/publish-target.ts

      # Before anything is pushed: a chart regression must not ship an image
      # it cannot deploy.
      - name: Verify the chart
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: task --yes "${COMPONENT}:release:chart:verify" APP_VERSION="$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: this job holds a write token, and a cache another run
      # wrote is not something to build a published image from.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.resolve.outputs.context }}
          file: ${{ steps.resolve.outputs.file }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.resolve.outputs.version }}
            GIT_COMMIT_HASH=${{ steps.resolve.outputs.sha }}
            BUILD_TIME=${{ steps.resolve.outputs.build_time }}

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Set up syft
        id: syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # Keyless: the certificate names this workflow at the ref it ran from,
      # and the script verifies exactly that identity before anything else is
      # published. docs/how-changes-land.md shows users the same check.
      - name: Sign the image and attest its SBOMs
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: node .github/ci/sign.ts image "$IMAGE" "$DIGEST" "${RUNNER_TEMP}/sbom"

      # crane reads a pushed chart's digest; `helm push` reports it only as a
      # line of text.
      - name: Set up crane
        run: node .github/ci/install-tool.ts crane

      - name: Keep the SBOMs for the release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.component }}
          path: ${{ runner.temp }}/sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 7

      # After the image: the chart's appVersion names it, so a chart pushed
      # first would point at a tag that does not exist yet.
      - name: Push the chart
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned rather than re-derived: the image is already tagged with it,
          # and a tree dirtied by an earlier step would derive a -dev version.
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | helm registry login "$REGISTRY" --username "$ACTOR" --password-stdin
          task --yes "${COMPONENT}:release:chart:push" \
            GLOBAL_REGISTRY="$REGISTRY" IMAGE_NAMESPACE="$IMAGE_NAMESPACE" APP_VERSION="$VERSION"

      # Same identity and the same in-job verification as the image.
      - name: Sign the chart
        env:
          CHART: ${{ steps.resolve.outputs.chart }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: node .github/ci/sign.ts chart "${CHART}:${VERSION}"

      # Last, once the new dev build is pushed and signed: the older dev builds
      # of this component's image and chart go, the newest stays, and a
      # release run deletes nothing. GHCR has no retention setting of its own.
      - name: Plan the cleanup of older dev builds
        id: cleanup
        if: env.KIND == 'dev'
        env:
          PACKAGE: ${{ steps.resolve.outputs.package }}
          CHART_PACKAGE: ${{ steps.resolve.outputs.chart_package }}
        run: node .github/ci/ghcr-cleanup.ts

      # Not actions/delete-package-versions: it counts every package version
      # alike, and a multi-arch image is several — its platform manifests, its
      # signatures and attestations are versions too, untagged or tagged
      # sha256-<digest>. Keeping "the newest N versions" with it deletes parts
      # of the images it keeps. This one deletes an image with its children and
      # leaves those of the images it keeps.
      - name: Delete older dev builds
        if: env.KIND == 'dev'
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: ${{ steps.cleanup.outputs.packages }}
          delete-tags: ${{ steps.cleanup.outputs.delete_tags }}
          keep-n-tagged: ${{ steps.cleanup.outputs.keep }}
          dry-run: ${{ steps.cleanup.outputs.dry_run }}

  # The GitHub release, once every component's image and chart is in GHCR.
  # `needs` alone would skip this when publish fails; the explicit result
  # check also keeps it from running if publish was skipped or cancelled.
  announce:
    name: Publish the release
    needs: [release, publish]
    if: needs.release.outputs.tag != '' && needs.publish.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # create the release
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      # Before the SBOMs: a checkout cleans the workspace.
      - name: Check out the scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci
            .github/actions

      - name: Set up the CI scripts
        uses: ./.github/actions/setup-ci

      - name: Fetch the SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true

      # Notes for people, generated from merged pull requests and shaped by
      # .github/release.yml, with each image's per-platform SBOM attached. See
      # .github/ci/announce.ts.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/ci/announce.ts sbom
