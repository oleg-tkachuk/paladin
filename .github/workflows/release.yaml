name: Release

# Dispatched by ci.yaml once the checks on a push to main have passed.
#
# A product release is a tag, both components published to GHCR at that tag
# (a multi-arch image and a Helm chart each), and the GitHub release that
# announces them. The SDK and the capability module release too, as tags of
# their own (sdk/go/v*, capability/v*), when a commit touched them. The announcement comes last and only when every component
# published: a release whose charts are missing is not announced. Nothing is
# published when no tag was due.
#
# If a component fails to publish, the tag exists with no release beside it.
# Re-run the failed jobs: both pushes are idempotent, and the announcement
# follows once they succeed.
#
# workflow_run is the obvious trigger and is refused by zizmor's
# dangerous-triggers audit. A plain `push` trigger would not help: GitHub
# starts no workflow run from an event GITHUB_TOKEN caused.
# repository_dispatch is one of the documented exceptions that always create a
# run, so CI dispatches this with its own GITHUB_TOKEN — no extra credential,
# no dangerous trigger.
#
# Deliberately no workflow_dispatch: it would let a release be cut from an
# untested main with one click, which is what the gate in ci.yaml prevents.
on:
  repository_dispatch:
    types: [release]

permissions: {}

# Pinned tools, the same versions ci.yaml pins.
env:
  # renovate: datasource=github-releases depName=go-task/task
  TASK_VERSION: "3.53.1"
  # renovate: datasource=github-releases depName=helm/helm
  HELM_VERSION: "v4.3.0"
  # renovate: datasource=github-releases depName=mikefarah/yq
  YQ_VERSION: "v4.53.6"
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: "v3.1.3"
  # renovate: datasource=github-releases depName=anchore/syft
  SYFT_VERSION: "v1.54.0"
  # renovate: datasource=github-releases depName=google/go-containerregistry
  CRANE_VERSION: "v0.22.1"
  # Who issues the OIDC token keyless signing is bound to; verification pins it.
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
  # Where both components publish. Must match image.repository in the charts'
  # values.yaml and the defaults in Taskfile.yaml; verify:publish-target
  # checks all three.
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  PLATFORMS: linux/amd64,linux/arm64
  # The path segment the task library pushes charts under
  # (oci://<registry>/<namespace>/charts); publish-target.test.sh checks the two agree.
  CHART_PATH: charts

concurrency:
  # Two dispatches close together would both compute "next version" from the
  # same last tag and could push conflicting ones. Never cancel-in-progress: a
  # run killed mid-push can leave a tag with no release behind it.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Compute and push the tag
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write # semantic-release pushes the tag
    outputs:
      # Empty when no release was due; publish and announce key off it.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # No persist-credentials: false — semantic-release pushes the tag it
      # creates, so this is the one checkout here that needs its credentials.
      #
      # Deliberately no `ref:`. A repository_dispatch run checks out the head
      # of the default branch, which is a BRANCH — and semantic-release has to
      # be on one of its configured release branches to release at all. The
      # dispatched sha is printed below instead.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release derives the next version from the commit history.
          fetch-depth: 0

      # A dispatched run is not linked to its trigger in the UI the way a
      # workflow_run is, so without this the run says nothing about where it
      # came from.
      - name: Say what dispatched this
        env:
          SHA: ${{ github.event.client_payload.sha }}
          CI_RUN: ${{ github.event.client_payload.ci_run_id }}
        run: printf 'dispatched by CI run %s for commit %s\n' "${CI_RUN:-unknown}" "${SHA:-unknown}"

      # The checkout above is main's head, which can be newer than the commit
      # whose CI dispatched this run. Only that commit is released; a newer
      # head is released by its own CI run. See scripts/release-head-check.sh.
      - name: Release only the commit CI passed
        id: head
        env:
          SHA: ${{ github.event.client_payload.sha }}
        run: ./scripts/release-head-check.sh "$SHA" >>"$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.head.outputs.release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache: this job holds a write token, and a cache
          # another run wrote is not something to restore into it.
          package-manager-cache: false

      # The root lockfile pins semantic-release and its preset, so this
      # installs the versions committed here rather than a marketplace
      # action's own.
      - name: Install semantic-release
        if: steps.head.outputs.release == 'true'
        run: npm ci

      # What HEAD carried before this run, so the step after it can tell a tag
      # it pushed from one an earlier dispatch to the same commit pushed.
      - name: Note the tags already on HEAD
        if: steps.head.outputs.release == 'true'
        run: git tag --points-at HEAD >"$RUNNER_TEMP/tags-before"

      - name: Compute and push the tag
        if: steps.head.outputs.release == 'true'
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STREAM: product

      # The SDK and the capability module version on their own, from the
      # commits that touch them (release.config.cjs). Their tag is the
      # release: the Go proxy and pip read the tag, so nothing is published
      # here, and the product's publish below keys on its own tag alone.
      - name: Compute and push the SDK tag
        if: steps.head.outputs.release == 'true'
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STREAM: sdk

      - name: Compute and push the capability tag
        if: steps.head.outputs.release == 'true'
        run: npx semantic-release --no-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_STREAM: capability

      # A GitHub release beside each module tag this run cut, with notes of
      # the stream's own commits (scripts/stream-release-notes.sh), and the Go
      # proxy told of the tag. Never the latest release: that stays the
      # product's.
      - name: Publish the SDK and capability releases
        if: steps.head.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in $(./scripts/new-release-tag.sh "$RUNNER_TEMP/tags-before" streams); do
            notes="$(./scripts/stream-release-notes.sh "$tag")"
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false \
              --title "$(head -1 <<<"$notes")" --notes "$(tail -n +2 <<<"$notes")"
            # So `go get …@latest`, and the README's SDK badge, see it now
            # rather than whenever the proxy next refreshes. The release
            # stands without it.
            ./scripts/warm-go-proxy.sh "$tag" ||
              echo "::warning::the Go proxy did not take $tag yet; it will on its own"
          done

      # Read from git rather than parsing semantic-release's prose: it tags the
      # commit that was checked out, so no new tag here means no release was
      # due and there is nothing to publish — unless HEAD carries a tag with no
      # release, left by a run that failed after pushing it, which a re-run
      # publishes. "New" is against the list taken above — see
      # scripts/new-release-tag.sh for why a tag on HEAD is not enough.
      - name: Read the tag it just pushed
        id: tag
        if: steps.head.outputs.release == 'true'
        env:
          # A tag on HEAD without a release is one a failed run left behind;
          # new-release-tag.sh asks GitHub which, so a re-run publishes it.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$(./scripts/new-release-tag.sh "$RUNNER_TEMP/tags-before")"

          if [ -z "$tag" ]; then
            printf '%s\n' "no new tag from this run — no release was due"
            exit 0
          fi
          printf 'tag=%s\n' "$tag" >>"$GITHUB_OUTPUT"

  # One job per component. The chart is gated and pushed through the same task
  # library `task -t Taskfile.local.yaml deploy` uses; the image is built here
  # instead, because the library builds for the host's architecture only and
  # the published image is multi-arch.
  publish:
    # A plain name: GitHub appends the matrix value, "(backend)". An
    # interpolated one is shown raw whenever the job is skipped.
    name: Publish
    needs: [release]
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image and the chart to GHCR
      id-token: write # keyless signing: Sigstore binds the signature to this workflow
    strategy:
      # A failure in one component must not cancel the other halfway through a
      # push; each is re-runnable on its own, and both pushes are idempotent.
      fail-fast: false
      matrix:
        # The component directories, as in the monorepo fan-out.
        component: [backend, frontend]
    env:
      COMPONENT: ${{ matrix.component }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      # The tag, not the branch head: main may have moved on since the release
      # job ran. fetch-depth: 0 because the library derives the version with
      # `git describe`, which needs the tags.
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up yq
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Everything the image build needs, read from the component's Taskfile
      # and the task library rather than restated here.
      - name: Resolve the version and the image
        id: resolve
        run: |
          set -euo pipefail

          # --yes accepts the first-fetch trust prompt for the task library.
          version="$(task --yes "${COMPONENT}:release:version")"
          if [ "$version" != "${TAG#v}" ]; then
            printf 'the library derives %s, the tag is %s — refusing to publish\n' "$version" "$TAG" >&2
            exit 1
          fi

          taskfile="${COMPONENT}/Taskfile.yaml"
          name="$(yq -r '.vars.PROJECT_NAME' "$taskfile")"
          # The library names the chart CHART_NAME, else PROJECT_NAME.
          chart="$(yq -r '.vars.CHART_NAME // .vars.PROJECT_NAME' "$taskfile")"
          dockerfile="$(yq -r '.vars.DOCKERFILE' "$taskfile")"
          context="$(yq -r '.vars.DOCKER_CONTEXT' "$taskfile")"

          {
            printf 'version=%s\n' "$version"
            printf 'image=%s/%s/%s\n' "$REGISTRY" "$IMAGE_NAMESPACE" "$name"
            printf 'chart=%s/%s/%s/%s\n' "$REGISTRY" "$IMAGE_NAMESPACE" "$CHART_PATH" "$chart"
            printf 'file=%s/%s\n' "$COMPONENT" "$dockerfile"
            printf 'context=%s/%s\n' "$COMPONENT" "$context"
            # The same three values the library's image:build passes.
            printf 'sha=%s\n' "$(git rev-parse --short=8 HEAD)"
            printf 'build_time=%s\n' "$(TZ=UTC date +%Y-%m-%dT%H:%M:%S%z)"
          } >>"$GITHUB_OUTPUT"

      # Before anything is pushed: a chart regression must not ship an image
      # it cannot deploy.
      - name: Verify the chart
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: task --yes "${COMPONENT}:release:chart:verify" APP_VERSION="$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache: this job holds a write token, and a cache another run
      # wrote is not something to build a published image from.
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.resolve.outputs.context }}
          file: ${{ steps.resolve.outputs.file }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.resolve.outputs.image }}:${{ steps.resolve.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.resolve.outputs.version }}
            GIT_COMMIT_HASH=${{ steps.resolve.outputs.sha }}
            BUILD_TIME=${{ steps.resolve.outputs.build_time }}

      - name: Set up cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Set up syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      # Keyless: the certificate names this workflow at the ref it ran from,
      # and the script verifies exactly that identity before anything else is
      # published. docs/how-changes-land.md shows users the same check.
      - name: Sign the image and attest its SBOMs
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          PATH="$(dirname "$SYFT"):$PATH"
          export CERT_IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@${GITHUB_REF}"
          ./scripts/release-sign.sh "$IMAGE" "$DIGEST" "${RUNNER_TEMP}/sbom"

      # crane reads a pushed chart's digest; `helm push` reports it only as a
      # line of text.
      - name: Set up crane
        run: |
          set -euo pipefail
          base="https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}"
          tgz="go-containerregistry_Linux_x86_64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${tgz}"
          curl -fsSL "${base}/checksums.txt" | grep " ${tgz}\$" | sha256sum -c -
          sudo tar -xzf "$tgz" -C /usr/local/bin crane
          crane version

      - name: Keep the SBOMs for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.component }}
          path: ${{ runner.temp }}/sbom/*.spdx.json
          if-no-files-found: error
          retention-days: 7

      # After the image: the chart's appVersion names it, so a chart pushed
      # first would point at a tag that does not exist yet.
      - name: Push the chart
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned rather than re-derived: the image is already tagged with it,
          # and a tree dirtied by an earlier step would derive a -dev version.
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN" | helm registry login "$REGISTRY" --username "$ACTOR" --password-stdin
          task --yes "${COMPONENT}:release:chart:push" \
            GLOBAL_REGISTRY="$REGISTRY" IMAGE_NAMESPACE="$IMAGE_NAMESPACE" APP_VERSION="$VERSION"

      # Same identity and the same in-job verification as the image.
      - name: Sign the chart
        env:
          CHART: ${{ steps.resolve.outputs.chart }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          export CERT_IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yaml@${GITHUB_REF}"
          ./scripts/release-sign-chart.sh "${CHART}:${VERSION}"

  # The GitHub release, once every component's image and chart is in GHCR.
  # `needs` alone would skip this when publish fails; the explicit result
  # check also keeps it from running if publish was skipped or cancelled.
  announce:
    name: Publish the release
    needs: [release, publish]
    if: needs.release.outputs.tag != '' && needs.publish.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write # gh creates the release
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Fetch the SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true

      # Notes for people, built from merged pull requests and shaped by
      # .github/release.yml, with each image's per-platform SBOM attached. The
      # same SBOMs are attested to the images; these copies are for reading.
      # No checkout: gh works against the repository.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag sbom/*.spdx.json
