version: v2
plugins:
  # Local plugin from @bufbuild/protoc-gen-es node_module — avoids
  # the remote-plugin pull that the buf.build registry sometimes
  # makes flaky (CI, network-restricted dev). Same output as the
  # remote variant.
  - local: ./node_modules/.bin/protoc-gen-es
    out: src/gen
    opt: target=ts
inputs:
  - directory: ../proto
  # google.rpc.ErrorInfo, which carries the server's ErrorReason on every
  # error (errorContract.ts reads it). Not imported by any API file, so the
  # input above does not bring it; pinned to the commit ../proto/buf.lock
  # resolves googleapis to, so both generate from the same source.
  - module: buf.build/googleapis/googleapis:004180b77378443887d3b55cabc00384
    paths:
      - google/rpc/error_details.proto
