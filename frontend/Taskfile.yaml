version: "3"

# paladin-console — the operator UI (Next.js).
#
# Release chain and Node gates come from the shared task library; the OrbStack
# no-registry path is shared with the backend through ../tasks/orbstack.task.yaml.

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles.
  # Consuming it from the registry instead of this checkout:
  #   TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//'
  #   TASKLIB_TAG: v1.0.0
  # and each include becomes '{{.TASKLIB}}<module>?ref={{.TASKLIB_TAG}}'.
  TASKLIB: ../../taskfiles

  PROJECT_NAME: paladin-console
  IMAGE_NAMESPACE: paladin
  K8S_NAMESPACE: paladin
  K8S_CONTEXT: '{{.K8S_CONTEXT | default "orbstack"}}'
  GLOBAL_REGISTRY: '{{.GLOBAL_REGISTRY | default "registry.local"}}'
  # `api/*` tags version the proto contract, not this image: they carry a `/`
  # that is invalid in a Docker tag, and a contract bump must not restamp a
  # release.
  VERSION_TAG_EXCLUDE: 'api/*'
  # The shared buildx builder this repo builds through; its cache is separate
  # from the default builder's and needs pruning by name.
  BUILDX_BUILDER: lean
  DOCKERFILE: ./deploy/Dockerfile
  DOCKER_BUILD_FLAGS: --network=host
  # This app is pinned to npm through package-lock.json.
  PM: npm

includes:
  release:   { taskfile: '{{.TASKLIB}}/release', dir: . }
  k8s:       { taskfile: '{{.TASKLIB}}/k8s', dir: . }
  node:  { taskfile: '{{.TASKLIB}}/node', dir: . }
  # OrbStack shares the host's image store, so a build is already visible to
  # the cluster; swap this line for runtime/minikube, runtime/kind, … elsewhere.
  local: { taskfile: '{{.TASKLIB}}/runtime/orbstack', dir: . }

tasks:
  default:
    desc: "List every available task"
    cmds:
      - task --list-all

  deploy:
    desc: "Verify the chart, then publish image + chart to the OCI registry"
    cmds:
      - task: release:deploy

  deploy-local:
    desc: "Build and helm-install into the local cluster — no registry"
    aliases: [deploy-orbstack]
    cmds:
      - task: release:image:build
      - task: local:install

  dev:
    desc: "Run the Next.js development server"
    cmds:
      - task: node:dev

  install:
    desc: "Install dependencies from package-lock.json"
    cmds:
      - task: node:install

  build:
    desc: "Build the production bundle"
    cmds:
      - task: node:build

  test:
    desc: "Run the Vitest suite"
    cmds:
      - task: node:test

  lint:
    desc: "Run ESLint"
    cmds:
      - task: node:lint

  generate:
    desc: "Regenerate the Connect-RPC TypeScript stubs"
    cmds:
      - task: node:generate

  restart:
    desc: "Roll the deployment in {{.K8S_NAMESPACE}}"
    cmds:
      - task: k8s:restart
