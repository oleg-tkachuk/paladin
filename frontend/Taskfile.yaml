version: "3"

# paladin-console — the operator UI (Next.js).
#
# Release chain and Node gates come from the shared task library; the OrbStack
# no-registry path is shared with the backend through ../tasks/orbstack.task.yaml.

silent: true

vars:
  # Shared task library — github.com/oleg-tkachuk/taskfiles, pinned.
  # Working on the library itself: point this at a checkout beside the
  # repository instead, keeping the %s:
  #   TASKLIB: '../../taskfiles/%s'
  TASKLIB: 'https://github.com/oleg-tkachuk/taskfiles.git//%s?ref=v11.0.2'
  PROJECT_NAME: paladin-console
  IMAGE_NAMESPACE: paladin
  K8S_NAMESPACE: paladin
  K8S_CONTEXT: '{{.K8S_CONTEXT | default "orbstack"}}'
  GLOBAL_REGISTRY: '{{.GLOBAL_REGISTRY | default "registry.local"}}'
  # `api/*` tags version the proto contract, not this image: they carry a `/`
  # that is invalid in a Docker tag, and a contract bump must not restamp a
  # release.
  VERSION_TAG_EXCLUDE: 'api/*'
  # The shared buildx builder this repo builds through; its cache is separate
  # from the default builder's and needs pruning by name.
  BUILDX_BUILDER: lean
  DOCKERFILE: ./deploy/Dockerfile
  # Declared, not defaulted, and the difference was a real bug: a var a
  # component leaves unset falls through to whatever a SIBLING include
  # declared. backend sets DOCKER_CONTEXT to `..`, so from the repo root
  # `task frontend:release:image:build` built the console with the repo root
  # as its context and failed on a COPY of frontend/pnpm-workspace.yaml —
  # while the same task from frontend/ worked. scripts/taskfile-vars.test.sh
  # keeps the two var sets identical so the fall-through has nothing to find.
  DOCKER_CONTEXT: .
  DOCKER_BUILD_FLAGS: --network=host
  # Floor for the chart render gate — it fails when the chart renders fewer
  # resources than this. The library default is 1, which against a chart that
  # renders 4 can only fire once every template has stopped rendering; the
  # gate exists for the case where one silently stops. A floor, not an
  # equality: adding a resource is free, removing one is a deliberate edit
  # here.
  CHART_MIN_RESOURCES: "4"

includes:
  release:   { taskfile: '{{printf .TASKLIB "release"}}', dir: . }
  # uninstall and upgrade are excluded: ArgoCD owns both releases in every
  # cluster this repository targets, so a helm write from here either gets
  # reverted on the next sync or deletes workloads out from under it.
  k8s:
    taskfile: '{{printf .TASKLIB "k8s"}}'
    dir: .
    excludes: [uninstall, upgrade]
  # test:e2e is excluded, not merely unused: it runs Playwright against
  # whatever images are lying around, and the suite's whole point is that a
  # green run against a stale console is worse than no run. `verify-e2e`
  # at the root builds both images first and is the only supported entry.
  node:
    taskfile: '{{printf .TASKLIB "node"}}'
    dir: .
    excludes: [test:e2e]
  # OrbStack shares the host's image store, so a build is already visible to
  # the cluster; swap this line for runtime/minikube, runtime/kind, … elsewhere.
  local: { taskfile: '{{printf .TASKLIB "runtime/orbstack"}}', dir: . }

tasks:
  default:
    desc: "List every available task"
    cmds:
      - task --list-all

  deploy:
    desc: "Verify the chart, then publish image + chart to the OCI registry"
    cmds:
      - task: release:deploy

  deploy-local:
    desc: "Build and helm-install into the local cluster — no registry"
    cmds:
      - task: release:image:build
      - task: local:install

  dev:
    desc: "Run the Next.js development server"
    cmds:
      - task: node:dev

  install:
    desc: "Install dependencies from package-lock.json"
    cmds:
      - task: node:install

  build:
    desc: "Build the production bundle"
    cmds:
      - task: node:build

  test:
    desc: "Run the Vitest suite"
    cmds:
      - task: node:test

  lint:
    desc: "Run ESLint"
    cmds:
      - task: node:lint

  generate:
    desc: "Regenerate the Connect-RPC TypeScript stubs"
    cmds:
      - task: node:generate

  restart:
    desc: "Roll the deployment in {{.K8S_NAMESPACE}}"
    cmds:
      - task: k8s:restart
