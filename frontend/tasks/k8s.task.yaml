version: "3"

# K8s-side conveniences. `restart` is the most common — it deliberately
# tolerates a missing namespace / deployment so it's safe to run from a
# `task all` chain when the local cluster isn't up.

tasks:
  restart:
    desc: "Roll the deployment in {{.K8S_NAMESPACE}} (no-op when ns/deploy missing)"
    cmds:
      - cmd: |-
          set -euo pipefail
          # Both checks need to swallow stderr — kubectl emits "namespaces
          # … not found" to stderr even with --ignore-not-found, which
          # confuses log scrapers.
          if ! kubectl get namespace {{.K8S_NAMESPACE}} >/dev/null 2>&1; then
            printf 'INFO: %s: skip restart — namespace %s missing\n' \
              '{{.PROJECT_NAME}}' '{{.K8S_NAMESPACE}}'
            exit 0
          fi
          if ! kubectl -n {{.K8S_NAMESPACE}} get deploy/{{.PROJECT_NAME}} >/dev/null 2>&1; then
            printf 'INFO: %s: skip restart — deploy/%s missing in %s\n' \
              '{{.PROJECT_NAME}}' '{{.PROJECT_NAME}}' '{{.K8S_NAMESPACE}}'
            exit 0
          fi
          printf 'INFO: %s: rolling deployment\n' '{{.PROJECT_NAME}}'
          kubectl -n {{.K8S_NAMESPACE}} rollout restart deploy/{{.PROJECT_NAME}}
          kubectl -n {{.K8S_NAMESPACE}} rollout status  deploy/{{.PROJECT_NAME}} --timeout=2m

  logs:
    desc: "Tail the deployment's logs (Ctrl-C to stop)"
    cmds:
      - kubectl -n {{.K8S_NAMESPACE}} logs deploy/{{.PROJECT_NAME}} -f --tail=100

  port-forward:
    desc: "Port-forward the UI service (3000); override with PORT=…"
    vars:
      PORT: '{{.PORT | default "3000"}}'
    cmds:
      - kubectl -n {{.K8S_NAMESPACE}} port-forward deploy/{{.PROJECT_NAME}} {{.PORT}}:3000

  upgrade:
    desc: "helm upgrade --install in {{.K8S_NAMESPACE}} from the local chart dir"
    deps: [":core:tools:build"]
    cmds:
      - task: ":core:banner"
        vars: { MESSAGE: "helm upgrade --install {{.PROJECT_NAME}} → {{.K8S_NAMESPACE}}" }
      - cmd: |-
          helm upgrade --install {{.PROJECT_NAME}} {{.CHART_DIR}} \
            --namespace {{.K8S_NAMESPACE}} \
            --create-namespace
