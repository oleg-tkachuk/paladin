{{- /*
A standard Ingress for the console. Its Service speaks plain HTTP, so any
controller works; the default class is Caddy's.
*/ -}}
{{- if .Values.ingress.enabled -}}
{{- $_ := required "ingress.hosts must name at least one host when ingress.enabled" (first .Values.ingress.hosts) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "chart.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host := .Values.ingress.hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- with $.Values.session.service.name }}
          # The console's session role (ADR-0048), on the console's own origin.
          - path: {{ trimSuffix "/" $.Values.session.pathPrefix }}
            pathType: Prefix
            backend:
              service:
                name: {{ . }}
                port:
                  number: {{ $.Values.session.service.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "chart.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
