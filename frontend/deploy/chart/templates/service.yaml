apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  {{- if .Values.service.stickySessions }}
  annotations:
    # Pin each browser session to one BFF replica. The token-rotation
    # single-flight in lib/auth/bff.ts dedups in-process; across
    # replicas, parallel requests would each call IAM RefreshToken and
    # all but one get "token already consumed" → spurious 401s. Sticky
    # sessions make the in-process dedup sufficient until a shared
    # (Redis) cache lands (BACKLOG). Required whenever replicaCount > 1.
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "paladin_ui_affinity"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
