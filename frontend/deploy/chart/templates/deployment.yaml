apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the configmap changes — checksum is the
        # rendered ConfigMap contents, so any tweak to `config.*` triggers
        # a fresh rollout instead of waiting for the next manual restart.
        # Without this, ArgoCD sees the ConfigMap diff but the Deployment
        # spec stays identical (same image tag, same pod template) and
        # no rollout fires.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: APP_VERSION
              value: {{ .Values.metadata.version | default .Chart.AppVersion | quote }}
            - name: GIT_COMMIT_HASH
              value: {{ .Values.metadata.commit | quote }}
            - name: BUILD_TIME
              value: {{ .Values.metadata.buildTime | quote }}
            # Per-plane backend URLs — read by the BFF (route handlers under
            # /api/rpc and /api/auth). The browser never sees these.
            - name: PALADIN_DATA_URL
              value: {{ .Values.backend.urls.data | quote }}
            - name: PALADIN_IAM_URL
              value: {{ .Values.backend.urls.iam | quote }}
            - name: PALADIN_ADMIN_URL
              value: {{ .Values.backend.urls.admin | quote }}
            # Worker + MCP have no Connect surface; they expose
            # /system/health.json on their ops ports for the BFF
            # /api/health/all aggregator. The browser never hits them
            # directly — Service DNS isn't browser-resolvable.
            - name: PALADIN_WORKER_URL
              value: {{ .Values.backend.urls.worker | quote }}
            - name: PALADIN_MCP_URL
              value: {{ .Values.backend.urls.mcp | quote }}
            - name: PALADIN_DISPATCHER_URL
              value: {{ .Values.backend.urls.dispatcher | quote }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
