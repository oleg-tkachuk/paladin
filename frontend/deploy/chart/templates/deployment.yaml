apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the configmap changes — checksum is the
        # rendered ConfigMap contents, so any tweak to `config.*` triggers
        # a fresh rollout instead of waiting for the next manual restart.
        # Without this, ArgoCD sees the ConfigMap diff but the Deployment
        # spec stays identical (same image tag, same pod template) and
        # no rollout fires.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: APP_VERSION
              value: {{ .Values.metadata.version | default .Chart.AppVersion | quote }}
            - name: GIT_COMMIT_HASH
              value: {{ .Values.metadata.commit | quote }}
            - name: BUILD_TIME
              value: {{ .Values.metadata.buildTime | quote }}
            # Per-plane backend URLs — read by the BFF (route handlers under
            # /api/rpc and /api/auth). The browser never sees these.
            - name: PALADIN_DATA_URL
              value: {{ include "paladin-console.backendURL" (dict "ctx" $ "plane" "data") | quote }}
            - name: PALADIN_IAM_URL
              value: {{ include "paladin-console.backendURL" (dict "ctx" $ "plane" "iam") | quote }}
            - name: PALADIN_ADMIN_URL
              value: {{ include "paladin-console.backendURL" (dict "ctx" $ "plane" "admin") | quote }}
            # Worker + MCP have no Connect surface; they expose
            # /system/health.json on their ops ports for the BFF
            # /api/health/all aggregator. The browser never hits them
            # directly — Service DNS isn't browser-resolvable.
            - name: PALADIN_WORKER_URL
              value: {{ include "paladin-console.backendURL" (dict "ctx" $ "plane" "worker") | quote }}
            - name: PALADIN_MCP_URL
              value: {{ include "paladin-console.backendURL" (dict "ctx" $ "plane" "mcp") | quote }}
            - name: PALADIN_DISPATCHER_URL
              value: {{ include "paladin-console.backendURL" (dict "ctx" $ "plane" "dispatcher") | quote }}
            - name: PALADIN_INGEST_URL
              value: {{ include "paladin-console.backendURL" (dict "ctx" $ "plane" "ingest") | quote }}
            {{- /*
              PALADIN_HEALTH_SNAPSHOT_TOKEN — shared secret the BFF /api/health/all
              aggregator forwards (as X-Health-Token) to each backend's
              /system/health.json. Must match the backends'
              runtime.health_snapshot_token. Omitted when unset (dev): the
              backends leave the snapshot open and the header is absent.
            */}}
            - name: PALADIN_HEALTH_ROLES
              value: {{ join "," .Values.backend.healthRoles | quote }}
            {{- if .Values.backend.tls }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/%s" (include "paladin-console.backendCAPath" .) .Values.backend.caSecret.key | quote }}
            {{- end }}
            {{- with .Values.healthSnapshotTokenSecret }}
            - name: PALADIN_HEALTH_SNAPSHOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .name }}
                  key: {{ .key }}
            {{- end }}
            {{- /*
              extraEnv — operator extension point for env vars the chart
              doesn't model first-class. Common dev-cluster use: injecting
              NODE_TLS_REJECT_UNAUTHORIZED=0 so the BFF's outbound fetch
              to internal-mTLS-protected planes doesn't fail at the
              system-trust-store check. Production overlays mount the
              issuing CA + set NODE_EXTRA_CA_CERTS instead.
            */}}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $mounts := .Values.volumeMounts | default list }}
          {{- $volumes := .Values.volumes | default list }}
          {{- if .Values.backend.tls }}
          {{- $ca := required "backend.caSecret.name is required when backend.tls: the Secret holding the backend's CA" .Values.backend.caSecret.name }}
          {{- $mounts = append $mounts (dict "name" "backend-ca" "mountPath" (include "paladin-console.backendCAPath" .) "readOnly" true) }}
          {{- $volumes = append $volumes (dict "name" "backend-ca" "secret" (dict "secretName" $ca)) }}
          {{- end }}
          {{- with $mounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
