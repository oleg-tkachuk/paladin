apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pod when the configmap changes — checksum is the
        # rendered ConfigMap contents, so any tweak to `config.*` triggers
        # a fresh rollout instead of waiting for the next manual restart.
        # Without this, ArgoCD sees the ConfigMap diff but the Deployment
        # spec stays identical (same image tag, same pod template) and
        # no rollout fires.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "chart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "chart.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: APP_VERSION
              value: {{ .Values.metadata.version | default .Chart.AppVersion | quote }}
            - name: GIT_COMMIT_HASH
              value: {{ .Values.metadata.commit | quote }}
            - name: BUILD_TIME
              value: {{ .Values.metadata.buildTime | quote }}
            # The iam plane, for the OAuth consent form's relay
            # (server/internal/web). Every other call the console makes goes
            # from the browser through the session role (ADR-0048).
            - name: PALADIN_IAM_URL
              value: {{ include "chart.backendURL" (dict "ctx" $ "plane" "iam") | quote }}
            # Read into the CSP by the console's server (server/internal/policy).
            - name: PALADIN_STORAGE_ORIGINS
              value: {{ join "," .Values.storageOrigins | quote }}
            {{- with .Values.banner }}
            {{- if .content }}
            # The platform banner, served by /api/banner (server/internal/web).
            - name: PALADIN_BANNER_CONTENT
              value: {{ .content | quote }}
            - name: PALADIN_BANNER_SEVERITY
              value: {{ .severity | default "info" | quote }}
            - name: PALADIN_BANNER_URL
              value: {{ .url | default "" | quote }}
            - name: PALADIN_BANNER_PERMANENT
              value: {{ .permanent | default false | quote }}
            - name: PALADIN_BANNER_POSITION
              value: {{ .position | default "top" | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.backend.tls }}
            # The backend's CA, trusted by the consent relay (server/cmd/paladin-console).
            - name: PALADIN_BACKEND_CA_FILE
              value: {{ printf "%s/%s" (include "chart.backendCAPath" .) .Values.backend.caSecret.key | quote }}
            {{- end }}
            {{- /*
              extraEnv — operator extension point for env vars the chart
              doesn't model first-class, such as PALADIN_LOG_LEVEL.
            */}}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $mounts := .Values.volumeMounts | default list }}
          {{- $volumes := .Values.volumes | default list }}
          {{- if .Values.backend.tls }}
          {{- $ca := required "backend.caSecret.name is required when backend.tls: the Secret holding the backend's CA" .Values.backend.caSecret.name }}
          {{- $mounts = append $mounts (dict "name" "backend-ca" "mountPath" (include "chart.backendCAPath" .) "readOnly" true) }}
          {{- $volumes = append $volumes (dict "name" "backend-ca" "secret" (dict "secretName" $ca)) }}
          {{- end }}
          {{- with $mounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
