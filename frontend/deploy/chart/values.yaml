replicaCount: 1
metadata:
  version: ""
  commit: "unknown"
  buildTime: "unknown"

# Per-plane backend URLs consumed by the BFF (src/app/api/rpc/[[...connect]]/route.ts
# and src/lib/auth/bff.ts) via the PALADIN_<PLANE>_URL env vars. The browser
# never sees these — it only ever hits the in-cluster Next.js service.
#
# Service-name assumption: the backend chart renders one Service per
# role via roleFullname (`<release>-<chart>-<role>`). The defaults
# below assume `helm install paladin-core paladin-core …` in namespace
# `paladin` (release name == chart name, so chart.fullname collapses and
# drops the duplicate prefix), which gives:
#   paladin-core-api    (ports data:8080, iam:8085)
#   paladin-core-admin  (port  admin:8090)
# Note that data + iam share the api role — same Service, different
# port. Admin sits on its own role / Service.
#
# If your backend release name differs (e.g. installed under a
# different name), override these URLs in the ArgoCD overlay
# at applications/overlays/local/patches/paladin-values.yaml so the BFF
# resolves to the actual Service names in your cluster.
backend:
  urls:
    data:   "http://paladin-core-api.paladin.svc.cluster.local:8080"
    iam:    "http://paladin-core-api.paladin.svc.cluster.local:8085"
    admin:  "http://paladin-core-admin.paladin.svc.cluster.local:8090"
    # worker + mcp expose /system/health.json on these ports for the
    # BFF /api/health/all aggregator. They do NOT serve Connect; the
    # browser never hits them.
    #
    # Port mapping pitfall: the worker Deployment's containerPort is
    # 8090 but the chart's worker Service exposes it as :8099 (see
    # backend chart values, deployments.worker.service.ports). The BFF
    # must hit the Service port — `8090` would route to a non-existent
    # endpoint on whichever Service happens to listen there.
    worker: "http://paladin-core-worker.paladin.svc.cluster.local:8099"
    mcp:    "http://paladin-core-mcp.paladin.svc.cluster.local:8095"
    # dispatcher exposes /system/health.json on the same ops port shape
    # as worker. Service port 8099 (matches the backend chart's
    # deployments.dispatcher.service.ports). Surfaces in the BFF
    # /api/health/all aggregator alongside api/admin/worker/mcp.
    dispatcher: "http://paladin-core-dispatcher.paladin.svc.cluster.local:8099"

# Extra environment variables appended to the UI container's env block.
# Use for knobs the chart doesn't model first-class. Common cases:
#   - NODE_TLS_REJECT_UNAUTHORIZED=0 on dev clusters where the BFF dials
#     internal mTLS-protected backends whose CA isn't in Node's system
#     trust store. Production should mount the CA + use NODE_EXTRA_CA_CERTS
#     instead — disabling verification globally is a development shortcut.
#   - NODE_OPTIONS=--max-old-space-size=… for memory tuning.
# Items are standard Kubernetes EnvVar entries.
extraEnv: []
# - name: NODE_TLS_REJECT_UNAUTHORIZED
#   value: "0"

# healthSnapshotTokenSecret — shared secret the BFF /api/health/all
# aggregator forwards to each backend's /system/health.json (must match the
# backends' runtime.health_snapshot_token). Unset (default) → the backends
# leave the snapshot open and no header is sent (dev). In prod, point this
# at the same SealedSecret the backend chart's health token comes from.
# healthSnapshotTokenSecret:
#   name: paladin-health-token
#   key: token
healthSnapshotTokenSecret: {}

image:
  # Registry host overridden per env. Local default points at the
  # dev-cluster registry; envs other than local flip via
  # values-{dev,staging,prod}.yaml.
  repository: registry.local/paladin/paladin-console
  # Prod-safe default. Local overlay flips to Always because the
  # local registry rebuilds the same tag in-place.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # UI pod has no K8s API needs. Disabling automount drops the projected
  # SA token, shrinking the blast radius of any RCE in the Node runtime
  # or a Next.js SSR dependency.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# ─── Security hardening ────────────────────────────────────────────────────
# Restricted-PSS-compatible defaults. The Dockerfile creates the `nextjs`
# user with uid/gid 1001; the chart pins both.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  # Next.js standalone writes runtime caches under /app/.next/cache
  # (ISR / revalidation). emptyDir mounts under volumes/volumeMounts
  # below keep readOnlyRootFilesystem viable.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Pod-level graceful shutdown. Next.js' standalone server handles
# SIGTERM (drains in-flight SSR); 30s is conservative.
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 3000
  # Enable Traefik cookie session affinity. MUST be true whenever the UI
  # runs more than one replica (see the annotation rationale in
  # templates/service.yaml). Off by default for single-replica dev.
  stickySessions: false

# ─── Traefik IngressRoute ──────────────────────────────────────────────────
# Paladin UI fronted by Traefik (consistent with acme's IngressRoute
# pattern). The chart previously shipped both generic Ingress AND
# Gateway API HTTPRoute gated off; both removed — one routing model.
traefik:
  enabled: true
  entryPoints:
    - websecure
  # No default hosts — each env overlay declares its own DNS. Empty
  # list means the chart emits no IngressRoute.
  hosts: []
  annotations: {}
  middlewares: []

# ─── TLS via cert-manager ──────────────────────────────────────────────────
tls:
  enabled: true
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod
  existingSecret: ""

# ─── Resources ─────────────────────────────────────────────────────────────
# Sized for Next.js standalone SSR on the dev cluster. Tune in
# values-{staging,prod}.yaml overlays. requests.cpu is REQUIRED for
# HPA-on-CPU to work.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Liveness hits a trivial process-alive route (no backend/DB calls) so a
# backend outage can't restart-storm the UI. Readiness uses the
# dependency-aware aggregator so the pod is pulled from the LB when its
# upstreams are down, without being killed.
livenessProbe:
  httpGet:
    path: /api/health/live
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /api/health/all
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 15

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes:
  - name: config
    configMap:
      name: paladin-console-config
  # readOnlyRootFilesystem requires writable temp + Next.js runtime cache.
  - name: tmp
    emptyDir: {}
  - name: next-cache
    emptyDir: {}

volumeMounts:
  - name: config
    mountPath: /app/configs
    readOnly: true
  - name: tmp
    mountPath: /tmp
  - name: next-cache
    mountPath: /app/.next/cache

nodeSelector: {}
tolerations: []
affinity: {}

# ─── TopologySpreadConstraints ────────────────────────────────────────────
# Empty by default; populate in values-prod.yaml for multi-zone spread.
topologySpreadConstraints: []

# ─── PodDisruptionBudget ───────────────────────────────────────────────────
# Renders only when replicaCount>=2 or autoscaling.minReplicas>=2.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ─── App config (templated into the ConfigMap) ─────────────────────────────
#
# Defaults here are PROD-SAFE. The dev cluster opt-ins (disableAuth,
# pre-minted dev JWT) live in values-local.yaml. Never restore dev
# defaults here — a future operator who installs the chart with just
# `helm install` MUST get a deployment that's not silently insecure.
config:
  runtimeConfig:
    public:
      paladin:
        baseUrl: "/api/paladin"
        upstreamUrl: "http://paladin-core.paladin.svc.cluster.local:8080"
        timeoutMs: 5000
      oidc:
        # No issuer / clientId defaults — every env overlay MUST set.
        # disableAuth=false in prod; only the local overlay flips it
        # true for dev convenience.
        authority: ""
        clientId: ""
        redirectUri: ""
        postLogoutRedirectUri: ""
        scope: "openid profile email"
        disableAuth: false
      # `auth.devToken` is NOT set here — see values-local.yaml. The
      # token would be exposed to the browser via runtimeConfig.public,
      # so committing a literal here is a real disclosure path.
