# The console is stateless. It held per-process refresh-token bookkeeping
# once, and the chart refused to render a second replica because of it; the
# rotation race that state papered over is decided in the database now
# (SupersedeRefreshToken is conditional, so exactly one caller wins), so
# scaling this out is a plain capacity decision again. One is simply the
# sensible default.
replicaCount: 1
# Old ReplicaSets kept for `kubectl rollout undo`. Kubernetes keeps ten by
# default; with a release per merge that is ten idle ReplicaSets. GitOps rolls
# back by reverting the revision, so a few are enough.
revisionHistoryLimit: 3
metadata:
  version: ""
  commit: "unknown"
  buildTime: "unknown"

# The storage origins presigned URLs point at: each backend's public_endpoint,
# as an origin (`https://s3.example.com`). The browser uploads to them and
# shows previews from them, and the console's CSP allows exactly these; one
# left out makes every upload through the console fail in the browser.
storageOrigins: []

# Where the backend chart's release is. The browser reaches its session role
# at /session/ (session below); the console's own server reaches only the iam
# plane, to relay the OAuth consent form, through PALADIN_IAM_URL (ADR-0048).
#
# By default the URLs are built from the backend chart's release name and
# namespace: its Services are named <fullname>-<role>, where fullname is the
# release name, suffixed with the chart name unless the release name already
# contains it.
backend:
  # The backend chart's release name, and the chart's own name.
  release: paladin-core
  chart: paladin-core
  # Empty: this release's namespace.
  namespace: ""
  # The backend's internalTLS.enabled. On, data / iam / admin are dialled over
  # https and caSecret — a Secret holding the CA as `key` — is mounted and
  # trusted by the consent relay through PALADIN_BACKEND_CA_FILE.
  tls: false
  caSecret: {name: "", key: ca.crt}
  # The iam plane's URL, when not the one built from the fields above.
  urls:
    iam: ""

# A message across every page of the console — a maintenance window, a
# migration — after Argo CD's ui.bannercontent. Empty content shows nothing.
# The console reads it from the environment on every shell poll, so changing
# it is a rollout, not a rebuild.
#   severity:  info | warning | critical — the banner's colour and glyph.
#   url:       where "Read more" goes: an http(s) address or a console path.
#   permanent: true and the banner cannot be dismissed; otherwise each user
#              dismisses it once, and it shows again when its text changes.
#   position:  top | bottom | both.
banner:
  content: ""
  severity: info
  url: ""
  permanent: false
  position: top

# Extra environment variables appended to the UI container's env block, for
# knobs the chart doesn't model first-class. Items are standard Kubernetes
# EnvVar entries.
extraEnv: []
# - name: PALADIN_LOG_LEVEL
#   value: debug

image:
  # The published multi-arch image, so `helm install` works without building
  # anything. The dev loop overrides this back to the in-cluster registry in
  # values-local.yaml, and other envs flip it via values-{dev,staging,prod}.
  repository: ghcr.io/oleg-tkachuk/paladin-console
  # Prod-safe default. Local overlay flips to Always because the
  # local registry rebuilds the same tag in-place.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # UI pod has no K8s API needs. Disabling automount drops the projected
  # SA token, shrinking the blast radius of any RCE in the console's
  # server.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# ─── Security hardening ────────────────────────────────────────────────────
# Restricted-PSS-compatible defaults. The image runs as uid/gid 10001
# (deploy/Dockerfile); the chart pins both.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 10001
  # The server writes nothing: the export is in the binary.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Pod-level graceful shutdown. The server drains requests in flight for up to
# 10s after SIGTERM (server/cmd/paladin-console); 30s leaves room for that.
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 3000
  # Enable Traefik cookie session affinity. MUST be true whenever the UI
  # runs more than one replica (see the annotation rationale in
  # templates/service.yaml). Off by default for single-replica dev.
  stickySessions: false

# ─── Traefik IngressRoute ──────────────────────────────────────────────────
# Paladin UI fronted by Traefik. The chart previously shipped both generic Ingress AND
# Gateway API HTTPRoute gated off; both removed — one routing model.
# The console's session role (ADR-0048), deployed by the backend chart under
# deployments.session: the console's ingress sends pathPrefix to its Service,
# on the console's own hosts, so the session cookie is the console's origin.
# Empty name: the backend release's, <fullname>-session.
session:
  service:
    name: ""
    port: 8086
  pathPrefix: /session/

traefik:
  enabled: true
  entryPoints:
    - websecure
  # No default hosts — each env overlay declares its own DNS. Empty
  # list means the chart emits no IngressRoute.
  hosts: []
  annotations: {}
  middlewares: []

# ─── Ingress ─────────────────────────────────────────────────────────────────
#
# A standard networking.k8s.io/v1 Ingress for the console. Off by default;
# leave it off to route to the Service with your own ingress. The console
# speaks plain HTTP, so any controller works; Caddy obtains certificates itself
# when tls is empty.
ingress:
  enabled: false
  className: caddy
  annotations: {}
  hosts: []
  # [{secretName, hosts}] to serve your own certificates.
  tls: []

# ─── TLS via cert-manager ──────────────────────────────────────────────────
tls:
  enabled: true
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod
  existingSecret: ""

# ─── NetworkPolicy ─────────────────────────────────────────────────────────
# Default-deny for the console's pods, then ingress from the ingress
# controller and egress to DNS and the backend release (backend.release /
# backend.namespace). On by default: inert on a CNI that does not enforce
# policies, and on one that does, the namespaces below must be this
# cluster's — a wrong one cuts the console off.
networkPolicies:
  enabled: true
  # Ingress controller pods allowed to reach the console.
  ingressController:
    namespace: networking
    podLabels:
      app.kubernetes.io/name: traefik
  dnsPort: 53
  # Further egress rules, as NetworkPolicyEgressRule entries — for a
  # backend.urls entry outside the backend release.
  extraEgress: []

# ─── Resources ─────────────────────────────────────────────────────────────
# The server serves files from memory and relays one form: the export is
# embedded in its binary, about 20 MiB resident. Tune in
# values-{staging,prod}.yaml overlays. requests.cpu is REQUIRED for
# HPA-on-CPU to work. The CPU limit is a ceiling for bursts, such as a cold
# browser cache fetching every chunk at once, not the working size.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 128Mi

# Both probes hit the trivial process-alive route (no backend/DB calls).
# Liveness: a backend outage must not restart-storm the UI. Readiness: the
# console is ready when it can serve, and it can serve during a backend
# outage — that is when an operator needs it to say what is down. Readiness
# once pointed at the health page's role fan-out, which answered 200 whatever
# the roles reported, so it never reflected the upstreams; it only
# timed six fetches against the kubelet's 1s default, and under load the one
# replica dropped out of the Service and the ingress answered 503 for every
# page.
#
# Both say how long an answer may take: the kubelet's default is 1s, which a
# busy event loop misses without anything being wrong. Liveness waits longer
# than readiness — a slow answer should take the pod out of rotation long
# before it gets it restarted.
livenessProbe:
  httpGet:
    path: /api/health/live
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /api/health/live
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes:
  - name: config
    configMap:
      name: paladin-console-config
  # A writable /tmp under readOnlyRootFilesystem, for the Go runtime.
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: config
    mountPath: /app/configs
    readOnly: true
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}

# ─── TopologySpreadConstraints ────────────────────────────────────────────
# Empty by default; populate in values-prod.yaml for multi-zone spread.
topologySpreadConstraints: []

# ─── PodDisruptionBudget ───────────────────────────────────────────────────
# Renders only when replicaCount>=2 or autoscaling.minReplicas>=2.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ─── App config (templated into the ConfigMap) ─────────────────────────────
#
# Empty, and the ConfigMap it renders now carries nothing the console reads.
# It used to hold `paladin`, `oidc` and `auth` subtrees; none of them was ever
# read by any code. The console authenticates through the backend's IAM plane
# (there is no OIDC client library in the bundle) through the session role, the
# OAuth relay reaches iam through PALADIN_IAM_URL, and the build metadata
# the UI does show is threaded in as Docker build args.
#
# The key stays, and so does the ConfigMap, because overlays outside this repo
# mount it. Anything an overlay sets here is accepted and ignored — src/config.ts
# is deliberately non-strict so that cannot fail a build.
config: {}
