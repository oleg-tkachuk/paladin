# The console is stateless. It held per-process refresh-token bookkeeping
# once, and the chart refused to render a second replica because of it; the
# rotation race that state papered over is decided in the database now
# (SupersedeRefreshToken is conditional, so exactly one caller wins), so
# scaling this out is a plain capacity decision again. One is simply the
# sensible default.
replicaCount: 1
metadata:
  version: ""
  commit: "unknown"
  buildTime: "unknown"

# Where the backend chart's planes are. The BFF (src/app/api/rpc and
# src/lib/auth/bff.ts) reaches them through the PALADIN_<PLANE>_URL env vars;
# the browser never sees them.
#
# By default the URLs are built from the backend chart's release name and
# namespace: its Services are named <fullname>-<role>, where fullname is the
# release name, suffixed with the chart name unless the release name already
# contains it. Set a url below to override one plane.
backend:
  # The backend chart's release name, and the chart's own name.
  release: paladin-core
  chart: paladin-core
  # Empty: this release's namespace.
  namespace: ""
  # The backend's internalTLS.enabled. On, data / iam / admin are dialled over
  # https and caSecret — a Secret holding the CA as `key` — is mounted and
  # trusted through NODE_EXTRA_CA_CERTS.
  tls: false
  caSecret: {name: "", key: ca.crt}
  # Roles the health page polls. ingest is off in the backend chart by
  # default; add it when the backend runs it.
  healthRoles: [api, admin, worker, mcp, dispatcher]
  # Explicit per-plane URLs. Empty: built from the fields above.
  urls:
    data: ""
    iam: ""
    admin: ""
    worker: ""
    mcp: ""
    dispatcher: ""
    ingest: ""

# Extra environment variables appended to the UI container's env block.
# Use for knobs the chart doesn't model first-class. Common cases:
#   - NODE_TLS_REJECT_UNAUTHORIZED=0 on dev clusters where the BFF dials
#     internal mTLS-protected backends whose CA isn't in Node's system
#     trust store. Production should mount the CA + use NODE_EXTRA_CA_CERTS
#     instead — disabling verification globally is a development shortcut.
#   - NODE_OPTIONS=--max-old-space-size=… for memory tuning.
# Items are standard Kubernetes EnvVar entries.
extraEnv: []
# - name: NODE_TLS_REJECT_UNAUTHORIZED
#   value: "0"

# healthSnapshotTokenSecret — shared secret the BFF /api/health/all
# aggregator forwards to each backend's /system/health.json (must match the
# backends' runtime.health_snapshot_token). Unset (default) → the backends
# leave the snapshot open and no header is sent (dev). In prod, point this
# at the same SealedSecret the backend chart's health token comes from.
# healthSnapshotTokenSecret:
#   name: paladin-health-token
#   key: token
healthSnapshotTokenSecret: {}

image:
  # The published multi-arch image, so `helm install` works without building
  # anything. The dev loop overrides this back to the in-cluster registry in
  # values-local.yaml, and other envs flip it via values-{dev,staging,prod}.
  repository: ghcr.io/oleg-tkachuk/paladin-console
  # Prod-safe default. Local overlay flips to Always because the
  # local registry rebuilds the same tag in-place.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # UI pod has no K8s API needs. Disabling automount drops the projected
  # SA token, shrinking the blast radius of any RCE in the Node runtime
  # or a Next.js SSR dependency.
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# ─── Security hardening ────────────────────────────────────────────────────
# Restricted-PSS-compatible defaults. The Dockerfile creates the `nextjs`
# user with uid/gid 1001; the chart pins both.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  # Next.js standalone writes runtime caches under /app/.next/cache
  # (ISR / revalidation). emptyDir mounts under volumes/volumeMounts
  # below keep readOnlyRootFilesystem viable.
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# Pod-level graceful shutdown. Next.js' standalone server handles
# SIGTERM (drains in-flight SSR); 30s is conservative.
terminationGracePeriodSeconds: 30

service:
  type: ClusterIP
  port: 3000
  # Enable Traefik cookie session affinity. MUST be true whenever the UI
  # runs more than one replica (see the annotation rationale in
  # templates/service.yaml). Off by default for single-replica dev.
  stickySessions: false

# ─── Traefik IngressRoute ──────────────────────────────────────────────────
# Paladin UI fronted by Traefik. The chart previously shipped both generic Ingress AND
# Gateway API HTTPRoute gated off; both removed — one routing model.
traefik:
  enabled: true
  entryPoints:
    - websecure
  # No default hosts — each env overlay declares its own DNS. Empty
  # list means the chart emits no IngressRoute.
  hosts: []
  annotations: {}
  middlewares: []

# ─── TLS via cert-manager ──────────────────────────────────────────────────
tls:
  enabled: true
  certManager:
    enabled: true
    issuerKind: ClusterIssuer
    issuerName: letsencrypt-prod
  existingSecret: ""

# ─── Resources ─────────────────────────────────────────────────────────────
# Sized for Next.js standalone SSR on the dev cluster. Tune in
# values-{staging,prod}.yaml overlays. requests.cpu is REQUIRED for
# HPA-on-CPU to work.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Liveness hits a trivial process-alive route (no backend/DB calls) so a
# backend outage can't restart-storm the UI. Readiness uses the
# dependency-aware aggregator so the pod is pulled from the LB when its
# upstreams are down, without being killed.
livenessProbe:
  httpGet:
    path: /api/health/live
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /api/health/all
    port: 3000
  initialDelaySeconds: 15
  periodSeconds: 15

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

volumes:
  - name: config
    configMap:
      name: paladin-console-config
  # readOnlyRootFilesystem requires writable temp + Next.js runtime cache.
  - name: tmp
    emptyDir: {}
  - name: next-cache
    emptyDir: {}

volumeMounts:
  - name: config
    mountPath: /app/configs
    readOnly: true
  - name: tmp
    mountPath: /tmp
  - name: next-cache
    mountPath: /app/.next/cache

nodeSelector: {}
tolerations: []
affinity: {}

# ─── TopologySpreadConstraints ────────────────────────────────────────────
# Empty by default; populate in values-prod.yaml for multi-zone spread.
topologySpreadConstraints: []

# ─── PodDisruptionBudget ───────────────────────────────────────────────────
# Renders only when replicaCount>=2 or autoscaling.minReplicas>=2.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ─── App config (templated into the ConfigMap) ─────────────────────────────
#
# Empty, and the ConfigMap it renders now carries nothing the console reads.
# It used to hold `paladin`, `oidc` and `auth` subtrees; none of them was ever
# read by any code. The console authenticates through the backend's IAM plane
# (there is no OIDC client library in the bundle), the BFF reaches its upstreams
# through the PALADIN_*_URL env vars the deployment sets, and the build metadata
# the UI does show is threaded in as Docker build args.
#
# The key stays, and so does the ConfigMap, because overlays outside this repo
# mount it. Anything an overlay sets here is accepted and ignored — src/config.ts
# is deliberately non-strict so that cannot fail a build.
config: {}
