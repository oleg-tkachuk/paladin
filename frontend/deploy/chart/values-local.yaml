# Paladin UI overlay for the LOCAL development cluster.
#
#   helm upgrade --install paladin-console ./deploy/chart \
#     -n paladin \
#     -f ./deploy/chart/values.yaml \
#     -f ./deploy/chart/values-local.yaml
#
# Restores everything values.yaml deliberately keeps prod-safe:
#   - image.pullPolicy: Always (local registry rebuilds same tag)
#   - cert-manager off, reuse cluster-wide `traefik-tls` Secret
#   - Traefik hosts pointing at *.paladin.local
#   - oidc.disableAuth: true; the fallback-Bearer devToken is left empty and
#     supplied at install time (see the auth block below), localStorage.
#     paladin_token used in prod path.

image:
  pullPolicy: Always

# Replica pinning for the minikube memory budget. Base values.yaml
# defaults to replicaCount=1 already; pinning autoscaling.maxReplicas=1
# guarantees HPA cannot scale up if enabled in a future env layer.
replicaCount: 1
autoscaling:
  minReplicas: 1
  maxReplicas: 1

traefik:
  hosts:
    - paladin.local

tls:
  certManager:
    enabled: false
  existingSecret: traefik-tls

config:
  runtimeConfig:
    public:
      oidc:
        # Local cluster has no working Authentik most of the time;
        # disable browser-side auth so the BFF accepts any request.
        disableAuth: true
      auth:
        # DEV ONLY. Fallback Bearer token used when localStorage.paladin_token is
        # empty. Left EMPTY on purpose: this repository is public, so a
        # committed JWT is a JWT everyone holds — and the value is served to
        # the browser, which makes it a credential with no confidentiality
        # left at all.
        #
        # Mint one for your own local cluster and pass it at install time:
        #
        #     TOKEN=$(cd <paladin-repo> && task backend:auth:mint-token)
        #     helm upgrade --install paladin-console . -f values-local.yaml \
        #       --set-string 'config.runtimeConfig.public.auth.devToken='"$TOKEN"
        #
        # Acceptable only on a local cluster — never in any environment
        # reachable by real users.
        devToken: ""
