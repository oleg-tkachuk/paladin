runtimeConfig:
  public:
    objectControlPlane:
      baseUrl: "/api/paladin"
      upstreamUrl: "http://paladin-core.paladin.svc.cluster.local:8080"
      timeoutMs: 5000
    oidc:
      authority: ""
      clientId: ""
      redirectUri: ""
      postLogoutRedirectUri: ""
      scope: "openid profile email"
      disableAuth: true
    auth:
      # DEV ONLY. Fallback Bearer token used when localStorage.paladin_token is
      # empty. The value is served to the browser, so it must NEVER be set in
      # a production build — and it is deliberately left empty here rather
      # than committed, because this repository is public: a checked-in JWT is
      # a JWT everyone has.
      #
      # Mint your own for a local stack (prints a token valid for the
      # committed dev signing key):
      #
      #     task backend:auth:mint-token
      #
      # Then paste it into the console's /config page (it is stored in
      # localStorage as `paladin_token`). There is no env-var override for this
      # key — the loader reads this file only (src/config.ts) — so setting it
      # here means editing a tracked file: keep that edit out of your commits.
      devToken: ""
