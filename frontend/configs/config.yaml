# Local dev config for the console.
#
# Almost nothing here is read any more. `src/config.ts` keeps one subtree —
# `uiMetadata` — and even that is a fallback: the version, commit and build time
# the UI shows come from APP_VERSION / GIT_COMMIT_HASH / BUILD_TIME, which
# deploy/Dockerfile threads in as build args. The BFF reaches its upstreams
# through PALADIN_DATA_URL / PALADIN_IAM_URL / PALADIN_ADMIN_URL, not from here.
#
# `auth.devToken` has exactly one reader left: scripts/dev-bootstrap.sh, which
# greps this file for a JWT to call the backend with. The app does not read it —
# the console's own bearer lives in localStorage under `paladin_token`, pasted in
# through the /config page.
runtimeConfig:
  public:
    auth:
      # DEV ONLY, and left EMPTY on purpose: this repository is public, so a
      # committed JWT is a JWT everyone holds. Mint your own for a local stack:
      #
      #     task backend:auth:mint-token
      #
      # Roles must use the dotted form (`platform.admin`). The hyphenated
      # spelling parses and then fails every Cedar check, which reads exactly
      # like a permissions bug.
      devToken: ""
