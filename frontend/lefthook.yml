# lefthook.yml
# Standardized UI Git hooks runner configuration.

skip_output:
  meta: true
  summary: true

pre-commit:
  skip_save: true
  parallel: true
  commands:
    # 1) Block real compiled binaries
    forbid-binaries:
      tags: [security, hygiene]
      glob: "*"
      run: |
        set -euo pipefail
        for f in {staged_files}; do
          [ -f "$f" ] || continue
          if file -b "$f" | grep -qE '(^| )ELF( |$)|(^| )Mach-O( |$)'; then
            echo "ERROR: Compiled binary detected: $f"
            exit 1
          fi
        done

    # 2) Prevent committing secrets
    #gitleaks:
    #  tags: [security]
    #  run: gitleaks protect --staged --redact --verbose=true

    # 3) ESLint
    eslint:
      tags: [ui, lint]
      glob: "*.{js,jsx,ts,tsx}"
      run: npx eslint {staged_files}

    # 4) Prettier
    prettier:
      tags: [ui, fmt]
      glob: "*.{js,jsx,ts,tsx,css,scss,json,md}"
      run: npx prettier --write {staged_files} && git add {staged_files}

pre-push:
  parallel: true
  commands:
    tsc:
      tags: [ui, typecheck]
      run: npx tsc --noEmit

commit-msg:
  commands:
    conventional-commits:
      run: |
        set -euo pipefail
        file="${1:-}"
        [ -z "$file" ] && file="$(git rev-parse --git-path COMMIT_EDITMSG 2>/dev/null || true)"
        [ -f "$file" ] || exit 0

        first_line="$(head -n1 "$file" | tr -d '\r')"
        # Allow merge/revert
        echo "$first_line" | grep -Eq '^(Merge|Revert)\b' && exit 0
        
        # CC Regex
        cc_re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|security)(\([A-Za-z0-9._/-]+\))?(!)?: .+'
        if ! echo "$first_line" | grep -Eq "$cc_re"; then
          echo "ERROR: Invalid commit message format (Conventional Commits required)."
          echo "Format: <type>(<scope>)!: <subject>"
          exit 1
        fi
