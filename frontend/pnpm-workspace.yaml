# pnpm workspace + build allowlist.
#
# `allowBuilds` is a pnpm 11.x security feature — packages with native
# postinstall scripts are blocked by default until the operator opts in.
# All four below were already in the dep tree under npm and worked
# without issue. Keeping them enabled preserves prior behaviour:
#   - @bufbuild/buf:  the buf CLI binary used by `pnpm run generate`
#   - msw:            transitive (mock service worker; not used directly)
#   - sharp:          Next.js image optimization native bindings
#   - unrs-resolver:  module resolver native bindings
allowBuilds:
  '@bufbuild/buf': true
  msw: true
  sharp: true
  unrs-resolver: true
# Security bumps for transitive deps flagged HIGH by Trivy (the CI security
# gate). pnpm 11 reads overrides from HERE, not package.json's `pnpm` field.
#   - postcss  < 8.5.18: CVE-2026-45623 + GHSA-r28c-9q8g-f849 (path traversal
#                        via sourceMappingURL).
#   - sharp    < 0.35.0: GHSA-f88m-g3jw-g9cj (inherited libvips CVEs).
#   - brace-expansion 5.0.x < 5.0.8: CVE-2026-14257 (ReDoS). Scoped to the 5.x
#     line with `@5` so the already-patched 1.x consumers stay on 1.x.
overrides:
  postcss: ^8.5.23
  sharp: ^0.35.0
  brace-expansion@5: ^5.0.8
# pnpm 11 holds back any release younger than `minimumReleaseAge`
# (24h by default) as a supply-chain cooling window. `pnpm update` warns
# ("was updated to X, not Y…") for every dep still inside that window and
# suggests an `overrides` entry — do NOT take that suggestion: an override
# is a permanent hard pin and belongs to the CVE block above. List the
# exact version here instead to opt a single release in early.
#
# Entries are transient by design: once a version clears 24h the exclude
# is dead weight — prune it on the next dep bump.
#
#   - prettier 3.9.8: formatting only, and `pnpm install` during the bump
#     would otherwise resolve back to 3.9.6 and undo it.
minimumReleaseAgeExclude:
  - prettier@3.9.8
