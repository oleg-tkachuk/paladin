# Paladin E2E test stack — Playwright suite runtime.
#
# Spec: specs/001-frontend-playwright-e2e/data-model.md §"Entity:
# Test Stack". SIX services: postgres, migrate, bootstrap, api,
# admin, ui. The worker / mcp / ingest / dispatcher planes are
# deliberately ABSENT — the Playwright tests never exercise
# background jobs (R-006).
#
# Storage backend: SeaweedFS, brought up IN THIS FILE. The stack has
# no external prerequisite beyond Docker and the two locally
# built images — `git clone && pnpm run test:e2e` works, which is
# the whole point of a suite other people are meant to run.
#
# It did not always: storage used to be a Garage instance shared
# from a private infrastructure repo, reached via
# `kubectl port-forward`, with its credentials pulled out of a
# Kubernetes Secret by hand. That made the suite unrunnable for
# anyone without that cluster, and made CI a THIRD configuration
# (the workflow started its own MinIO on the runner host and
# pointed the stack at the docker0 gateway) — so local, CI and
# the documented path all differed. One storage service, declared
# here, collapses the three into one. It was MinIO until
# 2026-09-28; see the service below for why it is not any more.
#
# An external S3 endpoint is still supported: set every
# PALADIN_E2E_S3_* var below and the in-compose SeaweedFS is
# bypassed (it still starts; ignore it, or `--scale seaweedfs=0`).
#
# Bring up:
#   docker compose -p paladin-e2e \
#       -f frontend/tests/e2e/docker-compose.test.yaml up --wait
# Tear down (removes the tmpfs Postgres volume):
#   docker compose -p paladin-e2e \
#       -f frontend/tests/e2e/docker-compose.test.yaml down -v
#
# TWO STACKS AT ONCE. Every published host port is an override with today's
# value as its default, so a second instance needs a different `-p` AND a
# different port set:
#
#   PALADIN_E2E_PORT_UI=13000 PALADIN_E2E_PORT_DATA=18080 \
#   PALADIN_E2E_PORT_IAM=18085 PALADIN_E2E_PORT_ADMIN=18090 \
#   PALADIN_E2E_PORT_S3=19000 PALADIN_E2E_PORT_PG=15434 \
#     docker compose -p paladin-alt -f … up --wait
#
# Point the suites at it with the PALADIN_E2E_*_URL vars they already read
# (playwright.config.ts, tests/e2e/fixtures/seed.ts). The presign host follows
# PALADIN_E2E_PORT_S3 automatically — it has to, because SigV4 covers the Host
# header and a URL signed for :9000 fails against :19000.
#
# There used to be a `container_name:` on every service, which made all of the
# above impossible: a second project got its own network and volumes and then
# collided on the first container name Docker already held, whatever ports it
# was given. Nothing outside this file ever referenced those names — the
# services address each other by SERVICE name over the compose network, which
# is project-scoped and unaffected.
#
# All env overrides use the PALADIN_ prefix + underscore→dot
# translation (see backend/internal/config/config.go). The base
# config file mounted into every backend container is the same
# backend/configs/compose.yaml used by the dev-loop stack —
# keeping one source of truth for everything that ISN'T
# e2e-specific.
#
# Credentials are dev-only and committed (per Clarification Q4 +
# Constitution Principle V). The NEVER-in-prod marker lives both
# here and in fixtures/credentials.ts. They are also listed in
# the backend's weak-secret deny-list
# (backend/internal/config/weak_secrets.go), so a real deployment
# that inherits one refuses to boot rather than running on a
# credential published in this repository.

x-paladin-base: &paladin-base
  image: registry.local/paladin/paladin-core:${PALADIN_CORE_TAG:-latest}
  volumes:
    - ../../../backend/configs:/app/configs:ro
  environment:
    # ── bootstrap admin (fixture credential) ─────────────────
    # NEVER true in prod. Mirrors fixtures/credentials.ts.
    PALADIN_BOOTSTRAP_ADMIN_SUBJECT: e2e-admin@local
    PALADIN_BOOTSTRAP_ADMIN_PASSWORD: e2e-not-a-secret-2026
    PALADIN_BOOTSTRAP_ADMIN_MIN_PASSWORD_LENGTH: "16"
    # NB: the login rate-limiter is relaxed for the suite in the baked config
    # file (backend/configs/compose.yaml auth.login_rate_limit_*) — NOT here.
    # koanf's env provider maps PALADIN_FOO_BAR by replacing every "_" with ".",
    # so a multi-word key like login_rate_limit_per_subject_per_minute can't be
    # reached via env; only single-word path segments (storage.backends.…) can.
    # ── M2M tokens ───────────────────────────────────────────
    # Off in backend/configs/compose.yaml, which made the console's
    # /tenants/:id/m2m-tokens page untestable: every RPC behind it answers
    # Unimplemented, so a spec could only assert that the feature is absent.
    # It is a shipped page that mints bearer credentials, so the suite runs
    # with it on. No key is needed — an empty api_token.hmac_key derives one
    # from auth.signing_key (build_api_token.go), which is exactly the
    # single-tenant dev posture this stack already has everywhere else.
    PALADIN_API_TOKEN_ENABLED: "true"
    # ── storage: in-compose SeaweedFS ────────────────────────
    # Two endpoints, and they are NOT interchangeable. The backend
    # signs presigned URLs against public_endpoint, and SigV4 covers
    # the Host header — sign for `seaweedfs:8333` and the browser's PUT
    # to localhost fails the signature check, not the connection.
    #   endpoint        — container DNS, used by the backend itself
    #   public_endpoint — host-reachable, used by the Playwright browser
    PALADIN_STORAGE_BACKENDS_PRIMARY_ENDPOINT: ${PALADIN_E2E_S3_ENDPOINT:-http://seaweedfs:8333}
    PALADIN_STORAGE_BACKENDS_PRIMARY_PUBLIC_ENDPOINT: ${PALADIN_E2E_S3_PUBLIC_ENDPOINT:-http://localhost:${PALADIN_E2E_PORT_S3:-9000}}
    PALADIN_STORAGE_BACKENDS_PRIMARY_BUCKET: ${PALADIN_E2E_S3_BUCKET:-paladin-e2e}
    PALADIN_STORAGE_BACKENDS_PRIMARY_AUTH_ACCESS_KEY: ${PALADIN_E2E_S3_ACCESS_KEY:-paladin-e2e-access}
    PALADIN_STORAGE_BACKENDS_PRIMARY_AUTH_SECRET_KEY: ${PALADIN_E2E_S3_SECRET_KEY:-paladin-e2e-secret-key}
    # ── postgres connection ──────────────────────────────────
    # Runtime connects as paladin_app (no BYPASSRLS) so the suite actually
    # enforces row-level security — see backend/configs/compose.yaml for why
    # that matters. Migrations still run as the owner via migrate_dsn there.
    #
    # The variable used to be PALADIN_DATABASE_DSN, which is not a config path:
    # koanf resolves PALADIN_* against the known key set and there is no
    # `database` block — it is `datastores.postgres.dsn`. So that line had
    # never overridden anything; the value came from the config file all
    # along, and the two agreed by coincidence.
    PALADIN_DATASTORES_POSTGRES_DSN: postgres://paladin_app:paladin_app@postgres:5432/paladin?sslmode=disable

services:
  # S3-compatible storage.
  #
  # SeaweedFS and not MinIO, since 2026-09-28: MinIO has closed every free
  # registry its images were on. Docker Hub 404s both minio/minio and
  # minio/mc, quay.io answers 401 even with a freshly issued anonymous pull
  # token, and ghcr.io/minio/* answers 403. Two of those report as
  # "unauthorized", which reads like a credentials problem and is not one —
  # there is no account to add, so do not re-point this at another MinIO
  # mirror. SeaweedFS already backs backend/deploy/docker-compose.yaml, so the
  # substitution leaves one S3 implementation in the repository, not two.
  #
  # Published on the host as 9000 even though SeaweedFS serves S3 on 8333:
  # PALADIN_E2E_PORT_S3 is what scripts/stack-ports.sh declares and what the
  # presigned PUT is signed for, so the host side of the mapping stays put.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    # Credentials come from -s3.config; SeaweedFS has no env-var equivalent of
    # MINIO_ROOT_USER. A NAMED identity, not SeaweedFS' "anonymous" one, which
    # would grant these actions to unsigned requests — an unsigned GET must
    # stay a 403, or the suite would stop proving that the backend signs.
    command: >-
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    # Objects live for one run, same as the Postgres below: a suite that
    # inherits state from the previous run passes for the wrong reason.
    tmpfs:
      - /data
    ports:
      # Published because the browser uploads straight to it via a
      # presigned PUT — this is not a debugging convenience, the suite
      # fails without it.
      - "${PALADIN_E2E_PORT_S3:-9000}:8333"

  # One-shot: waits for SeaweedFS and creates the bucket, then exits 0.
  #
  # The same image as the service above rather than a second one. MinIO needed
  # a separate mc image here because its own image carries no shell; the
  # SeaweedFS image has both a shell and the weed binary, so the bucket is
  # created with the tool that already ships.
  seaweedfs-setup:
    image: chrislusf/seaweedfs:4.47
    restart: "no"
    environment:
      S3_BUCKET: ${PALADIN_E2E_S3_BUCKET:-paladin-e2e}
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `weed shell` round-trips to the master, so it doubles as the readiness
      # probe. Bounded and loud: an unbounded wait turns "SeaweedFS never came
      # up" into a job that hangs until the 30-minute timeout.
      - |
        set -eu
        ready=""
        for i in $$(seq 1 60); do
          if echo "s3.bucket.create -name $$S3_BUCKET" \
              | weed shell -master seaweedfs:9333 >/dev/null 2>&1; then
            ready=1
            echo "bucket $$S3_BUCKET ready after $${i}s"
            break
          fi
          sleep 1
        done
        if [ -z "$$ready" ]; then
          echo "SeaweedFS did not create the bucket within 60s" >&2
          exit 1
        fi
    depends_on:
      seaweedfs:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: paladin
      POSTGRES_USER: paladin
      # dev-only credentials — e2e compose only, NEVER reused outside it.
      POSTGRES_PASSWORD: paladin
    # Postgres on tmpfs: every test run starts from zero. The
    # shared-DB-with-UUID-suffixed-fixtures isolation strategy
    # (R-003) lives ABOVE this layer — the entire DB is fresh
    # on every `compose up`, and tests collide-resist within
    # the run via uniqueSlug() helpers.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paladin -d paladin"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      # Exposed for ad-hoc debugging from the host. Bind to a
      # non-default port to avoid colliding with the dev-loop
      # compose's 5433 OR a host postgres on 5432.
      - "${PALADIN_E2E_PORT_PG:-5434}:5432"

  # One-shot: runs SQL migrations and exits 0. Subsequent
  # services gate on `service_completed_successfully` so they
  # never see a half-migrated schema.
  migrate:
    <<: *paladin-base
    restart: "no"
    command: ["migrate", "--config", "/app/configs/compose.yaml"]
    environment:
      # The owner, for this service only. `paladin migrate` opens the runtime
      # pool before it touches migrate_dsn, and paladin_app cannot log in until
      # 002 has created it and promote-app-role has given it a password — so
      # pointing the runtime DSN at the restricted role here is a deadlock,
      # not a tightening.
      PALADIN_DATASTORES_POSTGRES_DSN: postgres://paladin:paladin@postgres:5432/paladin?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: gives paladin_app a way to log in.
  #
  # 002 creates the role NOLOGIN — production provisions its credential out of
  # band — so something has to bridge that here. The integration harness does
  # the same thing (pgharness.promoteAppRole); this is the compose equivalent,
  # and it is what lets every service below connect as the restricted role
  # instead of as the owner. Running as the owner is why this stack enforced
  # no RLS policy at all, and why an RLS migration could pass the whole suite
  # and then refuse every login on the cluster.
  promote-app-role:
    image: postgres:16
    restart: "no"
    environment:
      PGPASSWORD: paladin
    # dev-only credential, same class as everything else in this file.
    command:
      - psql
      - -h
      - postgres
      - -U
      - paladin
      - -d
      - paladin
      - -v
      - ON_ERROR_STOP=1
      - -c
      - ALTER ROLE paladin_app WITH LOGIN PASSWORD 'paladin_app';
    depends_on:
      migrate:
        condition: service_completed_successfully

  # One-shot: provisions the platform admin user (subject =
  # e2e-admin@local, password = e2e-not-a-secret-2026 from env
  # vars). Idempotent — safe to re-run.
  bootstrap:
    <<: *paladin-base
    restart: "no"
    command: ["bootstrap", "--config", "/app/configs/compose.yaml"]
    depends_on:
      promote-app-role:
        condition: service_completed_successfully

  api:
    <<: *paladin-base
    init: true
    restart: on-failure
    command: ["serve", "api", "--config", "/app/configs/compose.yaml"]
    ports:
      - "${PALADIN_E2E_PORT_DATA:-8083}:8080"  # data
      - "${PALADIN_E2E_PORT_IAM:-8085}:8085"  # iam
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      # Gate on the bucket, not on SeaweedFS being up: the backend's first
      # write fails just as hard against a live server with no bucket.
      seaweedfs-setup:
        condition: service_completed_successfully
    # NOTE: the Paladin backend image is distroless (no shell / wget), so a
    # CMD-SHELL HTTP probe can't run in-container. The plane is ready
    # within ~1s of "plane listening"; downstream services gate on
    # service_started and the suite's own readiness waits cover the gap.
    # /readyz is verified from the host instead (see run instructions).

  admin:
    <<: *paladin-base
    init: true
    restart: on-failure
    command: ["serve", "admin", "--config", "/app/configs/compose.yaml"]
    ports:
      - "${PALADIN_E2E_PORT_ADMIN:-8090}:8090"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # Distroless image — no in-container HTTP probe possible (see api).

  ui:
    # Reuse the locally-built UI image; the dev-loop pipeline
    # rebuilds `:latest` in place on every code change, so the
    # test stack always picks up the operator's WIP.
    image: registry.local/paladin/paladin-console:${PALADIN_CONSOLE_TAG:-latest}
    init: true
    restart: on-failure
    environment:
      # BFF reaches the planes via container DNS. The browser
      # only ever talks to the BFF on :3000. Var names MUST match
      # what the BFF reads (src/lib/auth/bff.ts + api/rpc route):
      # PALADIN_DATA_URL / PALADIN_IAM_URL / PALADIN_ADMIN_URL.
      PALADIN_DATA_URL: http://api:8080
      PALADIN_IAM_URL: http://api:8085
      PALADIN_ADMIN_URL: http://admin:8090
      # `next start` (production-mode bundle) per
      # Clarification Q3. NOT `next dev` — HMR is a documented
      # flake source for E2E suites.
      NODE_ENV: production
    ports:
      - "${PALADIN_E2E_PORT_UI:-3000}:3000"
    depends_on:
      # api/admin are distroless and carry no healthcheck (see above),
      # so gate on service_started; the ui's own healthcheck + the
      # suite's readiness waits absorb the sub-second startup gap.
      api:
        condition: service_started
      admin:
        condition: service_started
    healthcheck:
      # 127.0.0.1 (not localhost): the distroless wget resolves localhost to
      # ::1 first, but Next binds 0.0.0.0 (IPv4 only) → false "unhealthy".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
