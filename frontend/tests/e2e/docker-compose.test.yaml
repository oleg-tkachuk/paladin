# PALADIN E2E test stack — Playwright suite runtime.
#
# Spec: specs/001-frontend-playwright-e2e/data-model.md §"Entity:
# Test Stack". SIX services: postgres, migrate, bootstrap, api,
# admin, ui. The worker / mcp / ingest / dispatcher planes are
# deliberately ABSENT — the Playwright tests never exercise
# background jobs (R-006).
#
# Storage backend: MinIO, brought up IN THIS FILE. The stack has
# no external prerequisite beyond Docker and the two locally
# built images — `git clone && pnpm run test:e2e` works, which is
# the whole point of a suite other people are meant to run.
#
# It did not always: storage used to be a Garage instance shared
# from a private infrastructure repo, reached via
# `kubectl port-forward`, with its credentials pulled out of a
# Kubernetes Secret by hand. That made the suite unrunnable for
# anyone without that cluster, and made CI a THIRD configuration
# (the workflow started its own MinIO on the runner host and
# pointed the stack at the docker0 gateway) — so local, CI and
# the documented path all differed. One MinIO, declared here,
# collapses the three into one.
#
# An external S3 endpoint is still supported: set every
# PALADIN_E2E_S3_* var below and the in-compose MinIO is bypassed
# (it still starts; ignore it, or `--scale minio=0`).
#
# Bring up:
#   docker compose -p paladin-e2e \
#       -f frontend/tests/e2e/docker-compose.test.yaml up --wait
# Tear down (removes the tmpfs Postgres volume):
#   docker compose -p paladin-e2e \
#       -f frontend/tests/e2e/docker-compose.test.yaml down -v
#
# All env overrides use the PALADIN_ prefix + underscore→dot
# translation (see backend/internal/config/config.go). The base
# config file mounted into every backend container is the same
# backend/configs/compose.yaml used by the dev-loop stack —
# keeping one source of truth for everything that ISN'T
# e2e-specific.
#
# Credentials are dev-only and committed (per Clarification Q4 +
# Constitution Principle V). The NEVER-in-prod marker lives both
# here and in fixtures/credentials.ts. They are also listed in
# the backend's weak-secret deny-list
# (backend/internal/config/weak_secrets.go), so a real deployment
# that inherits one refuses to boot rather than running on a
# credential published in this repository.

x-paladin-base: &paladin-base
  image: registry.local/paladin/paladin-core:latest
  volumes:
    - ../../../backend/configs:/app/configs:ro
  environment:
    # ── bootstrap admin (fixture credential) ─────────────────
    # NEVER true in prod. Mirrors fixtures/credentials.ts.
    PALADIN_BOOTSTRAP_ADMIN_SUBJECT: e2e-admin@local
    PALADIN_BOOTSTRAP_ADMIN_PASSWORD: e2e-not-a-secret-2026
    PALADIN_BOOTSTRAP_ADMIN_MIN_PASSWORD_LENGTH: "16"
    # NB: the login rate-limiter is relaxed for the suite in the baked config
    # file (backend/configs/compose.yaml auth.login_rate_limit_*) — NOT here.
    # koanf's env provider maps PALADIN_FOO_BAR by replacing every "_" with ".",
    # so a multi-word key like login_rate_limit_per_subject_per_minute can't be
    # reached via env; only single-word path segments (storage.backends.…) can.
    # ── storage: in-compose MinIO ────────────────────────────
    # Two endpoints, and they are NOT interchangeable. The backend
    # signs presigned URLs against public_endpoint, and SigV4 covers
    # the Host header — sign for `minio:9000` and the browser's PUT
    # to localhost fails the signature check, not the connection.
    #   endpoint        — container DNS, used by the backend itself
    #   public_endpoint — host-reachable, used by the Playwright browser
    PALADIN_STORAGE_BACKENDS_PRIMARY_ENDPOINT: ${PALADIN_E2E_S3_ENDPOINT:-http://minio:9000}
    PALADIN_STORAGE_BACKENDS_PRIMARY_PUBLIC_ENDPOINT: ${PALADIN_E2E_S3_PUBLIC_ENDPOINT:-http://localhost:9000}
    PALADIN_STORAGE_BACKENDS_PRIMARY_BUCKET: ${PALADIN_E2E_S3_BUCKET:-paladin-e2e}
    PALADIN_STORAGE_BACKENDS_PRIMARY_AUTH_ACCESS_KEY: ${PALADIN_E2E_S3_ACCESS_KEY:-paladin-e2e-access}
    PALADIN_STORAGE_BACKENDS_PRIMARY_AUTH_SECRET_KEY: ${PALADIN_E2E_S3_SECRET_KEY:-paladin-e2e-secret-key}
    # ── postgres connection ──────────────────────────────────
    PALADIN_DATABASE_DSN: postgres://paladin:paladin@postgres:5432/paladin?sslmode=disable

services:
  # S3-compatible storage. Pinned to the same MinIO release the CI
  # workflow used when it started MinIO itself, so moving it in here
  # changed the topology and nothing else.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: paladin-e2e-minio
    command: ["server", "/data"]
    environment:
      # dev-only credentials — e2e compose only, NEVER reused outside it.
      MINIO_ROOT_USER: ${PALADIN_E2E_S3_ACCESS_KEY:-paladin-e2e-access}
      MINIO_ROOT_PASSWORD: ${PALADIN_E2E_S3_SECRET_KEY:-paladin-e2e-secret-key}
    # Objects live for one run, same as the Postgres above: a suite that
    # inherits state from the previous run passes for the wrong reason.
    tmpfs:
      - /data
    ports:
      # Published because the browser uploads straight to it via a
      # presigned PUT — this is not a debugging convenience, the suite
      # fails without it.
      - "9000:9000"

  # One-shot: waits for MinIO and creates the bucket, then exits 0.
  #
  # A healthcheck on the minio service would be the obvious alternative,
  # but the MinIO image carries neither curl nor wget, so there is
  # nothing to probe /minio/health/live WITH from inside it. mc is a
  # separate image that has both the client and a shell.
  minio-setup:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: paladin-e2e-minio-setup
    restart: "no"
    environment:
      S3_ACCESS_KEY: ${PALADIN_E2E_S3_ACCESS_KEY:-paladin-e2e-access}
      S3_SECRET_KEY: ${PALADIN_E2E_S3_SECRET_KEY:-paladin-e2e-secret-key}
      S3_BUCKET: ${PALADIN_E2E_S3_BUCKET:-paladin-e2e}
    entrypoint: ["/bin/sh", "-c"]
    command:
      # `mc alias set` round-trips to the server, so it doubles as the
      # readiness probe. Bounded and loud: an unbounded wait turns "MinIO
      # never came up" into a job that hangs until the 30-minute timeout.
      - |
        set -eu
        ready=""
        for i in $$(seq 1 60); do
          if mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" >/dev/null 2>&1; then
            ready=1
            echo "MinIO ready after $${i}s"
            break
          fi
          sleep 1
        done
        if [ -z "$$ready" ]; then
          echo "MinIO did not accept connections within 60s" >&2
          exit 1
        fi
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready"
    depends_on:
      minio:
        condition: service_started

  postgres:
    image: postgres:16
    container_name: paladin-e2e-postgres
    environment:
      POSTGRES_DB: paladin
      POSTGRES_USER: paladin
      # dev-only credentials — e2e compose only, NEVER reused outside it.
      POSTGRES_PASSWORD: paladin
    # Postgres on tmpfs: every test run starts from zero. The
    # shared-DB-with-UUID-suffixed-fixtures isolation strategy
    # (R-003) lives ABOVE this layer — the entire DB is fresh
    # on every `compose up`, and tests collide-resist within
    # the run via uniqueSlug() helpers.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paladin -d paladin"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      # Exposed for ad-hoc debugging from the host. Bind to a
      # non-default port to avoid colliding with the dev-loop
      # compose's 5433 OR a host postgres on 5432.
      - "5434:5432"

  # One-shot: runs SQL migrations and exits 0. Subsequent
  # services gate on `service_completed_successfully` so they
  # never see a half-migrated schema.
  migrate:
    <<: *paladin-base
    container_name: paladin-e2e-migrate
    restart: "no"
    command: ["migrate", "--config", "/app/configs/compose.yaml"]
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: provisions the platform admin user (subject =
  # e2e-admin@local, password = e2e-not-a-secret-2026 from env
  # vars). Idempotent — safe to re-run.
  bootstrap:
    <<: *paladin-base
    container_name: paladin-e2e-bootstrap
    restart: "no"
    command: ["bootstrap", "--config", "/app/configs/compose.yaml"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    <<: *paladin-base
    container_name: paladin-e2e-api
    init: true
    restart: on-failure
    command: ["serve", "api", "--config", "/app/configs/compose.yaml"]
    ports:
      - "8080:8080"  # data
      - "8085:8085"  # iam
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      # Gate on the bucket, not on MinIO being up: the backend's first
      # write fails just as hard against a live server with no bucket.
      minio-setup:
        condition: service_completed_successfully
    # NOTE: the PALADIN backend image is distroless (no shell / wget), so a
    # CMD-SHELL HTTP probe can't run in-container. The plane is ready
    # within ~1s of "plane listening"; downstream services gate on
    # service_started and the suite's own readiness waits cover the gap.
    # /readyz is verified from the host instead (see run instructions).

  admin:
    <<: *paladin-base
    container_name: paladin-e2e-admin
    init: true
    restart: on-failure
    command: ["serve", "admin", "--config", "/app/configs/compose.yaml"]
    ports:
      - "8090:8090"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    # Distroless image — no in-container HTTP probe possible (see api).

  ui:
    # Reuse the locally-built UI image; the dev-loop pipeline
    # rebuilds `:latest` in place on every code change, so the
    # test stack always picks up the operator's WIP.
    image: registry.local/paladin/paladin-console:latest
    container_name: paladin-e2e-ui
    init: true
    restart: on-failure
    environment:
      # BFF reaches the planes via container DNS. The browser
      # only ever talks to the BFF on :3000. Var names MUST match
      # what the BFF reads (src/lib/auth/bff.ts + api/rpc route):
      # PALADIN_DATA_URL / PALADIN_IAM_URL / PALADIN_ADMIN_URL.
      PALADIN_DATA_URL: http://api:8080
      PALADIN_IAM_URL: http://api:8085
      PALADIN_ADMIN_URL: http://admin:8090
      # `next start` (production-mode bundle) per
      # Clarification Q3. NOT `next dev` — HMR is a documented
      # flake source for E2E suites.
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      # api/admin are distroless and carry no healthcheck (see above),
      # so gate on service_started; the ui's own healthcheck + the
      # suite's readiness waits absorb the sub-second startup gap.
      api:
        condition: service_started
      admin:
        condition: service_started
    healthcheck:
      # 127.0.0.1 (not localhost): the distroless wget resolves localhost to
      # ::1 first, but Next binds 0.0.0.0 (IPv4 only) → false "unhealthy".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
