# Garage minimal config for the PALADIN E2E test stack.
#
# Single-node, in-container, ephemeral storage. The
# `--single-node --default-bucket` flags on the command line
# together with the GARAGE_DEFAULT_* env vars handle the
# initial bucket + access-key bootstrap; this file just
# satisfies Garage's "config file MUST exist" contract.

metadata_dir = "/tmp/garage/meta"
data_dir = "/tmp/garage/data"

# Required: 32-byte hex value used for inter-node RPC auth.
# Single-node mode never uses it, but the parser still
# validates the format. Generated via `openssl rand -hex 32`
# — recommitted intentionally; this is a dev-only secret.
rpc_secret = "8f3a2d1c7e5b9046f1cba73d4e8f06ab5c7d9e1f2a3b4c5d6e7f80910a1b2c3d"
rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

replication_factor = 1

[s3_api]
api_bind_addr = "0.0.0.0:3900"
s3_region = "garage"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "0.0.0.0:3902"
admin_token = "e2e-garage-admin"
