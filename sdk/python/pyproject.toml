[project]
name = "paladin-sdk"
# The SDK's version is its sdk/python/vX.Y.Z tag, which the release workflow
# cuts from the commits touching sdk/python/, proto/ or sdk/testdata/;
# hatch-vcs reads it at build time.
dynamic = ["version"]
description = "Python client for the Paladin API: generated Connect stubs, sessions, and workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    # Pre-1.0: a minor may change the API the generated clients call, so the
    # range stops at the next one. CI tests the floor. connect-python's
    # successor (connect-py); its stubs target google.protobuf through the
    # generator's protobuf=google option, so consumers keep those messages.
    "connectrpc>=0.13,<0.14",
    # connectrpc's own Protobuf runtime, which errors.py imports as well.
    # connectrpc 0.13 is the first to import under 0.7, which moved the
    # well-known types (connectrpc/connect-py#423). Pre-1.0: the range stops
    # at the next minor.
    "protobuf-py>=0.7,<0.8",
    # The HTTP client under the generated clients, and under Transfer and the
    # relay transports, which this package builds directly — not only through
    # connectrpc, whose own floor (0.5.1) predates what is used here.
    # Pre-1.0: the range stops at the next minor.
    "pyqwest>=0.12,<0.13",
    # Both majors: workers that share an image with protobuf-6 libraries
    # (grpcio-tools, hatchet-sdk) can install the SDK. The floor is the gencode
    # version of the protoc in grpcio-tools below, and the one
    # googleapis-common-protos needs; CI runs the tests on 6.x and 7.x.
    "protobuf>=6.33.5,<8",
    # google.api and google.rpc, which the contract imports.
    "googleapis-common-protos>=1.75.5,<2",
]

[project.optional-dependencies]
# Verifies downloads whose recorded checksum is CRC32C; without it they are
# not verified. Google's own implementation: the standard library has none.
crc32c = ["google-crc32c>=1.9.0,<2"]
# The connections under TLS(...): ssl under httpcore, HTTP/2 by h2, asyncio by
# anyio, because pyqwest has no hook to verify a server's SPIFFE ID or set a
# protocol floor (paladin._tls_http); cryptography reads the server's
# certificate as an X.509-SVID and hands verify_peer one it can read. An extra
# because most callers reach the planes in plaintext inside a mesh, or over
# pyqwest's own TLS, and should not install an HTTP stack they never use.
tls = ["httpcore[http2,asyncio]>=1.0.9,<2", "cryptography>=41"]
# Signs DPoP proofs for key-bound capabilities (paladin.dpop). Its own extra:
# a caller binding capabilities to a key need not install the TLS stack.
dpop = ["cryptography>=41"]
# Validates every request paladin.testing.FakePaladin serves with the
# contract's own rules, as the server does. Its own extra: it is a native
# library that only tests need.
testing = ["protovalidate>=2.0.0,<3"]
# Narrows a capability's Biscuit form offline (paladin.attenuate). Pre-1.0: a
# minor may change the API, so the range stops at the next one.
biscuit = ["biscuit-python>=0.4.0,<0.5"]

[dependency-groups]
dev = [
    "opentelemetry-sdk==1.45.2",
    # RPC spans through Client(interceptors=...), which the README documents.
    "connectrpc-otel==0.3.0",
    "cryptography==50.0.2",
    # The testing extra, which FakePaladin needs.
    "protovalidate==2.1.0",
    # The tls extra, which the TLS tests exercise.
    "httpcore[http2,asyncio]==1.0.9",
    "google-crc32c==1.9.0",
    # No wheel for CPython 3.14 yet, and its source build needs Rust; there the
    # attenuation tests skip.
    "biscuit-python==0.4.0; python_version < '3.14'",
    # Deliberately not the latest: its protoc's version is the oldest protobuf
    # runtime the stubs accept (ValidateProtobufRuntimeVersion), so it is the
    # newest release still generating for protobuf 6. A newer one would lock
    # out every protobuf-6 environment.
    "grpcio-tools==1.81.1",
    "protoc-gen-connectrpc==0.13.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling==1.33.0", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# The repository root, where the tags are; only this SDK's tags count.
root = "../.."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "sdk/python/v*"]
tag_regex = "^sdk/python/v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
# Without git, a source archive of the repository (a GitHub tarball of a tag)
# reads the version from .git_archival.txt at the root, which git archive
# fills in. With neither the tags nor that file — a shallow clone, a copied
# tree — the version says it is unknown rather than posing as a release.
fallback_version = "0.0.0+unknown"

[tool.hatch.build.targets.wheel]
# buf/ holds the generated buf.validate module: the contract's descriptors
# depend on it, and no PyPI package ships it for this protobuf runtime.
packages = ["src/paladin", "src/buf"]

[tool.ruff]
line-length = 100
extend-exclude = [
    "src/buf",
    "src/paladin/admin",
    "src/paladin/common",
    "src/paladin/data",
    "src/paladin/iam",
    # Generated by scripts/gen_facade.py; tests/test_facade.py compares it
    # byte for byte with the generator's output.
    "src/paladin/facade.py",
]

[tool.ruff.lint]
# On top of ruff's defaults: naive datetimes (DTZ), since expiries and
# timestamps cross the wire, and blind excepts (BLE). The code's noqa comments
# name these rules; left unselected, the suppressions are dead and ruff
# reports them as unused (RUF100).
extend-select = ["DTZ", "BLE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
