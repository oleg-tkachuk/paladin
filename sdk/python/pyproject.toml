[project]
name = "paladin-sdk"
# The SDK's version is its sdk/go/vX.Y.Z tag, which the release workflow cuts
# from the commits touching sdk/ or proto/; hatch-vcs reads it at build time.
dynamic = ["version"]
description = "Python client for the Paladin API: generated Connect stubs, sessions, and workflows."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # Pinned exactly: pre-1.0, and the generated clients are written against
    # this version's API.
    "connect-python==0.9.0",
    # Generated with the protoc bundled in grpcio-tools below; the runtime must
    # be at least that protoc's Python version.
    "protobuf>=7.35.1",
    # google.api and google.rpc, which the contract imports.
    "googleapis-common-protos>=1.75.5",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
    "protoc-gen-connect-python==0.9.0",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["hatchling==1.32.4", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# The repository root, where the tags are; only this SDK's tags count.
root = "../.."
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "sdk/go/v*"]
tag_regex = "^sdk/go/v(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"
# A checkout without the tags — a shallow CI clone — builds as 0.0.0.
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
# buf/ holds the generated buf.validate module: the contract's descriptors
# depend on it, and no PyPI package ships it for this protobuf runtime.
packages = ["src/paladin", "src/buf"]

[tool.ruff]
line-length = 100
extend-exclude = [
    "src/buf",
    "src/paladin/admin",
    "src/paladin/common",
    "src/paladin/data",
    "src/paladin/iam",
    # Generated by scripts/gen_facade.py; tests/test_facade.py compares it
    # byte for byte with the generator's output.
    "src/paladin/facade.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
